[project]
name = "localharness"
version = "0.1.0"
description = "Local LLM serving + evaluation harness"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-lm>=0.32.0; sys_platform == 'darwin'",
    "httpx>=0.27",
    "pyyaml>=6",
    "pillow>=10",
    "jiwer>=4.0.0",
    "num2words>=0.5.14",
    "pyobjc-framework-vision>=12.2.2; sys_platform == 'darwin'",
    # The same lane's Windows implementation. Both ship with their OS; this is
    # only the binding to it. See harness/checks/ocr.py.
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
    # The same lane on Linux, which ships no OCR engine of its own. An ONNX
    # detector plus recogniser, CPU, no torch. Measured against Apple's Vision
    # on this project's own text-render images: 18/18 either way, where
    # tesseract managed 6. See harness/checks/ocr.py.
    "rapidocr-onnxruntime>=1.4.4; sys_platform == 'linux'",
    "vtracer>=0.6.15",
    "jsonschema>=4",
]

[project.scripts]
soh = "harness.cli:main"
lh = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "evals"]

[dependency-groups]
# The cluster store. A separate group because a laptop running `lh` needs no
# database driver at all, and #148 requires the single-machine path to keep
# working with no cluster.
cluster = [
    "psycopg[binary]>=3.2",
]

# Prompt-adherence scoring. A separate group because it is the only torch in an
# otherwise MLX-only repo, and only an image eval needs it:
#   uv run --group metrics python -m evals.run --modality image ...
# 687MB installed on macOS arm64, 36 packages, MPS-capable.
metrics = [
    "torch>=2.4",
    "transformers>=4.44",
    "open_clip_torch>=2.24",
    "resemblyzer>=0.1.4",
    "setuptools>=70,<81",
]

# The multilingual ear. A separate group because mlx-whisper requires torch
# UNCONDITIONALLY -- not as an extra -- which puts 528MB into an otherwise
# MLX-only install for a scoring instrument the CLI never calls. `lh hear` uses
# the audio server; only the eval suite reaches for whisper:
#   uv run --group whisper python -m evals.run --modality stt \
#     --candidates 'stt:mlx-community/whisper-large-v3-mlx,backend=whisper,language=fr'
# harness.audio imports it lazily, so the fast tests pass without this group.
whisper = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin'",
]

dev = [
    "pytest>=8",
    # Coverage is REPORTED, never gated: there is no baseline here, so a
    # threshold would start red, and the number is blind to whether a line that
    # ran was actually asserted about. `make coverage` prints the repo figure;
    # `harness.covdiff` prints the one that matters on a change.
    "pytest-cov>=5",
    "respx>=0.21",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
mcp = [
    "mcp>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is deselected by default: these load a 4GB model and take minutes,
# which is not what `make check` is for. `make check-slow` runs them.
# -rs: a silently skipped test reports green for something it never checked.
addopts = "-q --strict-markers -rs -m 'not slow and not network and not postgres and not litellm'"
markers = [
    "slow: needs the optional `metrics` group and loads a multi-GB model",
    # Kept apart from `slow` deliberately. They are excluded for opposite
    # reasons: `slow` costs minutes and gigabytes, `network` is cheap and
    # depends on somebody else's uptime. A lint that fails when a registry has
    # a bad afternoon teaches people to skip lint.
    "network: asks a third party whether something it publishes is still there",
    # Needs a database, not a third party. Kept apart from `network` because
    # they fail for different reasons and are fixed in different places.
    "postgres: needs a live Postgres; `make test-postgres` starts one",
    "litellm: runs a real LiteLLM proxy against a fake upstream; `make test-litellm`",
]
# The repo root, so `from evals...` resolves without a sys.path hack in every
# test module.
pythonpath = ["."]
