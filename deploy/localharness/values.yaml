# Defaults are the SAFE profile: no GPU, nothing claiming a driver, nothing
# scheduled onto hardware that may not exist. A profile turns capability on.

image:
  repository: localharness
  # Pinned, never `latest`: a CronJob that pulls a moving tag runs a different
  # program every week and reports the difference as a discovery. Asserted.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# The discovery store. Postgres, decided 2026-09-13: the fan-out writes from
# several pods, and SQLite's locking depends on the filesystem honouring it,
# which is exactly what a ReadWriteMany claim does not promise.
#
# `lh` on a laptop keeps its SQLite path with no cluster at all. That is a
# requirement of the issue, not an accident.
postgres:
  enabled: true
  host: ""            # empty means the in-chart service
  database: discovery
  user: discovery
  # Empty means "the conventional name", which the templates COMPUTE from the
  # chart name. It was briefly a literal `localharness-postgres` here, and a
  # literal does not follow nameOverride: `--set nameOverride=other` left the
  # gh-token reference tracking the new name while this one stayed frozen, so
  # the pods asked for a Secret nobody would create.
  existingSecret: ""
  dev:
    # An in-chart Postgres for a laptop cluster. Never for a real one.
    enabled: false
    storage: 2Gi
    # Only ever read when dev is on, and the chart refuses to render dev beside
    # a GPU profile. A real cluster sets postgres.existingSecret instead, and
    # then no Secret is rendered from here at all.
    password: "discovery-local-only"


jobs:
  # How long a finished run's Job sticks around. The Jobs are named per release
  # revision, so they accumulate otherwise -- and the RECORD of what ran lives
  # in the store, not in the cluster, so there is nothing here to lose. A day
  # is long enough to read the logs after a failure.
  ttlSecondsAfterFinished: 86400

sweep:
  enabled: true
  # WEEKLY, and that is not a taste. github.TTL_BY_ENDPOINT_HOURS["/starred"]
  # is 48h, so a sweep more often than that re-reads its own cache and reports
  # success without looking (#77). The test asserts this schedule stays above
  # the TTL, because two numbers in two languages drift.
  schedule: "0 4 * * 0"
  suspend: false

inspect:
  enabled: true
  # The fan-out. No model, no gateway: clone, read, ask the registry for sizes.
  parallelism: 4
  completions: 4
  backoffLimit: 2

judge:
  # A small text model through the gateway. NOT in-cluster on a laptop: an 8 GB
  # Docker VM would give most of itself to a resident judge, and models belong
  # outside the scheduler anyway. So the pod holds the tier and a machine
  # outside the cluster does the arithmetic, which is why this tier reports
  # `where: host` rather than in-pod.
  enabled: false
  # REQUIRED when enabled, and the chart refuses to render without it: a pod
  # pointing at its own localhost finds no gateway there.
  gateway: ""   # http://host.docker.internal:4000 on Docker Desktop
  # The Secret holding the gateway's key under `key`. #482.
  gatewayKeySecret: localharness-gateway
  backoffLimit: 2
  # How many candidates one run scores. The judge is a queue of one, so this is
  # a wall-clock budget rather than a capacity.
  top: 25
  # How many times the control runs before anything is scored. The judge
  # samples and nothing pins a seed, so one run is one draw: the same rubric
  # and model gave gap +4 and then +2 on identical inputs. The tier refuses to
  # score at all unless every run separates.
  controlRuns: 3

measure:
  # WHERE THE WORK EXECUTES, which is three answers and not the GPU boolean
  # below. `gpu.enabled` asks whether this pod has a card; this asks who does
  # the work, and the third answer is the one a boolean cannot hold.
  #
  #   in-pod    the container itself
  #   gpu-node  a node with a card the scheduler can see
  #   host      a machine outside the cluster entirely, which is every Metal
  #             lane: Metal is a macOS userspace API, and the Linux VM behind
  #             Docker Desktop has no /dev/dri and no nvidia device to pass
  #             through. A pod can hold such a lane's identity and ask `lh` on
  #             the host to do the work; the dispatch half of that is not
  #             built, and the chart refuses to render it rather than
  #             pretending. Issue #170.
  #
  # It reaches the receipt as LOCALHARNESS_WHERE, and comparable() refuses to
  # rank two runs across it.
  where: gpu-node
  # Which lane this Job measures.
  lane: image
  # Empty means READ THE WINNER FROM THE RECEIPTS at run time (#148 phase 5).
  # Set it only to pin a specific candidate deliberately -- a value here is a
  # third copy of an answer that already lives in the receipts and in cli.py.
  candidate: ""

gpu:
  # OFF by default. On a machine with no card, a GPU workload is not slow, it
  # is unschedulable and silently Pending.
  enabled: false
  # host      - the driver lives on the machine and must stay there,
  #             because the machine has another operating system with a
  #             prior claim on it
  # operator  - GPU Operator owns the driver, as on a managed node pool
  # Both claiming it is the failure this chart refuses to render.
  driver: host
  nodeSelector: {}
  tolerations: []
  count: 1

resources:
  cheap:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
