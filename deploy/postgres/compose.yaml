# The store's Postgres on this machine, loopback only; soh store pg-up passes the password from the Keychain. #1507
name: sohot-postgres
services:
  postgres:
    image: postgres:16.15-alpine
    container_name: sohot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: discovery
      POSTGRES_DB: discovery
      POSTGRES_PASSWORD: ${SOHOT_PG_PASSWORD:?run through soh store pg-up, which reads the Keychain}
      # Byte order, as SQLite sorts text; a locale collation would put 'best' before 'OmniSVG'.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "127.0.0.1:${SOHOT_PG_PORT:-5433}:5432"
    volumes:
      # A named volume lives on the Docker VM's disk image, on the internal disk, not on shared host files.
      - sohot-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery -d discovery"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  # External: soh store pg-up creates it with com.unxmaal.sohot.keep=true; compose down -v never removes it. #1591.
  sohot-pg:
    name: sohot-pg
    external: true
