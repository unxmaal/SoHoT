name: pages

# Dispatched by `soh report --publish` after it writes machines/<slug>.json on
# the reports branch. Runs from main: a push-triggered run would read this file
# from reports, and the github-pages environment deploys only the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Machine exports from the reports branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin reports:refs/remotes/origin/reports; then
            git archive origin/reports machines | tar -x -C data || true
          else
            echo "no reports branch yet; rendering an empty page"
          fi
          ls -la data/machines 2>/dev/null || mkdir -p data/machines

      - name: Render
        run: python -m harness.publish render --data data/machines --out site

      - name: Privacy scan of every file under site
        run: python -m harness.privacy --files site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
