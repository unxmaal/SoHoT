name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 06:17 UTC: Linux and Windows run on main overnight, after the day's merges. "0 6" started 6-9 h late (#1802).
    - cron: "17 6 * * *"
  workflow_dispatch:
    # gh workflow run check --ref <branch> -f jobs=check-windows -f tests="tests/test_ci_workflow.py tests/test_ci_retry_1440.py::test_every_uv_sync_in_ci_goes_through_the_retry" (#1906).
    inputs:
      jobs:
        description: "all, or a comma list of: check-macos, check-postgres, check-linux, check-windows, mutation, coverage-map"
        type: string
        default: all
      tests:
        description: "Space-separated pytest files or node ids, run in place of the whole suite; blank runs it all"
        type: string
        default: ""

concurrency:
  # A push gets its own group: in a shared one the next merge's run waited for this whole run, check-postgres too (#1802).
  # A dispatch's inputs are in its group, so a narrow dispatch neither waits for nor queues behind another (#1906).
  group: check-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}', inputs.jobs, inputs.tests) || '' }}
  # A main run always finishes, or merges faster than check-macos would leave no main sha green (#1702).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv's default 3 retries span 5 s, too short for a runner DNS blip (#1440); this covers every uv download.
env:
  UV_HTTP_RETRIES: "8"

jobs:
  dispatch-inputs:
    # A misspelt job name would otherwise skip every job and report green (#1906).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          JOBS: ${{ inputs.jobs }}
          TESTS: ${{ inputs.tests }}
          KNOWN: check-macos check-postgres check-linux check-windows mutation coverage-map
        run: |
          set -f
          names="${JOBS//,/ }"
          [ -n "${names// /}" ] || { echo "::error::jobs is blank; 'all' runs every job"; exit 1; }
          for name in $names; do
            case " all $KNOWN " in
              *" $name "*) ;;
              *) echo "::error::unknown job '$name'; one of: all $KNOWN"; exit 1 ;;
            esac
          done
          echo "jobs: $JOBS; tests: ${TESTS:-the whole suite}" | tee -a "$GITHUB_STEP_SUMMARY"

  check-macos:
    if: github.event_name != 'workflow_dispatch' || (inputs.jobs == 'all' || contains(inputs.jobs, 'check-macos'))
    # Apple Silicon, and standard runners are free for public repos. Larger
    # runners are NOT free, so this label must stay standard.
    runs-on: macos-latest
    # harness/ci_budget.MACOS_TIMEOUT_MIN, knob ci_macos_timeout: 1.4x the M1 push job p95 39.3, timeouts projected (#1520, #1590).
    timeout-minutes: 56
    permissions:
      contents: read
      # Where the time went downloads the last main run's per-test times (#1146).
      actions: read
    env:
      # An unlabelled pull request skips `long` tests and runs only what its change reaches; main, nightly, full-ci run all (#720, #1567).
      SOHOT_FAST_PATH: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci')) && '1' || '0' }}
      # Push and PR runs leave `nightly` tests, each with a fast twin that runs here, to the nightly and dispatch (#1590).
      SOHOT_SKIP_NIGHTLY: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_repo_cases_at_base.py reads every repo case's base commit (#913).
          fetch-depth: 0

      - name: Refuse to run on x86
        # mlx and mflux are Apple Silicon only. If macos-latest ever moves back
        # to Intel, fail here saying so rather than 400 lines down in a resolve
        # error.
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          [ "$arch" = "arm64" ] || {
            echo "::error::this suite needs Apple Silicon; runner is $arch"
            exit 1
          }

      - name: Which runner this is
        # make check takes 5 or 13 minutes depending on the runner it lands on (#1146).
        run: |
          echo "JOB_STARTED_S=$(date +%s)" >> "$GITHUB_ENV"
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.perflevel0.physicalcpu hw.memsize || true
          # Three workers kept 3 vCPUs 68% busy (time -p, #1146): one more overlaps the waits.
          echo "PYTEST_XDIST_AUTO_NUM_WORKERS=$(( $(sysctl -n hw.ncpu) + 1 ))" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Tools make check needs
        # shellcheck: `make lint` shells out to it and exits 127 without it.
        # librsvg: without it the whole SVG render module skips, and that is
        # the checker that catches well-formed markup which draws nothing.
        run: brew install shellcheck librsvg

      - run: bash scripts/ci-retry.sh uv sync --python 3.12

      - name: Which tests this change can reach
        # The fast path runs the tests the change reaches (nightly coverage map, else import or name) and the ratchets (#1567, #1571).
        if: env.SOHOT_FAST_PATH == '1'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          listing="$RUNNER_TEMP/selected.txt"
          map="$RUNNER_TEMP/coverage-map.json"
          uv run python -m tests.gauntlet.covmap fetch --out "$map" || echo "::warning::no coverage map; tracing by import"
          if ! uv run python -m tests.gauntlet.scope --base "origin/$BASE_REF" --map "$map" --out "$listing"; then
            echo "::warning::test selection failed; running the full suite"
            rm -f "$listing"
          fi
          if [ -s "$listing" ]; then echo "SOHOT_SELECTED=$listing" >> "$GITHUB_ENV"; fi

      - name: Restore the tree-scan cache
        # Scanner results keyed by the text they read, so a stale entry is never served, only missed (#1590).
        uses: actions/cache/restore@v4
        with:
          path: .pytest_cache/d/tree-scan
          key: tree-scan-${{ github.sha }}
          restore-keys: tree-scan-

      - name: make check
        # The same command a person runs locally. CI running something else is
        # how a repo gets a green badge and a broken checkout.
        env:
          # The nightly searches the declared lifecycles deeper, randomised (#1766).
          PYTEST_ADDOPTS: --durations=60 --durations-min=0.5 --junitxml=/tmp/junit.xml ${{ github.event_name == 'schedule' && '--hypothesis-profile=deep' || '' }}
          # Each test's start and end as it happens, so a cancelled run still says where its time went (#1146).
          SOHOT_TEST_LOG: /tmp/test-times.tsv
          # A dispatch's `tests` input runs those alone, through env and never pasted into the script (#1906).
          TESTS: ${{ inputs.tests }}
        # user+sys over real x cores says whether the runner's cores were busy or waiting (#1146).
        run: |
          set -o pipefail
          read -ra tests <<< "$TESTS"
          if [ "${#tests[@]}" -gt 0 ]; then suite=(uv run --group mcp pytest "${tests[@]}" -q -n 6); else suite=(make check); fi
          SOHOT_CATCHES=1 /usr/bin/time -p "${suite[@]}" 2>&1 | tee /tmp/check.log

      - name: Save the tree-scan cache
        # Saved failed or not: an entry is right whenever its key matches, so the next run starts warm (#1590).
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pytest_cache/d/tree-scan
          key: tree-scan-${{ github.sha }}

      - name: Where the time went
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow ci.yml --branch main --event push --status success -L 1 --json databaseId -q '.[0].databaseId' || true)
          [ -z "$prev" ] || gh run download "$prev" -n junit-macos -D /tmp/prev || true
          {
            echo "### Test time (fast path: $SOHOT_FAST_PATH)"
            echo
            echo '```'
            uv run python -m harness.suite_time /tmp/junit.xml --log /tmp/test-times.tsv --now "$(date +%s)" --against /tmp/prev/junit.xml 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: What did not run
        # A test that silently skips reports green for something it never
        # checked. Say so in the job summary, every run, pass or fail.
        if: always()
        run: |
          {
            echo "### Skipped on this runner"
            echo
            echo '```'
            grep -E '^SKIPPED' /tmp/check.log || echo 'nothing skipped'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the per-test times
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: junit-macos
          path: |
            /tmp/junit.xml
            /tmp/test-times.tsv
          retention-days: 30

      - name: How much of the timeout this job used
        # Warns past 80%, so a growing suite is seen before it is cancelled (#1146).
        if: always()
        run: uv run python -m harness.ci_budget

  store-touched:
    # Whether a change reaches the store seam, so check-postgres runs only then, and nightly (#1507).
    if: github.event_name != 'workflow_dispatch' || (inputs.jobs == 'all' || contains(inputs.jobs, 'check-postgres'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          seam='^(harness/store[a-z_]*\.py|harness/memory_store/|harness/migration_check\.py|harness/commands/store\.py|deploy/postgres/|tests/conftest\.py|tests/test_store_postgres_1507\.py|tests/test_harness_store\.py|tests/gauntlet/postgres_known\.txt|tests/gauntlet/explicit_store_paths\.txt|Makefile|pyproject\.toml|uv\.lock|\.github/workflows/ci\.yml)'
          if changed="$(git diff --name-only "$BASE"...HEAD 2>/dev/null)"; then
            hits="$(printf '%s\n' "$changed" | grep -E "$seam" || true)"
          else
            hits="base unknown"
          fi
          echo "store seam files changed: ${hits:-none}"
          echo "touched=$([ -n "$hits" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

  check-postgres:
    # The suite on Postgres (#1507): nightly and on demand always, otherwise only when the change reaches the store seam.
    # macOS like check-macos; its runners have no Docker, so Homebrew's postgresql@16, the container's major version.
    needs: store-touched
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'check-postgres'))) ||
      needs.store-touched.outputs.touched == '1'
    runs-on: macos-latest
    # 1.4x (a slow M1 host, #1520) the PR job p95 54.6 min, timeouts projected (harness.ci_history --job check-postgres, #1590).
    timeout-minutes: 77
    permissions:
      contents: read
      # The selection reads the nightly coverage map, an artifact (#1571).
      actions: read
    env:
      # A push to main runs what it reaches, as a pull request does; the whole suite is the nightly's (#1584).
      SOHOT_FAST_PATH: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci'))) && '1' || '0' }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: discovery
      PGPASSWORD: test
      PGDATABASE: discovery
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cores
        run: echo "PYTEST_XDIST_AUTO_NUM_WORKERS=$(( $(sysctl -n hw.ncpu) + 1 ))" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Tools, and Postgres 16
        run: brew install shellcheck librsvg postgresql@16

      - name: Start Postgres
        run: |
          bin="$(brew --prefix postgresql@16)/bin"
          "$bin/initdb" -D "$RUNNER_TEMP/pg" -U discovery --auth=trust --locale=C --encoding=UTF8 >/dev/null
          "$bin/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -w \
            -o "-c max_connections=500 -c fsync=off -p 5432 -k $RUNNER_TEMP" start
          "$bin/createdb" -h 127.0.0.1 -U discovery discovery
          # The restore test runs pg_dump, pg_restore and psql as the store's container would (#1610).
          echo "$bin" >> "$GITHUB_PATH"

      - run: bash scripts/ci-retry.sh uv sync --python 3.12

      - name: Which tests this change can reach
        # A PR diffs against its base branch, a push against the commit main was at before it (#1567, #1571, #1584).
        if: env.SOHOT_FAST_PATH == '1'
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          listing="$RUNNER_TEMP/selected.txt"
          map="$RUNNER_TEMP/coverage-map.json"
          uv run python -m tests.gauntlet.covmap fetch --out "$map" || echo "::warning::no coverage map; tracing by import"
          if ! uv run python -m tests.gauntlet.scope --base "$BASE" --map "$map" --out "$listing"; then
            echo "::warning::test selection failed; running the full suite"
            rm -f "$listing"
          fi
          if [ -s "$listing" ]; then echo "SOHOT_SELECTED=$listing" >> "$GITHUB_ENV"; fi

      - name: make test-postgres-suite
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          set -o pipefail
          read -ra tests <<< "$TESTS"
          if [ "${#tests[@]}" -gt 0 ]; then suite=(uv run --group cluster --group mcp pytest "${tests[@]}" -q -n 6); else suite=(make test-postgres-suite); fi
          LOCALHARNESS_STORE=postgres "${suite[@]}" 2>&1 | tee /tmp/check.log

      - name: What did not run
        if: always()
        run: |
          {
            echo "### Skipped on Postgres"
            echo
            echo '```'
            grep -E '^SKIPPED' /tmp/check.log || echo 'nothing skipped'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  check-linux:
    # Deferred to the nightly run; a PR labelled full-ci runs it now.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'check-linux'))) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    # Pinned to 24.04, the release the Linux machines here run, so a failure
    # is a failure on a real box rather than on a runner nobody owns.
    # `ubuntu-latest` moves to 26 on 2026-10-19 (#339); the step below checks
    # the pin is honored. Keep it in step with EXPECT_UBUNTU.
    runs-on: ubuntu-24.04
    # 1.3x the nightly job p95 36.1 min (harness.ci_history --job check-linux, #1588, #1590); apt has its own 6 (#647).
    timeout-minutes: 47

    env:
      EXPECT_UBUNTU: "24.04"
      APT_PACKAGES: shellcheck librsvg2-bin ffmpeg zsh fonts-dejavu-core time

    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_repo_cases_at_base.py reads every repo case's base commit (#913).
          fetch-depth: 0

      - name: The runner is still the release the distro choice rests on
        run: |
          . /etc/os-release
          echo "runner: $PRETTY_NAME"
          if [ "$VERSION_ID" != "$EXPECT_UBUNTU" ]; then
            echo "::error::the runner is $VERSION_ID, not $EXPECT_UBUNTU." >&2
            echo "::error::CI parity with the Linux machines here was the whole reason for picking this distro, and it is gone." >&2
            echo "::error::Either fix runs-on to ubuntu-$EXPECT_UBUNTU, or move the machines and update both together." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Key the .deb cache on the package list
        id: aptkey
        run: |
          echo "APT_ARCHIVES=$RUNNER_TEMP/apt-archives" >> "$GITHUB_ENV"
          echo "key=apt-noble-$(echo "$APT_PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the .deb cache
        id: aptcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.APT_ARCHIVES }}
          key: ${{ steps.aptkey.outputs.key }}

      - name: Tools make check needs
        # Its own limit, so a slow mirror fails here by name instead of cancelling make check (#647).
        timeout-minutes: 6
        # shellcheck for `make lint`; librsvg2-bin for the ink lane; ffmpeg for
        # the video checks; zsh because tests/shells.py runs scripts/env.sh in
        # three shells and a missing one is a silent skip; fonts-dejavu-core
        # because the OCR fixture renders real type and PIL's bitmap fallback
        # would measure the fixture rather than the check; `time` because the
        # shell builtin of that name reports no memory and harness/proc.py
        # refuses to report a peak it could not measure.
        #
        # Chrome is already on this image, and render.py finds it by name.
        run: |
          mkdir -p "$APT_ARCHIVES/partial"
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::archives=$APT_ARCHIVES"
          # shellcheck disable=SC2086
          sudo apt-get $apt_opts update
          # shellcheck disable=SC2086
          sudo apt-get $apt_opts install -y --no-install-recommends $APT_PACKAGES
          sudo chown -R "$USER" "$APT_ARCHIVES"
          # helm renders the chart in tests/test_deploy_chart.py. Installed
          # explicitly rather than relied on from the runner image: those
          # assertions are the whole of #148 phase 0, and without helm they
          # SKIP, which reports green for something that never ran.
          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
              | DESIRED_VERSION=v3.16.3 bash
          fi
          missing=""
          for tool in shellcheck rsvg-convert ffmpeg zsh /usr/bin/time helm; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::not installed:$missing" >&2
            exit 1
          fi

      - name: Save the .deb cache
        if: steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.APT_ARCHIVES }}
          key: ${{ steps.aptkey.outputs.key }}

      - run: bash scripts/ci-retry.sh uv sync --python 3.12

      - name: Which browser, and what it says
        # The html and ink lanes go through whatever browser render.py finds,
        # and this runner has several. When they fail the first question is
        # which binary ran and what it actually printed: two rounds went into
        # reading the dbus noise every chrome emits at every start. Reports,
        # never gates.
        if: always()
        run: |
          {
            echo "### Browsers on this runner"
            echo
            echo '```'
            for name in chromium chromium-browser google-chrome google-chrome-stable; do
              path="$(command -v "$name" 2>/dev/null || true)"
              if [ -z "$path" ]; then echo "$name: absent"; continue; fi
              echo "$name -> $path -> $(readlink -f "$path")"
              echo "    $("$path" --version 2>&1 | head -1)"
            done
            echo
            # WHICH COMBINATION ACTUALLY RENDERS. Two browsers and two profile
            # settings, measured rather than guessed: three rounds went to
            # three plausible theories about why chromium writes no screenshot
            # here. The matrix answers it in one.
            for bin in /usr/bin/chromium /usr/bin/google-chrome; do
              for prof in 1 0; do
                [ -x "$bin" ] || continue
                printf '%s profile=%s: ' "$bin" "$prof"
                LH_CHROME="$bin" LH_CHROME_PROFILE="$prof" timeout 90 \
                  uv run python -c "from harness.checks import render; render.rasterize_html('<p>ci</p>', '/tmp/ci-probe.png'); print('OK')" 2>&1 | tail -1
              done
            done
            echo '```'
          # tee, not >>: a step summary is not in the job log, and reading it
          # needs a browser. A diagnostic nobody can read from the terminal is
          # a diagnostic that costs another round.
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: make check
        # Coverage rides on this one pass; a second full run went over the timeout (#623).
        env:
          PYTEST_ADDOPTS: --durations=30 --cov=harness --cov=evals --cov-report=term --cov-report=json
          TESTS: ${{ inputs.tests }}
        run: |
          set -o pipefail
          read -ra tests <<< "$TESTS"
          if [ "${#tests[@]}" -gt 0 ]; then suite=(uv run --group mcp pytest "${tests[@]}" -q -n 6); else suite=(make check); fi
          SOHOT_CATCHES=1 "${suite[@]}" 2>&1 | tee /tmp/check.log

      - name: make test-litellm
        # The whole suite collected under the LiteLLM overlay and its mcp 1; no other job runs it (#1221).
        if: always() && inputs.tests == ''
        timeout-minutes: 8
        run: make test-litellm

      - name: Coverage, reported and never gated
        # LINUX ONLY, on purpose. Platform skips differ, so running this on
        # three runners yields three different numbers for one commit and
        # invites comparing them -- three exams, one table.
        #
        # Reported rather than gated: there is no baseline, so a threshold
        # would start red and teach everyone to skip it. And the repo figure is
        # blind twice over -- it cannot tell an executed line from an asserted
        # one, and it barely moves when a change adds fifty unexercised lines.
        # The number worth reading on a pull request is the differential.
        if: always()
        continue-on-error: true
        run: |
          total="$(grep -E '^TOTAL' /tmp/check.log | awk '{print $NF}' || true)"
          {
            echo "### Coverage"
            echo
            echo "Repo total: **${total:-unavailable}**, reported and not gated."
            echo
            echo "Lines this change adds that no test runs:"
            echo '```'
            uv run python -m harness.covdiff --base "origin/${GITHUB_BASE_REF:-main}" 2>&1 \
              || echo 'differential unavailable on this event'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What did not run
        if: always()
        run: |
          {
            echo "### Skipped on this runner"
            echo
            echo '```'
            grep -E '^SKIPPED' /tmp/check.log || echo 'nothing skipped'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  check-windows:
    # Deferred to the nightly run; a PR labelled full-ci runs it now.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'check-windows'))) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    # The second measurement machine. Nothing here is Apple Silicon, so the MLX
    # lanes skip and the "What did not run" step below prints which ones.
    runs-on: windows-latest
    # 1.3x the nightly job p95 85.2 min, timeouts projected (harness.ci_history --job check-windows, #1588, #1590).
    timeout-minutes: 111
    defaults:
      run:
        # Git Bash. scripts/env.sh is sourced by the tests, and the Makefile
        # shells out to bash for its syntax check.
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_repo_cases_at_base.py reads every repo case's base commit (#913).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Tools make check needs
        # make and shellcheck for `make lint`; ffmpeg for the video checks.
        #
        # CHOCO EXITS 0 WHEN IT INSTALLS NOTHING. The community feed returned
        # 503 and 504 for every package in one run, choco reported "installed
        # 0/0 packages", the step went green, and the job failed three minutes
        # later at `shellcheck: command not found` -- which reads as a broken
        # Makefile rather than an outage. Retry the transient half, then check
        # the tools are actually there and say so if they are not.
        run: |
          for attempt in 1 2 3; do
            choco install -y make shellcheck ffmpeg && break
            echo "choco attempt $attempt failed; retrying" >&2
            sleep 20
          done
          missing=""
          for tool in make shellcheck ffmpeg; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::not installed:$missing (chocolatey outage?)" >&2
            exit 1
          fi

      - name: librsvg
        # Not in winget and not in chocolatey. MSYS2 carries it and the runner
        # image already has MSYS2 at C:\msys64. render.py resolves the binary
        # by location, so mingw64\bin is never put on PATH, where its gcc and
        # python would sit in front of the ones this job installed.
        run: |
          /c/msys64/usr/bin/pacman -Sy --noconfirm
          /c/msys64/usr/bin/pacman -S --noconfirm mingw-w64-x86_64-librsvg

      - run: bash scripts/ci-retry.sh uv sync --python 3.12

      - name: make check
        # The same command the macOS job runs, and the same one a person runs
        # locally.
        env:
          PYTEST_ADDOPTS: --durations=30
          TESTS: ${{ inputs.tests }}
        run: |
          set -o pipefail
          read -ra tests <<< "$TESTS"
          if [ "${#tests[@]}" -gt 0 ]; then suite=(uv run --group mcp pytest "${tests[@]}" -q -n 6); else suite=(make check); fi
          SOHOT_CATCHES=1 "${suite[@]}" 2>&1 | tee /tmp/check.log

      - name: What did not run
        if: always()
        run: |
          {
            echo "### Skipped on this runner"
            echo
            echo '```'
            grep -E '^SKIPPED' /tmp/check.log || echo 'nothing skipped'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mutation:
    # Nightly or on demand, never on a pull request, labelled or not (#492 F3).
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'mutation')))
    name: mutation (${{ matrix.module }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: macos-latest
    # One job per module, and adopt.py in two shards: it outgrew 120 minutes and a cancelled job reports nothing (#840, #1588).
    strategy:
      fail-fast: false
      # macOS runners are 5 at once and handed out oldest job first; queued legs starved main's check-macos (#1802).
      max-parallel: 2
      matrix:
        include:
          - module: harness/memory_store/transitions.py
          - module: harness/reasons.py
          - module: harness/screen.py
          - module: harness/adopt.py
            shard: 1/2
          - module: harness/adopt.py
            shard: 2/2
          - module: harness/serving.py
          - module: harness/router.py
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: bash scripts/ci-retry.sh uv sync --python 3.12

      - name: make mutation
        # Fails on a new surviving mutant, or on a pinned one that is now killed and still listed.
        run: make mutation MUTATION_ARGS="--module ${{ matrix.module }}${{ matrix.shard && format(' --shard {0}', matrix.shard) || '' }} --found .logs/mutation-found.json"

      - name: Survivors for `gauntlet mutation --config tests.gauntlet.mutation:CONFIG pin --from`
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-found-${{ strategy.job-index }}
          path: .logs/mutation-found.json
          if-no-files-found: ignore

      - name: Mutation summary
        if: always()
        run: |
          {
            echo "### Mutation testing: ${{ matrix.module }} ${{ matrix.shard }}"
            echo
            echo '```'
            tail -n 60 .logs/mutation.log 2>/dev/null || echo 'no log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mutation-plan:
    # Which mutated-module functions a pull request changes; a macOS runner is taken only when there are some (#1666).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: bash scripts/ci-retry.sh uv sync --python 3.12

      - id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          uv run python -m tests.gauntlet.mutation changed --base "origin/$BASE_REF" > "$RUNNER_TEMP/changed.tsv"
          cat "$RUNNER_TEMP/changed.tsv"
          { echo "plan<<EOF"; cat "$RUNNER_TEMP/changed.tsv"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  mutation-changed:
    # A pull request's changed functions in the mutated modules, ratcheted as the nightly does; #1663/#1665 merged unmutated (#1666).
    needs: mutation-plan
    if: needs.mutation-plan.outputs.plan != ''
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: bash scripts/ci-retry.sh uv sync --python 3.12

      - name: make mutation on each changed function
        env:
          PLAN: ${{ needs.mutation-plan.outputs.plan }}
        run: |
          plan="$RUNNER_TEMP/changed.tsv"
          printf '%s\n' "$PLAN" > "$plan"
          status=0
          while IFS=$'\t' read -r module fns; do
            [ -n "$module" ] || continue
            args="--module $module"
            for f in $fns; do args="$args --function $f"; done
            make mutation MUTATION_ARGS="$args" < /dev/null || status=1
          done < "$plan"
          exit $status

  coverage-map:
    # Which test files execute each function, for choosing a pull request's tests; the PR job downloads it (#1571).
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'coverage-map')))
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Tools make check needs
        run: brew install shellcheck librsvg

      - run: bash scripts/ci-retry.sh uv sync --python 3.12

      - name: Every test under coverage, one context per test
        # check-macos gates on the same tests; a failing test still records what it executed.
        continue-on-error: true
        env:
          SOHOT_COVERAGE_MAP: "1"
        run: >-
          uv run --group mcp pytest tests/ -q -n auto -p no:cacheprovider
          --cov=harness --cov=evals --cov=gateway --cov=tests --cov-context=test --cov-report=

      - name: Reduce it to the map
        run: uv run python -m tests.gauntlet.covmap build --data .coverage --out coverage-map.json

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-map
          path: coverage-map.json
          retention-days: 7

  report-nightly:
    needs: [check-macos, check-postgres, check-linux, check-windows, mutation, coverage-map]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "macos=${{ needs.check-macos.result }} linux=${{ needs.check-linux.result }} windows=${{ needs.check-windows.result }} mutation=${{ needs.mutation.result }} coverage-map=${{ needs.coverage-map.result }}"
        run: |
          title="Nightly CI is failing on main"
          body="$RESULTS at ${GITHUB_SHA::7}: $RUN"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
