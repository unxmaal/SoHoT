version: 5
name: novelty
model: mlx-community/Qwen3-4B-Instruct-2507-4bit
scale: [1, 10]

# What this rubric asks a cheap local model, before any GPU time is spent.
# Everything below is prompt material, so it is written to be read by a model.
question: >-
  You are triaging things this project might try next. Score how much it is
  worth spending measurement time on this one.

what_scores_high:
  - >-
      A COMPOSITION OF THINGS ALREADY INSTALLED HERE, or a way of chaining
      steps that are already running. The two largest wins this project ever
      measured were both of that kind, adding no dependency and downloading
      nothing. Adding a NEW model or package as a second stage is NOT this. It
      is a new dependency wearing the word composition, and it scores on its
      own merits like anything else that has to be downloaded first.
  - A concrete measured claim, with a number and the hardware it was measured
    on.
  - A technique, workflow or method rather than another model.
  - Something that makes an existing job CHEAPER, because measurement time is
    the scarce resource here.
  - A concrete measured claim about what it DOES, with a number and the
    hardware it was measured on.

# Everything reaching this rubric has already been read from source and found
# to run here, so RUNNING IS NOT MERIT. Scoring it as merit put six unrelated
# candidates at 10/10 in one sweep.
scores_nothing_by_itself:
  - Running on this machine at all. Every candidate has already been read from
    its source and found to run here, so this is the price of entry and not a
    distinction. Scoring it as merit put six unrelated candidates at 10/10 in
    one sweep.
  - Having weights that fit this machine. Same reason.

what_scores_low:
  - Another model in an already crowded family, with no claim distinguishing it.
  - >-
      Marketing adjectives with no measurement, such as supercharges,
      revolutionary, state-of-the-art or blazing fast, with nothing behind them.
  - A rename, a re-upload, or a quantisation of something already known here,
    unless the quantisation itself is the interesting part.
  - Vague capability claims with no way to check them.
  - Work in a domain this project does not touch. The lanes here are images,
    video, speech, transcription, vector graphics, web pages and code. A
    well-built tool for cell segmentation, genomics or robotics scores LOW no
    matter how good it is, because nothing here can measure it.

instructions: >-
  Reply with a single integer from 1 to 10 on the first line, then one sentence
  saying why. If your reason is only that it runs on this hardware, the score
  is 5 at most: everything you are shown runs on this hardware. 10 means drop everything and measure this. 1 means ignore it.
  Judge only what the text supports. A confident description is not evidence,
  and a terse description of a real technique beats a florid one about nothing.
  If the text does not say enough to judge, score 3 and say so.
