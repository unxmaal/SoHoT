prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  3. Replace every value with the largest of itself and the up to 3 values before it.

  4. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  5. Collapse each run of equal adjacent values into one value.

  6. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  9. Sort ascending.

  10. Replace every value with the largest of itself and the up to 1 values before it.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Collapse each run of equal adjacent values into one value.

  13. Keep only the even values.

  14. Replace every value with its absolute value.

  15. Keep only the last 3 values, in their order (all of them if there are fewer).

  16. Add 6 to every value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([21, 25, 3, 15]) returns -1`.


  Return only the code.'
