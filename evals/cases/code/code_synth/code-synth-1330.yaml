prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Swap the case of every letter.

  4. Keep only the first occurrence of each character.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Convert to lowercase.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Keep only the first occurrence of each character.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the resulting string.


  Example: `apply_rules(''C.Ac,2zxxya,,x'') returns ''1c,de3h.''`.


  Return only the code.'
