  to the result of the one before:

  1. Replace every ''o'' with ''l'' (lowercase only).

  2. Remove every digit.

  3. Replace every ''b'' with ''r'' (lowercase only).

  4. Keep only the first occurrence of each character.

  5. Sort the characters in ascending code point order.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Collapse every run of the same character into one character.

  9. Convert to uppercase.

  10. Keep only the first occurrence of each character.

  11. Swap the case of every letter.

  12. Replace every ''i'' with ''t'' (lowercase only).

  13. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Convert to uppercase.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Collapse every run of the same character into one character.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return how many characters it has.


  Example: `process(''x.yB1.AB'') returns 4`.


  Return only the code.'
