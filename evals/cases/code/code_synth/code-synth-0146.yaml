  4. Replace every ''l'' with ''d'' (lowercase only).

  5. Replace every maximal run of digits with the number of digits in it.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Remove every digit.

  8. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the resulting string.


  Example: `apply_rules(''bxzAyB00'') returns ''GHdfh''`.


  Return only the code.'
