  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Sort the characters in ascending code point order.

  5. Remove every digit.

  6. Collapse every run of the same character into one character.

  7. Convert to lowercase.

  8. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
