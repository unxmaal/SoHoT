prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''sub'', ''drop'', ''mul'', ''over'': sub pops
  b then a and pushes a - b, so the value pushed first is a; drop removes the top value; mul pops two
  values and pushes their product; over pushes a copy of the second value from the top. An operation that
  needs more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''drop'', ''mul'', ''sub'', 1, 9, ''over'']) returns [1, 9, 1]`.


  Return only the code.'
