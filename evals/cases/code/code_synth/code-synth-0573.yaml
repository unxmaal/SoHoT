  checks:
  - run_program([-1, 3, 'mul', 'sub', 'mul', 'sub', 'drop', 'drop', 'mul']) == []
  - run_program([-2, 7, 2, -3, 'sub', 'over', 'over', 'drop', 2]) == [-2, 7, 5, 7, 2]
  - run_program(['drop', 'drop', 'over', 'sub', 'over']) == []
  - run_program(['over', -3]) == [-3]
  - run_program(['mul', 'sub', 'mul', 'sub', 'drop', 'drop', 8, 'mul']) == [8]
  - run_program(['drop', 7, 'over', 'mul', 'mul', 'drop', 'drop', 'mul', 'drop']) == []
