prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Multiply every value by 2.

  5. Replace every value with its square.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Reverse the list.

  8. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  9. Sort ascending.

  10. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  11. Keep only the last 2 values, in their order (all of them if there are fewer).

  12. Sort ascending.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  17. Replace every value with its square.

  18. Multiply every value by -2.

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([1, 17, 18, -11, 3, 7, -1, 23, 22]) returns -10`.


  Return only the code.'
