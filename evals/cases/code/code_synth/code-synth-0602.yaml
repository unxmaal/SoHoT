  order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Keep only the first 5 values (all of them if there are fewer).

  3. Reverse the list.

  4. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Sort descending.

  7. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([-2, 7, -3, 6]) returns 1`.


  Return only the code.'
