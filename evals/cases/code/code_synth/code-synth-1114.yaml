prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Swap the case of every letter.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Keep only the first 4 whitespace-separated words, joined by single spaces.

  5. Convert to uppercase.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Convert to lowercase.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Swap the case of every letter.

  10. Keep only the first occurrence of each character.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Replace every ''d'' with ''r'' (lowercase only).

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Replace every ''a'' with ''c'' (lowercase only).

  17. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  18. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  19. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  20. Remove every digit.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''.2 z.zyb0b'') returns ''.''`.


  Return only the code.'
