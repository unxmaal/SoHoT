prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Keep only the first occurrence of each character.

  4. Convert to lowercase.

  5. Collapse every run of the same character into one character.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Keep only the first occurrence of each character.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Keep only the first occurrence of each character.

  11. Swap the case of every letter.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Keep only the first 3 whitespace-separated words, joined by single spaces.

  16. Convert to uppercase.

  Then: Return the resulting string.


  Example: `reduce_data(''xx0,Bz0a czCy'') returns ''311K111G111 1112111F1110111,111J111H111I''`.


  Return only the code.'
