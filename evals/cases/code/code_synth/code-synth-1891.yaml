prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Collapse each run of equal adjacent values into one value.

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Replace every value with the largest value seen so far.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Collapse each run of equal adjacent values into one value.

  7. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  8. Keep only the first 4 values (all of them if there are fewer).

  9. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([-5, 25, 25, 25, 15, 24, -5, 12]) returns [4]`.


  Return only the code.'
