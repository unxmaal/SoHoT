prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Keep only the values greater than -3.

  3. Collapse each run of equal adjacent values into one value.

  4. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  5. Keep only the first 2 values (all of them if there are fewer).

  6. Sort descending.

  7. Replace every value with the largest value seen so far.

  8. Replace every value with the largest of itself and the up to 1 values before it.

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Replace every value with the largest of itself and the up to 3 values before it.

  12. Collapse each run of equal adjacent values into one value.

  13. Replace every value with the largest value seen so far.

  14. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  15. Sort descending.

  16. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([3, 17, -4, 17]) returns 33`.


  Return only the code.'
