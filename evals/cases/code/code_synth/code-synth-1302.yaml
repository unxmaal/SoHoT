  other characters are unchanged.

  3. Collapse every run of the same character into one character.

  4. Remove every digit.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Swap the case of every letter.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Convert to uppercase.

  13. Keep only the first 3 whitespace-separated words, joined by single spaces.

  14. Remove every digit.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Reverse the order of the whitespace-separated words and join them with single spaces.

  17. Replace runs of whitespace with a single space and strip both ends.

  18. Sort the characters in ascending code point order.

  Then: Return the resulting string.


  Example: `compute(''2Bc1z Ba01AC'') returns '' ..FGGH''`.


  Return only the code.'
