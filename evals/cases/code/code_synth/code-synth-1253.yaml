prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Replace every value with its square.

  4. Replace every value with its absolute value.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Keep only the first 5 values (all of them if there are fewer).

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Keep the values at indices 0, 2, 4, and so on.

  9. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  10. Collapse each run of equal adjacent values into one value.

  11. Multiply every value by -2.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  14. Collapse each run of equal adjacent values into one value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([-4, -7, 7, 25, 17, -8]) returns [-6]`.


  Return only the code.'
