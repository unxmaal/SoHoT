prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Keep only the values greater than 4.

  3. Sort descending.

  4. Replace every value with its absolute value.

  5. Replace every value with its square.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Remove every negative value.

  8. Clamp every value into the range -1 to 7, both inclusive.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  11. Sort ascending.

  12. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  13. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  14. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  15. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  16. Replace every value with the largest of itself and the up to 1 values before it.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([-9, 25, -4, -7, 21, -4, -12]) returns -3`.


  Return only the code.'
