  1. Replace runs of whitespace with a single space and strip both ends.

  2. Sort the characters in ascending code point order.

  3. Remove every digit.

  4. Replace every ''i'' with ''e'' (lowercase only).

  5. Keep only the first occurrence of each character.

  6. Swap the case of every letter.

  7. Collapse every run of the same character into one character.

  8. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Replace every ''r'' with ''d'' (lowercase only).

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  14. Convert to uppercase.

  15. Keep only the first occurrence of each character.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return how many characters it has.


  Example: `process(''Cc0aBcabA b,C,'') returns 3`.


  Return only the code.'
