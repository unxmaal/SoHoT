  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Multiply every value by 2.

  8. Remove every negative value.

  9. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  10. Replace every value with the largest of itself and the up to 1 values before it.

  11. Collapse each run of equal adjacent values into one value.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Multiply every value by -1.

  14. Reverse the list.

  Then: Return the resulting list.


  Example: `process([4, 9, -6, -10, 13, 20, 10]) returns [-8, -4, -3, -2]`.


  Return only the code.'
