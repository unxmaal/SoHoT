  3. Swap the case of every letter.

  4. Convert to uppercase.

  5. Remove every digit.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  9. Convert to lowercase.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Convert to lowercase.

  14. Swap the case of every letter.

  15. Collapse every run of the same character into one character.

  16. Keep only the first 3 whitespace-separated words, joined by single spaces.

  17. Sort the characters in ascending code point order.

  18. Replace runs of whitespace with a single space and strip both ends.

  19. Remove every digit.

  20. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process('' c01a A,1,Caz'') returns '',CZ''`.


  Return only the code.'
