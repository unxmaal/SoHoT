prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Sort the characters in ascending code point order.

  3. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  5. Replace every ''b'' with ''r'' (lowercase only).

  6. Swap the case of every letter.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Keep only the first 4 whitespace-separated words, joined by single spaces.

  9. Replace every ''s'' with ''n'' (lowercase only).

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Convert to lowercase.

  12. Sort the characters in ascending code point order.

  13. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Keep only the first occurrence of each character.

  15. Replace every ''c'' with ''e'' (lowercase only).

  16. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  Then: Return the resulting string.


  Example: `solve(''z C1axacc1Aba'') returns ''6........''`.


  Return only the code.'
