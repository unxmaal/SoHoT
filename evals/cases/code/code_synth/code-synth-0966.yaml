  1. Swap the case of every letter.

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Collapse every run of the same character into one character.

  6. Keep only the first occurrence of each character.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Convert to uppercase.

  9. Replace every ''d'' with ''b'' (lowercase only).

  10. Keep only the first occurrence of each character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute(''x0B1,.  b'') returns ''1E0I,.''`.


  Return only the code.'
