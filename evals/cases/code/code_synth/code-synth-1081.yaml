prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Replace every value with the largest of itself and the up to 1 values before it.

  3. Replace every value with the largest value seen so far.

  4. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  5. Replace every value with the largest value seen so far.

  6. Keep only the last 2 values, in their order (all of them if there are fewer).

  7. Remove every negative value.

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Replace every value with the largest value seen so far.

  10. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  11. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  12. Keep only the first 3 values (all of them if there are fewer).

  13. Remove every negative value.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Reverse the list.

  17. Clamp every value into the range 0 to 8, both inclusive.

  18. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `run_pipeline([4, 19, -12, 2]) returns 4`.


  Return only the code.'
