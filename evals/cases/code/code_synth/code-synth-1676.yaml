prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Replace every ''o'' with ''n'' (lowercase only).

  3. Convert to lowercase.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Replace every ''b'' with ''i'' (lowercase only).

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Convert to lowercase.

  8. Remove every digit.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Convert to lowercase.

  11. Sort the characters in ascending code point order.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Replace every maximal run of digits with the number of digits in it.

  15. Keep only the first occurrence of each character.

  16. Replace runs of whitespace with a single space and strip both ends.

  17. Keep only the first 2 whitespace-separated words, joined by single spaces.

  18. Keep only the first occurrence of each character.

  19. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  20. Convert to uppercase.

  Then: Return how many characters it has.


  Example: `apply_rules('' Cb100cbc11bB2B'') returns 2`.


  Return only the code.'
