  3. Collapse every run of the same character into one character.

  4. Convert to uppercase.

  5. Swap the case of every letter.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Sort the characters in ascending code point order.

  8. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Remove every digit.

  10. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  11. Replace every ''r'' with ''d'' (lowercase only).

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Swap the case of every letter.

  14. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''yA.21xABABB0B2C,'') returns ''.MJ..''`.


  Return only the code.'
