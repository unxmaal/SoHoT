  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  5. Drop the first 2 values (an empty list if there are fewer).

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Replace every value with its absolute value.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Reverse the list.

  13. Multiply every value by -2.

  14. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Remove duplicates, keeping the first occurrence of each value.

  17. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  18. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `solve([17, -11, -10, 7, -11, -3, 16]) returns -98`.


  Return only the code.'
