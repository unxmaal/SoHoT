prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Collapse each run of equal adjacent values into one value.

  3. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  4. Reverse the list.

  5. Keep only the last 4 values, in their order (all of them if there are fewer).

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  8. Keep only the even values.

  9. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Replace every value with its square.

  12. Add -1 to every value.

  13. Keep only the last 3 values, in their order (all of them if there are fewer).

  14. Sort descending.

  15. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  16. Replace every value with its absolute value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([4, 14, -1, 13, 9, -1, 4]) returns 2`.


  Return only the code.'
