prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the values greater than -1.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Add 4 to every value.

  4. Keep only the first 5 values (all of them if there are fewer).

  5. Keep only the values greater than 8.

  6. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  7. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  8. Collapse each run of equal adjacent values into one value.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Replace every value with its absolute value.

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  14. Replace every value with its absolute value.

  Then: Return the resulting list.


  Example: `reduce_data([10, 1, -10]) returns []`.


  Return only the code.'
