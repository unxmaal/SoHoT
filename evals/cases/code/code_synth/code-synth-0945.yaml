  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Keep only the first 4 whitespace-separated words, joined by single spaces.

  7. Swap the case of every letter.

  8. Convert to lowercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute(''zxy  c10C .y2'') returns ''1z1x1y2''`.


  Return only the code.'
