  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Sort the characters in ascending code point order.

  4. Collapse every run of the same character into one character.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Collapse every run of the same character into one character.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Convert to uppercase.

  9. Remove every digit.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
