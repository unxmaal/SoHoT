prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the values greater than -1.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  4. Remove every negative value.

  5. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  6. Sort ascending.

  7. Replace every value with its square.

  8. Replace every value with its absolute value.

  9. Reverse the list.

  10. Remove every negative value.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Multiply every value by 2.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Replace every value with the largest of itself and the up to 1 values before it.

  15. Clamp every value into the range -4 to 4, both inclusive.

  16. Keep only the first 5 values (all of them if there are fewer).

  17. Reverse the list.

  18. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `process([16, 19, 5]) returns 0`.


  Return only the code.'
