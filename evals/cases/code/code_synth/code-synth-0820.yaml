  3. Reverse the list.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  7. Replace every value with its square.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Replace every value with the largest of itself and the up to 2 values before it.

  10. Add -1 to every value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([-2, 1, -12, 14]) returns 17`.


  Return only the code.'
