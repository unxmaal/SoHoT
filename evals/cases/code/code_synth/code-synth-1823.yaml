prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Sort ascending.

  2. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  3. Sort descending.

  4. Clamp every value into the range -5 to 2, both inclusive.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Keep the values at indices 0, 3, 6, and so on.

  7. Collapse each run of equal adjacent values into one value.

  8. Replace every value with its square.

  9. Replace every value with the largest value seen so far.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Remove every negative value.

  12. Replace every value with the largest of itself and the up to 3 values before it.

  13. Keep only the last 3 values, in their order (all of them if there are fewer).

  14. Keep only the first 3 values (all of them if there are fewer).

  15. Clamp every value into the range -3 to 2, both inclusive.

  16. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  17. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  18. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `compute([9, 9, 21]) returns 0`.


  Return only the code.'
