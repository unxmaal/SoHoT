prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Swap the case of every letter.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  5. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Keep only the first occurrence of each character.

  8. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  10. Collapse every run of the same character into one character.

  11. Remove every digit.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Convert to lowercase.

  14. Remove every digit.

  15. Keep only the first 2 whitespace-separated words, joined by single spaces.

  16. Convert to uppercase.

  17. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  18. Remove every digit.

  19. Swap the case of every letter.

  20. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''bbA axz,bBa'') returns ''p,.''`.


  Return only the code.'
