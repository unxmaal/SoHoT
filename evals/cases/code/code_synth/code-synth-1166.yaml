prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Replace every ''s'' with ''n'' (lowercase only).

  3. Remove every digit.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Replace every ''c'' with ''d'' (lowercase only).

  6. Keep only the first 3 whitespace-separated words, joined by single spaces.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Convert to lowercase.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  12. Convert to lowercase.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''yC2Cc2 Ax'') returns ''1i1h1d1''`.


  Return only the code.'
