prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Clamp every value into the range 1 to 10, both inclusive.

  4. Remove every negative value.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Replace every value with its square.

  8. Keep only the first 2 values (all of them if there are fewer).

  9. Replace every value with the largest value seen so far.

  10. Keep only the first 5 values (all of them if there are fewer).

  Then: Return the resulting list.


  Example: `apply_rules([-9, -5, 4, 1, -6, 12, 21, 6, 11]) returns [1, 4]`.


  Return only the code.'
