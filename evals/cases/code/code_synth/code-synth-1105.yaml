prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Clamp every value into the range -3 to 2, both inclusive.

  2. Replace every value with the largest of itself and the up to 2 values before it.

  3. Multiply every value by -2.

  4. Clamp every value into the range 1 to 9, both inclusive.

  5. Keep only the first 2 values (all of them if there are fewer).

  6. Keep only the last 3 values, in their order (all of them if there are fewer).

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Keep the values at indices 0, 2, 4, and so on.

  10. Keep only the even values.

  11. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Collapse each run of equal adjacent values into one value.

  14. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([22, 3, -5, 4, 20, -8, 23]) returns [2]`.


  Return only the code.'
