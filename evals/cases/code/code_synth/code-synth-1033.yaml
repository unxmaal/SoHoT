prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 1 values before it.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Keep only the last 4 values, in their order (all of them if there are fewer).

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Keep the values at indices 0, 2, 4, and so on.

  10. Keep only the even values.

  11. Remove every negative value.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Keep only the even values.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  15. Replace every value with the largest of itself and the up to 1 values before it.

  16. Replace every value with its square.

  Then: Return the sum of the values (0 for an empty list).


  Example: `process([10, 12, -1, 16, 5]) returns 144`.


  Return only the code.'
