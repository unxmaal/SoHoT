prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Replace every ''c'' with ''l'' (lowercase only).

  4. Convert to uppercase.

  5. Keep only the first occurrence of each character.

  6. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Swap the case of every letter.

  8. Convert to uppercase.

  Then: Return how many characters it has.


  Example: `apply_rules(''bC1A C0bzB1c0.b'') returns 9`.


  Return only the code.'
