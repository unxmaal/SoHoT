prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Swap the case of every letter.

  3. Convert to uppercase.

  4. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  5. Keep only the first occurrence of each character.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Convert to lowercase.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Collapse every run of the same character into one character.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Keep only the first 4 whitespace-separated words, joined by single spaces.

  12. Swap the case of every letter.

  13. Keep only the first occurrence of each character.

  14. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Sort the characters in ascending code point order.

  17. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  18. Keep only the first occurrence of each character.

  19. Replace every ''l'' with ''n'' (lowercase only).

  20. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the resulting string.


  Example: `solve(''2,AzB0cA'') returns '',.1bcz''`.


  Return only the code.'
