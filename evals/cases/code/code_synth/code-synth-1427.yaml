prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep the values at indices 0, 2, 4, and so on.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Reverse the list.

  4. Keep only the last 2 values, in their order (all of them if there are fewer).

  5. Reverse the list.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Sort descending.

  8. Keep only the first 4 values (all of them if there are fewer).

  9. Replace every value with its square.

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  12. Sort ascending.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Keep only the first 2 values (all of them if there are fewer).

  15. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  16. Sort descending.

  17. Remove every negative value.

  18. Remove duplicates, keeping the first occurrence of each value.

  19. Keep the values at indices 0, 3, 6, and so on.

  20. Reverse the list.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([9, -4, 0, -10, 24, -2, 14, 11]) returns 481`.


  Return only the code.'
