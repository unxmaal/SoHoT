prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Sort the characters in ascending code point order.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Keep only the first occurrence of each character.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Convert to uppercase.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `reduce_data(''y,AcByzA.B0yxA c'') returns ''111,1.13121B1C1X1Y1Z''`.


  Return only the code.'
