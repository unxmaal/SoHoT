  2. Add -9 to every value.

  3. Sort descending.

  4. Multiply every value by 3.

  5. Clamp every value into the range 1 to 8, both inclusive.

  6. Remove every negative value.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Replace every value with its absolute value.

  12. Reverse the list.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Keep only the values greater than -2.

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([18, 16, 23, 17, 1, 7, -3, 12]) returns 8`.


  Return only the code.'
