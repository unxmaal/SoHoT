prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  2. Reverse the list.

  3. Sort descending.

  4. Drop the first 2 values (an empty list if there are fewer).

  5. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Replace every value with the largest value seen so far.

  8. Replace every value with the largest of itself and the up to 3 values before it.

  9. Keep only the values greater than -1.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Add 9 to every value.

  12. Keep the values at indices 0, 2, 4, and so on.

  13. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  14. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([16, 18, 6, 19, 20, 15, -4, -4, 13]) returns [8]`.


  Return only the code.'
