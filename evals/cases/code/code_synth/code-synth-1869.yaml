prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the first 5 values (all of them if there are fewer).

  2. Reverse the list.

  3. Replace every value with the largest of itself and the up to 2 values before it.

  4. Keep only the first 4 values (all of them if there are fewer).

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  7. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  10. Remove every negative value.

  11. Sort ascending.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Sort ascending.

  14. Collapse each run of equal adjacent values into one value.

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Replace every value with its absolute value.

  17. Replace every value with the largest value seen so far.

  18. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  Then: Return how many distinct values there are.


  Example: `process([7, 20, 23, 16, -5, 20]) returns 3`.


  Return only the code.'
