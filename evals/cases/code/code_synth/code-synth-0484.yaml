prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Convert to uppercase.

  6. Swap the case of every letter.

  7. Remove every digit.

  8. Keep only the first occurrence of each character.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `reduce_data('' z C,c,Ba y0'') returns '' ''`.


  Return only the code.'
