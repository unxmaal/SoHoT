prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort by absolute value, values with equal absolute value keeping their current relative order.

  2. Multiply every value by 5.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Replace every value with the largest value seen so far.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  7. Keep only the values greater than 0.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Replace every value with its square.

  10. Remove every negative value.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Add 9 to every value.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  15. Collapse each run of equal adjacent values into one value.

  16. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  17. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  18. Keep only the last 5 values, in their order (all of them if there are fewer).

  19. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  20. Collapse each run of equal adjacent values into one value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `transform([5, 14, -3, 11, -10, 22, 2, -7, 10]) returns [0, 1]`.


  Return only the code.'
