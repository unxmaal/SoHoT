prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  2. Replace every maximal run of digits with the number of digits in it.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Keep only the first occurrence of each character.

  5. Sort the characters in ascending code point order.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Replace every maximal run of digits with the number of digits in it.

  8. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Keep only the first 4 whitespace-separated words, joined by single spaces.

  10. Convert to uppercase.

  11. Replace every ''l'' with ''r'' (lowercase only).

  12. Swap the case of every letter.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Collapse every run of the same character into one character.

  16. Swap the case of every letter.

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Sort the characters in ascending code point order.

  Then: Return the resulting string.


  Example: `solve(''Ayyzyzxya,y1'') returns ''1111ABYZ''`.


  Return only the code.'
