  1. Replace every value with its absolute value.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Add -5 to every value.

  6. Multiply every value by 3.

  7. Replace every value with the largest value seen so far.

  8. Sort ascending.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Reverse the list.

  14. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  Then: Return the sum of the values (0 for an empty list).


  Example: `solve([2, 11, 10, -5, 8]) returns 12`.


  Return only the code.'
