prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Swap the case of every letter.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Swap the case of every letter.

  6. Replace every ''o'' with ''t'' (lowercase only).

  7. Keep only the first occurrence of each character.

  8. Replace every ''b'' with ''l'' (lowercase only).

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Convert to uppercase.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Swap the case of every letter.

  13. Keep only the first occurrence of each character.

  14. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  15. Swap the case of every letter.

  16. Remove every digit.

  17. Collapse every run of the same character into one character.

  18. Keep only the first 3 whitespace-separated words, joined by single spaces.

  19. Convert to uppercase.

  20. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return how many characters it has.


  Example: `process(''Acx22.cbxb'') returns 4`.


  Return only the code.'
