prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Replace every value with its square.

  5. Sort ascending.

  6. Replace every value with the largest value seen so far.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `run_pipeline([-3, 17, 7, -9, 18, 1]) returns 1`.


  Return only the code.'
