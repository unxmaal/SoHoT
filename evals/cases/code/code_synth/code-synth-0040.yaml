  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  5. Drop the first 2 values (an empty list if there are fewer).

  6. Sort ascending.

  7. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  8. Sort ascending.

  9. Multiply every value by -1.

  10. Keep only the first 5 values (all of them if there are fewer).

  Then: Return the resulting list.


  Example: `compute([-6, 9, 21, 21, 17]) returns [-3]`.


  Return only the code.'
