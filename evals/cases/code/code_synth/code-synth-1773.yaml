prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Replace every value with the largest of itself and the up to 1 values before it.

  5. Keep only the first 3 values (all of them if there are fewer).

  6. Remove every negative value.

  7. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  8. Replace every value with the largest value seen so far.

  9. Keep only the even values.

  10. Keep the values at indices 0, 3, 6, and so on.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Collapse each run of equal adjacent values into one value.

  13. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  14. Reverse the list.

  Then: Return the resulting list.


  Example: `transform([17, 25, 4, -2, 6]) returns [6]`.


  Return only the code.'
