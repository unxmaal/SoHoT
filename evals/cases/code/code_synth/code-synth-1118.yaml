prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Sort the characters in ascending code point order.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Replace every ''e'' with ''r'' (lowercase only).

  6. Convert to lowercase.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Replace every ''b'' with ''r'' (lowercase only).

  10. Convert to uppercase.

  11. Keep only the first occurrence of each character.

  12. Collapse every run of the same character into one character.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Sort the characters in ascending code point order.

  16. Replace runs of whitespace with a single space and strip both ends.

  17. Convert to uppercase.

  18. Convert to lowercase.

  19. Keep only the first occurrence of each character.

  20. Convert to uppercase.

  Then: Return the resulting string.


  Example: `solve(''B1a.A,yc2'') returns '',.12CRY''`.


  Return only the code.'
