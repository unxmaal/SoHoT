prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Reverse the list.

  2. Replace every value with its absolute value.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Reverse the list.

  5. Replace every value with the largest of itself and the up to 1 values before it.

  6. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Drop the first 3 values (an empty list if there are fewer).

  9. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  10. Replace every value with the largest of itself and the up to 1 values before it.

  11. Drop the first 1 values (an empty list if there are fewer).

  12. Collapse each run of equal adjacent values into one value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `process([-5, -1, 11, 0]) returns 0`.


  Return only the code.'
