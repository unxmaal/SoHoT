prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace every value with its square.

  4. Replace every value with its absolute value.

  5. Collapse each run of equal adjacent values into one value.

  6. Sort descending.

  7. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  8. Collapse each run of equal adjacent values into one value.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `reduce_data([-9, -6, 2, 20, 3, 16, 24, 21, 21]) returns 242`.


  Return only the code.'
