  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Replace every ''b'' with ''d'' (lowercase only).

  12. Keep only the first 2 whitespace-separated words, joined by single spaces.

  13. Collapse every run of the same character into one character.

  14. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
