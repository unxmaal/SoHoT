  5. Replace every maximal run of digits with the number of digits in it.

  6. Convert to uppercase.

  7. Convert to lowercase.

  8. Convert to uppercase.

  9. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
