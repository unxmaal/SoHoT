prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Keep only the values greater than 1.

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Replace every value with its absolute value.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return how many distinct values there are.


  Example: `reduce_data([15, 7, -3, 18, -4, 10, -9]) returns 1`.


  Return only the code.'
