prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Multiply every value by -2.

  5. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  6. Replace every value with the largest of itself and the up to 3 values before it.

  7. Add 2 to every value.

  8. Keep only the first 6 values (all of them if there are fewer).

  9. Replace every value with the largest of itself and the up to 3 values before it.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Sort descending.

  13. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  14. Keep only the last 4 values, in their order (all of them if there are fewer).

  15. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  16. Replace every value with its square.

  Then: Return the resulting list.


  Example: `transform([17, -3, 12, 17, 9, -12]) returns [1]`.


  Return only the code.'
