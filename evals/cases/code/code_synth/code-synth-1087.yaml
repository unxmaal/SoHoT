  4. Replace every value with its absolute value.

  5. Sort ascending.

  6. Replace every value with its square.

  7. Sort descending.

  8. Reverse the list.

  9. Add -9 to every value.

  10. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  11. Keep only the first 3 values (all of them if there are fewer).

  12. Replace every value with the largest of itself and the up to 2 values before it.

  13. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  14. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  15. Replace every value with the largest of itself and the up to 1 values before it.

  16. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  17. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  18. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `transform([6, 1, 8, 4, 23, 10, -9, 18]) returns 0`.


  Return only the code.'
