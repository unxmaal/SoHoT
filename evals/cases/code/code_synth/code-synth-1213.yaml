  3. Multiply every value by -2.

  4. Keep only the even values.

  5. Multiply every value by 3.

  6. Keep only the first 6 values (all of them if there are fewer).

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Add 6 to every value.

  9. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  10. Collapse each run of equal adjacent values into one value.

  11. Keep the values at indices 0, 3, 6, and so on.

  12. Keep only the last 2 values, in their order (all of them if there are fewer).

  13. Keep only the even values.

  14. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `transform([0, 7, -11, 20, -1]) returns 60`.


  Return only the code.'
