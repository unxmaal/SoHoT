prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to uppercase.

  2. Keep only the first 2 whitespace-separated words, joined by single spaces.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Remove every digit.

  5. Convert to uppercase.

  6. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Remove every digit.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Convert to lowercase.

  10. Keep only the first occurrence of each character.

  11. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  12. Keep only the first 3 whitespace-separated words, joined by single spaces.

  13. Collapse every run of the same character into one character.

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Convert to lowercase.

  Then: Return the resulting string.


  Example: `run_pipeline(''xbbcx. x0 yBByC '') returns ''.mlh .''`.


  Return only the code.'
