prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Replace every maximal run of digits with the number of digits in it.

  3. Convert to uppercase.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Keep only the first occurrence of each character.

  6. Keep only the first 2 whitespace-separated words, joined by single spaces.

  7. Sort the characters in ascending code point order.

  8. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Keep only the first occurrence of each character.

  13. Convert to uppercase.

  14. Convert to lowercase.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Sort the characters in ascending code point order.

  17. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  18. Replace runs of whitespace with a single space and strip both ends.

  19. Replace every ''s'' with ''r'' (lowercase only).

  20. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
