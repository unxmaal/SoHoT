  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Collapse every run of the same character into one character.

  3. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  4. Swap the case of every letter.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Keep only the first occurrence of each character.

  Then: Return how many characters it has.


  Example: `run_pipeline(''1xy0y BxxaB '') returns 4`.


  Return only the code.'
