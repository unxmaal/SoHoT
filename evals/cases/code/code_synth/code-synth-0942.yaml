prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Swap the case of every letter.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Collapse every run of the same character into one character.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Replace every ''o'' with ''e'' (lowercase only).

  6. Convert to uppercase.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Replace every ''e'' with ''l'' (lowercase only).

  9. Remove every digit.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''aB1z1,,2C1B'') returns ''1a1b1z1,1c1B''`.


  Return only the code.'
