prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  3. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Replace every value with the largest value seen so far.

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Add -9 to every value.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Keep only the even values.

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  13. Collapse each run of equal adjacent values into one value.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Replace every value with the largest of itself and the up to 2 values before it.

  16. Add 2 to every value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([-9, 0, -7, -12, 22, 25, -8, 11, -3]) returns 0`.


  Return only the code.'
