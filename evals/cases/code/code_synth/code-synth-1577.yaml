prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the first 6 values (all of them if there are fewer).

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Keep only the last 3 values, in their order (all of them if there are fewer).

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  6. Replace every value with the largest value seen so far.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Sort ascending.

  9. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  10. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  11. Replace every value with the largest of itself and the up to 2 values before it.

  12. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  13. Collapse each run of equal adjacent values into one value.

  14. Multiply every value by 2.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `process([6, 20, -4, 0, 9, -3]) returns 0`.


  Return only the code.'
