prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Remove every digit.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Swap the case of every letter.

  12. Sort the characters in ascending code point order.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Replace every ''c'' with ''t'' (lowercase only).

  Then: Return how many characters it has.


  Example: `apply_rules(''aCBAa 0cc 01ycc'') returns 8`.


  Return only the code.'
