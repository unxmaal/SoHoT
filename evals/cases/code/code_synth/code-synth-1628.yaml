  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Convert to lowercase.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Keep only the first 3 whitespace-separated words, joined by single spaces.

  10. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Swap the case of every letter.

  12. Keep only the first 4 whitespace-separated words, joined by single spaces.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Convert to uppercase.

  16. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the number of words (whitespace-separated).


  Example: `transform(''.xC1B ,bx,.ac'') returns 2`.


  Return only the code.'
