  3. Convert to uppercase.

  4. Collapse every run of the same character into one character.

  5. Remove every digit.

  6. Swap the case of every letter.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the number of words (whitespace-separated).


  Example: `reduce_data(''xc..2.C1z'') returns 1`.


