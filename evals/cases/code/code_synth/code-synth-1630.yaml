  1. Convert to uppercase.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  10. Keep only the first 3 whitespace-separated words, joined by single spaces.

  11. Keep only the first occurrence of each character.

  12. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Keep only the first occurrence of each character.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
