  1. Keep only the values greater than 1.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Add 2 to every value.

  5. Sort descending.

  6. Replace every value with its square.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Reverse the list.

  9. Keep the values at indices 0, 2, 4, and so on.

  10. Multiply every value by 3.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([1, 18, -1, 13, 7, 10]) returns 75`.


  Return only the code.'
