prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  4. Replace every value with the largest of itself and the up to 1 values before it.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Keep only the last 5 values, in their order (all of them if there are fewer).

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Sort ascending.

  9. Replace every value with the largest value seen so far.

  10. Sort ascending.

  11. Clamp every value into the range 1 to 6, both inclusive.

  12. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  13. Add 2 to every value.

  14. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  15. Multiply every value by -2.

  16. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  17. Replace every value with its absolute value.

  18. Sort ascending.

  19. Drop the first 1 values (an empty list if there are fewer).

  20. Sort ascending.

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([-3, 22, -2, -6, -12, -1, -9, 0, 6]) returns 0`.


  Return only the code.'
