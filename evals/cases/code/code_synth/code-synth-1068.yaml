prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Convert to uppercase.

  6. Remove every digit.

  7. Convert to lowercase.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  10. Convert to lowercase.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  13. Remove every digit.

  14. Remove every vowel (a, e, i, o, u, either case).

  15. Collapse every run of the same character into one character.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Reverse the order of the whitespace-separated words and join them with single spaces.

  18. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''B cBBy.c'') returns ''.BCY''`.


  Return only the code.'
