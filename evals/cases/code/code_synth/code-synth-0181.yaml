prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  3. Replace every value with its square.

  4. Replace every value with the largest value seen so far.

  5. Add -1 to every value.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Reverse the list.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `run_pipeline([0, 22, -9, 24, -6, 7, 8, 3, 14]) returns 3841`.


  Return only the code.'
