  1. Keep only the first occurrence of each character.

  2. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  3. Keep only the first 2 whitespace-separated words, joined by single spaces.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Replace every ''t'' with ''a'' (lowercase only).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''Cc1,a1,bxyb.c.'') returns ''Ii1,ghde.''`.


  Return only the code.'
