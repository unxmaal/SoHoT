prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the last 5 values, in their order (all of them if there are fewer).

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Multiply every value by 2.

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Replace every value with its square.

  8. Replace every value with the largest value seen so far.

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Keep only the even values.

  12. Collapse each run of equal adjacent values into one value.

  13. Sort descending.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  15. Keep only the even values.

  16. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the resulting list.


  Example: `run_pipeline([2, 12, 25, 19, -2, -1, 20]) returns [1352]`.


  Return only the code.'
