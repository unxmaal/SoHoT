prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Sort the characters in ascending code point order.

  5. Remove every digit.

  6. Swap the case of every letter.

  7. Convert to uppercase.

  8. Sort the characters in ascending code point order.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Convert to uppercase.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Replace every ''e'' with ''o'' (lowercase only).

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Collapse every run of the same character into one character.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `reduce_data(''x02A.C c2z,c,'') returns ''HFC.,''`.


  Return only the code.'
