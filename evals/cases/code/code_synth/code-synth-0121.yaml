  - reduce_data([]) == -1
  - reduce_data([1]) == 0
  - reduce_data([7, -7, 0, 12]) == 0
  - reduce_data([4, 25, -8, 0, 1, -4, 9, -5]) == 2
  - reduce_data([22, -11, 16, 2, -5, -10]) == 2
  - reduce_data([-6, 8, -12]) == 1
