prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Replace every value with the largest of itself and the up to 1 values before it.

  3. Add 2 to every value.

  4. Keep only the first 3 values (all of them if there are fewer).

  5. Clamp every value into the range 1 to 9, both inclusive.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Add 4 to every value.

  8. Multiply every value by 2.

  9. Keep only the first 5 values (all of them if there are fewer).

  10. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `reduce_data([6, 13, -3, 11]) returns 1`.


  Return only the code.'
assert:
