  8. Sort the characters in ascending code point order.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Replace every ''s'' with ''a'' (lowercase only).

