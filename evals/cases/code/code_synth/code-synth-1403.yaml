prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  2. Keep only the values greater than 3.

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Keep only the first 5 values (all of them if there are fewer).

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Keep only the even values.

  8. Collapse each run of equal adjacent values into one value.

  9. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  10. Replace every value with its absolute value.

  11. Multiply every value by -2.

  12. Add 9 to every value.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Replace every value with the largest of itself and the up to 2 values before it.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `solve([1, 14, 22, -8, -11, 5, 8, 2]) returns [5, 7]`.


  Return only the code.'
