prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the last 3 values, in their order (all of them if there are fewer).

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Sort ascending.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Replace every value with the largest value seen so far.

  6. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([15, 0, 19, 20, -8, 15, 24, -3]) returns 102`.


  Return only the code.'
