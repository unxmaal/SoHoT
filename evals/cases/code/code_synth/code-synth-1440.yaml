prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the order of the whitespace-separated words and join them with single spaces.

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  6. Convert to uppercase.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Collapse every run of the same character into one character.

  9. Convert to uppercase.

  10. Remove every digit.

  11. Convert to uppercase.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Keep only the first occurrence of each character.

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Remove every digit.

  16. Replace runs of whitespace with a single space and strip both ends.

  17. Swap the case of every letter.

  18. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''ByxAaCxz 1.'') returns ''gdh''`.


  Return only the code.'
