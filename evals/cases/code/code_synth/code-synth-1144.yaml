prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every digit.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Convert to lowercase.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Replace every ''o'' with ''n'' (lowercase only).

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Convert to uppercase.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Keep only the first occurrence of each character.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Convert to uppercase.

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Replace every maximal run of digits with the number of digits in it.

  19. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  20. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `process(''.C.C2a.1.yb.,2Ac'') returns ''.''`.


  Return only the code.'
