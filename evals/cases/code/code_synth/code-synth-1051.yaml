prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the last 3 values, in their order (all of them if there are fewer).

  2. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Collapse each run of equal adjacent values into one value.

  5. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  6. Clamp every value into the range -1 to 6, both inclusive.

  7. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  9. Add -3 to every value.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  12. Replace every value with its absolute value.

  13. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  14. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  Then: Return the sum of the values (0 for an empty list).


  Example: `process([17, -2, -1]) returns 4`.


  Return only the code.'
