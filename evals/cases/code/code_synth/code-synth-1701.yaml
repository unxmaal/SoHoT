prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the last 3 values, in their order (all of them if there are fewer).

  2. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Collapse each run of equal adjacent values into one value.

  5. Sort ascending.

  6. Replace every value with the largest value seen so far.

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  12. Drop the first 1 values (an empty list if there are fewer).

  13. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  14. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  15. Multiply every value by -2.

  16. Sort ascending.

  17. Add -3 to every value.

  18. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  19. Replace every value with the largest of itself and the up to 1 values before it.

  20. Reverse the list.

  Then: Return the resulting list.


  Example: `run_pipeline([-11, 23, 22]) returns [-13]`.


  Return only the code.'
