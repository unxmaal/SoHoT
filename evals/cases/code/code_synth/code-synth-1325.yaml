prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Replace every value with its absolute value.

  3. Replace every value with its square.

  4. Keep only the values greater than 7.

  5. Replace every value with its absolute value.

  6. Multiply every value by -1.

  7. Replace every value with the largest value seen so far.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  9. Replace every value with its square.

  10. Collapse each run of equal adjacent values into one value.

  11. Clamp every value into the range -1 to 2, both inclusive.

  12. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  13. Sort descending.

  14. Remove every negative value.

  15. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  16. Replace every value with its square.

  17. Collapse each run of equal adjacent values into one value.

  18. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return the resulting list.


  Example: `transform([-6, 1, 17, 3, 23, 0]) returns [4]`.


  Return only the code.'
