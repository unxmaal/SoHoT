  4. Convert to uppercase.

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Collapse every run of the same character into one character.

  7. Convert to lowercase.

  8. Keep only the first occurrence of each character.

  9. Replace every ''o'' with ''c'' (lowercase only).

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Collapse every run of the same character into one character.

  12. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
