  8. Clamp every value into the range 1 to 5, both inclusive.

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Replace every value with the largest value seen so far.

  11. Replace every value with its square.

  12. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([23, -11, -5, 0, 18]) returns 25`.


  Return only the code.'
