  13. Sort ascending.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  15. Remove every negative value.

  16. Replace every value with its square.

  17. Add -5 to every value.

  18. Sort by absolute value, values with equal absolute value keeping their current relative order.

  19. Sort ascending.

  20. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
