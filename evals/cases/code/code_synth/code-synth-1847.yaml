  5. Replace every value with its absolute value.

  6. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  7. Drop the first 2 values (an empty list if there are fewer).

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  10. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  11. Keep only the even values.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
