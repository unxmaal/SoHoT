prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Sort descending.

  3. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Collapse each run of equal adjacent values into one value.

  6. Keep the values at indices 0, 3, 6, and so on.

  7. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  8. Remove every negative value.

  9. Sort descending.

  10. Keep only the first 5 values (all of them if there are fewer).

  11. Replace every value with the largest of itself and the up to 1 values before it.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Add 2 to every value.

  14. Remove duplicates, keeping the first occurrence of each value.

  15. Collapse each run of equal adjacent values into one value.

  16. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  17. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  18. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the resulting list.


  Example: `reduce_data([-6, -1, 14, 4]) returns [1]`.


  Return only the code.'
