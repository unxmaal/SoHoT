  2. Replace every value with the largest value seen so far.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Replace every value with its absolute value.

  5. Replace every value with the largest value seen so far.

  6. Drop the first 3 values (an empty list if there are fewer).

  7. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  8. Add 4 to every value.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Keep only the first 6 values (all of them if there are fewer).

  11. Multiply every value by 2.

  12. Keep only the last 5 values, in their order (all of them if there are fewer).

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  15. Collapse each run of equal adjacent values into one value.

  16. Drop the first 2 values (an empty list if there are fewer).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `apply_rules([23, 19, 22, 9, 7, 24, 11, 3, 22]) returns 2`.


  Return only the code.'
