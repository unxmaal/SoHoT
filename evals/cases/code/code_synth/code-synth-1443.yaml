  3. Clamp every value into the range 0 to 9, both inclusive.

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Multiply every value by -1.

  7. Keep only the even values.

  8. Replace every value with its absolute value.

  9. Keep only the first 6 values (all of them if there are fewer).

  10. Sort descending.

  11. Remove every negative value.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Keep only the last 2 values, in their order (all of them if there are fewer).

  15. Clamp every value into the range 0 to 7, both inclusive.

  16. Keep only the first 6 values (all of them if there are fewer).

  17. Keep only the last 3 values, in their order (all of them if there are fewer).

  18. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  19. Multiply every value by 5.

  20. Replace every value with the largest of itself and the up to 2 values before it.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
