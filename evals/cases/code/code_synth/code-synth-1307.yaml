  6. Sort ascending.

  7. Collapse each run of equal adjacent values into one value.

  8. Keep only the even values.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Sort ascending.

  11. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  12. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  13. Add -9 to every value.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Multiply every value by 3.

  16. Keep only the last 2 values, in their order (all of them if there are fewer).

  17. Replace every value with its square.

  18. Multiply every value by -2.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `transform([6, 25, 25, 4]) returns [-1152]`.


  Return only the code.'
