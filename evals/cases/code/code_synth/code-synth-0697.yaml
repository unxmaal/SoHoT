prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''mul'', ''drop'', ''sub'': dup copies
  the top value onto the stack; mul pops two values and pushes their product; drop removes the top value;
  sub pops b then a and pushes a - b, so the value pushed first is a. An operation that needs more values
  than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''drop'', ''mul'', ''dup'', ''mul'', 2, ''drop'']) returns []`.


  Return only the code.'
assert:
  checks:
  - run_program([-2, 'sub', -3, 'drop', 'drop', -3, 6, 8]) == [-3, 6, 8]
  - run_program([-2, 'mul', 7, 2, 'mul', 'drop', 3]) == [-2, 3]
  - run_program(['drop', 0, 'drop']) == []
  - run_program(['mul', 'sub', 'mul']) == []
  - run_program([1, 'sub', 9, 9, 'drop', 'sub', 7, -2, 'mul']) == [-8, -14]
  - run_program([1, 0, 'drop', 5, 'mul', 'dup', 'drop']) == [5]
