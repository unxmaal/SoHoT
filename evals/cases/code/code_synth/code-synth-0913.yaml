prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''drop'', ''dup'', ''add'', ''over'': drop removes
  the top value; dup copies the top value onto the stack; add pops two values and pushes their sum; over
  pushes a copy of the second value from the top. An operation that needs more values than the stack has
  does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([8, ''add'', ''add'', 7, ''over'']) returns [8, 7, 8]`.


  Return only the code.'
assert:
  checks:
  - run_program([6, 'add', 'drop', 'over']) == []
  - run_program([8, 'dup', 8, 'add', 'drop']) == [8]
