prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Keep only the values greater than -1.

  3. Add 6 to every value.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Drop the first 1 values (an empty list if there are fewer).

  6. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  7. Remove every negative value.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Add -9 to every value.

  10. Reverse the list.

  11. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  12. Keep only the first 6 values (all of them if there are fewer).

  13. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  14. Replace every value with its square.

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Keep only the first 5 values (all of them if there are fewer).

  17. Add -1 to every value.

  18. Replace every value with the largest of itself and the up to 1 values before it.

  Then: Return the resulting list.


  Example: `run_pipeline([-1, 1, 12, -2]) returns [3]`.


  Return only the code.'
