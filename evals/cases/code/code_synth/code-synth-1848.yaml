  4. Keep only the first 4 whitespace-separated words, joined by single spaces.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Keep only the first 3 whitespace-separated words, joined by single spaces.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Remove every digit.

  9. Swap the case of every letter.

  10. Keep only the first occurrence of each character.

  11. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
