prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  3. Clamp every value into the range -2 to 6, both inclusive.

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Keep the values at indices 0, 2, 4, and so on.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  11. Multiply every value by 2.

  12. Collapse each run of equal adjacent values into one value.

  13. Sort ascending.

  14. Multiply every value by 2.

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Replace every value with its square.

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([9, -8, 17, -6, 1, 7, 15]) returns 64`.


  Return only the code.'
