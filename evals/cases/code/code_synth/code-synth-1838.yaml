prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Replace every maximal run of digits with the number of digits in it.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Sort the characters in ascending code point order.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Remove every digit.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Convert to uppercase.

  10. Sort the characters in ascending code point order.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Convert to uppercase.

  13. Swap the case of every letter.

  14. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Keep only the first 2 whitespace-separated words, joined by single spaces.

  16. Remove every digit.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''1cyb0Bca1Caac0'') returns ''gkkkkjj''`.


  Return only the code.'
