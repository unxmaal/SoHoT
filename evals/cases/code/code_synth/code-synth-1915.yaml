  2. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  3. Add -3 to every value.

  4. Keep the values at indices 0, 3, 6, and so on.

  5. Replace every value with the largest value seen so far.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Replace every value with its absolute value.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Keep only the last 4 values, in their order (all of them if there are fewer).

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Remove every negative value.

  12. Replace every value with its square.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `solve([1, -12, -9, -5]) returns [4]`.


  Return only the code.'
