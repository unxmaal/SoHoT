  2. Convert to uppercase.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Convert to uppercase.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Convert to lowercase.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Keep only the first occurrence of each character.

  10. Convert to uppercase.

  11. Remove every digit.

  12. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''bb.CCAyC'') returns ''B.CAY''`.


  Return only the code.'
