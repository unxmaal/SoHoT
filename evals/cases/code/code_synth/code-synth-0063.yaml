  2. Keep only the first 6 values (all of them if there are fewer).

  3. Sort ascending.

  4. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Add -9 to every value.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([21, 25, 24]) returns 15`.


  Return only the code.'
