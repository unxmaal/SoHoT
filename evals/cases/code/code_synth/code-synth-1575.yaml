  8. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

