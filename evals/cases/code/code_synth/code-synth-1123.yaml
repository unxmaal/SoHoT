prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  2. Collapse each run of equal adjacent values into one value.

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Keep only the values greater than 5.

  6. Reverse the list.

  7. Sort ascending.

  8. Keep only the values greater than -3.

  9. Reverse the list.

  10. Replace every value with its square.

  11. Keep the values at indices 0, 2, 4, and so on.

  12. Replace every value with the largest value seen so far.

  13. Sort ascending.

  14. Keep the values at indices 0, 2, 4, and so on.

  15. Keep only the values greater than -1.

  16. Sort ascending.

  17. Replace every value with its square.

  18. Sort descending.

  19. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  20. Keep only the last 5 values, in their order (all of them if there are fewer).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `run_pipeline([8, 20, 7]) returns 4096`.


  Return only the code.'
