prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  2. Replace every value with the largest value seen so far.

  3. Keep only the first 5 values (all of them if there are fewer).

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Drop the first 1 values (an empty list if there are fewer).

  6. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  7. Sort descending.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Replace every value with its absolute value.

  10. Replace every value with the largest value seen so far.

  11. Remove every negative value.

  12. Replace every value with its square.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Replace every value with its absolute value.

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Sort by absolute value, values with equal absolute value keeping their current relative order.

  17. Drop the first 1 values (an empty list if there are fewer).

  18. Replace every value with the largest of itself and the up to 2 values before it.

  Then: Return the resulting list.


  Example: `run_pipeline([-2, 6, -9, -10, 9, -7, -10]) returns [2]`.


  Return only the code.'
