  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Add -5 to every value.

  7. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  8. Add -3 to every value.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


