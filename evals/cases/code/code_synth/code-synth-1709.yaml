prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Reverse the list.

  3. Collapse each run of equal adjacent values into one value.

  4. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  5. Reverse the list.

  6. Multiply every value by -2.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Sort descending.

  9. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Clamp every value into the range -4 to 3, both inclusive.

  12. Reverse the list.

  13. Multiply every value by -2.

  14. Reverse the list.

  15. Keep only the values greater than -3.

  16. Keep only the even values.

  Then: Return the resulting list.


  Example: `reduce_data([17, -9, -10, 17, -3, 3, 5, 20]) returns [8, 8, 8]`.


  Return only the code.'
