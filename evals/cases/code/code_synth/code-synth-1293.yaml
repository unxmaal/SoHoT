prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  3. Keep only the first 3 values (all of them if there are fewer).

  4. Sort descending.

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Keep only the last 5 values, in their order (all of them if there are fewer).

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Replace every value with the largest value seen so far.

  9. Sort ascending.

  10. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Replace every value with the largest value seen so far.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  15. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  16. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `transform([18, -2, -7]) returns 0`.


  Return only the code.'
