prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 2 values before it.

  2. Sort ascending.

  3. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  4. Add 2 to every value.

  5. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Replace every value with the largest value seen so far.

  8. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  9. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  10. Keep the values at indices 0, 2, 4, and so on.

  11. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  12. Clamp every value into the range -1 to 6, both inclusive.

  13. Replace every value with its square.

  14. Keep only the values greater than 1.

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([2, -12, 18, -10, 2, 10, 19, 0, 17]) returns 1`.


  Return only the code.'
