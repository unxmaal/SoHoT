prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  2. Sort the characters in ascending code point order.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Replace every maximal run of digits with the number of digits in it.

  5. Keep only the first occurrence of each character.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Convert to uppercase.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Sort the characters in ascending code point order.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Collapse every run of the same character into one character.

  13. Sort the characters in ascending code point order.

  14. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  15. Convert to uppercase.

  16. Replace every ''r'' with ''n'' (lowercase only).

  17. Convert to uppercase.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute(''z0c. 2.y'') returns ''.2CZ.''`.


  Return only the code.'
