prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''add'', ''sub'', ''over'', ''swap'': add pops
  two values and pushes their sum; sub pops b then a and pushes a - b, so the value pushed first is a;
  over pushes a copy of the second value from the top; swap exchanges the top two values. An operation
  that needs more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''sub'', 6, -2, ''sub'', ''swap'', 0, ''over'', -1, ''add'']) returns [8, 0,
  7]`.


  Return only the code.'
