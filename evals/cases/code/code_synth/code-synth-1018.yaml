prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''add'', ''mul'', ''swap'': dup copies
  the top value onto the stack; add pops two values and pushes their sum; mul pops two values and pushes
  their product; swap exchanges the top two values. An operation that needs more values than the stack
  has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''swap'', 7, ''add'', 8, ''swap'', ''swap'', ''add'', ''add'', ''dup'']) returns
  [15, 15]`.


  Return only the code.'
