prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  5. Remove every negative value.

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Remove every negative value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([13, 6, 25, 8, 10, 1, 23, -10, 12]) returns 2`.


  Return only the code.'
