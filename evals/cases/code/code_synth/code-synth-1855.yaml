  3. Collapse each run of equal adjacent values into one value.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Collapse each run of equal adjacent values into one value.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Keep the values at indices 0, 3, 6, and so on.

  8. Replace every value with the largest of itself and the up to 3 values before it.

  9. Reverse the list.

  10. Clamp every value into the range -3 to 2, both inclusive.

  11. Multiply every value by 5.

  12. Keep only the values greater than -2.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  Then: Return the resulting list.


  Example: `transform([24, 4, 11, 24]) returns [1]`.


  Return only the code.'
