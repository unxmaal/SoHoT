  3. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Keep only the first occurrence of each character.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Replace every ''t'' with ''l'' (lowercase only).

  10. Convert to uppercase.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Remove every digit.

  16. Keep only the first 3 whitespace-separated words, joined by single spaces.

  17. Remove every digit.

  18. Replace every maximal run of digits with the number of digits in it.

  19. Replace runs of whitespace with a single space and strip both ends.

  20. Remove every digit.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
