prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  2. Reverse the list.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Sort ascending.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Reverse the list.

  8. Sort descending.

  9. Replace every value with its absolute value.

  10. Multiply every value by 2.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([24, 7, 24, -12]) returns 86`.


  Return only the code.'
