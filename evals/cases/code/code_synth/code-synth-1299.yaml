  3. Collapse each run of equal adjacent values into one value.

  4. Sort ascending.

  5. Keep only the even values.

  6. Collapse each run of equal adjacent values into one value.

  7. Sort descending.

  8. Multiply every value by 3.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Sort ascending.

  11. Replace every value with its absolute value.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Add -3 to every value.

  14. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  Then: Return the resulting list.


  Example: `process([-6, -4, 6, -5, 7, -2, -12]) returns [8, 3, 2, 0]`.


