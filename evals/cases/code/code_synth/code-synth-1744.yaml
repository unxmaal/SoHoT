  7. Remove every digit.

  8. Swap the case of every letter.

  9. Keep only the first occurrence of each character.

  10. Convert to lowercase.

  11. Collapse every run of the same character into one character.

  12. Replace every ''r'' with ''c'' (lowercase only).

  13. Remove every digit.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
