prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Convert to lowercase.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Remove every digit.

  7. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Remove every digit.

  11. Sort the characters in ascending code point order.

  12. Convert to uppercase.

  13. Sort the characters in ascending code point order.

  14. Remove every digit.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Collapse every run of the same character into one character.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `compute(''zBacz.b.zx2'') returns ''.''`.


  Return only the code.'
