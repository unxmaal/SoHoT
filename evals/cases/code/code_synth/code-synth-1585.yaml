  17. Replace every value with the largest value seen so far.

  18. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  19. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  20. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([7, -6, 18]) returns 1`.


  Return only the code.'
