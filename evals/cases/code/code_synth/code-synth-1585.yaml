  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Sort ascending.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Clamp every value into the range 0 to 6, both inclusive.

  10. Keep only the even values.

  11. Sort descending.

  12. Collapse each run of equal adjacent values into one value.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Replace every value with its square.

  15. Add -5 to every value.

  16. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
