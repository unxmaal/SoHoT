  4. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  5. Replace every value with its absolute value.

  6. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  7. Add 6 to every value.

  8. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  9. Replace every value with its square.

  10. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  11. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  13. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  14. Collapse each run of equal adjacent values into one value.

  15. Replace every value with its square.

  16. Keep only the last 2 values, in their order (all of them if there are fewer).

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([10, -11, 17, -6, 23, 2]) returns 4`.


  Return only the code.'
