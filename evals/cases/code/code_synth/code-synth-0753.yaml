prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''sub'', ''swap'', ''add'': dup copies
  the top value onto the stack; sub pops b then a and pushes a - b, so the value pushed first is a; swap
  exchanges the top two values; add pops two values and pushes their sum. An operation that needs more
  values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''sub'', ''dup'', ''sub'', 5, ''swap'', ''sub'', 1, 1, ''swap'']) returns [5,
  1, 1]`.


  Return only the code.'
