  5. Keep only the values greater than -2.

  6. Multiply every value by 5.

  7. Keep only the values greater than -3.

  8. Collapse each run of equal adjacent values into one value.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Replace every value with the largest of itself and the up to 1 values before it.

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Keep only the values greater than -2.

  13. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  14. Replace every value with the largest of itself and the up to 2 values before it.

  15. Keep only the even values.

  16. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  Then: Return the resulting list.


  Example: `process([10, 14, 19]) returns []`.


  Return only the code.'
