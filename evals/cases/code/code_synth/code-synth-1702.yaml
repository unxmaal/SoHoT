prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Sort the characters in ascending code point order.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Keep only the first occurrence of each character.

  8. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Collapse every run of the same character into one character.

  17. Swap the case of every letter.

  18. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''zzby0, y,yz'') returns ''111,141K111M111.''`.


  Return only the code.'
