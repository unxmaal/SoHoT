  3. Remove every vowel (a, e, i, o, u, either case).

  4. Convert to lowercase.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Keep only the first 3 whitespace-separated words, joined by single spaces.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Replace every maximal run of digits with the number of digits in it.

  9. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  10. Keep only the first 2 whitespace-separated words, joined by single spaces.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Collapse every run of the same character into one character.

  13. Convert to uppercase.

  14. Sort the characters in ascending code point order.

  15. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Swap the case of every letter.

  17. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  18. Remove every digit.

  Then: Return how many characters it has.


  Example: `compute(''bByy0,b1,x'') returns 2`.


  Return only the code.'
