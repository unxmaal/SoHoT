prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  2. Collapse each run of equal adjacent values into one value.

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Collapse each run of equal adjacent values into one value.

  5. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  6. Keep only the first 2 values (all of them if there are fewer).

  7. Add 2 to every value.

  8. Replace every value with the largest value seen so far.

  9. Keep only the last 2 values, in their order (all of them if there are fewer).

  10. Replace every value with its absolute value.

  11. Replace every value with its square.

  12. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  13. Sort descending.

  14. Sort ascending.

  15. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  16. Replace every value with the largest value seen so far.

  17. Keep only the values greater than 7.

  18. Keep only the first 3 values (all of them if there are fewer).

  19. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  20. Replace every value with the largest of itself and the up to 2 values before it.

  Then: Return the resulting list.


  Example: `compute([8, 17, 1, -4]) returns [49]`.


  Return only the code.'
