prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  2. Swap the case of every letter.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Convert to uppercase.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Convert to lowercase.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Replace every ''d'' with ''a'' (lowercase only).

  9. Convert to lowercase.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Sort the characters in ascending code point order.

  13. Replace every ''b'' with ''a'' (lowercase only).

  14. Convert to uppercase.

  15. Swap the case of every letter.

  16. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''1ABx1cBByazaBacz'') returns ''11111111jnno''`.


  Return only the code.'
