prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Reverse the list.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  5. Clamp every value into the range -5 to 3, both inclusive.

  6. Reverse the list.

  7. Keep the values at indices 0, 2, 4, and so on.

  8. Add -9 to every value.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Drop the first 1 values (an empty list if there are fewer).

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Keep the values at indices 0, 3, 6, and so on.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([-11, -2, -10, -7]) returns -1`.


  Return only the code.'
