  3. Swap the case of every letter.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  6. Sort the characters in ascending code point order.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute(''BB,cbxCy.,1'') returns '',FGJKjjk''`.


  Return only the code.'
