prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Sort ascending.

  3. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  4. Replace every value with the largest value seen so far.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace every value with the largest of itself and the up to 3 values before it.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace every value with the largest value seen so far.

  11. Add 2 to every value.

  12. Collapse each run of equal adjacent values into one value.

  13. Replace every value with the largest of itself and the up to 1 values before it.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  16. Multiply every value by 3.

  17. Sort descending.

  18. Reverse the list.

  19. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  20. Keep only the last 3 values, in their order (all of them if there are fewer).

  Then: Return the resulting list.


  Example: `solve([17, 20, 22, 18, -1, 17, 22, 22, 23]) returns [3, 0, 3]`.


  Return only the code.'
