modality: code
prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''mul'', ''add'', ''sub'', ''swap'': mul pops
  two values and pushes their product; add pops two values and pushes their sum; sub pops b then a and
  pushes a - b, so the value pushed first is a; swap exchanges the top two values. An operation that needs
  more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''add'', ''swap'', 7, ''sub'', ''swap'']) returns [7]`.


  Return only the code.'
assert:
  checks:
  - run_program([1, 'mul', 'mul', 'sub', 3, 'sub', 0, -3]) == [-2, 0, -3]
  - run_program(['mul', 'swap', 'swap', 'add', 'swap', 8]) == [8]
  - run_program([4, 'swap', 'swap', 'add', 'swap', 'mul', 8, 'swap']) == [8, 4]
  - run_program(['sub', 1, 9, 'add', 'sub', 1, 'add', -1]) == [11, -1]
  - run_program(['swap', 'sub', 'swap', 'add', 9, -2]) == [9, -2]
  - run_program(['add', 6, 6, 9, 6, 'sub']) == [6, 6, 3]
