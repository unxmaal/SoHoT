  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Replace every ''d'' with ''c'' (lowercase only).

  9. Collapse every run of the same character into one character.

  10. Replace every maximal run of digits with the number of digits in it.

