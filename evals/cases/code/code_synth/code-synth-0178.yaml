prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''swap'', ''dup'', ''add'', ''drop'': swap exchanges
  the top two values; dup copies the top value onto the stack; add pops two values and pushes their sum;
  drop removes the top value. An operation that needs more values than the stack has does nothing. Return
  the final stack as a list, bottom first.


  Example: `run_program([''swap'', ''add'', ''add'', ''swap'', 8]) returns [8]`.


  Return only the code.'
assert:
  checks:
  - run_program([6, 'dup', 'swap', 'add', 'swap', 7]) == [12, 7]
  - run_program(['swap', 'add']) == []
  - run_program(['dup', 'dup', 8, 8]) == [8, 8]
  - run_program(['drop', 'add', 'dup', 'swap']) == []
  - run_program(['add', 'swap', 'add', -1, 8, 'dup', 3, 'dup', 'dup']) == [-1, 8, 8, 3, 3, 3]
  - run_program(['swap', 4, 'dup', 'dup', 'add']) == [4, 8]
