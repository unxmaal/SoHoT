prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort ascending.

  2. Clamp every value into the range -5 to 1, both inclusive.

  3. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Replace every value with its square.

  6. Replace every value with the largest of itself and the up to 3 values before it.

  7. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  8. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `apply_rules([8, 15, 4, 21, 21, 0, 4, 7, 10]) returns 0`.


  Return only the code.'
