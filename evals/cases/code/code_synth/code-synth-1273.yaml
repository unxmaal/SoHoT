prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the even values.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Keep only the first 6 values (all of them if there are fewer).

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Sort descending.

  6. Replace every value with the largest of itself and the up to 2 values before it.

  7. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  8. Drop the first 1 values (an empty list if there are fewer).

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  11. Add 4 to every value.

  12. Multiply every value by -1.

  13. Reverse the list.

  14. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([19, -3, 20, -3, 4]) returns []`.


  Return only the code.'
