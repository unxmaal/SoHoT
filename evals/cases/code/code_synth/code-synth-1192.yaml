prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Collapse every run of the same character into one character.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Convert to uppercase.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Keep only the first occurrence of each character.

  10. Keep only the first 2 whitespace-separated words, joined by single spaces.

  11. Collapse every run of the same character into one character.

  12. Remove every digit.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Convert to uppercase.

  Then: Return how many characters it has.


  Example: `apply_rules('' c2000Czz0'') returns 2`.


  Return only the code.'
