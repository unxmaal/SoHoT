  9. Swap the case of every letter.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Keep only the first occurrence of each character.

  12. Replace every ''r'' with ''n'' (lowercase only).

  13. Collapse every run of the same character into one character.

  14. Convert to lowercase.

  Then: Return the number of words (whitespace-separated).


  Example: `transform(''zbyAxaxx.C2cx0CA'') returns 1`.


