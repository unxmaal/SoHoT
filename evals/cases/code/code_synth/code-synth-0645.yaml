  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Replace every ''i'' with ''c'' (lowercase only).

  5. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Keep only the first 2 whitespace-separated words, joined by single spaces.

  8. Keep only the first occurrence of each character.

  9. Remove every digit.

  10. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return how many characters it has.


  Example: `solve(''aBbzB zzz'') returns 5`.


