prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every ''i'' with ''r'' (lowercase only).

  2. Convert to uppercase.

  3. Keep only the first occurrence of each character.

  4. Keep only the first 2 whitespace-separated words, joined by single spaces.

  5. Remove every digit.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Keep only the first 3 whitespace-separated words, joined by single spaces.

  11. Convert to uppercase.

  12. Replace every ''l'' with ''i'' (lowercase only).

  13. Swap the case of every letter.

  14. Keep only the first occurrence of each character.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Replace every ''e'' with ''c'' (lowercase only).

  17. Collapse every run of the same character into one character.

  18. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return how many characters it has.


  Example: `reduce_data(''2aaAxx1z'') returns 6`.


  Return only the code.'
