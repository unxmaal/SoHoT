  1. Remove every vowel (a, e, i, o, u, either case).

  2. Sort the characters in ascending code point order.

  3. Remove every digit.

  4. Replace every ''s'' with ''c'' (lowercase only).

  5. Convert to lowercase.

  6. Collapse every run of the same character into one character.

  7. Sort the characters in ascending code point order.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Sort the characters in ascending code point order.

  11. Replace every ''r'' with ''i'' (lowercase only).

  12. Convert to uppercase.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `solve('',,x110xb 0'') returns '',''`.


  Return only the code.'
