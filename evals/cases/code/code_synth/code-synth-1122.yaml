prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every digit.

  2. Keep only the first 4 whitespace-separated words, joined by single spaces.

  3. Sort the characters in ascending code point order.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Remove every digit.

  6. Convert to uppercase.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Swap the case of every letter.

  10. Collapse every run of the same character into one character.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Replace every maximal run of digits with the number of digits in it.

  13. Keep only the first occurrence of each character.

  14. Replace runs of whitespace with a single space and strip both ends.

  Then: Return how many characters it has.


  Example: `compute(''axbbB,aCB.A0 2z'') returns 8`.


  Return only the code.'
