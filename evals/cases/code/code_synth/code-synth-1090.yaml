  4. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Sort the characters in ascending code point order.

  7. Swap the case of every letter.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Convert to lowercase.

  10. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Remove every digit.

  12. Convert to lowercase.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Remove every digit.

  15. Convert to lowercase.

  16. Replace every ''c'' with ''s'' (lowercase only).

  17. Keep only the first 3 whitespace-separated words, joined by single spaces.

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  19. Reverse the order of the whitespace-separated words and join them with single spaces.

  20. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return how many characters it has.


  Example: `process(''.BC0xbacba'') returns 6`.


  Return only the code.'
