prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  3. Sort the characters in ascending code point order.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Collapse every run of the same character into one character.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Convert to lowercase.

  8. Collapse every run of the same character into one character.

  9. Replace every ''c'' with ''r'' (lowercase only).

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Keep only the first 3 whitespace-separated words, joined by single spaces.

  12. Collapse every run of the same character into one character.

  13. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Keep only the first occurrence of each character.

  16. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  17. Collapse every run of the same character into one character.

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  19. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  20. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
