  4. Replace every value with its square.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Replace every value with the largest of itself and the up to 1 values before it.

  8. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Keep only the last 4 values, in their order (all of them if there are fewer).

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  13. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  14. Sort descending.

  15. Replace every value with its absolute value.

  16. Reverse the list.

  17. Replace every value with the largest of itself and the up to 2 values before it.

  18. Clamp every value into the range -4 to 3, both inclusive.

  19. Replace every value with the largest of itself and the up to 1 values before it.

  20. Sort ascending.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `apply_rules([7, 22, -9, 16, 5]) returns 0`.


  Return only the code.'
