  5. Convert to uppercase.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Swap the case of every letter.

  9. Keep only the first occurrence of each character.

  10. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
