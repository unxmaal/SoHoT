  6. Keep only the first occurrence of each character.

  7. Convert to uppercase.

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Remove every digit.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Convert to lowercase.

  12. Collapse every run of the same character into one character.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Keep only the first 4 whitespace-separated words, joined by single spaces.

  17. Sort the characters in ascending code point order.

  18. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
