prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Keep only the last 5 values, in their order (all of them if there are fewer).

  5. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  6. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Replace every value with its square.

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([21, -12, 4]) returns 9`.


  Return only the code.'
