prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to uppercase.

  2. Collapse every run of the same character into one character.

  3. Sort the characters in ascending code point order.

  4. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Collapse every run of the same character into one character.

  7. Keep only the first 3 whitespace-separated words, joined by single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''bcy aAy...z.'') returns ''1.1A1B1C''`.


  Return only the code.'
