prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort by absolute value, values with equal absolute value keeping their current relative order.

  2. Remove every negative value.

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Replace every value with the largest of itself and the up to 2 values before it.

  5. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Multiply every value by -2.

  11. Add 4 to every value.

  12. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  13. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the resulting list.


  Example: `run_pipeline([2, 24, 0, 21, 23, -11, -2]) returns [3]`.


  Return only the code.'
