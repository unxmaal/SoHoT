  3. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Multiply every value by 3.

  6. Replace every value with its square.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Remove every negative value.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `reduce_data([-10, 1, 3, 12, -2, 2, 24]) returns 1`.


  Return only the code.'
