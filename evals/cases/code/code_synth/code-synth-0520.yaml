prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep the values at indices 0, 3, 6, and so on.

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Collapse each run of equal adjacent values into one value.

  4. Sort descending.

  5. Keep only the first 5 values (all of them if there are fewer).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Sort descending.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Multiply every value by 2.

  11. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  12. Replace every value with its square.

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([-2, 5, 16]) returns 49`.


  Return only the code.'
