prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Clamp every value into the range 0 to 6, both inclusive.

  2. Replace every value with the largest of itself and the up to 3 values before it.

  3. Keep only the last 5 values, in their order (all of them if there are fewer).

  4. Keep only the first 5 values (all of them if there are fewer).

  5. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  6. Clamp every value into the range -2 to 1, both inclusive.

  7. Reverse the list.

  8. Clamp every value into the range -1 to 4, both inclusive.

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  11. Replace every value with the largest of itself and the up to 3 values before it.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  14. Clamp every value into the range 1 to 7, both inclusive.

  15. Replace every value with the largest value seen so far.

  16. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  17. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  18. Add -3 to every value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([11, -12, 6, -9, 10, 14, 10]) returns [-3, -3]`.


  Return only the code.'
