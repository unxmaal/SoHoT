prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Remove every digit.

  3. Replace every ''a'' with ''n'' (lowercase only).

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Convert to uppercase.

  11. Sort the characters in ascending code point order.

  12. Collapse every run of the same character into one character.

  13. Convert to lowercase.

  14. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Remove every digit.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `compute(''0, a .aa'') returns '',''`.


  Return only the code.'
