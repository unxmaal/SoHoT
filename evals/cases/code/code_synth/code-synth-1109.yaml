prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Keep only the values greater than 4.

  4. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  5. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Replace every value with its absolute value.

  8. Replace every value with its square.

  9. Reverse the list.

  10. Replace every value with the largest value seen so far.

  11. Keep only the first 5 values (all of them if there are fewer).

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Sort ascending.

  14. Remove duplicates, keeping the first occurrence of each value.

  15. Multiply every value by 2.

  16. Add -5 to every value.

  Then: Return how many distinct values there are.


  Example: `solve([-10, 0, 21]) returns 1`.


  Return only the code.'
