  10. Replace every value with the largest value seen so far.

  11. Keep only the values greater than -2.

  12. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Keep only the first 5 values (all of them if there are fewer).

  15. Remove every negative value.

  16. Clamp every value into the range 1 to 6, both inclusive.

  Then: Return how many distinct values there are.


