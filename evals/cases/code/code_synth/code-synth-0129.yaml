  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Collapse every run of the same character into one character.

  5. Convert to uppercase.

  6. Convert to lowercase.

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Remove every digit.

  10. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the resulting string.


  Example: `transform('' ..Ba xb z'') returns ''z xb .ba''`.


