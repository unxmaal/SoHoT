  5. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  6. Keep only the values greater than -2.

  7. Reverse the list.

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  9. Sort ascending.

  10. Clamp every value into the range -3 to 2, both inclusive.

  11. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  12. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  13. Remove every negative value.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Add -5 to every value.

  16. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
