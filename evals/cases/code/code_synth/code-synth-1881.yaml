  17. Keep only the last 4 values, in their order (all of them if there are fewer).

  18. Replace every value with the largest of itself and the up to 3 values before it.

  19. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  20. Clamp every value into the range 0 to 3, both inclusive.

  Then: Return the resulting list.


  Example: `solve([18, 13, -10, -4, 12]) returns [0, 0]`.


  Return only the code.'
