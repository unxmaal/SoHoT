  2. Remove every vowel (a, e, i, o, u, either case).

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Remove every digit.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Convert to lowercase.

  7. Swap the case of every letter.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Sort the characters in ascending code point order.

  13. Replace every ''n'' with ''r'' (lowercase only).

  14. Keep only the first occurrence of each character.

  15. Swap the case of every letter.

  16. Collapse every run of the same character into one character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''y,yyCbCbyy10A'') returns '',.gh''`.


  Return only the code.'
