prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every ''d'' with ''b'' (lowercase only).

  2. Swap the case of every letter.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Replace every ''o'' with ''c'' (lowercase only).

  5. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Remove every digit.

  7. Replace every ''r'' with ''b'' (lowercase only).

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Convert to lowercase.

  10. Swap the case of every letter.

  11. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  12. Sort the characters in ascending code point order.

  13. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Swap the case of every letter.

  16. Collapse every run of the same character into one character.

  17. Sort the characters in ascending code point order.

  18. Swap the case of every letter.

  Then: Return how many characters it has.


  Example: `apply_rules('', a1 z1x,AB,'') returns 8`.


  Return only the code.'
