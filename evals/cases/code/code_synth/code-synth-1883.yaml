prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Sort ascending.

  3. Replace every value with its square.

  4. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Collapse each run of equal adjacent values into one value.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Collapse each run of equal adjacent values into one value.

  11. Sort ascending.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Replace every value with its absolute value.

  14. Replace every value with the largest of itself and the up to 1 values before it.

  15. Keep only the last 3 values, in their order (all of them if there are fewer).

  16. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `solve([7, 22, -2, 20, 6, -12, -9, -12]) returns 130`.


  Return only the code.'
