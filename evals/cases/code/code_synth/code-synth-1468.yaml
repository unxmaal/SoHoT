prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to uppercase.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Convert to lowercase.

  4. Convert to uppercase.

  5. Swap the case of every letter.

  6. Replace every ''d'' with ''e'' (lowercase only).

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Remove every digit.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Collapse every run of the same character into one character.

  11. Sort the characters in ascending code point order.

  12. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Swap the case of every letter.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  17. Reverse the order of the whitespace-separated words and join them with single spaces.

  18. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  19. Replace every maximal run of digits with the number of digits in it.

  20. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''cCCa0bB1Ca.z.A2'') returns ''QTTSRRR9..''`.


  Return only the code.'
