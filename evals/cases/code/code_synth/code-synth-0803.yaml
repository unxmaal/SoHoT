  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  6. Reverse the list.

  7. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  8. Collapse each run of equal adjacent values into one value.

  9. Sort ascending.

  10. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Keep only the last 5 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `transform([20, 8, -1, 3, 21]) returns [0, 0]`.


  Return only the code.'
