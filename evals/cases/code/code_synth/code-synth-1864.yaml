prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the order of the whitespace-separated words and join them with single spaces.

  2. Swap the case of every letter.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Replace every maximal run of digits with the number of digits in it.

  5. Swap the case of every letter.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Keep only the first occurrence of each character.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Replace every maximal run of digits with the number of digits in it.

  15. Replace every ''a'' with ''o'' (lowercase only).

  16. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  17. Collapse every run of the same character into one character.

  18. Replace every ''c'' with ''o'' (lowercase only).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''C,zCa,,Ac,b'') returns ''1s1,1t1T1''`.


  Return only the code.'
