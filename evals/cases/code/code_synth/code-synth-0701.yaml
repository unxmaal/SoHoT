  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  4. Replace every value with its square.

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Multiply every value by -2.

  7. Keep the values at indices 0, 2, 4, and so on.

  8. Replace every value with the largest of itself and the up to 3 values before it.

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([-5, 24, -1]) returns -1152`.


  Return only the code.'
