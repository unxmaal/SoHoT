prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Drop the first 3 values (an empty list if there are fewer).

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Replace every value with the largest value seen so far.

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Replace every value with its absolute value.

  6. Keep only the first 5 values (all of them if there are fewer).

  7. Collapse each run of equal adjacent values into one value.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Keep only the first 5 values (all of them if there are fewer).

  10. Add 6 to every value.

  11. Replace every value with the largest of itself and the up to 2 values before it.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  14. Keep the values at indices 0, 2, 4, and so on.

  15. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  16. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `solve([10, 0, 0, 9]) returns 15`.


  Return only the code.'
