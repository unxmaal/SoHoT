prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Swap the case of every letter.

  3. Replace every ''o'' with ''c'' (lowercase only).

  4. Sort the characters in ascending code point order.

  5. Replace every ''a'' with ''i'' (lowercase only).

  6. Convert to uppercase.

  7. Keep only the first 3 whitespace-separated words, joined by single spaces.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Replace every ''o'' with ''n'' (lowercase only).

  10. Remove every digit.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Convert to uppercase.

  14. Convert to lowercase.

  15. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  16. Reverse the order of the whitespace-separated words and join them with single spaces.

  17. Swap the case of every letter.

  18. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return how many characters it has.


  Example: `apply_rules(''zb Czz .C0Aa'') returns 8`.


  Return only the code.'
