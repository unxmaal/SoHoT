  9. Keep only the last 3 values, in their order (all of them if there are fewer).

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Keep only the last 5 values, in their order (all of them if there are fewer).

  12. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  13. Replace every value with its square.

  14. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


