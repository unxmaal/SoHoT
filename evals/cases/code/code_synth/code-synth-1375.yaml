prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Drop the first 1 values (an empty list if there are fewer).

  2. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  3. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Collapse each run of equal adjacent values into one value.

  6. Drop the first 1 values (an empty list if there are fewer).

  7. Clamp every value into the range -4 to 3, both inclusive.

  8. Keep only the values greater than 1.

  9. Sort ascending.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Sort ascending.

  12. Replace every value with the largest of itself and the up to 1 values before it.

  13. Keep only the last 3 values, in their order (all of them if there are fewer).

  14. Replace every value with the largest value seen so far.

  15. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  16. Sort ascending.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `apply_rules([22, 13, 15, 24, 15, -10]) returns -1`.


  Return only the code.'
