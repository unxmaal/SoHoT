prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''swap'', ''mul'', ''over'', ''sub'': swap exchanges
  the top two values; mul pops two values and pushes their product; over pushes a copy of the second value
  from the top; sub pops b then a and pushes a - b, so the value pushed first is a. An operation that
  needs more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''swap'', ''over'', ''over'', ''over'', ''mul'', ''sub'', 0, ''over'', -2]) returns
  [0, -2]`.


  Return only the code.'
