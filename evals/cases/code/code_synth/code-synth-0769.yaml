  3. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  4. Sort the characters in ascending code point order.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Convert to lowercase.

  Then: Return the resulting string.


  Example: `apply_rules(''C,B Bc2,'') returns ''1 2,2b1c1c''`.


  Return only the code.'
