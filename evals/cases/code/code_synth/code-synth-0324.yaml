  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Collapse every run of the same character into one character.

  5. Sort the characters in ascending code point order.

  6. Keep only the first occurrence of each character.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Keep only the first occurrence of each character.

  9. Sort the characters in ascending code point order.

  10. Replace every maximal run of digits with the number of digits in it.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `process(''ycbzx01AA00y'') returns ''1''`.


  Return only the code.'
