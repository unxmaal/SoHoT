  4. Sort ascending.

  5. Replace every value with its absolute value.

  6. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  7. Replace every value with the largest of itself and the up to 2 values before it.

  8. Replace every value with its absolute value.

  9. Keep the values at indices 0, 3, 6, and so on.

  10. Sort ascending.

  11. Replace every value with the largest value seen so far.

  12. Replace every value with its square.

  13. Remove every negative value.

  14. Replace every value with its absolute value.

  15. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  16. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  17. Keep only the values greater than 0.

  18. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([9, 16, -6, 24, 11, -8, 5, -8]) returns [4, 29]`.


