prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Swap the case of every letter.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Convert to lowercase.

  6. Sort the characters in ascending code point order.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Convert to lowercase.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Convert to uppercase.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Convert to lowercase.

  Then: Return how many characters it has.


  Example: `run_pipeline(''BBazBCzC1BBA,y'') returns 12`.


  Return only the code.'
