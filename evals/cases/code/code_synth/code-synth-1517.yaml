prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every negative value.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  7. Sort descending.

  8. Remove every negative value.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  12. Keep only the last 2 values, in their order (all of them if there are fewer).

  13. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  15. Keep only the first 3 values (all of them if there are fewer).

  16. Keep the values at indices 0, 2, 4, and so on.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([10, 11, -1, 15, 12, 24, 3]) returns [646]`.


  Return only the code.'
