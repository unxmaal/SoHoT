  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Replace every maximal run of digits with the number of digits in it.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Convert to lowercase.

  10. Replace every ''d'' with ''s'' (lowercase only).

  11. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Convert to lowercase.

  14. Replace every ''s'' with ''c'' (lowercase only).

  15. Convert to lowercase.

  16. Remove every digit.

  17. Replace runs of whitespace with a single space and strip both ends.

  18. Keep only the first occurrence of each character.

  19. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  20. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return how many characters it has.


  Example: `transform(''acC0CBba'') returns 6`.


