prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Add 9 to every value.

  2. Sort ascending.

  3. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  4. Replace every value with its absolute value.

  5. Replace every value with the largest of itself and the up to 2 values before it.

  6. Multiply every value by -2.

  7. Keep only the even values.

  8. Collapse each run of equal adjacent values into one value.

  9. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  10. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  11. Replace every value with its absolute value.

  12. Clamp every value into the range -4 to 1, both inclusive.

  13. Add -9 to every value.

  14. Clamp every value into the range -5 to 2, both inclusive.

  15. Replace every value with the largest value seen so far.

  16. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  Then: Return the resulting list.


  Example: `compute([12, 11, 2]) returns [-5]`.


  Return only the code.'
