  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  3. Drop the first 2 values (an empty list if there are fewer).

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  6. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Sort descending.

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Replace every value with its square.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Replace every value with its absolute value.

  13. Replace every value with the largest value seen so far.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `run_pipeline([20, 10, 18, -6, 20, 10, -6, -2, 23]) returns 0`.


  Return only the code.'
