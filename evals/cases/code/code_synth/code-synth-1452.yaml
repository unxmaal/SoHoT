prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Keep only the first 2 whitespace-separated words, joined by single spaces.

  3. Keep only the first occurrence of each character.

  4. Sort the characters in ascending code point order.

  5. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  6. Swap the case of every letter.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Sort the characters in ascending code point order.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Replace every ''d'' with ''t'' (lowercase only).

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Swap the case of every letter.

  16. Keep only the first 2 whitespace-separated words, joined by single spaces.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `reduce_data(''b1.Cbcz,ycA b'') returns ''1,1.3C''`.


  Return only the code.'
