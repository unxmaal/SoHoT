  3. Keep the values at indices 0, 3, 6, and so on.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Sort descending.

  6. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  7. Keep the values at indices 0, 2, 4, and so on.

  8. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  9. Keep only the last 4 values, in their order (all of them if there are fewer).

  10. Sort descending.

  Then: Return the resulting list.


  Example: `apply_rules([25, -12, -5, 4, 17, -5]) returns [1]`.


  Return only the code.'
