prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep the values at indices 0, 2, 4, and so on.

  2. Keep only the last 3 values, in their order (all of them if there are fewer).

  3. Replace every value with the largest of itself and the up to 3 values before it.

  4. Replace every value with the largest value seen so far.

  5. Clamp every value into the range -1 to 8, both inclusive.

  6. Multiply every value by -1.

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Keep only the first 4 values (all of them if there are fewer).

  10. Keep only the last 3 values, in their order (all of them if there are fewer).

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Sort ascending.

  14. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  Then: Return the resulting list.


  Example: `transform([4, 21, 11, 5, -4, -3, 11, 6]) returns [0]`.


  Return only the code.'
