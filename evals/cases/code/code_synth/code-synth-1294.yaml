prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every ''t'' with ''s'' (lowercase only).

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Collapse every run of the same character into one character.

  4. Convert to lowercase.

  5. Replace every ''b'' with ''d'' (lowercase only).

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Convert to lowercase.

  8. Sort the characters in ascending code point order.

  9. Replace every ''l'' with ''d'' (lowercase only).

  10. Remove every digit.

  11. Keep only the first 3 whitespace-separated words, joined by single spaces.

  12. Swap the case of every letter.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Keep only the first occurrence of each character.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `process(''1c  b1by A1xyBc'') returns ''C''`.


  Return only the code.'
