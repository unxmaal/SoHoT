prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Keep only the first occurrence of each character.

  5. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  8. Convert to uppercase.

  9. Replace every ''a'' with ''o'' (lowercase only).

  10. Swap the case of every letter.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''.0 2 .000'') returns ''3.2''`.


  Return only the code.'
