prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Swap the case of every letter.

  2. Remove every digit.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Convert to uppercase.

  5. Remove every digit.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Convert to uppercase.

  9. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Convert to lowercase.

  13. Remove every digit.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Replace every maximal run of digits with the number of digits in it.

  Then: Return how many characters it has.


  Example: `process(''C.yy2.B b2Cz.axc'') returns 16`.


  Return only the code.'
