  3. Remove every vowel (a, e, i, o, u, either case).

  4. Convert to lowercase.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Remove every digit.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Replace every ''r'' with ''i'' (lowercase only).

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Collapse every run of the same character into one character.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Remove every digit.

  15. Sort the characters in ascending code point order.

  16. Replace every ''n'' with ''r'' (lowercase only).

  17. Convert to uppercase.

  18. Replace every ''a'' with ''e'' (lowercase only).

  19. Collapse every run of the same character into one character.

  20. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
