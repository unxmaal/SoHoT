prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Keep only the first 4 whitespace-separated words, joined by single spaces.

  4. Remove every digit.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Convert to lowercase.

  7. Replace every ''o'' with ''e'' (lowercase only).

  8. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  9. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Collapse every run of the same character into one character.

  13. Convert to lowercase.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Keep only the first 3 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''A20z0ax BzCBCc0C'') returns ''nlo''`.


  Return only the code.'
