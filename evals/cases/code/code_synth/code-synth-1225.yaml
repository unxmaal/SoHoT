  2. Drop the first 1 values (an empty list if there are fewer).

  3. Multiply every value by 2.

  4. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  5. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  6. Sort ascending.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Collapse each run of equal adjacent values into one value.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  12. Collapse each run of equal adjacent values into one value.

  13. Replace every value with the largest value seen so far.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  17. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  18. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  19. Remove every negative value.

  20. Replace every value with the largest of itself and the up to 2 values before it.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([3, 1, 25]) returns 2`.


