prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Keep only the first 4 whitespace-separated words, joined by single spaces.

  4. Keep only the first occurrence of each character.

  5. Replace every ''l'' with ''r'' (lowercase only).

  6. Collapse every run of the same character into one character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''b,1..1c c,201'') returns ''b,1.c''`.


  Return only the code.'
