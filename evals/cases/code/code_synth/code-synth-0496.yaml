prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''over'', ''add'', ''dup'', ''mul'': over pushes
  a copy of the second value from the top; add pops two values and pushes their sum; dup copies the top
  value onto the stack; mul pops two values and pushes their product. An operation that needs more values
  than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([-3, 6, ''mul'', 7, 9, 9, -1, -2, ''dup'']) returns [-18, 7, 9, 9, -1, -2, -2]`.


  Return only the code.'
