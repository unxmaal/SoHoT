prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Remove every digit.

  4. Swap the case of every letter.

  5. Keep only the first 2 whitespace-separated words, joined by single spaces.

  6. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Keep only the first 3 whitespace-separated words, joined by single spaces.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Remove every digit.

  10. Keep only the first 3 whitespace-separated words, joined by single spaces.

  11. Swap the case of every letter.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline('' B2, C b'') returns ''1N1,1.''`.


  Return only the code.'
