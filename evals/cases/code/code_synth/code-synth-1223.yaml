prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort by absolute value, values with equal absolute value keeping their current relative order.

  2. Keep only the even values.

  3. Multiply every value by -2.

  4. Replace every value with the largest value seen so far.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Sort ascending.

  7. Remove every negative value.

  8. Keep the values at indices 0, 3, 6, and so on.

  9. Sort ascending.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Keep only the values greater than -2.

  12. Multiply every value by 3.

  13. Sort ascending.

  14. Keep only the first 4 values (all of them if there are fewer).

  Then: Return the largest value, or -1 for an empty list.


  Example: `run_pipeline([12, 22, 17, 1, 15]) returns -1`.


  Return only the code.'
