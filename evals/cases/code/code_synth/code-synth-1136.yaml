prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Swap the case of every letter.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Convert to uppercase.

  5. Keep only the first occurrence of each character.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Replace every ''n'' with ''r'' (lowercase only).

  10. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  12. Collapse every run of the same character into one character.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Convert to uppercase.

  17. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  18. Convert to lowercase.

  Then: Return the resulting string.


  Example: `run_pipeline(''.2.,.a .Cba0'') returns ''1jk...''`.


  Return only the code.'
