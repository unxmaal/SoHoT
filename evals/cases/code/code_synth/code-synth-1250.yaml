prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Convert to lowercase.

  6. Keep only the first 4 whitespace-separated words, joined by single spaces.

  7. Collapse every run of the same character into one character.

  8. Convert to uppercase.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Convert to lowercase.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the resulting string.


  Example: `compute('', 0b1,.by'') returns ''111,111.131c1 11''`.


  Return only the code.'
