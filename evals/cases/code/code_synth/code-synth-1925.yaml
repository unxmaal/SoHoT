prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by -1.

  2. Clamp every value into the range -5 to -1, both inclusive.

  3. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  4. Sort ascending.

  5. Replace every value with the largest value seen so far.

  6. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  7. Replace every value with the largest of itself and the up to 1 values before it.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Keep only the last 4 values, in their order (all of them if there are fewer).

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Sort ascending.

  12. Add 9 to every value.

  13. Sort descending.

  14. Replace every value with its square.

  Then: Return the resulting list.


  Example: `apply_rules([25, -2, 11]) returns [289]`.


  Return only the code.'
