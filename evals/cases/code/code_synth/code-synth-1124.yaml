prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Sort the characters in ascending code point order.

  3. Convert to uppercase.

  4. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  5. Convert to uppercase.

  6. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Keep only the first occurrence of each character.

  11. Swap the case of every letter.

  12. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  13. Sort the characters in ascending code point order.

  14. Remove every digit.

  15. Swap the case of every letter.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Convert to uppercase.

  18. Keep only the first occurrence of each character.

  19. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  20. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''bzCzz2a cy0 0cc'') returns ''EDCA.''`.


