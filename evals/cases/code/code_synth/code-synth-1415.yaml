prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 3 values before it.

  2. Keep only the last 5 values, in their order (all of them if there are fewer).

  3. Sort ascending.

  4. Remove every negative value.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Sort descending.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace every value with the largest value seen so far.

  9. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  10. Multiply every value by 3.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Collapse each run of equal adjacent values into one value.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Replace every value with the largest value seen so far.

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Collapse each run of equal adjacent values into one value.

  17. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  18. Sort ascending.

  19. Remove duplicates, keeping the first occurrence of each value.

  20. Add -5 to every value.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `process([-3, 21, 2]) returns 0`.


  Return only the code.'
