prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every ''i'' with ''t'' (lowercase only).

  2. Remove every digit.

  3. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Convert to lowercase.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Convert to lowercase.

  7. Convert to uppercase.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Replace every maximal run of digits with the number of digits in it.

  11. Convert to uppercase.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Replace every ''d'' with ''r'' (lowercase only).

  17. Sort the characters in ascending code point order.

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  19. Convert to lowercase.

  20. Keep only the first occurrence of each character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''0,zx1xzayyB0y0'') returns '',.123bcd''`.


  Return only the code.'
