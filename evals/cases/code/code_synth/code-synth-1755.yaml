prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its square.

  2. Sort ascending.

  3. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Replace every value with the largest value seen so far.

  7. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Keep only the values greater than 1.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Sort descending.

  13. Keep the values at indices 0, 3, 6, and so on.

  14. Remove every negative value.

  15. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  16. Add 9 to every value.

  Then: Return the resulting list.


  Example: `transform([15, -3, 9, -5, 22, 12]) returns [138, 40]`.


  Return only the code.'
