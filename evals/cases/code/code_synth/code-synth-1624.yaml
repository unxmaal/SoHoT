prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Replace every ''d'' with ''o'' (lowercase only).

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  5. Remove every digit.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Remove every digit.

  8. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Convert to lowercase.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  15. Collapse every run of the same character into one character.

  16. Convert to lowercase.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `compute('' xyBCA0zC1bAa'') returns ''l''`.


  Return only the code.'
