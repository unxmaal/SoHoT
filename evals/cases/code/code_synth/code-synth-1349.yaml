prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  2. Sort descending.

  3. Replace every value with its square.

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Collapse each run of equal adjacent values into one value.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Multiply every value by -1.

  10. Add -3 to every value.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Reverse the list.

  13. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  14. Keep only the even values.

  15. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  16. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  Then: Return how many distinct values there are.


  Example: `apply_rules([18, -4, 2, 25, 1, 14, 5, 5]) returns 2`.


  Return only the code.'
