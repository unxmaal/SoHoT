prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''drop'', ''swap'', ''dup'', ''mul'': drop removes
  the top value; swap exchanges the top two values; dup copies the top value onto the stack; mul pops
  two values and pushes their product. An operation that needs more values than the stack has does nothing.
  Return the final stack as a list, bottom first.


  Example: `run_program([''mul'', ''mul'', ''drop'', ''mul'', ''mul'', ''mul'']) returns []`.


  Return only the code.'
assert:
  checks:
  - run_program(['dup', 'swap', 3, 'drop', 'dup', 9, 'mul', 'swap']) == [9]
  - run_program(['swap', 6, 'swap', 9]) == [6, 9]
