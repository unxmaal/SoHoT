prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every digit.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Remove every digit.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Sort the characters in ascending code point order.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Convert to lowercase.

  11. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the resulting string.


  Example: `apply_rules(''0 Bz,11 ,xb'') returns '',,g....''`.


  Return only the code.'
