  it is.

  3. Sort descending.

  4. Collapse each run of equal adjacent values into one value.

  5. Keep the values at indices 0, 3, 6, and so on.

  6. Replace every value with the largest value seen so far.

  7. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  8. Remove every negative value.

  9. Keep the values at indices 0, 2, 4, and so on.

  10. Keep only the last 4 values, in their order (all of them if there are fewer).

  11. Sort ascending.

  12. Add 6 to every value.

  13. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  14. Reverse the list.

  15. Replace every value with its square.

  16. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  Then: Return the resulting list.


  Example: `compute([2, 19, 17, -12]) returns [576]`.


  Return only the code.'
