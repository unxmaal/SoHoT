prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Sort ascending.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Multiply every value by 3.

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Replace every value with the largest value seen so far.

  8. Sort descending.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace every value with its absolute value.

  11. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  12. Add -9 to every value.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Add -1 to every value.

  15. Keep only the last 3 values, in their order (all of them if there are fewer).

  16. Replace every value with its absolute value.

  17. Remove every negative value.

  18. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([-2, 19, 15, 6, -6, 17, -4, -7, 18]) returns 19`.


  Return only the code.'
