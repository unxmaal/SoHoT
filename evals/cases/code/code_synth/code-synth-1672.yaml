prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Replace every ''d'' with ''o'' (lowercase only).

  3. Convert to uppercase.

  4. Keep only the first occurrence of each character.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Replace every ''l'' with ''e'' (lowercase only).

  8. Keep only the first occurrence of each character.

  9. Swap the case of every letter.

  10. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Collapse every run of the same character into one character.

  14. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Remove every digit.

  16. Swap the case of every letter.

  Then: Return how many characters it has.


  Example: `solve(''A22a0  A12z,z'') returns 5`.


  Return only the code.'
