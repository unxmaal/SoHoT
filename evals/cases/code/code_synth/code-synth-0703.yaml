  4. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  5. Keep only the even values.

  6. Keep only the values greater than 2.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

