prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Convert to uppercase.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Remove every digit.

  7. Keep only the first occurrence of each character.

  8. Convert to uppercase.

  9. Collapse every run of the same character into one character.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Replace every ''d'' with ''r'' (lowercase only).

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Keep only the first 3 whitespace-separated words, joined by single spaces.

  Then: Return how many characters it has.


  Example: `run_pipeline(''cAB0BxB1xB2Aa1ca'') returns 10`.


  Return only the code.'
