prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the last 3 values, in their order (all of them if there are fewer).

  2. Keep only the even values.

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Replace every value with its square.

  7. Reverse the list.

  8. Replace every value with the largest value seen so far.

  9. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Keep only the values greater than -2.

  15. Replace every value with its square.

  16. Collapse each run of equal adjacent values into one value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([1, 16, 10, 9]) returns 0`.


  Return only the code.'
