prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the first 3 values (all of them if there are fewer).

  2. Replace every value with its square.

  3. Reverse the list.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Add 4 to every value.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Replace every value with the largest value seen so far.

  9. Add -1 to every value.

  10. Collapse each run of equal adjacent values into one value.

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Reverse the list.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Replace every value with its square.

  15. Sort descending.

  16. Keep only the values greater than -1.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `apply_rules([19, 8, 21, 11, 19, -10]) returns 262144`.


  Return only the code.'
