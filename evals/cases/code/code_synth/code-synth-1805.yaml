prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the last 4 values, in their order (all of them if there are fewer).

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Keep only the values greater than 4.

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  6. Remove every negative value.

  7. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  8. Sort descending.

  9. Keep only the even values.

  10. Keep only the last 2 values, in their order (all of them if there are fewer).

  11. Reverse the list.

  12. Remove every negative value.

  13. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  14. Clamp every value into the range -4 to 5, both inclusive.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([23, 11, 3, -7, -3, -1, 12]) returns [2]`.


  Return only the code.'
