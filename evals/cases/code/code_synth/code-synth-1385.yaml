prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Replace every value with its absolute value.

  3. Sort ascending.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Add 9 to every value.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Collapse each run of equal adjacent values into one value.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Replace every value with its square.

  10. Keep the values at indices 0, 2, 4, and so on.

  11. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  12. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  13. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  14. Multiply every value by 2.

  15. Keep only the even values.

  16. Keep only the last 5 values, in their order (all of them if there are fewer).

  17. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  18. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([-10, 15, 7, 2, -7, 15, 13, -12]) returns 72`.


  Return only the code.'
