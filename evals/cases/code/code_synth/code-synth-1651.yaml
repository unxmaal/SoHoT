  10. Keep only the first 6 values (all of them if there are fewer).

  11. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  12. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  13. Replace every value with its square.

  14. Sort ascending.

  15. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  16. Drop the first 1 values (an empty list if there are fewer).

  17. Replace every value with the largest of itself and the up to 3 values before it.

  18. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `transform([0, 9, 16, 1]) returns [12, 12]`.


  Return only the code.'
