  2. Replace every ''l'' with ''d'' (lowercase only).

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Keep only the first occurrence of each character.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Convert to uppercase.

  8. Convert to lowercase.

  9. Sort the characters in ascending code point order.

  10. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''z1. a0bc..y1 '') returns ''.''`.


  Return only the code.'
