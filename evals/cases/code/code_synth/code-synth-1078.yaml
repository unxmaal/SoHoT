prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Convert to lowercase.

  3. Sort the characters in ascending code point order.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  8. Remove every digit.

  9. Sort the characters in ascending code point order.

  10. Collapse every run of the same character into one character.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Collapse every run of the same character into one character.

  13. Swap the case of every letter.

  14. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


  Example: `reduce_data(''2Cc,.ABBzcAAcCa'') returns ''1,1.1B1C1Z''`.


  Return only the code.'
