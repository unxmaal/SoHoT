prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Replace every ''d'' with ''t'' (lowercase only).

  4. Keep only the first 3 whitespace-separated words, joined by single spaces.

  5. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  6. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  8. Sort the characters in ascending code point order.

  9. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Replace every ''r'' with ''b'' (lowercase only).

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Keep only the first 3 whitespace-separated words, joined by single spaces.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Convert to lowercase.

  16. Sort the characters in ascending code point order.

  17. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  18. Convert to uppercase.

  19. Remove every vowel (a, e, i, o, u, either case).

  20. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `reduce_data(''  z cCxyC'') returns ''1.31151T1W''`.


  Return only the code.'
