prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Clamp every value into the range 0 to 4, both inclusive.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Remove every negative value.

  5. Collapse each run of equal adjacent values into one value.

  6. Replace every value with its square.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  9. Replace every value with its square.

  10. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  11. Sort descending.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Replace every value with its absolute value.

  14. Keep only the values greater than 1.

  15. Keep only the first 6 values (all of them if there are fewer).

  16. Keep the values at indices 0, 2, 4, and so on.

  17. Reverse the list.

  18. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `solve([-11, -12, 9, 6, 11, 23]) returns 12`.


  Return only the code.'
