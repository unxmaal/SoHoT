prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its square.

  2. Sort ascending.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Remove every negative value.

  5. Replace every value with the largest value seen so far.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Sort descending.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([13, 10, 0, 20, 12, 1, -12, -1]) returns 3343`.


  Return only the code.'
