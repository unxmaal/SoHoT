prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Replace every maximal run of digits with the number of digits in it.

  3. Keep only the first 3 whitespace-separated words, joined by single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Collapse every run of the same character into one character.

  6. Replace every ''i'' with ''n'' (lowercase only).

  7. Remove every digit.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Swap the case of every letter.

  12. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the resulting string.


  Example: `transform(''.aBC0,B,A0c'') returns ''1.1b1c1,1b1,1C''`.


  Return only the code.'
