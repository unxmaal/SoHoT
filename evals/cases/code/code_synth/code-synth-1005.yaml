prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Sort the characters in ascending code point order.

  4. Swap the case of every letter.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Sort the characters in ascending code point order.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Convert to lowercase.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the resulting string.


  Example: `compute(''yczC.xxAy.yaB'') returns ''l2k1i1h3g2.2''`.


  Return only the code.'
