prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Add 6 to every value.

  2. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  5. Replace every value with its absolute value.

  6. Replace every value with its square.

  7. Keep only the values greater than 0.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Keep only the first 6 values (all of them if there are fewer).

  11. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  12. Collapse each run of equal adjacent values into one value.

  13. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  14. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  15. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  16. Sort ascending.

  Then: Return the sum of the values (0 for an empty list).


  Example: `process([1, 4, -7]) returns 1`.


  Return only the code.'
