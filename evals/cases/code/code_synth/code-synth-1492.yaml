prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Remove every digit.

  3. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Convert to lowercase.

  6. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Collapse every run of the same character into one character.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Remove every digit.

  11. Replace every ''r'' with ''s'' (lowercase only).

  12. Remove every digit.

  13. Collapse every run of the same character into one character.

  14. Sort the characters in ascending code point order.

  15. Keep only the first 3 whitespace-separated words, joined by single spaces.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute(''1c0..y,x2yCcbb '') returns ''1,1.1j2k''`.


  Return only the code.'
