  5. Collapse every run of the same character into one character.

  6. Convert to lowercase.

  7. Replace every ''e'' with ''d'' (lowercase only).

  8. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  9. Remove every digit.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Keep only the first 3 whitespace-separated words, joined by single spaces.

  12. Replace every ''r'' with ''n'' (lowercase only).

  13. Convert to lowercase.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
