  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Clamp every value into the range -3 to 5, both inclusive.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Replace every value with the largest value seen so far.

  9. Keep only the values greater than 8.

  10. Keep the values at indices 0, 2, 4, and so on.

  11. Sort ascending.

  12. Replace every value with its square.

  13. Keep only the even values.

  14. Replace every value with the largest of itself and the up to 2 values before it.

  Then: Return how many distinct values there are.


  Example: `run_pipeline([8, 7, 5, 10, 3, 9, 3]) returns 3`.


  Return only the code.'
