  1. Replace every ''b'' with ''c'' (lowercase only).

  2. Convert to lowercase.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Convert to lowercase.

  6. Swap the case of every letter.

  7. Sort the characters in ascending code point order.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Swap the case of every letter.

  10. Keep only the first 2 whitespace-separated words, joined by single spaces.

  11. Remove every digit.

  12. Collapse every run of the same character into one character.

  13. Replace every ''o'' with ''n'' (lowercase only).

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `transform(''C.x,cxAB'') returns '',''`.


  Return only the code.'
