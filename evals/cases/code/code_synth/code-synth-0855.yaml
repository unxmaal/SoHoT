prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''mul'', ''drop'', ''over'', ''dup'': mul pops
  two values and pushes their product; drop removes the top value; over pushes a copy of the second value
  from the top; dup copies the top value onto the stack. An operation that needs more values than the
  stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''mul'', ''drop'', ''over'', 6, ''dup'', ''mul'', ''mul'', 2, ''over'']) returns
  [36, 2, 36]`.


  Return only the code.'
