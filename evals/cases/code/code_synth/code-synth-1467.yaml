  3. Keep only the even values.

  4. Remove every negative value.

  5. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Sort descending.

  8. Reverse the list.

  9. Keep only the first 4 values (all of them if there are fewer).

  10. Keep only the even values.

  11. Collapse each run of equal adjacent values into one value.

  12. Multiply every value by -1.

  13. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  14. Keep only the last 3 values, in their order (all of them if there are fewer).

  15. Replace every value with the largest value seen so far.

  16. Sort ascending.

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([9, 23, 3, 0, 0, 20, 5]) returns 2`.


  Return only the code.'
