  4. Remove duplicates, keeping the first occurrence of each value.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  9. Keep only the last 5 values, in their order (all of them if there are fewer).

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Replace every value with the largest of itself and the up to 3 values before it.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  14. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  15. Drop the first 1 values (an empty list if there are fewer).

  16. Keep only the values greater than 8.

  17. Keep only the last 4 values, in their order (all of them if there are fewer).

  18. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  19. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  20. Reverse the list.

  Then: Return the sum of the values (0 for an empty list).


