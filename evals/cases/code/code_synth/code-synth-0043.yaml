prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the last 5 values, in their order (all of them if there are fewer).

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Reverse the list.

  4. Collapse each run of equal adjacent values into one value.

  5. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  8. Multiply every value by -1.

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  11. Keep only the first 5 values (all of them if there are fewer).

  12. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([-2, 9, -11]) returns 6`.


  Return only the code.'
