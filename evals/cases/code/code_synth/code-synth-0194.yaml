  two values and pushes their sum; over pushes a copy of the second value from the top; drop removes the
  top value; swap exchanges the top two values. An operation that needs more values than the stack has
  does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''drop'', 6]) returns [6]`.


  Return only the code.'
