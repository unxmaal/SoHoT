  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Convert to uppercase.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Remove every digit.

  6. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  7. Keep only the first occurrence of each character.

  8. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Convert to lowercase.

  10. Remove every digit.

  11. Keep only the first 4 whitespace-separated words, joined by single spaces.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Keep only the first occurrence of each character.

  14. Remove every vowel (a, e, i, o, u, either case).

  15. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Replace every ''t'' with ''l'' (lowercase only).

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `solve(''bbB22bccx'') returns ''1''`.


  Return only the code.'
