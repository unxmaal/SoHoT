prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''drop'', ''sub'', ''dup'', ''add'': drop removes
  the top value; sub pops b then a and pushes a - b, so the value pushed first is a; dup copies the top
  value onto the stack; add pops two values and pushes their sum. An operation that needs more values
  than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''drop'', ''dup'', ''dup'', ''dup'', ''add'', 9, ''drop'', ''add'']) returns
  []`.


  Return only the code.'
