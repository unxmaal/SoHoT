prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the even values.

  2. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  3. Multiply every value by 3.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  6. Remove every negative value.

  Then: Return the resulting list.


  Example: `apply_rules([2, -8, 18]) returns [6]`.


  Return only the code.'
