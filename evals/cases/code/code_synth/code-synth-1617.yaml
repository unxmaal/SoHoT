  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Reverse the list.

  5. Sort ascending.

  6. Replace every value with the largest of itself and the up to 1 values before it.

  7. Clamp every value into the range 0 to 5, both inclusive.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Reverse the list.

  10. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  11. Keep only the first 4 values (all of them if there are fewer).

  12. Reverse the list.

  13. Keep only the first 6 values (all of them if there are fewer).

  14. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  15. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  16. Replace every value with its square.

  17. Replace every value with the largest value seen so far.

  18. Replace every value with its absolute value.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `compute([0, -5, 16, 17, 23, -11, 25, 4]) returns 1`.


  Return only the code.'
