prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  2. Drop the first 3 values (an empty list if there are fewer).

  3. Multiply every value by -1.

  4. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  5. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Reverse the list.

  8. Sort descending.

  9. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  10. Multiply every value by 2.

  11. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  12. Replace every value with its square.

  13. Collapse each run of equal adjacent values into one value.

  14. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  15. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  16. Sort ascending.

  17. Remove every negative value.

  18. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the resulting list.


  Example: `run_pipeline([4, -11, 12, 0, -1, -6, 20, 5, -8]) returns [2, 0]`.


  Return only the code.'
