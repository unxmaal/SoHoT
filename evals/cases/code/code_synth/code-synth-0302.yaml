prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Multiply every value by -1.

  5. Keep only the last 5 values, in their order (all of them if there are fewer).

  6. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  7. Replace every value with its square.

  8. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `run_pipeline([4, 18, 6]) returns None`.


  Return only the code.'
