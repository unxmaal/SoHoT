prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 1 values before it.

  2. Sort descending.

  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Drop the first 1 values (an empty list if there are fewer).

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Keep only the last 5 values, in their order (all of them if there are fewer).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `solve([-9, 2, 8, 7, 15]) returns -11`.


  Return only the code.'
