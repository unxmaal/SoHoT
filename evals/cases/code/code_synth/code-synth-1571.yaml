prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Reverse the list.

  4. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  5. Remove every negative value.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  8. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  9. Sort descending.

  10. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  11. Sort ascending.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Add -9 to every value.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the resulting list.


  Example: `transform([13, 9, 15, 19, 2, 14, -3, -4]) returns [-8, -9, -9, -9]`.


  Return only the code.'
