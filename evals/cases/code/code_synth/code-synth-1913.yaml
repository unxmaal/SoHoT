prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  2. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  3. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  4. Sort descending.

  5. Keep the values at indices 0, 3, 6, and so on.

  6. Sort descending.

  7. Replace every value with its absolute value.

  8. Multiply every value by -2.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Replace every value with the largest of itself and the up to 3 values before it.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Sort descending.

  13. Replace every value with its absolute value.

  14. Multiply every value by -2.

  15. Reverse the list.

  16. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([17, 5, 15, 23, -3, 3, 11, -11, -5]) returns -12`.


  Return only the code.'
