prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Replace every ''b'' with ''o'' (lowercase only).

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Convert to uppercase.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Keep only the first occurrence of each character.

  7. Collapse every run of the same character into one character.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Remove every digit.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the resulting string.


  Example: `reduce_data(''cBBy,z0Cx.'') returns ''MJ,KNI.''`.


  Return only the code.'
