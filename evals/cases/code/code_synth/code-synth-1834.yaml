  other characters are unchanged.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Keep only the first 2 whitespace-separated words, joined by single spaces.

  6. Remove every digit.

  7. Keep only the first occurrence of each character.

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Replace every maximal run of digits with the number of digits in it.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Convert to lowercase.

  15. Keep only the first 3 whitespace-separated words, joined by single spaces.

  16. Sort the characters in ascending code point order.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process(''.yy0x2c B2'') returns ''.111111111111111111ghkl''`.


  Return only the code.'
