  3. Keep only the first 6 values (all of them if there are fewer).

  4. Clamp every value into the range 1 to 7, both inclusive.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  8. Replace every value with its square.

  9. Add -3 to every value.

  10. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  11. Remove every negative value.

  12. Sort descending.

  13. Keep only the even values.

  14. Keep only the last 2 values, in their order (all of them if there are fewer).

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  17. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  18. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  Then: Return the largest value, or -1 for an empty list.


