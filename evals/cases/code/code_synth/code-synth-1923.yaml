  5. Replace every value with the largest of itself and the up to 3 values before it.

  6. Keep only the first 6 values (all of them if there are fewer).

  7. Keep only the even values.

  8. Keep only the values greater than 5.

  9. Replace every value with its square.

  10. Keep only the even values.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Replace every value with its absolute value.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `solve([1, 2, -9, 18]) returns 0`.


