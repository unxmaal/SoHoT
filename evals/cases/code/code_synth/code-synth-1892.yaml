  other characters are unchanged.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Keep only the first 2 whitespace-separated words, joined by single spaces.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Convert to lowercase.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Remove every digit.

  11. Keep only the first 4 whitespace-separated words, joined by single spaces.

  12. Convert to lowercase.

  13. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  14. Collapse every run of the same character into one character.

  15. Remove every digit.

  16. Convert to uppercase.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Remove every vowel (a, e, i, o, u, either case).

  19. Remove every digit.

  20. Swap the case of every letter.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform('' Ccax1 11,11,'') returns ''mpr''`.


  Return only the code.'
