prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Replace every value with the largest value seen so far.

  3. Sort ascending.

  4. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  5. Replace every value with its square.

  6. Collapse each run of equal adjacent values into one value.

  7. Replace every value with its square.

  8. Keep only the values greater than 6.

  9. Remove every negative value.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Sort descending.

  Then: Return the resulting list.


  Example: `transform([21, 13, 6, 14, 16]) returns [83521]`.


  Return only the code.'
