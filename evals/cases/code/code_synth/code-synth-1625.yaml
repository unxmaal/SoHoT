prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the first 6 values (all of them if there are fewer).

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Keep only the even values.

  5. Replace every value with its square.

  6. Multiply every value by 3.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  10. Replace every value with the largest of itself and the up to 2 values before it.

  11. Sort ascending.

  12. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  13. Replace every value with its absolute value.

  14. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  15. Keep only the values greater than -1.

  16. Keep the values at indices 0, 3, 6, and so on.

  Then: Return the sum of the values (0 for an empty list).


  Example: `solve([4, -3, 19, 1, -7, -8]) returns 40`.


  Return only the code.'
