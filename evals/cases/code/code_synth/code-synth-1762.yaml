prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Convert to uppercase.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Convert to lowercase.

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Convert to uppercase.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Convert to lowercase.

  14. Keep only the first occurrence of each character.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Swap the case of every letter.

  17. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  18. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''bAbz  1Aba'') returns ''1HGF''`.


  Return only the code.'
