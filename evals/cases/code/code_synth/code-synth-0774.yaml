prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''drop'', ''swap'', ''over'', ''dup'': drop removes
  the top value; swap exchanges the top two values; over pushes a copy of the second value from the top;
  dup copies the top value onto the stack. An operation that needs more values than the stack has does
  nothing. Return the final stack as a list, bottom first.


  Example: `run_program([8, -1]) returns [8, -1]`.


  Return only the code.'
