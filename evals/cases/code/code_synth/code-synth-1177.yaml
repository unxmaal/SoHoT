prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Sort ascending.

  3. Clamp every value into the range -5 to 1, both inclusive.

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Drop the first 2 values (an empty list if there are fewer).

  6. Keep only the values greater than 0.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Sort ascending.

  10. Replace every value with its square.

  11. Replace every value with the largest of itself and the up to 3 values before it.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Multiply every value by 2.

  14. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([20, 14, -11, -3, 25, 10]) returns 10`.


  Return only the code.'
