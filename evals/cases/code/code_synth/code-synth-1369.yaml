  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace every value with its square.

  8. Add -1 to every value.

  9. Drop the first 1 values (an empty list if there are fewer).

  10. Keep only the first 3 values (all of them if there are fewer).

  11. Replace every value with its absolute value.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Replace every value with its absolute value.

  14. Multiply every value by 3.

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Remove duplicates, keeping the first occurrence of each value.

  17. Replace every value with its square.

  18. Replace every value with the largest value seen so far.

  19. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  20. Keep only the last 4 values, in their order (all of them if there are fewer).

  Then: Return the resulting list.


