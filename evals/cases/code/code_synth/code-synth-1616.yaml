prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Replace every ''b'' with ''o'' (lowercase only).

  4. Keep only the first occurrence of each character.

  5. Convert to uppercase.

  6. Sort the characters in ascending code point order.

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Collapse every run of the same character into one character.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Swap the case of every letter.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Convert to uppercase.

  Then: Return the resulting string.


  Example: `reduce_data('' cBabAc1 '') returns ''131A1B1C1O''`.


  Return only the code.'
