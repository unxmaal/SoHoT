prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every ''i'' with ''t'' (lowercase only).

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  4. Replace every ''l'' with ''e'' (lowercase only).

  5. Sort the characters in ascending code point order.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Swap the case of every letter.

  8. Replace every ''s'' with ''o'' (lowercase only).

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Keep only the first occurrence of each character.

  Then: Return how many characters it has.


  Example: `reduce_data(''B,,x,.A. .1'') returns 4`.


  Return only the code.'
