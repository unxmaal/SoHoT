prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Replace every value with its absolute value.

  4. Replace every value with the largest of itself and the up to 2 values before it.

  5. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  6. Sort ascending.

  7. Reverse the list.

  8. Multiply every value by -1.

  9. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  10. Keep the values at indices 0, 3, 6, and so on.

  11. Replace every value with its square.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Replace every value with the largest value seen so far.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the resulting list.


  Example: `solve([20, 2, 22, 14]) returns [0]`.


  Return only the code.'
