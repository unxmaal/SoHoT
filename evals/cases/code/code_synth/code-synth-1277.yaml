  6. Sort descending.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Collapse each run of equal adjacent values into one value.

  9. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  10. Sort ascending.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
