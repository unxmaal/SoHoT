prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Sort descending.

  4. Collapse each run of equal adjacent values into one value.

  5. Keep only the first 6 values (all of them if there are fewer).

  6. Drop the first 3 values (an empty list if there are fewer).

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Replace every value with its absolute value.

  9. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Replace every value with the largest value seen so far.

  13. Replace every value with its square.

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
