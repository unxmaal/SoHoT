prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Replace every ''e'' with ''d'' (lowercase only).

  3. Sort the characters in ascending code point order.

  4. Remove every digit.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return how many characters it has.


  Example: `apply_rules(''cb.bC 2c1C2'') returns 10`.


  Return only the code.'
