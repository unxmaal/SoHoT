  3. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  4. Collapse every run of the same character into one character.

  5. Sort the characters in ascending code point order.

  6. Collapse every run of the same character into one character.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Convert to lowercase.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return how many characters it has.


  Example: `reduce_data(''a1.,xa200 '') returns 12`.


  Return only the code.'
