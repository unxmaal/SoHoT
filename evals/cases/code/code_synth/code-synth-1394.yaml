  3. Sort the characters in ascending code point order.

  4. Keep only the first occurrence of each character.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Convert to uppercase.

  7. Collapse every run of the same character into one character.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Remove every digit.

  10. Sort the characters in ascending code point order.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Sort the characters in ascending code point order.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Collapse every run of the same character into one character.

  16. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the resulting string.


