prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Clamp every value into the range -3 to 3, both inclusive.

  2. Replace every value with its absolute value.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Reverse the list.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Sort descending.

  7. Multiply every value by 5.

  8. Sort ascending.

  9. Sort descending.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  12. Collapse each run of equal adjacent values into one value.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([-6, -1, -7, 0]) returns 2`.


  Return only the code.'
