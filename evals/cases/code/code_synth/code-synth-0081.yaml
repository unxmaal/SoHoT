prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 2 values before it.

  2. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Replace every value with the largest value seen so far.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Remove every negative value.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `process([23, -10, 22, 1, 24, -3, -1, -3]) returns 1`.


  Return only the code.'
