  10. Keep only the first occurrence of each character.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Collapse every run of the same character into one character.

  13. Remove every digit.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Replace every ''o'' with ''s'' (lowercase only).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
