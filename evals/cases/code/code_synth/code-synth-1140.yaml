prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Replace every ''n'' with ''d'' (lowercase only).

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Replace every ''s'' with ''o'' (lowercase only).

  6. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Replace every ''a'' with ''s'' (lowercase only).

  12. Sort the characters in ascending code point order.

  13. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Remove every digit.

  Then: Return the resulting string.


  Example: `solve('' ccBBx,BzA0'') returns '' ,Nlo''`.


  Return only the code.'
