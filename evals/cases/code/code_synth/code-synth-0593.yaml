  checks:
  - run_program(['dup', 2, 1, 'dup', 'mul', 'add']) == [3]
  - run_program([-2, 'drop', 9]) == [9]
  - run_program(['mul', 5, 'mul', 'drop', 1, 'mul', 'drop', 'mul', 'mul']) == []
  - run_program(['mul', -1, 1]) == [-1, 1]
  - run_program(['add', 2, 'add', 'add', 'dup', -1, 'add', 8]) == [2, 1, 8]
  - run_program(['drop', 2, 'add', 'drop', 'dup', 'add', 'mul', 8]) == [8]
