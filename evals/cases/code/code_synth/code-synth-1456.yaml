prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Replace every maximal run of digits with the number of digits in it.

  3. Collapse every run of the same character into one character.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Collapse every run of the same character into one character.

  8. Swap the case of every letter.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Swap the case of every letter.

  11. Remove every digit.

  12. Keep only the first occurrence of each character.

  13. Collapse every run of the same character into one character.

  14. Remove every digit.

  15. Sort the characters in ascending code point order.

  16. Convert to lowercase.

  Then: Return the resulting string.


  Example: `apply_rules(''bA1yzB0A'') returns ''abyz''`.


  Return only the code.'
