  6. Convert to uppercase.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Remove every digit.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Sort the characters in ascending code point order.

  11. Collapse every run of the same character into one character.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Collapse every run of the same character into one character.

  14. Remove every vowel (a, e, i, o, u, either case).

  15. Sort the characters in ascending code point order.

  16. Replace every ''d'' with ''a'' (lowercase only).

  17. Convert to uppercase.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the resulting string.


