  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Collapse every run of the same character into one character.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Remove every digit.

  10. Collapse every run of the same character into one character.

  11. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Remove every digit.

  13. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  14. Convert to uppercase.

  15. Keep only the first occurrence of each character.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Collapse every run of the same character into one character.

  18. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  19. Replace runs of whitespace with a single space and strip both ends.

  20. Remove every digit.

  Then: Return the resulting string.


  Example: `apply_rules('' .A0cB .'') returns ''XW.''`.


  Return only the code.'
