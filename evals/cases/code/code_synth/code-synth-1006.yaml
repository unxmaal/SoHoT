  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Convert to uppercase.

  6. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the resulting string.


  Example: `apply_rules(''bacA.aAx z.bx'') returns ''CG.E C.HG''`.


  Return only the code.'
