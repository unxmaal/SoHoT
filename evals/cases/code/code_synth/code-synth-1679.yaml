  3. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  4. Keep only the last 2 values, in their order (all of them if there are fewer).

  5. Multiply every value by -2.

  6. Keep only the last 4 values, in their order (all of them if there are fewer).

  7. Collapse each run of equal adjacent values into one value.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Replace every value with its absolute value.

  10. Clamp every value into the range 1 to 9, both inclusive.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Collapse each run of equal adjacent values into one value.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([-10, -10, 23, 20, 3, 7, -9, 16]) returns 8`.


  Return only the code.'
