prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  2. Replace every value with the largest value seen so far.

  3. Keep only the first 2 values (all of them if there are fewer).

  4. Collapse each run of equal adjacent values into one value.

  5. Sort descending.

  6. Replace every value with the largest of itself and the up to 1 values before it.

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Keep the values at indices 0, 2, 4, and so on.

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Remove every negative value.

  15. Sort ascending.

  16. Replace every value with its square.

  17. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  18. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([-9, 8, 9, 19, 15, 7, 3, -8, 17]) returns 0`.


  Return only the code.'
