prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Collapse every run of the same character into one character.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  9. Convert to lowercase.

  10. Swap the case of every letter.

  11. Sort the characters in ascending code point order.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Replace every ''t'' with ''c'' (lowercase only).

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  16. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the resulting string.


  Example: `process('' 11.2ABAB1BbBb'') returns ''..6B...''`.


  Return only the code.'
