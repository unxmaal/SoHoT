  4. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  5. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Keep the values at indices 0, 3, 6, and so on.

  8. Clamp every value into the range 1 to 6, both inclusive.

  Then: Return how many distinct values there are.


  Example: `process([19, -1, 6, 0, 20, 15]) returns 2`.


  Return only the code.'
