prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its square.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Drop the first 1 values (an empty list if there are fewer).

  4. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  5. Add 6 to every value.

  6. Replace every value with the largest value seen so far.

  7. Collapse each run of equal adjacent values into one value.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Collapse each run of equal adjacent values into one value.

  10. Replace every value with its absolute value.

  11. Replace every value with its square.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  14. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  15. Collapse each run of equal adjacent values into one value.

  16. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  17. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  18. Keep only the values greater than 0.

  Then: Return how many distinct values there are.


  Example: `reduce_data([-2, -8, 16]) returns 0`.


  Return only the code.'
