  3. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  4. Keep only the first occurrence of each character.

  5. Remove every digit.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Convert to uppercase.

  8. Collapse every run of the same character into one character.

  9. Swap the case of every letter.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Sort the characters in ascending code point order.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
