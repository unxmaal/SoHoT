  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Replace every maximal run of digits with the number of digits in it.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Swap the case of every letter.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Keep only the first occurrence of each character.

  8. Keep only the first 2 whitespace-separated words, joined by single spaces.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Sort the characters in ascending code point order.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process(''C Cbz1,A'') returns '',13BZc''`.


  Return only the code.'
