prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Replace every value with its square.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Replace every value with its square.

  5. Replace every value with the largest value seen so far.

  6. Keep only the first 4 values (all of them if there are fewer).

  7. Multiply every value by 3.

  8. Replace every value with its absolute value.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace every value with its absolute value.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Add 6 to every value.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  15. Remove every negative value.

  16. Add 9 to every value.

  Then: Return the resulting list.


  Example: `apply_rules([-4, -7, -1, 8]) returns [130644]`.


  Return only the code.'
