prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Convert to lowercase.

  2. Swap the case of every letter.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Collapse every run of the same character into one character.

  7. Swap the case of every letter.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Convert to uppercase.

  12. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `compute('',yaz CcxaC'') returns ''2L1G1J1L1 1,1H1J''`.


  Return only the code.'
