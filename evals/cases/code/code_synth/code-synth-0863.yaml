  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Reverse the list.

  6. Add 9 to every value.

  7. Keep only the values greater than -1.

  8. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  Then: Return the resulting list.


  Example: `apply_rules([-6, 9, 2, 4, 6]) returns [2, 3]`.


  Return only the code.'
