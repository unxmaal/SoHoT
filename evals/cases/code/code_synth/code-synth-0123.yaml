  3. Keep only the first 4 values (all of them if there are fewer).

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  6. Sort descending.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `apply_rules([17, 21, 20, 20, -12, 9, 22]) returns -1`.


  Return only the code.'
