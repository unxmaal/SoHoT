  4. Sort ascending.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Clamp every value into the range 1 to 4, both inclusive.

  7. Multiply every value by 2.

  8. Clamp every value into the range -1 to 7, both inclusive.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Add -3 to every value.

  11. Replace every value with the largest of itself and the up to 1 values before it.

  12. Sort descending.

  13. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  14. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  15. Clamp every value into the range -1 to 8, both inclusive.

  16. Replace every value with its square.

  Then: Return the resulting list.


  Example: `process([10, 16, 11, 2, 18, 18, 11]) returns []`.


