prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Swap the case of every letter.

  5. Keep only the first occurrence of each character.

  6. Convert to uppercase.

  7. Replace every ''r'' with ''c'' (lowercase only).

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Collapse every run of the same character into one character.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Keep only the first occurrence of each character.

  12. Remove every digit.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `run_pipeline('',x0B.yC0'') returns '',''`.


  Return only the code.'
