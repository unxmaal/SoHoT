  1. Keep only the first occurrence of each character.

  2. Remove every digit.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Convert to lowercase.

  5. Sort the characters in ascending code point order.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Collapse every run of the same character into one character.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  10. Swap the case of every letter.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process(''bB zc2 Cz'') returns ''2B2C1Z.''`.


  Return only the code.'
