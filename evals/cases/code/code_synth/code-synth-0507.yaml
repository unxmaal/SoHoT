  1. Sort the characters in ascending code point order.

  2. Keep only the first 3 whitespace-separated words, joined by single spaces.

  3. Keep only the first occurrence of each character.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Convert to uppercase.

  6. Collapse every run of the same character into one character.

  7. Remove every digit.

  8. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Convert to uppercase.

  10. Replace every ''r'' with ''n'' (lowercase only).

  Then: Return how many characters it has.


  Example: `reduce_data(''abac,a b'') returns 4`.


  Return only the code.'
