prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  2. Sort descending.

  3. Keep only the first 6 values (all of them if there are fewer).

  4. Reverse the list.

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  7. Sort descending.

  8. Replace every value with the largest value seen so far.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  11. Replace every value with its absolute value.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the sum of the values (0 for an empty list).


  Example: `process([10, 0, 22, 2]) returns 0`.


  Return only the code.'
