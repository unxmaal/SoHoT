  1. Sort ascending.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Keep the values at indices 0, 2, 4, and so on.

  4. Collapse each run of equal adjacent values into one value.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Keep only the last 2 values, in their order (all of them if there are fewer).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([17, 13, 18, 7, 19, 15]) returns 1`.


  Return only the code.'
