prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort ascending.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace every value with the largest of itself and the up to 3 values before it.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `reduce_data([-1, 19, 1, -11, 15, -10, 9, 7, 19]) returns -77`.


  Return only the code.'
