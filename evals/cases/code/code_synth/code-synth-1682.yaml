prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Keep only the first 4 whitespace-separated words, joined by single spaces.

  3. Keep only the first occurrence of each character.

  4. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Replace every ''b'' with ''a'' (lowercase only).

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Convert to lowercase.

  10. Remove every digit.

  11. Keep only the first 4 whitespace-separated words, joined by single spaces.

  12. Sort the characters in ascending code point order.

  13. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Replace runs of whitespace with a single space and strip both ends.

  17. Convert to lowercase.

  18. Sort the characters in ascending code point order.

  19. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  20. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the resulting string.


  Example: `apply_rules(''Bb2A1B0x2BC2yy0'') returns ''1112op''`.


  Return only the code.'
