  each to the result of the one before:

  1. Convert to uppercase.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Convert to lowercase.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Convert to lowercase.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  9. Swap the case of every letter.

  10. Collapse every run of the same character into one character.

  11. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Keep only the first occurrence of each character.

  14. Remove every digit.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Keep only the first 3 whitespace-separated words, joined by single spaces.

  17. Remove every digit.

  18. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
