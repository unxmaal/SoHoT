prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Replace every value with the largest value seen so far.

  3. Keep only the even values.

  4. Add 2 to every value.

  5. Keep only the values greater than 3.

  6. Remove every negative value.

  7. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  8. Keep only the first 6 values (all of them if there are fewer).

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Keep only the last 3 values, in their order (all of them if there are fewer).

  11. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  15. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  16. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  17. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  18. Collapse each run of equal adjacent values into one value.

  19. Sort by absolute value, values with equal absolute value keeping their current relative order.

  20. Sort descending.

  Then: Return the resulting list.


  Example: `run_pipeline([10, 7, 19, 10, 23]) returns [1, 0]`.


  Return only the code.'
