  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  6. Sort descending.

  7. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  8. Keep only the even values.

  9. Replace every value with its square.

  10. Sort ascending.

  11. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  12. Clamp every value into the range -1 to 7, both inclusive.

  13. Remove every negative value.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the resulting list.


  Example: `process([12, -9, 1]) returns [0, 0]`.


  Return only the code.'
