  other characters are unchanged.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Convert to uppercase.

  6. Convert to lowercase.

  7. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Convert to uppercase.

  11. Convert to lowercase.

  12. Replace every ''e'' with ''c'' (lowercase only).

  13. Convert to uppercase.

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Collapse every run of the same character into one character.

  16. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


  Example: `apply_rules(''0Caac2B0xcC,by2'') returns ''1ZC,DY1C1DBD1''`.


  Return only the code.'
