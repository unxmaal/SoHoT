prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to uppercase.

  2. Swap the case of every letter.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Replace every ''r'' with ''c'' (lowercase only).

  5. Keep only the first occurrence of each character.

  6. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  10. Swap the case of every letter.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Sort the characters in ascending code point order.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Keep only the first occurrence of each character.

  16. Sort the characters in ascending code point order.

  17. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  18. Convert to uppercase.

  19. Keep only the first occurrence of each character.

  20. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


  Example: `run_pipeline(''.yBBa1a1'') returns ''.2FGD''`.


  Return only the code.'
