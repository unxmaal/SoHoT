  13. Remove every digit.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
