  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Remove every digit.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Remove every digit.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  11. Collapse every run of the same character into one character.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
