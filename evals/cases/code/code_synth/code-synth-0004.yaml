prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 4 whitespace-separated words, joined by single spaces.

  2. Replace every ''b'' with ''i'' (lowercase only).

  3. Sort the characters in ascending code point order.

  4. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Sort the characters in ascending code point order.

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Swap the case of every letter.

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Replace every ''b'' with ''a'' (lowercase only).

  Then: Return the resulting string.


  Example: `apply_rules(''1Ax Czcc2Baz21'') returns ''10fghcefh''`.


  Return only the code.'
