  2. Collapse every run of the same character into one character.

  3. Convert to uppercase.

  4. Sort the characters in ascending code point order.

  5. Convert to lowercase.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Collapse every run of the same character into one character.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Keep only the first occurrence of each character.

  11. Keep only the first 3 whitespace-separated words, joined by single spaces.

  12. Replace runs of whitespace with a single space and strip both ends.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Replace every ''b'' with ''o'' (lowercase only).

  17. Keep only the first occurrence of each character.

  18. Remove every digit.

  19. Convert to lowercase.

  20. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `process(''2y bz,.1zA.,C'') returns '',.AOC''`.


  Return only the code.'
