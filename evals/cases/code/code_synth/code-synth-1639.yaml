prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort by absolute value, values with equal absolute value keeping their current relative order.

  2. Replace every value with the largest value seen so far.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  8. Keep only the even values.

  9. Replace every value with the largest of itself and the up to 2 values before it.

  10. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Replace every value with the largest of itself and the up to 1 values before it.

  13. Keep only the last 2 values, in their order (all of them if there are fewer).

  14. Add 2 to every value.

  15. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  16. Multiply every value by 5.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([-12, 0, 22, -11]) returns [10]`.


  Return only the code.'
