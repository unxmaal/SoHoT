prompt: 'Write a Python function `wrap_text(text)` that splits `text` into words on whitespace and packs
  them greedily into lines of at most 8 characters, words separated by one space, never splitting a word
  (a word longer than 8 sits alone on its line). Return the list of lines; no words gives an empty list.


  Example: `wrap_text(''juliet golf echo juliet lima echo bravo internationalization internationalization'')
  returns [''juliet'', ''golf'', ''echo'', ''juliet'', ''lima'', ''echo'', ''bravo'', ''internationalization'',
  ''internationalization'']`.


  Return only the code.'
assert:
  checks:
  - wrap_text('echo kilo echo zebra lima charlie charlie') == ['echo', 'kilo', 'echo', 'zebra', 'lima',
    'charlie', 'charlie']
  - wrap_text('charlie lima lima') == ['charlie', 'lima', 'lima']
  - wrap_text('zebra india charlie juliet') == ['zebra', 'india', 'charlie', 'juliet']
  - wrap_text('bravo') == ['bravo']
  - wrap_text('india juliet a alpha a golf alpha delta') == ['india', 'juliet a', 'alpha a', 'golf', 'alpha',
    'delta']
  - wrap_text('zebra') == ['zebra']
