prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Sort ascending.

  3. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Sort ascending.

  7. Keep only the last 2 values, in their order (all of them if there are fewer).

  8. Sort descending.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([18, 8, -8, 2]) returns 16`.


  Return only the code.'
