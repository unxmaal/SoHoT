prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Add 9 to every value.

  4. Keep only the last 4 values, in their order (all of them if there are fewer).

  5. Sort ascending.

  6. Replace every value with the largest of itself and the up to 1 values before it.

  7. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Add -9 to every value.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Sort descending.

  12. Keep only the last 2 values, in their order (all of them if there are fewer).

  13. Keep the values at indices 0, 3, 6, and so on.

  14. Replace every value with its absolute value.

  15. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  16. Keep only the first 6 values (all of them if there are fewer).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `reduce_data([-6, -4, 19, 20]) returns 5`.


  Return only the code.'
