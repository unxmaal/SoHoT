prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  2. Replace every value with its absolute value.

  3. Remove every negative value.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Replace every value with its absolute value.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Replace every value with its square.

  9. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Replace every value with the largest value seen so far.

  12. Replace every value with the largest of itself and the up to 3 values before it.

  13. Replace every value with the largest value seen so far.

  14. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([14, 16, 18, 12, 2, -5, -6, 9]) returns 512`.


  Return only the code.'
