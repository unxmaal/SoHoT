prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Keep only the values greater than 4.

  4. Reverse the list.

  5. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  6. Sort ascending.

  7. Keep only the values greater than 5.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Keep only the first 5 values (all of them if there are fewer).

  11. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  13. Keep only the even values.

  14. Sort descending.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `run_pipeline([-4, 7, 1]) returns 0`.


  Return only the code.'
