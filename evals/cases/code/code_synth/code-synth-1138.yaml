  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Keep only the first occurrence of each character.

  4. Convert to lowercase.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Sort the characters in ascending code point order.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Collapse every run of the same character into one character.

  11. Swap the case of every letter.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Collapse every run of the same character into one character.

  14. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Convert to lowercase.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  19. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  20. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
