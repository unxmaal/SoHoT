  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Swap the case of every letter.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Convert to uppercase.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Swap the case of every letter.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Replace every ''l'' with ''a'' (lowercase only).

  14. Convert to uppercase.

  15. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  16. Replace every maximal run of digits with the number of digits in it.

  Then: Return the number of words (whitespace-separated).


  Example: `transform(''xc A,1z11.AA'') returns 2`.


  Return only the code.'
