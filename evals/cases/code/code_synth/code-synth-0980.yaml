  5. Collapse every run of the same character into one character.

  6. Keep only the first 3 whitespace-separated words, joined by single spaces.

  7. Remove every digit.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Remove every digit.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
