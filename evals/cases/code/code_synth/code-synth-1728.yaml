  1. Convert to lowercase.

  2. Sort the characters in ascending code point order.

  3. Convert to uppercase.

  4. Collapse every run of the same character into one character.

  5. Keep only the first occurrence of each character.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Replace every maximal run of digits with the number of digits in it.

  8. Remove every digit.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Keep only the first occurrence of each character.

  13. Convert to uppercase.

  14. Replace runs of whitespace with a single space and strip both ends.

  Then: Return how many characters it has.


  Example: `transform('' xB,.Cazx'') returns 6`.


  Return only the code.'
