  5. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Remove every digit.

  9. Collapse every run of the same character into one character.

  10. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Keep only the first occurrence of each character.

  13. Swap the case of every letter.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Convert to lowercase.

  Then: Return how many characters it has.


  Example: `reduce_data(''1AA1C0yBC'') returns 4`.


