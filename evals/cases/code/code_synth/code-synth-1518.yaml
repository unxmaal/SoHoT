prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Convert to lowercase.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Collapse every run of the same character into one character.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Keep only the first 2 whitespace-separated words, joined by single spaces.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Convert to uppercase.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Replace every ''d'' with ''o'' (lowercase only).

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Convert to uppercase.

  Then: Return the resulting string.


  Example: `transform(''ay2Az220xc,'') returns ''311,31103112311F311H311C311D311E''`.


  Return only the code.'
