  becomes ''3a1b'').

  4. Convert to uppercase.

  5. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Convert to uppercase.

  7. Keep only the first 3 whitespace-separated words, joined by single spaces.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Remove every digit.

  10. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Sort the characters in ascending code point order.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Convert to uppercase.

  16. Replace runs of whitespace with a single space and strip both ends.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Replace runs of whitespace with a single space and strip both ends.

  19. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  20. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
