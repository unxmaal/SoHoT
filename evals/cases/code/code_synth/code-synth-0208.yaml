prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Sort the characters in ascending code point order.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Convert to uppercase.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''CA2 ba20bz2 z.,0'') returns ''l''`.


  Return only the code.'
