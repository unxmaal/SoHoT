prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Swap the case of every letter.

  4. Keep only the first 3 whitespace-separated words, joined by single spaces.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Remove every digit.

  9. Swap the case of every letter.

  10. Keep only the first 4 whitespace-separated words, joined by single spaces.

  11. Keep only the first occurrence of each character.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Keep only the first 2 whitespace-separated words, joined by single spaces.

  14. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  15. Sort the characters in ascending code point order.

  16. Keep only the first occurrence of each character.

  17. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  18. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the resulting string.


  Example: `run_pipeline(''azzac,Ax. a xz .'') returns ''.Y''`.


  Return only the code.'
