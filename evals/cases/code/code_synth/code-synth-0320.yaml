prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Replace every value with the largest of itself and the up to 1 values before it.

  5. Keep only the values greater than 5.

  6. Remove every negative value.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([12, 7, -8]) returns []`.


  Return only the code.'
