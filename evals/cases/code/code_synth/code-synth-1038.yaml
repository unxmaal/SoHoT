prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Swap the case of every letter.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Replace every ''s'' with ''d'' (lowercase only).

  5. Collapse every run of the same character into one character.

  6. Sort the characters in ascending code point order.

  7. Keep only the first occurrence of each character.

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Keep only the first occurrence of each character.

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Swap the case of every letter.

  13. Collapse every run of the same character into one character.

  14. Sort the characters in ascending code point order.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
