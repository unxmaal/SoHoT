  2. Convert to lowercase.

  3. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Replace every maximal run of digits with the number of digits in it.

  6. Keep only the first occurrence of each character.

  7. Replace every ''r'' with ''s'' (lowercase only).

  8. Remove every digit.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Sort the characters in ascending code point order.

  12. Remove every digit.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  15. Replace every ''d'' with ''i'' (lowercase only).

  16. Keep only the first occurrence of each character.

  17. Swap the case of every letter.

  18. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''bcBzzCzb'') returns ''ZCB.''`.


  Return only the code.'
