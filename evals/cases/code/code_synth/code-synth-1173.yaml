prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  2. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  3. Replace every value with its square.

  4. Sort ascending.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Add 6 to every value.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Remove every negative value.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Keep only the last 5 values, in their order (all of them if there are fewer).

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Keep the values at indices 0, 2, 4, and so on.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the sum of the values (0 for an empty list).


  Example: `transform([-2, 5, -9, 21, 14, 11, -11]) returns 94`.


  Return only the code.'
