prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Keep only the first 3 values (all of them if there are fewer).

  3. Replace every value with the largest value seen so far.

  4. Replace every value with the largest of itself and the up to 2 values before it.

  5. Reverse the list.

  6. Clamp every value into the range -5 to 1, both inclusive.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  10. Add 2 to every value.

  11. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  12. Reverse the list.

  13. Multiply every value by -2.

  14. Add -1 to every value.

  15. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  16. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  17. Replace every value with its square.

  18. Keep the values at indices 0, 2, 4, and so on.

  19. Sort descending.

  20. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([16, -5, 2, 15, 13, 11, 25, -9, -8]) returns 9`.


  Return only the code.'
