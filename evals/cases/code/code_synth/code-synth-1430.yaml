  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Keep only the first occurrence of each character.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Convert to lowercase.

  10. Convert to uppercase.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Keep only the first occurrence of each character.

  13. Convert to lowercase.

  14. Sort the characters in ascending code point order.

  15. Convert to uppercase.

  16. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
