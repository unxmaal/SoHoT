prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Collapse every run of the same character into one character.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Collapse every run of the same character into one character.

  5. Convert to lowercase.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Remove every digit.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Collapse every run of the same character into one character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''zA.A b,Ab.Ab 2,b'') returns ''B,b.b''`.


  Return only the code.'
