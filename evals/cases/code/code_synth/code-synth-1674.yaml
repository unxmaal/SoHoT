prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Replace every ''a'' with ''s'' (lowercase only).

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Convert to uppercase.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Collapse every run of the same character into one character.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Remove every digit.

  14. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''cy,Ca,AC.1x'') returns ''x.c,c,yc''`.


  Return only the code.'
