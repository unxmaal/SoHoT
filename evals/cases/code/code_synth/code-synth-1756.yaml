prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Replace every ''n'' with ''l'' (lowercase only).

  4. Swap the case of every letter.

  5. Replace every ''r'' with ''l'' (lowercase only).

  6. Swap the case of every letter.

  7. Replace every ''d'' with ''a'' (lowercase only).

  8. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  9. Remove every digit.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Swap the case of every letter.

  12. Sort the characters in ascending code point order.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Convert to uppercase.

  16. Collapse every run of the same character into one character.

  17. Sort the characters in ascending code point order.

  18. Collapse every run of the same character into one character.

  Then: Return how many characters it has.


  Example: `reduce_data('',cy,cBz0cCx'') returns 1`.


  Return only the code.'
