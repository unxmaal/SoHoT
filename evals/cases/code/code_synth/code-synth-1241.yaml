  4. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  5. Multiply every value by 5.

  6. Clamp every value into the range -2 to 4, both inclusive.

  7. Sort ascending.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Replace every value with the largest value seen so far.

  10. Multiply every value by 5.

  11. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  12. Replace every value with the largest value seen so far.

  13. Replace every value with its square.

  14. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([8, 4, 9, 6, 17, -9, 6]) returns 1200`.


  Return only the code.'
