  2. Replace every value with its square.

  3. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Reverse the list.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Keep only the last 3 values, in their order (all of them if there are fewer).

  8. Sort descending.

  9. Keep only the values greater than 4.

  10. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  11. Remove every negative value.

  12. Multiply every value by 5.

  13. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  14. Keep only the values greater than 0.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([19, 16, 22, -4, 8, -2, -10]) returns 0`.


  Return only the code.'
