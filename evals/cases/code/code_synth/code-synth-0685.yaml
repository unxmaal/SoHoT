prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Collapse every run of the same character into one character.

  3. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Keep only the first occurrence of each character.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''zb.C2ccbx1,'') returns '',ot1T.sq1''`.


  Return only the code.'
