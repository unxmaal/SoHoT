prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort by absolute value, values with equal absolute value keeping their current relative order.

  2. Sort ascending.

  3. Collapse each run of equal adjacent values into one value.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Multiply every value by 2.

  7. Replace every value with the largest value seen so far.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Keep the values at indices 0, 3, 6, and so on.

  11. Add 2 to every value.

  12. Keep only the first 2 values (all of them if there are fewer).

  13. Replace every value with its square.

  14. Add 2 to every value.

  15. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  16. Multiply every value by 3.

  17. Replace every value with the largest value seen so far.

  18. Remove every negative value.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `apply_rules([3, 7, 9, 25]) returns 3894`.


  Return only the code.'
