prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Swap the case of every letter.

  3. Collapse every run of the same character into one character.

  4. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Swap the case of every letter.

  6. Collapse every run of the same character into one character.

  7. Keep only the first 3 whitespace-separated words, joined by single spaces.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Remove every digit.

  12. Replace runs of whitespace with a single space and strip both ends.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Sort the characters in ascending code point order.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Convert to lowercase.

  18. Swap the case of every letter.

  19. Replace every maximal run of digits with the number of digits in it.

  20. Keep only the first occurrence of each character.

  Then: Return how many characters it has.


  Example: `run_pipeline(''zb0A1Ay.yz.xc.a'') returns 6`.


  Return only the code.'
