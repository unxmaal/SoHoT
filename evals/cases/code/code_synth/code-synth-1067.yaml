  15. Reverse the list.

  16. Add -1 to every value.

  17. Replace every value with the largest of itself and the up to 3 values before it.

  18. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  Then: Return the resulting list.


  Example: `solve([13, 23, -11, -3, 16, -3, 19, 17, -3]) returns [-11]`.


  Return only the code.'
