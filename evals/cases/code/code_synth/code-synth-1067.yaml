  1. Sort ascending.

  2. Reverse the list.

  3. Multiply every value by -1.

  4. Drop the first 1 values (an empty list if there are fewer).

  5. Keep only the values greater than -2.

  6. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  7. Keep only the values greater than -1.

  8. Add -9 to every value.

  9. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  10. Replace every value with the largest of itself and the up to 3 values before it.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Multiply every value by 5.

  13. Reverse the list.

  14. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
