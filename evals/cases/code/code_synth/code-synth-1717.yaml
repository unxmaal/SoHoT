prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Clamp every value into the range -5 to 1, both inclusive.

  2. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Sort ascending.

  7. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  8. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  9. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  10. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Reverse the list.

  13. Add 9 to every value.

  14. Keep only the even values.

  Then: Return the resulting list.


  Example: `solve([-6, 21, -8, 25, 10, 7]) returns [12]`.


  Return only the code.'
