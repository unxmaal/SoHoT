prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Remove every digit.

  3. Collapse every run of the same character into one character.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Convert to uppercase.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Collapse every run of the same character into one character.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Sort the characters in ascending code point order.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Keep only the first 3 whitespace-separated words, joined by single spaces.

  12. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  Then: Return the resulting string.


  Example: `run_pipeline(''C1z0c,,b'') returns '',5BCCZ..''`.


  Return only the code.'
