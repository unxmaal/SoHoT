  1. Replace every value with the largest value seen so far.

  2. Keep only the last 3 values, in their order (all of them if there are fewer).

  3. Replace every value with the largest value seen so far.

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Replace every value with the largest of itself and the up to 1 values before it.

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  8. Keep only the values greater than 2.

  9. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Collapse each run of equal adjacent values into one value.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([8, 14, 18, -2, 3, 17]) returns 0`.


  Return only the code.'
