  7. Keep only the values greater than 1.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  10. Replace every value with the largest of itself and the up to 3 values before it.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
