  12. Reverse the list.

  13. Sort descending.

  14. Keep only the first 4 values (all of them if there are fewer).

  15. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  16. Collapse each run of equal adjacent values into one value.

  17. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  18. Sort descending.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([-3, -3, -11, 2]) returns []`.


