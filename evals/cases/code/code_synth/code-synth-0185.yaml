prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  4. Replace every ''c'' with ''d'' (lowercase only).

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  10. Convert to lowercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''x1222ACaCb '') returns ''3113..''`.


  Return only the code.'
