  12. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  13. Keep only the first 2 whitespace-separated words, joined by single spaces.

  14. Convert to lowercase.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  19. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  20. Replace every ''a'' with ''e'' (lowercase only).

