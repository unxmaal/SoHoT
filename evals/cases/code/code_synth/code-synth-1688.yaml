  17. Convert to lowercase.

  18. Convert to uppercase.

  19. Reverse the order of the whitespace-separated words and join them with single spaces.

  20. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
