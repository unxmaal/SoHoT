  9. Replace every maximal run of digits with the number of digits in it.

  10. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Collapse every run of the same character into one character.

  13. Keep only the first occurrence of each character.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Swap the case of every letter.

  16. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
