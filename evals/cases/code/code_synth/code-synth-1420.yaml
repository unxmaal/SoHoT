  2. Keep only the first 4 whitespace-separated words, joined by single spaces.

  3. Replace every ''r'' with ''n'' (lowercase only).

  4. Remove every digit.

  5. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Swap the case of every letter.

  9. Sort the characters in ascending code point order.

  10. Remove every digit.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Sort the characters in ascending code point order.

  13. Convert to lowercase.

  14. Collapse every run of the same character into one character.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Collapse every run of the same character into one character.

  17. Convert to uppercase.

  18. Replace every maximal run of digits with the number of digits in it.

  19. Keep only the first occurrence of each character.

  20. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the resulting string.


  Example: `compute(''.2aCybA 0B'') returns ''.SUVW''`.


  Return only the code.'
