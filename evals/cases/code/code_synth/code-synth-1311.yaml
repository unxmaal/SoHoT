prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Reverse the list.

  2. Keep only the last 5 values, in their order (all of them if there are fewer).

  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Sort ascending.

  5. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  6. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  7. Replace every value with its absolute value.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Drop the first 1 values (an empty list if there are fewer).

  10. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([6, -11, 19, 17, 25, -2, 15, 20, 6]) returns 11`.


  Return only the code.'
