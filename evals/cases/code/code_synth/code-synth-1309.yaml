  3. Keep only the even values.

  4. Add 2 to every value.

  5. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  6. Multiply every value by -1.

  7. Replace every value with its absolute value.

  8. Replace every value with its square.

  9. Keep only the even values.

  10. Replace every value with its square.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Keep only the first 5 values (all of them if there are fewer).

  13. Remove every negative value.

  14. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  15. Keep only the first 4 values (all of them if there are fewer).

  16. Keep the values at indices 0, 2, 4, and so on.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


