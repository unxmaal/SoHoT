  2. Swap the case of every letter.

  3. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Keep only the first occurrence of each character.

  5. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Remove every digit.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Collapse every run of the same character into one character.

  11. Keep only the first occurrence of each character.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Keep only the first 2 whitespace-separated words, joined by single spaces.

  16. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `transform(''0C2101.A,Cxcz'') returns ''.''`.


  Return only the code.'
