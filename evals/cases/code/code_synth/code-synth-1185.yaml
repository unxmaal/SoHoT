prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  2. Reverse the list.

  3. Sort descending.

  4. Keep only the last 4 values, in their order (all of them if there are fewer).

  5. Keep only the even values.

  6. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  7. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  8. Replace every value with the largest of itself and the up to 1 values before it.

  9. Sort descending.

  10. Sort ascending.

  11. Replace every value with its absolute value.

  12. Replace every value with its square.

  13. Reverse the list.

  14. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([12, 10, 14, 4]) returns [0, 0]`.


  Return only the code.'
