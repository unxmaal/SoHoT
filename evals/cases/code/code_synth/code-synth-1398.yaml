prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Keep only the first 4 whitespace-separated words, joined by single spaces.

  3. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Sort the characters in ascending code point order.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Remove every digit.

  10. Keep only the first occurrence of each character.

  11. Convert to uppercase.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Collapse every run of the same character into one character.

  14. Replace every ''s'' with ''b'' (lowercase only).

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Keep only the first 3 whitespace-separated words, joined by single spaces.

  17. Convert to lowercase.

  18. Convert to uppercase.

  Then: Return how many characters it has.


  Example: `transform(''xy2bxxa,baA '') returns 10`.


  Return only the code.'
