prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Keep only the first occurrence of each character.

  3. Convert to lowercase.

  4. Keep only the first 4 whitespace-separated words, joined by single spaces.

  5. Remove every digit.

  6. Convert to lowercase.

  7. Swap the case of every letter.

  8. Keep only the first 4 whitespace-separated words, joined by single spaces.

  9. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Convert to lowercase.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Keep only the first occurrence of each character.

  15. Collapse every run of the same character into one character.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Keep only the first 3 whitespace-separated words, joined by single spaces.

  18. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''BzyaxBA1b 0Bzc10'') returns ''rustv''`.


  Return only the code.'
