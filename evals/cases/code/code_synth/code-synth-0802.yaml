  2. Clamp every value into the range 0 to 4, both inclusive.

  3. Sort descending.

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Add 9 to every value.

  6. Sort descending.

  7. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  8. Clamp every value into the range -5 to -1, both inclusive.

  Then: Return the resulting list.


  Example: `apply_rules([24, 12, 17, -11, 4, -5]) returns [-1, -1]`.


  Return only the code.'
