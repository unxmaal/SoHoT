prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  2. Sort the characters in ascending code point order.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  6. Sort the characters in ascending code point order.

  7. Keep only the first occurrence of each character.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Convert to uppercase.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Keep only the first 2 whitespace-separated words, joined by single spaces.

  14. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Remove every vowel (a, e, i, o, u, either case).

  Then: Return how many characters it has.


  Example: `transform(''yx,c.y12AxAyb0'') returns 12`.


  Return only the code.'
