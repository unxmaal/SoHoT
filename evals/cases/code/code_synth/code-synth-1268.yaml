prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Remove every digit.

  4. Collapse every run of the same character into one character.

  5. Swap the case of every letter.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Swap the case of every letter.

  8. Collapse every run of the same character into one character.

  9. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Swap the case of every letter.

  12. Keep only the first 4 whitespace-separated words, joined by single spaces.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data('',cAA.C 1'') returns ''111h111.111f111H111,111.''`.


  Return only the code.'
