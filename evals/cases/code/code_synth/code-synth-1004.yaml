  - run_program([5, 9, 'sub', 'sub']) == [-4]
  - run_program(['over', -2, 'drop', 3, -3, 'drop', 'sub', 1]) == [3, 1]
  - run_program([3, 'dup', 'over', 'sub', 'dup', 1, 'drop', 'drop']) == [3, 0]
