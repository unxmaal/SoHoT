prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''over'', ''drop'', ''sub'', ''dup'': over pushes
  a copy of the second value from the top; drop removes the top value; sub pops b then a and pushes a
  - b, so the value pushed first is a; dup copies the top value onto the stack. An operation that needs
  more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([0, ''dup'']) returns [0, 0]`.


  Return only the code.'
