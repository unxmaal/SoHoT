  3. Remove every vowel (a, e, i, o, u, either case).

  4. Keep only the first 4 whitespace-separated words, joined by single spaces.

  5. Keep only the first occurrence of each character.

  6. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Sort the characters in ascending code point order.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Swap the case of every letter.

  13. Convert to lowercase.

  14. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `process('',yyc,ay 020 ab'') returns '' ,SW''`.


