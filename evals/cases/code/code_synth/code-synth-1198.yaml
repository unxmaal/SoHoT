  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Convert to lowercase.

  6. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  7. Collapse every run of the same character into one character.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Convert to uppercase.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Convert to lowercase.

  14. Convert to uppercase.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Replace every ''i'' with ''e'' (lowercase only).

  17. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  18. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
