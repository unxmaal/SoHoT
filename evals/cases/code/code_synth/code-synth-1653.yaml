  9. Keep only the values greater than 0.

  10. Reverse the list.

  11. Replace every value with its square.

  12. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  13. Keep the values at indices 0, 3, 6, and so on.

  14. Replace every value with the largest of itself and the up to 2 values before it.

