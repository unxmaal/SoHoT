  3. Keep only the first occurrence of each character.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Sort the characters in ascending code point order.

  10. Convert to uppercase.

  11. Replace every ''n'' with ''a'' (lowercase only).

  12. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `compute(''xxCyBAAya.bc'') returns ''.1ABCABCXY''`.


  Return only the code.'
