prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Keep only the first 2 whitespace-separated words, joined by single spaces.

  5. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Convert to lowercase.

  8. Collapse every run of the same character into one character.

  9. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Convert to lowercase.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return how many characters it has.


  Example: `run_pipeline('' BCcBCb 1.Bx B '') returns 19`.


  Return only the code.'
