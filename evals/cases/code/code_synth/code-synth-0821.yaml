  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  7. Replace every value with its absolute value.

  8. Replace every value with the largest value seen so far.

  9. Reverse the list.

  10. Keep the values at indices 0, 2, 4, and so on.

  Then: Return the resulting list.


  Example: `compute([15, -3, 9, 23, 16, 9, -10, -11]) returns [2]`.


  Return only the code.'
