  9. Convert to uppercase.

  10. Swap the case of every letter.

  11. Sort the characters in ascending code point order.

  12. Convert to uppercase.

  13. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  Then: Return the resulting string.


  Example: `reduce_data(''AA0A1xza1Cz.'') returns ''.DFFGGG''`.


  Return only the code.'
