  other characters are unchanged.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Remove every digit.

  6. Replace every ''a'' with ''e'' (lowercase only).

  7. Convert to uppercase.

  8. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
