prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  2. Sort descending.

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Keep only the first 3 values (all of them if there are fewer).

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  7. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Reverse the list.

  12. Collapse each run of equal adjacent values into one value.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Clamp every value into the range -4 to 5, both inclusive.

  Then: Return the resulting list.


  Example: `reduce_data([-6, 7, 20, -12, 13]) returns [3]`.


  Return only the code.'
