prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep the values at indices 0, 2, 4, and so on.

  2. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  3. Replace every value with its square.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Reverse the list.

  6. Keep only the last 5 values, in their order (all of them if there are fewer).

  7. Replace every value with the largest of itself and the up to 3 values before it.

  8. Collapse each run of equal adjacent values into one value.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace every value with its absolute value.

  11. Sort descending.

  12. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  13. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  14. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  15. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  16. Keep only the values greater than 4.

  17. Sort by absolute value, values with equal absolute value keeping their current relative order.

  18. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  19. Replace every value with its square.

  20. Keep only the last 2 values, in their order (all of them if there are fewer).

  Then: Return the resulting list.


  Example: `compute([-8, 17, 6]) returns []`.


  Return only the code.'
