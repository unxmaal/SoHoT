prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Keep only the even values.

  3. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Sort ascending.

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Keep only the last 3 values, in their order (all of them if there are fewer).

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Add -9 to every value.

  10. Keep only the last 2 values, in their order (all of them if there are fewer).

  11. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  12. Collapse each run of equal adjacent values into one value.

  13. Reverse the list.

  14. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the resulting list.


  Example: `apply_rules([10, 9, 18]) returns [0]`.


  Return only the code.'
