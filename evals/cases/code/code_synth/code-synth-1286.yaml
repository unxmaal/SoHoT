prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Keep only the first occurrence of each character.

  9. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Collapse every run of the same character into one character.

  11. Convert to uppercase.

  12. Keep only the first occurrence of each character.

  13. Sort the characters in ascending code point order.

  14. Convert to uppercase.

  Then: Return how many characters it has.


  Example: `reduce_data(''B1zxABB2y,C 0C'') returns 9`.


  Return only the code.'
