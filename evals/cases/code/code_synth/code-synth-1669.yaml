prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by 2.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Sort descending.

  4. Keep the values at indices 0, 3, 6, and so on.

  5. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  6. Replace every value with the largest value seen so far.

  7. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  8. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  9. Collapse each run of equal adjacent values into one value.

  10. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  11. Replace every value with the largest value seen so far.

  12. Replace every value with its absolute value.

  13. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the resulting list.


  Example: `apply_rules([3, -3, -12, 11, 8, -12]) returns [2]`.


  Return only the code.'
