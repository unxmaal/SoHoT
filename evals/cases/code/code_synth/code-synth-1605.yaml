prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Remove every negative value.

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Collapse each run of equal adjacent values into one value.

  6. Keep only the first 3 values (all of them if there are fewer).

  7. Replace every value with its absolute value.

  8. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  9. Keep only the values greater than 4.

  10. Replace every value with its square.

  11. Drop the first 1 values (an empty list if there are fewer).

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Add 2 to every value.

  14. Replace every value with its absolute value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `run_pipeline([16, 24, -1, 19, -12, 23, -4]) returns -1`.


  Return only the code.'
