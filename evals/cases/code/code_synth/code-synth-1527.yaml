prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Keep the values at indices 0, 2, 4, and so on.

  3. Sort ascending.

  4. Replace every value with its square.

  5. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  6. Keep only the last 5 values, in their order (all of them if there are fewer).

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Keep only the values greater than -3.

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  11. Replace every value with its square.

  12. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  13. Reverse the list.

  14. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([-4, 22, 5, 15, 20, 2, -9, -5]) returns 1`.


  Return only the code.'
