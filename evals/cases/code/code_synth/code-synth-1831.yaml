prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Sort descending.

  2. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  3. Collapse each run of equal adjacent values into one value.

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Keep only the last 2 values, in their order (all of them if there are fewer).

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Keep only the even values.

  8. Replace every value with its absolute value.

  9. Replace every value with the largest value seen so far.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Multiply every value by 5.

  12. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  13. Keep the values at indices 0, 3, 6, and so on.

  14. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  15. Clamp every value into the range -4 to 5, both inclusive.

  16. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  17. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  18. Replace every value with its absolute value.

  19. Multiply every value by 3.

  20. Keep only the last 5 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `solve([-12, 17, 12, -2, 0, 24]) returns []`.


  Return only the code.'
