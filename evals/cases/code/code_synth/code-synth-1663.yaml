prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its square.

  2. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Replace every value with its absolute value.

  5. Reverse the list.

  6. Keep only the last 4 values, in their order (all of them if there are fewer).

  7. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  8. Keep only the even values.

  9. Replace every value with its absolute value.

  10. Keep only the even values.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Sort ascending.

  13. Collapse each run of equal adjacent values into one value.

  14. Add -1 to every value.

  15. Replace every value with the largest value seen so far.

  16. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  Then: Return the resulting list.


  Example: `apply_rules([-11, -9, -3, 9, 4, -2]) returns [29, 3]`.


  Return only the code.'
