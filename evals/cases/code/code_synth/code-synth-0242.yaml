prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Keep only the values greater than 0.

  3. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Add -1 to every value.

  9. Sort ascending.

  10. Collapse each run of equal adjacent values into one value.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `run_pipeline([-1, 12, 9, 1, 24, 16]) returns 6`.


  Return only the code.'
