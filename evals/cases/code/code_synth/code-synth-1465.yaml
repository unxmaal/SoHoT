  4. Replace every value with its absolute value.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Sort descending.

  7. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  10. Sort ascending.

  11. Replace every value with its absolute value.

  12. Reverse the list.

  13. Add -3 to every value.

  14. Sort descending.

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([-12, -3, 22, -6]) returns 0`.


