prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Multiply every value by 5.

  2. Keep only the first 6 values (all of them if there are fewer).

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Replace every value with its square.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Remove every negative value.

  8. Multiply every value by -2.

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  11. Add 4 to every value.

  12. Collapse each run of equal adjacent values into one value.

  13. Replace every value with its square.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return how many distinct values there are.


  Example: `solve([22, 12, -2]) returns 1`.


  Return only the code.'
