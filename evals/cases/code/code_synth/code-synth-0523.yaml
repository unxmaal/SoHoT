prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Add 6 to every value.

  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Keep only the values greater than -1.

  6. Replace every value with its absolute value.

  7. Multiply every value by 3.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Replace every value with the largest value seen so far.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the resulting list.


  Example: `solve([18, 13, -5, 21, 12, 15, 10, -4]) returns [15, 15, 15]`.


  Return only the code.'
