  two values and pushes their product; over pushes a copy of the second value from the top; add pops two
  values and pushes their sum; drop removes the top value. An operation that needs more values than the
  stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''add'', -2, ''mul'', 3, ''over'', ''over'', 2, ''drop'', ''drop'']) returns
  [-2, 3, -2]`.


