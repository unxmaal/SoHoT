  2. Sort ascending.

  3. Replace every value with its square.

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  6. Remove every negative value.

  7. Replace every value with its absolute value.

  8. Keep only the first 3 values (all of them if there are fewer).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `apply_rules([1, 1, 3, 4, 7, 0]) returns 0`.


  Return only the code.'
