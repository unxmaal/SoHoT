prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Replace every value with its absolute value.

  4. Keep only the last 3 values, in their order (all of them if there are fewer).

  5. Keep only the values greater than -3.

  6. Replace every value with the largest value seen so far.

  7. Remove every negative value.

  8. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  9. Replace every value with its square.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Add 2 to every value.

  12. Keep only the first 6 values (all of them if there are fewer).

  13. Replace every value with its square.

  14. Replace every value with its absolute value.

  15. Sort ascending.

  16. Collapse each run of equal adjacent values into one value.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `apply_rules([18, 10, 3, 8]) returns 422500`.


  Return only the code.'
