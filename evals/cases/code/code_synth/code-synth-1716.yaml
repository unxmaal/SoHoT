prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Sort the characters in ascending code point order.

  3. Keep only the first 4 whitespace-separated words, joined by single spaces.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Convert to uppercase.

  8. Replace every ''d'' with ''a'' (lowercase only).

  9. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Replace every ''a'' with ''i'' (lowercase only).

  11. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Remove every vowel (a, e, i, o, u, either case).

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Collapse every run of the same character into one character.

  Then: Return how many characters it has.


  Example: `reduce_data(''A1c BbCy1yB.xc2'') returns 9`.


  Return only the code.'
