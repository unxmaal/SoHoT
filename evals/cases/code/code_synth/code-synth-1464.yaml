prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every digit.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Keep only the first 2 whitespace-separated words, joined by single spaces.

  6. Remove every digit.

  7. Convert to uppercase.

  8. Remove every digit.

  9. Collapse every run of the same character into one character.

  10. Swap the case of every letter.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Collapse every run of the same character into one character.

  13. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Convert to uppercase.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Swap the case of every letter.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Collapse every run of the same character into one character.

  19. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  20. Replace every ''l'' with ''t'' (lowercase only).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''Aayyb2C1c0xxx,y'') returns ''111f111,111e111j111i111f111h''`.


  Return only the code.'
