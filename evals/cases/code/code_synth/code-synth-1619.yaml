prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by 3.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  7. Sort descending.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Replace every value with its square.

  10. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  11. Replace every value with its square.

  12. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  13. Multiply every value by -2.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  15. Add 4 to every value.

  16. Sort ascending.

  17. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  18. Collapse each run of equal adjacent values into one value.

  19. Clamp every value into the range -4 to 3, both inclusive.

  20. Keep only the even values.

  Then: Return the resulting list.


  Example: `transform([23, -3, -11, -3, -8, 2]) returns [-4]`.


  Return only the code.'
