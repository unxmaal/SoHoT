prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Collapse every run of the same character into one character.

  3. Keep only the first 3 whitespace-separated words, joined by single spaces.

  4. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  5. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Remove every digit.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Keep only the first occurrence of each character.

  9. Collapse every run of the same character into one character.

  10. Swap the case of every letter.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Convert to lowercase.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''b.a.z ,yaB0yc'') returns ''.fg''`.


  Return only the code.'
