  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Swap the case of every letter.

  6. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the resulting string.


