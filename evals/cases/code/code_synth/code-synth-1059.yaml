  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Replace every value with the largest value seen so far.

  6. Replace every value with the largest of itself and the up to 2 values before it.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Collapse each run of equal adjacent values into one value.

  9. Replace every value with its absolute value.

  10. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  11. Replace every value with its square.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Remove every negative value.

  14. Clamp every value into the range -3 to 2, both inclusive.

  Then: Return the resulting list.


  Example: `reduce_data([21, -4, 10, 9, 25, 24, 11, 6, 10]) returns [0, 1, 2, 2, 2]`.


  Return only the code.'
