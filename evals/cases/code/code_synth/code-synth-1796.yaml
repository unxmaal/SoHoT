prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Convert to uppercase.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Keep only the first occurrence of each character.

  8. Convert to uppercase.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Keep only the first 4 whitespace-separated words, joined by single spaces.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the number of words (whitespace-separated).


  Example: `solve(''bzyBBC1x.'') returns 1`.


  Return only the code.'
