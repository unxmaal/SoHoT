prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Swap the case of every letter.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Keep only the first occurrence of each character.

  7. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Convert to uppercase.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Replace every maximal run of digits with the number of digits in it.

  13. Keep only the first 3 whitespace-separated words, joined by single spaces.

  14. Replace every ''e'' with ''l'' (lowercase only).

  15. Convert to lowercase.

  16. Keep only the first 4 whitespace-separated words, joined by single spaces.

  17. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  18. Convert to uppercase.

  19. Replace runs of whitespace with a single space and strip both ends.

  20. Replace every ''l'' with ''t'' (lowercase only).

  Then: Return the resulting string.


  Example: `compute(''20z,0Czz aC'') returns ''1K1 3H1,2''`.


  Return only the code.'
