prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every digit.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Keep only the first 2 whitespace-separated words, joined by single spaces.

  4. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Convert to uppercase.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  15. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Collapse every run of the same character into one character.

  19. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  20. Convert to lowercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''2yyCyB1AazA'') returns ''2p1t1p1s1r''`.


  Return only the code.'
