prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  6. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  7. Reverse the list.

  8. Collapse each run of equal adjacent values into one value.

  9. Keep only the last 3 values, in their order (all of them if there are fewer).

  10. Keep only the first 2 values (all of them if there are fewer).

  11. Sort ascending.

  12. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  13. Collapse each run of equal adjacent values into one value.

  14. Replace every value with the largest of itself and the up to 1 values before it.

  Then: Return the resulting list.


  Example: `transform([12, -8, 12, -3, 20, 16, 6]) returns [-1, 3]`.


  Return only the code.'
