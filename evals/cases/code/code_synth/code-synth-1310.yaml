prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Convert to lowercase.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Keep only the first 4 whitespace-separated words, joined by single spaces.

  7. Keep only the first occurrence of each character.

  8. Convert to lowercase.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Remove every digit.

  11. Keep only the first 3 whitespace-separated words, joined by single spaces.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  14. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  15. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Convert to lowercase.

  18. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  19. Remove every vowel (a, e, i, o, u, either case).

  20. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


