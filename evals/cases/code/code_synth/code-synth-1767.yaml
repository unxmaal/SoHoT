  3. Remove duplicates, keeping the first occurrence of each value.

  4. Keep only the last 3 values, in their order (all of them if there are fewer).

  5. Remove every negative value.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Keep only the even values.

  8. Reverse the list.

  9. Replace every value with its absolute value.

  10. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  11. Keep the values at indices 0, 3, 6, and so on.

  12. Add 6 to every value.

  13. Collapse each run of equal adjacent values into one value.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Replace every value with the largest value seen so far.

  16. Remove duplicates, keeping the first occurrence of each value.

  17. Keep only the first 3 values (all of them if there are fewer).

  18. Keep only the last 4 values, in their order (all of them if there are fewer).

  Then: Return the resulting list.


  Example: `solve([2, 15, -9, 8, 21, 16, 21, -9]) returns [10]`.


  Return only the code.'
