prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Sort ascending.

  3. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  4. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  5. Multiply every value by 5.

  6. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  7. Reverse the list.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Keep the values at indices 0, 2, 4, and so on.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  12. Replace every value with its absolute value.

  13. Remove every negative value.

  14. Keep the values at indices 0, 3, 6, and so on.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([20, 21, 10, 13, -8, 18, -12, 13]) returns [12, 16]`.


  Return only the code.'
