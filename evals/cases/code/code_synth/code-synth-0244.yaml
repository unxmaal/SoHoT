  3. Replace runs of whitespace with a single space and strip both ends.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Remove every digit.

  10. Sort the characters in ascending code point order.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
