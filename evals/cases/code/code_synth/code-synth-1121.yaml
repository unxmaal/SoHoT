  2. Remove every negative value.

  3. Drop the first 3 values (an empty list if there are fewer).

  4. Keep only the first 3 values (all of them if there are fewer).

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Keep only the values greater than 4.

  7. Collapse each run of equal adjacent values into one value.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Replace every value with the largest value seen so far.

  10. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  11. Keep only the last 3 values, in their order (all of them if there are fewer).

  12. Keep only the first 5 values (all of them if there are fewer).

  13. Replace every value with its square.

  14. Replace every value with the largest of itself and the up to 3 values before it.

  15. Multiply every value by 5.

  16. Sort descending.

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([6, 4, -2, 6, -12, 8]) returns 0`.


  Return only the code.'
