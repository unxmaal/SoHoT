  6. Collapse every run of the same character into one character.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Keep only the first occurrence of each character.

  9. Swap the case of every letter.

  10. Convert to lowercase.

  11. Remove every digit.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Convert to lowercase.

  14. Replace every ''o'' with ''r'' (lowercase only).

  15. Remove every digit.

  16. Replace runs of whitespace with a single space and strip both ends.

  17. Keep only the first 2 whitespace-separated words, joined by single spaces.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  19. Remove every digit.

  20. Keep only the first occurrence of each character.

  Then: Return the resulting string.


  Example: `run_pipeline(''a2.x11BzACca0y'') returns ''e.bfdgc''`.


