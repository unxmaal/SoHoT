prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Sort descending.

  4. Replace every value with the largest of itself and the up to 2 values before it.

  5. Keep only the last 2 values, in their order (all of them if there are fewer).

  6. Replace every value with its square.

  7. Collapse each run of equal adjacent values into one value.

  8. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([-1, 13, 6]) returns 84`.


  Return only the code.'
