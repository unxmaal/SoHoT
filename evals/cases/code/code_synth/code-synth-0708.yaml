  other characters are unchanged.

  3. Sort the characters in ascending code point order.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Convert to lowercase.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Keep only the first occurrence of each character.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the resulting string.


  Example: `process(''az1Cc22zc  0x2'') returns ''Gedg1''`.


  Return only the code.'
