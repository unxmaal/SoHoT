  2. Replace every value with its square.

  3. Replace every value with its absolute value.

  4. Multiply every value by 3.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Sort descending.

  7. Keep the values at indices 0, 2, 4, and so on.

  8. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([18, 16, -11, 21, -11, -10, 2, -3, 5]) returns [486, 793]`.


