  1. Convert to uppercase.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Replace every maximal run of digits with the number of digits in it.

  4. Collapse every run of the same character into one character.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Replace every ''d'' with ''l'' (lowercase only).

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the number of words (whitespace-separated).


  Example: `solve(''b y,zc10. cyc'') returns 2`.


  Return only the code.'
