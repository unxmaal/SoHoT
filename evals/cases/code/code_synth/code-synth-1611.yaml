prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Sort descending.

  2. Replace every value with its absolute value.

  3. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  4. Sort descending.

  5. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Keep only the last 5 values, in their order (all of them if there are fewer).

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Replace every value with the largest value seen so far.

  10. Sort descending.

  11. Replace every value with its square.

  12. Add -1 to every value.

  13. Replace every value with the largest value seen so far.

  14. Replace every value with its absolute value.

  15. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  16. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  17. Replace every value with its absolute value.

  18. Replace every value with its square.

  Then: Return the resulting list.


  Example: `compute([21, 18, 11, 12]) returns [64, 49, 36, 25]`.


  Return only the code.'
