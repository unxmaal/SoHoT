prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Replace every maximal run of digits with the number of digits in it.

  3. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  4. Collapse every run of the same character into one character.

  5. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  6. Keep only the first 3 whitespace-separated words, joined by single spaces.

  7. Convert to uppercase.

  8. Swap the case of every letter.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Sort the characters in ascending code point order.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Sort the characters in ascending code point order.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `transform(''aBbAaaAABB '') returns ''.lm''`.


  Return only the code.'
