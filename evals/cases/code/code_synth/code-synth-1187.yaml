  16. Clamp every value into the range 0 to 7, both inclusive.

  17. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  18. Keep only the first 4 values (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([-12, 7, 25]) returns [1]`.


