  7. Replace every value with the largest of itself and the up to 1 values before it.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  10. Add 4 to every value.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  13. Keep only the first 4 values (all of them if there are fewer).

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  15. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
