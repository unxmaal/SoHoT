prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Collapse every run of the same character into one character.

  8. Keep only the first 2 whitespace-separated words, joined by single spaces.

  9. Convert to lowercase.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Convert to uppercase.

  14. Replace every ''t'' with ''l'' (lowercase only).

  15. Replace every maximal run of digits with the number of digits in it.

  16. Reverse the order of the whitespace-separated words and join them with single spaces.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the resulting string.


  Example: `run_pipeline(''a,y0zax0B'') returns ''131,131g171h131f171j''`.


  Return only the code.'
