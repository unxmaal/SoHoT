  4. Keep only the last 2 values, in their order (all of them if there are fewer).

  5. Sort ascending.

  6. Reverse the list.

  7. Clamp every value into the range 0 to 9, both inclusive.

  8. Reverse the list.

  9. Sort descending.

  10. Add -3 to every value.

  11. Multiply every value by 2.

  12. Replace every value with its absolute value.

  13. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  14. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  Then: Return the largest value, or -1 for an empty list.


  Example: `transform([-9, 0, 20]) returns 2`.


  Return only the code.'
