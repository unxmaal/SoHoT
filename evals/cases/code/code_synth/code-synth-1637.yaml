  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Replace every value with its absolute value.

  6. Reverse the list.

  7. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Sort descending.

  10. Keep only the last 3 values, in their order (all of them if there are fewer).

  11. Sort ascending.

  12. Add -1 to every value.

  13. Keep only the first 4 values (all of them if there are fewer).

  14. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `transform([14, 20, 7]) returns []`.


  Return only the code.'
