prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  2. Replace every value with its square.

  3. Replace every value with the largest of itself and the up to 3 values before it.

  4. Sort descending.

  5. Collapse each run of equal adjacent values into one value.

  6. Replace every value with the largest of itself and the up to 1 values before it.

  7. Add 2 to every value.

  8. Remove every negative value.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Sort ascending.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Sort descending.

  15. Collapse each run of equal adjacent values into one value.

  16. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  17. Remove every negative value.

  18. Collapse each run of equal adjacent values into one value.

  19. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  20. Replace every value with the largest of itself and the up to 3 values before it.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([23, 3, 11, -6, 11]) returns 531`.


  Return only the code.'
