prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  2. Collapse each run of equal adjacent values into one value.

  3. Keep the values at indices 0, 2, 4, and so on.

  4. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Replace every value with its absolute value.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Replace every value with its absolute value.

  9. Keep only the first 5 values (all of them if there are fewer).

  10. Reverse the list.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Keep only the even values.

  14. Remove duplicates, keeping the first occurrence of each value.

  15. Drop the first 1 values (an empty list if there are fewer).

  16. Add 2 to every value.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `transform([19, 21, 23, 16, 3, -9, 6, 13, 17]) returns 0`.


  Return only the code.'
