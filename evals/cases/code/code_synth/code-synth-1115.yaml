prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Replace every value with the largest value seen so far.

  3. Remove every negative value.

  4. Drop the first 1 values (an empty list if there are fewer).

  5. Replace every value with its absolute value.

  6. Sort ascending.

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Keep the values at indices 0, 2, 4, and so on.

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  13. Replace every value with the largest value seen so far.

  14. Sort ascending.

  Then: Return the resulting list.


  Example: `apply_rules([5, 3, -10, 8]) returns [5]`.


  Return only the code.'
