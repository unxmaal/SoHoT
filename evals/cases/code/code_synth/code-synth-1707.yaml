prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Reverse the list.

  2. Collapse each run of equal adjacent values into one value.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Add 6 to every value.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Sort descending.

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Replace every value with its square.

  10. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Replace every value with its square.

  13. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  14. Keep only the even values.

  15. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  16. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  17. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  18. Replace every value with its square.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([25, 19, -7]) returns [68719476736]`.


  Return only the code.'
