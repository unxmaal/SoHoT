prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Reverse the list.

  2. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  3. Reverse the list.

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Replace every value with its absolute value.

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Replace every value with its absolute value.

  9. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  10. Replace every value with the largest of itself and the up to 2 values before it.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Sort descending.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([24, -2, 7, 8, 12]) returns 1`.


  Return only the code.'
