prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  2. Swap the case of every letter.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Replace every ''d'' with ''a'' (lowercase only).

  5. Collapse every run of the same character into one character.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Swap the case of every letter.

  8. Replace every ''s'' with ''e'' (lowercase only).

  9. Convert to lowercase.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Keep only the first 3 whitespace-separated words, joined by single spaces.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Replace every maximal run of digits with the number of digits in it.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''yCC0z22,'') returns ''1,3d3g1C''`.


  Return only the code.'
