prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by 3.

  2. Sort ascending.

  3. Collapse each run of equal adjacent values into one value.

  4. Multiply every value by -2.

  5. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Drop the first 2 values (an empty list if there are fewer).

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Keep only the first 4 values (all of them if there are fewer).

  10. Add 6 to every value.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Replace every value with its square.

  13. Collapse each run of equal adjacent values into one value.

  14. Replace every value with the largest of itself and the up to 3 values before it.

  15. Replace every value with its square.

  16. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return how many distinct values there are.


  Example: `apply_rules([17, 20, -6, 17]) returns 1`.


  Return only the code.'
