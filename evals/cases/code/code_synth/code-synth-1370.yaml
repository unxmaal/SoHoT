prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every ''s'' with ''l'' (lowercase only).

  2. Keep only the first occurrence of each character.

  3. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  4. Replace every ''e'' with ''l'' (lowercase only).

  5. Convert to uppercase.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  9. Keep only the first occurrence of each character.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Replace every ''o'' with ''e'' (lowercase only).

  12. Keep only the first occurrence of each character.

  13. Sort the characters in ascending code point order.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Replace every ''t'' with ''b'' (lowercase only).

  17. Convert to uppercase.

  18. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


  Example: `solve('' ba1bxA2.z0'') returns ''XB2.''`.


  Return only the code.'
