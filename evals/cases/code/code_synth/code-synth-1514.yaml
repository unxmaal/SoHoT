  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Keep only the first 3 whitespace-separated words, joined by single spaces.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Convert to lowercase.

  7. Keep only the first occurrence of each character.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Swap the case of every letter.

  10. Keep only the first occurrence of each character.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Keep only the first occurrence of each character.

  17. Convert to lowercase.

  18. Collapse every run of the same character into one character.

  19. Remove every vowel (a, e, i, o, u, either case).

  20. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return how many characters it has.


  Example: `process(''x2A1 Cc102'') returns 5`.


