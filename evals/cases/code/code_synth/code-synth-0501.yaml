  2. Replace every value with its square.

  3. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  4. Sort ascending.

  5. Multiply every value by 2.

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  8. Reverse the list.

  9. Keep only the last 3 values, in their order (all of them if there are fewer).

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Replace every value with its square.

  12. Sort ascending.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `reduce_data([-10, 9, 23, 24]) returns 1221025`.


  Return only the code.'
