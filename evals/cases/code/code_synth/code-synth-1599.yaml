prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its square.

  2. Sort ascending.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Sort ascending.

  5. Reverse the list.

  6. Keep only the values greater than 0.

  7. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  8. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Add -9 to every value.

  11. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  12. Replace every value with its absolute value.

  13. Keep only the first 2 values (all of them if there are fewer).

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([6, -9, -9, -11, 19, -5, 23, 13, 24]) returns 16`.


  Return only the code.'
