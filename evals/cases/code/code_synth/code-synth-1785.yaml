prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Reverse the list.

  3. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  4. Sort descending.

  5. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  6. Reverse the list.

  7. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  8. Multiply every value by -1.

  9. Replace every value with its absolute value.

  10. Sort descending.

  11. Replace every value with its square.

  12. Remove every negative value.

  13. Keep only the even values.

  14. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  15. Clamp every value into the range -4 to 4, both inclusive.

  16. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  17. Sort by absolute value, values with equal absolute value keeping their current relative order.

  18. Multiply every value by -1.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `apply_rules([-12, -12, -3, -2, -10, 17, -6, 14, -12]) returns -4`.


  Return only the code.'
