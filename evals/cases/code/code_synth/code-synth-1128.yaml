  3. Remove every digit.

  4. Convert to lowercase.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Replace every ''r'' with ''e'' (lowercase only).

  7. Replace every maximal run of digits with the number of digits in it.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Sort the characters in ascending code point order.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Swap the case of every letter.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Convert to lowercase.

  18. Sort the characters in ascending code point order.

  19. Replace every maximal run of digits with the number of digits in it.

  20. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the resulting string.


  Example: `process(''1bcB0C.zb,'') returns ''hf5.,''`.


  Return only the code.'
