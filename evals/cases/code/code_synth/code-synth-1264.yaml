prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  3. Keep only the first 4 whitespace-separated words, joined by single spaces.

  4. Convert to uppercase.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Collapse every run of the same character into one character.

  9. Swap the case of every letter.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Convert to uppercase.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Swap the case of every letter.

  16. Keep only the first occurrence of each character.

  17. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute(''a1a2a za.xxA.a z'') returns ''1b''`.


  Return only the code.'
