prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''drop'', ''sub'', ''mul'', ''dup'': drop removes
  the top value; sub pops b then a and pushes a - b, so the value pushed first is a; mul pops two values
  and pushes their product; dup copies the top value onto the stack. An operation that needs more values
  than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([1, ''dup'', ''drop'', -3, ''drop'', ''drop'', ''dup'', ''mul'', ''drop'']) returns
  []`.


  Return only the code.'
