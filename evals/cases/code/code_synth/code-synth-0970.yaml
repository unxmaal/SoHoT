prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Keep only the first occurrence of each character.

  3. Keep only the first 2 whitespace-separated words, joined by single spaces.

  4. Convert to uppercase.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Collapse every run of the same character into one character.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Sort the characters in ascending code point order.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''1czx101caba,'') returns '',011111111BCXZ''`.


  Return only the code.'
