prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Collapse every run of the same character into one character.

  6. Replace every ''l'' with ''e'' (lowercase only).

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Convert to lowercase.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Keep only the first occurrence of each character.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


  Example: `apply_rules(''00cAx  .'') returns ''ybd1 .''`.


  Return only the code.'
