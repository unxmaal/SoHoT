  6. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  7. Keep only the first 5 values (all of them if there are fewer).

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  9. Keep only the first 5 values (all of them if there are fewer).

  10. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  11. Add -3 to every value.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Keep only the last 4 values, in their order (all of them if there are fewer).

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([13, 25, -11, -4]) returns 3`.


  Return only the code.'
