prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  3. Replace every ''a'' with ''n'' (lowercase only).

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Replace every maximal run of digits with the number of digits in it.

  9. Keep only the first occurrence of each character.

  10. Convert to lowercase.

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Convert to uppercase.

  13. Sort the characters in ascending code point order.

  14. Remove every digit.

  15. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  17. Replace every ''o'' with ''l'' (lowercase only).

  18. Remove every vowel (a, e, i, o, u, either case).

  19. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  20. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process(''xzBxzzc2ab00a,'') returns ''..HFJ''`.


  Return only the code.'
