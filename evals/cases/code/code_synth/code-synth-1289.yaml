prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by 5.

  2. Reverse the list.

  3. Replace every value with its square.

  4. Multiply every value by 5.

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Remove every negative value.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Keep only the values greater than 0.

  11. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  12. Collapse each run of equal adjacent values into one value.

  13. Replace every value with its square.

  14. Keep only the first 6 values (all of them if there are fewer).

  15. Replace every value with its absolute value.

  16. Keep the values at indices 0, 2, 4, and so on.

  17. Keep only the first 5 values (all of them if there are fewer).

  18. Replace every value with the largest of itself and the up to 3 values before it.

  19. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  20. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([-4, -2, 15]) returns 443556`.


  Return only the code.'
