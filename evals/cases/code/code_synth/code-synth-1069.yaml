  5. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  6. Multiply every value by 3.

  7. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  8. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  9. Replace every value with the largest value seen so far.

  10. Keep only the first 3 values (all of them if there are fewer).

  11. Replace every value with its absolute value.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
