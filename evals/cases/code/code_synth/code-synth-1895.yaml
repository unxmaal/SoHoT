prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  2. Replace every value with the largest value seen so far.

  3. Keep only the first 6 values (all of them if there are fewer).

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Replace every value with its square.

  9. Replace every value with the largest of itself and the up to 2 values before it.

  10. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  13. Remove every negative value.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  15. Multiply every value by 2.

  16. Keep only the last 5 values, in their order (all of them if there are fewer).

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([18, -11, -9, 14, 21, -3]) returns 4`.


  Return only the code.'
