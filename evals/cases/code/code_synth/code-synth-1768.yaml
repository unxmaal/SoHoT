  15. Convert to lowercase.

  16. Replace every ''s'' with ''r'' (lowercase only).

  17. Swap the case of every letter.

  18. Sort the characters in ascending code point order.

  19. Remove every digit.

  20. Replace runs of whitespace with a single space and strip both ends.

