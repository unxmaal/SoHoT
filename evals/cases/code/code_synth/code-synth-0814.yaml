prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''sub'', ''mul'', ''over'', ''dup'': sub pops
  b then a and pushes a - b, so the value pushed first is a; mul pops two values and pushes their product;
  over pushes a copy of the second value from the top; dup copies the top value onto the stack. An operation
  that needs more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([3, ''dup'', 1, 0]) returns [3, 3, 1, 0]`.


  Return only the code.'
