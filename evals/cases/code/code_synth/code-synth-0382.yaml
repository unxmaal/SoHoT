prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  2. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  3. Replace every value with the largest value seen so far.

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Keep only the values greater than -3.

  7. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  8. Keep only the first 5 values (all of them if there are fewer).

  9. Replace every value with its square.

  10. Collapse each run of equal adjacent values into one value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([23, -8, -5, -10, 15, 2]) returns 34`.


  Return only the code.'
