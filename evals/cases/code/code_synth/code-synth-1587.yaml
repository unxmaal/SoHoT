prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  2. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Multiply every value by 2.

  6. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  7. Sort ascending.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  11. Replace every value with the largest of itself and the up to 1 values before it.

  12. Add 2 to every value.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Replace every value with the largest of itself and the up to 3 values before it.

  15. Sort ascending.

  16. Multiply every value by 3.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `reduce_data([3, 3, -5, 4, -1, -5, -9, -5]) returns 6`.


  Return only the code.'
