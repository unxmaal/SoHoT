prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every digit.

  2. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Keep only the first 4 whitespace-separated words, joined by single spaces.

  5. Remove every digit.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Convert to lowercase.

  8. Convert to uppercase.

  Then: Return the resulting string.


  Example: `apply_rules('',xb.y.C.xBz'') returns '',XB.Y.''`.


