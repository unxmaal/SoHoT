  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Collapse every run of the same character into one character.

  13. Replace every ''l'' with ''s'' (lowercase only).

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
