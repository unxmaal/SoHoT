prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the values greater than 0.

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Add -3 to every value.

  5. Keep only the last 4 values, in their order (all of them if there are fewer).

  6. Replace every value with its square.

  7. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Replace every value with its absolute value.

  10. Keep only the last 4 values, in their order (all of them if there are fewer).

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Sort ascending.

  13. Reverse the list.

  14. Collapse each run of equal adjacent values into one value.

  15. Replace every value with its absolute value.

  16. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([20, 4, 23, -11]) returns [133, 147]`.


  Return only the code.'
