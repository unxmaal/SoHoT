prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its square.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  4. Keep only the values greater than 5.

  5. Keep only the first 4 values (all of them if there are fewer).

  6. Sort descending.

  7. Remove every negative value.

  8. Collapse each run of equal adjacent values into one value.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace every value with its absolute value.

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Replace every value with its absolute value.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  Then: Return the resulting list.


  Example: `compute([0, -7, 14]) returns [61, 12]`.


  Return only the code.'
