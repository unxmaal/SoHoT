prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Convert to uppercase.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Remove every digit.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Remove every digit.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Convert to lowercase.

  9. Remove every digit.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Replace every maximal run of digits with the number of digits in it.

  13. Keep only the first occurrence of each character.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the resulting string.


  Example: `reduce_data(''cb2x0.z2y'') returns ''..h.gkl1''`.


  Return only the code.'
