  1. Sort descending.

  2. Keep only the first 6 values (all of them if there are fewer).

  3. Add 9 to every value.

  4. Replace every value with its square.

  5. Replace every value with its absolute value.

  6. Replace every value with the largest of itself and the up to 1 values before it.

  7. Multiply every value by -1.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([11, 7, 6, 20, 6]) returns 616`.


  Return only the code.'
