prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Keep only the first 4 values (all of them if there are fewer).

  4. Multiply every value by 3.

  5. Keep only the even values.

  6. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  7. Keep only the last 3 values, in their order (all of them if there are fewer).

  8. Collapse each run of equal adjacent values into one value.

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Sort descending.

  11. Keep only the even values.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Collapse each run of equal adjacent values into one value.

  14. Replace every value with the largest of itself and the up to 2 values before it.

  15. Clamp every value into the range 1 to 10, both inclusive.

  16. Replace every value with its absolute value.

  17. Sort ascending.

  18. Remove duplicates, keeping the first occurrence of each value.

  19. Reverse the list.

  20. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([6, 20, 19, 2, 11, 12, 3]) returns 6`.


  Return only the code.'
