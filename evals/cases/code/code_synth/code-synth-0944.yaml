prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''add'', ''over'', ''dup'', ''swap'': add pops
  two values and pushes their sum; over pushes a copy of the second value from the top; dup copies the
  top value onto the stack; swap exchanges the top two values. An operation that needs more values than
  the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''swap'', ''over'', 9, 3, ''add'', 4, ''over'', 2, 7]) returns [12, 4, 12, 2,
  7]`.


  Return only the code.'
assert:
  checks:
  - run_program(['over', 'add', 'dup', 'add', 'dup', 'over', 'add', -1]) == [-1]
  - run_program(['swap', 'add', 'dup', 'swap', 'swap', 'swap', 7]) == [7]
  - run_program(['swap', -1, 'over', 'over', 'add', 'add', 'dup']) == [-1, -1]
  - run_program(['dup', 'dup', 'dup', 'over', 'over', 'swap', 'dup', 'dup']) == []
  - run_program(['add', -3, 'dup', -1, -3, 'dup', 1]) == [-3, -3, -1, -3, -3, 1]
  - run_program(['add', 'dup', 'swap', 5, 'add', 'swap']) == [5]
