prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Keep only the values greater than 3.

  3. Replace every value with the largest value seen so far.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  6. Sort ascending.

  7. Keep only the last 5 values, in their order (all of them if there are fewer).

  8. Replace every value with its square.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Keep the values at indices 0, 2, 4, and so on.

  11. Keep only the first 5 values (all of them if there are fewer).

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Replace every value with its absolute value.

  14. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  15. Reverse the list.

  16. Replace every value with the largest of itself and the up to 3 values before it.

  17. Replace every value with its square.

  18. Remove every negative value.

  19. Keep the values at indices 0, 2, 4, and so on.

  20. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the largest value, or -1 for an empty list.


  Example: `transform([22, 3, 3, 21, 15, 2]) returns 625`.


  Return only the code.'
