modality: code
prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Convert to uppercase.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Remove every digit.

  8. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  9. Sort the characters in ascending code point order.

  10. Keep only the first occurrence of each character.

  Then: Return how many characters it has.


  Example: `run_pipeline(''20z,z Bza1cy2'') returns 5`.


  Return only the code.'
assert:
  checks:
  - run_pipeline('zz yy xx') == 4
  - run_pipeline('The 3 little pigs 33') == 5
  - run_pipeline('abc123xyz') == 5
  - run_pipeline('') == 1
  - run_pipeline('  jumps   over the  lazy dog ') == 6
  - run_pipeline('A man a plan a canal Panama') == 4
