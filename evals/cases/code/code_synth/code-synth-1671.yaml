prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  3. Multiply every value by 3.

  4. Clamp every value into the range 1 to 6, both inclusive.

  5. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  6. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  7. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  8. Keep only the last 5 values, in their order (all of them if there are fewer).

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Reverse the list.

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Replace every value with the largest of itself and the up to 3 values before it.

  13. Sort descending.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Replace every value with its square.

  16. Keep the values at indices 0, 3, 6, and so on.

  17. Replace every value with the largest of itself and the up to 2 values before it.

  18. Replace every value with its square.

  Then: Return the sum of the values (0 for an empty list).


  Example: `process([25, 16, -8, 9, 23]) returns 337`.


  Return only the code.'
