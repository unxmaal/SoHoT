prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Add -5 to every value.

  2. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  3. Replace every value with its square.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Clamp every value into the range -1 to 4, both inclusive.

  6. Collapse each run of equal adjacent values into one value.

  7. Keep only the last 3 values, in their order (all of them if there are fewer).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Sort descending.

  10. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Sort descending.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Sort descending.

  15. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  16. Collapse each run of equal adjacent values into one value.

  17. Reverse the list.

  18. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  19. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  20. Reverse the list.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([-6, 3, 12, 9, 16]) returns 3`.


  Return only the code.'
