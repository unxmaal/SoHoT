prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 1 values before it.

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Drop the first 3 values (an empty list if there are fewer).

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Replace every value with the largest value seen so far.

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Keep only the first 6 values (all of them if there are fewer).

  9. Replace every value with its absolute value.

  10. Multiply every value by 5.

  11. Replace every value with the largest value seen so far.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  15. Sort by absolute value, values with equal absolute value keeping their current relative order.

  16. Sort descending.

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([-9, -5, 18]) returns -1`.


  Return only the code.'
