prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Convert to uppercase.

  3. Keep only the first occurrence of each character.

  4. Sort the characters in ascending code point order.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Convert to lowercase.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return how many characters it has.


  Example: `apply_rules(''bccy20B 2b'') returns 5`.


  Return only the code.'
