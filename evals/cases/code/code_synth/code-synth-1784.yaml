  5. Remove every digit.

  6. Collapse every run of the same character into one character.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Convert to lowercase.

  13. Keep only the first 3 whitespace-separated words, joined by single spaces.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Remove every digit.

  16. Replace every ''i'' with ''t'' (lowercase only).

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Replace every ''t'' with ''l'' (lowercase only).

  19. Remove every digit.

  20. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return how many characters it has.


  Example: `solve(''C.yc1yz02bby'') returns 5`.


