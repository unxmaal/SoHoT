  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Collapse every run of the same character into one character.

  6. Keep only the first occurrence of each character.

  Then: Return the resulting string.


  Example: `reduce_data(''2a y,Bc.2zycAa'') returns ''1y,Bc. 2a''`.


  Return only the code.'
