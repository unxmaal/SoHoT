prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Convert to uppercase.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Replace every ''i'' with ''r'' (lowercase only).

  10. Swap the case of every letter.

  11. Keep only the first occurrence of each character.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Replace every ''a'' with ''i'' (lowercase only).

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''C .z,  0,yb0'') returns ''111.111z''`.


  Return only the code.'
