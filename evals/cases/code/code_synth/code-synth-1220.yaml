prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Swap the case of every letter.

  3. Keep only the first 4 whitespace-separated words, joined by single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Convert to uppercase.

  6. Collapse every run of the same character into one character.

  7. Keep only the first occurrence of each character.

  8. Sort the characters in ascending code point order.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  11. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Remove every digit.

  14. Swap the case of every letter.

  15. Keep only the first 2 whitespace-separated words, joined by single spaces.

  16. Replace every ''s'' with ''d'' (lowercase only).

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


  Example: `solve(''A1B,02Cyx001,C'') returns '',''`.


  Return only the code.'
