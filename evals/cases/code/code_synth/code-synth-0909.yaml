prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''sub'', ''mul'', ''over'', ''drop'': sub pops
  b then a and pushes a - b, so the value pushed first is a; mul pops two values and pushes their product;
  over pushes a copy of the second value from the top; drop removes the top value. An operation that needs
  more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''drop'', ''drop'', ''drop'', 5, ''sub'', 6]) returns [5, 6]`.


  Return only the code.'
