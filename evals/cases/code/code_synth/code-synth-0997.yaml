  3. Keep only the first occurrence of each character.

  4. Swap the case of every letter.

  5. Replace every ''l'' with ''i'' (lowercase only).

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Replace every maximal run of digits with the number of digits in it.

  10. Swap the case of every letter.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
