prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Convert to lowercase.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Convert to lowercase.

  6. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Collapse every run of the same character into one character.

  9. Keep only the first occurrence of each character.

  10. Convert to uppercase.

  11. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Convert to lowercase.

  13. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  14. Swap the case of every letter.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Collapse every run of the same character into one character.

  18. Remove every digit.

  19. Keep only the first 4 whitespace-separated words, joined by single spaces.

  20. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  Then: Return the resulting string.


  Example: `process(''y,00aycz'') returns ''p,......''`.


  Return only the code.'
