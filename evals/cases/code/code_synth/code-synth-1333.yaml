prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  3. Replace every value with its square.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Reverse the list.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace every value with its absolute value.

  9. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  10. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  11. Add -5 to every value.

  12. Replace every value with the largest value seen so far.

  13. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  14. Replace every value with its square.

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([18, 7, 18]) returns 25`.


  Return only the code.'
