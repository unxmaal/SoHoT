prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Keep only the first 2 whitespace-separated words, joined by single spaces.

  4. Remove every digit.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Collapse every run of the same character into one character.

  7. Remove every digit.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Keep only the first 4 whitespace-separated words, joined by single spaces.

  10. Convert to lowercase.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Convert to uppercase.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Keep only the first occurrence of each character.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Replace every maximal run of digits with the number of digits in it.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return how many characters it has.


  Example: `run_pipeline(''xz.B1Cz z1xb'') returns 24`.


  Return only the code.'
