  11. Keep only the values greater than 8.

  12. Reverse the list.

  13. Clamp every value into the range -4 to 0, both inclusive.

  14. Replace every value with its absolute value.

  15. Keep only the even values.

  16. Sort descending.

  Then: Return the resulting list.


