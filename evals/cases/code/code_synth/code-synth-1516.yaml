  4. Collapse every run of the same character into one character.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Convert to uppercase.

  7. Sort the characters in ascending code point order.

  8. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Swap the case of every letter.

  10. Keep only the first occurrence of each character.

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Keep only the first 3 whitespace-separated words, joined by single spaces.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Replace every ''n'' with ''s'' (lowercase only).

  15. Sort the characters in ascending code point order.

  16. Keep only the first occurrence of each character.

  17. Sort the characters in ascending code point order.

  18. Replace runs of whitespace with a single space and strip both ends.

  19. Reverse the order of the whitespace-separated words and join them with single spaces.

  20. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
