prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Keep only the first 6 values (all of them if there are fewer).

  4. Reverse the list.

  5. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  6. Sort ascending.

  7. Sort descending.

  8. Keep only the last 3 values, in their order (all of them if there are fewer).

  9. Reverse the list.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Sort ascending.

  12. Replace every value with the largest of itself and the up to 1 values before it.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `reduce_data([14, 6, 3, 11, -1, 25, 1]) returns 3`.


  Return only the code.'
