  2. Keep only the first occurrence of each character.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Replace every ''t'' with ''a'' (lowercase only).

  9. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  10. Swap the case of every letter.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Swap the case of every letter.

  14. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
