prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to lowercase.

  2. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Convert to lowercase.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Replace every maximal run of digits with the number of digits in it.

  6. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Swap the case of every letter.

  8. Collapse every run of the same character into one character.

  9. Convert to lowercase.

  10. Keep only the first occurrence of each character.

  Then: Return how many characters it has.


  Example: `reduce_data(''10z2C1yz'') returns 6`.


  Return only the code.'
