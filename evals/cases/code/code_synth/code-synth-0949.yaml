prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''over'', ''sub'', ''add'': dup copies
  the top value onto the stack; over pushes a copy of the second value from the top; sub pops b then a
  and pushes a - b, so the value pushed first is a; add pops two values and pushes their sum. An operation
  that needs more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([1, ''dup'']) returns [1, 1]`.


  Return only the code.'
assert:
  checks:
  - run_program(['sub', 'over', 'sub', 'add', 8, 'over', 'dup']) == [8, 8]
  - run_program([5, 'over', -1, -2, 'add', 'add', 0, 'sub']) == [2]
  - run_program(['sub', 'dup', 'dup', 'over']) == []
  - run_program([1, 'add', 'dup', 3, -1, 2, 'add', 9]) == [1, 1, 3, 1, 9]
  - run_program([2, 'dup', 3, 'over', 'dup', 'add']) == [2, 2, 3, 4]
  - run_program([4, -3, 'add', 'add', 8, 'over', -3]) == [1, 8, 1, -3]
