prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Multiply every value by 3.

  2. Replace every value with its absolute value.

  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Reverse the list.

  6. Collapse each run of equal adjacent values into one value.

  7. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  8. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  9. Replace every value with the largest value seen so far.

  10. Clamp every value into the range -2 to 4, both inclusive.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Sort ascending.

  13. Replace every value with its square.

  14. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  15. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  16. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  17. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  18. Keep only the first 3 values (all of them if there are fewer).

  Then: Return how many distinct values there are.


  Example: `process([20, 14, -8, 24, -4, 13]) returns 2`.


  Return only the code.'
