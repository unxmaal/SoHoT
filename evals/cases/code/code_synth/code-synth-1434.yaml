prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Keep only the first 2 whitespace-separated words, joined by single spaces.

  3. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  4. Convert to uppercase.

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Replace every maximal run of digits with the number of digits in it.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Convert to uppercase.

  10. Remove every digit.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Collapse every run of the same character into one character.

  13. Remove every digit.

  14. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


  Example: `solve(''0BCAz.yca,aa'') returns ''ZCB''`.


  Return only the code.'
