prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its square.

  2. Reverse the list.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Reverse the list.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Sort ascending.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  9. Collapse each run of equal adjacent values into one value.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Sort descending.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Drop the first 2 values (an empty list if there are fewer).

  14. Keep only the last 3 values, in their order (all of them if there are fewer).

  Then: Return the resulting list.


  Example: `reduce_data([25, 5, 24, -5, 4, 2, -2, -6]) returns [25, 16, 4]`.


  Return only the code.'
