  3. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Add 2 to every value.

  6. Multiply every value by -2.

  7. Clamp every value into the range -5 to -1, both inclusive.

  8. Replace every value with its absolute value.

  9. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  10. Add 2 to every value.

  11. Remove every negative value.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  14. Collapse each run of equal adjacent values into one value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([-2, 6, 12, 19, 10, 13, 25]) returns 7`.


  Return only the code.'
