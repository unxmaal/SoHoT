prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Keep only the first occurrence of each character.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Replace every ''r'' with ''a'' (lowercase only).

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Convert to uppercase.

  Then: Return how many characters it has.


  Example: `apply_rules(''ByCcx.220,B'') returns 9`.


  Return only the code.'
