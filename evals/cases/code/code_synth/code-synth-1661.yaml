  17. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  18. Keep only the first 2 values (all of them if there are fewer).

  19. Sort ascending.

  20. Replace every value with its absolute value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


