  7. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Keep only the first 3 values (all of them if there are fewer).

  10. Sort ascending.

  11. Remove every negative value.

  12. Replace every value with its absolute value.

  13. Keep the values at indices 0, 2, 4, and so on.

  14. Keep only the first 3 values (all of them if there are fewer).

  15. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

