  items are ints (pushed onto the stack) or the strings ''mul'', ''drop'', ''swap'', ''dup'': mul pops
  two values and pushes their product; drop removes the top value; swap exchanges the top two values;
  dup copies the top value onto the stack. An operation that needs more values than the stack has does
  nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''mul'', -1, 0]) returns [-1, 0]`.


  Return only the code.'
