prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Replace every ''t'' with ''b'' (lowercase only).

  5. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  6. Keep only the first 4 whitespace-separated words, joined by single spaces.

  7. Convert to uppercase.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `compute(''C0Ac2cz1'') returns ''111C1110111C11''`.


  Return only the code.'
