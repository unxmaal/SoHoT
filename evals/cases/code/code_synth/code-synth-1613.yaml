prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Replace every value with the largest of itself and the up to 1 values before it.

  3. Collapse each run of equal adjacent values into one value.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  7. Replace every value with its absolute value.

  8. Add 4 to every value.

  9. Sort ascending.

  10. Replace every value with its absolute value.

  11. Keep only the values greater than 1.

  12. Replace every value with its square.

  13. Clamp every value into the range -5 to 3, both inclusive.

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  15. Remove every negative value.

  16. Keep only the last 4 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([-1, 25, -4, -10, -5, -4]) returns [6]`.


  Return only the code.'
