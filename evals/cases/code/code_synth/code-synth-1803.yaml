prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the first 5 values (all of them if there are fewer).

  2. Replace every value with the largest value seen so far.

  3. Keep the values at indices 0, 2, 4, and so on.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  6. Keep only the last 5 values, in their order (all of them if there are fewer).

  7. Keep only the values greater than -2.

  8. Keep the values at indices 0, 3, 6, and so on.

  9. Replace every value with its absolute value.

  10. Remove every negative value.

  11. Replace every value with the largest of itself and the up to 3 values before it.

  12. Keep only the last 3 values, in their order (all of them if there are fewer).

  13. Replace every value with the largest of itself and the up to 1 values before it.

  14. Sort ascending.

  15. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  16. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the resulting list.


  Example: `reduce_data([19, 1, 2, 13]) returns [19]`.


  Return only the code.'
