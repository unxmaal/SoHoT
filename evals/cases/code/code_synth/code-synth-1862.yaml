prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Keep only the first occurrence of each character.

  3. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Convert to uppercase.

  5. Remove every digit.

  6. Keep only the first 3 whitespace-separated words, joined by single spaces.

  7. Convert to uppercase.

  8. Collapse every run of the same character into one character.

  9. Sort the characters in ascending code point order.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Collapse every run of the same character into one character.

  13. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''xcyAAC.y,Cb'') returns ''WVUSR.,''`.


  Return only the code.'
