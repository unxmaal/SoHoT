prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  6. Multiply every value by 3.

  7. Collapse each run of equal adjacent values into one value.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  9. Add -3 to every value.

  10. Replace every value with the largest of itself and the up to 1 values before it.

  11. Collapse each run of equal adjacent values into one value.

  12. Remove every negative value.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Collapse each run of equal adjacent values into one value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([13, -12, -7, 4]) returns 15`.


  Return only the code.'
