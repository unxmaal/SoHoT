  5. Sort the characters in ascending code point order.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Convert to lowercase.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Replace every ''a'' with ''e'' (lowercase only).

  13. Keep only the first occurrence of each character.

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  17. Convert to lowercase.

  18. Remove every digit.

  Then: Return the resulting string.


