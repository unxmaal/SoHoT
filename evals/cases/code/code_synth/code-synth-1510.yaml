prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Keep only the first occurrence of each character.

  3. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Remove every digit.

  6. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  7. Swap the case of every letter.

  8. Convert to lowercase.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Replace every ''o'' with ''t'' (lowercase only).

  12. Remove every digit.

  13. Keep only the first occurrence of each character.

  14. Replace every ''r'' with ''n'' (lowercase only).

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Convert to uppercase.

  17. Keep only the first occurrence of each character.

  18. Remove every vowel (a, e, i, o, u, either case).

  19. Reverse the order of the whitespace-separated words and join them with single spaces.

  20. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the resulting string.


  Example: `transform(''B1C10Cy1yy0B'') returns ''YCB.''`.


  Return only the code.'
