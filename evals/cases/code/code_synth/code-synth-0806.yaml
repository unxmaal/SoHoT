prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every digit.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Sort the characters in ascending code point order.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''.Cay0.xbBx.0bcxC'') returns ''...11111111111111BCCabbcxxxy''`.


  Return only the code.'
