  the words with single spaces.

  3. Keep only the first 3 whitespace-separated words, joined by single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Swap the case of every letter.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Collapse every run of the same character into one character.

  9. Keep only the first occurrence of each character.

  10. Keep only the first 2 whitespace-separated words, joined by single spaces.

  11. Sort the characters in ascending code point order.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Convert to uppercase.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Swap the case of every letter.

  16. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''2x,x A21'') returns '',12x...''`.


