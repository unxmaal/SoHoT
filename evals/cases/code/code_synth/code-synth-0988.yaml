prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''over'', ''add'', ''drop'': dup copies
  the top value onto the stack; over pushes a copy of the second value from the top; add pops two values
  and pushes their sum; drop removes the top value. An operation that needs more values than the stack
  has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([-1, 2, ''add'', ''drop'']) returns []`.


  Return only the code.'
