prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''mul'', ''drop'', ''add'', ''swap'': mul pops
  two values and pushes their product; drop removes the top value; add pops two values and pushes their
  sum; swap exchanges the top two values. An operation that needs more values than the stack has does
  nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''swap'', ''mul'', ''mul'', ''add'', -1, ''mul'', ''drop'']) returns []`.


  Return only the code.'
