prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every digit.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Replace every ''o'' with ''d'' (lowercase only).

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Swap the case of every letter.

  7. Replace every ''a'' with ''l'' (lowercase only).

  8. Keep only the first occurrence of each character.

  9. Collapse every run of the same character into one character.

  10. Sort the characters in ascending code point order.

  11. Keep only the first occurrence of each character.

  12. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Replace every ''r'' with ''l'' (lowercase only).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `reduce_data(''bbx.cC a'') returns ''.''`.


  Return only the code.'
