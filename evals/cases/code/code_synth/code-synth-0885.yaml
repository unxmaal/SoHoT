prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Replace every maximal run of digits with the number of digits in it.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Replace every ''n'' with ''i'' (lowercase only).

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Replace every maximal run of digits with the number of digits in it.

  Then: Return how many characters it has.


  Example: `apply_rules(''C 01AA22A. 2'') returns 9`.


  Return only the code.'
