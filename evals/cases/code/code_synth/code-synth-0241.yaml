  order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Reverse the list.

  3. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  4. Replace every value with the largest of itself and the up to 1 values before it.

  5. Drop the first 2 values (an empty list if there are fewer).

  6. Keep the values at indices 0, 3, 6, and so on.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Reverse the list.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `solve([14, 10, -7, 21, -7, -12]) returns [8]`.


  Return only the code.'
