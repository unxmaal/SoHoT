prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Replace every value with its square.

  3. Collapse each run of equal adjacent values into one value.

  4. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  5. Keep only the last 4 values, in their order (all of them if there are fewer).

  6. Keep only the first 4 values (all of them if there are fewer).

  7. Multiply every value by 5.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Drop the first 2 values (an empty list if there are fewer).

  10. Keep the values at indices 0, 2, 4, and so on.

  11. Multiply every value by 2.

  12. Replace every value with its square.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Replace every value with the largest value seen so far.

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([20, 13, 17]) returns 0`.


  Return only the code.'
