  1. Sort the characters in ascending code point order.

  2. Replace every ''b'' with ''s'' (lowercase only).

  3. Convert to uppercase.

  4. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Convert to uppercase.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Replace every ''b'' with ''r'' (lowercase only).

  8. Replace every maximal run of digits with the number of digits in it.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
