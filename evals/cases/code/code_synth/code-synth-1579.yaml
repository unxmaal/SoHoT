prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every negative value.

  2. Multiply every value by 5.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  5. Keep only the first 4 values (all of them if there are fewer).

  6. Keep only the last 5 values, in their order (all of them if there are fewer).

  7. Collapse each run of equal adjacent values into one value.

  8. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  9. Reverse the list.

  10. Replace every value with the largest value seen so far.

  11. Add 4 to every value.

  12. Reverse the list.

  13. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  14. Replace every value with its absolute value.

  15. Sort ascending.

  16. Keep only the values greater than 8.

  17. Remove every negative value.

  18. Keep only the last 3 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([12, 23, 17, -4, 16, 25, -11]) returns [59, 59]`.


  Return only the code.'
