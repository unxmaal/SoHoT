prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Multiply every value by -2.

  3. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  4. Multiply every value by 3.

  5. Remove every negative value.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Remove every negative value.

  8. Sort descending.

  9. Replace every value with the largest value seen so far.

  10. Reverse the list.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  13. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  14. Clamp every value into the range 0 to 5, both inclusive.

  15. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  16. Keep only the last 3 values, in their order (all of them if there are fewer).

  17. Remove duplicates, keeping the first occurrence of each value.

  18. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `apply_rules([4, -4, 12, 24]) returns None`.


  Return only the code.'
