prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Replace every value with its absolute value.

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Remove every negative value.

  9. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Clamp every value into the range 1 to 10, both inclusive.

  12. Collapse each run of equal adjacent values into one value.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  15. Keep the values at indices 0, 3, 6, and so on.

  16. Replace every value with its absolute value.

  17. Reverse the list.

  18. Replace every value with the largest of itself and the up to 1 values before it.

  Then: Return the sum of the values (0 for an empty list).


  Example: `solve([10, 19, 14]) returns 5`.


  Return only the code.'
