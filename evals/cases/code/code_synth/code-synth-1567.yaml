  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  12. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  13. Sort descending.

  14. Replace every value with its absolute value.

  Then: Return the resulting list.


  Example: `process([3, 9, 5]) returns [4]`.


  Return only the code.'
