prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its square.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Collapse each run of equal adjacent values into one value.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  6. Replace every value with its absolute value.

  7. Remove every negative value.

  8. Sort ascending.

  9. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  10. Replace every value with the largest value seen so far.

  11. Sort descending.

  12. Clamp every value into the range -2 to 7, both inclusive.

  13. Replace every value with the largest of itself and the up to 3 values before it.

  14. Collapse each run of equal adjacent values into one value.

  15. Keep the values at indices 0, 2, 4, and so on.

  16. Replace every value with its absolute value.

  17. Add 9 to every value.

  18. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the resulting list.


  Example: `process([-4, -9, 14, -11, 18, 16, 3, -8, -6]) returns [11]`.


  Return only the code.'
