prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the order of the whitespace-separated words and join them with single spaces.

  2. Collapse every run of the same character into one character.

  3. Convert to lowercase.

  4. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Sort the characters in ascending code point order.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Replace every ''r'' with ''c'' (lowercase only).

  13. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Convert to uppercase.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Remove every digit.

  Then: Return how many characters it has.


  Example: `apply_rules(''cBzx. bc.bbb ,y '') returns 7`.


  Return only the code.'
