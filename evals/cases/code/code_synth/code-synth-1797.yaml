prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  2. Multiply every value by 3.

  3. Replace every value with the largest of itself and the up to 3 values before it.

  4. Replace every value with its square.

  5. Collapse each run of equal adjacent values into one value.

  6. Reverse the list.

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Replace every value with its absolute value.

  9. Reverse the list.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Replace every value with the largest value seen so far.

  12. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  13. Keep only the last 5 values, in their order (all of them if there are fewer).

  14. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  15. Replace every value with its absolute value.

  16. Keep only the values greater than 0.

  17. Sort by absolute value, values with equal absolute value keeping their current relative order.

  18. Replace every value with the largest of itself and the up to 1 values before it.

  Then: Return the sum of the values (0 for an empty list).


  Example: `solve([-9, 4, 9, 4]) returns 4`.


  Return only the code.'
