prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  2. Sort ascending.

  3. Keep only the first 6 values (all of them if there are fewer).

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Multiply every value by -1.

  7. Remove every negative value.

  8. Multiply every value by 5.

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Keep the values at indices 0, 2, 4, and so on.

  12. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  16. Multiply every value by 2.

  17. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  18. Collapse each run of equal adjacent values into one value.

  19. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  20. Clamp every value into the range -2 to 1, both inclusive.

  Then: Return the resulting list.


  Example: `run_pipeline([1, 15, -5, -12, -4, -4, 12, 12]) returns [-2]`.


  Return only the code.'
