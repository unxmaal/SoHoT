prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Keep only the even values.

  3. Remove every negative value.

  4. Keep only the first 4 values (all of them if there are fewer).

  5. Add -5 to every value.

  6. Replace every value with the largest of itself and the up to 1 values before it.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Keep only the first 4 values (all of them if there are fewer).

  9. Replace every value with its square.

  10. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([5, 17, 22, 14, 2]) returns [289, 1156]`.


  Return only the code.'
