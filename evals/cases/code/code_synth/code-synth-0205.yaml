  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Remove every digit.

  8. Sort the characters in ascending code point order.

  9. Convert to uppercase.

  10. Replace every ''n'' with ''r'' (lowercase only).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
