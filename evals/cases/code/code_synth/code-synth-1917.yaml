prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the values greater than 5.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace every value with its absolute value.

  4. Clamp every value into the range -3 to 1, both inclusive.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Replace every value with its absolute value.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Keep only the last 3 values, in their order (all of them if there are fewer).

  9. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  10. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Remove every negative value.

  13. Keep the values at indices 0, 2, 4, and so on.

  14. Add 2 to every value.

  15. Multiply every value by 2.

  16. Collapse each run of equal adjacent values into one value.

  17. Keep only the values greater than 2.

  18. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the largest value, or -1 for an empty list.


  Example: `transform([11, 5, -8, 12]) returns 4`.


  Return only the code.'
