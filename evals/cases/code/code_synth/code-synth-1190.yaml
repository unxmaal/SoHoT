prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Keep only the first 4 whitespace-separated words, joined by single spaces.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Swap the case of every letter.

  6. Replace every ''o'' with ''t'' (lowercase only).

  7. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Convert to lowercase.

  10. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  11. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Remove every digit.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Swap the case of every letter.

  18. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''z.czAx,1a2.C10'') returns ''P,MPR.''`.


  Return only the code.'
