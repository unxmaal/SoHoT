  1. Remove every negative value.

  2. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  3. Add -3 to every value.

  4. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  5. Keep only the even values.

  6. Collapse each run of equal adjacent values into one value.

  7. Keep only the last 4 values, in their order (all of them if there are fewer).

  8. Reverse the list.

  9. Collapse each run of equal adjacent values into one value.

  10. Replace every value with the largest of itself and the up to 1 values before it.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  13. Replace every value with its square.

  14. Add 2 to every value.

  15. Remove every negative value.

  16. Keep only the even values.

  17. Sort descending.

  18. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  Then: Return the resulting list.


  Example: `solve([4, 11, -5, -8, 6, 14, 23]) returns [2, 2, 6]`.


  Return only the code.'
