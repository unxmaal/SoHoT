prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  2. Replace every value with the largest of itself and the up to 3 values before it.

  3. Add -3 to every value.

  4. Collapse each run of equal adjacent values into one value.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Add -5 to every value.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([20, 15, 6, 13, 12, 3]) returns 3`.


  Return only the code.'
