prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  4. Collapse every run of the same character into one character.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Convert to uppercase.

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Convert to lowercase.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Keep only the first occurrence of each character.

  11. Collapse every run of the same character into one character.

  12. Convert to uppercase.

  13. Keep only the first occurrence of each character.

  14. Convert to uppercase.

  Then: Return the resulting string.


  Example: `apply_rules(''yx.a120Cc.'') returns ''1YX.''`.


  Return only the code.'
