prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Collapse each run of equal adjacent values into one value.

  3. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  4. Remove every negative value.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Replace every value with the largest of itself and the up to 2 values before it.

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Keep only the last 2 values, in their order (all of them if there are fewer).

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Replace every value with its absolute value.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  14. Clamp every value into the range 0 to 9, both inclusive.

  15. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  16. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `apply_rules([18, -7, -4, -3, 25, 19, 16]) returns 1`.


  Return only the code.'
