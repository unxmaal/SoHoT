prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Convert to lowercase.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Convert to uppercase.

  5. Remove every digit.

  6. Keep only the first 2 whitespace-separated words, joined by single spaces.

  7. Swap the case of every letter.

  8. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return the number of words (whitespace-separated).


  Example: `apply_rules(''Ab..caczx11 2xz'') returns 1`.


  Return only the code.'
