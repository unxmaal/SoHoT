prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Collapse every run of the same character into one character.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Collapse every run of the same character into one character.

  5. Swap the case of every letter.

  6. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  7. Remove every digit.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Convert to uppercase.

  13. Keep only the first occurrence of each character.

  14. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Keep only the first 4 whitespace-separated words, joined by single spaces.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  18. Keep only the first occurrence of each character.

  Then: Return the resulting string.


  Example: `reduce_data(''y,C00 0c'') returns ''1N,J.''`.


  Return only the code.'
