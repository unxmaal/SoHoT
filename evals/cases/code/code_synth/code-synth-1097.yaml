prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Remove every negative value.

  4. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  5. Keep only the values greater than -2.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  10. Keep only the last 5 values, in their order (all of them if there are fewer).

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Replace every value with the largest value seen so far.

  13. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  14. Replace every value with its absolute value.

  15. Keep only the last 5 values, in their order (all of them if there are fewer).

  16. Keep only the first 3 values (all of them if there are fewer).

  17. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  18. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return how many distinct values there are.


  Example: `run_pipeline([3, 25, 0, 15]) returns 2`.


  Return only the code.'
