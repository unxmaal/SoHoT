prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Keep only the first 2 whitespace-separated words, joined by single spaces.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Convert to uppercase.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return how many characters it has.


  Example: `reduce_data(''CyAbAy201A'') returns 20`.


  Return only the code.'
