  3. Swap the case of every letter.

  4. Keep only the first 2 whitespace-separated words, joined by single spaces.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Convert to uppercase.

  8. Replace runs of whitespace with a single space and strip both ends.

  Then: Return how many characters it has.


  Example: `run_pipeline(''c22Bx0xAz'') returns 8`.


  Return only the code.'
