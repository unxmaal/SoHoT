prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''mul'', ''over'', ''dup'', ''add'': mul pops
  two values and pushes their product; over pushes a copy of the second value from the top; dup copies
  the top value onto the stack; add pops two values and pushes their sum. An operation that needs more
  values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''add'', ''add'', 2, ''dup'', ''add'', -1, ''dup'', -1, ''mul'']) returns [4,
  -1, 1]`.


  Return only the code.'
