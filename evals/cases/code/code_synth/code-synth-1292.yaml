prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every ''e'' with ''r'' (lowercase only).

  2. Convert to lowercase.

  3. Keep only the first 3 whitespace-separated words, joined by single spaces.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Keep only the first occurrence of each character.

  6. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Convert to uppercase.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Convert to lowercase.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Sort the characters in ascending code point order.

  14. Keep only the first occurrence of each character.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Keep only the first 4 whitespace-separated words, joined by single spaces.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Remove every vowel (a, e, i, o, u, either case).

  Then: Return how many characters it has.


  Example: `solve(''CACzzzzAaCaC1.'') returns 10`.


  Return only the code.'
