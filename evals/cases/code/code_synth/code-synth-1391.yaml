  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Replace every value with its square.

  8. Collapse each run of equal adjacent values into one value.

  9. Replace every value with its square.

  10. Remove every negative value.

  11. Multiply every value by -1.

  12. Sort ascending.

  13. Keep the values at indices 0, 2, 4, and so on.

  14. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  Then: Return the resulting list.


