prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by -1.

  2. Replace every value with the largest of itself and the up to 1 values before it.

  3. Replace every value with the largest value seen so far.

  4. Add -5 to every value.

  5. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  6. Sort ascending.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Sort ascending.

  9. Sort descending.

  10. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([0, -1, 16, -4, 19, 17, 19, -10]) returns -3`.


  Return only the code.'
