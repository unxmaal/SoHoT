prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Remove every digit.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Convert to uppercase.

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Convert to lowercase.

  13. Swap the case of every letter.

  14. Remove every digit.

  15. Replace every ''s'' with ''i'' (lowercase only).

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `reduce_data(''0yABb2 ,,1b ,y'') returns ''2B1A''`.


  Return only the code.'
