prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  2. Sort descending.

  3. Drop the first 2 values (an empty list if there are fewer).

  4. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  5. Remove every negative value.

  6. Drop the first 1 values (an empty list if there are fewer).

  7. Replace every value with the largest of itself and the up to 1 values before it.

  8. Multiply every value by -1.

  9. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return how many distinct values there are.


  Example: `compute([0, -6, -12, -5, 11, -10, -3, 13]) returns 2`.


  Return only the code.'
