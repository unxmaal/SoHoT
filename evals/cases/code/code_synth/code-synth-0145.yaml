  1. Sort the characters in ascending code point order.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Swap the case of every letter.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  6. Sort the characters in ascending code point order.

  7. Remove every digit.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `run_pipeline(''AzA0cy Bc11'') returns ''1.1B2C1Y1Z''`.


