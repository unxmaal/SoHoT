prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  2. Add 6 to every value.

  3. Replace every value with its absolute value.

  4. Replace every value with the largest value seen so far.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Multiply every value by -1.

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Clamp every value into the range 1 to 9, both inclusive.

  11. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  12. Replace every value with the largest of itself and the up to 1 values before it.

  13. Reverse the list.

  14. Add -1 to every value.

  Then: Return the resulting list.


  Example: `transform([25, 22, 0, 24, 24, -2, -11]) returns [0, 0, 0, 0]`.


  Return only the code.'
