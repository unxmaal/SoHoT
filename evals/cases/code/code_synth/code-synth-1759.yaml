prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Collapse each run of equal adjacent values into one value.

  3. Keep only the even values.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Multiply every value by 5.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Add 6 to every value.

  8. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  9. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  10. Collapse each run of equal adjacent values into one value.

  11. Replace every value with its square.

  12. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Sort descending.

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([-10, 8, 0, 18]) returns 8`.


  Return only the code.'
