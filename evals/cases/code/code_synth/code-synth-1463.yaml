  4. Clamp every value into the range 1 to 5, both inclusive.

  5. Replace every value with the largest value seen so far.

  6. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Multiply every value by -2.

  9. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  10. Multiply every value by 3.

  11. Sort ascending.

  12. Replace every value with the largest of itself and the up to 3 values before it.

  13. Keep the values at indices 0, 2, 4, and so on.

  14. Collapse each run of equal adjacent values into one value.

  15. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  16. Keep only the last 4 values, in their order (all of them if there are fewer).

  17. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  18. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `solve([6, -7, 1, 3, 1, -7, -9, 11, -3]) returns 0`.


  Return only the code.'
