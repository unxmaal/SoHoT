prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every ''c'' with ''t'' (lowercase only).

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Collapse every run of the same character into one character.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Swap the case of every letter.

  8. Keep only the first occurrence of each character.

  9. Remove every digit.

  10. Convert to lowercase.

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  13. Remove every digit.

  14. Remove every vowel (a, e, i, o, u, either case).

  15. Keep only the first occurrence of each character.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  18. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  19. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  20. Remove every digit.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
