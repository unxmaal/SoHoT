prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Remove every negative value.

  3. Reverse the list.

  4. Remove every negative value.

  5. Replace every value with the largest of itself and the up to 1 values before it.

  6. Replace every value with its square.

  7. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Keep only the first 6 values (all of them if there are fewer).

  11. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  12. Collapse each run of equal adjacent values into one value.

  13. Keep only the even values.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  15. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  16. Keep only the last 5 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `transform([4, 4, 21]) returns [18]`.


  Return only the code.'
