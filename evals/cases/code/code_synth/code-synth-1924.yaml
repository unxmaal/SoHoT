prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Keep only the first occurrence of each character.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Collapse every run of the same character into one character.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Keep only the first occurrence of each character.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Convert to uppercase.

  13. Replace every ''a'' with ''n'' (lowercase only).

  14. Convert to uppercase.

  15. Keep only the first occurrence of each character.

  16. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `compute(''0 a2,0x1b00  z'') returns ''1bdz,c''`.


  Return only the code.'
