prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Remove every digit.

  4. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  5. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Keep only the first 3 whitespace-separated words, joined by single spaces.

  8. Sort the characters in ascending code point order.

  9. Collapse every run of the same character into one character.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Replace every maximal run of digits with the number of digits in it.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Convert to uppercase.

  14. Collapse every run of the same character into one character.

  15. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  16. Reverse the order of the whitespace-separated words and join them with single spaces.

  17. Convert to lowercase.

  18. Collapse every run of the same character into one character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process(''bcB.By.2B by1C'') returns ''.jgjk''`.


  Return only the code.'
