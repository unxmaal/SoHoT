prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  3. Convert to lowercase.

  4. Convert to uppercase.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Sort the characters in ascending code point order.

  9. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  10. Keep only the first occurrence of each character.

  Then: Return the resulting string.


  Example: `run_pipeline(''B, 2bCbb,.xz'') returns '' ,1''`.


  Return only the code.'
