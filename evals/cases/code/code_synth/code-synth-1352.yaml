prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Sort the characters in ascending code point order.

  3. Keep only the first 2 whitespace-separated words, joined by single spaces.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Keep only the first occurrence of each character.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Remove every digit.

  8. Collapse every run of the same character into one character.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Keep only the first 3 whitespace-separated words, joined by single spaces.

  11. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Convert to lowercase.

  13. Swap the case of every letter.

  14. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''Az2xAzaxBzbz2'') returns ''KKG''`.


  Return only the code.'
