  4. Collapse each run of equal adjacent values into one value.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  9. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  10. Reverse the list.

  11. Remove duplicates, keeping the first occurrence of each value.

