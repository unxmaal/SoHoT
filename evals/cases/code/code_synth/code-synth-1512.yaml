prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Keep only the first occurrence of each character.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Swap the case of every letter.

  7. Convert to uppercase.

  8. Replace every ''o'' with ''i'' (lowercase only).

  9. Convert to uppercase.

  10. Sort the characters in ascending code point order.

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Keep only the first 2 whitespace-separated words, joined by single spaces.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Remove every digit.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `process('',CzBccaCa,y'') returns ''m''`.


  Return only the code.'
