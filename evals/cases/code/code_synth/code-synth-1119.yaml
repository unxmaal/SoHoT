  1. Keep only the values greater than -3.

  2. Add -5 to every value.

  3. Remove every negative value.

  4. Add 2 to every value.

  5. Sort descending.

  6. Keep only the first 6 values (all of them if there are fewer).

  7. Reverse the list.

  8. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  9. Keep only the last 2 values, in their order (all of them if there are fewer).

  10. Reverse the list.

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Keep only the first 2 values (all of them if there are fewer).

  13. Sort descending.

  14. Multiply every value by 5.

  Then: Return the sum of the values (0 for an empty list).


  Example: `process([-9, -5, 0, 24]) returns 0`.


  Return only the code.'
