prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''swap'', ''sub'', ''dup'', ''mul'': swap exchanges
  the top two values; sub pops b then a and pushes a - b, so the value pushed first is a; dup copies the
  top value onto the stack; mul pops two values and pushes their product. An operation that needs more
  values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([-3, ''sub'', ''swap'', ''dup'', ''sub'']) returns [0]`.


  Return only the code.'
