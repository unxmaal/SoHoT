  3. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  4. Replace every value with its square.

  5. Add -1 to every value.

  6. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Keep only the even values.

  Then: Return the resulting list.


  Example: `apply_rules([-8, -1, 11, 6, -7]) returns [12, 0, 4]`.


  Return only the code.'
