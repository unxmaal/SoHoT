  to the result of the one before:

  1. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  2. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Remove every digit.

  6. Sort the characters in ascending code point order.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `solve(''y2,a, 0c cCac'') returns '',''`.


  Return only the code.'
