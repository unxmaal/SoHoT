prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''mul'', ''add'', ''swap'', ''dup'': mul pops
  two values and pushes their product; add pops two values and pushes their sum; swap exchanges the top
  two values; dup copies the top value onto the stack. An operation that needs more values than the stack
  has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''mul'', ''dup'', ''add'', 2]) returns [2]`.


  Return only the code.'
