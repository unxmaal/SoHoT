  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Sort the characters in ascending code point order.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Keep only the first occurrence of each character.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Replace every ''b'' with ''r'' (lowercase only).

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Convert to uppercase.

  Then: Return the resulting string.


  Example: `reduce_data(''2CCc2,0ax0'') returns ''1,1011121C1C1X''`.


