  4. Replace runs of whitespace with a single space and strip both ends.

  5. Convert to uppercase.

  6. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Convert to uppercase.

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Sort the characters in ascending code point order.

  12. Convert to uppercase.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Convert to lowercase.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `solve(''0,.zxxbxxA'') returns '',''`.


  Return only the code.'
