  4. Sort ascending.

  5. Multiply every value by -2.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Keep only the first 6 values (all of them if there are fewer).

  9. Collapse each run of equal adjacent values into one value.

  10. Reverse the list.

  11. Collapse each run of equal adjacent values into one value.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Sort ascending.

  14. Keep only the last 3 values, in their order (all of them if there are fewer).

  15. Replace every value with the largest value seen so far.

  16. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  17. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  18. Replace every value with the largest of itself and the up to 1 values before it.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `transform([15, -8, 23, -10]) returns [-2]`.


  Return only the code.'
