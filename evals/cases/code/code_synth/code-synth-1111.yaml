prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Collapse each run of equal adjacent values into one value.

  5. Drop the first 1 values (an empty list if there are fewer).

  6. Reverse the list.

  7. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  8. Add -9 to every value.

  9. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  10. Drop the first 3 values (an empty list if there are fewer).

  11. Replace every value with its absolute value.

  12. Keep the values at indices 0, 2, 4, and so on.

  13. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  14. Sort descending.

  15. Remove every negative value.

  16. Multiply every value by 5.

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([1, 10, 8, -10, -11, 12]) returns -1`.


  Return only the code.'
