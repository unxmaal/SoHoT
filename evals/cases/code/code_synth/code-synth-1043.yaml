  8. Remove every negative value.

  9. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Reverse the list.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  14. Sort ascending.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
