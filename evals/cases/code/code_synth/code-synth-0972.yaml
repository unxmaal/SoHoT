  3. Replace runs of whitespace with a single space and strip both ends.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Swap the case of every letter.

  7. Remove every digit.

  8. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Keep only the first occurrence of each character.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return how many characters it has.


  Example: `solve(''..cB.,cx,Az B x'') returns 14`.


  Return only the code.'
