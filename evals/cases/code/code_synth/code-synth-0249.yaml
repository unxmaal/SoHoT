prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Remove every digit.

  3. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Convert to uppercase.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Keep only the first 2 whitespace-separated words, joined by single spaces.

  7. Convert to lowercase.

  8. Replace every ''s'' with ''t'' (lowercase only).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `run_pipeline(''zb0 bz a'') returns ''l''`.


  Return only the code.'
