prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Keep only the first occurrence of each character.

  3. Convert to lowercase.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Swap the case of every letter.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Sort the characters in ascending code point order.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  11. Sort the characters in ascending code point order.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Sort the characters in ascending code point order.

  15. Replace every ''c'' with ''e'' (lowercase only).

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return how many characters it has.


  Example: `process(''y2B,yaB.y, z1'') returns 8`.


  Return only the code.'
