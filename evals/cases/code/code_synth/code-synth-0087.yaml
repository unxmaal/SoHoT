  other characters are unchanged.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Keep only the first occurrence of each character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute(''221Bca2,,yzy'') returns ''21hig,ef''`.


  Return only the code.'
