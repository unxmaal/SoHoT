prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the last 3 values, in their order (all of them if there are fewer).

  2. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
