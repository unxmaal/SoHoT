  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Replace every ''i'' with ''l'' (lowercase only).

  10. Sort the characters in ascending code point order.

  11. Remove every digit.

  12. Convert to lowercase.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Remove every digit.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Keep only the first 4 whitespace-separated words, joined by single spaces.

  17. Sort the characters in ascending code point order.

  18. Replace every ''r'' with ''i'' (lowercase only).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
