prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Replace every maximal run of digits with the number of digits in it.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Replace every maximal run of digits with the number of digits in it.

  Then: Return how many characters it has.


  Example: `apply_rules(''yy aa,xa'') returns 5`.


  Return only the code.'
