  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Drop the first 1 values (an empty list if there are fewer).

  5. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  6. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  7. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  8. Keep only the first 6 values (all of them if there are fewer).

  9. Replace every value with the largest value seen so far.

  10. Replace every value with its absolute value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `solve([-6, 21, -8, 17, -5, 7, 3, 4, -12]) returns [5, 5]`.


  Return only the code.'
