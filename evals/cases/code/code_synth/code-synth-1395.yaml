  4. Drop the first 1 values (an empty list if there are fewer).

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Keep only the values greater than -2.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Replace every value with the largest value seen so far.

  12. Remove every negative value.

  13. Replace every value with the largest value seen so far.

  14. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
