  7. Convert to lowercase.

  8. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Sort the characters in ascending code point order.

  10. Convert to lowercase.

  11. Swap the case of every letter.

  12. Replace every ''c'' with ''d'' (lowercase only).

  13. Convert to lowercase.

  14. Remove every digit.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
