  16. Collapse every run of the same character into one character.

  17. Keep only the first 2 whitespace-separated words, joined by single spaces.

  18. Replace every maximal run of digits with the number of digits in it.

  19. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
