  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Keep only the first occurrence of each character.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Convert to lowercase.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Convert to lowercase.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Convert to uppercase.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Sort the characters in ascending code point order.

  14. Convert to uppercase.

  15. Convert to lowercase.

  16. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


