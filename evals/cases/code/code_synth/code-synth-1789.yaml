  2. Reverse the list.

  3. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  4. Keep only the values greater than 7.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Keep only the last 4 values, in their order (all of them if there are fewer).

  7. Replace every value with its square.

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Keep the values at indices 0, 2, 4, and so on.

  12. Keep only the even values.

  13. Replace every value with the largest of itself and the up to 1 values before it.

  14. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  15. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  16. Keep only the last 2 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `process([21, 3, 4]) returns [25]`.


  Return only the code.'
