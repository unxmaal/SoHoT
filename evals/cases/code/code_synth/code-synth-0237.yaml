  - run_program(['swap', -2, 1, 'drop']) == [-2]
  - run_program(['over', 4, 'drop', 'drop', 'swap', 'dup', -3, 'drop', 'swap']) == []
  - run_program(['dup', 'drop', 4, 5, 'swap', 7]) == [5, 4, 7]
  - run_program([5, 'drop', 'swap', 'swap', -2]) == [-2]
  - run_program([1, 'swap', 'over', 4, 'dup']) == [1, 4, 4]
  - run_program([9, 'swap', 'over', 'drop', 'swap', 'swap', 'swap', 'dup']) == []
