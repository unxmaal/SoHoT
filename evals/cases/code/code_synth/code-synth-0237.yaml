prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''over'', ''dup'', ''swap'', ''drop'': over pushes
  a copy of the second value from the top; dup copies the top value onto the stack; swap exchanges the
  top two values; drop removes the top value. An operation that needs more values than the stack has does
  nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''drop'', ''dup'', ''dup'', ''drop'', ''dup'', 8, ''drop'', ''over'']) returns
  []`.


  Return only the code.'
assert:
