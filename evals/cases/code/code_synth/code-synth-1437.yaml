  3. Add -5 to every value.

  4. Replace every value with the largest value seen so far.

  5. Add 6 to every value.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Collapse each run of equal adjacent values into one value.

  8. Sort descending.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Replace every value with its absolute value.

  12. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  13. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([-9, -12, 24, 14, 21]) returns 5`.


  Return only the code.'
