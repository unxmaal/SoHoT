prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Add -5 to every value.

  2. Replace every value with its absolute value.

  3. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  4. Sort ascending.

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Keep only the even values.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Reverse the list.

  9. Collapse each run of equal adjacent values into one value.

  10. Add 2 to every value.

  11. Keep the values at indices 0, 2, 4, and so on.

  12. Sort descending.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  15. Collapse each run of equal adjacent values into one value.

  16. Remove duplicates, keeping the first occurrence of each value.

  17. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  18. Remove every negative value.

  Then: Return the resulting list.


  Example: `reduce_data([-10, 18, 23, 0]) returns [6]`.


  Return only the code.'
