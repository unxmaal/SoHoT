  1. Add 9 to every value.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Keep only the values greater than 8.

  4. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  5. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  6. Multiply every value by 5.

  7. Sort ascending.

  8. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  9. Remove every negative value.

  10. Add 4 to every value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([-12, -2, -12, 16, -9, 2]) returns [4, 6]`.


  Return only the code.'
