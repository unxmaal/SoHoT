prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''add'', ''dup'', ''swap'', ''sub'': add pops
  two values and pushes their sum; dup copies the top value onto the stack; swap exchanges the top two
  values; sub pops b then a and pushes a - b, so the value pushed first is a. An operation that needs
  more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([4, 9, -2, ''sub'']) returns [4, 11]`.


  Return only the code.'
