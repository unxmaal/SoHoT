prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Convert to uppercase.

  4. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Replace every ''i'' with ''r'' (lowercase only).

  7. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Replace every ''i'' with ''r'' (lowercase only).

  9. Sort the characters in ascending code point order.

  10. Swap the case of every letter.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Replace every ''s'' with ''o'' (lowercase only).

  14. Keep only the first occurrence of each character.

  Then: Return the resulting string.


  Example: `transform(''x. .c,yCx 212,B2'') returns '',.123imn''`.


  Return only the code.'
