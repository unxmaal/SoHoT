  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Remove every digit.

  6. Convert to lowercase.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Keep only the first 2 whitespace-separated words, joined by single spaces.

  9. Swap the case of every letter.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
