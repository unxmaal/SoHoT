prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Replace every ''s'' with ''e'' (lowercase only).

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Remove every digit.

  6. Convert to uppercase.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Convert to lowercase.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Keep only the first 3 whitespace-separated words, joined by single spaces.

  11. Replace every ''t'' with ''b'' (lowercase only).

  12. Sort the characters in ascending code point order.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Swap the case of every letter.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Replace every ''a'' with ''e'' (lowercase only).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `transform(''.,.zc B1'') returns ''.''`.


  Return only the code.'
