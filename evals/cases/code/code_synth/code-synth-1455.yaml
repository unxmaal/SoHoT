prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Keep only the last 3 values, in their order (all of them if there are fewer).

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Keep only the last 5 values, in their order (all of them if there are fewer).

  5. Reverse the list.

  6. Sort descending.

  7. Replace every value with its absolute value.

  8. Clamp every value into the range 0 to 4, both inclusive.

  9. Keep the values at indices 0, 3, 6, and so on.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Replace every value with the largest value seen so far.

  13. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  14. Keep only the last 4 values, in their order (all of them if there are fewer).

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  Then: Return the resulting list.


  Example: `transform([5, -4, 2, 7, -7, 25, 24, -7, 20]) returns [4]`.


  Return only the code.'
