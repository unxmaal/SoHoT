prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Sort the characters in ascending code point order.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  5. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `transform(''0x,cCyc.1C BBcC'') returns ''1 1,1.''`.


  Return only the code.'
