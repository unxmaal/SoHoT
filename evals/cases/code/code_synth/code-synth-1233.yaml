prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  2. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  3. Reverse the list.

  4. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  5. Collapse each run of equal adjacent values into one value.

  6. Add 6 to every value.

  7. Replace every value with its square.

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Replace every value with the largest value seen so far.

  10. Sort ascending.

  11. Remove every negative value.

  12. Replace every value with the largest of itself and the up to 3 values before it.

  13. Replace every value with its absolute value.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([8, 19, -10, 9, 17, -11]) returns 625`.


  Return only the code.'
