  2. Add 2 to every value.

  3. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  4. Replace every value with the largest value seen so far.

  5. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  6. Collapse each run of equal adjacent values into one value.

  7. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


