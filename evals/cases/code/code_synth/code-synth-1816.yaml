prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  2. Keep only the first 2 whitespace-separated words, joined by single spaces.

  3. Convert to lowercase.

  4. Collapse every run of the same character into one character.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Swap the case of every letter.

  9. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Swap the case of every letter.

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Sort the characters in ascending code point order.

  13. Keep only the first 4 whitespace-separated words, joined by single spaces.

  14. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve('',y00bBc,CA.Ca2A.'') returns ''2,2.10121j1m3n''`.


  Return only the code.'
