prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Convert to uppercase.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Swap the case of every letter.

  7. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Convert to uppercase.

  9. Convert to lowercase.

  10. Replace every ''a'' with ''s'' (lowercase only).

  11. Convert to lowercase.

  12. Remove every digit.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Replace every ''c'' with ''a'' (lowercase only).

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Replace every ''t'' with ''l'' (lowercase only).

  17. Collapse every run of the same character into one character.

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  19. Convert to lowercase.

  20. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the resulting string.


  Example: `compute(''ybazxxbcz'') returns ''hkjfhjg''`.


  Return only the code.'
