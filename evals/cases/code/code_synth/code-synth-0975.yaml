  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Collapse every run of the same character into one character.

  6. Swap the case of every letter.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Convert to lowercase.

  Then: Return the resulting string.


  Example: `solve(''cabC1bAB'') returns ''1w1u1v1w1v1u1v''`.


  Return only the code.'
