prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Keep only the first 6 values (all of them if there are fewer).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Multiply every value by -2.

  8. Sort descending.

  9. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Sort descending.

  12. Replace every value with the largest value seen so far.

  13. Replace every value with its absolute value.

  14. Replace every value with its square.

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Replace every value with its absolute value.

  17. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  18. Reverse the list.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `solve([-9, 4, 19, -12, -11, 10, 13]) returns 72`.


  Return only the code.'
