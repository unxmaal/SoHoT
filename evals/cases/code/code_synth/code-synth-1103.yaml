prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Replace every value with its square.

  4. Sort ascending.

  5. Drop the first 1 values (an empty list if there are fewer).

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace every value with the largest value seen so far.

  8. Clamp every value into the range -3 to 5, both inclusive.

  9. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  10. Remove every negative value.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Multiply every value by 2.

  14. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([-8, 23, -1]) returns []`.


  Return only the code.'
