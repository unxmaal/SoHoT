prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  2. Sort ascending.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  5. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Replace every value with the largest value seen so far.

  8. Collapse each run of equal adjacent values into one value.

  9. Sort descending.

  10. Keep only the first 4 values (all of them if there are fewer).

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Reverse the list.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Add 6 to every value.

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Replace every value with the largest of itself and the up to 2 values before it.

  Then: Return the resulting list.


  Example: `compute([9, 6, 18, 24, 21, -1]) returns [9, 9]`.


  Return only the code.'
