  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Convert to uppercase.

  4. Collapse every run of the same character into one character.

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Remove every digit.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Replace every maximal run of digits with the number of digits in it.

  12. Collapse every run of the same character into one character.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Convert to lowercase.

  17. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  18. Collapse every run of the same character into one character.

  19. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  20. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


