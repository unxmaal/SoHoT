prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Swap the case of every letter.

  4. Convert to uppercase.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Convert to lowercase.

  8. Replace every ''b'' with ''t'' (lowercase only).

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''c xBa2,..x1xb,1'') returns ''11,1e1a111a1.2,111d1e1a1''`.


  Return only the code.'
