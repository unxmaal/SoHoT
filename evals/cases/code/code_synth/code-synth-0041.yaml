  3. Replace every value with the largest of itself and the up to 3 values before it.

  4. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  5. Replace every value with the largest of itself and the up to 1 values before it.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Add -1 to every value.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `transform([11, 24, 7]) returns 1`.


  Return only the code.'
