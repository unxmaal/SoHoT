  1. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  2. Reverse the list.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Clamp every value into the range 0 to 3, both inclusive.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Replace every value with the largest value seen so far.

  7. Remove every negative value.

  8. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  9. Sort descending.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Collapse each run of equal adjacent values into one value.

  12. Clamp every value into the range 1 to 7, both inclusive.

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([-7, 20, 2, 1, 20, -7, 24, 18]) returns 7`.


  Return only the code.'
