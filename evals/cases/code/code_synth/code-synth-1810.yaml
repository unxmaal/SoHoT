prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Convert to lowercase.

  4. Collapse every run of the same character into one character.

  5. Keep only the first 2 whitespace-separated words, joined by single spaces.

  6. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Convert to lowercase.

  9. Sort the characters in ascending code point order.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Swap the case of every letter.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Swap the case of every letter.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  17. Sort the characters in ascending code point order.

  18. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  19. Swap the case of every letter.

  20. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the resulting string.


  Example: `apply_rules(''cyaCa,1z'') returns '',111112gi''`.


  Return only the code.'
