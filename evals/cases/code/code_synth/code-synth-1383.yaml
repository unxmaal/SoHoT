prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  3. Keep the values at indices 0, 2, 4, and so on.

  4. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Sort descending.

  7. Remove every negative value.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  9. Collapse each run of equal adjacent values into one value.

  10. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Replace every value with its absolute value.

  13. Add 9 to every value.

  14. Multiply every value by -2.

  15. Keep only the even values.

  16. Keep only the first 6 values (all of them if there are fewer).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([-5, 8, -4, 7, 14]) returns -20`.


  Return only the code.'
