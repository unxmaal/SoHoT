prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Multiply every value by 5.

  3. Replace every value with the largest of itself and the up to 3 values before it.

  4. Drop the first 2 values (an empty list if there are fewer).

  5. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  6. Clamp every value into the range -1 to 5, both inclusive.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Clamp every value into the range -3 to 5, both inclusive.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Sort ascending.

  12. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  13. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  14. Sort descending.

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  17. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  18. Replace every value with its absolute value.

  Then: Return the resulting list.


  Example: `solve([-6, 1, 22, 4, -5, 18, 24, -11]) returns [2]`.


  Return only the code.'
