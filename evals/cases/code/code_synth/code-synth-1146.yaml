prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Convert to uppercase.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Swap the case of every letter.

  5. Convert to lowercase.

  6. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Replace every ''b'' with ''t'' (lowercase only).

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Convert to lowercase.

  10. Remove every digit.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Keep only the first 2 whitespace-separated words, joined by single spaces.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Keep only the first 3 whitespace-separated words, joined by single spaces.

  16. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''yCC2.211y1'') returns ''.''`.


  Return only the code.'
