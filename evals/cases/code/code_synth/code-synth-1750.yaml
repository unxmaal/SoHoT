prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Sort the characters in ascending code point order.

  4. Collapse every run of the same character into one character.

  5. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Keep only the first occurrence of each character.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Collapse every run of the same character into one character.

  10. Swap the case of every letter.

  11. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  12. Replace every ''e'' with ''o'' (lowercase only).

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Remove every digit.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Remove every digit.

  17. Sort the characters in ascending code point order.

  18. Swap the case of every letter.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''CzBBAAaz'') returns ''...ln''`.


  Return only the code.'
