modality: code
prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''add'', ''swap'', ''dup'', ''drop'': add pops
  two values and pushes their sum; swap exchanges the top two values; dup copies the top value onto the
  stack; drop removes the top value. An operation that needs more values than the stack has does nothing.
  Return the final stack as a list, bottom first.


  Example: `run_program([9, 4, ''add'', ''drop'', ''add'', ''add'', ''add'', 7]) returns [7]`.


  Return only the code.'
assert:
  checks:
  - run_program(['dup', 'drop', 'add', 'add']) == []
  - run_program(['dup', -1, 'add', 'add', 7, 'add', 'add', 5]) == [6, 5]
  - run_program(['drop', 'swap', 'swap']) == []
  - run_program(['swap', 'dup']) == []
  - run_program([4, -2, 'add', 'dup', 'dup', 'drop', 'dup']) == [2, 2, 2]
  - run_program(['dup', 4]) == [4]
