prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by -1.

  2. Sort ascending.

  3. Multiply every value by 5.

  4. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  5. Replace every value with the largest of itself and the up to 2 values before it.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the resulting list.


  Example: `apply_rules([1, 20, 8, 16, 18, 17, 17, 13]) returns [-50, -45, -42, -40, -32, -20, -2]`.


  Return only the code.'
