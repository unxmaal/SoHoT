prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Keep only the first 3 whitespace-separated words, joined by single spaces.

  3. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Convert to lowercase.

  5. Sort the characters in ascending code point order.

  6. Remove every digit.

  7. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  8. Keep only the first 4 whitespace-separated words, joined by single spaces.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Keep only the first 3 whitespace-separated words, joined by single spaces.

  12. Replace runs of whitespace with a single space and strip both ends.

  13. Keep only the first occurrence of each character.

  14. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Collapse every run of the same character into one character.

  18. Replace runs of whitespace with a single space and strip both ends.

  Then: Return how many characters it has.


  Example: `transform(''.,x.11211'') returns 3`.


  Return only the code.'
