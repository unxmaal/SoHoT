  5. Remove every negative value.

  6. Keep only the values greater than 1.

  7. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Sort descending.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Sort ascending.

  12. Add -1 to every value.

  13. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  14. Keep only the even values.

  15. Replace every value with the largest value seen so far.

  16. Remove every negative value.

  17. Sort by absolute value, values with equal absolute value keeping their current relative order.

  18. Keep the values at indices 0, 3, 6, and so on.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([1, -4, 3, 7]) returns [0]`.


  Return only the code.'
