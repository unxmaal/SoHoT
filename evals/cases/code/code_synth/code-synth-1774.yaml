prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Remove every digit.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Remove every digit.

  7. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Convert to lowercase.

  9. Swap the case of every letter.

  10. Collapse every run of the same character into one character.

  11. Keep only the first 4 whitespace-separated words, joined by single spaces.

  12. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  13. Convert to uppercase.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Replace every ''c'' with ''e'' (lowercase only).

  17. Swap the case of every letter.

  18. Keep only the first occurrence of each character.

  19. Convert to lowercase.

  20. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  Then: Return the resulting string.


  Example: `process(''122b,bcz20y0cx'') returns ''1,d3.''`.


  Return only the code.'
