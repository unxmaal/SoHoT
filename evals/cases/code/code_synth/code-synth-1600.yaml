prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the order of the whitespace-separated words and join them with single spaces.

  2. Convert to lowercase.

  3. Swap the case of every letter.

  4. Convert to uppercase.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Swap the case of every letter.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Collapse every run of the same character into one character.

  9. Sort the characters in ascending code point order.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Keep only the first occurrence of each character.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Sort the characters in ascending code point order.

  Then: Return the resulting string.


  Example: `apply_rules(''B,aBzA1 0.aA2'') returns '',.0111111122ac''`.


  Return only the code.'
