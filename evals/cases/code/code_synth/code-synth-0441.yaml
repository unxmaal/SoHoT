  1. Replace every value with the largest of itself and the up to 3 values before it.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Keep the values at indices 0, 3, 6, and so on.

  4. Sort ascending.

  5. Replace every value with its absolute value.

  6. Collapse each run of equal adjacent values into one value.

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Drop the first 1 values (an empty list if there are fewer).

  9. Add 9 to every value.

  10. Sort ascending.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `transform([-3, -6, -3, 20, 9, -5, 7, 21]) returns 1`.


  Return only the code.'
