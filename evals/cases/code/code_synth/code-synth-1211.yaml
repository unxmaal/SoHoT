prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Drop the first 3 values (an empty list if there are fewer).

  2. Keep only the even values.

  3. Multiply every value by 2.

  4. Replace every value with its absolute value.

  5. Keep only the last 4 values, in their order (all of them if there are fewer).

  6. Multiply every value by 2.

  7. Replace every value with the largest of itself and the up to 2 values before it.

  8. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  9. Keep only the first 5 values (all of them if there are fewer).

  10. Reverse the list.

  11. Sort ascending.

  12. Keep only the values greater than 6.

  13. Replace every value with the largest value seen so far.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the largest value, or -1 for an empty list.


  Example: `run_pipeline([18, 1, -1, -1, 13]) returns -1`.


  Return only the code.'
