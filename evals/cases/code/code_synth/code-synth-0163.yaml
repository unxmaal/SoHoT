prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the first 3 values (all of them if there are fewer).

  2. Replace every value with its square.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Keep only the values greater than 3.

  5. Collapse each run of equal adjacent values into one value.

  6. Replace every value with its absolute value.

  7. Sort ascending.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([12, -1, -5]) returns 170`.


  Return only the code.'
