prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the even values.

  2. Sort descending.

  3. Keep only the first 2 values (all of them if there are fewer).

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Replace every value with the largest of itself and the up to 2 values before it.

  7. Clamp every value into the range -5 to 3, both inclusive.

  8. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  9. Add -9 to every value.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Keep only the first 2 values (all of them if there are fewer).

  12. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  13. Keep only the last 2 values, in their order (all of them if there are fewer).

  14. Replace every value with the largest value seen so far.

  15. Add 6 to every value.

  16. Reverse the list.

  17. Replace every value with its square.

  18. Keep only the last 4 values, in their order (all of them if there are fewer).

  19. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  20. Multiply every value by -2.

  Then: Return the resulting list.


  Example: `compute([15, 22, 19, -12, -11]) returns [-18]`.


  Return only the code.'
