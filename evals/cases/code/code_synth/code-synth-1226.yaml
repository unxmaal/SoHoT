prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Collapse every run of the same character into one character.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Remove every digit.

  7. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  8. Keep only the first occurrence of each character.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Swap the case of every letter.

  11. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  12. Swap the case of every letter.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Convert to uppercase.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `apply_rules(''02Byb0x2b2BBy10'') returns ''1C2F1B2.''`.


  Return only the code.'
