prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Add 4 to every value.

  4. Collapse each run of equal adjacent values into one value.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Clamp every value into the range -2 to 5, both inclusive.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Add 6 to every value.

  10. Replace every value with its square.

  11. Keep only the first 5 values (all of them if there are fewer).

  12. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  13. Replace every value with its absolute value.

  14. Keep only the last 5 values, in their order (all of them if there are fewer).

  Then: Return the resulting list.


  Example: `run_pipeline([13, -11, -8, -7, 2, 0]) returns [1, 0, 4, 0, 4]`.


  Return only the code.'
