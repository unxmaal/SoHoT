prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort ascending.

  2. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  3. Replace every value with its square.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Replace every value with its square.

  6. Keep only the first 5 values (all of them if there are fewer).

  7. Collapse each run of equal adjacent values into one value.

  8. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([21, 9, 1, 7, 7]) returns 1248`.


  Return only the code.'
