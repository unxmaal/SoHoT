prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every negative value.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  4. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  5. Keep only the values greater than -2.

  6. Clamp every value into the range -3 to 6, both inclusive.

  7. Replace every value with its absolute value.

  8. Replace every value with its square.

  9. Sort ascending.

  10. Replace every value with the largest of itself and the up to 2 values before it.

  11. Collapse each run of equal adjacent values into one value.

  12. Remove every negative value.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Remove every negative value.

  15. Keep only the first 2 values (all of them if there are fewer).

  16. Replace every value with the largest of itself and the up to 2 values before it.

  17. Keep only the last 4 values, in their order (all of them if there are fewer).

  18. Collapse each run of equal adjacent values into one value.

  19. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  20. Remove every negative value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([22, -3, 24]) returns [4]`.


  Return only the code.'
