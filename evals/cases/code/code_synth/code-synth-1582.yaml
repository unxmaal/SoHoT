prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to uppercase.

  2. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Replace every ''c'' with ''a'' (lowercase only).

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Convert to uppercase.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Remove every digit.

  13. Replace every ''e'' with ''i'' (lowercase only).

  14. Collapse every run of the same character into one character.

  15. Keep only the first occurrence of each character.

  16. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''12bx,,C.CaB,2b.'') returns '',XB.''`.


  Return only the code.'
