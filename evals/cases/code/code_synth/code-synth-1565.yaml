prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the last 5 values, in their order (all of them if there are fewer).

  2. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Collapse each run of equal adjacent values into one value.

  6. Keep only the even values.

  7. Sort ascending.

  8. Collapse each run of equal adjacent values into one value.

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Keep only the last 4 values, in their order (all of them if there are fewer).

  11. Replace every value with the largest value seen so far.

  12. Replace every value with the largest of itself and the up to 1 values before it.

  13. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  15. Remove every negative value.

  16. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([25, -4, 12, -7, 15]) returns 30`.


  Return only the code.'
