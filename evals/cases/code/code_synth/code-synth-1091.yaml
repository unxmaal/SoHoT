  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Collapse each run of equal adjacent values into one value.

  10. Replace every value with its square.

  11. Keep only the last 4 values, in their order (all of them if there are fewer).

  12. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  13. Multiply every value by 5.

  14. Replace every value with its square.

