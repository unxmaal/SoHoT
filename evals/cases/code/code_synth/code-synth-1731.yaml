prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Multiply every value by 2.

  3. Replace every value with its absolute value.

  4. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  5. Multiply every value by 2.

  6. Keep only the values greater than 1.

  7. Multiply every value by 5.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  11. Keep only the first 6 values (all of them if there are fewer).

  12. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  13. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  14. Reverse the list.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([25, -12, 7, -10, 7, 22, -9, -4, 11]) returns 3`.


  Return only the code.'
