  other characters are unchanged.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Swap the case of every letter.

  9. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Keep only the first 3 whitespace-separated words, joined by single spaces.

  12. Replace runs of whitespace with a single space and strip both ends.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Replace every ''b'' with ''c'' (lowercase only).

  15. Convert to lowercase.

  16. Keep only the first occurrence of each character.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


