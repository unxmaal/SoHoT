prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''drop'', ''mul'', ''swap'': dup copies
  the top value onto the stack; drop removes the top value; mul pops two values and pushes their product;
  swap exchanges the top two values. An operation that needs more values than the stack has does nothing.
  Return the final stack as a list, bottom first.


  Example: `run_program([''swap'', ''mul'', 3, 0, ''mul'']) returns [0]`.


  Return only the code.'
assert:
  checks:
  - run_program(['drop', -3]) == [-3]
  - run_program(['dup', 'drop', 'dup', -2]) == [-2]
  - run_program([1, 'swap', 'drop', 'swap', 'dup', -3, 'mul']) == [-3]
  - run_program([9, -1, -1, -2]) == [9, -1, -1, -2]
  - run_program(['mul', 'dup']) == []
  - run_program(['mul', 'dup', 'mul', 'drop', 'swap']) == []
