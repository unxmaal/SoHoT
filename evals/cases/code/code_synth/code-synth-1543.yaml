  7. Drop the first 3 values (an empty list if there are fewer).

  8. Keep only the last 5 values, in their order (all of them if there are fewer).

  9. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  10. Keep the values at indices 0, 2, 4, and so on.

  11. Replace every value with its absolute value.

  12. Keep the values at indices 0, 3, 6, and so on.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  15. Sort descending.

  16. Clamp every value into the range -5 to 4, both inclusive.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
