prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  2. Keep the values at indices 0, 3, 6, and so on.

  3. Add -1 to every value.

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  6. Add -9 to every value.

  7. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  11. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  12. Replace every value with its absolute value.

  13. Replace every value with its square.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  15. Replace every value with its absolute value.

  16. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the resulting list.


  Example: `compute([4, -5, 20, 4]) returns []`.


  Return only the code.'
