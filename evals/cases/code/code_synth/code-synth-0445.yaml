  2. Replace every ''t'' with ''i'' (lowercase only).

  3. Swap the case of every letter.

  4. Collapse every run of the same character into one character.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process('' yBBxx.C'') returns ''.c.xby''`.


