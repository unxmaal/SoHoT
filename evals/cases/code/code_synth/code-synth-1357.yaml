prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  2. Collapse each run of equal adjacent values into one value.

  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  5. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  6. Sort descending.

  7. Drop the first 1 values (an empty list if there are fewer).

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Keep only the values greater than 2.

  10. Clamp every value into the range 0 to 8, both inclusive.

  11. Keep only the last 2 values, in their order (all of them if there are fewer).

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Reverse the list.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  15. Replace every value with the largest of itself and the up to 3 values before it.

  16. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `run_pipeline([20, -3, 3]) returns 0`.


  Return only the code.'
