prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace every value with the largest value seen so far.

  4. Add 9 to every value.

  5. Collapse each run of equal adjacent values into one value.

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace every value with its absolute value.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Collapse each run of equal adjacent values into one value.

  11. Keep only the last 3 values, in their order (all of them if there are fewer).

  12. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  13. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  14. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `transform([-5, -3, 25]) returns 0`.


  Return only the code.'
