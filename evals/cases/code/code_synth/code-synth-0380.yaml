prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `compute([21, 5, 22, 16, -11, -3, -6, 7, 11]) returns 7`.


  Return only the code.'
