prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Remove every digit.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Sort the characters in ascending code point order.

  10. Replace every ''n'' with ''t'' (lowercase only).

  11. Convert to uppercase.

  12. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  Then: Return the resulting string.


  Example: `process(''c, cx02,CB, .'') returns '',.111....''`.


  Return only the code.'
