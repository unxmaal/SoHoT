prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Replace every value with the largest value seen so far.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Replace every value with the largest value seen so far.

  6. Clamp every value into the range 1 to 4, both inclusive.

  7. Multiply every value by -2.

  8. Keep the values at indices 0, 2, 4, and so on.

  9. Add 6 to every value.

  10. Replace every value with the largest of itself and the up to 2 values before it.

  11. Replace every value with its square.

  12. Sort descending.

  13. Remove every negative value.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  15. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  16. Keep only the even values.

  17. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  18. Replace every value with the largest of itself and the up to 3 values before it.

  19. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  20. Reverse the list.

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([-4, 11, 17, 13, -9, 3, -10, -6]) returns 2`.


  Return only the code.'
