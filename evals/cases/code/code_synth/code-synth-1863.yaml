  3. Replace every value with the largest value seen so far.

  4. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  5. Collapse each run of equal adjacent values into one value.

  6. Replace every value with the largest value seen so far.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Keep only the last 4 values, in their order (all of them if there are fewer).

  10. Collapse each run of equal adjacent values into one value.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Multiply every value by 3.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Keep only the values greater than 2.

  15. Collapse each run of equal adjacent values into one value.

  16. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the largest value, or -1 for an empty list.


  Example: `transform([16, 1, -8, 13, 15, 16, -3, -7]) returns 24`.


  Return only the code.'
