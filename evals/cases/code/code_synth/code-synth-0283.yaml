prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  2. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  3. Sort ascending.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Replace every value with its square.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Sort descending.

  8. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([10, 14, -5, -11, -7]) returns 361`.


  Return only the code.'
