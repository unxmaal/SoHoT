  two values and pushes their sum; mul pops two values and pushes their product; dup copies the top value
  onto the stack; swap exchanges the top two values. An operation that needs more values than the stack
  has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''swap'', 6, 9, -3, ''swap'', ''swap'', ''add'']) returns [6, 6]`.


  Return only the code.'
