prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Keep only the first 5 values (all of them if there are fewer).

  3. Keep only the values greater than -2.

  4. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  5. Sort ascending.

  6. Replace every value with the largest value seen so far.

  Then: Return how many distinct values there are.


  Example: `apply_rules([-1, -7, 19, 6]) returns 3`.


  Return only the code.'
