prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Keep the values at indices 0, 2, 4, and so on.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Sort ascending.

  5. Replace every value with its square.

  6. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Replace every value with its absolute value.

  9. Reverse the list.

  10. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  11. Remove every negative value.

  12. Clamp every value into the range -2 to 7, both inclusive.

  13. Replace every value with its absolute value.

  14. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  15. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  16. Remove every negative value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([13, 13, 20, 10, -7, 12, 11, -1, -12]) returns [0, 0]`.


  Return only the code.'
