  4. Multiply every value by -2.

  5. Collapse each run of equal adjacent values into one value.

  6. Keep only the last 5 values, in their order (all of them if there are fewer).

  7. Keep only the first 6 values (all of them if there are fewer).

  8. Replace every value with the largest value seen so far.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Replace every value with the largest value seen so far.

  11. Replace every value with its absolute value.

  12. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  13. Sort ascending.

  14. Replace every value with its square.

  Then: Return the largest value, or -1 for an empty list.


  Example: `transform([-7, 17, -11, 18, 16, -5, -8, -6]) returns 900`.


  Return only the code.'
