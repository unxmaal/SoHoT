prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Convert to lowercase.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Replace every maximal run of digits with the number of digits in it.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Convert to uppercase.

  7. Sort the characters in ascending code point order.

  8. Keep only the first occurrence of each character.

  9. Convert to lowercase.

  10. Swap the case of every letter.

  11. Replace every ''o'' with ''d'' (lowercase only).

  12. Sort the characters in ascending code point order.

  13. Keep only the first occurrence of each character.

  14. Swap the case of every letter.

  15. Convert to lowercase.

  16. Sort the characters in ascending code point order.

  17. Keep only the first 4 whitespace-separated words, joined by single spaces.

  18. Remove every vowel (a, e, i, o, u, either case).

  19. Collapse every run of the same character into one character.

  20. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the resulting string.


  Example: `process(''b.10AA.,zAyB'') returns '',.15byz''`.


  Return only the code.'
