prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Convert to uppercase.

  3. Swap the case of every letter.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Collapse every run of the same character into one character.

  6. Swap the case of every letter.

  7. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  9. Remove every digit.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Sort the characters in ascending code point order.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''0xca0.y2AAB'') returns ''A''`.


  Return only the code.'
