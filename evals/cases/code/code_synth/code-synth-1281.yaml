prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Multiply every value by 2.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Remove every negative value.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Multiply every value by 2.

  7. Keep only the even values.

  8. Sort descending.

  9. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  10. Replace every value with its absolute value.

  11. Replace every value with the largest of itself and the up to 2 values before it.

  12. Keep only the last 5 values, in their order (all of them if there are fewer).

  13. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  14. Keep only the first 6 values (all of them if there are fewer).

  15. Keep only the even values.

  16. Add 2 to every value.

  17. Replace every value with its absolute value.

  18. Keep only the even values.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `transform([13, 6, 13, 10, -2, 9, -4]) returns 6`.


  Return only the code.'
