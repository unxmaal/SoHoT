prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  2. Keep the values at indices 0, 2, 4, and so on.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Sort descending.

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Keep only the first 5 values (all of them if there are fewer).

  8. Multiply every value by 2.

  9. Replace every value with the largest value seen so far.

  10. Add 9 to every value.

  11. Keep only the last 3 values, in their order (all of them if there are fewer).

  12. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  13. Replace every value with the largest value seen so far.

  14. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Keep only the first 4 values (all of them if there are fewer).

  17. Keep only the values greater than -1.

  18. Replace every value with its absolute value.

  19. Keep only the even values.

  20. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `run_pipeline([1, 6, -12, -5, 10, -11, -8, 18]) returns 0`.


  Return only the code.'
