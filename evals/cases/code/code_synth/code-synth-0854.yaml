id: code-synth-0854
modality: code
prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''sub'', ''add'', ''over'': dup copies
  the top value onto the stack; sub pops b then a and pushes a - b, so the value pushed first is a; add
  pops two values and pushes their sum; over pushes a copy of the second value from the top. An operation
  that needs more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''sub'', 2, 1, 5, 0, 8, 3]) returns [2, 1, 5, 0, 8, 3]`.


  Return only the code.'
assert:
  checks:
  - run_program(['add', 'dup', 'add', -2, 7, 'dup', 'over']) == [-2, 7, 7, 7]
  - run_program(['over', -3, 3]) == [-3, 3]
  - run_program(['add', 5, 'add', 'add', 'over']) == [5]
  - run_program(['dup', 'over', 'over', 'sub', 'sub', 'dup', -1, -1, 'dup']) == [-1, -1, -1]
  - run_program(['dup', 'add', 'dup', 'dup', -3, 1, 'sub', 'dup']) == [-4, -4]
  - run_program(['sub', 7, 'over', 1, 'sub', 'sub']) == [6]
