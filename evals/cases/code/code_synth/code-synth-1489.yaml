  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Add -5 to every value.

  6. Reverse the list.

  7. Multiply every value by 5.

  8. Keep only the even values.

  9. Sort descending.

  10. Clamp every value into the range -1 to 5, both inclusive.

  11. Replace every value with the largest value seen so far.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Reverse the list.

  14. Multiply every value by 2.

  15. Keep only the last 4 values, in their order (all of them if there are fewer).

  16. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  Then: Return the resulting list.


