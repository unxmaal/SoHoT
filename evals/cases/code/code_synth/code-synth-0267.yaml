prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every digit.

  2. Keep only the first occurrence of each character.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Convert to lowercase.

  6. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Remove every digit.

  8. Collapse every run of the same character into one character.

  Then: Return how many characters it has.


  Example: `apply_rules(''BA BCxyz'') returns 6`.


  Return only the code.'
