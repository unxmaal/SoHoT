prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  2. Sort the characters in ascending code point order.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Keep only the first 3 whitespace-separated words, joined by single spaces.

  5. Convert to lowercase.

  6. Replace every ''n'' with ''e'' (lowercase only).

  7. Swap the case of every letter.

  8. Keep only the first occurrence of each character.

  9. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Keep only the first 4 whitespace-separated words, joined by single spaces.

  12. Convert to uppercase.

  13. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Sort the characters in ascending code point order.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''yzxCyabx'') returns ''3.1f1g1h1i1k''`.


  Return only the code.'
