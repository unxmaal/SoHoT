prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort ascending.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Remove every negative value.

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Keep only the first 3 values (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([16, -12, -7, -9, 0, 16]) returns [0]`.


  Return only the code.'
