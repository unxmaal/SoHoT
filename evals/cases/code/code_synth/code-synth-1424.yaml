prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every ''a'' with ''b'' (lowercase only).

  2. Collapse every run of the same character into one character.

  3. Remove every digit.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Convert to uppercase.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Convert to lowercase.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Sort the characters in ascending code point order.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Convert to uppercase.

  14. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Replace every maximal run of digits with the number of digits in it.

  17. Replace every ''i'' with ''s'' (lowercase only).

  18. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `compute(''aa0xC2A0'') returns ''B''`.


  Return only the code.'
