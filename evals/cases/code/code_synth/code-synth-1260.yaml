prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Keep only the first occurrence of each character.

  4. Replace every ''t'' with ''b'' (lowercase only).

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Sort the characters in ascending code point order.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Convert to lowercase.

  11. Replace every ''l'' with ''a'' (lowercase only).

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Collapse every run of the same character into one character.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Convert to lowercase.

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  Then: Return the resulting string.


  Example: `reduce_data(''y1,,y.bxC'') returns ''a1f1e1b11''`.


  Return only the code.'
