prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its square.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Multiply every value by 5.

  4. Keep only the last 3 values, in their order (all of them if there are fewer).

  5. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Keep only the first 4 values (all of them if there are fewer).

  13. Keep only the values greater than 5.

  14. Replace every value with the largest value seen so far.

  15. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  16. Collapse each run of equal adjacent values into one value.

  17. Replace every value with the largest value seen so far.

  18. Add -1 to every value.

  19. Sort by absolute value, values with equal absolute value keeping their current relative order.

  20. Replace every value with the largest value seen so far.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `compute([-7, 16, -1, 16, 1]) returns -1`.


  Return only the code.'
