  7. Replace every ''i'' with ''l'' (lowercase only).

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Convert to uppercase.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Replace runs of whitespace with a single space and strip both ends.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Convert to lowercase.

  16. Replace every ''b'' with ''c'' (lowercase only).

  17. Sort the characters in ascending code point order.

  18. Replace runs of whitespace with a single space and strip both ends.

  19. Keep only the first occurrence of each character.

  20. Replace every ''e'' with ''n'' (lowercase only).

  Then: Return the resulting string.


