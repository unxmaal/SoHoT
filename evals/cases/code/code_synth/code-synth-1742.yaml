prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Keep only the first occurrence of each character.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  5. Keep only the first occurrence of each character.

  6. Convert to uppercase.

  7. Remove every digit.

  8. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Remove every digit.

  11. Collapse every run of the same character into one character.

  12. Keep only the first occurrence of each character.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Collapse every run of the same character into one character.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Keep only the first occurrence of each character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''.aazCbxBA,zb20'') returns ''MNKL.''`.


  Return only the code.'
