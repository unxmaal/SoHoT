prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Convert to lowercase.

  2. Replace every ''r'' with ''c'' (lowercase only).

  3. Remove every digit.

  4. Keep only the first occurrence of each character.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Replace every ''d'' with ''l'' (lowercase only).

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Replace every ''i'' with ''e'' (lowercase only).

  11. Convert to lowercase.

  12. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Swap the case of every letter.

  14. Remove every vowel (a, e, i, o, u, either case).

  15. Convert to uppercase.

  16. Remove every digit.

  Then: Return the resulting string.


  Example: `compute(''axb  Bay'') returns ''H F''`.


  Return only the code.'
