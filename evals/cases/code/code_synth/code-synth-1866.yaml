  3. Replace every maximal run of digits with the number of digits in it.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Remove every digit.

  6. Swap the case of every letter.

  7. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Convert to uppercase.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Swap the case of every letter.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Remove every digit.

  16. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the resulting string.


  Example: `compute(''z21Abya....'') returns ''stut.''`.


  Return only the code.'
