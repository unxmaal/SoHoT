prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  2. Replace every value with its square.

  3. Reverse the list.

  4. Remove every negative value.

  5. Reverse the list.

  6. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Replace every value with the largest value seen so far.

  10. Clamp every value into the range -3 to 3, both inclusive.

  11. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Remove every negative value.

  15. Replace every value with its square.

  16. Add -1 to every value.

  17. Sort by absolute value, values with equal absolute value keeping their current relative order.

  18. Keep only the last 2 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([5, 2, 21, 19, 6, 6]) returns [8, 15]`.


  Return only the code.'
