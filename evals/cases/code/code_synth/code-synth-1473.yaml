  5. Keep the values at indices 0, 3, 6, and so on.

  6. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  7. Multiply every value by -1.

  8. Clamp every value into the range 0 to 8, both inclusive.

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
