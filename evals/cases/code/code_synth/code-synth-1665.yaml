prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Replace every value with its square.

  5. Add 9 to every value.

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Drop the first 1 values (an empty list if there are fewer).

  10. Remove every negative value.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Keep only the values greater than -3.

  14. Collapse each run of equal adjacent values into one value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `process([23, 7, 6, -12, 0, 16, 8, 24]) returns [23]`.


  Return only the code.'
