prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Keep only the first occurrence of each character.

  4. Convert to lowercase.

  5. Remove every digit.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Remove every digit.

  8. Sort the characters in ascending code point order.

  9. Convert to uppercase.

  10. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  11. Collapse every run of the same character into one character.

  12. Replace every ''l'' with ''d'' (lowercase only).

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''1Ba2cyc1c'') returns ''ABCY.''`.


  Return only the code.'
