  2. Keep only the first 3 whitespace-separated words, joined by single spaces.

  3. Swap the case of every letter.

  4. Replace every ''r'' with ''i'' (lowercase only).

  5. Swap the case of every letter.

  6. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Convert to lowercase.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  11. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Keep only the first occurrence of each character.

  Then: Return how many characters it has.


  Example: `transform(''bBAcb,xzxy'') returns 5`.


  Return only the code.'
