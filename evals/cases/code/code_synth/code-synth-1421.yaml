prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the first 3 values (all of them if there are fewer).

  2. Keep the values at indices 0, 3, 6, and so on.

  3. Replace every value with its square.

  4. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  5. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Remove every negative value.

  8. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  9. Replace every value with its absolute value.

  10. Remove every negative value.

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Keep only the last 3 values, in their order (all of them if there are fewer).

  13. Reverse the list.

  14. Add -5 to every value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([21, -5, -8, 15, -2]) returns 50`.


  Return only the code.'
