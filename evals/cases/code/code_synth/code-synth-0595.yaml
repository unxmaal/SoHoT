prompt: 'Write a Python function `wrap_text(text)` that splits `text` into words on whitespace and packs
  them greedily into lines of at most 23 characters, words separated by one space, never splitting a word
  (a word longer than 23 sits alone on its line). Return the list of lines; no words gives an empty list.


  Example: `wrap_text(''hotel echo india alpha zebra internationalization'') returns [''hotel echo india
