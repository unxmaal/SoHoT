prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the even values.

  2. Sort ascending.

  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Replace every value with the largest value seen so far.

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  9. Replace every value with its square.

  10. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  11. Multiply every value by -2.

  12. Replace every value with the largest value seen so far.

  13. Keep only the last 3 values, in their order (all of them if there are fewer).

  14. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([-12, 8, -2, 3, 2, 3, 11, 13, -8]) returns -18`.


  Return only the code.'
