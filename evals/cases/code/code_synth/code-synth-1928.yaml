  3. Keep only the first 4 whitespace-separated words, joined by single spaces.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Keep only the first occurrence of each character.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Convert to lowercase.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
