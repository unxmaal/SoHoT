prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Swap the case of every letter.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Convert to uppercase.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Replace every ''a'' with ''b'' (lowercase only).

  6. Sort the characters in ascending code point order.

  7. Replace every ''r'' with ''e'' (lowercase only).

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Collapse every run of the same character into one character.

  10. Sort the characters in ascending code point order.

  11. Keep only the first occurrence of each character.

  12. Remove every digit.

  13. Swap the case of every letter.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  17. Replace every maximal run of digits with the number of digits in it.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  19. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  20. Replace every maximal run of digits with the number of digits in it.

  Then: Return the resulting string.


  Example: `process('',  bxxbA xABaCx0'') returns ''1,1b1''`.


  Return only the code.'
