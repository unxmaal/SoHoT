  4. Reverse the list.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Replace every value with its square.

  8. Reverse the list.

  9. Add 4 to every value.

  10. Collapse each run of equal adjacent values into one value.

  11. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  12. Sort descending.

  13. Sort ascending.

  14. Keep the values at indices 0, 3, 6, and so on.

  15. Replace every value with the largest of itself and the up to 2 values before it.

  16. Keep only the last 2 values, in their order (all of them if there are fewer).

  17. Keep only the first 5 values (all of them if there are fewer).

  18. Collapse each run of equal adjacent values into one value.

  Then: Return the resulting list.


  Example: `transform([17, -11, 7]) returns [2]`.


  Return only the code.'
