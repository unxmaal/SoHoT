  2. Sort the characters in ascending code point order.

  3. Keep only the first 2 whitespace-separated words, joined by single spaces.

  4. Convert to uppercase.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Convert to uppercase.

  7. Convert to lowercase.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Swap the case of every letter.

  10. Replace every maximal run of digits with the number of digits in it.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''cAa, C,bcAAac'') returns ''A''`.


  Return only the code.'
