prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Keep only the first occurrence of each character.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Keep only the first occurrence of each character.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Sort the characters in ascending code point order.

  7. Swap the case of every letter.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Collapse every run of the same character into one character.

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''c2cyxzc11'') returns ''12JEFG''`.


  Return only the code.'
