prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every ''a'' with ''n'' (lowercase only).

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Keep only the first 3 whitespace-separated words, joined by single spaces.

  4. Convert to uppercase.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Convert to uppercase.

  7. Replace every ''c'' with ''i'' (lowercase only).

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the resulting string.


  Example: `transform(''0A110 1B1'') returns ''111B11 101A21101''`.


  Return only the code.'
