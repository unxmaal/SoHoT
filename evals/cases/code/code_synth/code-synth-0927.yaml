prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Collapse every run of the same character into one character.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Collapse every run of the same character into one character.

  6. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''1ax b.a.xx0AAz0'') returns ''1c1.1b1.1y1B11''`.


  Return only the code.'
