prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Convert to lowercase.

  4. Keep only the first 3 whitespace-separated words, joined by single spaces.

  5. Remove every digit.

  6. Keep only the first 2 whitespace-separated words, joined by single spaces.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Keep only the first occurrence of each character.

  9. Convert to uppercase.

  10. Remove every digit.

  Then: Return how many characters it has.


  Example: `reduce_data(''.0B 2. ay'') returns 5`.


  Return only the code.'
