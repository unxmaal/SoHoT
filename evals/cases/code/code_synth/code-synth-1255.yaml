prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every negative value.

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Keep only the first 3 values (all of them if there are fewer).

  4. Sort ascending.

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Add 4 to every value.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  10. Reverse the list.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Collapse each run of equal adjacent values into one value.

  13. Keep only the last 3 values, in their order (all of them if there are fewer).

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the largest value, or -1 for an empty list.


  Example: `run_pipeline([1, 7, 12]) returns 8`.


  Return only the code.'
