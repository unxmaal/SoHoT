prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  2. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  3. Replace every value with its square.

  4. Collapse each run of equal adjacent values into one value.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Keep only the even values.

  7. Keep the values at indices 0, 2, 4, and so on.

  8. Sort descending.

  9. Collapse each run of equal adjacent values into one value.

  10. Replace every value with its square.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Remove every negative value.

  13. Replace every value with its square.

  14. Keep only the last 5 values, in their order (all of them if there are fewer).

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  17. Reverse the list.

  18. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([-10, 1, 7, 19, -4, -8, 22]) returns 4`.


  Return only the code.'
