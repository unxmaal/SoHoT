  2. Keep only the last 5 values, in their order (all of them if there are fewer).

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Remove every negative value.

  7. Replace every value with its absolute value.

  8. Sort ascending.

  9. Keep only the even values.

  10. Keep only the last 2 values, in their order (all of them if there are fewer).

  11. Remove every negative value.

  12. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  13. Sort descending.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return how many distinct values there are.


  Example: `run_pipeline([0, -6, -7, 19, 12, -6, 4, 13, -4]) returns 2`.


  Return only the code.'
