  10. Collapse each run of equal adjacent values into one value.

  11. Sort ascending.

  12. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  13. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  14. Keep only the last 3 values, in their order (all of them if there are fewer).

  Then: Return how many distinct values there are.


