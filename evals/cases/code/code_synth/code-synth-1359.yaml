  6. Keep only the even values.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Sort descending.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
