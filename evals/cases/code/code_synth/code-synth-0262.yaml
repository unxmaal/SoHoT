prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Keep only the even values.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Sort descending.

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([2, -7, 23]) returns -1`.


  Return only the code.'
