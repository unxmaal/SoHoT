prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Sort the characters in ascending code point order.

  3. Keep only the first occurrence of each character.

  4. Convert to uppercase.

  5. Replace every ''n'' with ''d'' (lowercase only).

  6. Keep only the first occurrence of each character.

  7. Swap the case of every letter.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Collapse every run of the same character into one character.

  11. Keep only the first occurrence of each character.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Keep only the first 2 whitespace-separated words, joined by single spaces.

  15. Sort the characters in ascending code point order.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Sort the characters in ascending code point order.

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  19. Keep only the first occurrence of each character.

  20. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
