prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Replace every maximal run of digits with the number of digits in it.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Keep only the first 2 whitespace-separated words, joined by single spaces.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Convert to lowercase.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Sort the characters in ascending code point order.

  Then: Return how many characters it has.


  Example: `apply_rules(''xzC .z2.a20aCyA'') returns 28`.


  Return only the code.'
