  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''bCBy0ABy2z,2CB'') returns ''1B1c1b1y101b1y121z1,121c1b''`.


  Return only the code.'
