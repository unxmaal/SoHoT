  3. Keep only the first occurrence of each character.

  4. Replace every ''b'' with ''l'' (lowercase only).

  5. Collapse every run of the same character into one character.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Replace every ''d'' with ''r'' (lowercase only).

  8. Swap the case of every letter.

  9. Convert to uppercase.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Convert to lowercase.

  12. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''b,yy.zcA2,a,'') returns ''1l1,1y1.1z1c1a111a''`.


  Return only the code.'
