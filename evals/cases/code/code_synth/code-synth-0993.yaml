prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''swap'', ''over'', ''drop'', ''add'': swap exchanges
  the top two values; over pushes a copy of the second value from the top; drop removes the top value;
  add pops two values and pushes their sum. An operation that needs more values than the stack has does
  nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''swap'', ''add'', ''add'', 2, -3, 3]) returns [2, -3, 3]`.


  Return only the code.'
