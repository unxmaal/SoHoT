prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Keep only the values greater than 2.

  3. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Multiply every value by -1.

  6. Add -1 to every value.

  7. Collapse each run of equal adjacent values into one value.

  8. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  9. Collapse each run of equal adjacent values into one value.

  10. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  11. Replace every value with the largest value seen so far.

  12. Reverse the list.

  13. Replace every value with its absolute value.

  14. Reverse the list.

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Remove every negative value.

  17. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  18. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  19. Keep the values at indices 0, 3, 6, and so on.

  20. Reverse the list.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `run_pipeline([14, -1, -10, 14]) returns 2`.


  Return only the code.'
