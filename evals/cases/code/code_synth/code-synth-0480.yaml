  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Add 9 to every value.

  4. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Add -1 to every value.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Replace every value with its square.

  12. Reverse the list.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([12, -6, -10, 17, 2, 20, -12, 15, -5]) returns 12314`.


  Return only the code.'
