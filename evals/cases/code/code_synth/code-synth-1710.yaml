prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Convert to uppercase.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Remove every digit.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Replace every ''l'' with ''d'' (lowercase only).

  9. Keep only the first occurrence of each character.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Keep only the first occurrence of each character.

  12. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Remove every digit.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Convert to uppercase.

  16. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''AABc1C0.y,x'') returns ''I,J.N''`.


  Return only the code.'
