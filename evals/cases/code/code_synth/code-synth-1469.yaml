prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Multiply every value by -2.

  3. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Replace every value with its absolute value.

  7. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  10. Remove every negative value.

  11. Add 9 to every value.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Keep only the first 6 values (all of them if there are fewer).

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `transform([15, -10, -9, -3, 6]) returns 13`.


  Return only the code.'
