  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Replace every ''s'' with ''r'' (lowercase only).

  3. Collapse every run of the same character into one character.

  4. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Convert to lowercase.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''21,BacC22 ,c'') returns '',12ghfh''`.


  Return only the code.'
