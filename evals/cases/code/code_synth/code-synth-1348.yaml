prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Remove every digit.

  4. Sort the characters in ascending code point order.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Swap the case of every letter.

  7. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Replace every ''n'' with ''l'' (lowercase only).

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Remove every digit.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Swap the case of every letter.

  13. Remove every digit.

  14. Convert to lowercase.

  15. Sort the characters in ascending code point order.

  16. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `reduce_data('',yzA2bba yy21'') returns '',bcd''`.


  Return only the code.'
