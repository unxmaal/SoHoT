prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to lowercase.

  2. Sort the characters in ascending code point order.

  3. Keep only the first occurrence of each character.

  4. Swap the case of every letter.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Keep only the first 4 whitespace-separated words, joined by single spaces.

  9. Remove every digit.

  10. Convert to lowercase.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Swap the case of every letter.

  Then: Return how many characters it has.


  Example: `apply_rules(''C0bzb0AaBxyx c'') returns 5`.


  Return only the code.'
