prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every ''d'' with ''o'' (lowercase only).

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Keep only the first occurrence of each character.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Convert to lowercase.

  9. Collapse every run of the same character into one character.

  10. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Sort the characters in ascending code point order.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Replace every ''r'' with ''t'' (lowercase only).

  14. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Remove every digit.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `process(''B.B1Ayc0yyB1y'') returns ''.''`.


  Return only the code.'
