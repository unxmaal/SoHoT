prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 2 values before it.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace every value with the largest value seen so far.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Replace every value with the largest of itself and the up to 2 values before it.

  6. Sort ascending.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Add -3 to every value.

  9. Reverse the list.

  10. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  11. Replace every value with its square.

  12. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  13. Replace every value with its absolute value.

  14. Sort ascending.

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([6, 15, 17, -5, 11, 0, 9, -2, 17]) returns 18818`.


  Return only the code.'
