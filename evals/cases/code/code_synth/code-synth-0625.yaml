prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to lowercase.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Remove every digit.

  4. Sort the characters in ascending code point order.

  5. Collapse every run of the same character into one character.

  6. Convert to uppercase.

  7. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Convert to lowercase.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Convert to uppercase.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''C0C,y 0C11bz'') returns '',''`.


  Return only the code.'
