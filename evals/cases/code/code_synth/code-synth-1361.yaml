prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  2. Replace every value with the largest of itself and the up to 1 values before it.

  3. Reverse the list.

  4. Remove every negative value.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Keep only the values greater than 0.

  7. Replace every value with its absolute value.

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Clamp every value into the range -2 to 1, both inclusive.

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Keep only the values greater than -3.

  13. Reverse the list.

  14. Remove every negative value.

  15. Sort descending.

  16. Keep only the last 4 values, in their order (all of them if there are fewer).

  17. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  18. Multiply every value by -2.

  Then: Return the resulting list.


  Example: `compute([8, 14, -12, -11, -6]) returns [-2, -4]`.


  Return only the code.'
