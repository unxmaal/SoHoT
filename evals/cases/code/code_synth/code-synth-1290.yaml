prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Convert to uppercase.

  3. Remove every digit.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Swap the case of every letter.

  6. Sort the characters in ascending code point order.

  7. Remove every digit.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  10. Sort the characters in ascending code point order.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Sort the characters in ascending code point order.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  15. Remove every digit.

  16. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  17. Reverse the order of the whitespace-separated words and join them with single spaces.

  18. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  19. Collapse every run of the same character into one character.

  20. Convert to uppercase.

  Then: Return the resulting string.


  Example: `process(''Bxx B12x0bxa 2'') returns ''XT.''`.


  Return only the code.'
