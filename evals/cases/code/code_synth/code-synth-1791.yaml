prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Keep only the values greater than 3.

  3. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Reverse the list.

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Add -3 to every value.

  10. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  11. Reverse the list.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Sort descending.

  14. Collapse each run of equal adjacent values into one value.

  Then: Return the resulting list.


  Example: `process([25, -1, -8, -8, 20, 3, -4]) returns [3, -1, -2, -3]`.


  Return only the code.'
