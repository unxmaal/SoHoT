prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Convert to uppercase.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Replace every maximal run of digits with the number of digits in it.

  8. Swap the case of every letter.

  9. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  10. Replace every ''i'' with ''e'' (lowercase only).

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Keep only the first occurrence of each character.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  17. Remove every digit.

  18. Convert to lowercase.

  Then: Return the resulting string.


  Example: `process(''CxxCbAy z0b'') returns ''ge''`.


  Return only the code.'
