prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''sub'', ''add'', ''swap'': dup copies
  the top value onto the stack; sub pops b then a and pushes a - b, so the value pushed first is a; add
  pops two values and pushes their sum; swap exchanges the top two values. An operation that needs more
  values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''dup'', 5, 7, ''swap'', ''add'', ''dup'', ''swap'', ''swap'', ''dup'']) returns
  [12, 12, 12]`.


  Return only the code.'
