prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the last 4 values, in their order (all of them if there are fewer).

  2. Reverse the list.

  3. Keep only the first 3 values (all of them if there are fewer).

  4. Clamp every value into the range -2 to 6, both inclusive.

  5. Multiply every value by -1.

  6. Replace every value with its square.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Collapse each run of equal adjacent values into one value.

  9. Remove every negative value.

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Keep only the even values.

  12. Reverse the list.

  13. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  15. Replace every value with its square.

  16. Keep only the first 5 values (all of them if there are fewer).

  17. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  18. Reverse the list.

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([0, -8, 10, 3, -9, 7, 10, 24, 7]) returns 144`.


  Return only the code.'
