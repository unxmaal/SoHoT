  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  5. Collapse every run of the same character into one character.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Remove every digit.

  8. Keep only the first occurrence of each character.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Keep only the first 4 whitespace-separated words, joined by single spaces.

  11. Convert to uppercase.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the resulting string.


