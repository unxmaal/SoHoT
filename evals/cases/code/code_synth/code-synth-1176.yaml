prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every digit.

  2. Replace every ''a'' with ''b'' (lowercase only).

  3. Swap the case of every letter.

  4. Collapse every run of the same character into one character.

  5. Convert to uppercase.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Convert to uppercase.

  8. Swap the case of every letter.

  9. Sort the characters in ascending code point order.

  10. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Swap the case of every letter.

  14. Replace every ''l'' with ''r'' (lowercase only).

  15. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  16. Convert to lowercase.

  17. Swap the case of every letter.

  18. Sort the characters in ascending code point order.

  19. Remove every digit.

  20. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the resulting string.


  Example: `run_pipeline(''zAB0 2xABb2'') returns ''K''`.


  Return only the code.'
