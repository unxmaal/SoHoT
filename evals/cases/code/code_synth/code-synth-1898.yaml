  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Sort the characters in ascending code point order.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Swap the case of every letter.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Keep only the first occurrence of each character.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the resulting string.


  Example: `process('' z0Cb2Cb0,xya '') returns ''LKJO2,''`.


