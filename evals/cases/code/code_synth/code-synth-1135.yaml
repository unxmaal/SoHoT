  13. Replace every value with its absolute value.

  14. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `process([12, 14, -9, 4, 15, 2]) returns 5`.


