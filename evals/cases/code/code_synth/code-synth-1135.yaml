  6. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  7. Reverse the list.

  8. Replace every value with its absolute value.

  9. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
