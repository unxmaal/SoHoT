  12. Replace every maximal run of digits with the number of digits in it.

  13. Remove every digit.

  14. Remove every vowel (a, e, i, o, u, either case).

  15. Convert to uppercase.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
