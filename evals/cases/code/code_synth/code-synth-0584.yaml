prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Convert to uppercase.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Swap the case of every letter.

  5. Replace every ''c'' with ''o'' (lowercase only).

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Convert to lowercase.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''acAAa.xa Ba1'') returns ''x1o1a1''`.


  Return only the code.'
