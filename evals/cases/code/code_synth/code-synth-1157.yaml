prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  2. Replace every value with its square.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Multiply every value by 3.

  5. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  6. Remove every negative value.

  7. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  10. Sort descending.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Keep only the first 4 values (all of them if there are fewer).

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Remove every negative value.

  15. Collapse each run of equal adjacent values into one value.

  16. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  17. Add -9 to every value.

  18. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  19. Multiply every value by -2.

  20. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return the resulting list.


  Example: `compute([5, 11, 21, 18, -6, -7]) returns [-4650, -11400]`.


  Return only the code.'
