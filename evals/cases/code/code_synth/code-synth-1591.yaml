prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Remove every negative value.

  6. Replace every value with the largest value seen so far.

  7. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  8. Drop the first 1 values (an empty list if there are fewer).

  9. Clamp every value into the range 1 to 6, both inclusive.

  10. Replace every value with the largest of itself and the up to 3 values before it.

  11. Keep the values at indices 0, 2, 4, and so on.

  12. Remove every negative value.

  13. Replace every value with its absolute value.

  14. Multiply every value by -2.

  15. Replace every value with its square.

  16. Multiply every value by 5.

  17. Replace every value with the largest value seen so far.

  18. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the resulting list.


  Example: `reduce_data([25, 1, 25, 7, 21, 8, -12, 11, 13]) returns [720, 720, 720]`.


  Return only the code.'
