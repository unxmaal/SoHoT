  3. Replace every ''d'' with ''i'' (lowercase only).

  4. Swap the case of every letter.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Swap the case of every letter.

  7. Convert to uppercase.

  8. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Convert to uppercase.

  10. Convert to lowercase.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Replace every ''s'' with ''e'' (lowercase only).

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Keep only the first 2 whitespace-separated words, joined by single spaces.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Remove every digit.

  17. Convert to uppercase.

  18. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  19. Replace every maximal run of digits with the number of digits in it.

  20. Swap the case of every letter.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
