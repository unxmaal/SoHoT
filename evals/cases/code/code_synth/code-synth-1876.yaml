prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Collapse every run of the same character into one character.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  7. Replace every ''b'' with ''e'' (lowercase only).

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Convert to uppercase.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  15. Swap the case of every letter.

  16. Sort the characters in ascending code point order.

  17. Remove every vowel (a, e, i, o, u, either case).

  18. Replace every ''a'' with ''e'' (lowercase only).

  19. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  20. Replace every ''d'' with ''n'' (lowercase only).

  Then: Return the resulting string.


  Example: `apply_rules(''2zAbb y12zxb221'') returns ''61''`.


  Return only the code.'
