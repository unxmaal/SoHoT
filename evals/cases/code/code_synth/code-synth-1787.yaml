prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  2. Multiply every value by -1.

  3. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  4. Reverse the list.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Replace every value with its absolute value.

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  9. Keep only the first 5 values (all of them if there are fewer).

  10. Replace every value with the largest of itself and the up to 1 values before it.

  11. Keep only the first 5 values (all of them if there are fewer).

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Replace every value with its square.

  14. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([3, -5, 6, 4, -12, 7, 21, -11]) returns 784`.


  Return only the code.'
