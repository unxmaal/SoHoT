  3. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  4. Replace every value with its absolute value.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  8. Sort descending.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Sort ascending.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Sort descending.

  13. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  14. Multiply every value by -1.

  Then: Return the largest value, or -1 for an empty list.


  Example: `run_pipeline([21, -10, 25, 12, 13, 22, 3]) returns 0`.


  Return only the code.'
