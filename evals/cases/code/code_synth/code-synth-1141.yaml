prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Keep only the values greater than -1.

  3. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  4. Multiply every value by -1.

  5. Keep the values at indices 0, 3, 6, and so on.

  6. Reverse the list.

  7. Keep only the first 4 values (all of them if there are fewer).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Reverse the list.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Keep the values at indices 0, 2, 4, and so on.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Sort ascending.

  14. Keep only the even values.

  15. Keep only the last 4 values, in their order (all of them if there are fewer).

  16. Reverse the list.

  Then: Return the largest value, or -1 for an empty list.


  Example: `run_pipeline([13, 7, 19, 23, 16, 9, -5]) returns -1`.


  Return only the code.'
