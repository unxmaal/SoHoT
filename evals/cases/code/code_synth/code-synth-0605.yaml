prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to lowercase.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Sort the characters in ascending code point order.

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Keep only the first occurrence of each character.

  7. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  Then: Return the resulting string.


  Example: `apply_rules(''a xy,a bcB,aA'') returns ''1,1i1j1e''`.


  Return only the code.'
