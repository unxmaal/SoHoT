  values and pushes their sum; over pushes a copy of the second value from the top. An operation that
  needs more values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''over'', ''swap'', ''add'', ''add'', ''sub'', -1]) returns [-1]`.


