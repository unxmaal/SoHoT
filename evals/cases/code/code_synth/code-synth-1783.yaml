  4. Reverse the list.

  5. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  6. Replace every value with its absolute value.

  7. Keep the values at indices 0, 2, 4, and so on.

  8. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Remove every negative value.

  11. Multiply every value by -2.

