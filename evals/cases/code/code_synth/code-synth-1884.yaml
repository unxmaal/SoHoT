  other characters are unchanged.

  3. Convert to lowercase.

  4. Collapse every run of the same character into one character.

  5. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Keep only the first 2 whitespace-separated words, joined by single spaces.

  8. Convert to lowercase.

  9. Collapse every run of the same character into one character.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Swap the case of every letter.

  12. Convert to lowercase.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''yy2,c01b0 zc'') returns ''0''`.


  Return only the code.'
