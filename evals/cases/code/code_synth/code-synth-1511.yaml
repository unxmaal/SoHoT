  10. Replace every value with the largest of itself and the up to 2 values before it.

  11. Keep the values at indices 0, 3, 6, and so on.

  12. Keep only the last 3 values, in their order (all of them if there are fewer).

  13. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  14. Sort ascending.

