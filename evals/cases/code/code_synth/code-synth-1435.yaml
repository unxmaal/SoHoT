prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Sort ascending.

  2. Clamp every value into the range -1 to 6, both inclusive.

  3. Keep only the values greater than 0.

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  6. Add 6 to every value.

  7. Sort descending.

  8. Replace every value with the largest of itself and the up to 2 values before it.

  9. Multiply every value by -1.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Replace every value with the largest of itself and the up to 3 values before it.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  14. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Sort descending.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([17, 19, -4, 3, 23, 19]) returns [-9, -6]`.


  Return only the code.'
