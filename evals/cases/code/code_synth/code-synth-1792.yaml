  3. Collapse every run of the same character into one character.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Convert to uppercase.

  6. Collapse every run of the same character into one character.

  7. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Sort the characters in ascending code point order.

  12. Replace runs of whitespace with a single space and strip both ends.

  13. Convert to uppercase.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Convert to lowercase.

  16. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''2cABxC2A'') returns ''3.211b2c1x''`.


  Return only the code.'
