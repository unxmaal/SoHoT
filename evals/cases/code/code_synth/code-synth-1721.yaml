prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Drop the first 2 values (an empty list if there are fewer).

  2. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  3. Keep only the even values.

  4. Collapse each run of equal adjacent values into one value.

  5. Replace every value with the largest of itself and the up to 1 values before it.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Keep only the even values.

  8. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  9. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  10. Remove every negative value.

  11. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  12. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  13. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  14. Add -3 to every value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `process([11, 13, -7, -4]) returns [-2]`.


  Return only the code.'
