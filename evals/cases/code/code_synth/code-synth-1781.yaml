prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Keep the values at indices 0, 2, 4, and so on.

  4. Multiply every value by -1.

  5. Reverse the list.

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Replace every value with its square.

  8. Keep only the last 3 values, in their order (all of them if there are fewer).

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace every value with the largest of itself and the up to 2 values before it.

  11. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  12. Collapse each run of equal adjacent values into one value.

  13. Reverse the list.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([-6, 16, 0, -8, -9]) returns 0`.


  Return only the code.'
