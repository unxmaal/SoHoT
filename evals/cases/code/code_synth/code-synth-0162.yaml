prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Reverse the list.

  2. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  3. Collapse each run of equal adjacent values into one value.

  4. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Sort ascending.

  7. Sort descending.

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `process([-4, 7, 2, 8]) returns 0`.


  Return only the code.'
