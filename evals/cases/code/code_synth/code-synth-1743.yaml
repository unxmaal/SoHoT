prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the first 5 values (all of them if there are fewer).

  2. Collapse each run of equal adjacent values into one value.

  3. Replace every value with its square.

  4. Drop the first 2 values (an empty list if there are fewer).

  5. Reverse the list.

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace every value with the largest value seen so far.

  8. Replace every value with the largest of itself and the up to 1 values before it.

  9. Replace every value with the largest value seen so far.

  10. Keep only the last 5 values, in their order (all of them if there are fewer).

  11. Remove every negative value.

  12. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  13. Replace every value with its absolute value.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([-4, 17, 5, 1, -7, -2]) returns 5`.


  Return only the code.'
