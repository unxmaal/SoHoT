prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Collapse every run of the same character into one character.

  4. Replace every ''n'' with ''d'' (lowercase only).

  5. Replace every maximal run of digits with the number of digits in it.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Sort the characters in ascending code point order.

  8. Remove every digit.

  9. Convert to lowercase.

  10. Convert to uppercase.

  11. Sort the characters in ascending code point order.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''1c,.yyb2bz1'') returns '',.GHJJK''`.


  Return only the code.'
