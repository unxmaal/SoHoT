prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Swap the case of every letter.

  2. Keep only the first occurrence of each character.

  3. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Convert to lowercase.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Sort the characters in ascending code point order.

  7. Keep only the first occurrence of each character.

  8. Convert to lowercase.

  9. Remove every digit.

  10. Replace every ''t'' with ''c'' (lowercase only).

  11. Keep only the first 4 whitespace-separated words, joined by single spaces.

  12. Swap the case of every letter.

  13. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Keep only the first occurrence of each character.

  15. Keep only the first 3 whitespace-separated words, joined by single spaces.

  16. Collapse every run of the same character into one character.

  17. Keep only the first 2 whitespace-separated words, joined by single spaces.

  18. Convert to uppercase.

  Then: Return the resulting string.


  Example: `process(''Bzz0xxcBc210 '') returns ''NLOJ''`.


  Return only the code.'
