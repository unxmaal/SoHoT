prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Collapse every run of the same character into one character.

  3. Swap the case of every letter.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Remove every digit.

  6. Keep only the first occurrence of each character.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Swap the case of every letter.

  10. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Convert to uppercase.

  12. Replace runs of whitespace with a single space and strip both ends.

  13. Keep only the first occurrence of each character.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Remove every digit.

  16. Keep only the first occurrence of each character.

  17. Convert to lowercase.

  18. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  19. Swap the case of every letter.

  20. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return how many characters it has.


  Example: `run_pipeline(''BC2Bybc0z12z0y0'') returns 4`.


  Return only the code.'
