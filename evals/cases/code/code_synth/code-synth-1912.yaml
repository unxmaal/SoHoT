prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Keep only the first 2 whitespace-separated words, joined by single spaces.

  5. Convert to lowercase.

  6. Convert to uppercase.

  7. Replace every ''d'' with ''i'' (lowercase only).

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Collapse every run of the same character into one character.

  12. Convert to lowercase.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Remove every digit.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Swap the case of every letter.

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Remove every digit.

  19. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  20. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''CC111AxBCAcB CB'') returns ''1C1A1x''`.


  Return only the code.'
