  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Swap the case of every letter.

  6. Sort the characters in ascending code point order.

  7. Remove every digit.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Sort the characters in ascending code point order.

  10. Swap the case of every letter.

  11. Replace every ''i'' with ''t'' (lowercase only).

  12. Remove every digit.

  13. Swap the case of every letter.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return how many characters it has.


  Example: `transform('' bBcbx0z'') returns 6`.


  Return only the code.'
