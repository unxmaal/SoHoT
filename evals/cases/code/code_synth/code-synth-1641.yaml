prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Multiply every value by 3.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Keep only the values greater than 6.

  6. Replace every value with the largest of itself and the up to 3 values before it.

  7. Clamp every value into the range -3 to 4, both inclusive.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Collapse each run of equal adjacent values into one value.

  11. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  12. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Sort descending.

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Sort by absolute value, values with equal absolute value keeping their current relative order.

  17. Add 9 to every value.

  18. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  19. Replace every value with its square.

  20. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the sum of the values (0 for an empty list).


  Example: `solve([1, -11, -10, 11, 21, 2, -2, 1, -8]) returns 641`.


  Return only the code.'
