prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  4. Replace every value with the largest of itself and the up to 1 values before it.

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Keep only the first 3 values (all of them if there are fewer).

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Keep only the even values.

  9. Replace every value with the largest value seen so far.

  10. Keep only the first 3 values (all of them if there are fewer).

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Reverse the list.

  14. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  15. Remove every negative value.

  16. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return how many distinct values there are.


  Example: `compute([4, 23, 10, 7, 24]) returns 0`.


  Return only the code.'
