prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Keep only the values greater than 8.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Keep only the last 2 values, in their order (all of them if there are fewer).

  4. Keep only the even values.

  5. Keep the values at indices 0, 3, 6, and so on.

  6. Keep only the even values.

  7. Replace every value with the largest of itself and the up to 2 values before it.

  8. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Keep only the values greater than 2.

  11. Remove every negative value.

  12. Sort ascending.

  13. Reverse the list.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([11, 5, 17, -11, 19, 0, 6]) returns 14`.


  Return only the code.'
