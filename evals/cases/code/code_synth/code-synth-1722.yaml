prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Convert to lowercase.

  3. Keep only the first occurrence of each character.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Remove every digit.

  7. Replace every ''l'' with ''c'' (lowercase only).

  8. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  9. Remove every digit.

  10. Convert to lowercase.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Convert to lowercase.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Remove every vowel (a, e, i, o, u, either case).

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  19. Reverse the order of the whitespace-separated words and join them with single spaces.

  20. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `run_pipeline(''12xzzCy.'') returns ''.2Y1C1Z1X1''`.


  Return only the code.'
