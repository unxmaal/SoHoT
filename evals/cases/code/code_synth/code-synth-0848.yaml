prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Keep only the first occurrence of each character.

  4. Keep only the first 3 whitespace-separated words, joined by single spaces.

  5. Convert to uppercase.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `transform(''Azc1bBCBy1.C '') returns ''B''`.


  Return only the code.'
