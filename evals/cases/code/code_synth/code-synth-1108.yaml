  3. Replace runs of whitespace with a single space and strip both ends.

  4. Convert to uppercase.

  5. Replace every ''n'' with ''t'' (lowercase only).

  6. Convert to lowercase.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Sort the characters in ascending code point order.

  10. Replace every ''s'' with ''c'' (lowercase only).

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Keep only the first occurrence of each character.

  13. Remove every digit.

  14. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the resulting string.


  Example: `run_pipeline(''A y1Czyx0C yz'') returns ''acxyz''`.


  Return only the code.'
