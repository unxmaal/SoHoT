prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace every value with its square.

  4. Reverse the list.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  8. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `solve([5, 8, 15]) returns 0`.


  Return only the code.'
