prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Keep only the first 2 whitespace-separated words, joined by single spaces.

  4. Replace every ''o'' with ''t'' (lowercase only).

  5. Collapse every run of the same character into one character.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Remove every digit.

  8. Swap the case of every letter.

  Then: Return how many characters it has.


  Example: `apply_rules(''x,.c,x02a.y1,z'') returns 7`.


  Return only the code.'
