prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 1 values before it.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  5. Collapse each run of equal adjacent values into one value.

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Replace every value with its absolute value.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Add 9 to every value.

  10. Replace every value with its square.

  11. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  12. Reverse the list.

  13. Keep only the first 6 values (all of them if there are fewer).

  14. Replace every value with its square.

  Then: Return how many distinct values there are.


  Example: `apply_rules([12, -5, -3, 3, 0, 5, 15, 16, 6]) returns 2`.


  Return only the code.'
