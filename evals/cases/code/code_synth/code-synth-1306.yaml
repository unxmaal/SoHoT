  3. Collapse every run of the same character into one character.

  4. Sort the characters in ascending code point order.

  5. Keep only the first occurrence of each character.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Collapse every run of the same character into one character.

  13. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  14. Convert to uppercase.

  Then: Return the resulting string.


  Example: `process('' 0a B0B,'') returns '',1B..''`.


  Return only the code.'
