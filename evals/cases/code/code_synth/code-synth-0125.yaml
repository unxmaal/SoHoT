prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the order of the whitespace-separated words and join them with single spaces.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Swap the case of every letter.

  7. Keep only the first 2 whitespace-separated words, joined by single spaces.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  11. Convert to lowercase.

  12. Keep only the first occurrence of each character.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''C2 cAB  bA,Ba'') returns '',''`.


  Return only the code.'
