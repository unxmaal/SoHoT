  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Sort descending.

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Replace every value with its square.

  8. Sort descending.

  9. Multiply every value by -1.

  10. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  11. Remove every negative value.

  12. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  13. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  14. Keep the values at indices 0, 3, 6, and so on.

  15. Keep only the first 5 values (all of them if there are fewer).

  16. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the resulting list.


  Example: `run_pipeline([19, 16, 9, 6, -8, 18]) returns [3]`.


  Return only the code.'
