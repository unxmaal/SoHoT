prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Replace every value with its absolute value.

  5. Replace every value with its square.

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Keep only the values greater than -1.

  8. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  9. Add -1 to every value.

  10. Replace every value with its absolute value.

  11. Reverse the list.

  12. Keep only the last 4 values, in their order (all of them if there are fewer).

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Remove duplicates, keeping the first occurrence of each value.

  15. Keep only the even values.

  16. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  17. Keep the values at indices 0, 2, 4, and so on.

  18. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([20, -5, 10, 0]) returns 124`.


  Return only the code.'
