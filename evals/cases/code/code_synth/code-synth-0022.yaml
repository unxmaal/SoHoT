  2. Keep only the first 2 values (all of them if there are fewer).

  3. Clamp every value into the range -1 to 5, both inclusive.

  4. Sort ascending.

  5. Collapse each run of equal adjacent values into one value.

  6. Replace every value with the largest value seen so far.

  7. Clamp every value into the range 1 to 8, both inclusive.

  8. Keep only the first 4 values (all of them if there are fewer).

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([22, 3, -3, -9]) returns 5`.


  Return only the code.'
