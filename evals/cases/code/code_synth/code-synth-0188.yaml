  1. Keep only the first occurrence of each character.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Replace every ''d'' with ''b'' (lowercase only).

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Convert to lowercase.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Keep only the first occurrence of each character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''xAyxy., '') returns ''1xay.,''`.


  Return only the code.'
