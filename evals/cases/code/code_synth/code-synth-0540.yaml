  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Reverse the list.

  4. Replace every value with its absolute value.

  5. Keep only the values greater than 2.

  6. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  7. Keep only the even values.

  8. Sort descending.

  9. Clamp every value into the range -4 to 5, both inclusive.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Keep only the first 3 values (all of them if there are fewer).

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([-1, -1, 6, -3, 2, 18]) returns 2`.


  Return only the code.'
