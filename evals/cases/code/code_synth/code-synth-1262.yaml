  7. Replace runs of whitespace with a single space and strip both ends.

  8. Swap the case of every letter.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  13. Swap the case of every letter.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Keep only the first 4 whitespace-separated words, joined by single spaces.

  16. Remove every digit.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
