  the words with single spaces.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Keep only the first occurrence of each character.

  6. Remove every digit.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  9. Swap the case of every letter.

  10. Sort the characters in ascending code point order.

  11. Remove every digit.

  12. Swap the case of every letter.

  13. Replace every ''l'' with ''d'' (lowercase only).

  14. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  15. Convert to lowercase.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  17. Swap the case of every letter.

  18. Replace every ''o'' with ''t'' (lowercase only).

  Then: Return the resulting string.


  Example: `apply_rules(''C.x20x1yBz,0xB 0'') returns ''1,2.1C1X1Y1Z1B1.''`.


  Return only the code.'
