  0 to i).

  4. Replace every value with its absolute value.

  5. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  6. Keep only the last 3 values, in their order (all of them if there are fewer).

  7. Collapse each run of equal adjacent values into one value.

  8. Keep only the last 5 values, in their order (all of them if there are fewer).

  9. Keep only the even values.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Keep the values at indices 0, 3, 6, and so on.

  12. Reverse the list.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  15. Multiply every value by -1.

  16. Keep only the first 4 values (all of them if there are fewer).

  17. Sort by absolute value, values with equal absolute value keeping their current relative order.

  18. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  19. Keep only the first 2 values (all of them if there are fewer).

  20. Replace every value with its absolute value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([-12, -11, 2, 17, 10, 14]) returns 4`.


  Return only the code.'
