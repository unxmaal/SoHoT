prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Keep only the values greater than -2.

  5. Add -9 to every value.

  6. Sort ascending.

  7. Sort descending.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Add 6 to every value.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Multiply every value by 2.

  12. Add 2 to every value.

  13. Keep only the first 4 values (all of them if there are fewer).

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the sum of the values (0 for an empty list).


  Example: `transform([6, -7, 24, 12, -8, 11, 18, 23]) returns 372`.


  Return only the code.'
