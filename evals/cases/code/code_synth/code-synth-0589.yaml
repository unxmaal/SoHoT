  1. Convert to uppercase.

  2. Remove every digit.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Sort the characters in ascending code point order.

  5. Keep only the first occurrence of each character.

  6. Replace every ''e'' with ''l'' (lowercase only).

  7. Replace every maximal run of digits with the number of digits in it.

  8. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `apply_rules(''Bc1C0b .,'') returns '' ,.BC''`.


  Return only the code.'
