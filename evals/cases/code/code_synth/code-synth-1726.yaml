prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  2. Keep only the first 4 whitespace-separated words, joined by single spaces.

  3. Swap the case of every letter.

  4. Keep only the first occurrence of each character.

  5. Sort the characters in ascending code point order.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Swap the case of every letter.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Convert to uppercase.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Remove every digit.

  12. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Keep only the first occurrence of each character.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Replace every ''e'' with ''d'' (lowercase only).

  16. Reverse the order of the whitespace-separated words and join them with single spaces.

  17. Convert to lowercase.

  18. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the resulting string.


  Example: `process(''c xA A20Bcyxayza'') returns ''mlin''`.


  Return only the code.'
