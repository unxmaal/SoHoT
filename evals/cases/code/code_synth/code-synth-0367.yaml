prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Keep only the first 2 whitespace-separated words, joined by single spaces.

  3. Collapse every run of the same character into one character.

  4. Sort the characters in ascending code point order.

  5. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''1A0zAA1zc.z '') returns ''.10ffheee''`.


  Return only the code.'
