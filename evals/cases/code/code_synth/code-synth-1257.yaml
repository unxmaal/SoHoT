prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Reverse the list.

  3. Keep only the values greater than 1.

  4. Collapse each run of equal adjacent values into one value.

  5. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  6. Remove every negative value.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Sort descending.

  9. Keep only the first 3 values (all of them if there are fewer).

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Reverse the list.

  12. Replace every value with its square.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  15. Drop the first 1 values (an empty list if there are fewer).

  16. Sort by absolute value, values with equal absolute value keeping their current relative order.

  17. Remove duplicates, keeping the first occurrence of each value.

  18. Replace every value with the largest of itself and the up to 3 values before it.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `run_pipeline([-3, 15, -7, -10, 6, 20]) returns 56`.


  Return only the code.'
