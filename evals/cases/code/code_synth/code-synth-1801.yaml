prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  2. Replace every value with the largest of itself and the up to 1 values before it.

  3. Keep only the first 2 values (all of them if there are fewer).

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Multiply every value by 3.

  6. Drop the first 1 values (an empty list if there are fewer).

  7. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Keep only the even values.

  10. Sort ascending.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Replace every value with the largest of itself and the up to 3 values before it.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Keep only the even values.

  15. Keep only the last 2 values, in their order (all of them if there are fewer).

  16. Keep only the first 4 values (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([18, 9, -2, 1, 17, 16]) returns []`.


  Return only the code.'
