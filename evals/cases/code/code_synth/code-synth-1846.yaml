  4. Keep only the first 4 whitespace-separated words, joined by single spaces.

  5. Convert to uppercase.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Replace every ''l'' with ''i'' (lowercase only).

  9. Keep only the first 3 whitespace-separated words, joined by single spaces.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Convert to lowercase.

  12. Sort the characters in ascending code point order.

  13. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  14. Convert to uppercase.

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''.cCAaB2.czx. B'') returns ''...2GHH''`.


  Return only the code.'
