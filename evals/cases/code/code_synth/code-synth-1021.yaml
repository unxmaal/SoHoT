prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Keep only the first 2 whitespace-separated words, joined by single spaces.

  3. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Remove every digit.

  6. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Sort the characters in ascending code point order.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  11. Replace every maximal run of digits with the number of digits in it.

  12. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''y0a,,C c,,acx 0z'') returns '',,Uqs''`.


  Return only the code.'
