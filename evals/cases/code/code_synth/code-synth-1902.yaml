prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Collapse every run of the same character into one character.

  3. Sort the characters in ascending code point order.

  4. Swap the case of every letter.

  5. Replace every ''e'' with ''l'' (lowercase only).

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Remove every digit.

  8. Replace every ''t'' with ''s'' (lowercase only).

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `run_pipeline(''c.A,BcBab.C'') returns '',1.1a1b1c1A1B1C1''`.


  Return only the code.'
