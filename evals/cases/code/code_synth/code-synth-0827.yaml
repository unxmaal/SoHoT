  1. Remove every vowel (a, e, i, o, u, either case).

  2. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return how many characters it has.


  Example: `run_pipeline('',yc,y0.cy'') returns 9`.


  Return only the code.'
