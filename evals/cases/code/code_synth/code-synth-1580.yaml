prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Swap the case of every letter.

  4. Replace every ''a'' with ''n'' (lowercase only).

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Remove every digit.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Sort the characters in ascending code point order.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Replace every ''o'' with ''t'' (lowercase only).

  12. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Sort the characters in ascending code point order.

  Then: Return how many characters it has.


  Example: `run_pipeline(''b1axzz1Cyy'') returns 12`.


  Return only the code.'
