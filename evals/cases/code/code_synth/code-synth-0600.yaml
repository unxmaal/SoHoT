  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  4. Keep only the even values.

  5. Replace every value with its square.

  6. Keep only the last 3 values, in their order (all of them if there are fewer).

  7. Add 4 to every value.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Reverse the list.

  10. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  Then: Return the sum of the values (0 for an empty list).


  Example: `solve([6, -8, 9, -8]) returns 8`.


  Return only the code.'
