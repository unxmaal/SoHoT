  1. Replace every value with its absolute value.

  2. Keep only the even values.

  3. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  4. Replace every value with its absolute value.

  5. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  6. Sort ascending.

  7. Replace every value with its square.

  8. Remove every negative value.

  9. Replace every value with the largest value seen so far.

  10. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  11. Keep only the values greater than -3.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Replace every value with its square.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `reduce_data([22, -7, 22]) returns -1`.


  Return only the code.'
