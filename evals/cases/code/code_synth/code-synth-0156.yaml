prompt: 'Write a Python function `wrap_text(text)` that splits `text` into words on whitespace and packs
  them greedily into lines of at most 11 characters, words separated by one space, never splitting a word
  (a word longer than 11 sits alone on its line). Return the list of lines; no words gives an empty list.


  Example: `wrap_text(''lima internationalization internationalization charlie lima echo bravo echo bravo'')
  returns [''lima'', ''internationalization'', ''internationalization'', ''charlie'', ''lima echo'', ''bravo
