prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  2. Reverse the list.

  3. Keep only the last 3 values, in their order (all of them if there are fewer).

  4. Reverse the list.

  5. Remove every negative value.

  6. Replace every value with the largest of itself and the up to 3 values before it.

  7. Keep only the last 2 values, in their order (all of them if there are fewer).

  8. Keep the values at indices 0, 3, 6, and so on.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `apply_rules([13, 19, 9, -9, -7]) returns 19`.


  Return only the code.'
