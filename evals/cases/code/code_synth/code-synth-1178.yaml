  3. Remove every vowel (a, e, i, o, u, either case).

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Replace every ''s'' with ''a'' (lowercase only).

  6. Keep only the first 4 whitespace-separated words, joined by single spaces.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Swap the case of every letter.

  9. Collapse every run of the same character into one character.

  10. Sort the characters in ascending code point order.

  11. Collapse every run of the same character into one character.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
