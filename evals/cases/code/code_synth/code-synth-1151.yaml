prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  3. Collapse each run of equal adjacent values into one value.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Collapse each run of equal adjacent values into one value.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Keep only the first 6 values (all of them if there are fewer).

  8. Reverse the list.

  9. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  10. Keep only the first 3 values (all of them if there are fewer).

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Remove every negative value.

  13. Replace every value with the largest of itself and the up to 1 values before it.

  14. Multiply every value by -2.

  15. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  16. Keep only the first 6 values (all of them if there are fewer).

  17. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  18. Replace every value with the largest value seen so far.

  Then: Return the sum of the values (0 for an empty list).


  Example: `transform([6, -3, 23, 11, 4, 25, -4]) returns -84`.


  Return only the code.'
