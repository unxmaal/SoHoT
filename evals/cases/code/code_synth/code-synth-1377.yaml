prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  2. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  3. Sort descending.

  4. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  5. Keep only the last 5 values, in their order (all of them if there are fewer).

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Keep only the last 4 values, in their order (all of them if there are fewer).

  8. Sort ascending.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Replace every value with its absolute value.

  11. Drop the first 1 values (an empty list if there are fewer).

  12. Keep only the last 4 values, in their order (all of them if there are fewer).

  13. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return the resulting list.


  Example: `process([18, 17, 21, 23, 22, 3, -1, 22]) returns [4]`.


  Return only the code.'
