prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Remove every negative value.

  3. Sort ascending.

  4. Replace every value with the largest of itself and the up to 2 values before it.

  5. Replace every value with its square.

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Replace every value with the largest value seen so far.

  8. Sort descending.

  9. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Sort descending.

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Keep only the last 5 values, in their order (all of them if there are fewer).

  14. Reverse the list.

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Keep only the first 5 values (all of them if there are fewer).

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([-6, -7, -1, 17, -10]) returns 310`.


  Return only the code.'
