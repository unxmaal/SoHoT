prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to lowercase.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Replace every ''i'' with ''r'' (lowercase only).

  6. Swap the case of every letter.

  7. Replace every ''n'' with ''r'' (lowercase only).

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  11. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Keep only the first occurrence of each character.

  13. Replace every ''b'' with ''r'' (lowercase only).

  14. Sort the characters in ascending code point order.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''.bxy1Bza..x1,c'') returns '',.1Oj''`.


  Return only the code.'
