prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Replace every ''s'' with ''o'' (lowercase only).

  5. Replace every maximal run of digits with the number of digits in it.

  6. Keep only the first 2 whitespace-separated words, joined by single spaces.

  7. Convert to lowercase.

  8. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  12. Remove every digit.

  Then: Return the resulting string.


  Example: `process(''A,cczA2AB,,Cx1 y'') returns '',g''`.


  Return only the code.'
