prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Reverse the order of the whitespace-separated words and join them with single spaces.

  2. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Remove every digit.

  6. Swap the case of every letter.

  7. Replace every ''e'' with ''n'' (lowercase only).

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Replace every ''e'' with ''b'' (lowercase only).

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Swap the case of every letter.

  13. Remove every digit.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Replace every maximal run of digits with the number of digits in it.

  Then: Return how many characters it has.


  Example: `process(''a,ca.1 C'') returns 8`.


  Return only the code.'
