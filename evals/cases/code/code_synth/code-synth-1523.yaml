prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Keep only the last 4 values, in their order (all of them if there are fewer).

  3. Sort ascending.

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Replace every value with its absolute value.

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Sort ascending.

  9. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Reverse the list.

  13. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  14. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  15. Replace every value with the largest value seen so far.

  16. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  17. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  18. Sort descending.

  19. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  20. Replace every value with the largest of itself and the up to 3 values before it.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([21, 11, -8, 22, 23]) returns 8`.


  Return only the code.'
