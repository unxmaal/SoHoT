prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''swap'', ''over'', ''mul'': dup copies
  the top value onto the stack; swap exchanges the top two values; over pushes a copy of the second value
  from the top; mul pops two values and pushes their product. An operation that needs more values than
  the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([-3, ''dup'', ''dup'', ''over'', -1, 1, ''dup'', 5]) returns [-3, -3, -3, -3,
  -1, 1, 1, 5]`.


  Return only the code.'
