prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Remove every digit.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Replace every ''t'' with ''r'' (lowercase only).

  8. Convert to uppercase.

  Then: Return the resulting string.


  Example: `apply_rules(''2yz,21.B0bcxB'') returns ''H.,FE''`.


  Return only the code.'
