prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Convert to lowercase.

  3. Replace every ''d'' with ''i'' (lowercase only).

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  8. Remove every digit.

  9. Collapse every run of the same character into one character.

  10. Replace every ''l'' with ''a'' (lowercase only).

  11. Replace every maximal run of digits with the number of digits in it.

  12. Sort the characters in ascending code point order.

  Then: Return the resulting string.


  Example: `reduce_data(''11xza abBB ,x'') returns '' ,''`.


  Return only the code.'
