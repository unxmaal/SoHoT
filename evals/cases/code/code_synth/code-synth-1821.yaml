prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep the values at indices 0, 2, 4, and so on.

  2. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  3. Sort ascending.

  4. Reverse the list.

  5. Replace every value with its square.

  6. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Keep only the first 2 values (all of them if there are fewer).

  9. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  10. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  11. Replace every value with the largest of itself and the up to 3 values before it.

  12. Add 6 to every value.

  13. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  14. Keep only the values greater than 2.

  15. Keep the values at indices 0, 2, 4, and so on.

  16. Remove duplicates, keeping the first occurrence of each value.

  17. Add -5 to every value.

  18. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([5, 1, -8, 21, 11, 4, 22]) returns [-1]`.


  Return only the code.'
