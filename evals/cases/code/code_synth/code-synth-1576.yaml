  3. Convert to uppercase.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Convert to lowercase.

  6. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Keep only the first occurrence of each character.

  8. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  9. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Remove every digit.

  12. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
