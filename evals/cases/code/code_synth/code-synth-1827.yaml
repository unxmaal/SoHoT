  12. Multiply every value by 2.

  13. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  14. Keep only the values greater than 1.

  15. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  16. Keep only the last 3 values, in their order (all of them if there are fewer).

  17. Replace every value with the largest of itself and the up to 1 values before it.

  18. Remove every value that is a multiple of 5 (0 is a multiple of everything).

