prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Remove every digit.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Replace every ''c'' with ''d'' (lowercase only).

  9. Convert to uppercase.

  10. Keep only the first 4 whitespace-separated words, joined by single spaces.

  11. Collapse every run of the same character into one character.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Convert to lowercase.

  14. Sort the characters in ascending code point order.

  15. Keep only the first 3 whitespace-separated words, joined by single spaces.

  16. Collapse every run of the same character into one character.

  17. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  18. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the resulting string.


  Example: `apply_rules(''z10BBc00zB,0b,b'') returns '',12hjk''`.


  Return only the code.'
