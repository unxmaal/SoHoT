prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  2. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Remove every digit.

  5. Keep only the first occurrence of each character.

  6. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Replace every ''r'' with ''o'' (lowercase only).

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute('',CzA zA.ABc'') returns ''1,1n1k1l''`.


  Return only the code.'
