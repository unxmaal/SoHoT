prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Add 6 to every value.

  2. Sort descending.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Keep only the last 2 values, in their order (all of them if there are fewer).

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  7. Remove every negative value.

  8. Keep only the first 4 values (all of them if there are fewer).

  9. Replace every value with the largest value seen so far.

  10. Replace every value with its square.

  11. Keep only the first 6 values (all of them if there are fewer).

  12. Replace every value with its square.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Keep only the first 5 values (all of them if there are fewer).

  15. Sort ascending.

  16. Multiply every value by 3.

  17. Keep only the even values.

  18. Keep only the last 4 values, in their order (all of them if there are fewer).

  19. Replace every value with the largest value seen so far.

  20. Remove every negative value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([0, 7, 13, 6, 20, 4, -8, 13, -6]) returns 3888`.


  Return only the code.'
