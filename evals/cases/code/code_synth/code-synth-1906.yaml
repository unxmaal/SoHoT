  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Replace every ''a'' with ''e'' (lowercase only).

  7. Collapse every run of the same character into one character.

  8. Convert to uppercase.

  9. Collapse every run of the same character into one character.

  10. Convert to uppercase.

  11. Swap the case of every letter.

  12. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
