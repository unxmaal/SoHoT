  14. Replace runs of whitespace with a single space and strip both ends.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  17. Convert to lowercase.

  18. Replace every maximal run of digits with the number of digits in it.

  19. Remove every digit.

  20. Replace every ''r'' with ''a'' (lowercase only).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
