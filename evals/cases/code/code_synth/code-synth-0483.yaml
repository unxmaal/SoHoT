  3. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  4. Keep only the first 6 values (all of them if there are fewer).

  5. Keep only the values greater than -1.

  6. Remove duplicates, keeping the first occurrence of each value.

  7. Sort ascending.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
