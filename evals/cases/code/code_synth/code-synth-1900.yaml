  12. Remove every vowel (a, e, i, o, u, either case).

  13. Replace every ''o'' with ''i'' (lowercase only).

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Convert to uppercase.

  16. Keep only the first occurrence of each character.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
