prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Keep only the last 5 values, in their order (all of them if there are fewer).

  3. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  4. Add 4 to every value.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Collapse each run of equal adjacent values into one value.

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Replace every value with its square.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `transform([23, 12, 25, 17, 1, 11]) returns 312`.


  Return only the code.'
