prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  4. Keep only the first occurrence of each character.

  5. Replace every ''i'' with ''b'' (lowercase only).

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  8. Collapse every run of the same character into one character.

  9. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Collapse every run of the same character into one character.

  11. Remove every digit.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Replace every maximal run of digits with the number of digits in it.

  15. Replace every ''b'' with ''e'' (lowercase only).

  16. Convert to uppercase.

  17. Sort the characters in ascending code point order.

  18. Replace every maximal run of digits with the number of digits in it.

  19. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  20. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''yxx2y1caxbbzzxxA'') returns ''KKJ4.''`.


  Return only the code.'
