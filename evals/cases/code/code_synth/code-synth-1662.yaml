prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Sort the characters in ascending code point order.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Remove every digit.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Convert to lowercase.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Swap the case of every letter.

  11. Collapse every run of the same character into one character.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Collapse every run of the same character into one character.

  15. Remove every digit.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Collapse every run of the same character into one character.

  18. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
