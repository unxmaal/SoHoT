prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  4. Keep only the first occurrence of each character.

  5. Convert to lowercase.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Replace every ''b'' with ''i'' (lowercase only).

  12. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  13. Collapse every run of the same character into one character.

  14. Convert to uppercase.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Remove every digit.

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Convert to lowercase.

  19. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  20. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `transform(''xyz,20.A0 Ca1c .'') returns ''1f1e1d''`.


  Return only the code.'
