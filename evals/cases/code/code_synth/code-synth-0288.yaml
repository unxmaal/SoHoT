prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Convert to uppercase.

  4. Keep only the first occurrence of each character.

  5. Sort the characters in ascending code point order.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Swap the case of every letter.

  8. Convert to lowercase.

  Then: Return the resulting string.


  Example: `run_pipeline(''2Bac1AC10ABz,'') returns ''1,11121a1b1c1z''`.


  Return only the code.'
