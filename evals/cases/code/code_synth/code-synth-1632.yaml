  8. Sort the characters in ascending code point order.

  9. Keep only the first occurrence of each character.

  10. Remove every digit.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Convert to lowercase.

  13. Sort the characters in ascending code point order.

  14. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
