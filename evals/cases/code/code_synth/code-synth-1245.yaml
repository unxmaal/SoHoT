prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  2. Clamp every value into the range -4 to 2, both inclusive.

  3. Keep only the first 3 values (all of them if there are fewer).

  4. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  5. Collapse each run of equal adjacent values into one value.

  6. Replace every value with the largest value seen so far.

  7. Replace every value with its square.

  8. Add 4 to every value.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Keep only the last 2 values, in their order (all of them if there are fewer).

  14. Keep only the first 4 values (all of them if there are fewer).

  15. Remove every negative value.

  16. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([22, 8, 23, 3, 0, 24, 12, -9, 17]) returns 60`.


  Return only the code.'
