prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Remove every digit.

  3. Keep only the first 2 whitespace-separated words, joined by single spaces.

  4. Replace every ''c'' with ''e'' (lowercase only).

  5. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  6. Keep only the first occurrence of each character.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve('',BACa C '') returns ''1,1B1''`.


  Return only the code.'
