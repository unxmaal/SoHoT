prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  2. Clamp every value into the range -4 to 1, both inclusive.

  3. Reverse the list.

  4. Keep only the last 4 values, in their order (all of them if there are fewer).

  5. Remove every negative value.

  6. Sort ascending.

  7. Multiply every value by -1.

  8. Keep the values at indices 0, 2, 4, and so on.

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Multiply every value by 3.

  12. Clamp every value into the range -4 to 3, both inclusive.

  13. Reverse the list.

  14. Sort ascending.

  15. Keep only the last 5 values, in their order (all of them if there are fewer).

  16. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([20, -9, 1]) returns [6]`.


  Return only the code.'
