prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  3. Keep only the values greater than 3.

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Keep only the last 2 values, in their order (all of them if there are fewer).

  9. Collapse each run of equal adjacent values into one value.

  10. Replace every value with its absolute value.

  11. Multiply every value by 5.

  12. Sort ascending.

  13. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  14. Replace every value with the largest of itself and the up to 3 values before it.

  15. Keep the values at indices 0, 2, 4, and so on.

  16. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  17. Replace every value with its square.

  18. Add 2 to every value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `transform([25, -10, 7, 15, 12, -9]) returns 123`.


  Return only the code.'
