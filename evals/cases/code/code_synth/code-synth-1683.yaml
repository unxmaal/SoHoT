prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  5. Replace every value with the largest value seen so far.

  6. Replace every value with the largest of itself and the up to 2 values before it.

  7. Replace every value with its absolute value.

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Collapse each run of equal adjacent values into one value.

  11. Remove every negative value.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Replace every value with its absolute value.

  14. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  15. Replace every value with its square.

  16. Keep the values at indices 0, 3, 6, and so on.

  Then: Return the resulting list.


  Example: `process([-8, -6, 23, 24, 16, 3, -1, 21]) returns [81]`.


  Return only the code.'
