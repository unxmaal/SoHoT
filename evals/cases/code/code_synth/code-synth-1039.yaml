prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  4. Replace every value with the largest value seen so far.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Keep only the values greater than 2.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  10. Sort ascending.

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Keep only the last 4 values, in their order (all of them if there are fewer).

  14. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  Then: Return the largest value, or -1 for an empty list.


  Example: `solve([-10, 23, 7, -11]) returns -1`.


  Return only the code.'
