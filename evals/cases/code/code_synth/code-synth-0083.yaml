  2. Replace every value with its square.

  3. Keep the values at indices 0, 3, 6, and so on.

  4. Reverse the list.

  5. Sort descending.

  6. Add 9 to every value.

  7. Replace every value with the largest of itself and the up to 3 values before it.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([5, 1, -9, -6, 22, 13, 4, 10, 14]) returns 493`.


  Return only the code.'
