prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Drop the first 1 values (an empty list if there are fewer).

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Sort descending.

  5. Sort ascending.

  6. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  7. Reverse the list.

  8. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  9. Multiply every value by -1.

  10. Keep only the last 4 values, in their order (all of them if there are fewer).

  11. Sort descending.

  12. Add 4 to every value.

  13. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  14. Replace every value with its square.

  15. Collapse each run of equal adjacent values into one value.

  16. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  17. Keep only the values greater than -1.

  18. Sort ascending.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([-9, -3, 7, 8, 19]) returns 1`.


  Return only the code.'
