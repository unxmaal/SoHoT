  6. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  7. Replace every value with the largest value seen so far.

  8. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Sort descending.

  11. Remove every negative value.

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
