  17. Remove every negative value.

  18. Keep the values at indices 0, 2, 4, and so on.

  19. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  20. Replace every value with the largest value seen so far.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


