prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort ascending.

  2. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Replace every value with the largest value seen so far.

  7. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  8. Add -9 to every value.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([9, -8, 16, 12, 10, 13, 9, 23]) returns [-8, -8]`.


  Return only the code.'
