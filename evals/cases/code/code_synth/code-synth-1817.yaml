prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  2. Keep only the values greater than 5.

  3. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  4. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  7. Collapse each run of equal adjacent values into one value.

  8. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  9. Replace every value with the largest of itself and the up to 3 values before it.

  10. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Replace every value with its absolute value.

  13. Replace every value with its square.

  14. Reverse the list.

  Then: Return how many distinct values there are.


  Example: `transform([17, 0, 12]) returns 1`.


  Return only the code.'
