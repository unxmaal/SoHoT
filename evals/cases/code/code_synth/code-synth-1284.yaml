prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Collapse every run of the same character into one character.

  4. Keep only the first 2 whitespace-separated words, joined by single spaces.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Convert to uppercase.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Keep only the first occurrence of each character.

  9. Convert to uppercase.

  10. Convert to lowercase.

  11. Collapse every run of the same character into one character.

  12. Convert to lowercase.

  13. Swap the case of every letter.

  14. Replace every ''a'' with ''r'' (lowercase only).

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Replace every ''r'' with ''s'' (lowercase only).

  17. Convert to lowercase.

  18. Replace every ''o'' with ''a'' (lowercase only).

  Then: Return the resulting string.


  Example: `compute(''  a0,0B.c,bCb'') returns ''1,b.c''`.


  Return only the code.'
