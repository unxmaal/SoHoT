prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Add 2 to every value.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Replace every value with the largest of itself and the up to 2 values before it.

  4. Replace every value with its absolute value.

  5. Keep the values at indices 0, 2, 4, and so on.

  6. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Sort ascending.

  10. Remove every negative value.

  11. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  12. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  13. Replace every value with its square.

  14. Sort descending.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([6, 12, -9, 20, -10, 9, 24, 4]) returns 0`.


  Return only the code.'
