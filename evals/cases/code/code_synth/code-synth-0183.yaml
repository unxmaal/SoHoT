prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Replace every value with the largest value seen so far.

  4. Drop the first 1 values (an empty list if there are fewer).

  5. Multiply every value by 5.

  6. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  7. Reverse the list.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Sort ascending.

  10. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  Then: Return how many distinct values there are.


  Example: `apply_rules([-7, 23, 17]) returns 1`.


  Return only the code.'
