prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Remove every digit.

  3. Swap the case of every letter.

  4. Sort the characters in ascending code point order.

  5. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Swap the case of every letter.

  8. Sort the characters in ascending code point order.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Sort the characters in ascending code point order.

  11. Convert to lowercase.

  12. Sort the characters in ascending code point order.

  13. Replace every ''l'' with ''o'' (lowercase only).

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''0Ac.y1bc,'') returns ''c''`.


  Return only the code.'
