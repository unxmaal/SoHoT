  order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Replace every value with its square.

  3. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  4. Sort descending.

  5. Replace every value with the largest of itself and the up to 2 values before it.

  6. Sort descending.

  7. Remove every negative value.

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([-2, 9, -2, 10, 17, 8, -9, 19]) returns [25, 156]`.


  Return only the code.'
