prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Multiply every value by -2.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  4. Keep only the even values.

  5. Replace every value with its absolute value.

  6. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  7. Remove every negative value.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Add 2 to every value.

  10. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  11. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Keep only the last 2 values, in their order (all of them if there are fewer).

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `process([11, -12, -9, 21]) returns -9`.


  Return only the code.'
