prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every negative value.

  2. Keep only the values greater than -3.

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  5. Keep only the values greater than 4.

  6. Replace every value with the largest of itself and the up to 2 values before it.

  7. Keep only the first 4 values (all of them if there are fewer).

  8. Keep only the last 5 values, in their order (all of them if there are fewer).

  9. Keep the values at indices 0, 3, 6, and so on.

  10. Keep only the first 4 values (all of them if there are fewer).

  11. Reverse the list.

  12. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  13. Keep only the first 5 values (all of them if there are fewer).

  14. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  Then: Return the resulting list.


  Example: `run_pipeline([10, -6, 4, 14, 4, 15, 2, 0]) returns [0, 0]`.


  Return only the code.'
