  16. Keep only the first 2 values (all of them if there are fewer).

  17. Sort by absolute value, values with equal absolute value keeping their current relative order.

  18. Replace every value with the largest value seen so far.

  19. Collapse each run of equal adjacent values into one value.

  20. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


