  3. Remove every vowel (a, e, i, o, u, either case).

  4. Swap the case of every letter.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
