prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Add -5 to every value.

  4. Replace every value with the largest value seen so far.

  5. Sort ascending.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Add -5 to every value.

  9. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  10. Sort ascending.

  11. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  12. Keep only the last 5 values, in their order (all of them if there are fewer).

  13. Replace every value with its absolute value.

  14. Keep only the last 4 values, in their order (all of them if there are fewer).

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Keep only the even values.

  17. Replace every value with its square.

  18. Replace every value with its absolute value.

  Then: Return the resulting list.


  Example: `compute([-5, 20, -9, -4, 14, 19, -10, -11, 7]) returns [16]`.


  Return only the code.'
