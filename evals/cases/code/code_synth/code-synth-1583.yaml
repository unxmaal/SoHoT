  0 to i).

  3. Replace every value with its absolute value.

  4. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  5. Remove every negative value.

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Multiply every value by 5.

  9. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  10. Keep only the first 6 values (all of them if there are fewer).

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Multiply every value by 3.

  13. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  14. Keep only the last 4 values, in their order (all of them if there are fewer).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `compute([21, 18, 23, 1, -1, 23, 15, 11]) returns 1`.


  Return only the code.'
