prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to uppercase.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Keep only the first 4 whitespace-separated words, joined by single spaces.

  5. Keep only the first occurrence of each character.

  6. Collapse every run of the same character into one character.

  7. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  10. Replace every ''r'' with ''b'' (lowercase only).

  11. Keep only the first 4 whitespace-separated words, joined by single spaces.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Replace every ''n'' with ''d'' (lowercase only).

  15. Keep only the first occurrence of each character.

  16. Convert to uppercase.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `transform('' 121a22yAAxB,2,'') returns ''1''`.


  Return only the code.'
