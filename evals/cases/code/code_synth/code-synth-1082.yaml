  7. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Keep only the first occurrence of each character.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Collapse every run of the same character into one character.

  17. Swap the case of every letter.

  18. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
