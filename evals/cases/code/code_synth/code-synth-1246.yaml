  6. Swap the case of every letter.

  7. Remove every digit.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Collapse every run of the same character into one character.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
