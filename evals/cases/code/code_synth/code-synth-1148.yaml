  3. Convert to lowercase.

  4. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Convert to lowercase.

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Sort the characters in ascending code point order.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Collapse every run of the same character into one character.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Remove every digit.

  14. Sort the characters in ascending code point order.

  15. Convert to lowercase.

  16. Collapse every run of the same character into one character.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Keep only the first occurrence of each character.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules('',B.x0byx0'') returns '',''`.


  Return only the code.'
