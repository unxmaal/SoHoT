prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 1 values before it.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Replace every value with its absolute value.

  4. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  5. Replace every value with its absolute value.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Replace every value with its square.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  10. Remove duplicates, keeping the first occurrence of each value.

  11. Replace every value with the largest value seen so far.

  12. Multiply every value by 5.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  15. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  16. Sort descending.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `run_pipeline([18, 23, -12, -12]) returns 1293`.


  Return only the code.'
