  3. Collapse every run of the same character into one character.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Replace every ''c'' with ''a'' (lowercase only).

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Swap the case of every letter.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Convert to uppercase.

  10. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Sort the characters in ascending code point order.

  17. Replace every ''i'' with ''r'' (lowercase only).

  18. Convert to lowercase.

  Then: Return the resulting string.


  Example: `solve(''1yByC.CcB cxBbyA'') returns ''33by''`.


  Return only the code.'
