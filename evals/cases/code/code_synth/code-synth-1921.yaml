prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Reverse the list.

  3. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  4. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  5. Keep only the last 3 values, in their order (all of them if there are fewer).

  6. Multiply every value by 2.

  7. Sort descending.

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  11. Collapse each run of equal adjacent values into one value.

  12. Replace every value with the largest of itself and the up to 1 values before it.

  13. Reverse the list.

  14. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `transform([-3, -11, 8, 20, 11, 13, 16, 23, 22]) returns [3]`.


  Return only the code.'
