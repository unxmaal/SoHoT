prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Convert to uppercase.

  3. Swap the case of every letter.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Swap the case of every letter.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Swap the case of every letter.

  11. Replace every ''r'' with ''t'' (lowercase only).

  12. Keep only the first occurrence of each character.

  13. Replace every maximal run of digits with the number of digits in it.

  14. Keep only the first 4 whitespace-separated words, joined by single spaces.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  17. Collapse every run of the same character into one character.

  18. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  19. Replace every ''b'' with ''s'' (lowercase only).

  20. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  Then: Return the resulting string.


  Example: `apply_rules('', ,0ay2ac,1Ay.0c'') returns ''111,111''`.


  Return only the code.'
