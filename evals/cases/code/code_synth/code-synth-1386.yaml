prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Convert to lowercase.

  2. Replace every ''e'' with ''l'' (lowercase only).

  3. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  4. Keep only the first 3 whitespace-separated words, joined by single spaces.

  5. Sort the characters in ascending code point order.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Swap the case of every letter.

  8. Replace every ''n'' with ''l'' (lowercase only).

  9. Swap the case of every letter.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Replace every ''s'' with ''l'' (lowercase only).

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  17. Keep only the first occurrence of each character.

  18. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `solve(''1A0,z0zbxA2'') returns ''1,20E''`.


  Return only the code.'
