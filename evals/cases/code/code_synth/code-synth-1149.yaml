  9. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  10. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  11. Replace every value with its square.

  12. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  13. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  14. Add 2 to every value.

