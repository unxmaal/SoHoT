prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Sort ascending.

  2. Replace every value with its absolute value.

  3. Replace every value with the largest of itself and the up to 3 values before it.

  4. Drop the first 2 values (an empty list if there are fewer).

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Remove every negative value.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Remove every negative value.

  9. Keep the values at indices 0, 3, 6, and so on.

  10. Keep only the even values.

  11. Sort descending.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Collapse each run of equal adjacent values into one value.

  14. Remove every negative value.

  15. Sort by absolute value, values with equal absolute value keeping their current relative order.

  16. Sort ascending.

  17. Add 4 to every value.

  18. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `solve([16, 13, 0, -5, -3, -7]) returns 18`.


  Return only the code.'
