prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Keep only the first 2 values (all of them if there are fewer).

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Multiply every value by 2.

  7. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  8. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Keep only the last 3 values, in their order (all of them if there are fewer).

  11. Sort ascending.

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  13. Sort ascending.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `transform([14, 20, 25, 17]) returns 9`.


  Return only the code.'
