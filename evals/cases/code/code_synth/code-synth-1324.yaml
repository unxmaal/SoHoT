prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Remove every digit.

  6. Swap the case of every letter.

  7. Convert to uppercase.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Keep only the first 3 whitespace-separated words, joined by single spaces.

  11. Convert to lowercase.

  12. Replace every ''d'' with ''e'' (lowercase only).

  13. Keep only the first occurrence of each character.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Keep only the first occurrence of each character.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Remove every digit.

  18. Keep only the first 3 whitespace-separated words, joined by single spaces.

  Then: Return how many characters it has.


  Example: `transform('',,1C1xxCz.2,xx'') returns 2`.


  Return only the code.'
