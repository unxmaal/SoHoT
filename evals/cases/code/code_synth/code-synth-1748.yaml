prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Convert to lowercase.

  3. Remove every digit.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Sort the characters in ascending code point order.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Convert to lowercase.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  16. Convert to uppercase.

  17. Keep only the first 4 whitespace-separated words, joined by single spaces.

  18. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  19. Swap the case of every letter.

  20. Sort the characters in ascending code point order.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''a01cAbA,.'') returns ''o''`.


  Return only the code.'
