prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort ascending.

  2. Sort descending.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Add -5 to every value.

  7. Replace every value with its square.

  8. Keep only the even values.

  9. Multiply every value by 2.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Keep only the even values.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  14. Keep only the first 5 values (all of them if there are fewer).

  Then: Return the resulting list.


  Example: `run_pipeline([3, 3, 5, -11, -3, -12]) returns [16, 400]`.


  Return only the code.'
