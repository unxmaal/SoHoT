prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Keep the values at indices 0, 2, 4, and so on.

  5. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Sort descending.

  8. Replace every value with the largest value seen so far.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `process([16, -3, 5, -3, -8, 4]) returns [5]`.


  Return only the code.'
