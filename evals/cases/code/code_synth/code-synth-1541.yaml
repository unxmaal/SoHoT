prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  2. Collapse each run of equal adjacent values into one value.

  3. Keep only the first 4 values (all of them if there are fewer).

  4. Keep only the even values.

  5. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Keep only the first 2 values (all of them if there are fewer).

  8. Sort ascending.

  9. Add 2 to every value.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  12. Remove every negative value.

  13. Replace every value with its absolute value.

  14. Clamp every value into the range -1 to 4, both inclusive.

  15. Reverse the list.

  16. Sort descending.

  17. Keep the values at indices 0, 2, 4, and so on.

  18. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  19. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  20. Add -3 to every value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([20, 22, -6, 23]) returns 1`.


  Return only the code.'
