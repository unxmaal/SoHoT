prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''mul'', ''sub'', ''add'', ''over'': mul pops
  two values and pushes their product; sub pops b then a and pushes a - b, so the value pushed first is
  a; add pops two values and pushes their sum; over pushes a copy of the second value from the top. An
  operation that needs more values than the stack has does nothing. Return the final stack as a list,
  bottom first.


  Example: `run_program([''mul'', ''sub'', 9]) returns [9]`.


  Return only the code.'
