prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the even values.

  2. Sort descending.

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace every value with its absolute value.

  8. Remove every negative value.

  9. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  10. Collapse each run of equal adjacent values into one value.

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  12. Sort descending.

  13. Add 6 to every value.

  14. Replace every value with its square.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([-6, 15, 22, -3]) returns 144`.


  Return only the code.'
