prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Add -9 to every value.

  2. Keep the values at indices 0, 2, 4, and so on.

  3. Replace every value with its square.

  4. Sort ascending.

  5. Replace every value with its absolute value.

  6. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace every value with the largest value seen so far.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  12. Collapse each run of equal adjacent values into one value.

  Then: Return the largest value, or -1 for an empty list.


  Example: `apply_rules([14, 8, 23, 25, 5, -9, 24]) returns 133`.


  Return only the code.'
