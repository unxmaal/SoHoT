prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Convert to uppercase.

  3. Collapse every run of the same character into one character.

  4. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  5. Sort the characters in ascending code point order.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Convert to lowercase.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Replace every ''o'' with ''l'' (lowercase only).

  13. Replace every maximal run of digits with the number of digits in it.

  14. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  15. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Keep only the first occurrence of each character.

  19. Remove every vowel (a, e, i, o, u, either case).

  20. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''cbyc,a,1,cB021'') returns ''g1,''`.


  Return only the code.'
