prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  4. Replace every value with its square.

  5. Replace every value with its absolute value.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Reverse the list.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Reverse the list.

  11. Add -1 to every value.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Keep the values at indices 0, 2, 4, and so on.

  14. Collapse each run of equal adjacent values into one value.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `solve([3, 3, 16, 7, -11, 24]) returns 21`.


  Return only the code.'
