  values and pushes their product; add pops two values and pushes their sum. An operation that needs more
  values than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''mul'', ''sub'', ''sub'', ''mul'', ''add'', -1, ''swap'']) returns [-1]`.


