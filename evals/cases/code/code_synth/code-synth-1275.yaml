prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the even values.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Collapse each run of equal adjacent values into one value.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Replace every value with the largest value seen so far.

  7. Replace every value with its absolute value.

  8. Sort descending.

  9. Reverse the list.

  10. Keep only the even values.

  11. Keep the values at indices 0, 3, 6, and so on.

  12. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  15. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  16. Keep the values at indices 0, 2, 4, and so on.

  17. Replace every value with its square.

  18. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `run_pipeline([22, 0, 12]) returns 0`.


  Return only the code.'
