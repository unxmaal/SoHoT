  3. Replace every maximal run of digits with the number of digits in it.

  4. Keep only the first occurrence of each character.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Swap the case of every letter.

  7. Keep only the first occurrence of each character.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Collapse every run of the same character into one character.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Remove every digit.

