prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Reverse the list.

  2. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  3. Keep only the values greater than -2.

  4. Keep only the even values.

  5. Collapse each run of equal adjacent values into one value.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Replace every value with the largest value seen so far.

  8. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  11. Replace every value with its absolute value.

  12. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  13. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  14. Sort ascending.

  Then: Return the largest value, or -1 for an empty list.


  Example: `run_pipeline([24, -6, 6]) returns 2`.


  Return only the code.'
