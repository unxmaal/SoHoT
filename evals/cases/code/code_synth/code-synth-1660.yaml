  other characters are unchanged.

  4. Convert to lowercase.

  5. Sort the characters in ascending code point order.

  6. Convert to uppercase.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Replace every ''a'' with ''s'' (lowercase only).

  9. Replace every maximal run of digits with the number of digits in it.

  10. Replace every ''r'' with ''l'' (lowercase only).

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  15. Convert to uppercase.

  16. Keep only the first occurrence of each character.

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
