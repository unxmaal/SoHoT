  to the result of the one before:

  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Convert to uppercase.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Keep only the first occurrence of each character.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Remove every digit.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''c00 xA,xB2.1,xxz'') returns ''XA,XB.Z''`.


  Return only the code.'
