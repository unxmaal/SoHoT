  14. Convert to lowercase.

  15. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Remove every digit.

  17. Remove every vowel (a, e, i, o, u, either case).

  18. Convert to lowercase.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
