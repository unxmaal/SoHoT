  4. Remove every digit.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Keep only the first occurrence of each character.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Replace every maximal run of digits with the number of digits in it.

  10. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
