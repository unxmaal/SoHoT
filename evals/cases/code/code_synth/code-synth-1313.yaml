  10. Multiply every value by -2.

  11. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  12. Reverse the list.

  13. Replace every value with its absolute value.

  14. Replace every value with its square.

  15. Reverse the list.

  16. Remove every negative value.

