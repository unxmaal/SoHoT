  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Collapse every run of the same character into one character.

  5. Remove every digit.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Convert to uppercase.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Convert to uppercase.

  11. Sort the characters in ascending code point order.

  12. Keep only the first occurrence of each character.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Remove every digit.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data('',CyCCaAbACa1bAA'') returns '',BCY''`.


  Return only the code.'
