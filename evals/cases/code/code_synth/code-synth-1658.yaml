prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Replace every maximal run of digits with the number of digits in it.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  10. Collapse every run of the same character into one character.

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Replace runs of whitespace with a single space and strip both ends.

  13. Replace every ''n'' with ''e'' (lowercase only).

  14. Swap the case of every letter.

  15. Sort the characters in ascending code point order.

  16. Keep only the first 3 whitespace-separated words, joined by single spaces.

  17. Reverse the order of the whitespace-separated words and join them with single spaces.

  18. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return how many characters it has.


  Example: `process(''ABzc.012a.y'') returns 14`.


  Return only the code.'
