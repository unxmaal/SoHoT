prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Keep only the first occurrence of each character.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Remove every digit.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Remove every digit.

  9. Convert to lowercase.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  12. Replace every ''d'' with ''i'' (lowercase only).

  13. Collapse every run of the same character into one character.

  14. Convert to lowercase.

  15. Keep only the first occurrence of each character.

  16. Remove every digit.

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  19. Replace every maximal run of digits with the number of digits in it.

  20. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  Then: Return the resulting string.


  Example: `run_pipeline(''xC 0yxc aC1.'') returns ''Cx....''`.


  Return only the code.'
