  5. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  6. Collapse each run of equal adjacent values into one value.

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Replace every value with its absolute value.

  9. Collapse each run of equal adjacent values into one value.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
