prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Keep only the first occurrence of each character.

  6. Convert to uppercase.

  7. Remove every vowel (a, e, i, o, u, either case).

  8. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  9. Sort the characters in ascending code point order.

  10. Replace every ''a'' with ''n'' (lowercase only).

  11. Collapse every run of the same character into one character.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Keep only the first occurrence of each character.

  14. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''xC1.0yz,001c,1z'') returns '',.2DEFI''`.


  Return only the code.'
