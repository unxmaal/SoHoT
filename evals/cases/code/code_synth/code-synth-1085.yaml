prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Drop the first 1 values (an empty list if there are fewer).

  3. Clamp every value into the range 1 to 6, both inclusive.

  4. Replace every value with its square.

  5. Add 4 to every value.

  6. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Sort ascending.

  9. Sort descending.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Multiply every value by 3.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `reduce_data([11, -11, -4, 12, 10, 13, 18, 19]) returns None`.


  Return only the code.'
