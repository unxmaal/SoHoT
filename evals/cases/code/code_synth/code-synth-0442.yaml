prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort by absolute value, values with equal absolute value keeping their current relative order.

  2. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  3. Remove every negative value.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Keep only the first 3 values (all of them if there are fewer).

  7. Reverse the list.

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `apply_rules([-10, 20, -1, 4, 18, -6]) returns [0, 1]`.


  Return only the code.'
