  2. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  3. Collapse every run of the same character into one character.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Swap the case of every letter.

  6. Keep only the first occurrence of each character.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Keep only the first occurrence of each character.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Replace every maximal run of digits with the number of digits in it.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Replace every ''r'' with ''b'' (lowercase only).

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Swap the case of every letter.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
