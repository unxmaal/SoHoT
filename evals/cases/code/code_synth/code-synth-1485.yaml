prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Add 2 to every value.

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Keep only the even values.

  4. Replace every value with the largest value seen so far.

  5. Keep only the values greater than -1.

  6. Multiply every value by 5.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Reverse the list.

  9. Keep only the even values.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Keep only the values greater than -1.

  12. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  13. Sort descending.

  14. Replace every value with the largest value seen so far.

  15. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  16. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  Then: Return the resulting list.


  Example: `transform([24, 18, 19, -11, 0, 22, 23, 3]) returns [212, 212]`.


  Return only the code.'
