prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Swap the case of every letter.

  2. Collapse every run of the same character into one character.

  3. Keep only the first 3 whitespace-separated words, joined by single spaces.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  7. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Keep only the first 3 whitespace-separated words, joined by single spaces.

  10. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''2aca.z,.'') returns ''111K1M1K1.''`.


  Return only the code.'
