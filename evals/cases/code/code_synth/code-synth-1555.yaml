  4. Collapse each run of equal adjacent values into one value.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Replace every value with its absolute value.

  8. Keep only the even values.

  9. Keep only the last 3 values, in their order (all of them if there are fewer).

  10. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  11. Keep only the last 2 values, in their order (all of them if there are fewer).

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
