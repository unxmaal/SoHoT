  13. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  14. Add -1 to every value.

  15. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  16. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the sum of the values (0 for an empty list).


