  to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Replace every maximal run of digits with the number of digits in it.

  3. Collapse every run of the same character into one character.

  4. Convert to lowercase.

  5. Swap the case of every letter.

  6. Keep only the first occurrence of each character.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
