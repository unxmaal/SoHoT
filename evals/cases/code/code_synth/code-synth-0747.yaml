prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Convert to lowercase.

  6. Convert to uppercase.

  7. Collapse every run of the same character into one character.

  8. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''2Ax2Cc,aBa2CAC'') returns ''1A1X1C1C1,1A1B1A1C1A1C''`.


  Return only the code.'
