prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Convert to uppercase.

  3. Remove every digit.

  4. Swap the case of every letter.

  5. Convert to uppercase.

  6. Remove every digit.

  7. Keep only the first occurrence of each character.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Remove every digit.

  10. Replace every ''r'' with ''b'' (lowercase only).

  11. Remove every digit.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  15. Reverse the order of the whitespace-separated words and join them with single spaces.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  17. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  18. Swap the case of every letter.

  19. Remove every vowel (a, e, i, o, u, either case).

  20. Replace every ''b'' with ''o'' (lowercase only).

  Then: Return the resulting string.


  Example: `process(''yABz1aa2'') returns ''FHg''`.


  Return only the code.'
