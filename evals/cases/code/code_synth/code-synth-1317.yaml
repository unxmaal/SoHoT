prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Multiply every value by 2.

  2. Drop the first 2 values (an empty list if there are fewer).

  3. Add -3 to every value.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  6. Replace every value with its absolute value.

  7. Replace every value with the largest of itself and the up to 1 values before it.

  8. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Remove every negative value.

  11. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  12. Sort descending.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Remove duplicates, keeping the first occurrence of each value.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `compute([6, 7, -11, 9, 25, 22, 22, 10]) returns None`.


  Return only the code.'
