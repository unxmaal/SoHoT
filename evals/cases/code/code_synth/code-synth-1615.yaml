prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 1 values before it.

  2. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  3. Replace every value with the largest of itself and the up to 1 values before it.

  4. Replace every value with the largest value seen so far.

  5. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  6. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  7. Replace every value with the largest of itself and the up to 2 values before it.

  8. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  9. Reverse the list.

  10. Replace every value with its square.

  11. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  12. Sort descending.

  13. Clamp every value into the range -1 to 7, both inclusive.

  14. Reverse the list.

  15. Multiply every value by 5.

  16. Remove duplicates, keeping the first occurrence of each value.

  17. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  18. Keep only the first 4 values (all of them if there are fewer).

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([-2, -9, -11, 11, 5, 19, -4, 14]) returns 20`.


  Return only the code.'
