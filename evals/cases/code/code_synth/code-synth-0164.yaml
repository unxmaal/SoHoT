prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  2. Convert to uppercase.

  3. Keep only the first occurrence of each character.

  4. Convert to uppercase.

  5. Remove every digit.

  6. Convert to lowercase.

  7. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Keep only the first 2 whitespace-separated words, joined by single spaces.

  9. Convert to uppercase.

  10. Swap the case of every letter.

  11. Replace every ''o'' with ''a'' (lowercase only).

  12. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `apply_rules(''Axy2ayAxAb'') returns ''ihef''`.


  Return only the code.'
