prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Replace every value with its absolute value.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Drop the first 3 values (an empty list if there are fewer).

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Remove every negative value.

  7. Drop the first 1 values (an empty list if there are fewer).

  8. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  9. Replace every value with the largest value seen so far.

  10. Keep only the first 6 values (all of them if there are fewer).

  11. Rotate the list left by 1 positions, wrapping around (an empty list stays empty).

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Reverse the list.

  14. Replace every value with the largest value seen so far.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `run_pipeline([0, -7, 2, -3]) returns -1`.


  Return only the code.'
