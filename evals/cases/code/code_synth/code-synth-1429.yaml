prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Multiply every value by 5.

  4. Keep only the last 2 values, in their order (all of them if there are fewer).

  5. Multiply every value by -2.

  6. Replace every value with its absolute value.

  7. Keep only the even values.

  8. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  9. Sort ascending.

  10. Collapse each run of equal adjacent values into one value.

  11. Keep only the first 4 values (all of them if there are fewer).

  12. Multiply every value by -1.

  13. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  15. Collapse each run of equal adjacent values into one value.

  16. Replace every value with the largest of itself and the up to 1 values before it.

  17. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  18. Add -3 to every value.

  Then: Return the resulting list.


  Example: `compute([11, 17, 4, 12]) returns [-223]`.


  Return only the code.'
