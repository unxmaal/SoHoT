prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Reverse the list.

  6. Replace every value with its square.

  7. Remove every value that is a multiple of 5 (0 is a multiple of everything).

  8. Sort by absolute value, values with equal absolute value keeping their current relative order.

  9. Add -1 to every value.

  10. Replace every value with its absolute value.

  11. Keep the values at indices 0, 2, 4, and so on.

  12. Replace every value with its square.

  13. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  14. Keep only the even values.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([13, -6, 12, -5, 20, 2]) returns 64`.


  Return only the code.'
