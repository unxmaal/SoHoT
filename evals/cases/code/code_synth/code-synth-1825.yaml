prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the values greater than -3.

  2. Replace every value with its absolute value.

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Add -3 to every value.

  5. Replace every value with the largest value seen so far.

  6. Sort descending.

  7. Replace every value with its square.

  8. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  9. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  10. Replace every value with the largest value seen so far.

  11. Keep only the first 6 values (all of them if there are fewer).

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Add 6 to every value.

  15. Keep only the first 3 values (all of them if there are fewer).

  16. Rotate the list left by 3 positions, wrapping around (an empty list stays empty).

  17. Sort descending.

  18. Keep the values at indices 0, 2, 4, and so on.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `reduce_data([-6, -1, 13, -7, -7, -3, 1, -6]) returns 6`.


  Return only the code.'
