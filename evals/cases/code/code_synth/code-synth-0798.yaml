  the second value from the top; swap exchanges the top two values. An operation that needs more values
  than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''add'', 9, ''over'', 4, 8, 5]) returns [9, 4, 8, 5]`.


