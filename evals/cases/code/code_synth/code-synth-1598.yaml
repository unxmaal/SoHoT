prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Swap the case of every letter.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  7. Replace every ''e'' with ''i'' (lowercase only).

  8. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Remove every digit.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Keep only the first occurrence of each character.

  13. Replace every ''t'' with ''n'' (lowercase only).

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Sort the characters in ascending code point order.

  Then: Return the resulting string.


  Example: `solve(''Axc,azzBzBzyy'') returns ''111byz''`.


  Return only the code.'
