prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Multiply every value by -2.

  3. Collapse each run of equal adjacent values into one value.

  4. Replace every value with its absolute value.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  7. Add 2 to every value.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Sort ascending.

  11. Drop the first 1 values (an empty list if there are fewer).

  12. Collapse each run of equal adjacent values into one value.

  13. Keep only the values greater than -2.

  14. Sort by absolute value, values with equal absolute value keeping their current relative order.

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([8, -5, 16, 4, -5, 7]) returns 106`.


  Return only the code.'
