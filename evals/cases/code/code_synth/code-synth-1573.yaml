prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  2. Collapse each run of equal adjacent values into one value.

  3. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  4. Multiply every value by 3.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Replace every value with its absolute value.

  7. Multiply every value by 5.

  8. Drop the first 2 values (an empty list if there are fewer).

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Keep only the even values.

  11. Keep only the last 2 values, in their order (all of them if there are fewer).

  12. Keep only the values greater than 4.

  13. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  14. Reverse the list.

  15. Replace every value with the largest of itself and the up to 1 values before it.

  16. Reverse the list.

  Then: Return the largest value, or -1 for an empty list.


  Example: `compute([1, -2, -4, 17, 13, -2, 16, 21]) returns 60`.


  Return only the code.'
