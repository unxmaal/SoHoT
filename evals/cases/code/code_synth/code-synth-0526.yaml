prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  2. Swap the case of every letter.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  7. Keep only the first occurrence of each character.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute('',z,b1CcC a,A..x'') returns ''1,1K1M111n''`.


  Return only the code.'
