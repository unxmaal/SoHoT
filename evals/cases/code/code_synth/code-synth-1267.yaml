prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the first 6 values (all of them if there are fewer).

  2. Sort ascending.

  3. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  4. Sort descending.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Collapse each run of equal adjacent values into one value.

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  9. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  10. Remove every negative value.

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Collapse each run of equal adjacent values into one value.

  13. Clamp every value into the range -2 to 7, both inclusive.

  14. Multiply every value by 3.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `run_pipeline([1, 3, 10, 19, 12, 25, 0, 10]) returns 2`.


  Return only the code.'
