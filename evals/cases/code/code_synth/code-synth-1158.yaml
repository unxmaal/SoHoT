prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Collapse every run of the same character into one character.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Convert to uppercase.

  9. Remove every digit.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Replace every ''a'' with ''c'' (lowercase only).

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Sort the characters in ascending code point order.

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Replace every maximal run of digits with the number of digits in it.

  16. Convert to uppercase.

  Then: Return how many characters it has.


  Example: `reduce_data('' 1.2212,c'') returns 3`.


  Return only the code.'
