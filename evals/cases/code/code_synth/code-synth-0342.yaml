prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  2. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  3. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  4. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  5. Replace every value with the largest value seen so far.

  6. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  7. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  8. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  Then: Return the resulting list.


  Example: `apply_rules([3, 22, 7, 0, 4, 7, -7, 7, 6]) returns []`.


  Return only the code.'
