  - apply_rules([]) == []
  - apply_rules([-8]) == []
  - apply_rules([24, -9, 16, -9, 8]) == [1]
  - apply_rules([16, -9, 7, 22, 5]) == [1]
  - apply_rules([0, 9, 2]) == []
