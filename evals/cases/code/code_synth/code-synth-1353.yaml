  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  14. Sort ascending.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
