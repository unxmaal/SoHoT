  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Replace every value with the largest of itself and the up to 2 values before it.

  4. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Keep only the first 4 values (all of them if there are fewer).

  7. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  8. Remove every negative value.

  9. Sort ascending.

  10. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  11. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
