prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Convert to uppercase.

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Swap the case of every letter.

  4. Collapse every run of the same character into one character.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Collapse every run of the same character into one character.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Convert to lowercase.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Remove every digit.

  11. Convert to lowercase.

  12. Convert to uppercase.

  13. Replace every ''e'' with ''s'' (lowercase only).

  14. Collapse every run of the same character into one character.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `compute(''CB.Ca0,b.'') returns ''B''`.


  Return only the code.'
