  2. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  3. Convert to lowercase.

  4. Swap the case of every letter.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Remove every vowel (a, e, i, o, u, either case).

  Then: Return how many characters it has.


  Example: `reduce_data(''y zx.ByzBzA1 .x'') returns 9`.


  Return only the code.'
