prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Sort ascending.

  4. Replace every value with the largest of itself and the up to 1 values before it.

  5. Replace every value with the largest value seen so far.

  6. Keep the values at indices 0, 2, 4, and so on.

  7. Sort ascending.

  8. Replace every value with its square.

  9. Remove every negative value.

  10. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  11. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  12. Collapse each run of equal adjacent values into one value.

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Keep the values at indices 0, 2, 4, and so on.

  Then: Return the resulting list.


  Example: `compute([6, 2, -8, -2]) returns [1]`.


  Return only the code.'
