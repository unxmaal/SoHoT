  in order, each to the result of the one before:

  1. Drop the first 1 values (an empty list if there are fewer).

  2. Reverse the list.

  3. Add 2 to every value.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Keep only the first 3 values (all of them if there are fewer).

  6. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  7. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  8. Replace every value with the largest value seen so far.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `reduce_data([-2, 13, -5, 20, 16]) returns -2`.


  Return only the code.'
