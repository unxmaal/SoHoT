  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Replace every maximal run of digits with the number of digits in it.

  5. Replace every ''e'' with ''r'' (lowercase only).

  6. Remove every digit.

  7. Collapse every run of the same character into one character.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Collapse every run of the same character into one character.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Collapse every run of the same character into one character.

  12. Convert to lowercase.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Collapse every run of the same character into one character.

  Then: Return the resulting string.


  Example: `transform(''C20 bzayBaC'') returns ''jhigjik k''`.


  Return only the code.'
