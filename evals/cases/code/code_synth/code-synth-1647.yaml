prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  2. Keep only the even values.

  3. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  4. Sort by absolute value, values with equal absolute value keeping their current relative order.

  5. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  6. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  7. Multiply every value by 3.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Replace every value with its square.

  10. Replace every value with the largest value seen so far.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Replace every value with its absolute value.

  13. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  14. Clamp every value into the range -3 to 2, both inclusive.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `run_pipeline([0, 14, 5, 4, -8, 24]) returns 0`.


  Return only the code.'
