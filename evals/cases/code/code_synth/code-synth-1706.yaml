prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Collapse every run of the same character into one character.

  4. Remove every digit.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Replace every ''i'' with ''c'' (lowercase only).

  9. Collapse every run of the same character into one character.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Replace every ''b'' with ''n'' (lowercase only).

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Keep only the first occurrence of each character.

  16. Replace every ''i'' with ''d'' (lowercase only).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''xc A1zy,c2 x0.z'') returns ''c,yz''`.


  Return only the code.'
