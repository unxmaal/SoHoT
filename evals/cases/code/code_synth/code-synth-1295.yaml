prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its square.

  2. Multiply every value by 5.

  3. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  4. Replace every value with the largest of itself and the up to 2 values before it.

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Add 2 to every value.

  7. Replace every value with the largest of itself and the up to 2 values before it.

  8. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  9. Sort ascending.

  10. Remove every negative value.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  13. Sort descending.

  14. Reverse the list.

  15. Sort descending.

  16. Keep only the first 5 values (all of them if there are fewer).

  17. Remove duplicates, keeping the first occurrence of each value.

  18. Replace every value with the largest value seen so far.

  Then: Return the resulting list.


  Example: `compute([1, -5, 1, 16]) returns [322, 322, 322]`.


  Return only the code.'
