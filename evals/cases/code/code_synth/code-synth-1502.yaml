prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Convert to uppercase.

  3. Swap the case of every letter.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Sort the characters in ascending code point order.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Remove every digit.

  8. Swap the case of every letter.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  11. Keep only the first occurrence of each character.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Collapse every run of the same character into one character.

  14. Convert to uppercase.

  15. Sort the characters in ascending code point order.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  17. Keep only the first occurrence of each character.

  18. Replace every maximal run of digits with the number of digits in it.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''a,,b20A2CB 1x2.'') returns ''1,.1A''`.


  Return only the code.'
