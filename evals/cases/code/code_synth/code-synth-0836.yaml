prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''add'', ''drop'', ''swap'', ''mul'': add pops
  two values and pushes their sum; drop removes the top value; swap exchanges the top two values; mul
  pops two values and pushes their product. An operation that needs more values than the stack has does
  nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''swap'', -1, ''swap'', ''swap'', 8, -2]) returns [-1, 8, -2]`.


  Return only the code.'
assert:
  checks:
  - run_program(['swap', 'swap', 'drop', 'drop', 3, 'swap', 'drop']) == []
  - run_program(['swap', 'drop', 3, 'swap', 'add', 0]) == [3, 0]
