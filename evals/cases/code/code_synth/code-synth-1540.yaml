prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 2 whitespace-separated words, joined by single spaces.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Replace every ''o'' with ''t'' (lowercase only).

  4. Collapse every run of the same character into one character.

  5. Keep only the first 2 whitespace-separated words, joined by single spaces.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Convert to uppercase.

  10. Keep only the first 4 whitespace-separated words, joined by single spaces.

  11. Replace every ''n'' with ''a'' (lowercase only).

  12. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Convert to uppercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''C2Aaz.cc,ay'') returns ''1K121H1.''`.


  Return only the code.'
