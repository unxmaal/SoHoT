prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 4 whitespace-separated words, joined by single spaces.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Convert to uppercase.

  4. Swap the case of every letter.

  5. Convert to uppercase.

  6. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Collapse every run of the same character into one character.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Keep only the first occurrence of each character.

  10. Collapse every run of the same character into one character.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Replace every ''d'' with ''a'' (lowercase only).

  13. Convert to lowercase.

  14. Keep only the first 2 whitespace-separated words, joined by single spaces.

  15. Replace every ''b'' with ''r'' (lowercase only).

  16. Convert to uppercase.

  Then: Return the resulting string.


  Example: `apply_rules(''.,A2z.1b2y'') returns ''.,E2D1FC''`.


  Return only the code.'
