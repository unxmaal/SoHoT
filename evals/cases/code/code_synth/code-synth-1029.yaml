prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''drop'', ''add'', ''over'', ''dup'': drop removes
  the top value; add pops two values and pushes their sum; over pushes a copy of the second value from
  the top; dup copies the top value onto the stack. An operation that needs more values than the stack
  has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''dup'', ''add'', ''dup'', ''add'', -2, -3, ''over'']) returns [-2, -3, -2]`.


  Return only the code.'
assert:
  checks:
  - run_program([0, 0, 3]) == [0, 0, 3]
  - run_program(['drop', 'dup']) == []
  - run_program(['over', -3, 0, 'dup', 'over', 'add', 8]) == [-3, 0, 0, 8]
  - run_program([9, 'add', 'drop']) == []
  - run_program(['dup', -2, 9, 'drop', 'add', 'over', 5, 'drop']) == [-2]
  - run_program(['over', 'add', -1, 'dup', 'dup', 'add']) == [-1, -2]
