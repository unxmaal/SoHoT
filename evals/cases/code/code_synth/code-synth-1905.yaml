prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  3. Keep the values at indices 0, 2, 4, and so on.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  6. Collapse each run of equal adjacent values into one value.

  7. Replace every value with the largest value seen so far.

  8. Keep only the first 4 values (all of them if there are fewer).

  9. Multiply every value by -2.

  10. Replace every value with its square.

  11. Collapse each run of equal adjacent values into one value.

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Replace every value with its absolute value.

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Keep only the even values.

  17. Keep only the first 6 values (all of them if there are fewer).

  18. Sort by absolute value, values with equal absolute value keeping their current relative order.

  19. Remove every negative value.

  20. Replace every value with its absolute value.

  Then: Return the resulting list.


  Example: `run_pipeline([15, 24, 9, 9, 0]) returns [144]`.


  Return only the code.'
