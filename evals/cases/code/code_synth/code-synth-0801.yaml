  1. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  2. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  3. Replace every value with its square.

  4. Multiply every value by 5.

  5. Keep only the even values.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Clamp every value into the range -5 to 2, both inclusive.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return the sum of the values (0 for an empty list).


  Example: `transform([-8, -2, 14, 17, 13, -8, -12, -8, 0]) returns 6`.


  Return only the code.'
