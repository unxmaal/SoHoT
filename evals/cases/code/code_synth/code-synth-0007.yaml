prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the order of the whitespace-separated words and join them with single spaces.

  2. Swap the case of every letter.

  3. Replace every ''s'' with ''o'' (lowercase only).

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Keep only the first 2 whitespace-separated words, joined by single spaces.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Collapse every run of the same character into one character.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Sort the characters in ascending code point order.

  12. Replace every maximal run of digits with the number of digits in it.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `run_pipeline('' C,2 BzCbCa ab,'') returns ''1''`.


  Return only the code.'
