prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Replace every ''d'' with ''e'' (lowercase only).

  3. Sort the characters in ascending code point order.

  4. Swap the case of every letter.

  5. Remove every digit.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''BABb1.a,b1Czb'') returns ''1,1.2b1c3b1z''`.


  Return only the code.'
