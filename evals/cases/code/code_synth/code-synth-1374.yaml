prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Replace every ''e'' with ''i'' (lowercase only).

  3. Convert to uppercase.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Convert to uppercase.

  9. Sort the characters in ascending code point order.

  10. Convert to uppercase.

  11. Collapse every run of the same character into one character.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Convert to uppercase.

  16. Replace every ''l'' with ''i'' (lowercase only).

  17. Replace runs of whitespace with a single space and strip both ends.

  18. Convert to lowercase.

  19. Keep only the first 3 whitespace-separated words, joined by single spaces.

  20. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `reduce_data(''C,a,z0az2'') returns '',2CZ''`.


  Return only the code.'
