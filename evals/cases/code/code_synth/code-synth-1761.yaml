  3. Replace every value with its absolute value.

  4. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  5. Sort ascending.

  6. Remove every negative value.

  7. Replace every value with the largest value seen so far.

  8. Replace every value with its square.

  9. Remove every negative value.

  10. Sort by absolute value, values with equal absolute value keeping their current relative order.

  11. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  12. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  15. Remove duplicates, keeping the first occurrence of each value.

  16. Replace every value with the largest of itself and the up to 3 values before it.

  17. Keep only the even values.

  18. Keep only the last 5 values, in their order (all of them if there are fewer).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([2, -10, 19]) returns [30, 30]`.


