  5. Swap the case of every letter.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Sort the characters in ascending code point order.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Keep only the first occurrence of each character.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
