  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Replace every ''o'' with ''r'' (lowercase only).

  6. Keep only the first occurrence of each character.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Collapse every run of the same character into one character.

  9. Keep only the first 2 whitespace-separated words, joined by single spaces.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Convert to uppercase.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Convert to lowercase.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Keep only the first occurrence of each character.

  16. Convert to uppercase.

  Then: Return how many characters it has.


  Example: `compute(''y0ax,CcbxAC'') returns 8`.


  Return only the code.'
