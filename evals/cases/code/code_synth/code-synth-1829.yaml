prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by 5.

  2. Replace every value with the largest value seen so far.

  3. Drop the first 2 values (an empty list if there are fewer).

  4. Multiply every value by 5.

  5. Sort by absolute value, values with equal absolute value keeping their current relative order.

  6. Reverse the list.

  7. Replace every value with the largest value seen so far.

  8. Keep only the values greater than -1.

  9. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  10. Add 6 to every value.

  11. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Keep only the values greater than 5.

  14. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  15. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  16. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  17. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  18. Replace every value with the largest value seen so far.

  19. Replace every value with the largest of itself and the up to 2 values before it.

  20. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([-9, 15, 20, -5, 19, -8, -4, -11, -2]) returns 5`.


  Return only the code.'
