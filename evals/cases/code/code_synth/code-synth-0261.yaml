  2. Replace every value with its absolute value.

  3. Keep only the first 4 values (all of them if there are fewer).

  4. Collapse each run of equal adjacent values into one value.

  5. Keep the values at indices 0, 3, 6, and so on.

  6. Add -1 to every value.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
