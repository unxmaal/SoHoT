prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  4. Multiply every value by 5.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Sort descending.

  7. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Keep only the first 6 values (all of them if there are fewer).

  10. Replace every value with its absolute value.

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  14. Sort ascending.

  15. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  16. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives
  -3).

  17. Replace every value with the largest value seen so far.

  18. Multiply every value by 5.

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `apply_rules([17, -7, -8]) returns 0`.


  Return only the code.'
