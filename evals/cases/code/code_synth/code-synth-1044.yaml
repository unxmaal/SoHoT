  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Convert to uppercase.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Remove every digit.

  9. Convert to uppercase.

  10. Keep only the first occurrence of each character.

  11. Swap the case of every letter.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Collapse every run of the same character into one character.

  14. Remove every digit.

  15. Swap the case of every letter.

  16. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the number of words (whitespace-separated).


  Example: `apply_rules(''.ycAbACBaz AA.'') returns 1`.


  Return only the code.'
