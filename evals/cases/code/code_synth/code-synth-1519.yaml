prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  2. Replace every value with the largest value seen so far.

  3. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  4. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  5. Sort ascending.

  6. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  7. Keep only the last 3 values, in their order (all of them if there are fewer).

  8. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Replace every value with its square.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Sort descending.

  13. Replace every value with its square.

  14. Remove every negative value.

  Then: Return the resulting list.


  Example: `apply_rules([11, 12, 5]) returns [1]`.


  Return only the code.'
