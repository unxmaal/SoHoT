  becomes ''3a1b'').

  3. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Sort the characters in ascending code point order.

  6. Remove every digit.

  7. Swap the case of every letter.

  8. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  9. Sort the characters in ascending code point order.

  10. Shift every letter forward by 12 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Swap the case of every letter.

  12. Reverse the order of the whitespace-separated words and join them with single spaces.

  13. Swap the case of every letter.

  14. Collapse every run of the same character into one character.

  15. Swap the case of every letter.

  16. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `reduce_data(''.a,cx1ccAC '') returns ''1,1.1S1V''`.


