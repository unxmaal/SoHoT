  5. Reverse the list.

  6. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  7. Add -9 to every value.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Replace every value with the largest value seen so far.

  10. Replace every value with its square.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Keep only the even values.

  13. Keep only the values greater than -1.

  14. Reverse the list.

  Then: Return the largest value, or -1 for an empty list.


  Example: `transform([15, -8, 7]) returns 16`.


  Return only the code.'
