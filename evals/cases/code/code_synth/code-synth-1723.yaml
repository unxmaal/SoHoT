prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Replace every value with its remainder after division by 3, as Python''s % gives it (never negative).

  3. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  4. Keep only the first 6 values (all of them if there are fewer).

  5. Sort ascending.

  6. Replace every value with the largest of itself and the up to 1 values before it.

  7. Replace every value with the largest value seen so far.

  8. Multiply every value by 2.

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Remove every negative value.

  11. Multiply every value by 5.

  12. Replace every value with its square.

  13. Replace every value with its absolute value.

  14. Collapse each run of equal adjacent values into one value.

  Then: Return the sum of the values (0 for an empty list).


  Example: `compute([17, 19, 20]) returns 3800`.


  Return only the code.'
