prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  2. Replace every value with the largest of itself and the up to 1 values before it.

  3. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  4. Replace every value with its absolute value.

  5. Remove every negative value.

  6. Keep only the values greater than -2.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Drop the first 1 values (an empty list if there are fewer).

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Add -1 to every value.

  11. Replace every value with its square.

  12. Sort descending.

  13. Keep only the last 3 values, in their order (all of them if there are fewer).

  14. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `compute([-9, 23, 12, 23, -5, 4, 24]) returns 0`.


  Return only the code.'
