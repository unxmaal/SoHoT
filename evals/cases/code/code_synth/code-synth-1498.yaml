prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace runs of whitespace with a single space and strip both ends.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Sort the characters in ascending code point order.

  4. Remove every digit.

  5. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  6. Replace runs of whitespace with a single space and strip both ends.

  7. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Keep only the first occurrence of each character.

  11. Replace every ''e'' with ''b'' (lowercase only).

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Swap the case of every letter.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Sort the characters in ascending code point order.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Replace every ''t'' with ''a'' (lowercase only).

  18. Swap the case of every letter.

  19. Replace runs of whitespace with a single space and strip both ends.

  20. Replace every maximal run of digits with the number of digits in it.

  Then: Return how many characters it has.


  Example: `reduce_data(''0xAy,B.,A1 0A'') returns 3`.


  Return only the code.'
