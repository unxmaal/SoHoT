  1. Sort descending.

  2. Reverse the list.

  3. Replace every value with the largest value seen so far.

  4. Replace every value with its absolute value.

  5. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  6. Keep only the last 3 values, in their order (all of them if there are fewer).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `apply_rules([-8, -5, 14, 2, 4, 23]) returns 4`.


  Return only the code.'
