prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Replace every value with the largest of itself and the up to 2 values before it.

  3. Divide every value by 2 with integer division that rounds toward zero (so -7 divided by 2 gives -3).

  4. Sort descending.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Sort ascending.

  10. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  11. Collapse each run of equal adjacent values into one value.

  12. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  13. Sort ascending.

  14. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  15. Collapse each run of equal adjacent values into one value.

  16. Keep only the last 4 values, in their order (all of them if there are fewer).

  17. Keep only the values greater than -1.

  18. Multiply every value by 5.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([23, 10, 18, 2]) returns []`.


  Return only the code.'
