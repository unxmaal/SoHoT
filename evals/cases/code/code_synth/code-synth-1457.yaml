  12. Keep only the last 4 values, in their order (all of them if there are fewer).

  13. Reverse the list.

  14. Add 4 to every value.

  15. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  16. Replace every value with its absolute value.

  Then: Return how many distinct values there are.


  Example: `solve([-1, 0, 7, 20, 19]) returns 2`.


  Return only the code.'
