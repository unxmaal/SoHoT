prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with the largest value seen so far.

  2. Replace every value with its square.

  3. Replace every value with its absolute value.

  4. Remove duplicates, keeping the first occurrence of each value.

  5. Remove every negative value.

  6. Keep only the first 2 values (all of them if there are fewer).

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Keep only the last 4 values, in their order (all of them if there are fewer).

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Keep the values at indices 0, 3, 6, and so on.

  11. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  12. Collapse each run of equal adjacent values into one value.

  13. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  14. Keep only the last 2 values, in their order (all of them if there are fewer).

  Then: Return the largest value, or -1 for an empty list.


  Example: `reduce_data([16, 18, -9, -7]) returns 145`.


  Return only the code.'
