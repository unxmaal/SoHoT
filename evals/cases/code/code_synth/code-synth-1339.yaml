prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Sort ascending.

  4. Remove every negative value.

  5. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  6. Reverse the list.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace every value with the largest of itself and the up to 2 values before it.

  9. Keep only the values greater than -2.

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Sort by absolute value, values with equal absolute value keeping their current relative order.

  12. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  13. Reverse the list.

  14. Replace every value with its square.

  15. Keep the values at indices 0, 3, 6, and so on.

  16. Replace every value with its absolute value.

  17. Reverse the list.

  18. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  19. Remove duplicates, keeping the first occurrence of each value.

  20. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `compute([-2, -4, 5, 24, 5, 2, 5, 12, -9]) returns 2`.


  Return only the code.'
