prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''mul'', ''add'', ''dup'', ''swap'': mul pops
  two values and pushes their product; add pops two values and pushes their sum; dup copies the top value
  onto the stack; swap exchanges the top two values. An operation that needs more values than the stack
  has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''add'', ''mul'', -1, 3, ''mul'', ''add'', 5]) returns [-3, 5]`.


  Return only the code.'
