prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''over'', ''dup'', ''mul'', ''add'': over pushes
  a copy of the second value from the top; dup copies the top value onto the stack; mul pops two values
  and pushes their product; add pops two values and pushes their sum. An operation that needs more values
  than the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''add'', ''mul'', ''dup'', ''mul'', ''add'', ''dup'', ''dup'', ''over'', ''over''])
  returns []`.


  Return only the code.'
