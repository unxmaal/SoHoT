prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Remove duplicates, keeping the first occurrence of each value.

  3. Keep only the values greater than -2.

  4. Keep only the even values.

  5. Sort ascending.

  6. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  7. Replace every value with its square.

  8. Remove every negative value.

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Replace every value with its square.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Replace every value with its remainder after division by 6, as Python''s % gives it (never negative).

  13. Remove every negative value.

  14. Collapse each run of equal adjacent values into one value.

  15. Add 4 to every value.

  16. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the index of the first occurrence of the largest value, or -1 for an empty list.


  Example: `run_pipeline([0, 7, 11]) returns 0`.


  Return only the code.'
