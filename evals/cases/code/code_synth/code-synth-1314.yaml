prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 4 whitespace-separated words, joined by single spaces.

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Keep only the first 3 whitespace-separated words, joined by single spaces.

  4. Replace every ''r'' with ''a'' (lowercase only).

  5. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  6. Keep only the first occurrence of each character.

  7. Convert to lowercase.

  8. Swap the case of every letter.

  9. Remove every digit.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Convert to lowercase.

  14. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  15. Replace every ''o'' with ''b'' (lowercase only).

  16. Remove every digit.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `transform(''axxC0y0 yz,A yC'') returns ''linj''`.


  Return only the code.'
