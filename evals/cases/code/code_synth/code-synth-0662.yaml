prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Sort descending.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  4. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  5. Sort ascending.

  6. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `reduce_data([5, 23, 9, 16, 17, 17]) returns [5, 13]`.


  Return only the code.'
