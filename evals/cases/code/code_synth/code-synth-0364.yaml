prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Replace every maximal run of digits with the number of digits in it.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''2x2BA.BxcxA'') returns ''1''`.


  Return only the code.'
