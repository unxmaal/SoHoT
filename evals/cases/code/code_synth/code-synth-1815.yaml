prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  2. Clamp every value into the range -4 to 1, both inclusive.

  3. Multiply every value by 5.

  4. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  5. Keep only the first 5 values (all of them if there are fewer).

  6. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  7. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives -2).

  8. Reverse the list.

  9. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Sort ascending.

  12. Collapse each run of equal adjacent values into one value.

  13. Sort descending.

  14. Reverse the list.

  15. Replace every value with the largest value seen so far.

  16. Rotate the list left by 8 positions, wrapping around (an empty list stays empty).

  17. Replace every value with its remainder after division by 4, as Python''s % gives it (never negative).

  18. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([3, 24, 23, -4, -10, -11, 2, 19]) returns [0]`.


  Return only the code.'
