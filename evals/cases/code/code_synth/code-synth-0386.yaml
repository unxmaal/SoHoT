  4. Replace every maximal run of digits with the number of digits in it.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
