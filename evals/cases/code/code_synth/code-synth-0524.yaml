  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Replace every maximal run of digits with the number of digits in it.

  4. Remove every digit.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Collapse every run of the same character into one character.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `solve(''0B1bycaxC .1b'') returns ''1B1b1y1c1x1c1 1.1b''`.


  Return only the code.'
