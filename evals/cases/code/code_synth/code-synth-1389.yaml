prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Sort by absolute value, values with equal absolute value keeping their current relative order.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Remove every value that is a multiple of 2 (0 is a multiple of everything).

  6. Replace every value with the largest value seen so far.

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Replace every value with the largest of itself and the up to 3 values before it.

  9. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  10. Multiply every value by 2.

  11. Remove every negative value.

  12. Sort by absolute value, values with equal absolute value keeping their current relative order.

  13. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  14. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `process([25, -11, 7, 10, 12]) returns [48, 130]`.


  Return only the code.'
