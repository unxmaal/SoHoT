prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Remove every digit.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Swap the case of every letter.

  5. Remove every digit.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Swap the case of every letter.

  8. Collapse every run of the same character into one character.

  9. Keep only the first occurrence of each character.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return how many characters it has.


  Example: `run_pipeline(''z z02B.c'') returns 12`.


  Return only the code.'
