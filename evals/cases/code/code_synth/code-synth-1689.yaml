prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by 5.

  2. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  3. Replace every value with its square.

  4. Keep only the even values.

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Replace every value with its absolute value.

  7. Sort ascending.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Keep the values at indices 0, 3, 6, and so on.

  12. Replace every value with the largest value seen so far.

  13. Keep the values at indices 0, 3, 6, and so on.

  14. Replace every value with its absolute value.

  15. Keep only the first 5 values (all of them if there are fewer).

  16. Remove duplicates, keeping the first occurrence of each value.

  17. Collapse each run of equal adjacent values into one value.

  18. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  Then: Return the sum of the values (0 for an empty list).


  Example: `run_pipeline([21, 23, 19, 19]) returns 0`.


  Return only the code.'
