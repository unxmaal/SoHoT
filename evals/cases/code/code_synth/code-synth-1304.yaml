prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Swap the case of every letter.

  3. Keep only the first 3 whitespace-separated words, joined by single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Keep only the first occurrence of each character.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Keep only the first occurrence of each character.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Collapse every run of the same character into one character.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''B.Bb.a2.1x'') returns ''1x11121b1.1B''`.


  Return only the code.'
