  5. Replace every value with the largest value seen so far.

  6. Sort by absolute value, values with equal absolute value keeping their current relative order.

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Replace every value with the largest value seen so far.

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Sort descending.

  11. Collapse each run of equal adjacent values into one value.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  15. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
