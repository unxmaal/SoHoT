  16. Drop the first 1 values (an empty list if there are fewer).

  17. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  18. Replace every value with its absolute value.

  19. Reverse the list.

  20. Remove duplicates, keeping the first occurrence of each value.

