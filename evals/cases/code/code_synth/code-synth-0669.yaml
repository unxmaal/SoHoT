prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Convert to uppercase.

  3. Remove every digit.

  4. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  5. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  6. Replace every ''o'' with ''b'' (lowercase only).

  7. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  8. Sort the characters in ascending code point order.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''11yaC.zB02y,x2.'') returns ''.Abde''`.


  Return only the code.'
