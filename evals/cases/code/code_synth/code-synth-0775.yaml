prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''over'', ''add'', ''swap'', ''mul'': over pushes
  a copy of the second value from the top; add pops two values and pushes their sum; swap exchanges the
  top two values; mul pops two values and pushes their product. An operation that needs more values than
  the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''mul'', ''over'', 0, ''add'', ''add'', ''swap'', ''swap'']) returns [0]`.


  Return only the code.'
