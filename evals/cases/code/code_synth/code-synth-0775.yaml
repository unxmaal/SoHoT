  - run_program(['swap', 'add', 'add', 'mul', -2]) == [-2]
  - run_program(['over', 'over', 'over', 'add', 'add', -3, 'mul', 'swap', 2]) == [-3, 2]
  - run_program([2, 9, 'swap']) == [9, 2]
  - run_program(['add', -2, 2, 'mul', 'over', 'mul']) == [-4]
  - run_program([-1, -3, 'swap', 'swap', 0, 0]) == [-1, -3, 0, 0]
