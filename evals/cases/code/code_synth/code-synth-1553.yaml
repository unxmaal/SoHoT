prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Multiply every value by -1.

  2. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  3. Multiply every value by -2.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Keep only the last 4 values, in their order (all of them if there are fewer).

  6. Sort ascending.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Replace every value with the largest of itself and the up to 1 values before it.

  10. Reverse the list.

  11. Replace every value with its absolute value.

  12. Sort ascending.

  13. Remove every negative value.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  15. Add -1 to every value.

  16. Replace every value with its square.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `reduce_data([0, -3, 20]) returns 121`.


  Return only the code.'
