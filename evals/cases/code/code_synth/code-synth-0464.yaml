  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Reverse the order of the whitespace-separated words and join them with single spaces.

  5. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  6. Convert to lowercase.

  7. Replace every ''r'' with ''c'' (lowercase only).

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `solve(''0ybACzax'') returns ''Zyxbaca1.''`.


  Return only the code.'
