prompt: 'Write a Python function `solve(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Multiply every value by 2.

  2. Keep only the values greater than 7.

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Sort ascending.

  5. Sort descending.

  6. Replace every value with the largest of itself and the up to 3 values before it.

  7. Remove duplicates, keeping the first occurrence of each value.

  8. Replace every value with its square.

  9. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  10. Sort descending.

  11. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  12. Replace every value with the largest of itself and the up to 3 values before it.

  13. Keep the values at indices 0, 3, 6, and so on.

  14. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  15. Keep the values at indices 0, 3, 6, and so on.

  16. Sort ascending.

  17. Keep only the last 4 values, in their order (all of them if there are fewer).

  18. Keep the values at indices 0, 2, 4, and so on.

  19. Remove every negative value.

  20. Keep only the values greater than 6.

  Then: Return the resulting list.


  Example: `solve([16, 23, -9, 1, -6, -10, -8]) returns [529]`.


  Return only the code.'
