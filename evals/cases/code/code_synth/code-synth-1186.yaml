prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Collapse every run of the same character into one character.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  6. Collapse every run of the same character into one character.

  7. Keep only the first occurrence of each character.

  8. Remove every digit.

  9. Keep only the first occurrence of each character.

  10. Keep only the first 4 whitespace-separated words, joined by single spaces.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Convert to uppercase.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the resulting string.


  Example: `reduce_data(''xyAA,1 z1y2BBC'') returns ''111F111E111B111C111 111,111D111A''`.


  Return only the code.'
