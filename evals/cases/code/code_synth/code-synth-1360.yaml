prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to lowercase.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Keep only the first 4 whitespace-separated words, joined by single spaces.

  7. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Collapse every run of the same character into one character.

  9. Sort the characters in ascending code point order.

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Keep only the first occurrence of each character.

  12. Remove every digit.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Keep only the first occurrence of each character.

  15. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  16. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  19. Convert to uppercase.

  20. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''y1B  c,1zc0 '') returns ''KJHG.''`.


  Return only the code.'
