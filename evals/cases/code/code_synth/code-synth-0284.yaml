prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to uppercase.

  2. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  3. Sort the characters in ascending code point order.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Replace every maximal run of digits with the number of digits in it.

  6. Convert to lowercase.

  Then: Return the resulting string.


  Example: `run_pipeline(''c..b1BAxaB'') returns ''1.3a1b1c1x''`.


  Return only the code.'
