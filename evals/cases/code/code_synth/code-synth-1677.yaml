  8. Replace every value with its absolute value.

  9. Remove every negative value.

  10. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  11. Replace every value with the largest of itself and the up to 2 values before it.

  12. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Replace every value with the largest of itself and the up to 2 values before it.

  Then: Return the resulting list.


