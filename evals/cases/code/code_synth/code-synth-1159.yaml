prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  2. Keep only the first 5 values (all of them if there are fewer).

  3. Rotate the list left by 2 positions, wrapping around (an empty list stays empty).

  4. Multiply every value by 2.

  5. Reverse the list.

  6. Replace every value with the largest of itself and the up to 3 values before it.

  7. Reverse the list.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Drop the first 1 values (an empty list if there are fewer).

  10. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  11. Keep only the values greater than 1.

  12. Sort descending.

  13. Remove every negative value.

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  15. Replace every value with its absolute value.

  16. Rotate the list left by 6 positions, wrapping around (an empty list stays empty).

  17. Sort ascending.

  18. Keep only the first 5 values (all of them if there are fewer).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `process([-5, 15, -1]) returns 0`.


  Return only the code.'
