prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Add 6 to every value.

  2. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  3. Replace every value with its square.

  4. Drop the first 1 values (an empty list if there are fewer).

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Collapse each run of equal adjacent values into one value.

  7. Multiply every value by 2.

  8. Keep only the first 6 values (all of them if there are fewer).

  9. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  10. Reverse the list.

  11. Multiply every value by 2.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  14. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  15. Multiply every value by 5.

  16. Sort by absolute value, values with equal absolute value keeping their current relative order.

  17. Keep only the last 3 values, in their order (all of them if there are fewer).

  18. Divide every value by 3 with integer division that rounds toward zero (so -7 divided by 3 gives
  -2).

  Then: Return the sum of the values (0 for an empty list).


  Example: `process([-2, 23, 22, 13, 24, 23]) returns 49068`.


  Return only the code.'
