prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Add 9 to every value.

  2. Drop the first 2 values (an empty list if there are fewer).

  3. Keep the values at indices 0, 3, 6, and so on.

  4. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  5. Collapse each run of equal adjacent values into one value.

  6. Divide every value by 4 with floor division (so -7 divided by 4 gives -2).

  7. Replace every value with its square.

  8. Replace every value with its absolute value.

  9. Sort by absolute value, values with equal absolute value keeping their current relative order.

  10. Keep only the first 3 values (all of them if there are fewer).

  11. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  12. Reverse the list.

  13. Multiply every value by 2.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  Then: Return the sum of the values (0 for an empty list).


  Example: `apply_rules([11, 8, -4, 25, 11, 9, -8, 9]) returns 4`.


  Return only the code.'
