prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Swap the case of every letter.

  6. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Remove every digit.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Swap the case of every letter.

  12. Sort the characters in ascending code point order.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Collapse every run of the same character into one character.

  15. Replace every ''b'' with ''d'' (lowercase only).

  16. Replace runs of whitespace with a single space and strip both ends.

  17. Collapse every run of the same character into one character.

  18. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  19. Reverse the order of the whitespace-separated words and join them with single spaces.

  20. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `compute(''bBC.,y cB0x0b1'') returns '',.adef''`.


  Return only the code.'
