prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Convert to uppercase.

  2. Convert to lowercase.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Keep only the first occurrence of each character.

  5. Sort the characters in ascending code point order.

  6. Convert to uppercase.

  7. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Convert to lowercase.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  11. Swap the case of every letter.

  12. Collapse every run of the same character into one character.

  13. Keep only the first 2 whitespace-separated words, joined by single spaces.

  14. Convert to uppercase.

  15. Swap the case of every letter.

  16. Remove every vowel (a, e, i, o, u, either case).

  17. Keep only the first occurrence of each character.

  18. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  19. Replace every maximal run of digits with the number of digits in it.

  20. Replace runs of whitespace with a single space and strip both ends.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''bB0b0C2C'') returns ''j3.''`.


  Return only the code.'
