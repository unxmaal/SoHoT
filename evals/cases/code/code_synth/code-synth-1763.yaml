prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Keep only the values greater than 2.

  2. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  3. Keep only the first 4 values (all of them if there are fewer).

  4. Sort ascending.

  5. Keep only the even values.

  6. Remove every value that is a multiple of 7 (0 is a multiple of everything).

  7. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  8. Replace every value with the largest value seen so far.

  9. Keep only the values greater than 0.

  10. Remove every negative value.

  11. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  12. Sort descending.

  13. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  14. Keep only the even values.

  Then: Return the resulting list.


  Example: `apply_rules([-10, -10, -3, 16, -6, 2]) returns []`.


  Return only the code.'
