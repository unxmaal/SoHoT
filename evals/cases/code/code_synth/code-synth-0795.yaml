prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''drop'', ''dup'', ''swap'', ''sub'': drop removes
  the top value; dup copies the top value onto the stack; swap exchanges the top two values; sub pops
  b then a and pushes a - b, so the value pushed first is a. An operation that needs more values than
  the stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([-1, ''sub'', ''swap'', 7, 0]) returns [-1, 7, 0]`.


  Return only the code.'
