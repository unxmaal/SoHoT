  5. Convert to lowercase.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Reverse the order of the whitespace-separated words and join them with single spaces.

  9. Replace runs of whitespace with a single space and strip both ends.

  10. Reverse the order of the whitespace-separated words and join them with single spaces.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Convert to uppercase.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Keep only the first 2 whitespace-separated words, joined by single spaces.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
