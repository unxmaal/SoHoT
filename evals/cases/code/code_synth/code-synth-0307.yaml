prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Convert to uppercase.

  4. Keep only the first 2 whitespace-separated words, joined by single spaces.

  5. Sort the characters in ascending code point order.

  6. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Convert to lowercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''B C1C Ayy'') returns ''311b121c''`.


  Return only the code.'
