prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  2. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  3. Clamp every value into the range -4 to -1, both inclusive.

  4. Sort descending.

  5. Collapse each run of equal adjacent values into one value.

  6. Replace every value with the largest of itself and the up to 3 values before it.

  Then: Return the sum of the values (0 for an empty list).


  Example: `reduce_data([2, 4, 16, -4, -5, -8, 10, 4, 12]) returns -2`.


  Return only the code.'
