  2. Replace every ''o'' with ''b'' (lowercase only).

  3. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  4. Remove every digit.

  5. Convert to uppercase.

  6. Collapse every run of the same character into one character.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Keep only the first 3 whitespace-separated words, joined by single spaces.

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Keep only the first occurrence of each character.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  15. Shift every letter forward by 5 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Convert to lowercase.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
