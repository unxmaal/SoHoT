prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Remove every vowel (a, e, i, o, u, either case).

  3. Swap the case of every letter.

  4. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  5. Keep only the first occurrence of each character.

  6. Sort the characters in ascending code point order.

  7. Collapse every run of the same character into one character.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Convert to lowercase.

  10. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  11. Collapse every run of the same character into one character.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Collapse every run of the same character into one character.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `reduce_data(''0Cz,yBcB'') returns ''d''`.


  Return only the code.'
