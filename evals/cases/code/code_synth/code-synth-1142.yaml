prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Keep only the first occurrence of each character.

  5. Replace runs of whitespace with a single space and strip both ends.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Replace every ''o'' with ''a'' (lowercase only).

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Shift every letter forward by 6 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  10. Convert to uppercase.

  11. Collapse every run of the same character into one character.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Collapse every run of the same character into one character.

  14. Sort the characters in ascending code point order.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Remove every digit.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  19. Remove every digit.

  20. Collapse every run of the same character into one character.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''z.y2CzBzc..c,AAy'') returns '',.efghi''`.


  Return only the code.'
