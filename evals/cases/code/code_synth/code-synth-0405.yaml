prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every ''b'' with ''i'' (lowercase only).

  2. Sort the characters in ascending code point order.

  3. Replace every ''t'' with ''n'' (lowercase only).

  4. Remove every digit.

  5. Collapse every run of the same character into one character.

  6. Keep only the first occurrence of each character.

  Then: Return how many characters it has.


  Example: `apply_rules('', b22,A1'') returns 4`.


  Return only the code.'
