  4. Keep only the first occurrence of each character.

  5. Collapse every run of the same character into one character.

  6. Keep only the first occurrence of each character.

  7. Remove every digit.

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Convert to uppercase.

  10. Sort the characters in ascending code point order.

  11. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Keep only the first occurrence of each character.

  13. Replace runs of whitespace with a single space and strip both ends.

  14. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Keep only the first 3 whitespace-separated words, joined by single spaces.

  17. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  18. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return the resulting string.


