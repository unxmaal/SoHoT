prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''add'', ''over'', ''drop'', ''mul'': add pops
  two values and pushes their sum; over pushes a copy of the second value from the top; drop removes the
  top value; mul pops two values and pushes their product. An operation that needs more values than the
  stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([3, ''drop'', 2, ''add'', ''mul'', ''add'']) returns [2]`.


  Return only the code.'
