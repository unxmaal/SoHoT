prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''dup'', ''swap'', ''drop'', ''over'': dup copies
  the top value onto the stack; swap exchanges the top two values; drop removes the top value; over pushes
  a copy of the second value from the top. An operation that needs more values than the stack has does
  nothing. Return the final stack as a list, bottom first.


  Example: `run_program([5, ''over'', ''dup'', -1, ''swap'', 7, ''dup'', ''dup'', ''drop'']) returns [5,
  -1, 5, 7, 7]`.


  Return only the code.'
