prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Convert to uppercase.

  6. Keep only the first 2 whitespace-separated words, joined by single spaces.

  7. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  8. Swap the case of every letter.

  9. Convert to lowercase.

  10. Replace every ''r'' with ''d'' (lowercase only).

  11. Convert to uppercase.

  12. Replace every maximal run of digits with the number of digits in it.

  13. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  14. Remove every digit.

  15. Keep only the first occurrence of each character.

  16. Replace every maximal run of digits with the number of digits in it.

  17. Swap the case of every letter.

  18. Sort the characters in ascending code point order.

  19. Collapse every run of the same character into one character.

  20. Replace every maximal run of digits with the number of digits in it.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `run_pipeline(''2z2BzB02ycb,z'') returns ''''`.


  Return only the code.'
