prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Reverse the order of the whitespace-separated words and join them with single spaces.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Collapse every run of the same character into one character.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Sort the characters in ascending code point order.

  11. Replace every ''a'' with ''l'' (lowercase only).

  12. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  13. Swap the case of every letter.

  14. Replace every maximal run of digits with the number of digits in it.

  15. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Remove every digit.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `apply_rules(''0x1b c1B,C'') returns '',''`.


  Return only the code.'
