  2. Collapse every run of the same character into one character.

  3. Remove every digit.

  4. Swap the case of every letter.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Convert to lowercase.

  7. Replace every ''b'' with ''i'' (lowercase only).

  8. Keep only the first occurrence of each character.

  9. Replace every ''n'' with ''s'' (lowercase only).

  10. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  11. Sort the characters in ascending code point order.

  12. Keep only the first 2 whitespace-separated words, joined by single spaces.

  13. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  14. Keep only the first occurrence of each character.

  15. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  16. Remove every digit.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `process(''2yy0zzyAx21B2zz'') returns ''.''`.


  Return only the code.'
