prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  2. Sort the characters in ascending code point order.

  3. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  4. Keep only the first occurrence of each character.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  8. Remove every vowel (a, e, i, o, u, either case).

  9. Sort the characters in ascending code point order.

  10. Replace every ''r'' with ''o'' (lowercase only).

  11. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  12. Remove every digit.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process(''2A.2, 22aab'') returns '',.''`.


  Return only the code.'
