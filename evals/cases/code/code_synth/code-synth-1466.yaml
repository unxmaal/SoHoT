prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Keep only the first occurrence of each character.

  3. Collapse every run of the same character into one character.

  4. Swap the case of every letter.

  5. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  6. Replace every maximal run of digits with the number of digits in it.

  7. Reverse the order of the whitespace-separated words and join them with single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Convert to uppercase.

  10. Replace every maximal run of digits with the number of digits in it.

  11. Replace every ''r'' with ''n'' (lowercase only).

  12. Remove every digit.

  13. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  14. Convert to lowercase.

  15. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  16. Replace every ''b'' with ''s'' (lowercase only).

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Remove every digit.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `reduce_data('',z2 xaa1cy By0'') returns '' ''`.


  Return only the code.'
