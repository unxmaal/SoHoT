prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Replace every value with its square.

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Remove every negative value.

  5. Sort descending.

  6. Remove every negative value.

  7. Replace every value with the largest of itself and the up to 2 values before it.

  8. Keep only the values greater than 7.

  9. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  10. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  11. Multiply every value by 5.

  12. Clamp every value into the range -5 to 1, both inclusive.

  13. Sort descending.

  14. Keep only the first 5 values (all of them if there are fewer).

  15. Reverse the list.

  16. Sort ascending.

  Then: Return the resulting list.


  Example: `reduce_data([-12, 19, 13]) returns [1, 1]`.


  Return only the code.'
