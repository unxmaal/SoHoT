prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Replace every maximal run of digits with the number of digits in it.

  2. Keep only the first occurrence of each character.

  3. Collapse every run of the same character into one character.

  4. Convert to lowercase.

  5. Cut the text to at most 5 characters, then pad it on the right with ''.'' up to 5 characters.

  6. Remove every vowel (a, e, i, o, u, either case).

  7. Keep only the first 3 whitespace-separated words, joined by single spaces.

  8. Collapse every run of the same character into one character.

  9. Cut the text to at most 6 characters, then pad it on the right with ''.'' up to 6 characters.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Shift every letter forward by 1 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Convert to uppercase.

  13. Shift every letter forward by 8 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `process(''.aAzyAC.y'') returns ''.IH...''`.


  Return only the code.'
