prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''drop'', ''swap'', ''add'', ''dup'': drop removes
  the top value; swap exchanges the top two values; add pops two values and pushes their sum; dup copies
  the top value onto the stack. An operation that needs more values than the stack has does nothing. Return
  the final stack as a list, bottom first.


  Example: `run_program([''dup'', ''add'', ''add'', ''dup'', ''dup'', ''add'', ''add'', ''drop'']) returns
  []`.


  Return only the code.'
assert:
  checks:
  - run_program(['drop', 'dup', 7]) == [7]
  - run_program([2, 1, 'dup']) == [2, 1, 1]
  - run_program([4, 'add', 'add', 'dup', 'dup', 'swap', -3, -1]) == [4, 4, 4, -3, -1]
  - run_program(['drop', 'drop', 'add', 'dup', 'swap']) == []
  - run_program(['dup', 'drop', 'add', 'drop', 3, 4, 6]) == [3, 4, 6]
  - run_program(['dup', -1, 'swap', -2, 'dup']) == [-1, -2, -2]
