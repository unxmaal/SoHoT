prompt: 'Write a Python function `run_pipeline(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  2. Collapse every run of the same character into one character.

  3. Remove every vowel (a, e, i, o, u, either case).

  4. Convert to uppercase.

  5. Keep only the first 4 whitespace-separated words, joined by single spaces.

  6. Reverse the order of the whitespace-separated words and join them with single spaces.

  7. Swap the case of every letter.

  8. Keep only the first 3 whitespace-separated words, joined by single spaces.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  11. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  13. Remove every digit.

  14. Replace every ''n'' with ''d'' (lowercase only).

  15. Replace runs of whitespace with a single space and strip both ends.

  16. Sort the characters in ascending code point order.

  17. Remove every vowel (a, e, i, o, u, either case).

  18. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `run_pipeline(''1c2 zb,b'') returns ''mllj,''`.


  Return only the code.'
