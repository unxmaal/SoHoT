prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  2. Sort descending.

  3. Replace every value with the largest of itself and the up to 2 values before it.

  4. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  5. Remove duplicates, keeping the first occurrence of each value.

  6. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  7. Remove every negative value.

  8. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  9. Collapse each run of equal adjacent values into one value.

  10. Keep only the values greater than 5.

  11. Replace every value with its absolute value.

  12. Keep only the values greater than 6.

  13. Replace every value with the largest of itself and the up to 2 values before it.

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  15. Clamp every value into the range -4 to -1, both inclusive.

  16. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  17. Multiply every value by 2.

  18. Replace every value with its square.

  Then: Return the resulting list.


  Example: `run_pipeline([-6, 17, 22, 7]) returns [0]`.


  Return only the code.'
