prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every digit.

  2. Sort the characters in ascending code point order.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Keep only the first occurrence of each character.

  7. Sort the characters in ascending code point order.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Convert to lowercase.

  10. Swap the case of every letter.

  11. Keep only the first 2 whitespace-separated words, joined by single spaces.

  12. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `reduce_data(''A1x02bA.0y'') returns ''1.1j1k1g1h''`.


  Return only the code.'
