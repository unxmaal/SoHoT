  1. Convert to lowercase.

  2. Remove every digit.

  3. Sort the characters in ascending code point order.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  6. Replace every ''l'' with ''b'' (lowercase only).

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
