prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''add'', ''mul'', ''drop'', ''swap'': add pops
  two values and pushes their sum; mul pops two values and pushes their product; drop removes the top
  value; swap exchanges the top two values. An operation that needs more values than the stack has does
  nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''drop'', ''add'', ''drop'', 6, ''add'', ''swap'', ''drop'', 0]) returns [0]`.


  Return only the code.'
