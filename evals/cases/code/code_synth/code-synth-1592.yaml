prompt: 'Write a Python function `compute(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Keep only the first occurrence of each character.

  2. Remove every digit.

  3. Convert to lowercase.

  4. Remove every digit.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Remove every digit.

  7. Keep only the first 4 whitespace-separated words, joined by single spaces.

  8. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Convert to lowercase.

  11. Remove every vowel (a, e, i, o, u, either case).

  12. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Keep only the first 3 whitespace-separated words, joined by single spaces.

  15. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  16. Remove every digit.

  17. Shift every letter forward by 2 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  18. Collapse every run of the same character into one character.

  19. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  20. Keep only the first 4 whitespace-separated words, joined by single spaces.

  Then: Return how many characters it has.


  Example: `compute(''A1cC,,zb y z'') returns 6`.


