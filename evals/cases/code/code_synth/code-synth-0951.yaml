prompt: 'Write a Python function `process(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Remove every digit.

  3. Replace runs of whitespace with a single space and strip both ends.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the resulting string.


  Example: `process(''aBxzabcA1 '') returns ''1c1b11z1x1B11''`.


  Return only the code.'
