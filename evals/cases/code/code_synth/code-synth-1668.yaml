prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Reverse the order of the whitespace-separated words and join them with single spaces.

  3. Cut the text to at most 7 characters, then pad it on the right with ''.'' up to 7 characters.

  4. Convert to lowercase.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Shift every letter forward by 9 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Remove every digit.

  8. Keep only the first occurrence of each character.

  9. Reverse the order of the whitespace-separated words and join them with single spaces.

  10. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Replace every maximal run of digits with the number of digits in it.

  14. Convert to uppercase.

  15. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  16. Collapse every run of the same character into one character.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Remove every vowel (a, e, i, o, u, either case).

  19. Reverse the order of the whitespace-separated words and join them with single spaces.

  20. Convert to lowercase.

  Then: Return how many characters it has.


  Example: `transform(''cAayBz0 yzx'') returns 11`.


  Return only the code.'
