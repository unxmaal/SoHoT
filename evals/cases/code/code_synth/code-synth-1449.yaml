prompt: 'Write a Python function `reduce_data(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  2. Sort ascending.

  3. Keep only the even values.

  4. Reverse the list.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Replace every value with its remainder after division by 5, as Python''s % gives it (never negative).

  7. Collapse each run of equal adjacent values into one value.

  8. Keep the values at indices 0, 2, 4, and so on.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Sort descending.

  11. Keep only the first 2 values (all of them if there are fewer).

  12. Clamp every value into the range 0 to 5, both inclusive.

  13. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  14. Remove duplicates, keeping the first occurrence of each value.

  15. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  16. Remove every value that is a multiple of 4 (0 is a multiple of everything).

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `reduce_data([2, -4, 11, -4, 11, -2, 23, -5]) returns 2`.


  Return only the code.'
