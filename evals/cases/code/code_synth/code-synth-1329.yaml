prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its square.

  2. Add -1 to every value.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Replace every value with the largest of itself and the up to 1 values before it.

  5. Rotate the list left by 5 positions, wrapping around (an empty list stays empty).

  6. Keep only the first 2 values (all of them if there are fewer).

  7. Sort descending.

  8. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  9. Keep only the first 6 values (all of them if there are fewer).

  10. Replace every value with its square.

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  13. Sort ascending.

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  15. Collapse each run of equal adjacent values into one value.

  16. Keep the values at indices 0, 2, 4, and so on.

  Then: Return the resulting list.


  Example: `run_pipeline([0, 6, 13, -12, -9, -2, 6, 20, 21]) returns [33920]`.


  Return only the code.'
