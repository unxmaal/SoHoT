prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Keep only the first 3 whitespace-separated words, joined by single spaces.

  2. Convert to uppercase.

  3. Convert to lowercase.

  4. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  5. Sort the characters in ascending code point order.

  6. Replace every ''c'' with ''r'' (lowercase only).

  7. Swap the case of every letter.

  8. Convert to uppercase.

  9. Sort the characters in ascending code point order.

  10. Convert to lowercase.

  11. Reverse the order of the whitespace-separated words and join them with single spaces.

  12. Keep only the first 2 whitespace-separated words, joined by single spaces.

  13. Remove every vowel (a, e, i, o, u, either case).

  14. Convert to uppercase.

  15. Keep only the first 2 whitespace-separated words, joined by single spaces.

  16. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  17. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  18. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''CA2a1c.yaz0xBAz'') returns ''1.10161121b2r1x1y2z''`.


  Return only the code.'
