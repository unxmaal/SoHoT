prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Shift every letter forward by 3 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Swap the case of every letter.

  5. Keep only the first occurrence of each character.

  6. Replace every ''a'' with ''b'' (lowercase only).

  7. Convert to uppercase.

  8. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `reduce_data(''by21,CB 1.Bz'') returns ''1ef,2be c.''`.


  Return only the code.'
