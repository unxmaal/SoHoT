prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Collapse every run of the same character into one character.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  4. Replace every ''t'' with ''n'' (lowercase only).

  5. Remove every digit.

  6. Convert to uppercase.

  7. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  8. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `reduce_data(''C1B Cab,2'') returns ''B''`.


  Return only the code.'
