  4. Swap the case of every letter.

  5. Remove every vowel (a, e, i, o, u, either case).

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Remove every digit.

  8. Convert to lowercase.

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Sort the characters in ascending code point order.

  11. Replace runs of whitespace with a single space and strip both ends.

  12. Remove every vowel (a, e, i, o, u, either case).

  13. Shift every letter forward by 4 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  14. Swap the case of every letter.

  Then: Return the resulting string.


  Example: `transform(''1aA2Cc1c0'') returns ''3G''`.


  Return only the code.'
