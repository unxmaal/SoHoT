prompt: 'Write a Python function `transform(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Reverse the order of the whitespace-separated words and join them with single spaces.

  2. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  3. Convert to uppercase.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Keep only the first 3 whitespace-separated words, joined by single spaces.

  6. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  7. Remove every digit.

  8. Replace every maximal run of digits with the number of digits in it.

  9. Convert to uppercase.

  10. Keep only the first occurrence of each character.

  11. Swap the case of every letter.

  12. Keep only the first 2 whitespace-separated words, joined by single spaces.

  Then: Return the number of words (whitespace-separated).


  Example: `transform(''2yx,xBAc,0'') returns 1`.


  Return only the code.'
