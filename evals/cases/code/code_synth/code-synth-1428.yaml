prompt: 'Write a Python function `reduce_data(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Remove every vowel (a, e, i, o, u, either case).

  2. Keep only the first occurrence of each character.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Replace runs of whitespace with a single space and strip both ends.

  5. Sort the characters in ascending code point order.

  6. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  7. Replace every maximal run of digits with the number of digits in it.

  8. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  9. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  10. Replace runs of whitespace with a single space and strip both ends.

  11. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  13. Reverse the order of the whitespace-separated words and join them with single spaces.

  14. Replace runs of whitespace with a single space and strip both ends.

  15. Convert to lowercase.

  16. Replace every ''t'' with ''s'' (lowercase only).

  17. Remove every vowel (a, e, i, o, u, either case).

  18. Swap the case of every letter.

  19. Convert to uppercase.

  20. Remove every vowel (a, e, i, o, u, either case).

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `reduce_data(''c.0 121xxAxaC1'') returns ''.3P''`.


  Return only the code.'
