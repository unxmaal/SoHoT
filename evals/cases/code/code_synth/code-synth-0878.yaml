prompt: 'Write a Python function `run_program(tokens)` for a small stack machine. `tokens` is a list whose
  items are ints (pushed onto the stack) or the strings ''over'', ''drop'', ''mul'', ''dup'': over pushes
  a copy of the second value from the top; drop removes the top value; mul pops two values and pushes
  their product; dup copies the top value onto the stack. An operation that needs more values than the
  stack has does nothing. Return the final stack as a list, bottom first.


  Example: `run_program([''drop'', 3, ''dup'', 9, ''drop'', 2]) returns [3, 3, 2]`.


  Return only the code.'
