prompt: 'Write a Python function `process(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with the largest of itself and the up to 1 values before it.

  2. Collapse each run of equal adjacent values into one value.

  3. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  4. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives -1).

  5. Multiply every value by -2.

  6. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  7. Replace every value with the largest of itself and the up to 3 values before it.

  8. Reverse the list.

  9. Replace every value with its absolute value.

  10. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  11. Remove every negative value.

  12. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  13. Remove duplicates, keeping the first occurrence of each value.

  14. Sort descending.

  15. Replace every value with the largest value seen so far.

  16. Replace every value with its square.

  Then: Return the largest value, or -1 for an empty list.


  Example: `process([-12, 2, 24, -1, -5, -2]) returns 16`.


  Return only the code.'
