prompt: 'Write a Python function `transform(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Collapse each run of equal adjacent values into one value.

  2. Reverse the list.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Multiply every value by -2.

  5. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  6. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  7. Divide every value by 3 with floor division (so -7 divided by 3 gives -3).

  8. Rotate the list left by 4 positions, wrapping around (an empty list stays empty).

  9. Keep only the even values.

  10. Collapse each run of equal adjacent values into one value.

  11. Replace every value with its absolute value.

  12. Replace every value with the largest value seen so far.

  13. Reverse the list.

  14. Remove duplicates, keeping the first occurrence of each value.

  15. Add 6 to every value.

  16. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  17. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  18. Remove every negative value.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `transform([9, 20, 4, -9, -12, 19, -12]) returns 8`.


  Return only the code.'
