prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Swap the case of every letter.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  4. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  5. Replace every maximal run of digits with the number of digits in it.

  6. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  7. Replace runs of whitespace with a single space and strip both ends.

  8. Replace every ''e'' with ''c'' (lowercase only).

  9. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  10. Sort the characters in ascending code point order.

  11. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  12. Keep only the first 4 whitespace-separated words, joined by single spaces.

  13. Convert to uppercase.

  14. Keep only the first occurrence of each character.

  15. Remove every vowel (a, e, i, o, u, either case).

  16. Reverse the order of the whitespace-separated words and join them with single spaces.

  17. Replace every maximal run of digits with the number of digits in it.

  18. Keep only the first 4 whitespace-separated words, joined by single spaces.

  19. Collapse every run of the same character into one character.

  20. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return the longest whitespace-separated word, the first one if several tie, or '''' if there are
  none.


  Example: `apply_rules(''0B2b2xBbB'') returns ''131M11''`.


  Return only the code.'
