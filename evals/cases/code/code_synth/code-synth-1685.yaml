prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Remove every negative value.

  2. Clamp every value into the range 0 to 8, both inclusive.

  3. Replace every value with its absolute value.

  4. Keep only the last 5 values, in their order (all of them if there are fewer).

  5. Collapse each run of equal adjacent values into one value.

  6. Keep only the even values.

  7. Sort ascending.

  8. Multiply every value by 2.

  9. Replace every value with the largest value seen so far.

  10. Swap each adjacent pair (indices 0 and 1, then 2 and 3, and so on); an unpaired last value stays.

  11. Keep only the even values.

  12. Replace every value with its remainder after division by 9, as Python''s % gives it (never negative).

  13. Keep only the first 2 values (all of them if there are fewer).

  14. Reverse the list.

  15. Keep only the even values.

  16. Replace every value with the largest value seen so far.

  17. Multiply every value by 5.

  18. Replace every value with the largest value seen so far.

  19. Replace every value with the largest of itself and the up to 1 values before it.

  20. Add -1 to every value.

  Then: Return the resulting list.


  Example: `compute([0, -12, -10]) returns [-1]`.


  Return only the code.'
