prompt: 'Write a Python function `solve(s)` that takes a string and applies these steps in order, each
  to the result of the one before:

  1. Remove every digit.

  2. Replace runs of whitespace with a single space and strip both ends.

  3. Sort the characters in ascending code point order.

  4. Convert to uppercase.

  5. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  6. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  7. Sort the characters in ascending code point order.

  8. Convert to lowercase.

  9. Replace every ''b'' with ''d'' (lowercase only).

  10. Replace every maximal run of digits with the number of digits in it.

  11. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  12. Collapse every run of the same character into one character.

  13. Convert to lowercase.

  14. Replace every ''c'' with ''n'' (lowercase only).

  15. Keep only the first 3 whitespace-separated words, joined by single spaces.

  16. Swap the case of every letter.

  17. Keep only the first occurrence of each character.

  18. Replace runs of whitespace with a single space and strip both ends.

  19. Reverse the characters of every whitespace-separated word, joining the words with single spaces.

  20. Shift every letter forward by 10 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  Then: Return the most frequent character, the smallest by code point if several tie, or '''' for an
  empty string.


  Example: `solve(''cb0,zaB0b'') returns '',''`.


  Return only the code.'
