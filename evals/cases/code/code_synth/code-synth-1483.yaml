prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Keep only the last 4 values, in their order (all of them if there are fewer).

  3. Sort by absolute value, values with equal absolute value keeping their current relative order.

  4. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  5. Replace the list with the differences between consecutive values, later minus earlier (a list with
  fewer than two values becomes empty).

  6. Sort descending.

  7. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  8. Keep only the first 4 values (all of them if there are fewer).

  9. Remove duplicates, keeping the first occurrence of each value.

  10. Keep only the last 5 values, in their order (all of them if there are fewer).

  11. Collapse each run of equal adjacent values into one value.

  12. Remove duplicates, keeping the first occurrence of each value.

  13. Collapse each run of equal adjacent values into one value.

  14. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  15. Rotate the list left by 9 positions, wrapping around (an empty list stays empty).

  16. Sort descending.

  Then: Return the resulting list.


  Example: `compute([-7, -4, -9, -2, -4, -1, 8, -8]) returns [1, 1]`.


  Return only the code.'
