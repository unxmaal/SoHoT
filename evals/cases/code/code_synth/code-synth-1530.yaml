prompt: 'Write a Python function `apply_rules(s)` that takes a string and applies these steps in order,
  each to the result of the one before:

  1. Sort the characters in ascending code point order.

  2. Cut the text to at most 8 characters, then pad it on the right with ''.'' up to 8 characters.

  3. Reverse the order of the whitespace-separated words and join them with single spaces.

  4. Remove every vowel (a, e, i, o, u, either case).

  5. Convert to uppercase.

  6. Replace every ''d'' with ''n'' (lowercase only).

  7. Sort the characters in ascending code point order.

  8. Replace runs of whitespace with a single space and strip both ends.

  9. Remove every digit.

  10. Remove every vowel (a, e, i, o, u, either case).

  11. Shift every letter forward by 7 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  12. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  13. Swap the case of every letter.

  14. Reverse the order of the whitespace-separated words and join them with single spaces.

  Then: Return how many characters it has.


  Example: `apply_rules(''2C.A11.2'') returns 4`.


  Return only the code.'
