  6. Replace every value with its absolute value.

  7. Remove every value that is a multiple of 3 (0 is a multiple of everything).

  8. Remove duplicates, keeping the first occurrence of each value.

  9. Replace every value with its square.

  10. Replace every value with the largest of itself and the up to 2 values before it.

  11. Keep only the even values.

  12. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  13. Keep only the last 4 values, in their order (all of them if there are fewer).

