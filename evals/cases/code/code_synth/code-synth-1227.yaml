  15. Divide every value by 4 with integer division that rounds toward zero (so -7 divided by 4 gives
  -1).

  16. Remove duplicates, keeping the first occurrence of each value.

  17. Rotate the list left by 7 positions, wrapping around (an empty list stays empty).

  18. Reverse the list.

