prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Add -1 to every value.

  2. Multiply every value by -2.

  3. Collapse each run of equal adjacent values into one value.

  4. Replace every value with the largest of itself and the up to 3 values before it.

  5. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  6. Reverse the list.

  7. Sort ascending.

  8. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  9. Sort descending.

  10. Keep only the first 6 values (all of them if there are fewer).

  11. Replace every value with the largest of itself and the up to 2 values before it.

  12. Replace every value with its remainder after division by 7, as Python''s % gives it (never negative).

  13. Keep only the last 3 values, in their order (all of them if there are fewer).

  14. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  15. Reverse the list.

  16. Replace every value with its square.

  17. Replace the list with the sums of non-overlapping consecutive pairs; a lone final value stays as
  it is.

  18. Keep only the first 6 values (all of them if there are fewer).

  19. Replace every value with the largest value seen so far.

  20. Reverse the list.

  Then: Return the lower median: the value at index (n - 1) // 2 of the sorted list, or 0 for an empty
  list.


  Example: `compute([17, -12, 20, 13, -5, 13]) returns 36`.


  Return only the code.'
