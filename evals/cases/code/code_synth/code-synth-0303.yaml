prompt: 'Write a Python function `run_pipeline(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Replace every value with its absolute value.

  2. Keep the values at indices 0, 3, 6, and so on.

  3. Remove duplicates, keeping the first occurrence of each value.

  4. Keep only the values greater than 1.

  5. Replace every value with the largest value seen so far.

  6. Keep only the values greater than -2.

  7. Sort by absolute value, values with equal absolute value keeping their current relative order.

  8. Divide every value by 2 with floor division (so -7 divided by 2 gives -4).

  9. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  10. Keep the values at indices 0, 3, 6, and so on.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `run_pipeline([1, 13, 23, -5]) returns [2]`.


  Return only the code.'
