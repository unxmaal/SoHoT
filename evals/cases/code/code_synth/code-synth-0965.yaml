  4. Swap the case of every letter.

  5. Collapse every run of the same character into one character.

  6. Cut the text to at most 9 characters, then pad it on the right with ''.'' up to 9 characters.

  7. Shift every letter forward by 11 places in the alphabet, wrapping from z to a and keeping its case;
  other characters are unchanged.

  8. Swap the case of every letter.

  Then: Return the resulting string.


