prompt: 'Write a Python function `compute(xs)` that takes a list of integers and applies these steps in
  order, each to the result of the one before:

  1. Replace every value with its square.

  2. Keep only the even values.

  3. Keep only the last 4 values, in their order (all of them if there are fewer).

  4. Remove every negative value.

  5. Replace every value with the largest value seen so far.

  6. Sort descending.

  7. Remove duplicates, keeping only the last occurrence of each value, in the order those last occurrences
  appear.

  8. Sort ascending.

  9. Replace the list with its running sums (the value at index i becomes the sum of the values at indices
  0 to i).

  10. Replace every value with its remainder after division by 8, as Python''s % gives it (never negative).

  11. Remove duplicates, keeping the first occurrence of each value.

  12. Keep only the first 5 values (all of them if there are fewer).

  13. Sort by absolute value, values with equal absolute value keeping their current relative order.

  14. Collapse each run of equal adjacent values into one value.

  15. Reverse the list.

  16. Sort descending.

  Then: Return a list of the two smallest values in ascending order (fewer if there are fewer).


  Example: `compute([24, 1, 1, 17, 5, -11]) returns [0]`.


  Return only the code.'
