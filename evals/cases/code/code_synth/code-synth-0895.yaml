  3. Keep only the first occurrence of each character.

  4. Capitalize every whitespace-separated word (first letter upper case, the rest lower case), joining
  the words with single spaces.

  5. Convert to lowercase.

  6. Collapse every run of the same character into one character.

  7. Keep only the first 3 whitespace-separated words, joined by single spaces.

  8. Convert to lowercase.

  9. Remove every vowel (a, e, i, o, u, either case).

  10. Run-length encode: every run of one character becomes its length then the character (so ''aaab''
  becomes ''3a1b'').

  Then: Return how many characters it has.


  Example: `solve('' ,2x0,10AaA1bC1b'') returns 14`.


