prompt: 'Write a Python function `apply_rules(xs)` that takes a list of integers and applies these steps
  in order, each to the result of the one before:

  1. Remove duplicates, keeping the first occurrence of each value.

  2. Remove every negative value.

  3. Collapse each run of equal adjacent values into one value.

  4. Keep only the first 2 values (all of them if there are fewer).

  5. Remove every negative value.

  6. Reverse the list.

  Then: Return the second largest distinct value, or None if there are fewer than two distinct values.


  Example: `apply_rules([25, 11, 1, 9, 8, 0, 10, 17]) returns 11`.


