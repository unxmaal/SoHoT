prompt: "Write a Python function `find_close_elements_lists(list_of_lists: List[List[float]], threshold:\
  \ float)`. Given a list of lists of floats, determine if there exists any list where at least two numbers\
  \ are closer to each other than a given threshold. If such a list exists, return the indices of the\
  \ lists where this condition is met. If no such list exists, return an empty list.\n\nBuild it on this\
  \ helper, and include the helper unchanged in your answer:\n\n```python\nfrom typing import List\n\n\
  \ndef has_close_elements(numbers: List[float], threshold: float) -> bool:\n    \"\"\" Check if in given\
  \ list of numbers, are any two numbers closer to each other than\n    given threshold.\n    >>> has_close_elements([1.0,\
  \ 2.0, 3.0], 0.5)\n    False\n    >>> has_close_elements([1.0, 2.8, 3.0, 4.0, 5.0, 2.0], 0.3)\n    True\n\
  \    \"\"\"\n    for idx, elem in enumerate(numbers):\n        for idx2, elem2 in enumerate(numbers):\n\
  \            if idx != idx2:\n                distance = abs(elem - elem2)\n                if distance\
  \ < threshold:\n                    return True\n\n    return False\n```\n\nReturn only the code."
