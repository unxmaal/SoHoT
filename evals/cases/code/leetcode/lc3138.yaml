prompt: "You are given a string s, which is known to be a concatenation of anagrams of some string t.\n\
  Return the minimum possible length of the string t.\nAn anagram is formed by rearranging the letters\
  \ of a string. For example, \"aab\", \"aba\", and, \"baa\" are anagrams of \"aab\".\n \nExample 1:\n\
  \nInput: s = \"abba\"\nOutput: 2\nExplanation:\nOne possible string t could be \"ba\".\n\nExample 2:\n\
  \nInput: s = \"cdef\"\nOutput: 4\nExplanation:\nOne possible string t could be \"cdef\", notice that\
  \ t can be equal to s.\n\nExample 2:\n\nInput: s = \"abcbcacabbaccba\"\nOutput: 3\n\n \nConstraints:\n\
  \n1 <= s.length <= 105\ns consist only of lowercase English letters.\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minAnagramLength(self,\
  \ s: str) -> int:\n```\n\nReturn only the code."
