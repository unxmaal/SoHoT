modality: code
prompt: "You are given three integers m, n, and k.\nThere is a rectangular grid of size m × n containing\
  \ k identical pieces. Return the sum of Manhattan distances between every pair of pieces over all valid\
  \ arrangements of pieces.\nA valid arrangement is a placement of all k pieces on the grid with at most\
  \ one piece per cell.\nSince the answer may be very large, return it modulo 109 + 7.\nThe Manhattan\
  \ Distance between two cells (xi, yi) and (xj, yj) is |xi - xj| + |yi - yj|.\n \nExample 1:\n\nInput:\
  \ m = 2, n = 2, k = 2\nOutput: 8\nExplanation:\nThe valid arrangements of pieces on the board are:\n\
  \n\nIn the first 4 arrangements, the Manhattan distance between the two pieces is 1.\nIn the last 2\
  \ arrangements, the Manhattan distance between the two pieces is 2.\n\nThus, the total Manhattan distance\
  \ across all valid arrangements is 1 + 1 + 1 + 1 + 2 + 2 = 8.\n\nExample 2:\n\nInput: m = 1, n = 4,\
  \ k = 3\nOutput: 20\nExplanation:\nThe valid arrangements of pieces on the board are:\n\n\nThe first\
  \ and last arrangements have a total Manhattan distance of 1 + 1 + 2 = 4.\nThe middle two arrangements\
  \ have a total Manhattan distance of 1 + 2 + 3 = 6.\n\nThe total Manhattan distance between all pairs\
  \ of pieces across all arrangements is 4 + 6 + 6 + 4 = 20.\n\n \nConstraints:\n\n1 <= m, n <= 105\n\
  2 <= m * n <= 105\n2 <= k <= m * n\n\nWrite the solution in Python as this class, with any imports it\
  \ needs:\n\n```python\nclass Solution:\n    def distanceSum(self, m: int, n: int, k: int) -> int:\n\
  ```\n\nReturn only the code."
