  - Solution().countWinningSequences(s='WFWFWFWFWFWFWFWFWFWF') == 730500
  - Solution().countWinningSequences(s='WFW') == 6
  - Solution().countWinningSequences(s='FWEFWEFW') == 157
  - Solution().countWinningSequences(s='FWFWFWFWFWFWFWFWFWFW') == 730500
  - Solution().countWinningSequences(s='EWE') == 6
  - Solution().countWinningSequences(s='WFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF')
    == 377759202
  - Solution().countWinningSequences(s='EEEEEEEEEEEE') == 2364
  - Solution().countWinningSequences(s='FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFWE')
    == 697784136
  - Solution().countWinningSequences(s='FWEFWFWFEF') == 671
  - Solution().countWinningSequences(s='EFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF')
    == 942021245
