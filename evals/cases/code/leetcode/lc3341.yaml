id: lc3341
modality: code
prompt: "There is a dungeon with n x m rooms arranged as a grid.\nYou are given a 2D array moveTime of\
  \ size n x m, where moveTime[i][j] represents the minimum time in seconds when you can start moving\
  \ to that room. You start from the room (0, 0) at time t = 0 and can move to an adjacent room. Moving\
  \ between adjacent rooms takes exactly one second.\nReturn the minimum time to reach the room (n - 1,\
  \ m - 1).\nTwo rooms are adjacent if they share a common wall, either horizontally or vertically.\n\
   \nExample 1:\n\nInput: moveTime = [[0,4],[4,4]]\nOutput: 6\nExplanation:\nThe minimum time required\
  \ is 6 seconds.\n\nAt time t == 4, move from room (0, 0) to room (1, 0) in one second.\nAt time t ==\
  \ 5, move from room (1, 0) to room (1, 1) in one second.\n\n\nExample 2:\n\nInput: moveTime = [[0,0,0],[0,0,0]]\n\
  Output: 3\nExplanation:\nThe minimum time required is 3 seconds.\n\nAt time t == 0, move from room (0,\
  \ 0) to room (1, 0) in one second.\nAt time t == 1, move from room (1, 0) to room (1, 1) in one second.\n\
  At time t == 2, move from room (1, 1) to room (1, 2) in one second.\n\n\nExample 3:\n\nInput: moveTime\
  \ = [[0,1],[1,2]]\nOutput: 3\n\n \nConstraints:\n\n2 <= n == moveTime.length <= 50\n2 <= m == moveTime[i].length\
  \ <= 50\n0 <= moveTime[i][j] <= 109\n\nWrite the solution in Python as this class, with any imports\
  \ it needs:\n\n```python\nclass Solution:\n    def minTimeToReach(self, moveTime: List[List[int]]) ->\
  \ int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minTimeToReach(moveTime=[[0, 2, 3], [3, 1, 1], [2, 1, 3]]) == 6
  - Solution().minTimeToReach(moveTime=[[0, 1], [1, 2]]) == 3
  - Solution().minTimeToReach(moveTime=[[0, 1000000000], [1000000000, 0]]) == 1000000002
  - Solution().minTimeToReach(moveTime=[[0, 2, 3], [1, 2, 4], [3, 4, 5]]) == 6
  - Solution().minTimeToReach(moveTime=[[0, 0], [0, 1000000000], [1000000000, 1000000000]]) == 1000000002
  - Solution().minTimeToReach(moveTime=[[0, 2, 3], [3, 4, 1], [5, 0, 1]]) == 6
  - Solution().minTimeToReach(moveTime=[[0, 0, 0], [0, 0, 0]]) == 3
  - Solution().minTimeToReach(moveTime=[[0, 10, 15], [5, 1, 20], [1, 1, 1]]) == 9
  - Solution().minTimeToReach(moveTime=[[0, 10, 15], [5, 20, 25], [10, 5, 0]]) == 13
  - Solution().minTimeToReach(moveTime=[[0, 2, 4, 6], [1, 3, 5, 7], [8, 10, 12, 14], [9, 11, 13, 15]])
    == 16
