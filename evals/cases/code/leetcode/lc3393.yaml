  - Solution().countPathsWithXorValue(grid=[[1, 3, 3, 3], [0, 3, 3, 2], [3, 0, 1, 1]], k=2) == 5
  - Solution().countPathsWithXorValue(grid=[[15, 15], [15, 15]], k=14) == 0
  - Solution().countPathsWithXorValue(grid=[[1], [1], [1]], k=1) == 1
  - Solution().countPathsWithXorValue(grid=[[1]], k=1) == 1
  - Solution().countPathsWithXorValue(grid=[[0]], k=0) == 1
  - Solution().countPathsWithXorValue(grid=[[1, 2, 3], [4, 5, 6], [7, 8, 9]], k=15) == 2
  - Solution().countPathsWithXorValue(grid=[[0, 0, 0], [0, 0, 0], [0, 0, 0]], k=0) == 6
  - Solution().countPathsWithXorValue(grid=[[1, 2], [3, 4]], k=7) == 1
  - Solution().countPathsWithXorValue(grid=[[1, 1, 1], [1, 1, 1], [1, 1, 1]], k=3) == 0
  - Solution().countPathsWithXorValue(grid=[[1, 1, 1, 2], [3, 0, 3, 2], [3, 0, 2, 2]], k=10) == 0
