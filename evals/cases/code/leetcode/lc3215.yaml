id: lc3215
modality: code
prompt: "Given three integer arrays a, b, and c, return the number of triplets (a[i], b[j], c[k]), such\
  \ that the bitwise XOR between the elements of each triplet has an even number of set bits.\n \nExample\
  \ 1:\n\nInput: a = [1], b = [2], c = [3]\nOutput: 1\nExplanation:\nThe only triplet is (a[0], b[0],\
  \ c[0]) and their XOR is: 1 XOR 2 XOR 3 = 002.\n\nExample 2:\n\nInput: a = [1,1], b = [2,3], c = [1,5]\n\
  Output: 4\nExplanation:\nConsider these four triplets:\n\n(a[0], b[1], c[0]): 1 XOR 3 XOR 1 = 0112\n\
  (a[1], b[1], c[0]): 1 XOR 3 XOR 1 = 0112\n(a[0], b[0], c[1]): 1 XOR 2 XOR 5 = 1102\n(a[1], b[0], c[1]):\
  \ 1 XOR 2 XOR 5 = 1102\n\n\n \nConstraints:\n\n1 <= a.length, b.length, c.length <= 105\n0 <= a[i],\
  \ b[i], c[i] <= 109\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def tripletCount(self, a: List[int], b: List[int], c: List[int]) -> int:\n```\n\
  \nReturn only the code."
assert:
  checks:
  - Solution().tripletCount(a=[10, 20, 30], b=[15, 25, 35], c=[5, 10, 15]) == 9
  - Solution().tripletCount(a=[1, 3, 5], b=[2, 4, 6], c=[7, 8, 9]) == 14
  - Solution().tripletCount(a=[1000000000], b=[1000000000], c=[1000000000]) == 0
  - Solution().tripletCount(a=[2, 4, 6], b=[1, 3, 5], c=[0, 2, 4]) == 14
  - Solution().tripletCount(a=[0, 0, 0], b=[0, 0, 0], c=[0, 0, 0]) == 27
  - Solution().tripletCount(a=[1, 2, 3, 4, 5], b=[6, 7, 8, 9, 10], c=[11, 12, 13, 14, 15]) == 63
  - Solution().tripletCount(a=[0, 1, 2], b=[3, 4, 5], c=[6, 7, 8]) == 14
  - Solution().tripletCount(a=[1], b=[2], c=[3]) == 1
  - Solution().tripletCount(a=[10, 11, 12], b=[13, 14, 15], c=[16, 17, 18]) == 13
  - Solution().tripletCount(a=[1, 1], b=[2, 3], c=[1, 5]) == 4
