id: lc3121
modality: code
prompt: "You are given a string word. A letter c is called special if it appears both in lowercase and\
  \ uppercase in word, and every lowercase occurrence of c appears before the first uppercase occurrence\
  \ of c.\nReturn the number of special letters in word.\n \nExample 1:\n\nInput: word = \"aaAbcBC\"\n\
  Output: 3\nExplanation:\nThe special characters are 'a', 'b', and 'c'.\n\nExample 2:\n\nInput: word\
  \ = \"abc\"\nOutput: 0\nExplanation:\nThere are no special characters in word.\n\nExample 3:\n\nInput:\
  \ word = \"AbBCab\"\nOutput: 0\nExplanation:\nThere are no special characters in word.\n\n \nConstraints:\n\
  \n1 <= word.length <= 2 * 105\nword consists of only lowercase and uppercase English letters.\n\nWrite\
  \ the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n \
  \   def numberOfSpecialChars(self, word: str) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().numberOfSpecialChars(word='aAbBcCdDeEfFgG') == 7
  - Solution().numberOfSpecialChars(word='AaBbCc') == 0
  - Solution().numberOfSpecialChars(word='aabbCC') == 0
  - Solution().numberOfSpecialChars(word='Aabbcc') == 0
  - Solution().numberOfSpecialChars(word='abABcdCD') == 4
  - Solution().numberOfSpecialChars(word='zZaA') == 2
  - Solution().numberOfSpecialChars(word='aAbBcC') == 3
  - Solution().numberOfSpecialChars(word='aAb') == 1
  - Solution().numberOfSpecialChars(word='abcABC') == 3
  - Solution().numberOfSpecialChars(word='ZzYyXxWwVvUuTtSsRrQqPpOoNnMmLlKkJjIiHhGgFfEeDdCcBbAa') == 0
