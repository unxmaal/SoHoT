id: lc3100
modality: code
prompt: "You are given two integers numBottles and numExchange.\nnumBottles represents the number of full\
  \ water bottles that you initially have. In one operation, you can perform one of the following operations:\n\
  \nDrink any number of full water bottles turning them into empty bottles.\nExchange numExchange empty\
  \ bottles with one full water bottle. Then, increase numExchange by one.\n\nNote that you cannot exchange\
  \ multiple batches of empty bottles for the same value of numExchange. For example, if numBottles ==\
  \ 3 and numExchange == 1, you cannot exchange 3 empty water bottles for 3 full bottles.\nReturn the\
  \ maximum number of water bottles you can drink.\n \nExample 1:\n\n\nInput: numBottles = 13, numExchange\
  \ = 6\nOutput: 15\nExplanation: The table above shows the number of full water bottles, empty water\
  \ bottles, the value of numExchange, and the number of bottles drunk.\n\nExample 2:\n\n\nInput: numBottles\
  \ = 10, numExchange = 3\nOutput: 13\nExplanation: The table above shows the number of full water bottles,\
  \ empty water bottles, the value of numExchange, and the number of bottles drunk.\n\n \nConstraints:\n\
  \n1 <= numBottles <= 100 \n1 <= numExchange <= 100\n\nWrite the solution in Python as this class, with\
  \ any imports it needs:\n\n```python\nclass Solution:\n    def maxBottlesDrunk(self, numBottles: int,\
  \ numExchange: int) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().maxBottlesDrunk(numBottles=10, numExchange=3) == 13
  - Solution().maxBottlesDrunk(numBottles=2, numExchange=3) == 2
  - Solution().maxBottlesDrunk(numBottles=13, numExchange=6) == 15
  - Solution().maxBottlesDrunk(numBottles=100, numExchange=1) == 114
  - Solution().maxBottlesDrunk(numBottles=5, numExchange=5) == 6
  - Solution().maxBottlesDrunk(numBottles=1, numExchange=1) == 2
  - Solution().maxBottlesDrunk(numBottles=20, numExchange=4) == 24
  - Solution().maxBottlesDrunk(numBottles=50, numExchange=10) == 54
  - Solution().maxBottlesDrunk(numBottles=1, numExchange=100) == 1
  - Solution().maxBottlesDrunk(numBottles=1, numExchange=10) == 1
