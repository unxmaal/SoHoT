prompt: "You are given two strings, coordinate1 and coordinate2, representing the coordinates of a square\
  \ on an 8 x 8 chessboard.\nBelow is the chessboard for reference.\n\nReturn true if these two squares\
  \ have the same color and false otherwise.\nThe coordinate will always represent a valid chessboard\
  \ square. The coordinate will always have the letter first (indicating its column), and the number second\
  \ (indicating its row).\n \nExample 1:\n\nInput: coordinate1 = \"a1\", coordinate2 = \"c3\"\nOutput:\
  \ true\nExplanation:\nBoth squares are black.\n\nExample 2:\n\nInput: coordinate1 = \"a1\", coordinate2\
  \ = \"h3\"\nOutput: false\nExplanation:\nSquare \"a1\" is black and \"h3\" is white.\n\n \nConstraints:\n\
  \ncoordinate1.length == coordinate2.length == 2\n'a' <= coordinate1[0], coordinate2[0] <= 'h'\n'1' <=\
  \ coordinate1[1], coordinate2[1] <= '8'\n\nWrite the solution in Python as this class, with any imports\
  \ it needs:\n\n```python\nclass Solution:\n    def checkTwoChessboards(self, coordinate1: str, coordinate2:\
  \ str) -> bool:\n```\n\nReturn only the code."
assert:
