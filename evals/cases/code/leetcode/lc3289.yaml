modality: code
prompt: "In the town of Digitville, there was a list of numbers called nums containing integers from 0\
  \ to n - 1. Each number was supposed to appear exactly once in the list, however, two mischievous numbers\
  \ sneaked in an additional time, making the list longer than usual.\nAs the town detective, your task\
  \ is to find these two sneaky numbers. Return an array of size two containing the two numbers (in any\
  \ order), so peace can return to Digitville.\n \nExample 1:\n\nInput: nums = [0,1,1,0]\nOutput: [0,1]\n\
  Explanation:\nThe numbers 0 and 1 each appear twice in the array.\n\nExample 2:\n\nInput: nums = [0,3,2,1,3,2]\n\
  Output: [2,3]\nExplanation: \nThe numbers 2 and 3 each appear twice in the array.\n\nExample 3:\n\n\
  Input: nums = [7,1,5,4,3,4,6,0,9,5,8,2]\nOutput: [4,5]\nExplanation: \nThe numbers 4 and 5 each appear\
  \ twice in the array.\n\n \nConstraints:\n\n2 <= n <= 100\nnums.length == n + 2\n0 <= nums[i] < n\n\
  The input is generated such that nums contains exactly two repeated elements.\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def getSneakyNumbers(self,\
  \ nums: List[int]) -> List[int]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().getSneakyNumbers(nums=[5, 5, 3, 2, 1, 4, 0]) == [5]
  - Solution().getSneakyNumbers(nums=[7, 1, 5, 4, 3, 4, 6, 0, 9, 5, 8, 2]) == [5, 4]
  - Solution().getSneakyNumbers(nums=[0, 1, 1, 0]) == [0, 1]
  - Solution().getSneakyNumbers(nums=[2, 2, 0, 1]) == [2]
  - Solution().getSneakyNumbers(nums=[5, 5, 3, 0, 2, 1, 4, 4]) == [5, 4]
  - Solution().getSneakyNumbers(nums=[9, 8, 7, 6, 5, 4, 3, 2, 1, 0, 0, 9]) == [9, 0]
  - Solution().getSneakyNumbers(nums=[9, 8, 7, 6, 5, 4, 3, 2, 1, 0, 0, 1]) == [1, 0]
  - Solution().getSneakyNumbers(nums=[5, 5, 4, 3, 2, 1, 0, 0]) == [5, 0]
  - Solution().getSneakyNumbers(nums=[5, 4, 3, 2, 1, 0, 0, 1]) == [1, 0]
  - Solution().getSneakyNumbers(nums=[2, 0, 1, 1, 0, 3]) == [0, 1]
