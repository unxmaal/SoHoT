id: lc3192
modality: code
prompt: "You are given a binary array nums.\nYou can do the following operation on the array any number\
  \ of times (possibly zero):\n\nChoose any index i from the array and flip all the elements from index\
  \ i to the end of the array.\n\nFlipping an element means changing its value from 0 to 1, and from 1\
  \ to 0.\nReturn the minimum number of operations required to make all elements in nums equal to 1.\n\
   \nExample 1:\n\nInput: nums = [0,1,1,0,1]\nOutput: 4\nExplanation:\nWe can do the following operations:\n\
  \nChoose the index i = 1. The resulting array will be nums = [0,0,0,1,0].\nChoose the index i = 0. The\
  \ resulting array will be nums = [1,1,1,0,1].\nChoose the index i = 4. The resulting array will be nums\
  \ = [1,1,1,0,0].\nChoose the index i = 3. The resulting array will be nums = [1,1,1,1,1].\n\n\nExample\
  \ 2:\n\nInput: nums = [1,0,0,0]\nOutput: 1\nExplanation:\nWe can do the following operation:\n\nChoose\
  \ the index i = 1. The resulting array will be nums = [1,1,1,1].\n\n\n \nConstraints:\n\n1 <= nums.length\
  \ <= 105\n0 <= nums[i] <= 1\n\nWrite the solution in Python as this class, with any imports it needs:\n\
  \n```python\nclass Solution:\n    def minOperations(self, nums: List[int]) -> int:\n```\n\nReturn only\
  \ the code."
assert:
  checks:
  - Solution().minOperations(nums=[0, 1, 0, 1, 0, 1]) == 6
  - Solution().minOperations(nums=[1, 0, 1, 0, 1]) == 4
  - Solution().minOperations(nums=[0, 1, 0, 1, 0]) == 5
  - Solution().minOperations(nums=[0, 0, 1, 1, 1, 0]) == 3
  - Solution().minOperations(nums=[1, 0, 1, 0, 1, 0, 1, 0, 1]) == 8
  - Solution().minOperations(nums=[1]) == 0
  - Solution().minOperations(nums=[1, 1, 0, 0, 1, 1, 0, 0]) == 3
  - Solution().minOperations(nums=[1, 0, 0, 0]) == 1
  - Solution().minOperations(nums=[0, 0, 0, 0, 0]) == 1
  - Solution().minOperations(nums=[1, 0, 0, 1, 0, 0]) == 3
