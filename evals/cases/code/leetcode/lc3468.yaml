id: lc3468
modality: code
prompt: "You are given an array original of length n and a 2D array bounds of length n x 2, where bounds[i]\
  \ = [ui, vi].\nYou need to find the number of possible arrays copy of length n such that:\n\n(copy[i]\
  \ - copy[i - 1]) == (original[i] - original[i - 1]) for 1 <= i <= n - 1.\nui <= copy[i] <= vi for 0\
  \ <= i <= n - 1.\n\nReturn the number of such arrays.\n \nExample 1:\n\nInput: original = [1,2,3,4],\
  \ bounds = [[1,2],[2,3],[3,4],[4,5]]\nOutput: 2\nExplanation:\nThe possible arrays are:\n\n[1, 2, 3,\
  \ 4]\n[2, 3, 4, 5]\n\n\nExample 2:\n\nInput: original = [1,2,3,4], bounds = [[1,10],[2,9],[3,8],[4,7]]\n\
  Output: 4\nExplanation:\nThe possible arrays are:\n\n[1, 2, 3, 4]\n[2, 3, 4, 5]\n[3, 4, 5, 6]\n[4, 5,\
  \ 6, 7]\n\n\nExample 3:\n\nInput: original = [1,2,1,2], bounds = [[1,1],[2,3],[3,3],[2,3]]\nOutput:\
  \ 0\nExplanation:\nNo array is possible.\n\n \nConstraints:\n\n2 <= n == original.length <= 105\n1 <=\
  \ original[i] <= 109\nbounds.length == n\nbounds[i].length == 2\n1 <= bounds[i][0] <= bounds[i][1] <=\
  \ 109\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass\
  \ Solution:\n    def countArrays(self, original: List[int], bounds: List[List[int]]) -> int:\n```\n\n\
  Return only the code."
assert:
  checks:
  - Solution().countArrays(original=[1, 2, 3, 4], bounds=[[1, 10], [2, 9], [3, 8], [4, 7]]) == 4
  - Solution().countArrays(original=[3, 5, 7, 9], bounds=[[2, 4], [4, 6], [6, 8], [8, 10]]) == 3
  - Solution().countArrays(original=[10, 11, 12, 13], bounds=[[8, 10], [9, 11], [10, 12], [11, 13]]) ==
    3
  - Solution().countArrays(original=[5, 7, 9, 11], bounds=[[4, 6], [6, 8], [8, 10], [10, 12]]) == 3
  - Solution().countArrays(original=[2, 2, 2, 2], bounds=[[1, 3], [1, 3], [1, 3], [1, 3]]) == 3
  - Solution().countArrays(original=[3, 2, 1], bounds=[[1, 3], [1, 3], [1, 3]]) == 1
  - Solution().countArrays(original=[5, 6, 7, 8], bounds=[[5, 5], [6, 6], [7, 7], [8, 8]]) == 1
  - Solution().countArrays(original=[5, 6, 7, 8], bounds=[[3, 5], [4, 6], [5, 7], [6, 8]]) == 3
  - Solution().countArrays(original=[1, 3, 5, 7], bounds=[[1, 2], [3, 4], [5, 6], [7, 8]]) == 2
  - Solution().countArrays(original=[1, 3, 2, 4], bounds=[[1, 3], [2, 4], [1, 3], [2, 4]]) == 1
