prompt: "We call an array arr of length n consecutive if one of the following holds:\n\narr[i] - arr[i\
  \ - 1] == 1 for all 1 <= i < n.\narr[i] - arr[i - 1] == -1 for all 1 <= i < n.\n\nThe value of an array\
  \ is the sum of its elements.\nFor example, [3, 4, 5] is a consecutive array of value 12 and [9, 8]\
  \ is another of value 17. While [3, 4, 3] and [8, 6] are not consecutive.\nGiven an array of integers\
  \ nums, return the sum of the values of all consecutive non-empty subsequences.\nSince the answer may\
  \ be very large, return it modulo 109 + 7.\nNote that an array of length 1 is also considered consecutive.\n\
   \nExample 1:\n\nInput: nums = [1,2]\nOutput: 6\nExplanation:\nThe consecutive subsequences are: [1],\
  \ [2], [1, 2].\n\nExample 2:\n\nInput: nums = [1,4,2,3]\nOutput: 31\nExplanation:\nThe consecutive subsequences\
  \ are: [1], [4], [2], [3], [1, 2], [2, 3], [4, 3], [1, 2, 3].\n\n \nConstraints:\n\n1 <= nums.length\
  \ <= 105\n1 <= nums[i] <= 105\n\nWrite the solution in Python as this class, with any imports it needs:\n\
  \n```python\nclass Solution:\n    def getSum(self, nums: List[int]) -> int:\n```\n\nReturn only the\
  \ code."
assert:
