  - Solution().getSum(nums=[1, 2, 4, 3, 5, 6, 7, 8, 10, 9, 11, 12]) == 520
  - Solution().getSum(nums=[1, 3, 5, 7, 9]) == 25
  - Solution().getSum(nums=[8, 6]) == 14
  - Solution().getSum(nums=[1, 4, 2, 3]) == 31
  - Solution().getSum(nums=[1]) == 1
  - Solution().getSum(nums=[1, 2, 4, 5, 6, 8, 9, 10]) == 146
  - Solution().getSum(nums=[3, 4, 5]) == 40
