prompt: "You are given an array nums, where each number in the array appears either once or twice.\nReturn\
  \ the bitwise XOR of all the numbers that appear twice in the array, or 0 if no number appears twice.\n\
   \nExample 1:\n\nInput: nums = [1,2,1,3]\nOutput: 1\nExplanation:\nThe only number that appears twice\
  \ in nums is 1.\n\nExample 2:\n\nInput: nums = [1,2,3]\nOutput: 0\nExplanation:\nNo number appears twice\
  \ in nums.\n\nExample 3:\n\nInput: nums = [1,2,2,1]\nOutput: 3\nExplanation:\nNumbers 1 and 2 appeared\
  \ twice. 1 XOR 2 == 3.\n\n \nConstraints:\n\n1 <= nums.length <= 50\n1 <= nums[i] <= 50\nEach number\
  \ in nums appears either once or twice.\n\nWrite the solution in Python as this class, with any imports\
  \ it needs:\n\n```python\nclass Solution:\n    def duplicateNumbersXOR(self, nums: List[int]) -> int:\n\
  ```\n\nReturn only the code."
