prompt: "You are given a positive integer n.\nA binary string x is valid if all substrings of x of length\
  \ 2 contain at least one \"1\".\nReturn all valid strings with length n, in any order.\n \nExample 1:\n\
  \nInput: n = 3\nOutput: [\"010\",\"011\",\"101\",\"110\",\"111\"]\nExplanation:\nThe valid strings of\
  \ length 3 are: \"010\", \"011\", \"101\", \"110\", and \"111\".\n\nExample 2:\n\nInput: n = 1\nOutput:\
  \ [\"0\",\"1\"]\nExplanation:\nThe valid strings of length 1 are: \"0\" and \"1\".\n\n \nConstraints:\n\
  \n1 <= n <= 18\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def validStrings(self, n: int) -> List[str]:\n```\n\nReturn only the code."
