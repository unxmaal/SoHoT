id: lc3478
modality: code
prompt: "You are given two integer arrays, nums1 and nums2, both of length n, along with a positive integer\
  \ k.\nFor each index i from 0 to n - 1, perform the following:\n\nFind all indices j where nums1[j]\
  \ is less than nums1[i].\nChoose at most k values of nums2[j] at these indices to maximize the total\
  \ sum.\n\nReturn an array answer of size n, where answer[i] represents the result for the corresponding\
  \ index i.\n \nExample 1:\n\nInput: nums1 = [4,2,1,5,3], nums2 = [10,20,30,40,50], k = 2\nOutput: [80,30,0,80,50]\n\
  Explanation:\n\nFor i = 0: Select the 2 largest values from nums2 at indices [1, 2, 4] where nums1[j]\
  \ < nums1[0], resulting in 50 + 30 = 80.\nFor i = 1: Select the 2 largest values from nums2 at index\
  \ [2] where nums1[j] < nums1[1], resulting in 30.\nFor i = 2: No indices satisfy nums1[j] < nums1[2],\
  \ resulting in 0.\nFor i = 3: Select the 2 largest values from nums2 at indices [0, 1, 2, 4] where nums1[j]\
  \ < nums1[3], resulting in 50 + 30 = 80.\nFor i = 4: Select the 2 largest values from nums2 at indices\
  \ [1, 2] where nums1[j] < nums1[4], resulting in 30 + 20 = 50.\n\n\nExample 2:\n\nInput: nums1 = [2,2,2,2],\
  \ nums2 = [3,1,2,3], k = 1\nOutput: [0,0,0,0]\nExplanation:\nSince all elements in nums1 are equal,\
  \ no indices satisfy the condition nums1[j] < nums1[i] for any i, resulting in 0 for all positions.\n\
  \n \nConstraints:\n\nn == nums1.length == nums2.length\n1 <= n <= 105\n1 <= nums1[i], nums2[i] <= 106\n\
  1 <= k <= n\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def findMaxSum(self, nums1: List[int], nums2: List[int], k: int) -> List[int]:\n\
  ```\n\nReturn only the code."
assert:
  checks:
  - Solution().findMaxSum(nums1=[10, 20, 30, 40, 50], nums2=[50, 40, 30, 20, 10], k=2) == [0, 50, 90,
    90, 90]
  - Solution().findMaxSum(nums1=[100000, 90000, 80000, 70000, 60000], nums2=[1, 2, 3, 4, 5], k=4) == [14,
    12, 9, 5, 0]
  - Solution().findMaxSum(nums1=[1, 1, 1, 1, 1], nums2=[5, 5, 5, 5, 5], k=5) == [0, 0, 0, 0, 0]
  - Solution().findMaxSum(nums1=[5, 4, 3, 2, 1], nums2=[1, 2, 3, 4, 5], k=2) == [9, 9, 9, 5, 0]
  - Solution().findMaxSum(nums1=[5, 5, 5, 5, 5], nums2=[1, 2, 3, 4, 5], k=5) == [0, 0, 0, 0, 0]
  - Solution().findMaxSum(nums1=[1, 2, 3, 4, 5], nums2=[5, 4, 3, 2, 1], k=3) == [0, 5, 9, 12, 12]
  - Solution().findMaxSum(nums1=[10, 20, 30, 40, 50], nums2=[1, 1, 1, 1, 1], k=5) == [0, 1, 2, 3, 4]
  - Solution().findMaxSum(nums1=[1, 3, 5, 7, 9], nums2=[9, 7, 5, 3, 1], k=3) == [0, 9, 16, 21, 21]
  - Solution().findMaxSum(nums1=[4, 2, 1, 5, 3], nums2=[10, 20, 30, 40, 50], k=2) == [80, 30, 0, 80, 50]
  - Solution().findMaxSum(nums1=[2, 2, 2, 2], nums2=[3, 1, 2, 3], k=1) == [0, 0, 0, 0]
