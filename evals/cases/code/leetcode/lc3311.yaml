id: lc3311
modality: code
prompt: "You are given a 2D integer array edges representing an undirected graph having n nodes, where\
  \ edges[i] = [ui, vi] denotes an edge between nodes ui and vi.\nConstruct a 2D grid that satisfies these\
  \ conditions:\n\nThe grid contains all nodes from 0 to n - 1 in its cells, with each node appearing\
  \ exactly once.\nTwo nodes should be in adjacent grid cells (horizontally or vertically) if and only\
  \ if there is an edge between them in edges.\n\nIt is guaranteed that edges can form a 2D grid that\
  \ satisfies the conditions.\nReturn a 2D integer array satisfying the conditions above. If there are\
  \ multiple solutions, return any of them.\n \nExample 1:\n\nInput: n = 4, edges = [[0,1],[0,2],[1,3],[2,3]]\n\
  Output: [[3,1],[2,0]]\nExplanation:\n\n\nExample 2:\n\nInput: n = 5, edges = [[0,1],[1,3],[2,3],[2,4]]\n\
  Output: [[4,2,3,1,0]]\nExplanation:\n\n\nExample 3:\n\nInput: n = 9, edges = [[0,1],[0,4],[0,5],[1,7],[2,3],[2,4],[2,5],[3,6],[4,6],[4,7],[6,8],[7,8]]\n\
  Output: [[8,6,3],[7,4,2],[1,0,5]]\nExplanation:\n\n\n \nConstraints:\n\n2 <= n <= 5 * 104\n1 <= edges.length\
  \ <= 105\nedges[i] = [ui, vi]\n0 <= ui < vi < n\nAll the edges are distinct.\nThe input is generated\
  \ such that edges can form a 2D grid that satisfies the conditions.\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def constructGridLayout(self,\
  \ n: int, edges: List[List[int]]) -> List[List[int]]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().constructGridLayout(n=9, edges=[[0, 1], [0, 4], [0, 5], [1, 7], [2, 3], [2, 4], [2, 5],
    [3, 6], [4, 6], [4, 7], [6, 8], [7, 8]]) == [[8, 6, 3], [7, 4, 2], [1, 0, 5]]
  - Solution().constructGridLayout(n=4, edges=[[0, 1], [0, 2], [1, 3], [2, 3]]) == [[3, 1], [2, 0]]
  - Solution().constructGridLayout(n=5, edges=[[0, 1], [1, 3], [2, 3], [2, 4]]) == [[4], [2], [3], [1],
    [0]]
  - Solution().constructGridLayout(n=16, edges=[[0, 1], [0, 4], [1, 5], [2, 3], [2, 6], [3, 7], [4, 8],
    [5, 9], [6, 10], [7, 11], [8, 12], [9, 13], [10, 14], [11, 15], [12, 13], [14, 15]]) == [[15, 11],
    [14, 7], [10, 3], [6, 2], [], [], [], []]
  - Solution().constructGridLayout(n=16, edges=[[0, 1], [0, 4], [1, 5], [2, 3], [2, 6], [3, 7], [4, 8],
    [5, 9], [6, 10], [7, 11], [8, 12], [9, 13], [10, 14], [11, 15], [12, 13], [13, 14], [14, 15]]) ==
    [[15, 11], [14, 7], [10, 3], [6, 2], [], [], [], []]
  - Solution().constructGridLayout(n=16, edges=[[0, 1], [0, 4], [1, 2], [1, 5], [2, 3], [2, 6], [3, 7],
    [4, 8], [4, 9], [5, 6], [5, 10], [6, 11], [7, 11], [8, 12], [9, 10], [9, 13], [10, 11], [10, 14],
    [11, 15], [12, 13], [13, 14], [14, 15]]) == [[15, 11, 6, 2, 1, 0], [14, 7, 5, 3, 5, 4]]
  - Solution().constructGridLayout(n=12, edges=[[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6], [3, 7],
    [4, 8], [5, 9], [6, 10], [7, 11], [8, 11], [9, 10]]) == [[11, 7], [8, 3], [4, 1], [0], [2], [5]]
  - Solution().constructGridLayout(n=16, edges=[[0, 1], [0, 2], [0, 4], [1, 3], [1, 5], [2, 6], [3, 7],
    [4, 8], [4, 9], [5, 10], [6, 11], [7, 12], [8, 13], [9, 14], [10, 15], [11, 15], [12, 14], [13, 15]])
    == [[14, 9], [12, 4], [7, 0], [3, 1], [5], [10], [15], [11]]
  - Solution().constructGridLayout(n=16, edges=[[0, 1], [0, 4], [0, 5], [1, 2], [1, 6], [2, 3], [2, 7],
    [3, 8], [4, 9], [5, 9], [6, 10], [7, 10], [8, 11], [9, 12], [10, 13], [11, 13], [12, 14], [13, 15]])
    == [[15], [13], [10], [6], [1], [0], [4], [9], [5], [], [], [], [], [], [], []]
