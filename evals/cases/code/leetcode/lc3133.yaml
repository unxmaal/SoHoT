prompt: "You are given two integers n and x. You have to construct an array of positive integers nums\
  \ of size n where for every 0 <= i < n - 1, nums[i + 1] is greater than nums[i], and the result of the\
  \ bitwise AND operation between all elements of nums is x.\nReturn the minimum possible value of nums[n\
  \ - 1].\n \nExample 1:\n\nInput: n = 3, x = 4\nOutput: 6\nExplanation:\nnums can be [4,5,6] and its\
  \ last element is 6.\n\nExample 2:\n\nInput: n = 2, x = 7\nOutput: 15\nExplanation:\nnums can be [7,15]\
  \ and its last element is 15.\n\n \nConstraints:\n\n1 <= n, x <= 108\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minEnd(self, n: int,\
  \ x: int) -> int:\n```\n\nReturn only the code."
