modality: code
prompt: "You are given a 2D matrix grid of size m x n. You are also given a non-negative integer k.\n\
  Return the number of submatrices of grid that satisfy the following conditions:\n\nThe maximum element\
  \ in the submatrix less than or equal to k.\nEach row in the submatrix is sorted in non-increasing order.\n\
  \nA submatrix (x1, y1, x2, y2) is a matrix that forms by choosing all cells grid[x][y] where x1 <= x\
  \ <= x2 and y1 <= y <= y2.\n \nExample 1:\n\nInput: grid = [[4,3,2,1],[8,7,6,1]], k = 3\nOutput: 8\n\
  Explanation:\n\nThe 8 submatrices are:\n\n[[1]]\n[[1]]\n[[2,1]]\n[[3,2,1]]\n[[1],[1]]\n[[2]]\n[[3]]\n\
  [[3,2]]\n\n\nExample 2:\n\nInput: grid = [[1,1,1],[1,1,1],[1,1,1]], k = 1\nOutput: 36\nExplanation:\n\
  There are 36 submatrices of grid. All submatrices have their maximum element equal to 1.\n\nExample\
  \ 3:\n\nInput: grid = [[1]], k = 1\nOutput: 1\n\n \nConstraints:\n\n1 <= m == grid.length <= 103\n1\
  \ <= n == grid[i].length <= 103\n1 <= grid[i][j] <= 109\n1 <= k <= 109\n\n \n​​​​​​\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def countSubmatrices(self,\
  \ grid: List[List[int]], k: int) -> int:\n```\n\nReturn only the code."
assert:
