modality: code
prompt: "You are given a 2D 0-indexed integer array dimensions.\nFor all indices i, 0 <= i < dimensions.length,\
  \ dimensions[i][0] represents the length and dimensions[i][1] represents the width of the rectangle\
  \ i.\nReturn the area of the rectangle having the longest diagonal. If there are multiple rectangles\
  \ with the longest diagonal, return the area of the rectangle having the maximum area.\n \nExample 1:\n\
  \nInput: dimensions = [[9,3],[8,6]]\nOutput: 48\nExplanation: \nFor index = 0, length = 9 and width\
  \ = 3. Diagonal length = sqrt(9 * 9 + 3 * 3) = sqrt(90) ≈ 9.487.\nFor index = 1, length = 8 and width\
  \ = 6. Diagonal length = sqrt(8 * 8 + 6 * 6) = sqrt(100) = 10.\nSo, the rectangle at index 1 has a greater\
  \ diagonal length therefore we return area = 8 * 6 = 48.\n\nExample 2:\n\nInput: dimensions = [[3,4],[4,3]]\n\
  Output: 12\nExplanation: Length of diagonal is the same for both which is 5, so maximum area = 12.\n\
  \n \nConstraints:\n\n1 <= dimensions.length <= 100\ndimensions[i].length == 2\n1 <= dimensions[i][0],\
  \ dimensions[i][1] <= 100\n\nWrite the solution in Python as this class, with any imports it needs:\n\
  \n```python\nclass Solution:\n    def areaOfMaxDiagonal(self, dimensions: List[List[int]]) -> int:\n\
  ```\n\nReturn only the code."
