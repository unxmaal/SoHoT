  - Solution().areaOfMaxDiagonal(dimensions=[[100, 1], [1, 100]]) == 100
  - Solution().areaOfMaxDiagonal(dimensions=[[1, 2], [2, 1], [3, 4], [4, 3]]) == 12
  - Solution().areaOfMaxDiagonal(dimensions=[[5, 12], [12, 5], [8, 8]]) == 60
  - Solution().areaOfMaxDiagonal(dimensions=[[10, 10], [15, 15], [20, 20]]) == 400
  - Solution().areaOfMaxDiagonal(dimensions=[[10, 24], [24, 10], [15, 20]]) == 240
