  - Solution().minNumberOfSeconds(mountainHeight=50, workerTimes=[10, 20, 30, 40, 50]) == 1400
  - Solution().minNumberOfSeconds(mountainHeight=30, workerTimes=[3, 3, 3]) == 165
  - Solution().minNumberOfSeconds(mountainHeight=100, workerTimes=[10, 10, 10, 10]) == 3250
  - Solution().minNumberOfSeconds(mountainHeight=100000, workerTimes=[1]) == 5000050000
  - Solution().minNumberOfSeconds(mountainHeight=10, workerTimes=[3, 2, 2, 4]) == 12
