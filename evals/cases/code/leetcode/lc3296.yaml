modality: code
prompt: "You are given an integer mountainHeight denoting the height of a mountain.\nYou are also given\
  \ an integer array workerTimes representing the work time of workers in seconds.\nThe workers work simultaneously\
  \ to reduce the height of the mountain. For worker i:\n\nTo decrease the mountain's height by x, it\
  \ takes workerTimes[i] + workerTimes[i] * 2 + ... + workerTimes[i] * x seconds. For example:\n\n\t\n\
  To reduce the height of the mountain by 1, it takes workerTimes[i] seconds.\nTo reduce the height of\
  \ the mountain by 2, it takes workerTimes[i] + workerTimes[i] * 2 seconds, and so on.\n\n\n\nReturn\
  \ an integer representing the minimum number of seconds required for the workers to make the height\
  \ of the mountain 0.\n \nExample 1:\n\nInput: mountainHeight = 4, workerTimes = [2,1,1]\nOutput: 3\n\
  Explanation:\nOne way the height of the mountain can be reduced to 0 is:\n\nWorker 0 reduces the height\
  \ by 1, taking workerTimes[0] = 2 seconds.\nWorker 1 reduces the height by 2, taking workerTimes[1]\
  \ + workerTimes[1] * 2 = 3 seconds.\nWorker 2 reduces the height by 1, taking workerTimes[2] = 1 second.\n\
  \nSince they work simultaneously, the minimum time needed is max(2, 3, 1) = 3 seconds.\n\nExample 2:\n\
  \nInput: mountainHeight = 10, workerTimes = [3,2,2,4]\nOutput: 12\nExplanation:\n\nWorker 0 reduces\
  \ the height by 2, taking workerTimes[0] + workerTimes[0] * 2 = 9 seconds.\nWorker 1 reduces the height\
  \ by 3, taking workerTimes[1] + workerTimes[1] * 2 + workerTimes[1] * 3 = 12 seconds.\nWorker 2 reduces\
  \ the height by 3, taking workerTimes[2] + workerTimes[2] * 2 + workerTimes[2] * 3 = 12 seconds.\nWorker\
  \ 3 reduces the height by 2, taking workerTimes[3] + workerTimes[3] * 2 = 12 seconds.\n\nThe number\
  \ of seconds needed is max(9, 12, 12, 12) = 12 seconds.\n\nExample 3:\n\nInput: mountainHeight = 5,\
  \ workerTimes = [1]\nOutput: 15\nExplanation:\nThere is only one worker in this example, so the answer\
  \ is workerTimes[0] + workerTimes[0] * 2 + workerTimes[0] * 3 + workerTimes[0] * 4 + workerTimes[0]\
  \ * 5 = 15.\n\n \nConstraints:\n\n1 <= mountainHeight <= 105\n1 <= workerTimes.length <= 104\n1 <= workerTimes[i]\
  \ <= 106\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass\
  \ Solution:\n    def minNumberOfSeconds(self, mountainHeight: int, workerTimes: List[int]) -> int:\n\
  ```\n\nReturn only the code."
