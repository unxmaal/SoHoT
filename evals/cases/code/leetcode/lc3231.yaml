prompt: "Given an array of integers nums, you are allowed to perform the following operation any number\
  \ of times:\n\nRemove a strictly increasing subsequence from the array.\n\nYour task is to find the\
  \ minimum number of operations required to make the array empty.\n \nExample 1:\n\nInput: nums = [5,3,1,4,2]\n\
  Output: 3\nExplanation:\nWe remove subsequences [1, 2], [3, 4], [5].\n\nExample 2:\n\nInput: nums =\
  \ [1,2,3,4,5]\nOutput: 1\n\nExample 3:\n\nInput: nums = [5,4,3,2,1]\nOutput: 5\n\n \nConstraints:\n\n\
  1 <= nums.length <= 105\n1 <= nums[i] <= 105\n\nWrite the solution in Python as this class, with any\
  \ imports it needs:\n\n```python\nclass Solution:\n    def minOperations(self, nums: List[int]) -> int:\n\
  ```\n\nReturn only the code."
assert:
