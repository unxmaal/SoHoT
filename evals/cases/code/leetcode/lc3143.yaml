id: lc3143
modality: code
prompt: "You are given a 2D array points and a string s where, points[i] represents the coordinates of\
  \ point i, and s[i] represents the tag of point i.\nA valid square is a square centered at the origin\
  \ (0, 0), has edges parallel to the axes, and does not contain two points with the same tag.\nReturn\
  \ the maximum number of points contained in a valid square.\nNote:\n\nA point is considered to be inside\
  \ the square if it lies on or within the square's boundaries.\nThe side length of the square can be\
  \ zero.\n\n \nExample 1:\n\n\nInput: points = [[2,2],[-1,-2],[-4,4],[-3,1],[3,-3]], s = \"abdca\"\n\
  Output: 2\nExplanation:\nThe square of side length 4 covers two points points[0] and points[1].\n\n\
  Example 2:\n\n\nInput: points = [[1,1],[-2,-2],[-2,2]], s = \"abb\"\nOutput: 1\nExplanation:\nThe square\
  \ of side length 2 covers one point, which is points[0].\n\nExample 3:\n\nInput: points = [[1,1],[-1,-1],[2,-2]],\
  \ s = \"ccd\"\nOutput: 0\nExplanation:\nIt's impossible to make any valid squares centered at the origin\
  \ such that it covers only one point among points[0] and points[1].\n\n \nConstraints:\n\n1 <= s.length,\
  \ points.length <= 105\npoints[i].length == 2\n-109 <= points[i][0], points[i][1] <= 109\ns.length ==\
  \ points.length\npoints consists of distinct coordinates.\ns consists only of lowercase English letters.\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def maxPointsInsideSquare(self, points: List[List[int]], s: str) -> int:\n```\n\nReturn only the\
  \ code."
assert:
  checks:
  - Solution().maxPointsInsideSquare(points=[[1, 1], [-1, -1], [2, -2]], s='ccd') == 0
  - Solution().maxPointsInsideSquare(points=[[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]], s='abcde') ==
    5
  - Solution().maxPointsInsideSquare(points=[[0, 1], [1, 0], [1, 1]], s='abc') == 3
  - Solution().maxPointsInsideSquare(points=[[10, 10], [-10, -10], [10, -10], [-10, 10]], s='abcd') ==
    4
  - Solution().maxPointsInsideSquare(points=[[0, 0], [0, 1], [1, 0], [1, 1]], s='abcd') == 4
  - Solution().maxPointsInsideSquare(points=[[1, 2], [2, 1], [3, 4], [4, 3]], s='abcd') == 4
  - Solution().maxPointsInsideSquare(points=[[3, 0], [-3, 0], [0, 3], [0, -3], [1, 1], [-1, -1]], s='abcdef')
    == 6
  - Solution().maxPointsInsideSquare(points=[[1, 1], [2, 2], [3, 3], [4, 4]], s='abcd') == 4
  - Solution().maxPointsInsideSquare(points=[[0, 0], [1, 1], [2, 2]], s='abc') == 3
  - Solution().maxPointsInsideSquare(points=[[1, 2], [2, 1], [1, -2], [-2, 1], [-1, -2], [2, -1]], s='abcdef')
    == 6
