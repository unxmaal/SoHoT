id: lc3066
modality: code
prompt: "You are given a 0-indexed integer array nums, and an integer k.\nYou are allowed to perform some\
  \ operations on nums, where in a single operation, you can:\n\nSelect the two smallest integers x and\
  \ y from nums.\nRemove x and y from nums.\nInsert (min(x, y) * 2 + max(x, y)) at any position in the\
  \ array.\n\nNote that you can only apply the described operation if nums contains at least two elements.\n\
  Return the minimum number of operations needed so that all elements of the array are greater than or\
  \ equal to k.\n \nExample 1:\n\nInput: nums = [2,11,10,1,3], k = 10\nOutput: 2\nExplanation:\n\nIn the\
  \ first operation, we remove elements 1 and 2, then add 1 * 2 + 2 to nums. nums becomes equal to [4,\
  \ 11, 10, 3].\nIn the second operation, we remove elements 3 and 4, then add 3 * 2 + 4 to nums. nums\
  \ becomes equal to [10, 11, 10].\n\nAt this stage, all the elements of nums are greater than or equal\
  \ to 10 so we can stop. \nIt can be shown that 2 is the minimum number of operations needed so that\
  \ all elements of the array are greater than or equal to 10.\n\nExample 2:\n\nInput: nums = [1,1,2,4,9],\
  \ k = 20\nOutput: 4\nExplanation:\n\nAfter one operation, nums becomes equal to [2, 4, 9, 3]. \nAfter\
  \ two operations, nums becomes equal to [7, 4, 9]. \nAfter three operations, nums becomes equal to [15,\
  \ 9]. \nAfter four operations, nums becomes equal to [33].\n\nAt this stage, all the elements of nums\
  \ are greater than 20 so we can stop. \nIt can be shown that 4 is the minimum number of operations needed\
  \ so that all elements of the array are greater than or equal to 20.\n\n \nConstraints:\n\n2 <= nums.length\
  \ <= 2 * 105\n1 <= nums[i] <= 109\n1 <= k <= 109\nThe input is generated such that an answer always\
  \ exists. That is, after performing some number of operations, all elements of the array are greater\
  \ than or equal to k.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n\
  ```python\nclass Solution:\n    def minOperations(self, nums: List[int], k: int) -> int:\n```\n\nReturn\
  \ only the code."
assert:
  checks:
  - Solution().minOperations(nums=[3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5], k=10) == 7
  - Solution().minOperations(nums=[5, 4, 3, 2, 1], k=10) == 3
  - Solution().minOperations(nums=[5, 5, 5, 5], k=10) == 2
  - Solution().minOperations(nums=[5, 10, 15, 20], k=25) == 3
  - Solution().minOperations(nums=[5, 5, 5, 5, 5], k=11) == 3
  - Solution().minOperations(nums=[1, 2, 3, 4, 5, 6], k=10) == 4
  - Solution().minOperations(nums=[1, 1000000000], k=1000000000) == 1
  - Solution().minOperations(nums=[100, 200, 300], k=500) == 2
  - Solution().minOperations(nums=[2, 11, 10, 1, 3], k=10) == 2
  - Solution().minOperations(nums=[1, 2, 3, 4, 5, 6], k=10) == 4
