  - Solution().getSmallestString(s='zbbz', k=3) == 'aaaz'
  - Solution().getSmallestString(s='abc', k=1) == 'aac'
  - Solution().getSmallestString(s='abc', k=0) == 'abc'
  - Solution().getSmallestString(s='zzz', k=9) == 'aaa'
  - Solution().getSmallestString(s='zyxwvutsrqponmlkjihgfedcba', k=50) == 'aaaaaaaaalponmlkjihgfedcba'
  - Solution().getSmallestString(s='xyz', k=10) == 'aaa'
  - Solution().getSmallestString(s='aaa', k=5) == 'aaa'
  - Solution().getSmallestString(s='abc', k=2) == 'aab'
  - Solution().getSmallestString(s='vwxyz', k=25) == 'aaaaa'
  - Solution().getSmallestString(s='hello', k=7) == 'aello'
