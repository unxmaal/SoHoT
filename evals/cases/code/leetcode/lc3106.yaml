modality: code
prompt: "You are given a string s and an integer k.\nDefine a function distance(s1, s2) between two strings\
  \ s1 and s2 of the same length n as:\n\nThe sum of the minimum distance between s1[i] and s2[i] when\
  \ the characters from 'a' to 'z' are placed in a cyclic order, for all i in the range [0, n - 1].\n\n\
  For example, distance(\"ab\", \"cd\") == 4, and distance(\"a\", \"z\") == 1.\nYou can change any letter\
  \ of s to any other lowercase English letter, any number of times.\nReturn a string denoting the lexicographically\
  \ smallest string t you can get after some changes, such that distance(s, t) <= k.\n \nExample 1:\n\n\
  Input: s = \"zbbz\", k = 3\nOutput: \"aaaz\"\nExplanation:\nChange s to \"aaaz\". The distance between\
  \ \"zbbz\" and \"aaaz\" is equal to k = 3.\n\nExample 2:\n\nInput: s = \"xaxcd\", k = 4\nOutput: \"\
  aawcd\"\nExplanation:\nThe distance between \"xaxcd\" and \"aawcd\" is equal to k = 4.\n\nExample 3:\n\
  \nInput: s = \"lol\", k = 0\nOutput: \"lol\"\nExplanation:\nIt's impossible to change any character\
  \ as k = 0.\n\n \nConstraints:\n\n1 <= s.length <= 100\n0 <= k <= 2000\ns consists only of lowercase\
  \ English letters.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def getSmallestString(self, s: str, k: int) -> str:\n```\n\nReturn only the code."
assert:
