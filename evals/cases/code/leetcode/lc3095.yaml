id: lc3095
modality: code
prompt: "You are given an array nums of non-negative integers and an integer k.\nAn array is called special\
  \ if the bitwise OR of all of its elements is at least k.\nReturn the length of the shortest special\
  \ non-empty subarray of nums, or return -1 if no special subarray exists.\n \nExample 1:\n\nInput: nums\
  \ = [1,2,3], k = 2\nOutput: 1\nExplanation:\nThe subarray [3] has OR value of 3. Hence, we return 1.\n\
  Note that [2] is also a special subarray.\n\nExample 2:\n\nInput: nums = [2,1,8], k = 10\nOutput: 3\n\
  Explanation:\nThe subarray [2,1,8] has OR value of 11. Hence, we return 3.\n\nExample 3:\n\nInput: nums\
  \ = [1,2], k = 0\nOutput: 1\nExplanation:\nThe subarray [1] has OR value of 1. Hence, we return 1.\n\
  \n \nConstraints:\n\n1 <= nums.length <= 50\n0 <= nums[i] <= 50\n0 <= k < 64\n\nWrite the solution in\
  \ Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minimumSubarrayLength(self,\
  \ nums: List[int], k: int) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minimumSubarrayLength(nums=[0, 0, 0], k=1) == -1
  - Solution().minimumSubarrayLength(nums=[5, 5, 5, 5], k=5) == 1
  - Solution().minimumSubarrayLength(nums=[1, 2], k=0) == 1
  - Solution().minimumSubarrayLength(nums=[4, 5, 6, 7], k=12) == -1
  - Solution().minimumSubarrayLength(nums=[1, 2, 3], k=2) == 1
  - Solution().minimumSubarrayLength(nums=[30, 1, 4, 3, 2, 5], k=6) == 1
  - Solution().minimumSubarrayLength(nums=[7, 14, 21, 28, 35], k=21) == 1
  - Solution().minimumSubarrayLength(nums=[1, 3, 5, 7, 9], k=15) == 2
  - Solution().minimumSubarrayLength(nums=[30, 1, 4, 3], k=7) == 1
  - Solution().minimumSubarrayLength(nums=[3, 3, 3, 3, 3], k=2) == 1
