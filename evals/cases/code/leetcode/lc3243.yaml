id: lc3243
modality: code
prompt: "You are given an integer n and a 2D integer array queries.\nThere are n cities numbered from\
  \ 0 to n - 1. Initially, there is a unidirectional road from city i to city i + 1 for all 0 <= i < n\
  \ - 1.\nqueries[i] = [ui, vi] represents the addition of a new unidirectional road from city ui to city\
  \ vi. After each query, you need to find the length of the shortest path from city 0 to city n - 1.\n\
  Return an array answer where for each i in the range [0, queries.length - 1], answer[i] is the length\
  \ of the shortest path from city 0 to city n - 1 after processing the first i + 1 queries.\n \nExample\
  \ 1:\n\nInput: n = 5, queries = [[2,4],[0,2],[0,4]]\nOutput: [3,2,1]\nExplanation: \n\nAfter the addition\
  \ of the road from 2 to 4, the length of the shortest path from 0 to 4 is 3.\n\nAfter the addition of\
  \ the road from 0 to 2, the length of the shortest path from 0 to 4 is 2.\n\nAfter the addition of the\
  \ road from 0 to 4, the length of the shortest path from 0 to 4 is 1.\n\nExample 2:\n\nInput: n = 4,\
  \ queries = [[0,3],[0,2]]\nOutput: [1,1]\nExplanation:\n\nAfter the addition of the road from 0 to 3,\
  \ the length of the shortest path from 0 to 3 is 1.\n\nAfter the addition of the road from 0 to 2, the\
  \ length of the shortest path remains 1.\n\n \nConstraints:\n\n3 <= n <= 500\n1 <= queries.length <=\
  \ 500\nqueries[i].length == 2\n0 <= queries[i][0] < queries[i][1] < n\n1 < queries[i][1] - queries[i][0]\n\
  There are no repeated roads among the queries.\n\nWrite the solution in Python as this class, with any\
  \ imports it needs:\n\n```python\nclass Solution:\n    def shortestDistanceAfterQueries(self, n: int,\
  \ queries: List[List[int]]) -> List[int]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().shortestDistanceAfterQueries(n=7, queries=[[0, 5], [1, 6], [2, 4]]) == [2, 2, 2]
  - Solution().shortestDistanceAfterQueries(n=8, queries=[[1, 5], [2, 6], [3, 7], [0, 4], [0, 6], [0,
    7]]) == [4, 4, 4, 4, 2, 1]
  - Solution().shortestDistanceAfterQueries(n=6, queries=[[1, 3], [2, 5], [0, 3]]) == [4, 3, 3]
  - Solution().shortestDistanceAfterQueries(n=8, queries=[[0, 6], [1, 7], [2, 5], [3, 4]]) == [2, 2, 2,
    2]
  - Solution().shortestDistanceAfterQueries(n=7, queries=[[1, 5], [2, 6], [3, 5]]) == [3, 3, 3]
  - Solution().shortestDistanceAfterQueries(n=6, queries=[[1, 3], [2, 4], [0, 3]]) == [4, 4, 3]
  - Solution().shortestDistanceAfterQueries(n=6, queries=[[1, 3], [2, 5], [0, 1], [3, 4]]) == [4, 3, 3,
    3]
  - Solution().shortestDistanceAfterQueries(n=5, queries=[[2, 4], [0, 2], [0, 4]]) == [3, 2, 1]
  - Solution().shortestDistanceAfterQueries(n=4, queries=[[0, 3], [0, 2]]) == [1, 1]
  - Solution().shortestDistanceAfterQueries(n=7, queries=[[1, 4], [2, 6], [3, 5], [0, 3], [0, 5]]) ==
    [4, 3, 3, 3, 2]
