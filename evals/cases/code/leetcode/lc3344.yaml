  - Solution().maxSizedArray(s=100000000000000) == 756
  - Solution().maxSizedArray(s=10) == 2
  - Solution().maxSizedArray(s=27) == 2
  - Solution().maxSizedArray(s=1000) == 5
  - Solution().maxSizedArray(s=1000000000000000) == 1196
