modality: code
prompt: "You are given an integer array nums of length n.\nA partition is defined as an index i where\
  \ 0 <= i < n - 1, splitting the array into two non-empty subarrays such that:\n\nLeft subarray contains\
  \ indices [0, i].\nRight subarray contains indices [i + 1, n - 1].\n\nReturn the number of partitions\
  \ where the difference between the sum of the left and right subarrays is even.\n \nExample 1:\n\nInput:\
  \ nums = [10,10,3,7,6]\nOutput: 4\nExplanation:\nThe 4 partitions are:\n\n[10], [10, 3, 7, 6] with a\
  \ sum difference of 10 - 26 = -16, which is even.\n[10, 10], [3, 7, 6] with a sum difference of 20 -\
  \ 16 = 4, which is even.\n[10, 10, 3], [7, 6] with a sum difference of 23 - 13 = 10, which is even.\n\
  [10, 10, 3, 7], [6] with a sum difference of 30 - 6 = 24, which is even.\n\n\nExample 2:\n\nInput: nums\
  \ = [1,2,2]\nOutput: 0\nExplanation:\nNo partition results in an even sum difference.\n\nExample 3:\n\
  \nInput: nums = [2,4,6,8]\nOutput: 3\nExplanation:\nAll partitions result in an even sum difference.\n\
  \n \nConstraints:\n\n2 <= n == nums.length <= 100\n1 <= nums[i] <= 100\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def countPartitions(self,\
  \ nums: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().countPartitions(nums=[100, 100, 100, 100]) == 3
  - Solution().countPartitions(nums=[100, 100]) == 1
  - Solution().countPartitions(nums=[100, 100, 100, 100, 100]) == 4
  - Solution().countPartitions(nums=[1, 2, 2]) == 0
  - Solution().countPartitions(nums=[1, 1, 1, 1]) == 3
  - Solution().countPartitions(nums=[10, 10, 3, 7, 6]) == 4
  - Solution().countPartitions(nums=[2, 3, 5, 7, 11]) == 4
  - Solution().countPartitions(nums=[5, 5, 5, 5, 5]) == 0
  - Solution().countPartitions(nums=[1, 2, 3, 4, 5]) == 0
  - Solution().countPartitions(nums=[1, 3, 5, 7, 9]) == 0
