  - Solution().countKReducibleNumbers(s='1', k=3) == 0
  - Solution().countKReducibleNumbers(s='10000000', k=5) == 127
  - Solution().countKReducibleNumbers(s='101010', k=3) == 41
  - Solution().countKReducibleNumbers(s='111', k=1) == 3
