id: lc3424
modality: code
prompt: "You are given two integer arrays arr and brr of length n, and an integer k. You can perform the\
  \ following operations on arr any number of times:\n\nSplit arr into any number of contiguous subarrays\
  \ and rearrange these subarrays in any order. This operation has a fixed cost of k.\n\nChoose any element\
  \ in arr and add or subtract a positive integer x to it. The cost of this operation is x.\n\n\nReturn\
  \ the minimum total cost to make arr equal to brr.\n \nExample 1:\n\nInput: arr = [-7,9,5], brr = [7,-2,-5],\
  \ k = 2\nOutput: 13\nExplanation:\n\nSplit arr into two contiguous subarrays: [-7] and [9, 5] and rearrange\
  \ them as [9, 5, -7], with a cost of 2.\nSubtract 2 from element arr[0]. The array becomes [7, 5, -7].\
  \ The cost of this operation is 2.\nSubtract 7 from element arr[1]. The array becomes [7, -2, -7]. The\
  \ cost of this operation is 7.\nAdd 2 to element arr[2]. The array becomes [7, -2, -5]. The cost of\
  \ this operation is 2.\n\nThe total cost to make the arrays equal is 2 + 2 + 7 + 2 = 13.\n\nExample\
  \ 2:\n\nInput: arr = [2,1], brr = [2,1], k = 0\nOutput: 0\nExplanation:\nSince the arrays are already\
  \ equal, no operations are needed, and the total cost is 0.\n\n \nConstraints:\n\n1 <= arr.length ==\
  \ brr.length <= 105\n0 <= k <= 2 * 1010\n-105 <= arr[i] <= 105\n-105 <= brr[i] <= 105\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minCost(self,\
  \ arr: List[int], brr: List[int], k: int) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minCost(arr=[0, 0, 0], brr=[0, 0, 0], k=10) == 0
  - Solution().minCost(arr=[2, 1], brr=[2, 1], k=0) == 0
  - Solution().minCost(arr=[0, 0, 0], brr=[0, 0, 0], k=100) == 0
  - Solution().minCost(arr=[1, 2, 3], brr=[3, 2, 1], k=10) == 4
  - Solution().minCost(arr=[0, 0, 0], brr=[1, 1, 1], k=1) == 3
  - Solution().minCost(arr=[100000, -100000, 50000], brr=[50000, -100000, 100000], k=5) == 5
  - Solution().minCost(arr=[10, 20, 30], brr=[30, 20, 10], k=5) == 5
  - Solution().minCost(arr=[100000, -100000], brr=[-100000, 100000], k=200000) == 200000
  - Solution().minCost(arr=[-7, 9, 5], brr=[7, -2, -5], k=2) == 13
  - Solution().minCost(arr=[1, 2, 3], brr=[3, 2, 1], k=5) == 4
