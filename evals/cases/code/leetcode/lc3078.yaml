id: lc3078
modality: code
prompt: "You are given a 2D integer matrix board and a 2D character matrix pattern. Where 0 <= board[r][c]\
  \ <= 9 and each element of pattern is either a digit or a lowercase English letter.\nYour task is to\
  \ find a submatrix of board that matches pattern.\nAn integer matrix part matches pattern if we can\
  \ replace cells containing letters in pattern with some digits (each distinct letter with a unique digit)\
  \ in such a way that the resulting matrix becomes identical to the integer matrix part. In other words,\n\
  \nThe matrices have identical dimensions.\nIf pattern[r][c] is a digit, then part[r][c] must be the\
  \ same digit.\nIf pattern[r][c] is a letter x:\n\t\nFor every pattern[i][j] == x, part[i][j] must be\
  \ the same as part[r][c].\nFor every pattern[i][j] != x, part[i][j] must be different than part[r][c].\
  \ \n\n\n\nReturn an array of length 2 containing the row number and column number of the upper-left\
  \ corner of a submatrix of board which matches pattern. If there is more than one such submatrix, return\
  \ the coordinates of the submatrix with the lowest row index, and in case there is still a tie, return\
  \ the coordinates of the submatrix with the lowest column index. If there are no suitable answers, return\
  \ [-1, -1].\n \nExample 1:\n\n\n\n\n1\n2\n2\n\n\n2\n2\n3\n\n\n2\n3\n3\n\n\n\n\n\n\na\nb\n\n\nb\nb\n\n\
  \n\n\n\nInput: board = [[1,2,2],[2,2,3],[2,3,3]], pattern = [\"ab\",\"bb\"]\nOutput: [0,0]\nExplanation:\
  \ If we consider this mapping: \"a\" -> 1 and \"b\" -> 2; the submatrix with the upper-left corner (0,0)\
  \ is a match as outlined in the matrix above.\nNote that the submatrix with the upper-left corner (1,1)\
  \ is also a match but since it comes after the other one, we return [0,0].\n\nExample 2:\n\n\n\n\n1\n\
  1\n2\n\n\n3\n3\n4\n\n\n6\n6\n6\n\n\n\n\n\n\na\nb\n\n\n6\n6\n\n\n\n\n\nInput: board = [[1,1,2],[3,3,4],[6,6,6]],\
  \ pattern = [\"ab\",\"66\"]\nOutput: [1,1]\nExplanation: If we consider this mapping: \"a\" -> 3 and\
  \ \"b\" -> 4; the submatrix with the upper-left corner (1,1) is a match as outlined in the matrix above.\n\
  Note that since the corresponding values of \"a\" and \"b\" must differ, the submatrix with the upper-left\
  \ corner (1,0) is not a match. Hence, we return [1,1].\n\nExample 3:\n\n\n\n\n1\n2\n\n\n2\n1\n\n\n\n\
  \n\n\nx\nx\n\n\n\n\n\nInput: board = [[1,2],[2,1]], pattern = [\"xx\"]\nOutput: [-1,-1]\nExplanation:\
  \ Since the values of the matched submatrix must be the same, there is no match. Hence, we return [-1,-1].\n\
  \n \nConstraints:\n\n1 <= board.length <= 50\n1 <= board[i].length <= 50\n0 <= board[i][j] <= 9\n1 <=\
  \ pattern.length <= 50\n1 <= pattern[i].length <= 50\npattern[i][j] is either a digit represented as\
  \ a string or a lowercase English letter.\n\nWrite the solution in Python as this class, with any imports\
  \ it needs:\n\n```python\nclass Solution:\n    def findPattern(self, board: List[List[int]], pattern:\
  \ List[str]) -> List[int]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().findPattern(board=[[1, 2, 3], [4, 5, 6], [7, 8, 9]], pattern=['12', '34']) == [-1, -1]
  - Solution().findPattern(board=[[1, 2, 3], [4, 5, 6], [7, 8, 9]], pattern=['1a', '2b']) == [-1, -1]
  - Solution().findPattern(board=[[9, 9, 9], [9, 9, 9]], pattern=['aa', 'aa']) == [0, 0]
  - Solution().findPattern(board=[[5, 5, 5], [5, 5, 5], [5, 5, 5]], pattern=['aaa', 'aaa']) == [0, 0]
  - Solution().findPattern(board=[[1, 2], [2, 1]], pattern=['xx']) == [-1, -1]
  - Solution().findPattern(board=[[1, 1, 2], [3, 3, 4], [6, 6, 6]], pattern=['ab', '66']) == [1, 1]
  - Solution().findPattern(board=[[9, 9], [9, 9]], pattern=['aa', 'aa']) == [0, 0]
  - Solution().findPattern(board=[[0, 1, 2], [3, 4, 5], [6, 7, 8]], pattern=['abc', 'def', 'ghi']) ==
    [0, 0]
  - Solution().findPattern(board=[[1, 2], [3, 4]], pattern=['ab', 'cd']) == [0, 0]
  - Solution().findPattern(board=[[1, 2, 3], [4, 5, 6], [7, 8, 9]], pattern=['a1', 'b2']) == [-1, -1]
