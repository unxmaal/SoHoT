modality: code
prompt: "Alice and Bob are playing a turn-based game on a circular field surrounded by flowers. The circle\
  \ represents the field, and there are x flowers in the clockwise direction between Alice and Bob, and\
  \ y flowers in the anti-clockwise direction between them.\nThe game proceeds as follows:\n\nAlice takes\
  \ the first turn.\nIn each turn, a player must choose either the clockwise or anti-clockwise direction\
  \ and pick one flower from that side.\nAt the end of the turn, if there are no flowers left at all,\
  \ the current player captures their opponent and wins the game.\n\nGiven two integers, n and m, the\
  \ task is to compute the number of possible pairs (x, y) that satisfy the conditions:\n\nAlice must\
  \ win the game according to the described rules.\nThe number of flowers x in the clockwise direction\
  \ must be in the range [1,n].\nThe number of flowers y in the anti-clockwise direction must be in the\
  \ range [1,m].\n\nReturn the number of possible pairs (x, y) that satisfy the conditions mentioned in\
  \ the statement.\n \nExample 1:\n\nInput: n = 3, m = 2\nOutput: 3\nExplanation: The following pairs\
  \ satisfy conditions described in the statement: (1,2), (3,2), (2,1).\n\nExample 2:\n\nInput: n = 1,\
  \ m = 1\nOutput: 0\nExplanation: No pairs satisfy the conditions described in the statement.\n\n \n\
  Constraints:\n\n1 <= n, m <= 105\n\nWrite the solution in Python as this class, with any imports it\
  \ needs:\n\n```python\nclass Solution:\n    def flowerGame(self, n: int, m: int) -> int:\n```\n\nReturn\
  \ only the code."
assert:
  checks:
  - Solution().flowerGame(n=5, m=7) == 17
  - Solution().flowerGame(n=5, m=4) == 10
  - Solution().flowerGame(n=1, m=1) == 0
  - Solution().flowerGame(n=100, m=200) == 10000
  - Solution().flowerGame(n=4, m=3) == 6
  - Solution().flowerGame(n=100000, m=100000) == 5000000000
  - Solution().flowerGame(n=3, m=2) == 3
  - Solution().flowerGame(n=10, m=10) == 50
  - Solution().flowerGame(n=5, m=5) == 12
  - Solution().flowerGame(n=2, m=2) == 2
