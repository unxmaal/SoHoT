id: lc3464
modality: code
prompt: "You are given an integer side, representing the edge length of a square with corners at (0, 0),\
  \ (0, side), (side, 0), and (side, side) on a Cartesian plane.\nYou are also given a positive integer\
  \ k and a 2D integer array points, where points[i] = [xi, yi] represents the coordinate of a point lying\
  \ on the boundary of the square.\nYou need to select k elements among points such that the minimum Manhattan\
  \ distance between any two points is maximized.\nReturn the maximum possible minimum Manhattan distance\
  \ between the selected k points.\nThe Manhattan Distance between two cells (xi, yi) and (xj, yj) is\
  \ |xi - xj| + |yi - yj|.\n \nExample 1:\n\nInput: side = 2, points = [[0,2],[2,0],[2,2],[0,0]], k =\
  \ 4\nOutput: 2\nExplanation:\n\nSelect all four points.\n\nExample 2:\n\nInput: side = 2, points = [[0,0],[1,2],[2,0],[2,2],[2,1]],\
  \ k = 4\nOutput: 1\nExplanation:\n\nSelect the points (0, 0), (2, 0), (2, 2), and (2, 1).\n\nExample\
  \ 3:\n\nInput: side = 2, points = [[0,0],[0,1],[0,2],[1,2],[2,0],[2,2],[2,1]], k = 5\nOutput: 1\nExplanation:\n\
  \nSelect the points (0, 0), (0, 1), (0, 2), (1, 2), and (2, 2).\n\n \nConstraints:\n\n1 <= side <= 109\n\
  4 <= points.length <= min(4 * side, 15 * 103)\npoints[i] == [xi, yi]\nThe input is generated such that:\n\
  \t\npoints[i] lies on the boundary of the square.\nAll points[i] are unique.\n\n\n4 <= k <= min(25,\
  \ points.length)\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def maxDistance(self, side: int, points: List[List[int]], k: int) -> int:\n```\n\
  \nReturn only the code."
assert:
  checks:
  - Solution().maxDistance(side=4, points=[[0, 0], [0, 1], [0, 2], [0, 3], [0, 4], [1, 4], [2, 4], [3,
    4], [4, 4], [4, 3], [4, 2], [4, 1], [4, 0], [3, 0], [2, 0], [1, 0]], k=8) == 2
  - Solution().maxDistance(side=3, points=[[0, 0], [0, 1], [0, 2], [1, 0], [1, 2], [2, 0], [2, 1], [2,
    2]], k=4) == 1
  - Solution().maxDistance(side=5, points=[[0, 0], [0, 1], [0, 2], [0, 3], [0, 4], [1, 4], [2, 4], [3,
    4], [4, 4], [4, 3], [4, 2], [4, 1], [4, 0], [3, 0], [2, 0], [1, 0]], k=8) == 1
  - Solution().maxDistance(side=3, points=[[0, 0], [0, 1], [0, 2], [0, 3], [3, 0], [3, 1], [3, 2], [3,
    3], [1, 3], [2, 3]], k=6) == 1
  - Solution().maxDistance(side=3, points=[[0, 0], [0, 1], [0, 2], [0, 3], [1, 3], [2, 3], [3, 3], [3,
    2], [3, 1], [3, 0], [2, 0], [1, 0]], k=6) == 2
  - Solution().maxDistance(side=3, points=[[0, 0], [0, 1], [0, 2], [0, 3], [1, 0], [1, 3], [2, 0], [2,
    3], [3, 0], [3, 1], [3, 2], [3, 3]], k=6) == 2
  - Solution().maxDistance(side=4, points=[[0, 0], [0, 1], [0, 2], [0, 3], [0, 4], [4, 0], [4, 1], [4,
    2], [4, 3], [4, 4], [1, 4], [2, 4], [3, 4]], k=7) == 2
  - Solution().maxDistance(side=10, points=[[0, 0], [0, 5], [0, 10], [5, 0], [5, 10], [10, 0], [10, 5],
    [10, 10], [2, 3], [7, 8], [3, 7], [8, 2]], k=6) == 5
  - Solution().maxDistance(side=2, points=[[0, 0], [1, 2], [2, 0], [2, 2], [2, 1]], k=4) == 1
  - Solution().maxDistance(side=2, points=[[0, 0], [0, 1], [0, 2], [1, 2], [2, 0], [2, 2], [2, 1]], k=5)
    == 1
