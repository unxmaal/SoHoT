id: lc3309
modality: code
prompt: "You are given an array of integers nums of size 3.\nReturn the maximum possible number whose\
  \ binary representation can be formed by concatenating the binary representation of all elements in\
  \ nums in some order.\nNote that the binary representation of any number does not contain leading zeros.\n\
   \nExample 1:\n\nInput: nums = [1,2,3]\nOutput: 30\nExplanation:\nConcatenate the numbers in the order\
  \ [3, 1, 2] to get the result \"11110\", which is the binary representation of 30.\n\nExample 2:\n\n\
  Input: nums = [2,8,16]\nOutput: 1296\nExplanation:\nConcatenate the numbers in the order [2, 8, 16]\
  \ to get the result \"10100010000\", which is the binary representation of 1296.\n\n \nConstraints:\n\
  \nnums.length == 3\n1 <= nums[i] <= 127\n\nWrite the solution in Python as this class, with any imports\
  \ it needs:\n\n```python\nclass Solution:\n    def maxGoodNumber(self, nums: List[int]) -> int:\n```\n\
  \nReturn only the code."
assert:
  checks:
  - Solution().maxGoodNumber(nums=[64, 1, 127]) == 32704
  - Solution().maxGoodNumber(nums=[7, 5, 3]) == 253
  - Solution().maxGoodNumber(nums=[127, 127, 127]) == 2097151
  - Solution().maxGoodNumber(nums=[32, 16, 8]) == 17440
  - Solution().maxGoodNumber(nums=[1, 5, 7]) == 125
  - Solution().maxGoodNumber(nums=[64, 32, 16]) == 135232
  - Solution().maxGoodNumber(nums=[1, 2, 3]) == 30
  - Solution().maxGoodNumber(nums=[2, 8, 16]) == 1296
  - Solution().maxGoodNumber(nums=[1, 1, 1]) == 7
  - Solution().maxGoodNumber(nums=[127, 64, 32]) == 1044544
