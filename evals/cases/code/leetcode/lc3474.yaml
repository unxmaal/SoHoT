id: lc3474
modality: code
prompt: "You are given two strings, str1 and str2, of lengths n and m, respectively.\nA string word of\
  \ length n + m - 1 is defined to be generated by str1 and str2 if it satisfies the following conditions\
  \ for each index 0 <= i <= n - 1:\n\nIf str1[i] == 'T', the substring of word with size m starting at\
  \ index i is equal to str2, i.e., word[i..(i + m - 1)] == str2.\nIf str1[i] == 'F', the substring of\
  \ word with size m starting at index i is not equal to str2, i.e., word[i..(i + m - 1)] != str2.\n\n\
  Return the lexicographically smallest possible string that can be generated by str1 and str2. If no\
  \ string can be generated, return an empty string \"\".\n \nExample 1:\n\nInput: str1 = \"TFTF\", str2\
  \ = \"ab\"\nOutput: \"ababa\"\nExplanation:\nThe table below represents the string \"ababa\"\n\n\n\n\
  Index\nT/F\nSubstring of length m\n\n\n0\n'T'\n\"ab\"\n\n\n1\n'F'\n\"ba\"\n\n\n2\n'T'\n\"ab\"\n\n\n\
  3\n'F'\n\"ba\"\n\n\n\nThe strings \"ababa\" and \"ababb\" can be generated by str1 and str2.\nReturn\
  \ \"ababa\" since it is the lexicographically smaller string.\n\nExample 2:\n\nInput: str1 = \"TFTF\"\
  , str2 = \"abc\"\nOutput: \"\"\nExplanation:\nNo string that satisfies the conditions can be generated.\n\
  \nExample 3:\n\nInput: str1 = \"F\", str2 = \"d\"\nOutput: \"a\"\n\n \nConstraints:\n\n1 <= n == str1.length\
  \ <= 104\n1 <= m == str2.length <= 500\nstr1 consists only of 'T' or 'F'.\nstr2 consists only of lowercase\
  \ English characters.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n\
  ```python\nclass Solution:\n    def generateString(self, str1: str, str2: str) -> str:\n```\n\nReturn\
  \ only the code."
assert:
  checks:
  - Solution().generateString(str1='FF', str2='z') == 'aa'
  - Solution().generateString(str1='FT', str2='c') == 'ac'
  - Solution().generateString(str1='FT', str2='yz') == 'ayz'
  - Solution().generateString(str1='TTT', str2='aaa') == 'aaaaa'
  - Solution().generateString(str1='TTT', str2='xyz') == ''
  - Solution().generateString(str1='TF', str2='ab') == 'aba'
  - Solution().generateString(str1='FFF', str2='a') == 'bbb'
  - Solution().generateString(str1='TFTF', str2='abc') == ''
  - Solution().generateString(str1='TT', str2='a') == 'aa'
  - Solution().generateString(str1='F', str2='fgh') == 'aaa'
