id: lc3439
modality: code
prompt: "You are given an integer eventTime denoting the duration of an event, where the event occurs\
  \ from time t = 0 to time t = eventTime.\nYou are also given two integer arrays startTime and endTime,\
  \ each of length n. These represent the start and end time of n non-overlapping meetings, where the\
  \ ith meeting occurs during the time [startTime[i], endTime[i]].\nYou can reschedule at most k meetings\
  \ by moving their start time while maintaining the same duration, to maximize the longest continuous\
  \ period of free time during the event.\nThe relative order of all the meetings should stay the same\
  \ and they should remain non-overlapping.\nReturn the maximum amount of free time possible after rearranging\
  \ the meetings.\nNote that the meetings can not be rescheduled to a time outside the event.\n \nExample\
  \ 1:\n\nInput: eventTime = 5, k = 1, startTime = [1,3], endTime = [2,5]\nOutput: 2\nExplanation:\n\n\
  Reschedule the meeting at [1, 2] to [2, 3], leaving no meetings during the time [0, 2].\n\nExample 2:\n\
  \nInput: eventTime = 10, k = 1, startTime = [0,2,9], endTime = [1,4,10]\nOutput: 6\nExplanation:\n\n\
  Reschedule the meeting at [2, 4] to [1, 3], leaving no meetings during the time [3, 9].\n\nExample 3:\n\
  \nInput: eventTime = 5, k = 2, startTime = [0,1,2,3,4], endTime = [1,2,3,4,5]\nOutput: 0\nExplanation:\n\
  There is no time during the event not occupied by meetings.\n\n \nConstraints:\n\n1 <= eventTime <=\
  \ 109\nn == startTime.length == endTime.length\n2 <= n <= 105\n1 <= k <= n\n0 <= startTime[i] < endTime[i]\
  \ <= eventTime\nendTime[i] <= startTime[i + 1] where i lies in the range [0, n - 2].\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def maxFreeTime(self,\
  \ eventTime: int, k: int, startTime: List[int], endTime: List[int]) -> int:\n```\n\nReturn only the\
  \ code."
assert:
  checks:
  - Solution().maxFreeTime(eventTime=15, k=3, startTime=[1, 5, 9], endTime=[3, 7, 12]) == 8
  - Solution().maxFreeTime(eventTime=10, k=1, startTime=[0, 2, 9], endTime=[1, 4, 10]) == 6
  - Solution().maxFreeTime(eventTime=5, k=1, startTime=[1, 3], endTime=[2, 5]) == 2
  - Solution().maxFreeTime(eventTime=10, k=2, startTime=[0, 3, 6], endTime=[2, 5, 8]) == 4
  - Solution().maxFreeTime(eventTime=5, k=2, startTime=[0, 1, 2, 3, 4], endTime=[1, 2, 3, 4, 5]) == 0
  - Solution().maxFreeTime(eventTime=8, k=2, startTime=[0, 2, 4], endTime=[1, 3, 5]) == 5
  - Solution().maxFreeTime(eventTime=20, k=3, startTime=[0, 3, 6, 9, 12], endTime=[2, 5, 8, 14, 15]) ==
    5
  - Solution().maxFreeTime(eventTime=15, k=3, startTime=[1, 5, 9, 12], endTime=[3, 7, 11, 14]) == 6
  - Solution().maxFreeTime(eventTime=8, k=2, startTime=[1, 3, 6], endTime=[2, 5, 7]) == 3
  - Solution().maxFreeTime(eventTime=15, k=3, startTime=[0, 3, 6, 9], endTime=[2, 5, 8, 12]) == 6
