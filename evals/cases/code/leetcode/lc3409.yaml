prompt: "You are given an array of integers nums.\nYour task is to find the length of the longest subsequence\
  \ seq of nums, such that the absolute differences between consecutive elements form a non-increasing\
  \ sequence of integers. In other words, for a subsequence seq0, seq1, seq2, ..., seqm of nums, |seq1\
  \ - seq0| >= |seq2 - seq1| >= ... >= |seqm - seqm - 1|.\nReturn the length of such a subsequence.\n\
   \nExample 1:\n\nInput: nums = [16,6,3]\nOutput: 3\nExplanation: \nThe longest subsequence is [16, 6,\
  \ 3] with the absolute adjacent differences [10, 3].\n\nExample 2:\n\nInput: nums = [6,5,3,4,2,1]\n\
  Output: 4\nExplanation:\nThe longest subsequence is [6, 4, 2, 1] with the absolute adjacent differences\
  \ [2, 2, 1].\n\nExample 3:\n\nInput: nums = [10,20,10,19,10,20]\nOutput: 5\nExplanation: \nThe longest\
  \ subsequence is [10, 20, 10, 19, 10] with the absolute adjacent differences [10, 10, 9, 9].\n\n \n\
  Constraints:\n\n2 <= nums.length <= 104\n1 <= nums[i] <= 300\n\nWrite the solution in Python as this\
  \ class, with any imports it needs:\n\n```python\nclass Solution:\n    def longestSubsequence(self,\
  \ nums: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().longestSubsequence(nums=[1, 3, 2, 4, 3, 5, 4, 6, 5, 7]) == 6
  - Solution().longestSubsequence(nums=[1, 10, 1, 10, 1, 10, 1, 10]) == 8
  - Solution().longestSubsequence(nums=[300, 1, 300, 2, 300, 3, 300]) == 7
  - Solution().longestSubsequence(nums=[3, 3, 3, 3, 3, 3, 3, 3, 3, 3]) == 10
  - Solution().longestSubsequence(nums=[100, 150, 100, 200, 100, 200, 100]) == 5
  - Solution().longestSubsequence(nums=[300, 299, 298, 297, 296, 295, 294]) == 7
  - Solution().longestSubsequence(nums=[6, 5, 3, 4, 2, 1]) == 4
  - Solution().longestSubsequence(nums=[1, 300, 2, 299, 3, 298, 4, 297]) == 8
  - Solution().longestSubsequence(nums=[10, 10, 10, 10, 10, 10, 10, 10, 10, 10]) == 10
  - Solution().longestSubsequence(nums=[300, 1, 300, 1, 300]) == 5
