modality: code
prompt: "Given a circular array nums, find the maximum absolute difference between adjacent elements.\n\
  Note: In a circular array, the first and last elements are adjacent.\n \nExample 1:\n\nInput: nums =\
  \ [1,2,4]\nOutput: 3\nExplanation:\nBecause nums is circular, nums[0] and nums[2] are adjacent. They\
  \ have the maximum absolute difference of |4 - 1| = 3.\n\nExample 2:\n\nInput: nums = [-5,-10,-5]\n\
  Output: 5\nExplanation:\nThe adjacent elements nums[0] and nums[1] have the maximum absolute difference\
  \ of |-5 - (-10)| = 5.\n\n \nConstraints:\n\n2 <= nums.length <= 100\n-100 <= nums[i] <= 100\n\nWrite\
  \ the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n \
  \   def maxAdjacentDistance(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().maxAdjacentDistance(nums=[100, 1, 100, 1, 100]) == 99
  - Solution().maxAdjacentDistance(nums=[10, 20, 30, 40, 50, 60]) == 50
  - Solution().maxAdjacentDistance(nums=[1, -1, 2, -2, 3, -3]) == 6
  - Solution().maxAdjacentDistance(nums=[50, 45, 40, 35, 30, 25, 20, 15, 10, 5]) == 45
  - Solution().maxAdjacentDistance(nums=[7, 9, 1, 5, 3]) == 8
  - Solution().maxAdjacentDistance(nums=[9, 7, 5, 3, 1]) == 8
  - Solution().maxAdjacentDistance(nums=[-10, 0, 10, -10, 0, 10]) == 20
  - Solution().maxAdjacentDistance(nums=[3, 8, 15, 1, 2]) == 14
  - Solution().maxAdjacentDistance(nums=[50, 50, 50, 50, 50]) == 0
  - Solution().maxAdjacentDistance(nums=[1, 2, 4]) == 3
