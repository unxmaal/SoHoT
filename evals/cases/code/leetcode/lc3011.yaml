id: lc3011
modality: code
prompt: "You are given a 0-indexed array of positive integers nums.\nIn one operation, you can swap any\
  \ two adjacent elements if they have the same number of set bits. You are allowed to do this operation\
  \ any number of times (including zero).\nReturn true if you can sort the array in ascending order, else\
  \ return false.\n \nExample 1:\n\nInput: nums = [8,4,2,30,15]\nOutput: true\nExplanation: Let's look\
  \ at the binary representation of every element. The numbers 2, 4, and 8 have one set bit each with\
  \ binary representation \"10\", \"100\", and \"1000\" respectively. The numbers 15 and 30 have four\
  \ set bits each with binary representation \"1111\" and \"11110\".\nWe can sort the array using 4 operations:\n\
  - Swap nums[0] with nums[1]. This operation is valid because 8 and 4 have one set bit each. The array\
  \ becomes [4,8,2,30,15].\n- Swap nums[1] with nums[2]. This operation is valid because 8 and 2 have\
  \ one set bit each. The array becomes [4,2,8,30,15].\n- Swap nums[0] with nums[1]. This operation is\
  \ valid because 4 and 2 have one set bit each. The array becomes [2,4,8,30,15].\n- Swap nums[3] with\
  \ nums[4]. This operation is valid because 30 and 15 have four set bits each. The array becomes [2,4,8,15,30].\n\
  The array has become sorted, hence we return true.\nNote that there may be other sequences of operations\
  \ which also sort the array.\n\nExample 2:\n\nInput: nums = [1,2,3,4,5]\nOutput: true\nExplanation:\
  \ The array is already sorted, hence we return true.\n\nExample 3:\n\nInput: nums = [3,16,8,4,2]\nOutput:\
  \ false\nExplanation: It can be shown that it is not possible to sort the input array using any number\
  \ of operations.\n\n \nConstraints:\n\n1 <= nums.length <= 100\n1 <= nums[i] <= 28\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def canSortArray(self,\
  \ nums: List[int]) -> bool:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().canSortArray(nums=[1, 3, 2, 7, 6, 5, 4, 8]) == False
  - Solution().canSortArray(nums=[31, 14, 7, 3, 1]) == False
  - Solution().canSortArray(nums=[5, 3, 1, 4, 2]) == False
  - Solution().canSortArray(nums=[5, 3, 9, 6, 12]) == True
  - Solution().canSortArray(nums=[4, 4, 4, 4, 4]) == True
  - Solution().canSortArray(nums=[8, 4, 2, 30, 15]) == True
  - Solution().canSortArray(nums=[7, 6, 5, 4, 3, 2, 1]) == False
  - Solution().canSortArray(nums=[30, 30, 30, 30, 30]) == True
  - Solution().canSortArray(nums=[8, 8, 8, 8, 8]) == True
  - Solution().canSortArray(nums=[16, 8, 4, 2, 32, 1]) == True
