prompt: "Given an array of integers nums and an integer k, return the number of subarrays of nums where\
  \ the bitwise AND of the elements of the subarray equals k.\n \nExample 1:\n\nInput: nums = [1,1,1],\
  \ k = 1\nOutput: 6\nExplanation:\nAll subarrays contain only 1's.\n\nExample 2:\n\nInput: nums = [1,1,2],\
  \ k = 1\nOutput: 3\nExplanation:\nSubarrays having an AND value of 1 are: [1,1,2], [1,1,2], [1,1,2].\n\
  \nExample 3:\n\nInput: nums = [1,2,3], k = 2\nOutput: 2\nExplanation:\nSubarrays having an AND value\
  \ of 2 are: [1,2,3], [1,2,3].\n\n \nConstraints:\n\n1 <= nums.length <= 105\n0 <= nums[i], k <= 109\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def countSubarrays(self, nums: List[int], k: int) -> int:\n```\n\nReturn only the code."
