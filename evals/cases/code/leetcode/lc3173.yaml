prompt: "Given an array nums of length n, return an array answer of length n - 1 such that answer[i] =\
  \ nums[i] | nums[i + 1] where | is the bitwise OR operation.\n \nExample 1:\n\nInput: nums = [1,3,7,15]\n\
  Output: [3,7,15]\n\nExample 2:\n\nInput: nums = [8,4,2]\nOutput: [12,6]\n\nExample 3:\n\nInput: nums\
  \ = [5,4,9,11]\nOutput: [5,13,11]\n\n \nConstraints:\n\n2 <= nums.length <= 100\n0 <= nums[i] <= 100\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def orArray(self, nums: List[int]) -> List[int]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().orArray(nums=[3, 1, 2, 5, 4]) == [3, 3, 7, 5]
  - Solution().orArray(nums=[1, 1, 1, 1]) == [1, 1, 1]
  - Solution().orArray(nums=[1, 2, 4, 8, 16]) == [3, 6, 12, 24]
  - Solution().orArray(nums=[8, 4, 2]) == [12, 6]
  - Solution().orArray(nums=[0, 1, 0, 1, 0]) == [1, 1, 1, 1]
  - Solution().orArray(nums=[99, 98, 97, 96, 95]) == [99, 99, 97, 127]
  - Solution().orArray(nums=[5, 4, 9, 11]) == [5, 13, 11]
  - Solution().orArray(nums=[100, 50, 25, 12]) == [118, 59, 29]
  - Solution().orArray(nums=[7, 6, 5, 4, 3, 2, 1]) == [7, 7, 5, 7, 3, 3]
  - Solution().orArray(nums=[2, 1, 4, 3, 5]) == [3, 5, 7, 7]
