id: lc3441
modality: code
prompt: "You are given a string caption of length n. A good caption is a string where every character\
  \ appears in groups of at least 3 consecutive occurrences.\nFor example:\n\n\"aaabbb\" and \"aaaaccc\"\
  \ are good captions.\n\"aabbb\" and \"ccccd\" are not good captions.\n\nYou can perform the following\
  \ operation any number of times:\nChoose an index i (where 0 <= i < n) and change the character at that\
  \ index to either:\n\nThe character immediately before it in the alphabet (if caption[i] != 'a').\n\
  The character immediately after it in the alphabet (if caption[i] != 'z').\n\nYour task is to convert\
  \ the given caption into a good caption using the minimum number of operations, and return it. If there\
  \ are multiple possible good captions, return the lexicographically smallest one among them. If it is\
  \ impossible to create a good caption, return an empty string \"\".\n \nExample 1:\n\nInput: caption\
  \ = \"cdcd\"\nOutput: \"cccc\"\nExplanation:\nIt can be shown that the given caption cannot be transformed\
  \ into a good caption with fewer than 2 operations. The possible good captions that can be created using\
  \ exactly 2 operations are:\n\n\"dddd\": Change caption[0] and caption[2] to their next character 'd'.\n\
  \"cccc\": Change caption[1] and caption[3] to their previous character 'c'.\n\nSince \"cccc\" is lexicographically\
  \ smaller than \"dddd\", return \"cccc\".\n\nExample 2:\n\nInput: caption = \"aca\"\nOutput: \"aaa\"\
  \nExplanation:\nIt can be proven that the given caption requires at least 2 operations to be transformed\
  \ into a good caption. The only good caption that can be obtained with exactly 2 operations is as follows:\n\
  \nOperation 1: Change caption[1] to 'b'. caption = \"aba\".\nOperation 2: Change caption[1] to 'a'.\
  \ caption = \"aaa\".\n\nThus, return \"aaa\".\n\nExample 3:\n\nInput: caption = \"bc\"\nOutput: \"\"\
  \nExplanation:\nIt can be shown that the given caption cannot be converted to a good caption by using\
  \ any number of operations.\n\n \nConstraints:\n\n1 <= caption.length <= 5 * 104\ncaption consists only\
  \ of lowercase English letters.\n\nWrite the solution in Python as this class, with any imports it needs:\n\
  \n```python\nclass Solution:\n    def minCostGoodCaption(self, caption: str) -> str:\n```\n\nReturn\
  \ only the code."
assert:
  checks:
  - Solution().minCostGoodCaption(caption='cdcd') == 'cccc'
  - Solution().minCostGoodCaption(caption='xyz') == 'yyy'
  - Solution().minCostGoodCaption(caption='aabbccddeeffgghhiijjkkllmmnnooppqqrrssttuuvvwwxxyyzz') == 'aaaaccceeefffhhhiiikkklllnnnoooqqqrrrtttuuuwwwxxxzzz'
  - Solution().minCostGoodCaption(caption='aabbbccc') == 'bbbbbccc'
  - Solution().minCostGoodCaption(caption='abcdefghijklmnopqrstuvwxyz') == 'bbbbffffjjjmmmpppsssvvvyyy'
  - Solution().minCostGoodCaption(caption='cccccc') == 'cccccc'
  - Solution().minCostGoodCaption(caption='abcdefg') == 'bbbbfff'
  - Solution().minCostGoodCaption(caption='aaabbbccc') == 'aaabbbccc'
  - Solution().minCostGoodCaption(caption='aaa') == 'aaa'
  - Solution().minCostGoodCaption(caption='aabbaa') == 'aaaaaa'
