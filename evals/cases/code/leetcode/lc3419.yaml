id: lc3419
modality: code
prompt: "You are given two integers, n and threshold, as well as a directed weighted graph of n nodes\
  \ numbered from 0 to n - 1. The graph is represented by a 2D integer array edges, where edges[i] = [Ai,\
  \ Bi, Wi] indicates that there is an edge going from node Ai to node Bi with weight Wi.\nYou have to\
  \ remove some edges from this graph (possibly none), so that it satisfies the following conditions:\n\
  \nNode 0 must be reachable from all other nodes.\nThe maximum edge weight in the resulting graph is\
  \ minimized.\nEach node has at most threshold outgoing edges.\n\nReturn the minimum possible value of\
  \ the maximum edge weight after removing the necessary edges. If it is impossible for all conditions\
  \ to be satisfied, return -1.\n \nExample 1:\n\nInput: n = 5, edges = [[1,0,1],[2,0,2],[3,0,1],[4,3,1],[2,1,1]],\
  \ threshold = 2\nOutput: 1\nExplanation:\n\nRemove the edge 2 -> 0. The maximum weight among the remaining\
  \ edges is 1.\n\nExample 2:\n\nInput: n = 5, edges = [[0,1,1],[0,2,2],[0,3,1],[0,4,1],[1,2,1],[1,4,1]],\
  \ threshold = 1\nOutput: -1\nExplanation: \nIt is impossible to reach node 0 from node 2.\n\nExample\
  \ 3:\n\nInput: n = 5, edges = [[1,2,1],[1,3,3],[1,4,5],[2,3,2],[3,4,2],[4,0,1]], threshold = 1\nOutput:\
  \ 2\nExplanation: \n\nRemove the edges 1 -> 3 and 1 -> 4. The maximum weight among the remaining edges\
  \ is 2.\n\nExample 4:\n\nInput: n = 5, edges = [[1,2,1],[1,3,3],[1,4,5],[2,3,2],[4,0,1]], threshold\
  \ = 1\nOutput: -1\n\n \nConstraints:\n\n2 <= n <= 105\n1 <= threshold <= n - 1\n1 <= edges.length <=\
  \ min(105, n * (n - 1) / 2).\nedges[i].length == 3\n0 <= Ai, Bi < n\nAi != Bi\n1 <= Wi <= 106\nThere\
  \ may be multiple edges between a pair of nodes, but they must have unique weights.\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minMaxWeight(self,\
  \ n: int, edges: List[List[int]], threshold: int) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minMaxWeight(n=5, edges=[[1, 2, 1], [1, 3, 3], [1, 4, 5], [2, 3, 2], [3, 4, 2], [4, 0,
    1]], threshold=1) == 2
  - Solution().minMaxWeight(n=5, edges=[[1, 0, 1], [2, 0, 2], [3, 0, 1], [4, 3, 1], [2, 1, 1]], threshold=2)
    == 1
  - Solution().minMaxWeight(n=5, edges=[[0, 1, 1], [0, 2, 2], [0, 3, 1], [0, 4, 1], [1, 2, 1], [1, 4,
    1]], threshold=1) == -1
  - Solution().minMaxWeight(n=5, edges=[[1, 2, 1], [1, 3, 3], [1, 4, 5], [2, 3, 2], [4, 0, 1]], threshold=1)
    == -1
  - Solution().minMaxWeight(n=6, edges=[[1, 0, 1], [2, 0, 2], [3, 0, 1], [4, 3, 1], [2, 1, 1], [5, 4,
    3]], threshold=1) == 3
  - Solution().minMaxWeight(n=11, edges=[[0, 1, 1], [1, 2, 2], [2, 3, 3], [3, 4, 4], [4, 5, 5], [5, 6,
    6], [6, 7, 7], [7, 8, 8], [8, 9, 9], [9, 10, 10], [0, 10, 11]], threshold=2) == -1
  - Solution().minMaxWeight(n=12, edges=[[0, 1, 10], [1, 2, 20], [2, 3, 30], [3, 4, 40], [4, 5, 50], [5,
    6, 60], [6, 7, 70], [7, 8, 80], [8, 9, 90], [9, 10, 100], [10, 11, 110], [11, 0, 120]], threshold=4)
    == 120
  - Solution().minMaxWeight(n=10, edges=[[1, 2, 10], [1, 3, 20], [2, 0, 15], [3, 0, 5], [4, 0, 25], [5,
    4, 30], [6, 5, 5], [7, 6, 10], [8, 7, 20], [9, 8, 30]], threshold=2) == 30
  - Solution().minMaxWeight(n=10, edges=[[0, 1, 1], [1, 2, 1], [2, 3, 1], [3, 4, 1], [4, 5, 1], [5, 6,
    1], [6, 7, 1], [7, 8, 1], [8, 9, 1], [9, 0, 1]], threshold=1) == 1
  - Solution().minMaxWeight(n=10, edges=[[0, 1, 10], [1, 0, 10], [0, 2, 10], [2, 0, 10], [0, 3, 10], [3,
    0, 10], [0, 4, 10], [4, 0, 10], [0, 5, 10], [5, 0, 10], [0, 6, 10], [6, 0, 10], [0, 7, 10], [7, 0,
    10], [0, 8, 10], [8, 0, 10], [0, 9, 10], [9, 0, 10]], threshold=1) == 10
