modality: code
prompt: "You are given a string date representing a Gregorian calendar date in the yyyy-mm-dd format.\n\
  date can be written in its binary representation obtained by converting year, month, and day to their\
  \ binary representations without any leading zeroes and writing them down in year-month-day format.\n\
  Return the binary representation of date.\n \nExample 1:\n\nInput: date = \"2080-02-29\"\nOutput: \"\
  100000100000-10-11101\"\nExplanation:\n100000100000, 10, and 11101 are the binary representations of\
  \ 2080, 02, and 29 respectively.\n\nExample 2:\n\nInput: date = \"1900-01-01\"\nOutput: \"11101101100-1-1\"\
  \nExplanation:\n11101101100, 1, and 1 are the binary representations of 1900, 1, and 1 respectively.\n\
  \n \nConstraints:\n\ndate.length == 10\ndate[4] == date[7] == '-', and all other date[i]'s are digits.\n\
  The input is generated such that date represents a valid Gregorian calendar date between Jan 1st, 1900\
  \ and Dec 31st, 2100 (both inclusive).\n\nWrite the solution in Python as this class, with any imports\
  \ it needs:\n\n```python\nclass Solution:\n    def convertDateToBinary(self, date: str) -> str:\n```\n\
  \nReturn only the code."
assert:
  checks:
  - Solution().convertDateToBinary(date='1950-06-30') == '11110011110-110-11110'
  - Solution().convertDateToBinary(date='1912-04-20') == '11101111000-100-10100'
  - Solution().convertDateToBinary(date='2080-02-29') == '100000100000-10-11101'
  - Solution().convertDateToBinary(date='2023-10-05') == '11111100111-1010-101'
  - Solution().convertDateToBinary(date='2100-12-31') == '100000110100-1100-11111'
  - Solution().convertDateToBinary(date='2050-07-17') == '100000000010-111-10001'
  - Solution().convertDateToBinary(date='1984-11-09') == '11111000000-1011-1001'
  - Solution().convertDateToBinary(date='1900-01-01') == '11101101100-1-1'
  - Solution().convertDateToBinary(date='1950-06-15') == '11110011110-110-1111'
  - Solution().convertDateToBinary(date='1999-12-31') == '11111001111-1100-11111'
