modality: code
prompt: "Given a string s containing only digits, return the lexicographically smallest string that can\
  \ be obtained after swapping adjacent digits in s with the same parity at most once.\nDigits have the\
  \ same parity if both are odd or both are even. For example, 5 and 9, as well as 2 and 4, have the same\
  \ parity, while 6 and 9 do not.\n \nExample 1:\n\nInput: s = \"45320\"\nOutput: \"43520\"\nExplanation:\
  \ \ns[1] == '5' and s[2] == '3' both have the same parity, and swapping them results in the lexicographically\
  \ smallest string.\n\nExample 2:\n\nInput: s = \"001\"\nOutput: \"001\"\nExplanation:\nThere is no need\
  \ to perform a swap because s is already the lexicographically smallest.\n\n \nConstraints:\n\n2 <=\
  \ s.length <= 100\ns consists only of digits.\n\nWrite the solution in Python as this class, with any\
  \ imports it needs:\n\n```python\nclass Solution:\n    def getSmallestString(self, s: str) -> str:\n\
  ```\n\nReturn only the code."
assert:
