prompt: "You are given an integer array nums of length n.\nYour goal is to start at index 0 and reach\
  \ index n - 1. You can only jump to indices greater than your current index.\nThe score for a jump from\
  \ index i to index j is calculated as (j - i) * nums[i].\nReturn the maximum possible total score by\
  \ the time you reach the last index.\n \nExample 1:\n\nInput: nums = [1,3,1,5]\nOutput: 7\nExplanation:\n\
  First, jump to index 1 and then jump to the last index. The final score is 1 * 1 + 2 * 3 = 7.\n\nExample\
  \ 2:\n\nInput: nums = [4,3,1,3,2]\nOutput: 16\nExplanation:\nJump directly to the last index. The final\
  \ score is 4 * 4 = 16.\n\n \nConstraints:\n\n1 <= nums.length <= 105\n1 <= nums[i] <= 105\n\nWrite the\
  \ solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def\
  \ findMaximumScore(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
assert:
