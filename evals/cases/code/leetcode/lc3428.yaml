modality: code
prompt: "You are given an integer array nums and a positive integer k. Return the sum of the maximum and\
  \ minimum elements of all subsequences of nums with at most k elements.\nSince the answer may be very\
  \ large, return it modulo 109 + 7.\n \nExample 1:\n\nInput: nums = [1,2,3], k = 2\nOutput: 24\nExplanation:\n\
  The subsequences of nums with at most 2 elements are:\n\n\n\nSubsequence \nMinimum\nMaximum\nSum\n\n\
  \n[1]\n1\n1\n2\n\n\n[2]\n2\n2\n4\n\n\n[3]\n3\n3\n6\n\n\n[1, 2]\n1\n2\n3\n\n\n[1, 3]\n1\n3\n4\n\n\n[2,\
  \ 3]\n2\n3\n5\n\n\nFinal Total\n \n \n24\n\n\n\nThe output would be 24.\n\nExample 2:\n\nInput: nums\
  \ = [5,0,6], k = 1\nOutput: 22\nExplanation: \nFor subsequences with exactly 1 element, the minimum\
  \ and maximum values are the element itself. Therefore, the total is 5 + 5 + 0 + 0 + 6 + 6 = 22.\n\n\
  Example 3:\n\nInput: nums = [1,1,1], k = 2\nOutput: 12\nExplanation:\nThe subsequences [1, 1] and [1]\
  \ each appear 3 times. For all of them, the minimum and maximum are both 1. Thus, the total is 12.\n\
  \n \nConstraints:\n\n1 <= nums.length <= 105\n0 <= nums[i] <= 109\n1 <= k <= min(70, nums.length)\n\n\
  Write the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def minMaxSums(self, nums: List[int], k: int) -> int:\n```\n\nReturn only the code."
