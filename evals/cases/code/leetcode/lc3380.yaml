id: lc3380
modality: code
prompt: "You are given an array points where points[i] = [xi, yi] represents the coordinates of a point\
  \ on an infinite plane.\nYour task is to find the maximum area of a rectangle that:\n\nCan be formed\
  \ using four of these points as its corners.\nDoes not contain any other point inside or on its border.\n\
  Has its edges parallel to the axes.\n\nReturn the maximum area that you can obtain or -1 if no such\
  \ rectangle is possible.\n \nExample 1:\n\nInput: points = [[1,1],[1,3],[3,1],[3,3]]\nOutput: 4\nExplanation:\n\
  \nWe can make a rectangle with these 4 points as corners and there is no other point that lies inside\
  \ or on the border. Hence, the maximum possible area would be 4.\n\nExample 2:\n\nInput: points = [[1,1],[1,3],[3,1],[3,3],[2,2]]\n\
  Output: -1\nExplanation:\n\nThere is only one rectangle possible is with points [1,1], [1,3], [3,1]\
  \ and [3,3] but [2,2] will always lie inside it. Hence, returning -1.\n\nExample 3:\n\nInput: points\
  \ = [[1,1],[1,3],[3,1],[3,3],[1,2],[3,2]]\nOutput: 2\nExplanation:\n\nThe maximum area rectangle is\
  \ formed by the points [1,3], [1,2], [3,2], [3,3], which has an area of 2. Additionally, the points\
  \ [1,1], [1,2], [3,1], [3,2] also form a valid rectangle with the same area.\n\n \nConstraints:\n\n\
  1 <= points.length <= 10\npoints[i].length == 2\n0 <= xi, yi <= 100\nAll the given points are unique.\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def maxRectangleArea(self, points: List[List[int]]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().maxRectangleArea(points=[[0, 0], [0, 1], [1, 0], [1, 1], [2, 2], [2, 3], [3, 2], [3, 3]])
    == 1
  - Solution().maxRectangleArea(points=[[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1], [0, 2], [1, 2],
    [2, 2]]) == 1
  - Solution().maxRectangleArea(points=[[1, 1], [1, 2], [1, 3], [2, 1], [2, 2], [2, 3], [3, 1], [3, 2],
    [3, 3]]) == 1
  - Solution().maxRectangleArea(points=[[0, 0], [0, 1], [1, 0], [1, 1]]) == 1
  - Solution().maxRectangleArea(points=[[1, 1], [1, 3], [3, 1], [3, 3], [1, 2], [3, 2]]) == 2
  - Solution().maxRectangleArea(points=[[1, 1], [1, 3], [3, 1], [3, 3], [2, 2]]) == -1
  - Solution().maxRectangleArea(points=[[10, 10], [10, 20], [20, 10], [20, 20], [15, 15]]) == -1
  - Solution().maxRectangleArea(points=[[1, 1], [2, 2], [3, 3]]) == -1
  - Solution().maxRectangleArea(points=[[5, 5], [5, 7], [7, 5], [7, 7]]) == 4
  - Solution().maxRectangleArea(points=[[10, 10], [10, 20], [20, 10], [20, 20]]) == 100
