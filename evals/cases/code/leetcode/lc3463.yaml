  - Solution().hasSameDigits(s='9876543210') == False
  - Solution().hasSameDigits(s='111') == True
  - Solution().hasSameDigits(s='1234567890') == False
  - Solution().hasSameDigits(s='898989898') == True
  - Solution().hasSameDigits(s='1111111111') == True
  - Solution().hasSameDigits(s='99999') == True
  - Solution().hasSameDigits(s='999999999') == True
  - Solution().hasSameDigits(s='3902') == True
  - Solution().hasSameDigits(s='000000000') == True
  - Solution().hasSameDigits(s='121212121') == True
