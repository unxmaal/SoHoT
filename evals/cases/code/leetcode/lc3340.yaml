modality: code
prompt: "You are given a string num consisting of only digits. A string of digits is called balanced if\
  \ the sum of the digits at even indices is equal to the sum of digits at odd indices.\nReturn true if\
  \ num is balanced, otherwise return false.\n \nExample 1:\n\nInput: num = \"1234\"\nOutput: false\n\
  Explanation:\n\nThe sum of digits at even indices is 1 + 3 == 4, and the sum of digits at odd indices\
  \ is 2 + 4 == 6.\nSince 4 is not equal to 6, num is not balanced.\n\n\nExample 2:\n\nInput: num = \"\
  24123\"\nOutput: true\nExplanation:\n\nThe sum of digits at even indices is 2 + 1 + 3 == 6, and the\
  \ sum of digits at odd indices is 4 + 2 == 6.\nSince both are equal the num is balanced.\n\n\n \nConstraints:\n\
  \n2 <= num.length <= 100\nnum consists of digits only\n\nWrite the solution in Python as this class,\
  \ with any imports it needs:\n\n```python\nclass Solution:\n    def isBalanced(self, num: str) -> bool:\n\
  ```\n\nReturn only the code."
assert:
  checks:
  - Solution().isBalanced(num='1111') == True
  - Solution().isBalanced(num='4321') == False
  - Solution().isBalanced(num='654321') == False
  - Solution().isBalanced(num='55555') == False
  - Solution().isBalanced(num='9876543210') == False
  - Solution().isBalanced(num='98765') == False
  - Solution().isBalanced(num='4321234') == False
  - Solution().isBalanced(num='24123') == True
  - Solution().isBalanced(num='1357924680') == False
  - Solution().isBalanced(num='1234') == False
