prompt: "You are given a string s consisting of lowercase English letters. Your task is to find the maximum\
  \ difference between the frequency of two characters in the string such that:\n\nOne of the characters\
  \ has an even frequency in the string.\nThe other character has an odd frequency in the string.\n\n\
  Return the maximum difference, calculated as the frequency of the character with an odd frequency minus\
  \ the frequency of the character with an even frequency.\n \nExample 1:\n\nInput: s = \"aaaaabbc\"\n\
  Output: 3\nExplanation:\n\nThe character 'a' has an odd frequency of 5, and 'b' has an even frequency\
  \ of 2.\nThe maximum difference is 5 - 2 = 3.\n\n\nExample 2:\n\nInput: s = \"abcabcab\"\nOutput: 1\n\
  Explanation:\n\nThe character 'a' has an odd frequency of 3, and 'c' has an even frequency of 2.\nThe\
  \ maximum difference is 3 - 2 = 1.\n\n\n \nConstraints:\n\n3 <= s.length <= 100\ns consists only of\
  \ lowercase English letters.\ns contains at least one character with an odd frequency and one with an\
  \ even frequency.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def maxDifference(self, s: str) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().maxDifference(s='abacabadabacaba') == -1
  - Solution().maxDifference(s='aaaabbbbccccddddeeeeffffgggghhhhiiiijjjjkkkkllllmmmmnnnnoooo') == -4
  - Solution().maxDifference(s='aabbc') == -1
  - Solution().maxDifference(s='aaabbbcccdddeeefffgghhhiiiijjjjkkkkllllmmmmmnnnnooooo') == 3
  - Solution().maxDifference(s='aabbccdde') == -1
  - Solution().maxDifference(s='aabbccddeeffg') == -1
  - Solution().maxDifference(s='aabbbbccccddddeeeefffgghhiiijjjkkklllmmmnnnooopppqqqrrrssstttuuuvvvwww')
    == 1
  - Solution().maxDifference(s='mmnnnnooooppppqqqqrrrrssssttttuuuuvvvvwwwwxxxxxyyyyzzzz') == 3
  - Solution().maxDifference(s='aabbbccddeeff') == 1
  - Solution().maxDifference(s='abcdefgabcdefg') == -2
