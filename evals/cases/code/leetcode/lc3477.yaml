id: lc3477
modality: code
prompt: "You are given two arrays of integers, fruits and baskets, each of length n, where fruits[i] represents\
  \ the quantity of the ith type of fruit, and baskets[j] represents the capacity of the jth basket.\n\
  From left to right, place the fruits according to these rules:\n\nEach fruit type must be placed in\
  \ the leftmost available basket with a capacity greater than or equal to the quantity of that fruit\
  \ type.\nEach basket can hold only one type of fruit.\nIf a fruit type cannot be placed in any basket,\
  \ it remains unplaced.\n\nReturn the number of fruit types that remain unplaced after all possible allocations\
  \ are made.\n \nExample 1:\n\nInput: fruits = [4,2,5], baskets = [3,5,4]\nOutput: 1\nExplanation:\n\n\
  fruits[0] = 4 is placed in baskets[1] = 5.\nfruits[1] = 2 is placed in baskets[0] = 3.\nfruits[2] =\
  \ 5 cannot be placed in baskets[2] = 4.\n\nSince one fruit type remains unplaced, we return 1.\n\nExample\
  \ 2:\n\nInput: fruits = [3,6,1], baskets = [6,4,7]\nOutput: 0\nExplanation:\n\nfruits[0] = 3 is placed\
  \ in baskets[0] = 6.\nfruits[1] = 6 cannot be placed in baskets[1] = 4 (insufficient capacity) but can\
  \ be placed in the next available basket, baskets[2] = 7.\nfruits[2] = 1 is placed in baskets[1] = 4.\n\
  \nSince all fruits are successfully placed, we return 0.\n\n \nConstraints:\n\nn == fruits.length ==\
  \ baskets.length\n1 <= n <= 100\n1 <= fruits[i], baskets[i] <= 1000\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def numOfUnplacedFruits(self,\
  \ fruits: List[int], baskets: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().numOfUnplacedFruits(fruits=[5, 5, 5, 5], baskets=[4, 4, 4, 4]) == 4
  - Solution().numOfUnplacedFruits(fruits=[100, 200, 300], baskets=[100, 200, 300]) == 0
  - Solution().numOfUnplacedFruits(fruits=[1, 3, 5, 7], baskets=[2, 4, 6, 8]) == 0
  - Solution().numOfUnplacedFruits(fruits=[10, 10, 10], baskets=[5, 5, 5, 5, 5]) == 3
  - Solution().numOfUnplacedFruits(fruits=[10, 20, 30], baskets=[5, 15, 25]) == 1
  - Solution().numOfUnplacedFruits(fruits=[5, 5, 5], baskets=[5, 5, 5]) == 0
  - Solution().numOfUnplacedFruits(fruits=[10, 20, 30], baskets=[10, 20, 30]) == 0
  - Solution().numOfUnplacedFruits(fruits=[5, 5, 5, 5], baskets=[1, 1, 1, 1]) == 4
  - Solution().numOfUnplacedFruits(fruits=[100, 100], baskets=[50, 50]) == 2
  - Solution().numOfUnplacedFruits(fruits=[100, 200, 300], baskets=[50, 150, 250]) == 1
