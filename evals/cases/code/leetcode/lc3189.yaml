modality: code
prompt: "Given a 2D array rooks of length n, where rooks[i] = [xi, yi] indicates the position of a rook\
  \ on an n x n chess board. Your task is to move the rooks 1 cell at a time vertically or horizontally\
  \ (to an adjacent cell) such that the board becomes peaceful.\nA board is peaceful if there is exactly\
  \ one rook in each row and each column.\nReturn the minimum number of moves required to get a peaceful\
  \ board.\nNote that at no point can there be two rooks in the same cell.\n \nExample 1:\n\nInput: rooks\
  \ = [[0,0],[1,0],[1,1]]\nOutput: 3\nExplanation:\n\nExample 2:\n\nInput: rooks = [[0,0],[0,1],[0,2],[0,3]]\n\
  Output: 6\nExplanation:\n\n \nConstraints:\n\n1 <= n == rooks.length <= 500\n0 <= xi, yi <= n - 1\n\
  The input is generated such that there are no 2 rooks in the same cell.\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minMoves(self, rooks:\
  \ List[List[int]]) -> int:\n```\n\nReturn only the code."
assert:
