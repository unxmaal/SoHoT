prompt: "You are given an integer array nums of even length. You have to split the array into two parts\
  \ nums1 and nums2 such that:\n\nnums1.length == nums2.length == nums.length / 2.\nnums1 should contain\
  \ distinct elements.\nnums2 should also contain distinct elements.\n\nReturn true if it is possible\
  \ to split the array, and false otherwise.\n \nExample 1:\n\nInput: nums = [1,1,2,2,3,4]\nOutput: true\n\
  Explanation: One of the possible ways to split nums is nums1 = [1,2,3] and nums2 = [1,2,4].\n\nExample\
  \ 2:\n\nInput: nums = [1,1,1,1]\nOutput: false\nExplanation: The only possible way to split nums is\
  \ nums1 = [1,1] and nums2 = [1,1]. Both nums1 and nums2 do not contain distinct elements. Therefore,\
  \ we return false.\n\n \nConstraints:\n\n1 <= nums.length <= 100\nnums.length % 2 == 0 \n1 <= nums[i]\
  \ <= 100\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass\
  \ Solution:\n    def isPossibleToSplit(self, nums: List[int]) -> bool:\n```\n\nReturn only the code."
