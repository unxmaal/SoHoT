id: lc3326
modality: code
prompt: "You are given an integer array nums.\nAny positive divisor of a natural number x that is strictly\
  \ less than x is called a proper divisor of x. For example, 2 is a proper divisor of 4, while 6 is not\
  \ a proper divisor of 6.\nYou are allowed to perform an operation any number of times on nums, where\
  \ in each operation you select any one element from nums and divide it by its greatest proper divisor.\n\
  Return the minimum number of operations required to make the array non-decreasing.\nIf it is not possible\
  \ to make the array non-decreasing using any number of operations, return -1.\n \nExample 1:\n\nInput:\
  \ nums = [25,7]\nOutput: 1\nExplanation:\nUsing a single operation, 25 gets divided by 5 and nums becomes\
  \ [5, 7].\n\nExample 2:\n\nInput: nums = [7,7,6]\nOutput: -1\n\nExample 3:\n\nInput: nums = [1,1,1,1]\n\
  Output: 0\n\n \nConstraints:\n\n1 <= nums.length <= 105\n1 <= nums[i] <= 106\n\nWrite the solution in\
  \ Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minOperations(self,\
  \ nums: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minOperations(nums=[2, 3, 4, 6, 9]) == 0
  - Solution().minOperations(nums=[9, 3, 1]) == -1
  - Solution().minOperations(nums=[1, 1, 1, 1]) == 0
  - Solution().minOperations(nums=[10, 5, 3]) == -1
  - Solution().minOperations(nums=[3, 9, 27]) == 0
  - Solution().minOperations(nums=[8, 4, 2, 1]) == -1
  - Solution().minOperations(nums=[5, 15, 45, 135]) == 0
  - Solution().minOperations(nums=[100, 25, 5]) == 2
  - Solution().minOperations(nums=[4, 4, 8, 2]) == 3
  - Solution().minOperations(nums=[4, 2, 1]) == -1
