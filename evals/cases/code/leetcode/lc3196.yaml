id: lc3196
modality: code
prompt: "You are given an integer array nums with length n.\nThe cost of a subarray nums[l..r], where\
  \ 0 <= l <= r < n, is defined as:\ncost(l, r) = nums[l] - nums[l + 1] + ... + nums[r] * (−1)r − l\n\
  Your task is to split nums into subarrays such that the total cost of the subarrays is maximized, ensuring\
  \ each element belongs to exactly one subarray.\nFormally, if nums is split into k subarrays, where\
  \ k > 1, at indices i1, i2, ..., ik − 1, where 0 <= i1 < i2 < ... < ik - 1 < n - 1, then the total cost\
  \ will be:\ncost(0, i1) + cost(i1 + 1, i2) + ... + cost(ik − 1 + 1, n − 1)\nReturn an integer denoting\
  \ the maximum total cost of the subarrays after splitting the array optimally.\nNote: If nums is not\
  \ split into subarrays, i.e. k = 1, the total cost is simply cost(0, n - 1).\n \nExample 1:\n\nInput:\
  \ nums = [1,-2,3,4]\nOutput: 10\nExplanation:\nOne way to maximize the total cost is by splitting [1,\
  \ -2, 3, 4] into subarrays [1, -2, 3] and [4]. The total cost will be (1 + 2 + 3) + 4 = 10.\n\nExample\
  \ 2:\n\nInput: nums = [1,-1,1,-1]\nOutput: 4\nExplanation:\nOne way to maximize the total cost is by\
  \ splitting [1, -1, 1, -1] into subarrays [1, -1] and [1, -1]. The total cost will be (1 + 1) + (1 +\
  \ 1) = 4.\n\nExample 3:\n\nInput: nums = [0]\nOutput: 0\nExplanation:\nWe cannot split the array further,\
  \ so the answer is 0.\n\nExample 4:\n\nInput: nums = [1,-1]\nOutput: 2\nExplanation:\nSelecting the\
  \ whole array gives a total cost of 1 + 1 = 2, which is the maximum.\n\n \nConstraints:\n\n1 <= nums.length\
  \ <= 105\n-109 <= nums[i] <= 109\n\nWrite the solution in Python as this class, with any imports it\
  \ needs:\n\n```python\nclass Solution:\n    def maximumTotalCost(self, nums: List[int]) -> int:\n```\n\
  \nReturn only the code."
assert:
  checks:
  - Solution().maximumTotalCost(nums=[5, -3, 8, 7, -2, 6]) == 31
  - Solution().maximumTotalCost(nums=[5, -3, 2, 7, -6, 1]) == 24
  - Solution().maximumTotalCost(nums=[5, -3, 2, -4, 6]) == 20
  - Solution().maximumTotalCost(nums=[1]) == 1
  - Solution().maximumTotalCost(nums=[1, -1, 1, -1]) == 4
  - Solution().maximumTotalCost(nums=[1, -2, 3, 4]) == 10
  - Solution().maximumTotalCost(nums=[1, -1]) == 2
  - Solution().maximumTotalCost(nums=[1000000000, -1000000000, 1000000000, -1000000000, 1000000000]) ==
    5000000000
  - Solution().maximumTotalCost(nums=[-1, -2, -3, -4, -5]) == 1
  - Solution().maximumTotalCost(nums=[-5, -3, -8, -7, -2, -6]) == 1
