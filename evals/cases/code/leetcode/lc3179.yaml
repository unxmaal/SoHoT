prompt: "You are given two integers n and k.\nInitially, you start with an array a of n integers where\
  \ a[i] = 1 for all 0 <= i <= n - 1. After each second, you simultaneously update each element to be\
  \ the sum of all its preceding elements plus the element itself. For example, after one second, a[0]\
  \ remains the same, a[1] becomes a[0] + a[1], a[2] becomes a[0] + a[1] + a[2], and so on.\nReturn the\
  \ value of a[n - 1] after k seconds.\nSince the answer may be very large, return it modulo 109 + 7.\n\
   \nExample 1:\n\nInput: n = 4, k = 5\nOutput: 56\nExplanation:\n\n\n\nSecond\nState After\n\n\n0\n[1,1,1,1]\n\
  \n\n1\n[1,2,3,4]\n\n\n2\n[1,3,6,10]\n\n\n3\n[1,4,10,20]\n\n\n4\n[1,5,15,35]\n\n\n5\n[1,6,21,56]\n\n\n\
  \n\nExample 2:\n\nInput: n = 5, k = 3\nOutput: 35\nExplanation:\n\n\n\nSecond\nState After\n\n\n0\n\
  [1,1,1,1,1]\n\n\n1\n[1,2,3,4,5]\n\n\n2\n[1,3,6,10,15]\n\n\n3\n[1,4,10,20,35]\n\n\n\n\n \nConstraints:\n\
  \n1 <= n, k <= 1000\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def valueAfterKSeconds(self, n: int, k: int) -> int:\n```\n\nReturn only the code."
