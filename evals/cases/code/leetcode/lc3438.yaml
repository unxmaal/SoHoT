  \ when traversing from left to right. If no valid pair exists, return an empty string.\n \nExample 1:\n\
  \nInput: s = \"2523533\"\nOutput: \"23\"\nExplanation:\nDigit '2' appears 2 times and digit '3' appears\
  \ 3 times. Each digit in the pair \"23\" appears in s exactly as many times as its numeric value. Hence,\
  \ the output is \"23\".\n\nExample 2:\n\nInput: s = \"221\"\nOutput: \"21\"\nExplanation:\nDigit '2'\
  \ appears 2 times and digit '1' appears 1 time. Hence, the output is \"21\".\n\nExample 3:\n\nInput:\
  \ s = \"22\"\nOutput: \"\"\nExplanation:\nThere are no valid adjacent pairs.\n\n \nConstraints:\n\n\
