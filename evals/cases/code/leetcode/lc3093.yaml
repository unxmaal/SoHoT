id: lc3093
modality: code
prompt: "You are given two arrays of strings wordsContainer and wordsQuery.\nFor each wordsQuery[i], you\
  \ need to find a string from wordsContainer that has the longest common suffix with wordsQuery[i]. If\
  \ there are two or more strings in wordsContainer that share the longest common suffix, find the string\
  \ that is the smallest in length. If there are two or more such strings that have the same smallest\
  \ length, find the one that occurred earlier in wordsContainer.\nReturn an array of integers ans, where\
  \ ans[i] is the index of the string in wordsContainer that has the longest common suffix with wordsQuery[i].\n\
   \nExample 1:\n\nInput: wordsContainer = [\"abcd\",\"bcd\",\"xbcd\"], wordsQuery = [\"cd\",\"bcd\",\"\
  xyz\"]\nOutput: [1,1,1]\nExplanation:\nLet's look at each wordsQuery[i] separately:\n\nFor wordsQuery[0]\
  \ = \"cd\", strings from wordsContainer that share the longest common suffix \"cd\" are at indices 0,\
  \ 1, and 2. Among these, the answer is the string at index 1 because it has the shortest length of 3.\n\
  For wordsQuery[1] = \"bcd\", strings from wordsContainer that share the longest common suffix \"bcd\"\
  \ are at indices 0, 1, and 2. Among these, the answer is the string at index 1 because it has the shortest\
  \ length of 3.\nFor wordsQuery[2] = \"xyz\", there is no string from wordsContainer that shares a common\
  \ suffix. Hence the longest common suffix is \"\", that is shared with strings at index 0, 1, and 2.\
  \ Among these, the answer is the string at index 1 because it has the shortest length of 3.\n\n\nExample\
  \ 2:\n\nInput: wordsContainer = [\"abcdefgh\",\"poiuygh\",\"ghghgh\"], wordsQuery = [\"gh\",\"acbfgh\"\
  ,\"acbfegh\"]\nOutput: [2,0,2]\nExplanation:\nLet's look at each wordsQuery[i] separately:\n\nFor wordsQuery[0]\
  \ = \"gh\", strings from wordsContainer that share the longest common suffix \"gh\" are at indices 0,\
  \ 1, and 2. Among these, the answer is the string at index 2 because it has the shortest length of 6.\n\
  For wordsQuery[1] = \"acbfgh\", only the string at index 0 shares the longest common suffix \"fgh\"\
  . Hence it is the answer, even though the string at index 2 is shorter.\nFor wordsQuery[2] = \"acbfegh\"\
  , strings from wordsContainer that share the longest common suffix \"gh\" are at indices 0, 1, and 2.\
  \ Among these, the answer is the string at index 2 because it has the shortest length of 6.\n\n\n \n\
  Constraints:\n\n1 <= wordsContainer.length, wordsQuery.length <= 104\n1 <= wordsContainer[i].length\
  \ <= 5 * 103\n1 <= wordsQuery[i].length <= 5 * 103\nwordsContainer[i] consists only of lowercase English\
  \ letters.\nwordsQuery[i] consists only of lowercase English letters.\nSum of wordsContainer[i].length\
  \ is at most 5 * 105.\nSum of wordsQuery[i].length is at most 5 * 105.\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def stringIndices(self,\
  \ wordsContainer: List[str], wordsQuery: List[str]) -> List[int]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().stringIndices(wordsContainer=['banana', 'mango', 'papaya'], wordsQuery=['ana', 'ango',
    'aya']) == [0, 1, 2]
  - Solution().stringIndices(wordsContainer=['abcde', 'bcde', 'cde', 'de', 'e'], wordsQuery=['cde', 'de',
    'e', 'a', 'b']) == [2, 3, 4, 4, 4]
  - Solution().stringIndices(wordsContainer=['xyz', 'zyx', 'zxy'], wordsQuery=['x', 'y', 'z']) == [1,
    2, 0]
  - Solution().stringIndices(wordsContainer=['zzzzz', 'zzzz', 'zzz', 'zz', 'z'], wordsQuery=['zzzz', 'zzz',
    'zz', 'z', 'a']) == [1, 2, 3, 4, 4]
  - Solution().stringIndices(wordsContainer=['a', 'ab', 'abc'], wordsQuery=['a', 'ab', 'abc']) == [0,
    1, 2]
  - Solution().stringIndices(wordsContainer=['unique', 'suffix', 'words'], wordsQuery=['fix', 'ffix',
    'uffix']) == [1, 1, 1]
  - Solution().stringIndices(wordsContainer=['abcd', 'bcd', 'xbcd'], wordsQuery=['cd', 'bcd', 'xyz'])
    == [1, 1, 1]
  - Solution().stringIndices(wordsContainer=['hello', 'world', 'python'], wordsQuery=['lo', 'rld', 'on'])
    == [0, 1, 2]
  - Solution().stringIndices(wordsContainer=['a', 'b', 'c'], wordsQuery=['d', 'e', 'f']) == [0, 0, 0]
  - Solution().stringIndices(wordsContainer=['abcdefgh', 'poiuygh', 'ghghgh'], wordsQuery=['gh', 'acbfgh',
    'acbfegh']) == [2, 0, 2]
