id: lc3298
modality: code
prompt: "You are given two strings word1 and word2.\nA string x is called valid if x can be rearranged\
  \ to have word2 as a prefix.\nReturn the total number of valid substrings of word1.\nNote that the memory\
  \ limits in this problem are smaller than usual, so you must implement a solution with a linear runtime\
  \ complexity.\n \nExample 1:\n\nInput: word1 = \"bcca\", word2 = \"abc\"\nOutput: 1\nExplanation:\n\
  The only valid substring is \"bcca\" which can be rearranged to \"abcc\" having \"abc\" as a prefix.\n\
  \nExample 2:\n\nInput: word1 = \"abcabc\", word2 = \"abc\"\nOutput: 10\nExplanation:\nAll the substrings\
  \ except substrings of size 1 and size 2 are valid.\n\nExample 3:\n\nInput: word1 = \"abcabc\", word2\
  \ = \"aaabc\"\nOutput: 0\n\n \nConstraints:\n\n1 <= word1.length <= 106\n1 <= word2.length <= 104\n\
  word1 and word2 consist only of lowercase English letters.\n\nWrite the solution in Python as this class,\
  \ with any imports it needs:\n\n```python\nclass Solution:\n    def validSubstringCount(self, word1:\
  \ str, word2: str) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().validSubstringCount(word1='bcca', word2='abc') == 1
  - Solution().validSubstringCount(word1='abcdefghijklmnopqrstuvwxyz', word2='zyxwvutsrqponmlkjihgfedcba')
    == 1
  - Solution().validSubstringCount(word1='aabbcc', word2='abc') == 4
  - Solution().validSubstringCount(word1='abcabcabcabc', word2='abcabc') == 28
  - Solution().validSubstringCount(word1='hellothere', word2='oth') == 21
  - Solution().validSubstringCount(word1='abcabc', word2='aaabc') == 0
  - Solution().validSubstringCount(word1='aaaaaaa', word2='a') == 28
  - Solution().validSubstringCount(word1='abcabc', word2='abc') == 10
  - Solution().validSubstringCount(word1='mississippi', word2='issi') == 27
  - Solution().validSubstringCount(word1='teststring', word2='ttt') == 5
