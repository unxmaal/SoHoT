prompt: "Given an array nums of n integers, your task is to find the maximum value of k for which there\
  \ exist two adjacent subarrays of length k each, such that both subarrays are strictly increasing. Specifically,\
  \ check if there are two subarrays of length k starting at indices a and b (a < b), where:\n\nBoth subarrays\
  \ nums[a..a + k - 1] and nums[b..b + k - 1] are strictly increasing.\nThe subarrays must be adjacent,\
  \ meaning b = a + k.\n\nReturn the maximum possible value of k.\nA subarray is a contiguous non-empty\
  \ sequence of elements within an array.\n \nExample 1:\n\nInput: nums = [2,5,7,8,9,2,3,4,3,1]\nOutput:\
  \ 3\nExplanation:\n\nThe subarray starting at index 2 is [7, 8, 9], which is strictly increasing.\n\
  The subarray starting at index 5 is [2, 3, 4], which is also strictly increasing.\nThese two subarrays\
  \ are adjacent, and 3 is the maximum possible value of k for which two such adjacent strictly increasing\
  \ subarrays exist.\n\n\nExample 2:\n\nInput: nums = [1,2,3,4,4,4,4,5,6,7]\nOutput: 2\nExplanation:\n\
  \nThe subarray starting at index 0 is [1, 2], which is strictly increasing.\nThe subarray starting at\
  \ index 2 is [3, 4], which is also strictly increasing.\nThese two subarrays are adjacent, and 2 is\
  \ the maximum possible value of k for which two such adjacent strictly increasing subarrays exist.\n\
  \n\n \nConstraints:\n\n2 <= nums.length <= 2 * 105\n-109 <= nums[i] <= 109\n\nWrite the solution in\
  \ Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def maxIncreasingSubarrays(self,\
  \ nums: List[int]) -> int:\n```\n\nReturn only the code."
