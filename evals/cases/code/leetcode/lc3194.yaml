  - Solution().minimumAverage(nums=[2, 1, 5, 4, 9, 8]) == 4.5
  - Solution().minimumAverage(nums=[1, 9, 8, 3, 10, 5]) == 5.5
  - Solution().minimumAverage(nums=[10, 20, 30, 40, 50, 60]) == 35.0
  - Solution().minimumAverage(nums=[25, 25, 25, 25, 25, 25]) == 25.0
  - Solution().minimumAverage(nums=[2, 3, 10, 1, 11, 5, 4, 8]) == 4.5
  - Solution().minimumAverage(nums=[50, 49, 48, 47, 46, 45]) == 47.5
  - Solution().minimumAverage(nums=[2, 4, 6, 8, 10, 12]) == 7.0
  - Solution().minimumAverage(nums=[1, 5, 9, 13, 17, 21]) == 11.0
  - Solution().minimumAverage(nums=[2, 3, 1, 4, 6, 5]) == 3.5
  - Solution().minimumAverage(nums=[1, 3, 5, 7, 9, 11]) == 6.0
