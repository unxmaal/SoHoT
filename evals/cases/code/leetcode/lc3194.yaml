modality: code
prompt: "You have an array of floating point numbers averages which is initially empty. You are given\
  \ an array nums of n integers where n is even.\nYou repeat the following procedure n / 2 times:\n\n\
  Remove the smallest element, minElement, and the largest element maxElement, from nums.\nAdd (minElement\
  \ + maxElement) / 2 to averages.\n\nReturn the minimum element in averages.\n \nExample 1:\n\nInput:\
  \ nums = [7,8,3,4,15,13,4,1]\nOutput: 5.5\nExplanation:\n\n\n\nstep\nnums\naverages\n\n\n0\n[7,8,3,4,15,13,4,1]\n\
  []\n\n\n1\n[7,8,3,4,13,4]\n[8]\n\n\n2\n[7,8,4,4]\n[8,8]\n\n\n3\n[7,4]\n[8,8,6]\n\n\n4\n[]\n[8,8,6,5.5]\n\
  \n\n\nThe smallest element of averages, 5.5, is returned.\nExample 2:\n\nInput: nums = [1,9,8,3,10,5]\n\
  Output: 5.5\nExplanation:\n\n\n\nstep\nnums\naverages\n\n\n0\n[1,9,8,3,10,5]\n[]\n\n\n1\n[9,8,3,5]\n\
  [5.5]\n\n\n2\n[8,5]\n[5.5,6]\n\n\n3\n[]\n[5.5,6,6.5]\n\n\n\n\nExample 3:\n\nInput: nums = [1,2,3,7,8,9]\n\
  Output: 5.0\nExplanation:\n\n\n\nstep\nnums\naverages\n\n\n0\n[1,2,3,7,8,9]\n[]\n\n\n1\n[2,3,7,8]\n\
  [5]\n\n\n2\n[3,7]\n[5,5]\n\n\n3\n[]\n[5,5,5]\n\n\n\n\n \nConstraints:\n\n2 <= n == nums.length <= 50\n\
  n is even.\n1 <= nums[i] <= 50\n\nWrite the solution in Python as this class, with any imports it needs:\n\
  \n```python\nclass Solution:\n    def minimumAverage(self, nums: List[int]) -> float:\n```\n\nReturn\
  \ only the code."
assert:
