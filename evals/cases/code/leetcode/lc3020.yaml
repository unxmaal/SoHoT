id: lc3020
modality: code
prompt: "You are given an array of positive integers nums.\nYou need to select a subset of nums which\
  \ satisfies the following condition:\n\nYou can place the selected elements in a 0-indexed array such\
  \ that it follows the pattern: [x, x2, x4, ..., xk/2, xk, xk/2, ..., x4, x2, x] (Note that k can be\
  \ be any non-negative power of 2). For example, [2, 4, 16, 4, 2] and [3, 9, 3] follow the pattern while\
  \ [2, 4, 8, 4, 2] does not.\n\nReturn the maximum number of elements in a subset that satisfies these\
  \ conditions.\n \nExample 1:\n\nInput: nums = [5,4,1,2,2]\nOutput: 3\nExplanation: We can select the\
  \ subset {4,2,2}, which can be placed in the array as [2,4,2] which follows the pattern and 22 == 4.\
  \ Hence the answer is 3.\n\nExample 2:\n\nInput: nums = [1,3,2,4]\nOutput: 1\nExplanation: We can select\
  \ the subset {1}, which can be placed in the array as [1] which follows the pattern. Hence the answer\
  \ is 1. Note that we could have also selected the subsets {2}, {3}, or {4}, there may be multiple subsets\
  \ which provide the same answer. \n\n \nConstraints:\n\n2 <= nums.length <= 105\n1 <= nums[i] <= 109\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def maximumLength(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().maximumLength(nums=[9, 81, 729, 6561, 729, 81, 9]) == 5
  - Solution().maximumLength(nums=[1000000000, 1000000000, 1000000000, 1000000000, 1000000000]) == 1
  - Solution().maximumLength(nums=[2, 4, 8, 16, 32, 16, 8, 4, 2]) == 5
  - Solution().maximumLength(nums=[2, 2, 2, 2, 2, 2, 2, 2, 2, 2]) == 1
  - Solution().maximumLength(nums=[5, 5, 25, 25, 625, 625, 390625, 390625]) == 7
  - Solution().maximumLength(nums=[2, 4, 8, 4, 2]) == 3
  - Solution().maximumLength(nums=[1]) == 1
  - Solution().maximumLength(nums=[10, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000])
    == 1
  - Solution().maximumLength(nums=[5, 25, 625, 390625, 152587890625]) == 1
  - Solution().maximumLength(nums=[2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]) == 1
