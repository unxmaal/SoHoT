id: lc3285
modality: code
prompt: "There are n mountains in a row, and each mountain has a height. You are given an integer array\
  \ height where height[i] represents the height of mountain i, and an integer threshold.\nA mountain\
  \ is called stable if the mountain just before it (if it exists) has a height strictly greater than\
  \ threshold. Note that mountain 0 is not stable.\nReturn an array containing the indices of all stable\
  \ mountains in any order.\n \nExample 1:\n\nInput: height = [1,2,3,4,5], threshold = 2\nOutput: [3,4]\n\
  Explanation:\n\nMountain 3 is stable because height[2] == 3 is greater than threshold == 2.\nMountain\
  \ 4 is stable because height[3] == 4 is greater than threshold == 2.\n\n\nExample 2:\n\nInput: height\
  \ = [10,1,10,1,10], threshold = 3\nOutput: [1,3]\n\nExample 3:\n\nInput: height = [10,1,10,1,10], threshold\
  \ = 10\nOutput: []\n\n \nConstraints:\n\n2 <= n == height.length <= 100\n1 <= height[i] <= 100\n1 <=\
  \ threshold <= 100\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def stableMountains(self, height: List[int], threshold: int) -> List[int]:\n```\n\
  \nReturn only the code."
assert:
  checks:
  - Solution().stableMountains(height=[50, 50, 50, 50, 50], threshold=49) == [1, 2, 3, 4]
  - Solution().stableMountains(height=[2, 3, 2, 3, 2], threshold=2) == [2, 4]
  - Solution().stableMountains(height=[5, 4, 3, 2, 1], threshold=3) == [1, 2]
  - Solution().stableMountains(height=[10, 1, 10, 1, 10], threshold=3) == [1, 3]
  - Solution().stableMountains(height=[1, 3, 5, 7, 9], threshold=0) == [1, 2, 3, 4]
  - Solution().stableMountains(height=[9, 8, 7, 6, 5], threshold=5) == [1, 2, 3, 4]
  - Solution().stableMountains(height=[5, 4, 3, 2, 1], threshold=1) == [1, 2, 3, 4]
  - Solution().stableMountains(height=[1, 2, 3, 4, 5], threshold=2) == [3, 4]
  - Solution().stableMountains(height=[5, 6, 7, 8, 9], threshold=5) == [2, 3, 4]
  - Solution().stableMountains(height=[1, 2, 3, 2, 1], threshold=1) == [2, 3, 4]
