id: lc3043
modality: code
prompt: "You are given two arrays with positive integers arr1 and arr2.\nA prefix of a positive integer\
  \ is an integer formed by one or more of its digits, starting from its leftmost digit. For example,\
  \ 123 is a prefix of the integer 12345, while 234 is not.\nA common prefix of two integers a and b is\
  \ an integer c, such that c is a prefix of both a and b. For example, 5655359 and 56554 have common\
  \ prefixes 565 and 5655 while 1223 and 43456 do not have a common prefix.\nYou need to find the length\
  \ of the longest common prefix between all pairs of integers (x, y) such that x belongs to arr1 and\
  \ y belongs to arr2.\nReturn the length of the longest common prefix among all pairs. If no common prefix\
  \ exists among them, return 0.\n \nExample 1:\n\nInput: arr1 = [1,10,100], arr2 = [1000]\nOutput: 3\n\
  Explanation: There are 3 pairs (arr1[i], arr2[j]):\n- The longest common prefix of (1, 1000) is 1.\n\
  - The longest common prefix of (10, 1000) is 10.\n- The longest common prefix of (100, 1000) is 100.\n\
  The longest common prefix is 100 with a length of 3.\n\nExample 2:\n\nInput: arr1 = [1,2,3], arr2 =\
  \ [4,4,4]\nOutput: 0\nExplanation: There exists no common prefix for any pair (arr1[i], arr2[j]), hence\
  \ we return 0.\nNote that common prefixes between elements of the same array do not count.\n\n \nConstraints:\n\
  \n1 <= arr1.length, arr2.length <= 5 * 104\n1 <= arr1[i], arr2[i] <= 108\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def longestCommonPrefix(self,\
  \ arr1: List[int], arr2: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().longestCommonPrefix(arr1=[100000, 99999, 88888], arr2=[10000, 9999, 8888]) == 5
  - Solution().longestCommonPrefix(arr1=[1, 10, 100, 1000], arr2=[1000, 10000, 100000]) == 4
  - Solution().longestCommonPrefix(arr1=[1, 1, 1], arr2=[1, 1, 1]) == 1
  - Solution().longestCommonPrefix(arr1=[100000000], arr2=[10000000, 1000000, 100000]) == 8
  - Solution().longestCommonPrefix(arr1=[123, 456, 789], arr2=[12345, 45678, 78901]) == 3
  - Solution().longestCommonPrefix(arr1=[1, 2, 3], arr2=[4, 4, 4]) == 0
  - Solution().longestCommonPrefix(arr1=[1], arr2=[2]) == 0
  - Solution().longestCommonPrefix(arr1=[10, 20, 30], arr2=[100, 200, 300]) == 2
  - Solution().longestCommonPrefix(arr1=[5, 55, 555], arr2=[5, 50, 55]) == 2
  - Solution().longestCommonPrefix(arr1=[987654321], arr2=[987654321, 98765432, 987654]) == 9
