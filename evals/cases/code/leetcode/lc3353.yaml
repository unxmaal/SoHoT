prompt: "Given an array of integers nums, you can perform any number of operations on this array.\nIn\
  \ each operation, you can:\n\nChoose a prefix of the array.\nChoose an integer k (which can be negative)\
  \ and add k to each element in the chosen prefix.\n\nA prefix of an array is a subarray that starts\
  \ from the beginning of the array and extends to any point within it.\nReturn the minimum number of\
  \ operations required to make all elements in arr equal.\n \nExample 1:\n\nInput: nums = [1,4,2]\nOutput:\
  \ 2\nExplanation:\n\nOperation 1: Choose the prefix [1, 4] of length 2 and add -2 to each element of\
  \ the prefix. The array becomes [-1, 2, 2].\nOperation 2: Choose the prefix [-1] of length 1 and add\
  \ 3 to it. The array becomes [2, 2, 2].\nThus, the minimum number of required operations is 2.\n\n\n\
  Example 2:\n\nInput: nums = [10,10,10]\nOutput: 0\nExplanation:\n\nAll elements are already equal, so\
  \ no operations are needed.\n\n\n \nConstraints:\n\n1 <= nums.length <= 105\n-109 <= nums[i] <= 109\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def minOperations(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
assert:
