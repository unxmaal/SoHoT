id: lc3047
modality: code
prompt: "There exist n rectangles in a 2D plane with edges parallel to the x and y axis. You are given\
  \ two 2D integer arrays bottomLeft and topRight where bottomLeft[i] = [a_i, b_i] and topRight[i] = [c_i,\
  \ d_i] represent the bottom-left and top-right coordinates of the ith rectangle, respectively.\nYou\
  \ need to find the maximum area of a square that can fit inside the intersecting region of at least\
  \ two rectangles. Return 0 if such a square does not exist.\n \nExample 1:\n\nInput: bottomLeft = [[1,1],[2,2],[3,1]],\
  \ topRight = [[3,3],[4,4],[6,6]]\nOutput: 1\nExplanation:\nA square with side length 1 can fit inside\
  \ either the intersecting region of rectangles 0 and 1 or the intersecting region of rectangles 1 and\
  \ 2. Hence the maximum area is 1. It can be shown that a square with a greater side length can not fit\
  \ inside any intersecting region of two rectangles.\nExample 2:\n\nInput: bottomLeft = [[1,1],[1,3],[1,5]],\
  \ topRight = [[5,5],[5,7],[5,9]]\nOutput: 4\nExplanation:\nA square with side length 2 can fit inside\
  \ either the intersecting region of rectangles 0 and 1 or the intersecting region of rectangles 1 and\
  \ 2. Hence the maximum area is 2 * 2 = 4. It can be shown that a square with a greater side length can\
  \ not fit inside any intersecting region of two rectangles.\nExample 3:\n  \nInput: bottomLeft = [[1,1],[2,2],[1,2]],\
  \ topRight = [[3,3],[4,4],[3,4]]\nOutput: 1\nExplanation:\nA square with side length 1 can fit inside\
  \ the intersecting region of any two rectangles. Also, no larger square can, so the maximum area is\
  \ 1. Note that the region can be formed by the intersection of more than 2 rectangles.\nExample 4:\n\
  \  \nInput: bottomLeft = [[1,1],[3,3],[3,1]], topRight = [[2,2],[4,4],[4,2]]\nOutput: 0\nExplanation:\n\
  No pair of rectangles intersect, hence, the answer is 0.\n \nConstraints:\n\nn == bottomLeft.length\
  \ == topRight.length\n2 <= n <= 103\nbottomLeft[i].length == topRight[i].length == 2\n1 <= bottomLeft[i][0],\
  \ bottomLeft[i][1] <= 107\n1 <= topRight[i][0], topRight[i][1] <= 107\nbottomLeft[i][0] < topRight[i][0]\n\
  bottomLeft[i][1] < topRight[i][1]\n\nWrite the solution in Python as this class, with any imports it\
  \ needs:\n\n```python\nclass Solution:\n    def largestSquareArea(self, bottomLeft: List[List[int]],\
  \ topRight: List[List[int]]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [2, 2], [3, 1]], topRight=[[3, 3], [4, 4], [6, 6]])
    == 1
  - Solution().largestSquareArea(bottomLeft=[[2, 2], [4, 4], [6, 6]], topRight=[[4, 4], [6, 6], [8, 8]])
    == 0
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [3, 3], [3, 1]], topRight=[[2, 2], [4, 4], [4, 2]])
    == 0
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [2, 2], [3, 3], [4, 4]], topRight=[[3, 3], [4, 4],
    [5, 5], [6, 6]]) == 1
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [2, 2]], topRight=[[3, 3], [4, 4]]) == 1
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [3, 3], [5, 5]], topRight=[[2, 2], [4, 4], [6, 6]])
    == 0
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [1, 1]], topRight=[[2, 2], [2, 2]]) == 1
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [1, 3], [1, 5]], topRight=[[5, 5], [5, 7], [5, 9]])
    == 4
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [2, 2], [3, 3]], topRight=[[4, 4], [5, 5], [6, 6]])
    == 4
  - Solution().largestSquareArea(bottomLeft=[[1, 1], [2, 2], [1, 2]], topRight=[[3, 3], [4, 4], [3, 4]])
    == 1
