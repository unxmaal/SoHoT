prompt: "You are given an integer array nums and an integer k.\nYou are allowed to perform the following\
  \ operation on each element of the array at most once:\n\nAdd an integer in the range [-k, k] to the\
  \ element.\n\nReturn the maximum possible number of distinct elements in nums after performing the operations.\n\
   \nExample 1:\n\nInput: nums = [1,2,2,3,3,4], k = 2\nOutput: 6\nExplanation:\nnums changes to [-1, 0,\
  \ 1, 2, 3, 4] after performing operations on the first four elements.\n\nExample 2:\n\nInput: nums =\
  \ [4,4,4,4], k = 1\nOutput: 3\nExplanation:\nBy adding -1 to nums[0] and 1 to nums[1], nums changes\
  \ to [3, 5, 4, 4].\n\n \nConstraints:\n\n1 <= nums.length <= 105\n1 <= nums[i] <= 109\n0 <= k <= 109\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def maxDistinctElements(self, nums: List[int], k: int) -> int:\n```\n\nReturn only the code."
