prompt: "You are given an integer array nums. A good subsequence is defined as a subsequence of nums where\
  \ the absolute difference between any two consecutive elements in the subsequence is exactly 1.\nReturn\
  \ the sum of all possible good subsequences of nums.\nSince the answer may be very large, return it\
  \ modulo 109 + 7.\nNote that a subsequence of size 1 is considered good by definition.\n \nExample 1:\n\
  \nInput: nums = [1,2,1]\nOutput: 14\nExplanation:\n\nGood subsequences are: [1], [2], [1], [1,2], [2,1],\
  \ [1,2,1].\nThe sum of elements in these subsequences is 14.\n\n\nExample 2:\n\nInput: nums = [3,4,5]\n\
  Output: 40\nExplanation:\n\nGood subsequences are: [3], [4], [5], [3,4], [4,5], [3,4,5].\nThe sum of\
  \ elements in these subsequences is 40.\n\n\n \nConstraints:\n\n1 <= nums.length <= 105\n0 <= nums[i]\
  \ <= 105\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass\
  \ Solution:\n    def sumOfGoodSubsequences(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
