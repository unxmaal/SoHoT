  \ with its largest element 4. The first element is 4 and the last element is also 4.\nsubarray [1,4,3,3,2],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\nsubarray [1,4,3,3,2],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\nsubarray [1,4,3,3,2],\
  \ with its largest element 2. The first element is 2 and the last element is also 2.\nsubarray [1,4,3,3,2],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\n\nHence, we return\
  \ 6.\n\nExample 2:\n\nInput: nums = [3,3,3]\nOutput: 6\nExplanation:\nThere are 6 subarrays which have\
  \ the first and the last elements equal to the largest element of the subarray:\n\nsubarray [3,3,3],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\nsubarray [3,3,3],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\nsubarray [3,3,3],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\nsubarray [3,3,3],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\nsubarray [3,3,3],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\nsubarray [3,3,3],\
  \ with its largest element 3. The first element is 3 and the last element is also 3.\n\nHence, we return\
  \ 6.\n\nExample 3:\n\nInput: nums = [1]\nOutput: 1\nExplanation:\nThere is a single subarray of nums\
  \ which is [1], with its largest element 1. The first element is 1 and the last element is also 1.\n\
  Hence, we return 1.\n\n \nConstraints:\n\n1 <= nums.length <= 105\n1 <= nums[i] <= 109\n\nWrite the\
