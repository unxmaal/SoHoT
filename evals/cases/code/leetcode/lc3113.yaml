prompt: "You are given an array of positive integers nums.\nReturn the number of subarrays of nums, where\
  \ the first and the last elements of the subarray are equal to the largest element in the subarray.\n\
   \nExample 1:\n\nInput: nums = [1,4,3,3,2]\nOutput: 6\nExplanation:\nThere are 6 subarrays which have\
