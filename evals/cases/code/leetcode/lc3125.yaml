  \ bitwise AND of [6, 7] is 6.\nThe bitwise AND of [5, 6, 7] is 4.\nThe bitwise AND of [4, 5, 6, 7] is\
  \ 4.\nThe bitwise AND of [3, 4, 5, 6, 7] is 0.\n\nExample 2:\n\nInput: n = 9\nOutput: 7\nExplanation:\n\
  The bitwise AND of [7, 8, 9] is 0.\n\nExample 3:\n\nInput: n = 17\nOutput: 15\nExplanation:\nThe bitwise\
  \ AND of [15, 16, 17] is 0.\n\n \nConstraints:\n\n1 <= n <= 1015\n\nWrite the solution in Python as\
