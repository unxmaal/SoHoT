  - Solution().longestMonotonicSubarray(nums=[10, 9, 4, 3, 5, 7, 6, 8, 1]) == 4
  - Solution().longestMonotonicSubarray(nums=[1]) == 1
  - Solution().longestMonotonicSubarray(nums=[1, 3, 2, 4, 3, 5]) == 2
