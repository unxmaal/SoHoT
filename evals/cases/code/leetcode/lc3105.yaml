prompt: "You are given an array of integers nums. Return the length of the longest subarray of nums which\
  \ is either strictly increasing or strictly decreasing.\n \nExample 1:\n\nInput: nums = [1,4,3,3,2]\n\
  Output: 2\nExplanation:\nThe strictly increasing subarrays of nums are [1], [2], [3], [3], [4], and\
  \ [1,4].\nThe strictly decreasing subarrays of nums are [1], [2], [3], [3], [4], [3,2], and [4,3].\n\
  Hence, we return 2.\n\nExample 2:\n\nInput: nums = [3,3,3,3]\nOutput: 1\nExplanation:\nThe strictly\
  \ increasing subarrays of nums are [3], [3], [3], and [3].\nThe strictly decreasing subarrays of nums\
  \ are [3], [3], [3], and [3].\nHence, we return 1.\n\nExample 3:\n\nInput: nums = [3,2,1]\nOutput: 3\n\
  Explanation:\nThe strictly increasing subarrays of nums are [3], [2], and [1].\nThe strictly decreasing\
  \ subarrays of nums are [3], [2], [1], [3,2], [2,1], and [3,2,1].\nHence, we return 3.\n\n \nConstraints:\n\
  \n1 <= nums.length <= 50\n1 <= nums[i] <= 50\n\nWrite the solution in Python as this class, with any\
  \ imports it needs:\n\n```python\nclass Solution:\n    def longestMonotonicSubarray(self, nums: List[int])\
  \ -> int:\n```\n\nReturn only the code."
