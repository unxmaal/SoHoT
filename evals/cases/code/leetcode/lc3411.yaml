prompt: "You are given an array of positive integers nums.\nAn array arr is called product equivalent\
  \ if prod(arr) == lcm(arr) * gcd(arr), where:\n\nprod(arr) is the product of all elements of arr.\n\
  gcd(arr) is the GCD of all elements of arr.\nlcm(arr) is the LCM of all elements of arr.\n\nReturn the\
  \ length of the longest product equivalent subarray of nums.\n \nExample 1:\n\nInput: nums = [1,2,1,2,1,1,1]\n\
  Output: 5\nExplanation: \nThe longest product equivalent subarray is [1, 2, 1, 1, 1], where prod([1,\
  \ 2, 1, 1, 1]) = 2, gcd([1, 2, 1, 1, 1]) = 1, and lcm([1, 2, 1, 1, 1]) = 2.\n\nExample 2:\n\nInput:\
  \ nums = [2,3,4,5,6]\nOutput: 3\nExplanation: \nThe longest product equivalent subarray is [3, 4, 5].\n\
  \nExample 3:\n\nInput: nums = [1,2,3,1,4,5,1]\nOutput: 5\n\n \nConstraints:\n\n2 <= nums.length <= 100\n\
  1 <= nums[i] <= 10\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def maxLength(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
