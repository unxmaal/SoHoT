id: lc3253
modality: code
prompt: "You are given a string target, an array of strings words, and an integer array costs, both arrays\
  \ of the same length.\nImagine an empty string s.\nYou can perform the following operation any number\
  \ of times (including zero):\n\nChoose an index i in the range [0, words.length - 1].\nAppend words[i]\
  \ to s.\nThe cost of operation is costs[i].\n\nReturn the minimum cost to make s equal to target. If\
  \ it's not possible, return -1.\n \nExample 1:\n\nInput: target = \"abcdef\", words = [\"abdef\",\"\
  abc\",\"d\",\"def\",\"ef\"], costs = [100,1,1,10,5]\nOutput: 7\nExplanation:\nThe minimum cost can be\
  \ achieved by performing the following operations:\n\nSelect index 1 and append \"abc\" to s at a cost\
  \ of 1, resulting in s = \"abc\".\nSelect index 2 and append \"d\" to s at a cost of 1, resulting in\
  \ s = \"abcd\".\nSelect index 4 and append \"ef\" to s at a cost of 5, resulting in s = \"abcdef\".\n\
  \n\nExample 2:\n\nInput: target = \"aaaa\", words = [\"z\",\"zz\",\"zzz\"], costs = [1,10,100]\nOutput:\
  \ -1\nExplanation:\nIt is impossible to make s equal to target, so we return -1.\n\n \nConstraints:\n\
  \n1 <= target.length <= 2000\n1 <= words.length == costs.length <= 50\n1 <= words[i].length <= target.length\n\
  target and words[i] consist only of lowercase English letters.\n1 <= costs[i] <= 105\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minimumCost(self,\
  \ target: str, words: List[str], costs: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minimumCost(target='abc', words=['abc'], costs=[1]) == 1
  - Solution().minimumCost(target='abc', words=['abc'], costs=[10]) == 10
  - Solution().minimumCost(target='abcd', words=['ab', 'cd'], costs=[1, 1]) == 2
  - Solution().minimumCost(target='abc', words=['a', 'b', 'c'], costs=[1, 1, 1]) == 3
  - Solution().minimumCost(target='hello', words=['he', 'll', 'o'], costs=[5, 7, 2]) == 14
  - Solution().minimumCost(target='abab', words=['a', 'b', 'ab'], costs=[2, 3, 1]) == 2
  - Solution().minimumCost(target='abcabc', words=['abc', 'bc', 'c'], costs=[3, 1, 4]) == 6
  - Solution().minimumCost(target='xyz', words=['x', 'y', 'z'], costs=[2, 2, 2]) == 6
  - Solution().minimumCost(target='hello', words=['he', 'll', 'o'], costs=[1, 2, 3]) == 6
  - Solution().minimumCost(target='abcabc', words=['abc', 'abcabc'], costs=[10, 5]) == 5
