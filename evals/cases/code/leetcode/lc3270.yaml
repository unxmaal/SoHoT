id: lc3270
modality: code
prompt: "You are given three positive integers num1, num2, and num3.\nThe key of num1, num2, and num3\
  \ is defined as a four-digit number such that:\n\nInitially, if any number has less than four digits,\
  \ it is padded with leading zeros.\nThe ith digit (1 <= i <= 4) of the key is generated by taking the\
  \ smallest digit among the ith digits of num1, num2, and num3.\n\nReturn the key of the three numbers\
  \ without leading zeros (if any).\n \nExample 1:\n\nInput: num1 = 1, num2 = 10, num3 = 1000\nOutput:\
  \ 0\nExplanation:\nOn padding, num1 becomes \"0001\", num2 becomes \"0010\", and num3 remains \"1000\"\
  .\n\nThe 1st digit of the key is min(0, 0, 1).\nThe 2nd digit of the key is min(0, 0, 0).\nThe 3rd digit\
  \ of the key is min(0, 1, 0).\nThe 4th digit of the key is min(1, 0, 0).\n\nHence, the key is \"0000\"\
  , i.e. 0.\n\nExample 2:\n\nInput: num1 = 987, num2 = 879, num3 = 798\nOutput: 777\n\nExample 3:\n\n\
  Input: num1 = 1, num2 = 2, num3 = 3\nOutput: 1\n\n \nConstraints:\n\n1 <= num1, num2, num3 <= 9999\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def generateKey(self, num1: int, num2: int, num3: int) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().generateKey(num1=9999, num2=9999, num3=9999) == 9999
  - Solution().generateKey(num1=1000, num2=1000, num3=1000) == 1000
  - Solution().generateKey(num1=12, num2=345, num3=6789) == 12
  - Solution().generateKey(num1=5555, num2=5555, num3=6666) == 5555
  - Solution().generateKey(num1=1, num2=2, num3=3) == 1
  - Solution().generateKey(num1=1234, num2=4321, num3=1111) == 1111
  - Solution().generateKey(num1=1, num2=10, num3=1000) == 0
  - Solution().generateKey(num1=987, num2=879, num3=798) == 777
  - Solution().generateKey(num1=9080, num2=7060, num3=5040) == 5040
  - Solution().generateKey(num1=6789, num2=5432, num3=3210) == 3210
