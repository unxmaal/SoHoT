id: lc3410
modality: code
prompt: "You are given an integer array nums.\nYou can do the following operation on the array at most\
  \ once:\n\nChoose any integer x such that nums remains non-empty on removing all occurrences of x.\n\
  Remove all occurrences of x from the array.\n\nReturn the maximum subarray sum across all possible resulting\
  \ arrays.\n \nExample 1:\n\nInput: nums = [-3,2,-2,-1,3,-2,3]\nOutput: 7\nExplanation:\nWe can have\
  \ the following arrays after at most one operation:\n\nThe original array is nums = [-3, 2, -2, -1,\
  \ 3, -2, 3]. The maximum subarray sum is 3 + (-2) + 3 = 4.\nDeleting all occurences of x = -3 results\
  \ in nums = [2, -2, -1, 3, -2, 3]. The maximum subarray sum is 3 + (-2) + 3 = 4.\nDeleting all occurences\
  \ of x = -2 results in nums = [-3, 2, -1, 3, 3]. The maximum subarray sum is 2 + (-1) + 3 + 3 = 7.\n\
  Deleting all occurences of x = -1 results in nums = [-3, 2, -2, 3, -2, 3]. The maximum subarray sum\
  \ is 3 + (-2) + 3 = 4.\nDeleting all occurences of x = 3 results in nums = [-3, 2, -2, -1, -2]. The\
  \ maximum subarray sum is 2.\n\nThe output is max(4, 4, 7, 4, 2) = 7.\n\nExample 2:\n\nInput: nums =\
  \ [1,2,3,4]\nOutput: 10\nExplanation:\nIt is optimal to not perform any operations.\n\n \nConstraints:\n\
  \n1 <= nums.length <= 105\n-106 <= nums[i] <= 106\n\nWrite the solution in Python as this class, with\
  \ any imports it needs:\n\n```python\nclass Solution:\n    def maxSubarraySum(self, nums: List[int])\
  \ -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().maxSubarraySum(nums=[1, 2, -1, 3, -2, 4, -3, 5]) == 12
  - Solution().maxSubarraySum(nums=[1, -1, 1, -1, 1]) == 3
  - Solution().maxSubarraySum(nums=[1, 2, 2, 1]) == 6
  - Solution().maxSubarraySum(nums=[5, -3, 5, -2, 5, -1, 5]) == 17
  - Solution().maxSubarraySum(nums=[-3, 2, -2, -1, 3, -2, 3]) == 7
  - Solution().maxSubarraySum(nums=[1, -1, 1, -1, 1, -1]) == 3
  - Solution().maxSubarraySum(nums=[1]) == 1
  - Solution().maxSubarraySum(nums=[-1, 1, -1, 1, -1, 1]) == 3
  - Solution().maxSubarraySum(nums=[1, 2, 3, 4]) == 10
  - Solution().maxSubarraySum(nums=[-1000000, -1000000, -1000000, -1000000]) == -1000000
