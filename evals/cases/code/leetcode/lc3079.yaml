prompt: "You are given an integer array nums containing positive integers. We define a function encrypt\
  \ such that encrypt(x) replaces every digit in x with the largest digit in x. For example, encrypt(523)\
  \ = 555 and encrypt(213) = 333.\nReturn the sum of encrypted elements.\n \nExample 1:\n\nInput: nums\
  \ = [1,2,3]\nOutput: 6\nExplanation: The encrypted elements are [1,2,3]. The sum of encrypted elements\
  \ is 1 + 2 + 3 == 6.\n\nExample 2:\n\nInput: nums = [10,21,31]\nOutput: 66\nExplanation: The encrypted\
  \ elements are [11,22,33]. The sum of encrypted elements is 11 + 22 + 33 == 66.\n\n \nConstraints:\n\
  \n1 <= nums.length <= 50\n1 <= nums[i] <= 1000\n\nWrite the solution in Python as this class, with any\
  \ imports it needs:\n\n```python\nclass Solution:\n    def sumOfEncryptedInt(self, nums: List[int])\
  \ -> int:\n```\n\nReturn only the code."
