prompt: "You are given a binary array nums.\nWe call a subarray alternating if no two adjacent elements\
  \ in the subarray have the same value.\nReturn the number of alternating subarrays in nums.\n \nExample\
  \ 1:\n\nInput: nums = [0,1,1,1]\nOutput: 5\nExplanation:\nThe following subarrays are alternating: [0],\
  \ [1], [1], [1], and [0,1].\n\nExample 2:\n\nInput: nums = [1,0,1,0]\nOutput: 10\nExplanation:\nEvery\
  \ subarray of the array is alternating. There are 10 possible subarrays that we can choose.\n\n \nConstraints:\n\
  \n1 <= nums.length <= 105\nnums[i] is either 0 or 1.\n\nWrite the solution in Python as this class,\
  \ with any imports it needs:\n\n```python\nclass Solution:\n    def countAlternatingSubarrays(self,\
  \ nums: List[int]) -> int:\n```\n\nReturn only the code."
