  - Solution().countAlternatingSubarrays(nums=[0, 1, 0, 1, 0, 1]) == 21
  - Solution().countAlternatingSubarrays(nums=[1, 0, 1, 0, 1]) == 15
  - Solution().countAlternatingSubarrays(nums=[1, 1, 1, 1]) == 4
  - Solution().countAlternatingSubarrays(nums=[1, 0, 0, 1, 0, 1, 1, 0]) == 16
