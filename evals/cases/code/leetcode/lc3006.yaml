id: lc3006
modality: code
prompt: "You are given a 0-indexed string s, a string a, a string b, and an integer k.\nAn index i is\
  \ beautiful if:\n\n0 <= i <= s.length - a.length\ns[i..(i + a.length - 1)] == a\nThere exists an index\
  \ j such that:\n\t\n0 <= j <= s.length - b.length\ns[j..(j + b.length - 1)] == b\n|j - i| <= k\n\n\n\
  \nReturn the array that contains beautiful indices in sorted order from smallest to largest.\n \nExample\
  \ 1:\n\nInput: s = \"isawsquirrelnearmysquirrelhouseohmy\", a = \"my\", b = \"squirrel\", k = 15\nOutput:\
  \ [16,33]\nExplanation: There are 2 beautiful indices: [16,33].\n- The index 16 is beautiful as s[16..17]\
  \ == \"my\" and there exists an index 4 with s[4..11] == \"squirrel\" and |16 - 4| <= 15.\n- The index\
  \ 33 is beautiful as s[33..34] == \"my\" and there exists an index 18 with s[18..25] == \"squirrel\"\
  \ and |33 - 18| <= 15.\nThus we return [16,33] as the result.\n\nExample 2:\n\nInput: s = \"abcd\",\
  \ a = \"a\", b = \"a\", k = 4\nOutput: [0]\nExplanation: There is 1 beautiful index: [0].\n- The index\
  \ 0 is beautiful as s[0..0] == \"a\" and there exists an index 0 with s[0..0] == \"a\" and |0 - 0| <=\
  \ 4.\nThus we return [0] as the result.\n\n \nConstraints:\n\n1 <= k <= s.length <= 105\n1 <= a.length,\
  \ b.length <= 10\ns, a, and b contain only lowercase English letters.\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def beautifulIndices(self,\
  \ s: str, a: str, b: str, k: int) -> List[int]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().beautifulIndices(s='beautifulbeautifulbeautiful', a='ful', b='aut', k=5) == [6, 15, 24]
  - Solution().beautifulIndices(s='hellobeautifulworld', a='be', b='autiful', k=5) == [5]
  - Solution().beautifulIndices(s='beautifulbeautifulbeautiful', a='ful', b='uti', k=5) == [6, 15, 24]
  - Solution().beautifulIndices(s='hellohellohello', a='he', b='lo', k=3) == [0, 5, 10]
  - Solution().beautifulIndices(s='beautifulday', a='day', b='beat', k=10) == []
  - Solution().beautifulIndices(s='abababab', a='ab', b='ba', k=2) == [0, 2, 4, 6]
  - Solution().beautifulIndices(s='abcabcabcabc', a='ab', b='bc', k=3) == [0, 3, 6, 9]
  - Solution().beautifulIndices(s='hellohellohello', a='he', b='lo', k=2) == [5, 10]
  - Solution().beautifulIndices(s='abcd', a='a', b='a', k=4) == [0]
  - Solution().beautifulIndices(s='aaaaaa', a='aa', b='aaa', k=2) == [0, 1, 2, 3, 4]
