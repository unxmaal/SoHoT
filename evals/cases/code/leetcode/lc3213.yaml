id: lc3213
modality: code
prompt: "You are given a string target, an array of strings words, and an integer array costs, both arrays\
  \ of the same length.\nImagine an empty string s.\nYou can perform the following operation any number\
  \ of times (including zero):\n\nChoose an index i in the range [0, words.length - 1].\nAppend words[i]\
  \ to s.\nThe cost of operation is costs[i].\n\nReturn the minimum cost to make s equal to target. If\
  \ it's not possible, return -1.\n \nExample 1:\n\nInput: target = \"abcdef\", words = [\"abdef\",\"\
  abc\",\"d\",\"def\",\"ef\"], costs = [100,1,1,10,5]\nOutput: 7\nExplanation:\nThe minimum cost can be\
  \ achieved by performing the following operations:\n\nSelect index 1 and append \"abc\" to s at a cost\
  \ of 1, resulting in s = \"abc\".\nSelect index 2 and append \"d\" to s at a cost of 1, resulting in\
  \ s = \"abcd\".\nSelect index 4 and append \"ef\" to s at a cost of 5, resulting in s = \"abcdef\".\n\
  \n\nExample 2:\n\nInput: target = \"aaaa\", words = [\"z\",\"zz\",\"zzz\"], costs = [1,10,100]\nOutput:\
  \ -1\nExplanation:\nIt is impossible to make s equal to target, so we return -1.\n\n \nConstraints:\n\
  \n1 <= target.length <= 5 * 104\n1 <= words.length == costs.length <= 5 * 104\n1 <= words[i].length\
  \ <= target.length\nThe total sum of words[i].length is less than or equal to 5 * 104.\ntarget and words[i]\
  \ consist only of lowercase English letters.\n1 <= costs[i] <= 104\n\nWrite the solution in Python as\
  \ this class, with any imports it needs:\n\n```python\nclass Solution:\n    def minimumCost(self, target:\
  \ str, words: List[str], costs: List[int]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minimumCost(target='xyz', words=['x', 'y', 'z'], costs=[1, 2, 3]) == 6
  - Solution().minimumCost(target='abcd', words=['a', 'b', 'c', 'd'], costs=[1, 1, 1, 1]) == 4
  - Solution().minimumCost(target='zzzz', words=['zz', 'zzzz'], costs=[2, 1]) == 1
  - Solution().minimumCost(target='programming', words=['pro', 'gram', 'ming'], costs=[10, 20, 30]) ==
    60
  - Solution().minimumCost(target='python', words=['py', 'th', 'on'], costs=[5, 7, 8]) == 20
  - Solution().minimumCost(target='abacaba', words=['a', 'b', 'c'], costs=[1, 2, 3]) == 11
  - Solution().minimumCost(target='hello', words=['he', 'll', 'o'], costs=[3, 5, 2]) == 10
  - Solution().minimumCost(target='abcabc', words=['abc', 'ab', 'c'], costs=[5, 3, 2]) == 10
  - Solution().minimumCost(target='abc', words=['a', 'b', 'c'], costs=[1, 2, 3]) == 6
  - Solution().minimumCost(target='hello', words=['h', 'he', 'hel', 'hell', 'hello'], costs=[5, 4, 3,
    2, 1]) == 1
