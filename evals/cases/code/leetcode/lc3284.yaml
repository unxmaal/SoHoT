prompt: "We call an array arr of length n consecutive if one of the following holds:\n\narr[i] - arr[i\
  \ - 1] == 1 for all 1 <= i < n.\narr[i] - arr[i - 1] == -1 for all 1 <= i < n.\n\nThe value of an array\
  \ is the sum of its elements.\nFor example, [3, 4, 5] is a consecutive array of value 12 and [9, 8]\
  \ is another of value 17. While [3, 4, 3] and [8, 6] are not consecutive.\nGiven an array of integers\
  \ nums, return the sum of the values of all consecutive subarrays.\nSince the answer may be very large,\
  \ return it modulo 109 + 7.\nNote that an array of length 1 is also considered consecutive.\n \nExample\
  \ 1:\n\nInput: nums = [1,2,3]\nOutput: 20\nExplanation:\nThe consecutive subarrays are: [1], [2], [3],\
  \ [1, 2], [2, 3], [1, 2, 3].\nSum of their values would be: 1 + 2 + 3 + 3 + 5 + 6 = 20.\n\nExample 2:\n\
  \nInput: nums = [1,3,5,7]\nOutput: 16\nExplanation:\nThe consecutive subarrays are: [1], [3], [5], [7].\n\
  Sum of their values would be: 1 + 3 + 5 + 7 = 16.\n\nExample 3:\n\nInput: nums = [7,6,1,2]\nOutput:\
  \ 32\nExplanation:\nThe consecutive subarrays are: [7], [6], [1], [2], [7, 6], [1, 2].\nSum of their\
  \ values would be: 7 + 6 + 1 + 2 + 13 + 3 = 32.\n\n \nConstraints:\n\n1 <= nums.length <= 105\n1 <=\
  \ nums[i] <= 105\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def getSum(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
