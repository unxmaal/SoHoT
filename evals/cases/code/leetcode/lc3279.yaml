  - Solution().maxArea(height=10, positions=[0, 1, 5, 10], directions='UUDD') == 24
  - Solution().maxArea(height=100000, positions=[0, 0, 0, 0, 0], directions='UUUUU') == 500000
  - Solution().maxArea(height=20, positions=[10, 10, 10, 10, 10, 10, 10, 10, 10, 10], directions='UUUUUUUUUUUUUUUUUUUU')
    == 200
  - Solution().maxArea(height=100, positions=[0, 100, 50, 25, 75], directions='UDUDU') == 300
  - Solution().maxArea(height=10, positions=[5, 5, 5, 5], directions='UUDD') == 20
  - Solution().maxArea(height=5, positions=[2, 5], directions='UD') == 7
  - Solution().maxArea(height=1000, positions=[500, 500, 500, 500], directions='UUUU') == 4000
  - Solution().maxArea(height=1, positions=[0, 1], directions='UD') == 1
  - Solution().maxArea(height=100, positions=[50, 50, 50, 50, 50], directions='UUUUU') == 500
  - Solution().maxArea(height=6, positions=[0, 0, 6, 3], directions='UUDU') == 15
