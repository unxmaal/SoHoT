  - Solution().countBalancedPermutations(num='2222') == 1
  - Solution().countBalancedPermutations(num='55555555') == 1
  - Solution().countBalancedPermutations(num='24680') == 24
  - Solution().countBalancedPermutations(num='00000000') == 1
