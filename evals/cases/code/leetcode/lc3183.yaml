prompt: "You have an infinite number of coins with values 1, 2, and 6, and only 2 coins with value 4.\n\
  Given an integer n, return the number of ways to make the sum of n with the coins you have.\nSince the\
  \ answer may be very large, return it modulo 109 + 7.\nNote that the order of the coins doesn't matter\
  \ and [2, 2, 3] is the same as [2, 3, 2].\n \nExample 1:\n\nInput: n = 4\nOutput: 4\nExplanation:\n\
  Here are the four combinations: [1, 1, 1, 1], [1, 1, 2], [2, 2], [4].\n\nExample 2:\n\nInput: n = 12\n\
  Output: 22\nExplanation:\nNote that [4, 4, 4] is not a valid combination since we cannot use 4 three\
  \ times.\n\nExample 3:\n\nInput: n = 5\nOutput: 4\nExplanation:\nHere are the four combinations: [1,\
  \ 1, 1, 1, 1], [1, 1, 1, 2], [1, 2, 2], [1, 4].\n\n \nConstraints:\n\n1 <= n <= 105\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def numberOfWays(self,\
  \ n: int) -> int:\n```\n\nReturn only the code."
