prompt: "Given an integer array nums, return the number of subarrays of length 3 such that the sum of\
  \ the first and third numbers equals exactly half of the second number.\n \nExample 1:\n\nInput: nums\
  \ = [1,2,1,4,1]\nOutput: 1\nExplanation:\nOnly the subarray [1,4,1] contains exactly 3 elements where\
  \ the sum of the first and third numbers equals half the middle number.\n\nExample 2:\n\nInput: nums\
  \ = [1,1,1]\nOutput: 0\nExplanation:\n[1,1,1] is the only subarray of length 3. However, its first and\
  \ third numbers do not add to half the middle number.\n\n \nConstraints:\n\n3 <= nums.length <= 100\n\
  -100 <= nums[i] <= 100\n\nWrite the solution in Python as this class, with any imports it needs:\n\n\
  ```python\nclass Solution:\n    def countSubarrays(self, nums: List[int]) -> int:\n```\n\nReturn only\
  \ the code."
