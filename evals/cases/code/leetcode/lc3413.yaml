id: lc3413
modality: code
prompt: "There are an infinite amount of bags on a number line, one bag for each coordinate. Some of these\
  \ bags contain coins.\nYou are given a 2D array coins, where coins[i] = [li, ri, ci] denotes that every\
  \ bag from li to ri contains ci coins.\nThe segments that coins contain are non-overlapping.\nYou are\
  \ also given an integer k.\nReturn the maximum amount of coins you can obtain by collecting k consecutive\
  \ bags.\n \nExample 1:\n\nInput: coins = [[8,10,1],[1,3,2],[5,6,4]], k = 4\nOutput: 10\nExplanation:\n\
  Selecting bags at positions [3, 4, 5, 6] gives the maximum number of coins: 2 + 0 + 4 + 4 = 10.\n\n\
  Example 2:\n\nInput: coins = [[1,10,3]], k = 2\nOutput: 6\nExplanation:\nSelecting bags at positions\
  \ [1, 2] gives the maximum number of coins: 3 + 3 = 6.\n\n \nConstraints:\n\n1 <= coins.length <= 105\n\
  1 <= k <= 109\ncoins[i] == [li, ri, ci]\n1 <= li <= ri <= 109\n1 <= ci <= 1000\nThe given segments are\
  \ non-overlapping.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def maximumCoins(self, coins: List[List[int]], k: int) -> int:\n```\n\nReturn only\
  \ the code."
assert:
  checks:
  - Solution().maximumCoins(coins=[[8, 10, 1], [1, 3, 2], [5, 6, 4]], k=4) == 10
  - Solution().maximumCoins(coins=[[1, 10, 3]], k=2) == 6
  - Solution().maximumCoins(coins=[[10, 20, 5], [30, 40, 10], [50, 60, 15]], k=5) == 75
  - Solution().maximumCoins(coins=[[1, 2, 5], [4, 6, 7], [8, 10, 3]], k=3) == 21
  - Solution().maximumCoins(coins=[[1, 1, 1000], [2, 2, 1000], [3, 3, 1000]], k=2) == 2000
  - Solution().maximumCoins(coins=[[5, 5, 10], [15, 15, 20], [25, 25, 30]], k=1) == 30
  - Solution().maximumCoins(coins=[[2, 3, 1], [5, 7, 3], [9, 11, 2]], k=5) == 11
  - Solution().maximumCoins(coins=[[1, 2, 1], [3, 4, 2], [5, 6, 3], [7, 8, 4]], k=3) == 11
  - Solution().maximumCoins(coins=[[2, 3, 1], [5, 7, 3], [9, 11, 5]], k=5) == 18
  - Solution().maximumCoins(coins=[[1, 2, 5], [4, 6, 2], [7, 8, 4]], k=3) == 10
