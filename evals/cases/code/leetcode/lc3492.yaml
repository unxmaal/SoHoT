  - Solution().maxContainers(n=10, w=1, maxWeight=10) == 10
  - Solution().maxContainers(n=5, w=2, maxWeight=20) == 10
  - Solution().maxContainers(n=5, w=10, maxWeight=50) == 5
  - Solution().maxContainers(n=5, w=10, maxWeight=100) == 10
