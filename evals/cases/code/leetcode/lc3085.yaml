id: lc3085
modality: code
prompt: "You are given a string word and an integer k.\nWe consider word to be k-special if |freq(word[i])\
  \ - freq(word[j])| <= k for all indices i and j in the string.\nHere, freq(x) denotes the frequency\
  \ of the character x in word, and |y| denotes the absolute value of y.\nReturn the minimum number of\
  \ characters you need to delete to make word k-special.\n \nExample 1:\n\nInput: word = \"aabcaba\"\
  , k = 0\nOutput: 3\nExplanation: We can make word 0-special by deleting 2 occurrences of \"a\" and 1\
  \ occurrence of \"c\". Therefore, word becomes equal to \"baba\" where freq('a') == freq('b') == 2.\n\
  \nExample 2:\n\nInput: word = \"dabdcbdcdcd\", k = 2\nOutput: 2\nExplanation: We can make word 2-special\
  \ by deleting 1 occurrence of \"a\" and 1 occurrence of \"d\". Therefore, word becomes equal to \"bdcbdcdcd\"\
  \ where freq('b') == 2, freq('c') == 3, and freq('d') == 4.\n\nExample 3:\n\nInput: word = \"aaabaaa\"\
  , k = 2\nOutput: 1\nExplanation: We can make word 2-special by deleting 1 occurrence of \"b\". Therefore,\
  \ word becomes equal to \"aaaaaa\" where each letter's frequency is now uniformly 6.\n\n \nConstraints:\n\
  \n1 <= word.length <= 105\n0 <= k <= 105\nword consists only of lowercase English letters.\n\nWrite\
  \ the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n \
  \   def minimumDeletions(self, word: str, k: int) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minimumDeletions(word='abacabadaba', k=2) == 3
  - Solution().minimumDeletions(word='abacabadabacaba', k=3) == 4
  - Solution().minimumDeletions(word='xyz', k=0) == 0
  - Solution().minimumDeletions(word='aabbccddeeffgghhiijjkkllmmnnooppqqrrssttuuvvwwxxyyzz', k=10) ==
    0
  - Solution().minimumDeletions(word='abcabcabc', k=1) == 0
  - Solution().minimumDeletions(word='mnbvcxzlkjhgfdsapoiuytrewq', k=5) == 0
  - Solution().minimumDeletions(word='aabcaba', k=0) == 3
  - Solution().minimumDeletions(word='dabdcbdcdcd', k=2) == 2
  - Solution().minimumDeletions(word='zzzzz', k=0) == 0
  - Solution().minimumDeletions(word='aaabaaa', k=2) == 1
