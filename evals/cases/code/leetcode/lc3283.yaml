id: lc3283
modality: code
prompt: "There is a 50 x 50 chessboard with one knight and some pawns on it. You are given two integers\
  \ kx and ky where (kx, ky) denotes the position of the knight, and a 2D array positions where positions[i]\
  \ = [xi, yi] denotes the position of the pawns on the chessboard.\nAlice and Bob play a turn-based game,\
  \ where Alice goes first. In each player's turn:\n\nThe player selects a pawn that still exists on the\
  \ board and captures it with the knight in the fewest possible moves. Note that the player can select\
  \ any pawn, it might not be one that can be captured in the least number of moves.\nIn the process of\
  \ capturing the selected pawn, the knight may pass other pawns without capturing them. Only the selected\
  \ pawn can be captured in this turn.\n\nAlice is trying to maximize the sum of the number of moves made\
  \ by both players until there are no more pawns on the board, whereas Bob tries to minimize them.\n\
  Return the maximum total number of moves made during the game that Alice can achieve, assuming both\
  \ players play optimally.\nNote that in one move, a chess knight has eight possible positions it can\
  \ move to, as illustrated below. Each move is two cells in a cardinal direction, then one cell in an\
  \ orthogonal direction.\n\n \nExample 1:\n\nInput: kx = 1, ky = 1, positions = [[0,0]]\nOutput: 4\n\
  Explanation:\n\nThe knight takes 4 moves to reach the pawn at (0, 0).\n\nExample 2:\n\nInput: kx = 0,\
  \ ky = 2, positions = [[1,1],[2,2],[3,3]]\nOutput: 8\nExplanation:\n\n\nAlice picks the pawn at (2,\
  \ 2) and captures it in two moves: (0, 2) -> (1, 4) -> (2, 2).\nBob picks the pawn at (3, 3) and captures\
  \ it in two moves: (2, 2) -> (4, 1) -> (3, 3).\nAlice picks the pawn at (1, 1) and captures it in four\
  \ moves: (3, 3) -> (4, 1) -> (2, 2) -> (0, 3) -> (1, 1).\n\n\nExample 3:\n\nInput: kx = 0, ky = 0, positions\
  \ = [[1,2],[2,4]]\nOutput: 3\nExplanation:\n\nAlice picks the pawn at (2, 4) and captures it in two\
  \ moves: (0, 0) -> (1, 2) -> (2, 4). Note that the pawn at (1, 2) is not captured.\nBob picks the pawn\
  \ at (1, 2) and captures it in one move: (2, 4) -> (1, 2).\n\n\n \nConstraints:\n\n0 <= kx, ky <= 49\n\
  1 <= positions.length <= 15\npositions[i].length == 2\n0 <= positions[i][0], positions[i][1] <= 49\n\
  All positions[i] are unique.\nThe input is generated such that positions[i] != [kx, ky] for all 0 <=\
  \ i < positions.length.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n\
  ```python\nclass Solution:\n    def maxMoves(self, kx: int, ky: int, positions: List[List[int]]) ->\
  \ int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().maxMoves(kx=49, ky=49, positions=[[48, 47], [47, 45]]) == 3
  - Solution().maxMoves(kx=0, ky=2, positions=[[1, 1], [2, 2], [3, 3]]) == 8
  - Solution().maxMoves(kx=10, ky=10, positions=[[5, 5], [15, 15], [20, 20]]) == 20
  - Solution().maxMoves(kx=25, ky=25, positions=[[24, 23], [24, 27], [26, 23], [26, 27]]) == 7
  - Solution().maxMoves(kx=12, ky=12, positions=[[10, 10], [10, 14], [14, 10], [14, 14]]) == 12
  - Solution().maxMoves(kx=25, ky=25, positions=[[26, 27], [27, 29]]) == 3
  - Solution().maxMoves(kx=0, ky=49, positions=[[0, 48], [1, 47], [2, 46]]) == 7
  - Solution().maxMoves(kx=25, ky=25, positions=[[24, 24], [26, 26], [27, 27]]) == 10
  - Solution().maxMoves(kx=49, ky=0, positions=[[48, 1], [47, 2], [46, 3]]) == 10
  - Solution().maxMoves(kx=49, ky=0, positions=[[48, 0], [47, 1], [46, 2]]) == 7
