id: lc3382
modality: code
prompt: "There are n points on an infinite plane. You are given two integer arrays xCoord and yCoord where\
  \ (xCoord[i], yCoord[i]) represents the coordinates of the ith point.\nYour task is to find the maximum\
  \ area of a rectangle that:\n\nCan be formed using four of these points as its corners.\nDoes not contain\
  \ any other point inside or on its border.\nHas its edges parallel to the axes.\n\nReturn the maximum\
  \ area that you can obtain or -1 if no such rectangle is possible.\n \nExample 1:\n\nInput: xCoord =\
  \ [1,1,3,3], yCoord = [1,3,1,3]\nOutput: 4\nExplanation:\n\nWe can make a rectangle with these 4 points\
  \ as corners and there is no other point that lies inside or on the border. Hence, the maximum possible\
  \ area would be 4.\n\nExample 2:\n\nInput: xCoord = [1,1,3,3,2], yCoord = [1,3,1,3,2]\nOutput: -1\n\
  Explanation:\n\nThere is only one rectangle possible is with points [1,1], [1,3], [3,1] and [3,3] but\
  \ [2,2] will always lie inside it. Hence, returning -1.\n\nExample 3:\n\nInput: xCoord = [1,1,3,3,1,3],\
  \ yCoord = [1,3,1,3,2,2]\nOutput: 2\nExplanation:\n\nThe maximum area rectangle is formed by the points\
  \ [1,3], [1,2], [3,2], [3,3], which has an area of 2. Additionally, the points [1,1], [1,2], [3,1],\
  \ [3,2] also form a valid rectangle with the same area.\n\n \nConstraints:\n\n1 <= xCoord.length ==\
  \ yCoord.length <= 2 * 105\n0 <= xCoord[i], yCoord[i] <= 8 * 107\nAll the given points are unique.\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def maxRectangleArea(self, xCoord: List[int], yCoord: List[int]) -> int:\n```\n\nReturn only the\
  \ code."
assert:
  checks:
  - Solution().maxRectangleArea(xCoord=[5, 5, 7, 7], yCoord=[5, 7, 5, 7]) == 4
  - Solution().maxRectangleArea(xCoord=[1, 1, 10, 10], yCoord=[1, 10, 1, 10]) == 81
  - Solution().maxRectangleArea(xCoord=[1, 1, 3, 3, 1, 3], yCoord=[1, 3, 1, 3, 2, 2]) == 2
  - Solution().maxRectangleArea(xCoord=[0, 0, 80000000, 80000000], yCoord=[0, 80000000, 0, 80000000])
    == 6400000000000000
  - Solution().maxRectangleArea(xCoord=[1, 1, 3, 3, 5, 5], yCoord=[1, 3, 1, 3, 1, 3]) == 4
  - Solution().maxRectangleArea(xCoord=[1, 2, 3, 4, 5], yCoord=[1, 2, 3, 4, 5]) == -1
  - Solution().maxRectangleArea(xCoord=[1, 1, 1, 1], yCoord=[1, 1, 1, 1]) == -1
  - Solution().maxRectangleArea(xCoord=[5, 5, 10, 10], yCoord=[5, 10, 5, 10]) == 25
  - Solution().maxRectangleArea(xCoord=[0, 0, 2, 2], yCoord=[0, 2, 0, 2]) == 4
  - Solution().maxRectangleArea(xCoord=[1, 1, 3, 3, 4, 4], yCoord=[1, 3, 1, 3, 2, 3]) == 4
