modality: code
prompt: "There is an undirected tree with n nodes labeled from 0 to n - 1, and rooted at node 0. You are\
  \ given a 2D integer array edges of length n - 1, where edges[i] = [ai, bi] indicates that there is\
  \ an edge between nodes ai and bi in the tree.\nA node is good if all the subtrees rooted at its children\
  \ have the same size.\nReturn the number of good nodes in the given tree.\nA subtree of treeName is\
  \ a tree consisting of a node in treeName and all of its descendants.\n \nExample 1:\n\nInput: edges\
  \ = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]]\nOutput: 7\nExplanation:\n\nAll of the nodes of the given\
  \ tree are good.\n\nExample 2:\n\nInput: edges = [[0,1],[1,2],[2,3],[3,4],[0,5],[1,6],[2,7],[3,8]]\n\
  Output: 6\nExplanation:\n\nThere are 6 good nodes in the given tree. They are colored in the image above.\n\
  Example 3:\n\nInput: edges = [[0,1],[1,2],[1,3],[1,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[9,12],[10,11]]\n\
  Output: 12\nExplanation:\n\nAll nodes except node 9 are good.\n\n\n \nConstraints:\n\n2 <= n <= 105\n\
  edges.length == n - 1\nedges[i].length == 2\n0 <= ai, bi < n\nThe input is generated such that edges\
  \ represents a valid tree.\n\nWrite the solution in Python as this class, with any imports it needs:\n\
  \n```python\nclass Solution:\n    def countGoodNodes(self, edges: List[List[int]]) -> int:\n```\n\n\
  Return only the code."
