id: lc3119
modality: code
prompt: "You are given a string road, consisting only of characters \"x\" and \".\", where each \"x\"\
  \ denotes a pothole and each \".\" denotes a smooth road, and an integer budget.\nIn one repair operation,\
  \ you can repair n consecutive potholes for a price of n + 1.\nReturn the maximum number of potholes\
  \ that can be fixed such that the sum of the prices of all of the fixes doesn't go over the given budget.\n\
   \nExample 1:\n\nInput: road = \"..\", budget = 5\nOutput: 0\nExplanation:\nThere are no potholes to\
  \ be fixed.\n\nExample 2:\n\nInput: road = \"..xxxxx\", budget = 4\nOutput: 3\nExplanation:\nWe fix\
  \ the first three potholes (they are consecutive). The budget needed for this task is 3 + 1 = 4.\n\n\
  Example 3:\n\nInput: road = \"x.x.xxx...x\", budget = 14\nOutput: 6\nExplanation:\nWe can fix all the\
  \ potholes. The total cost would be (1 + 1) + (1 + 1) + (3 + 1) + (1 + 1) = 10 which is within our budget\
  \ of 14.\n\n \nConstraints:\n\n1 <= road.length <= 105\n1 <= budget <= 105 + 1\nroad consists only of\
  \ characters '.' and 'x'.\n\nWrite the solution in Python as this class, with any imports it needs:\n\
  \n```python\nclass Solution:\n    def maxPotholes(self, road: str, budget: int) -> int:\n```\n\nReturn\
  \ only the code."
assert:
  checks:
  - Solution().maxPotholes(road='xxxx', budget=6) == 4
  - Solution().maxPotholes(road='..', budget=5) == 0
  - Solution().maxPotholes(road='x.x.xxx...x', budget=14) == 6
  - Solution().maxPotholes(road='xxxx.xxxx', budget=12) == 8
  - Solution().maxPotholes(road='xx.xx.xx.xx', budget=15) == 8
  - Solution().maxPotholes(road='x', budget=2) == 1
  - Solution().maxPotholes(road='x.x.x.x', budget=6) == 3
  - Solution().maxPotholes(road='xxx.xxx.xx', budget=15) == 8
  - Solution().maxPotholes(road='x.x.x.x.x.x.x.x.x.x', budget=20) == 10
  - Solution().maxPotholes(road='x.xxxxx.x', budget=15) == 7
