id: lc3152
modality: code
prompt: "An array is considered special if every pair of its adjacent elements contains two numbers with\
  \ different parity.\nYou are given an array of integer nums and a 2D integer matrix queries, where for\
  \ queries[i] = [fromi, toi] your task is to check that subarray nums[fromi..toi] is special or not.\n\
  Return an array of booleans answer such that answer[i] is true if nums[fromi..toi] is special.\n \n\
  Example 1:\n\nInput: nums = [3,4,1,2,6], queries = [[0,4]]\nOutput: [false]\nExplanation:\nThe subarray\
  \ is [3,4,1,2,6]. 2 and 6 are both even.\n\nExample 2:\n\nInput: nums = [4,3,1,6], queries = [[0,2],[2,3]]\n\
  Output: [false,true]\nExplanation:\n\nThe subarray is [4,3,1]. 3 and 1 are both odd. So the answer to\
  \ this query is false.\nThe subarray is [1,6]. There is only one pair: (1,6) and it contains numbers\
  \ with different parity. So the answer to this query is true.\n\n\n \nConstraints:\n\n1 <= nums.length\
  \ <= 105\n1 <= nums[i] <= 105\n1 <= queries.length <= 105\nqueries[i].length == 2\n0 <= queries[i][0]\
  \ <= queries[i][1] <= nums.length - 1\n\nWrite the solution in Python as this class, with any imports\
  \ it needs:\n\n```python\nclass Solution:\n    def isArraySpecial(self, nums: List[int], queries: List[List[int]])\
  \ -> List[bool]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().isArraySpecial(nums=[2, 2, 2, 2, 2], queries=[[0, 4]]) == [False]
  - Solution().isArraySpecial(nums=[2, 4, 6, 8, 10], queries=[[0, 0], [1, 1], [2, 2], [3, 3], [4, 4],
    [0, 4]]) == [True, True, True, True, True, False]
  - Solution().isArraySpecial(nums=[1, 3, 5, 7, 9], queries=[[0, 1], [1, 2], [2, 3], [3, 4]]) == [False,
    False, False, False]
  - Solution().isArraySpecial(nums=[1, 3, 5, 7, 9], queries=[[0, 0], [1, 1], [2, 2], [3, 3], [4, 4], [0,
    4]]) == [True, True, True, True, True, False]
  - Solution().isArraySpecial(nums=[1, 2, 3, 4, 5], queries=[[0, 1], [1, 2], [2, 3], [3, 4]]) == [True,
    True, True, True]
  - Solution().isArraySpecial(nums=[1, 2, 3, 4, 5], queries=[[0, 0], [1, 2], [2, 4]]) == [True, True,
    True]
  - Solution().isArraySpecial(nums=[3, 4, 1, 2, 6], queries=[[0, 4]]) == [False]
  - Solution().isArraySpecial(nums=[1, 3, 5, 7, 9], queries=[[0, 4]]) == [False]
  - Solution().isArraySpecial(nums=[4, 3, 1, 6], queries=[[0, 2], [2, 3]]) == [False, True]
  - Solution().isArraySpecial(nums=[10, 15, 20, 25, 30], queries=[[0, 1], [1, 2], [2, 3], [3, 4], [0,
    4]]) == [True, True, True, True, True]
