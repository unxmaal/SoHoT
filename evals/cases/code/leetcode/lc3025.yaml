id: lc3025
modality: code
prompt: "You are given a 2D array points of size n x 2 representing integer coordinates of some points\
  \ on a 2D plane, where points[i] = [xi, yi].\nCount the number of pairs of points (A, B), where\n\n\
  A is on the upper left side of B, and\nthere are no other points in the rectangle (or line) they make\
  \ (including the border).\n\nReturn the count.\n \nExample 1:\n\nInput: points = [[1,1],[2,2],[3,3]]\n\
  Output: 0\nExplanation:\n\nThere is no way to choose A and B so A is on the upper left side of B.\n\n\
  Example 2:\n\nInput: points = [[6,2],[4,4],[2,6]]\nOutput: 2\nExplanation:\n\n\nThe left one is the\
  \ pair (points[1], points[0]), where points[1] is on the upper left side of points[0] and the rectangle\
  \ is empty.\nThe middle one is the pair (points[2], points[1]), same as the left one it is a valid pair.\n\
  The right one is the pair (points[2], points[0]), where points[2] is on the upper left side of points[0],\
  \ but points[1] is inside the rectangle so it's not a valid pair.\n\n\nExample 3:\n\nInput: points =\
  \ [[3,1],[1,3],[1,1]]\nOutput: 2\nExplanation:\n\n\nThe left one is the pair (points[2], points[0]),\
  \ where points[2] is on the upper left side of points[0] and there are no other points on the line they\
  \ form. Note that it is a valid state when the two points form a line.\nThe middle one is the pair (points[1],\
  \ points[2]), it is a valid pair same as the left one.\nThe right one is the pair (points[1], points[0]),\
  \ it is not a valid pair as points[2] is on the border of the rectangle.\n\n\n \nConstraints:\n\n2 <=\
  \ n <= 50\npoints[i].length == 2\n0 <= points[i][0], points[i][1] <= 50\nAll points[i] are distinct.\n\
  \nWrite the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def numberOfPairs(self, points: List[List[int]]) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().numberOfPairs(points=[[3, 1], [1, 3], [1, 1]]) == 2
  - Solution().numberOfPairs(points=[[1, 1], [1, 2], [2, 1], [2, 2], [3, 1], [3, 2], [1, 3], [2, 3], [3,
    3]]) == 12
  - Solution().numberOfPairs(points=[[2, 4], [4, 2], [1, 3], [3, 1], [5, 0], [0, 5]]) == 8
  - Solution().numberOfPairs(points=[[50, 50], [49, 49], [48, 48], [47, 47], [46, 46]]) == 0
  - Solution().numberOfPairs(points=[[1, 1], [2, 2], [3, 3]]) == 0
  - Solution().numberOfPairs(points=[[1, 2], [2, 3], [3, 4], [4, 5]]) == 0
  - Solution().numberOfPairs(points=[[5, 5], [4, 4], [3, 3], [2, 2], [1, 1]]) == 0
  - Solution().numberOfPairs(points=[[10, 10], [10, 9], [9, 10], [9, 9]]) == 4
  - Solution().numberOfPairs(points=[[10, 10], [10, 20], [20, 10], [20, 20]]) == 4
  - Solution().numberOfPairs(points=[[0, 0], [50, 50], [25, 25], [25, 50], [50, 25]]) == 4
