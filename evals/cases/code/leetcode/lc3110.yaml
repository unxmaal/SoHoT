prompt: "You are given a string s. The score of a string is defined as the sum of the absolute difference\
  \ between the ASCII values of adjacent characters.\nReturn the score of s.\n \nExample 1:\n\nInput:\
  \ s = \"hello\"\nOutput: 13\nExplanation:\nThe ASCII values of the characters in s are: 'h' = 104, 'e'\
  \ = 101, 'l' = 108, 'o' = 111. So, the score of s would be |104 - 101| + |101 - 108| + |108 - 108| +\
  \ |108 - 111| = 3 + 7 + 0 + 3 = 13.\n\nExample 2:\n\nInput: s = \"zaz\"\nOutput: 50\nExplanation:\n\
  The ASCII values of the characters in s are: 'z' = 122, 'a' = 97. So, the score of s would be |122 -\
  \ 97| + |97 - 122| = 25 + 25 = 50.\n\n \nConstraints:\n\n2 <= s.length <= 100\ns consists only of lowercase\
  \ English letters.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def scoreOfString(self, s: str) -> int:\n```\n\nReturn only the code."
