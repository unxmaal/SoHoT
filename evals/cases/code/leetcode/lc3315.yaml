  - Solution().minBitwiseArray(nums=[11, 13, 31]) == [9, 12, 15]
  - Solution().minBitwiseArray(nums=[29, 101, 137]) == [28, 100, 136]
  - Solution().minBitwiseArray(nums=[17, 19, 23]) == [16, 17, 19]
  - Solution().minBitwiseArray(nums=[53, 59, 61, 67]) == [52, 57, 60, 65]
  - Solution().minBitwiseArray(nums=[29, 37, 41]) == [28, 36, 40]
  - Solution().minBitwiseArray(nums=[43, 47, 53]) == [41, 39, 52]
  - Solution().minBitwiseArray(nums=[3, 17, 79]) == [1, 16, 71]
