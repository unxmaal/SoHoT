id: lc3112
modality: code
prompt: "There is an undirected graph of n nodes. You are given a 2D array edges, where edges[i] = [ui,\
  \ vi, lengthi] describes an edge between node ui and node vi with a traversal time of lengthi units.\n\
  Additionally, you are given an array disappear, where disappear[i] denotes the time when the node i\
  \ disappears from the graph and you won't be able to visit it.\nNote that the graph might be disconnected\
  \ and might contain multiple edges.\nReturn the array answer, with answer[i] denoting the minimum units\
  \ of time required to reach node i from node 0. If node i is unreachable from node 0 then answer[i]\
  \ is -1.\n \nExample 1:\n\nInput: n = 3, edges = [[0,1,2],[1,2,1],[0,2,4]], disappear = [1,1,5]\nOutput:\
  \ [0,-1,4]\nExplanation:\n\nWe are starting our journey from node 0, and our goal is to find the minimum\
  \ time required to reach each node before it disappears.\n\nFor node 0, we don't need any time as it\
  \ is our starting point.\nFor node 1, we need at least 2 units of time to traverse edges[0]. Unfortunately,\
  \ it disappears at that moment, so we won't be able to visit it.\nFor node 2, we need at least 4 units\
  \ of time to traverse edges[2].\n\n\nExample 2:\n\nInput: n = 3, edges = [[0,1,2],[1,2,1],[0,2,4]],\
  \ disappear = [1,3,5]\nOutput: [0,2,3]\nExplanation:\n\nWe are starting our journey from node 0, and\
  \ our goal is to find the minimum time required to reach each node before it disappears.\n\nFor node\
  \ 0, we don't need any time as it is the starting point.\nFor node 1, we need at least 2 units of time\
  \ to traverse edges[0].\nFor node 2, we need at least 3 units of time to traverse edges[0] and edges[1].\n\
  \n\nExample 3:\n\nInput: n = 2, edges = [[0,1,1]], disappear = [1,1]\nOutput: [0,-1]\nExplanation:\n\
  Exactly when we reach node 1, it disappears.\n\n \nConstraints:\n\n1 <= n <= 5 * 104\n0 <= edges.length\
  \ <= 105\nedges[i] == [ui, vi, lengthi]\n0 <= ui, vi <= n - 1\n1 <= lengthi <= 105\ndisappear.length\
  \ == n\n1 <= disappear[i] <= 105\n\nWrite the solution in Python as this class, with any imports it\
  \ needs:\n\n```python\nclass Solution:\n    def minimumTime(self, n: int, edges: List[List[int]], disappear:\
  \ List[int]) -> List[int]:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minimumTime(n=2, edges=[[0, 1, 1]], disappear=[1, 1]) == [0, -1]
  - Solution().minimumTime(n=6, edges=[[0, 1, 1], [1, 2, 2], [2, 3, 3], [3, 4, 4], [4, 5, 5]], disappear=[1,
    2, 3, 4, 5, 6]) == [0, 1, -1, -1, -1, -1]
  - Solution().minimumTime(n=4, edges=[[0, 1, 1], [1, 2, 2], [2, 3, 3], [3, 0, 4]], disappear=[10, 10,
    10, 10]) == [0, 1, 3, 4]
  - Solution().minimumTime(n=1, edges=[], disappear=[1]) == [0]
  - Solution().minimumTime(n=5, edges=[[0, 1, 2], [1, 2, 3], [2, 3, 4], [3, 4, 5]], disappear=[5, 6, 7,
    8, 9]) == [0, 2, 5, -1, -1]
  - Solution().minimumTime(n=5, edges=[[0, 1, 5], [0, 2, 3], [1, 3, 1], [2, 3, 2], [2, 4, 6]], disappear=[10,
    5, 4, 8, 7]) == [0, -1, 3, 5, -1]
  - Solution().minimumTime(n=4, edges=[[0, 1, 1], [0, 2, 2], [0, 3, 3]], disappear=[2, 3, 4, 5]) == [0,
    1, 2, 3]
  - Solution().minimumTime(n=5, edges=[[0, 1, 5], [1, 2, 3], [2, 3, 4], [3, 4, 2], [4, 0, 6]], disappear=[10,
    20, 30, 40, 50]) == [0, 5, 8, 8, 6]
  - Solution().minimumTime(n=3, edges=[[0, 1, 2], [1, 2, 1], [0, 2, 4]], disappear=[1, 3, 5]) == [0, 2,
    3]
  - Solution().minimumTime(n=5, edges=[[0, 1, 2], [1, 2, 2], [2, 3, 1], [3, 4, 3]], disappear=[1, 2, 3,
    4, 5]) == [0, -1, -1, -1, -1]
