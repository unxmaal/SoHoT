id: lc3364
modality: code
prompt: "You are given an integer array nums and two integers l and r. Your task is to find the minimum\
  \ sum of a subarray whose size is between l and r (inclusive) and whose sum is greater than 0.\nReturn\
  \ the minimum sum of such a subarray. If no such subarray exists, return -1.\nA subarray is a contiguous\
  \ non-empty sequence of elements within an array.\n \nExample 1:\n\nInput: nums = [3, -2, 1, 4], l =\
  \ 2, r = 3\nOutput: 1\nExplanation:\nThe subarrays of length between l = 2 and r = 3 where the sum is\
  \ greater than 0 are:\n\n[3, -2] with a sum of 1\n[1, 4] with a sum of 5\n[3, -2, 1] with a sum of 2\n\
  [-2, 1, 4] with a sum of 3\n\nOut of these, the subarray [3, -2] has a sum of 1, which is the smallest\
  \ positive sum. Hence, the answer is 1.\n\nExample 2:\n\nInput: nums = [-2, 2, -3, 1], l = 2, r = 3\n\
  Output: -1\nExplanation:\nThere is no subarray of length between l and r that has a sum greater than\
  \ 0. So, the answer is -1.\n\nExample 3:\n\nInput: nums = [1, 2, 3, 4], l = 2, r = 4\nOutput: 3\nExplanation:\n\
  The subarray [1, 2] has a length of 2 and the minimum sum greater than 0. So, the answer is 3.\n\n \n\
  Constraints:\n\n1 <= nums.length <= 100\n1 <= l <= r <= nums.length\n-1000 <= nums[i] <= 1000\n\nWrite\
  \ the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n \
  \   def minimumSumSubarray(self, nums: List[int], l: int, r: int) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minimumSumSubarray(nums=[1, 2, 3, 4], l=2, r=4) == 3
  - Solution().minimumSumSubarray(nums=[5, -1, 3, -2, 4], l=1, r=4) == 1
  - Solution().minimumSumSubarray(nums=[1, -1, 1, -1, 1], l=1, r=5) == 1
  - Solution().minimumSumSubarray(nums=[-1, -2, -3, -4], l=2, r=3) == -1
  - Solution().minimumSumSubarray(nums=[-10, 10, -10, 10, -10], l=2, r=4) == 10
  - Solution().minimumSumSubarray(nums=[-5, -1, -2, -3, -3, -4], l=2, r=5) == -1
  - Solution().minimumSumSubarray(nums=[5, -1, 3, -2, 4], l=1, r=2) == 1
  - Solution().minimumSumSubarray(nums=[10, -5, 20, -10, 30], l=2, r=4) == 5
  - Solution().minimumSumSubarray(nums=[-5, -1, -3, -2, -4], l=2, r=3) == -1
  - Solution().minimumSumSubarray(nums=[1000, -500, 250, -125, 62], l=3, r=5) == 187
