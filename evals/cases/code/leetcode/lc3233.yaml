modality: code
prompt: "You are given 2 positive integers l and r. For any number x, all positive divisors of x except\
  \ x are called the proper divisors of x.\nA number is called special if it has exactly 2 proper divisors.\
  \ For example:\n\nThe number 4 is special because it has proper divisors 1 and 2.\nThe number 6 is not\
  \ special because it has proper divisors 1, 2, and 3.\n\nReturn the count of numbers in the range [l,\
  \ r] that are not special.\n \nExample 1:\n\nInput: l = 5, r = 7\nOutput: 3\nExplanation:\nThere are\
  \ no special numbers in the range [5, 7].\n\nExample 2:\n\nInput: l = 4, r = 16\nOutput: 11\nExplanation:\n\
  The special numbers in the range [4, 16] are 4 and 9.\n\n \nConstraints:\n\n1 <= l <= r <= 109\n\nWrite\
  \ the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n \
  \   def nonSpecialCount(self, l: int, r: int) -> int:\n```\n\nReturn only the code."
assert:
