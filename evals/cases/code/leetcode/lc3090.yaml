prompt: "Given a string s, return the maximum length of a substring such that it contains at most two\
  \ occurrences of each character.\n \nExample 1:\n\nInput: s = \"bcbbbcba\"\nOutput: 4\nExplanation:\n\
  The following substring has a length of 4 and contains at most two occurrences of each character: \"\
  bcbbbcba\".\nExample 2:\n\nInput: s = \"aaaa\"\nOutput: 2\nExplanation:\nThe following substring has\
  \ a length of 2 and contains at most two occurrences of each character: \"aaaa\".\n \nConstraints:\n\
  \n2 <= s.length <= 100\ns consists only of lowercase English letters.\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def maximumLengthSubstring(self,\
  \ s: str) -> int:\n```\n\nReturn only the code."
