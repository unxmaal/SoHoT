modality: code
prompt: "You are given an integer array nums.\nReturn an integer that is the maximum distance between\
  \ the indices of two (not necessarily different) prime numbers in nums.\n \nExample 1:\n\nInput: nums\
  \ = [4,2,9,5,3]\nOutput: 3\nExplanation: nums[1], nums[3], and nums[4] are prime. So the answer is |4\
  \ - 1| = 3.\n\nExample 2:\n\nInput: nums = [4,8,2,8]\nOutput: 0\nExplanation: nums[2] is prime. Because\
  \ there is just one prime number, the answer is |2 - 2| = 0.\n\n \nConstraints:\n\n1 <= nums.length\
  \ <= 3 * 105\n1 <= nums[i] <= 100\nThe input is generated such that the number of prime numbers in the\
  \ nums is at least one.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n\
  ```python\nclass Solution:\n    def maximumPrimeDifference(self, nums: List[int]) -> int:\n```\n\nReturn\
  \ only the code."
assert:
