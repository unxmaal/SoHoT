prompt: "You are given an array nums.\nA split of an array nums is beautiful if:\n\nThe array nums is\
  \ split into three subarrays: nums1, nums2, and nums3, such that nums can be formed by concatenating\
  \ nums1, nums2, and nums3 in that order.\nThe subarray nums1 is a prefix of nums2 OR nums2 is a prefix\
  \ of nums3.\n\nReturn the number of ways you can make this split.\n \nExample 1:\n\nInput: nums = [1,1,2,1]\n\
  Output: 2\nExplanation:\nThe beautiful splits are:\n\nA split with nums1 = [1], nums2 = [1,2], nums3\
  \ = [1].\nA split with nums1 = [1], nums2 = [1], nums3 = [2,1].\n\n\nExample 2:\n\nInput: nums = [1,2,3,4]\n\
  Output: 0\nExplanation:\nThere are 0 beautiful splits.\n\n \nConstraints:\n\n1 <= nums.length <= 5000\n\
  0 <= nums[i] <= 50\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def beautifulSplits(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
