prompt: "You are given a 2D matrix grid consisting of positive integers.\nYou have to select one or more\
  \ cells from the matrix such that the following conditions are satisfied:\n\nNo two selected cells are\
  \ in the same row of the matrix.\nThe values in the set of selected cells are unique.\n\nYour score\
  \ will be the sum of the values of the selected cells.\nReturn the maximum score you can achieve.\n\
   \nExample 1:\n\nInput: grid = [[1,2,3],[4,3,2],[1,1,1]]\nOutput: 8\nExplanation:\n\nWe can select the\
  \ cells with values 1, 3, and 4 that are colored above.\n\nExample 2:\n\nInput: grid = [[8,7,6],[8,3,2]]\n\
  Output: 15\nExplanation:\n\nWe can select the cells with values 7 and 8 that are colored above.\n\n\
   \nConstraints:\n\n1 <= grid.length, grid[i].length <= 10\n1 <= grid[i][j] <= 100\n\nWrite the solution\
  \ in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def maxScore(self,\
  \ grid: List[List[int]]) -> int:\n```\n\nReturn only the code."
