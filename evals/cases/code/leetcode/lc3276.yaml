  - Solution().maxScore(grid=[[1, 100, 1], [100, 1, 100], [1, 100, 1]]) == 101
  - Solution().maxScore(grid=[[1, 2, 3], [3, 2, 1]]) == 5
  - Solution().maxScore(grid=[[1, 2], [3, 4], [5, 6]]) == 12
