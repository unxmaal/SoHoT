  - Solution().numberCount(a=50, b=59) == 9
  - Solution().numberCount(a=9, b=19) == 10
  - Solution().numberCount(a=750, b=780) == 17
  - Solution().numberCount(a=1, b=20) == 19
  - Solution().numberCount(a=333, b=444) == 80
  - Solution().numberCount(a=100, b=300) == 144
