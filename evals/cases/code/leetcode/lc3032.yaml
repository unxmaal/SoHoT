modality: code
prompt: "Given two positive integers a and b, return the count of numbers having unique digits in the\
  \ range [a, b] (inclusive).\n \nExample 1:\n\nInput: a = 1, b = 20\nOutput: 19\nExplanation: All the\
  \ numbers in the range [1, 20] have unique digits except 11. Hence, the answer is 19.\n\nExample 2:\n\
  \nInput: a = 9, b = 19\nOutput: 10\nExplanation: All the numbers in the range [9, 19] have unique digits\
  \ except 11. Hence, the answer is 10. \n\nExample 3:\n\nInput: a = 80, b = 120\nOutput: 27\nExplanation:\
  \ There are 41 numbers in the range [80, 120], 27 of which have unique digits.\n\n \nConstraints:\n\n\
  1 <= a <= b <= 1000\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def numberCount(self, a: int, b: int) -> int:\n```\n\nReturn only the code."
assert:
