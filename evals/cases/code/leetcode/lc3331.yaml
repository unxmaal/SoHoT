id: lc3331
modality: code
prompt: "You are given a tree rooted at node 0 that consists of n nodes numbered from 0 to n - 1. The\
  \ tree is represented by an array parent of size n, where parent[i] is the parent of node i. Since node\
  \ 0 is the root, parent[0] == -1.\nYou are also given a string s of length n, where s[i] is the character\
  \ assigned to node i.\nWe make the following changes on the tree one time simultaneously for all nodes\
  \ x from 1 to n - 1:\n\nFind the closest node y to node x such that y is an ancestor of x, and s[x]\
  \ == s[y].\nIf node y does not exist, do nothing.\nOtherwise, remove the edge between x and its current\
  \ parent and make node y the new parent of x by adding an edge between them.\n\nReturn an array answer\
  \ of size n where answer[i] is the size of the subtree rooted at node i in the final tree.\n \nExample\
  \ 1:\n\nInput: parent = [-1,0,0,1,1,1], s = \"abaabc\"\nOutput: [6,3,1,1,1,1]\nExplanation:\n\nThe parent\
  \ of node 3 will change from node 1 to node 0.\n\nExample 2:\n\nInput: parent = [-1,0,4,0,1], s = \"\
  abbba\"\nOutput: [5,2,1,1,1]\nExplanation:\n\nThe following changes will happen at the same time:\n\n\
  The parent of node 4 will change from node 1 to node 0.\nThe parent of node 2 will change from node\
  \ 4 to node 1.\n\n\n \nConstraints:\n\nn == parent.length == s.length\n1 <= n <= 105\n0 <= parent[i]\
  \ <= n - 1 for all i >= 1.\nparent[0] == -1\nparent represents a valid tree.\ns consists only of lowercase\
  \ English letters.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def findSubtreeSizes(self, parent: List[int], s: str) -> List[int]:\n```\n\nReturn\
  \ only the code."
assert:
  checks:
  - Solution().findSubtreeSizes(parent=[-1, 0, 1, 2, 3, 4], s='aaaaa') == [5, 4, 3, 2, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 0, 0, 0], s='abcde') == [5, 1, 1, 1, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 4, 0, 1], s='abbba') == [5, 2, 1, 1, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 1, 2, 3, 0, 2], s='abacaba') == [7, 1, 4, 1, 1, 1, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 0, 1, 1, 1], s='abaabc') == [6, 3, 1, 1, 1, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 1, 1, 2, 2, 3, 3, 4, 4], s='aabbaabbaa') == [10, 9, 1,
    3, 3, 1, 1, 1, 1, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 1, 2, 3], s='aaaaa') == [5, 4, 3, 2, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 1, 2, 3, 4], s='abcde') == [5, 4, 3, 2, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 0, 2, 2], s='aaaba') == [5, 1, 3, 1, 1]
  - Solution().findSubtreeSizes(parent=[-1, 0, 0, 0, 0, 0], s='abcabc') == [6, 1, 1, 1, 1, 1]
