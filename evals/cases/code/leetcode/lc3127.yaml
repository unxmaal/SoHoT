modality: code
prompt: "You are given a 2D matrix grid of size 3 x 3 consisting only of characters 'B' and 'W'. Character\
  \ 'W' represents the white color, and character 'B' represents the black color.\nYour task is to change\
  \ the color of at most one cell so that the matrix has a 2 x 2 square where all cells are of the same\
  \ color.\nReturn true if it is possible to create a 2 x 2 square of the same color, otherwise, return\
  \ false.\n \n\n\nExample 1:\n\n \n \n \n \n \n \n \n \n \n\n\nInput: grid = [[\"B\",\"W\",\"B\"],[\"\
  B\",\"W\",\"W\"],[\"B\",\"W\",\"B\"]]\nOutput: true\nExplanation:\nIt can be done by changing the color\
  \ of the grid[0][2].\n\nExample 2:\n\n \n \n \n \n \n \n \n \n \n\n\nInput: grid = [[\"B\",\"W\",\"\
  B\"],[\"W\",\"B\",\"W\"],[\"B\",\"W\",\"B\"]]\nOutput: false\nExplanation:\nIt cannot be done by changing\
  \ at most one cell.\n\nExample 3:\n\n \n \n \n \n \n \n \n \n \n\n\nInput: grid = [[\"B\",\"W\",\"B\"\
  ],[\"B\",\"W\",\"W\"],[\"B\",\"W\",\"W\"]]\nOutput: true\nExplanation:\nThe grid already contains a\
  \ 2 x 2 square of the same color.\n\n \nConstraints:\n\ngrid.length == 3\ngrid[i].length == 3\ngrid[i][j]\
  \ is either 'W' or 'B'.\n\nWrite the solution in Python as this class, with any imports it needs:\n\n\
  ```python\nclass Solution:\n    def canMakeSquare(self, grid: List[List[str]]) -> bool:\n```\n\nReturn\
  \ only the code."
