  - Solution().canMakeSquare(grid=[['B', 'W', 'W'], ['W', 'W', 'W'], ['W', 'W', 'B']]) == True
  - Solution().canMakeSquare(grid=[['W', 'B', 'W'], ['B', 'W', 'B'], ['W', 'B', 'W']]) == False
  - Solution().canMakeSquare(grid=[['B', 'W', 'B'], ['B', 'W', 'W'], ['B', 'W', 'W']]) == True
  - Solution().canMakeSquare(grid=[['W', 'B', 'B'], ['B', 'B', 'B'], ['B', 'B', 'W']]) == True
