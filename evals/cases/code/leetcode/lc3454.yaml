id: lc3454
modality: code
prompt: "You are given a 2D integer array squares. Each squares[i] = [xi, yi, li] represents the coordinates\
  \ of the bottom-left point and the side length of a square parallel to the x-axis.\nFind the minimum\
  \ y-coordinate value of a horizontal line such that the total area covered by squares above the line\
  \ equals the total area covered by squares below the line.\nAnswers within 10-5 of the actual answer\
  \ will be accepted.\nNote: Squares may overlap. Overlapping areas should be counted only once in this\
  \ version.\n \nExample 1:\n\nInput: squares = [[0,0,1],[2,2,1]]\nOutput: 1.00000\nExplanation:\n\nAny\
  \ horizontal line between y = 1 and y = 2 results in an equal split, with 1 square unit above and 1\
  \ square unit below. The minimum y-value is 1.\n\nExample 2:\n\nInput: squares = [[0,0,2],[1,1,1]]\n\
  Output: 1.00000\nExplanation:\n\nSince the blue square overlaps with the red square, it will not be\
  \ counted again. Thus, the line y = 1 splits the squares into two equal parts.\n\n \nConstraints:\n\n\
  1 <= squares.length <= 5 * 104\nsquares[i] = [xi, yi, li]\nsquares[i].length == 3\n0 <= xi, yi <= 109\n\
  1 <= li <= 109\nThe total area of all the squares will not exceed 1015.\n\nWrite the solution in Python\
  \ as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def separateSquares(self,\
  \ squares: List[List[int]]) -> float:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().separateSquares(squares=[[0, 0, 1], [1, 1, 1], [2, 2, 1], [3, 3, 1]]) == 2.0
  - Solution().separateSquares(squares=[[1, 1, 2], [2, 0, 2], [0, 2, 2]]) == 2.0
  - Solution().separateSquares(squares=[[0, 0, 4], [2, 2, 2], [1, 1, 1], [3, 3, 1]]) == 2.0
  - Solution().separateSquares(squares=[[0, 0, 5], [2, 2, 3], [1, 1, 2], [3, 3, 2], [4, 4, 1]]) == 2.5
  - Solution().separateSquares(squares=[[0, 0, 5], [5, 5, 5], [10, 10, 5], [15, 15, 5]]) == 10.0
  - Solution().separateSquares(squares=[[0, 0, 3], [1, 1, 2], [2, 2, 1]]) == 1.5
  - Solution().separateSquares(squares=[[0, 0, 2], [1, 1, 1]]) == 1.0
  - Solution().separateSquares(squares=[[0, 0, 10], [5, 5, 5], [10, 10, 1]]) == 5.05
  - Solution().separateSquares(squares=[[0, 0, 1], [2, 2, 1]]) == 1.0
  - Solution().separateSquares(squares=[[0, 0, 5], [5, 5, 5], [10, 10, 5]]) == 7.5
