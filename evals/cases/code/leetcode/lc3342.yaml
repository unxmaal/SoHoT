modality: code
prompt: "There is a dungeon with n x m rooms arranged as a grid.\nYou are given a 2D array moveTime of\
  \ size n x m, where moveTime[i][j] represents the minimum time in seconds when you can start moving\
  \ to that room. You start from the room (0, 0) at time t = 0 and can move to an adjacent room. Moving\
  \ between adjacent rooms takes one second for one move and two seconds for the next, alternating between\
  \ the two.\nReturn the minimum time to reach the room (n - 1, m - 1).\nTwo rooms are adjacent if they\
  \ share a common wall, either horizontally or vertically.\n \nExample 1:\n\nInput: moveTime = [[0,4],[4,4]]\n\
  Output: 7\nExplanation:\nThe minimum time required is 7 seconds.\n\nAt time t == 4, move from room (0,\
  \ 0) to room (1, 0) in one second.\nAt time t == 5, move from room (1, 0) to room (1, 1) in two seconds.\n\
  \n\nExample 2:\n\nInput: moveTime = [[0,0,0,0],[0,0,0,0]]\nOutput: 6\nExplanation:\nThe minimum time\
  \ required is 6 seconds.\n\nAt time t == 0, move from room (0, 0) to room (1, 0) in one second.\nAt\
  \ time t == 1, move from room (1, 0) to room (1, 1) in two seconds.\nAt time t == 3, move from room\
  \ (1, 1) to room (1, 2) in one second.\nAt time t == 4, move from room (1, 2) to room (1, 3) in two\
  \ seconds.\n\n\nExample 3:\n\nInput: moveTime = [[0,1],[1,2]]\nOutput: 4\n\n \nConstraints:\n\n2 <=\
  \ n == moveTime.length <= 750\n2 <= m == moveTime[i].length <= 750\n0 <= moveTime[i][j] <= 109\n\nWrite\
  \ the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n \
  \   def minTimeToReach(self, moveTime: List[List[int]]) -> int:\n```\n\nReturn only the code."
assert:
