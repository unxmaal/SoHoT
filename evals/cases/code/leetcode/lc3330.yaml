prompt: "Alice is attempting to type a specific string on her computer. However, she tends to be clumsy\
  \ and may press a key for too long, resulting in a character being typed multiple times.\nAlthough Alice\
  \ tried to focus on her typing, she is aware that she may still have done this at most once.\nYou are\
  \ given a string word, which represents the final output displayed on Alice's screen.\nReturn the total\
  \ number of possible original strings that Alice might have intended to type.\n \nExample 1:\n\nInput:\
  \ word = \"abbcccc\"\nOutput: 5\nExplanation:\nThe possible strings are: \"abbcccc\", \"abbccc\", \"\
  abbcc\", \"abbc\", and \"abcccc\".\n\nExample 2:\n\nInput: word = \"abcd\"\nOutput: 1\nExplanation:\n\
  The only possible string is \"abcd\".\n\nExample 3:\n\nInput: word = \"aaaa\"\nOutput: 4\n\n \nConstraints:\n\
  \n1 <= word.length <= 100\nword consists only of lowercase English letters.\n\nWrite the solution in\
  \ Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def possibleStringCount(self,\
  \ word: str) -> int:\n```\n\nReturn only the code."
assert:
