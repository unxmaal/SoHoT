  - Solution().possibleStringCount(word='abbcccc') == 5
  - Solution().possibleStringCount(word='mississippi') == 4
  - Solution().possibleStringCount(word='zzzzzzz') == 7
  - Solution().possibleStringCount(word='zzzzzzzzzz') == 10
  - Solution().possibleStringCount(word='aabbccdd') == 5
