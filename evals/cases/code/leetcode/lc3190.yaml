prompt: "You are given an integer array nums. In one operation, you can add or subtract 1 from any element\
  \ of nums.\nReturn the minimum number of operations to make all elements of nums divisible by 3.\n \n\
  Example 1:\n\nInput: nums = [1,2,3,4]\nOutput: 3\nExplanation:\nAll array elements can be made divisible\
  \ by 3 using 3 operations:\n\nSubtract 1 from 1.\nAdd 1 to 2.\nSubtract 1 from 4.\n\n\nExample 2:\n\n\
  Input: nums = [3,6,9]\nOutput: 0\n\n \nConstraints:\n\n1 <= nums.length <= 50\n1 <= nums[i] <= 50\n\n\
  Write the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n\
  \    def minimumOperations(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
assert:
