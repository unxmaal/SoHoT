  - Solution().minimumOperations(nums=[1, 2, 4, 5]) == 4
  - Solution().minimumOperations(nums=[1, 1, 1, 1]) == 4
  - Solution().minimumOperations(nums=[3, 3, 3, 3]) == 0
  - Solution().minimumOperations(nums=[1, 2, 4, 5, 7]) == 5
  - Solution().minimumOperations(nums=[1, 2, 4, 5, 7, 8]) == 6
  - Solution().minimumOperations(nums=[11, 22, 33, 44]) == 3
  - Solution().minimumOperations(nums=[15, 18, 21, 24]) == 0
  - Solution().minimumOperations(nums=[50, 49, 48, 47, 46]) == 4
  - Solution().minimumOperations(nums=[1, 2, 3, 4]) == 3
  - Solution().minimumOperations(nums=[47, 49, 50]) == 3
