id: lc3144
modality: code
prompt: "Given a string s, you need to partition it into one or more balanced substrings. For example,\
  \ if s == \"ababcc\" then (\"abab\", \"c\", \"c\"), (\"ab\", \"abc\", \"c\"), and (\"ababcc\") are all\
  \ valid partitions, but (\"a\", \"bab\", \"cc\"), (\"aba\", \"bc\", \"c\"), and (\"ab\", \"abcc\") are\
  \ not. The unbalanced substrings are bolded.\nReturn the minimum number of substrings that you can partition\
  \ s into.\nNote: A balanced string is a string where each character in the string occurs the same number\
  \ of times.\n \nExample 1:\n\nInput: s = \"fabccddg\"\nOutput: 3\nExplanation:\nWe can partition the\
  \ string s into 3 substrings in one of the following ways: (\"fab, \"ccdd\", \"g\"), or (\"fabc\", \"\
  cd\", \"dg\").\n\nExample 2:\n\nInput: s = \"abababaccddb\"\nOutput: 2\nExplanation:\nWe can partition\
  \ the string s into 2 substrings like so: (\"abab\", \"abaccddb\").\n\n \nConstraints:\n\n1 <= s.length\
  \ <= 1000\ns consists only of English lowercase letters.\n\nWrite the solution in Python as this class,\
  \ with any imports it needs:\n\n```python\nclass Solution:\n    def minimumSubstringsInPartition(self,\
  \ s: str) -> int:\n```\n\nReturn only the code."
assert:
  checks:
  - Solution().minimumSubstringsInPartition(s='zzzzzzzzz') == 1
  - Solution().minimumSubstringsInPartition(s='aaabbbccc') == 1
  - Solution().minimumSubstringsInPartition(s='abcdefghijklmnopqrstuvwxyz') == 1
  - Solution().minimumSubstringsInPartition(s='aabbaabbccddccdd') == 1
  - Solution().minimumSubstringsInPartition(s='abcdef') == 1
  - Solution().minimumSubstringsInPartition(s='abababab') == 1
  - Solution().minimumSubstringsInPartition(s='a') == 1
  - Solution().minimumSubstringsInPartition(s='abcdefghi') == 1
  - Solution().minimumSubstringsInPartition(s='abacabadabacaba') == 8
  - Solution().minimumSubstringsInPartition(s='abab') == 1
