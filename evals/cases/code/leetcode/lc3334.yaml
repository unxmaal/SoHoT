prompt: "You are given an integer array nums.\nThe factor score of an array is defined as the product\
  \ of the LCM and GCD of all elements of that array.\nReturn the maximum factor score of nums after removing\
  \ at most one element from it.\nNote that both the LCM and GCD of a single number are the number itself,\
  \ and the factor score of an empty array is 0.\n \nExample 1:\n\nInput: nums = [2,4,8,16]\nOutput: 64\n\
  Explanation:\nOn removing 2, the GCD of the rest of the elements is 4 while the LCM is 16, which gives\
  \ a maximum factor score of 4 * 16 = 64.\n\nExample 2:\n\nInput: nums = [1,2,3,4,5]\nOutput: 60\nExplanation:\n\
  The maximum factor score of 60 can be obtained without removing any elements.\n\nExample 3:\n\nInput:\
  \ nums = [3]\nOutput: 9\n\n \nConstraints:\n\n1 <= nums.length <= 100\n1 <= nums[i] <= 30\n\nWrite the\
  \ solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n    def\
  \ maxScore(self, nums: List[int]) -> int:\n```\n\nReturn only the code."
