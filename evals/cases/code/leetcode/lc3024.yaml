prompt: "You are given a 0-indexed integer array nums of size 3 which can form the sides of a triangle.\n\
  \nA triangle is called equilateral if it has all sides of equal length.\nA triangle is called isosceles\
  \ if it has exactly two sides of equal length.\nA triangle is called scalene if all its sides are of\
  \ different lengths.\n\nReturn a string representing the type of triangle that can be formed or \"none\"\
  \ if it cannot form a triangle.\n \nExample 1:\n\nInput: nums = [3,3,3]\nOutput: \"equilateral\"\nExplanation:\
  \ Since all the sides are of equal length, therefore, it will form an equilateral triangle.\n\nExample\
  \ 2:\n\nInput: nums = [3,4,5]\nOutput: \"scalene\"\nExplanation: \nnums[0] + nums[1] = 3 + 4 = 7, which\
  \ is greater than nums[2] = 5.\nnums[0] + nums[2] = 3 + 5 = 8, which is greater than nums[1] = 4.\n\
  nums[1] + nums[2] = 4 + 5 = 9, which is greater than nums[0] = 3. \nSince the sum of the two sides is\
  \ greater than the third side for all three cases, therefore, it can form a triangle.\nAs all the sides\
  \ are of different lengths, it will form a scalene triangle.\n\n \nConstraints:\n\nnums.length == 3\n\
  1 <= nums[i] <= 100\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def triangleType(self, nums: List[int]) -> str:\n```\n\nReturn only the code."
