modality: code
prompt: "Given three integer arrays a, b, and c, return the number of triplets (a[i], b[j], c[k]), such\
  \ that the bitwise XOR of the elements of each triplet has an even number of set bits.\n \nExample 1:\n\
  \nInput: a = [1], b = [2], c = [3]\nOutput: 1\nExplanation:\nThe only triplet is (a[0], b[0], c[0])\
  \ and their XOR is: 1 XOR 2 XOR 3 = 002.\n\nExample 2:\n\nInput: a = [1,1], b = [2,3], c = [1,5]\nOutput:\
  \ 4\nExplanation:\nConsider these four triplets:\n\n(a[0], b[1], c[0]): 1 XOR 3 XOR 1 = 0112\n(a[1],\
  \ b[1], c[0]): 1 XOR 3 XOR 1 = 0112\n(a[0], b[0], c[1]): 1 XOR 2 XOR 5 = 1102\n(a[1], b[0], c[1]): 1\
  \ XOR 2 XOR 5 = 1102\n\n\n \nConstraints:\n\n1 <= a.length, b.length, c.length <= 100\n0 <= a[i], b[i],\
  \ c[i] <= 100\n\nWrite the solution in Python as this class, with any imports it needs:\n\n```python\n\
  class Solution:\n    def tripletCount(self, a: List[int], b: List[int], c: List[int]) -> int:\n```\n\
  \nReturn only the code."
assert:
  checks:
  - Solution().tripletCount(a=[0, 1], b=[0, 1], c=[0, 1]) == 4
  - Solution().tripletCount(a=[0, 1, 2], b=[0, 1, 2], c=[0, 1, 2]) == 13
  - Solution().tripletCount(a=[2, 4, 6], b=[1, 3, 5], c=[0, 2, 4]) == 14
  - Solution().tripletCount(a=[10, 20, 30], b=[40, 50, 60], c=[70, 80, 90]) == 15
  - Solution().tripletCount(a=[3, 3, 3], b=[4, 4, 4], c=[5, 5, 5]) == 0
  - Solution().tripletCount(a=[1, 3, 5, 7], b=[2, 4, 6, 8], c=[0, 1, 0, 1]) == 32
  - Solution().tripletCount(a=[10, 20, 30], b=[11, 21, 31], c=[12, 22, 32]) == 18
  - Solution().tripletCount(a=[1], b=[2], c=[3]) == 1
  - Solution().tripletCount(a=[0, 1, 2], b=[3, 4, 5], c=[6, 7, 8]) == 14
  - Solution().tripletCount(a=[1, 1], b=[2, 3], c=[1, 5]) == 4
