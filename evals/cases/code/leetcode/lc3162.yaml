prompt: "You are given 2 integer arrays nums1 and nums2 of lengths n and m respectively. You are also\
  \ given a positive integer k.\nA pair (i, j) is called good if nums1[i] is divisible by nums2[j] * k\
  \ (0 <= i <= n - 1, 0 <= j <= m - 1).\nReturn the total number of good pairs.\n \nExample 1:\n\nInput:\
  \ nums1 = [1,3,4], nums2 = [1,3,4], k = 1\nOutput: 5\nExplanation:\nThe 5 good pairs are (0, 0), (1,\
  \ 0), (1, 1), (2, 0), and (2, 2).\nExample 2:\n\nInput: nums1 = [1,2,4,12], nums2 = [2,4], k = 3\nOutput:\
  \ 2\nExplanation:\nThe 2 good pairs are (3, 0) and (3, 1).\n\n \nConstraints:\n\n1 <= n, m <= 50\n1\
  \ <= nums1[i], nums2[j] <= 50\n1 <= k <= 50\n\nWrite the solution in Python as this class, with any\
  \ imports it needs:\n\n```python\nclass Solution:\n    def numberOfPairs(self, nums1: List[int], nums2:\
  \ List[int], k: int) -> int:\n```\n\nReturn only the code."
