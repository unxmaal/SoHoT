  - Solution().countSubmatrices(grid=[[5, 5, 5], [5, 5, 5], [5, 5, 5]], k=15) == 5
  - Solution().countSubmatrices(grid=[[1, 2], [3, 4]], k=10) == 4
  - Solution().countSubmatrices(grid=[[1, 0, 1], [0, 1, 0], [1, 0, 1]], k=2) == 6
  - Solution().countSubmatrices(grid=[[1, 1, 1], [1, 1, 1], [1, 1, 1]], k=5) == 6
  - Solution().countSubmatrices(grid=[[1, 2, 3], [4, 5, 6]], k=15) == 5
  - Solution().countSubmatrices(grid=[[1]], k=1) == 1
  - Solution().countSubmatrices(grid=[[7, 2, 9], [1, 5, 0], [2, 6, 6]], k=20) == 6
  - Solution().countSubmatrices(grid=[[7, 6, 3], [6, 6, 1]], k=18) == 4
  - Solution().countSubmatrices(grid=[[1, 2, 3], [4, 5, 6], [7, 8, 9]], k=15) == 6
  - Solution().countSubmatrices(grid=[[0, 0, 0], [0, 0, 0], [0, 0, 0]], k=1) == 9
