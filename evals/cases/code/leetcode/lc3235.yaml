id: lc3235
modality: code
prompt: "You are given two positive integers xCorner and yCorner, and a 2D array circles, where circles[i]\
  \ = [xi, yi, ri] denotes a circle with center at (xi, yi) and radius ri.\nThere is a rectangle in the\
  \ coordinate plane with its bottom left corner at the origin and top right corner at the coordinate\
  \ (xCorner, yCorner). You need to check whether there is a path from the bottom left corner to the top\
  \ right corner such that the entire path lies inside the rectangle, does not touch or lie inside any\
  \ circle, and touches the rectangle only at the two corners.\nReturn true if such a path exists, and\
  \ false otherwise.\n \nExample 1:\n\nInput: xCorner = 3, yCorner = 4, circles = [[2,1,1]]\nOutput: true\n\
  Explanation:\n\nThe black curve shows a possible path between (0, 0) and (3, 4).\n\nExample 2:\n\nInput:\
  \ xCorner = 3, yCorner = 3, circles = [[1,1,2]]\nOutput: false\nExplanation:\n\nNo path exists from\
  \ (0, 0) to (3, 3).\n\nExample 3:\n\nInput: xCorner = 3, yCorner = 3, circles = [[2,1,1],[1,2,1]]\n\
  Output: false\nExplanation:\n\nNo path exists from (0, 0) to (3, 3).\n\nExample 4:\n\nInput: xCorner\
  \ = 4, yCorner = 4, circles = [[5,5,1]]\nOutput: true\nExplanation:\n\n\n \nConstraints:\n\n3 <= xCorner,\
  \ yCorner <= 109\n1 <= circles.length <= 1000\ncircles[i].length == 3\n1 <= xi, yi, ri <= 109\n\nWrite\
  \ the solution in Python as this class, with any imports it needs:\n\n```python\nclass Solution:\n \
  \   def canReachCorner(self, xCorner: int, yCorner: int, circles: List[List[int]]) -> bool:\n```\n\n\
  Return only the code."
assert:
  checks:
  - Solution().canReachCorner(xCorner=10, yCorner=10, circles=[[1, 1, 1], [9, 9, 1]]) == False
  - Solution().canReachCorner(xCorner=1000000000, yCorner=1000000000, circles=[[500000000, 500000000,
    499999999]]) == True
  - Solution().canReachCorner(xCorner=5, yCorner=5, circles=[[1, 1, 1], [4, 4, 1], [2, 2, 1]]) == False
  - Solution().canReachCorner(xCorner=1000000000, yCorner=1000000000, circles=[[500000000, 500000000,
    100000000]]) == True
  - Solution().canReachCorner(xCorner=10, yCorner=10, circles=[[5, 5, 2], [2, 2, 1]]) == True
  - Solution().canReachCorner(xCorner=5, yCorner=5, circles=[[2, 2, 1], [3, 3, 1]]) == True
  - Solution().canReachCorner(xCorner=5, yCorner=5, circles=[[1, 1, 1], [2, 2, 1], [3, 3, 1], [4, 4, 1]])
    == False
  - Solution().canReachCorner(xCorner=1000000000, yCorner=1000000000, circles=[[500000000, 500000000,
    500000000]]) == False
  - Solution().canReachCorner(xCorner=1000000000, yCorner=1000000000, circles=[[500000000, 500000000,
    1]]) == True
  - Solution().canReachCorner(xCorner=3, yCorner=3, circles=[[2, 1, 1], [1, 2, 1]]) == False
