context: 'Newton''s Third Law is a result of applying symmetry to situations where forces can be attributed
  to the presence of different objects. The third law means that all forces are interactions between different
  bodies,[Note 3] and thus that there is no such thing as a unidirectional force or a force that acts
  on only one body. Whenever a first body exerts a force F on a second body, the second body exerts a
  force −F on the first body. F and −F are equal in magnitude and opposite in direction. This law is sometimes
  referred to as the action-reaction law, with F called the "action" and −F the "reaction". The action
  and the reaction are simultaneous:'
