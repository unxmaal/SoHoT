  Question: What are presented to parliament in addition to the bill itself?'
context: Stage 1 is the first, or introductory stage of the bill, where the minister or member in charge
  of the bill will formally introduce it to Parliament together with its accompanying documents – Explanatory
  Notes, a Policy Memorandum setting out the policy underlying the bill, and a Financial Memorandum setting
  out the costs and savings associated with it. Statements from the Presiding Officer and the member in
  charge of the bill are also lodged indicating whether the bill is within the legislative competence
  of the Parliament. Stage 1 usually takes place, initially, in the relevant committee or committees and
  is then submitted to the whole Parliament for a full debate in the chamber on the general principles
  of the bill. If the whole Parliament agrees in a vote to the general principles of the bill, it then
  proceeds to Stage 2.
