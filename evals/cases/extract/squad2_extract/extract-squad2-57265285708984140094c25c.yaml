  Question: How significant was the transfer of disease through fleas?'
context: In addition to arguing that the rat population was insufficient to account for a bubonic plague
  pandemic, sceptics of the bubonic plague theory point out that the symptoms of the Black Death are not
  unique (and arguably in some accounts may differ from bubonic plague); that transference via fleas in
  goods was likely to be of marginal significance; and that the DNA results may be flawed and might not
  have been repeated elsewhere, despite extensive samples from other mass graves. Other arguments include
  the lack of accounts of the death of rats before outbreaks of plague between the 14th and 17th centuries;
  temperatures that are too cold in northern Europe for the survival of fleas; that, despite primitive
  transport systems, the spread of the Black Death was much faster than that of modern bubonic plague;
  that mortality rates of the Black Death appear to be very high; that, while modern bubonic plague is
  largely endemic as a rural disease, the Black Death indiscriminately struck urban and rural areas; and
  that the pattern of the Black Death, with major outbreaks in the same areas separated by 5 to 15 years,
  differs from modern bubonic plague—which often becomes endemic for decades with annual flare-ups.
