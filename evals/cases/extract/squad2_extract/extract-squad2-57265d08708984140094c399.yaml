  Question: What is another word for the Earth''s upper mantle?'
context: 'In the 1960s, a series of discoveries, the most important of which was seafloor spreading, showed
  that the Earth''s lithosphere, which includes the crust and rigid uppermost portion of the upper mantle,
  is separated into a number of tectonic plates that move across the plastically deforming, solid, upper
  mantle, which is called the asthenosphere. There is an intimate coupling between the movement of the
  plates on the surface and the convection of the mantle: oceanic plate motions and mantle convection
  currents always move in the same direction, because the oceanic lithosphere is the rigid upper thermal
  boundary layer of the convecting mantle. This coupling between rigid plates moving on the surface of
  the Earth and the convecting mantle is called plate tectonics.'
