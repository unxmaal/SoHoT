  Question: Which conjecture holds that for any positive integer n, there is an infinite amount of pairs
  of consecutive primes differing by 2n?'
context: A third type of conjectures concerns aspects of the distribution of primes. It is conjectured
  that there are infinitely many twin primes, pairs of primes with difference 2 (twin prime conjecture).
  Polignac's conjecture is a strengthening of that conjecture, it states that for every positive integer
  n, there are infinitely many pairs of consecutive primes that differ by 2n. It is conjectured there
  are infinitely many primes of the form n2 + 1. These conjectures are special cases of the broad Schinzel's
  hypothesis H. Brocard's conjecture says that there are always at least four primes between the squares
  of consecutive primes greater than 2. Legendre's conjecture states that there is a prime number between
  n2 and (n + 1)2 for every positive integer n. It is implied by the stronger Cramér's conjecture.
