  Question: What makes static friction go up or down in responce to contact characteristics between an
  object and the surface it is on?'
context: Pushing against an object on a frictional surface can result in a situation where the object
  does not move because the applied force is opposed by static friction, generated between the object
  and the table surface. For a situation with no movement, the static friction force exactly balances
  the applied force resulting in no acceleration. The static friction increases or decreases in response
  to the applied force up to an upper limit determined by the characteristics of the contact between the
  surface and the object.
