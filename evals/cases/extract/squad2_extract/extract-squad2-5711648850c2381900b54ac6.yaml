  Question: What is the approximate turbine entry temperature of a gas turbine?'
context: One of the principal advantages the Rankine cycle holds over others is that during the compression
  stage relatively little work is required to drive the pump, the working fluid being in its liquid phase
  at this point. By condensing the fluid, the work required by the pump consumes only 1% to 3% of the
  turbine power and contributes to a much higher efficiency for a real cycle. The benefit of this is lost
  somewhat due to the lower heat addition temperature. Gas turbines, for instance, have turbine entry
  temperatures approaching 1500 °C. Nonetheless, the efficiencies of actual large steam cycles and large
  modern gas turbines are fairly well matched.[citation needed]
