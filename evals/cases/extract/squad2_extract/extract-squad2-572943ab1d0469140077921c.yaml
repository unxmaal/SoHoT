  Question: Who was chairman of the House Science Committee?'
context: On 23 June 2005, Rep. Joe Barton, chairman of the House Committee on Energy and Commerce wrote
  joint letters with Ed Whitfield, Chairman of the Subcommittee on Oversight and Investigations demanding
  full records on climate research, as well as personal information about their finances and careers,
  from Mann, Bradley and Hughes. Sherwood Boehlert, chairman of the House Science Committee, said this
  was a "misguided and illegitimate investigation" apparently aimed at intimidating scientists, and at
  his request the U.S. National Academy of Sciences arranged for its National Research Council to set
  up a special investigation. The National Research Council's report agreed that there were some statistical
  failings, but these had little effect on the graph, which was generally correct. In a 2006 letter to
  Nature, Mann, Bradley, and Hughes pointed out that their original article had said that "more widespread
  high-resolution data are needed before more confident conclusions can be reached" and that the uncertainties
  were "the point of the article".
