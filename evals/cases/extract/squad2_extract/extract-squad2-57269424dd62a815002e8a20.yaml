  Question: How many votes in total does the Council have?'
context: 'The second main legislative body is the Council, which is composed of different ministers of
  the member states. The heads of government of member states also convene a "European Council" (a distinct
  body) that the TEU article 15 defines as providing the ''necessary impetus for its development and shall
  define the general political directions and priorities''. It meets each six months and its President
  (currently former Poland Prime Minister Donald Tusk) is meant to ''drive forward its work'', but it
  does not itself ''legislative functions''. The Council does this: in effect this is the governments
  of the member states, but there will be a different minister at each meeting, depending on the topic
  discussed (e.g. for environmental issues, the member states'' environment ministers attend and vote;
  for foreign affairs, the foreign ministers, etc.). The minister must have the authority to represent
  and bin the member states in decisions. When voting takes place it is weighted inversely to member state
  size, so smaller member states are not dominated by larger member states. In total there are 352 votes,
  but for most acts there must be a qualified majority vote, if not consensus. TEU article 16(4) and TFEU
  article 238(3) define this to mean at least 55 per cent of the Council members (not votes) representing
  65 per cent of the population of the EU: currently this means around 74 per cent, or 260 of the 352
  votes. This is critical during the legislative process.'
assert:
  equals:
  - '352'
