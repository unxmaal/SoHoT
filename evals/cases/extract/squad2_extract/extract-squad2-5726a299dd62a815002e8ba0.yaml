  Question: When was the European Convention on Human Rights established?'
context: None of the original treaties establishing the European Union mention protection for fundamental
  rights. It was not envisaged for European Union measures, that is legislative and administrative actions
  by European Union institutions, to be subject to human rights. At the time the only concern was that
  member states should be prevented from violating human rights, hence the establishment of the European
  Convention on Human Rights in 1950 and the establishment of the European Court of Human Rights. The
  European Court of Justice recognised fundamental rights as general principle of European Union law as
  the need to ensure that European Union measures are compatible with the human rights enshrined in member
  states' constitution became ever more apparent. In 1999 the European Council set up a body tasked with
  drafting a European Charter of Human Rights, which could form the constitutional basis for the European
  Union and as such tailored specifically to apply to the European Union and its institutions. The Charter
  of Fundamental Rights of the European Union draws a list of fundamental rights from the European Convention
  on Human Rights and Fundamental Freedoms, the Declaration on Fundamental Rights produced by the European
  Parliament in 1989 and European Union Treaties.
