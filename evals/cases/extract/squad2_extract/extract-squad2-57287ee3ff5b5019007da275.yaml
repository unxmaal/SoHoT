  Question: When did Kublai ban the international Mongol slave trade?'
context: The average Mongol garrison family of the Yuan dynasty seems to have lived a life of decaying
  rural leisure, with income from the harvests of their Chinese tenants eaten up by costs of equipping
  and dispatching men for their tours of duty. The Mongols practiced debt slavery, and by 1290 in all
  parts of the Mongol Empire commoners were selling their children into slavery. Seeing this as damaging
  to the Mongol nation, Kublai in 1291 forbade the sale abroad of Mongols. Kublai wished to persuade the
  Chinese that he was becoming increasingly sinicized while maintaining his Mongolian credentials with
  his own people. He set up a civilian administration to rule, built a capital within China, supported
  Chinese religions and culture, and devised suitable economic and political institutions for the court.
  But at the same time he never abandoned his Mongolian heritage.
