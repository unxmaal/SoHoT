  Question: What ethnic neighborhood in Fresno had primarily Japanese residents in 1940?'
context: Before World War II, Fresno had many ethnic neighborhoods, including Little Armenia, German Town,
  Little Italy, and Chinatown. In 1940, the Census Bureau reported Fresno's population as 94.0% white,
  3.3% black and 2.7% Asian. (Incongruously, Chinatown was primarily a Japanese neighborhood and today
  Japanese-American businesses still remain). During 1942, Pinedale, in what is now North Fresno, was
  the site of the Pinedale Assembly Center, an interim facility for the relocation of Fresno area Japanese
  Americans to internment camps. The Fresno Fairgrounds was also utilized as an assembly center.
