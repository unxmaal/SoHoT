  Question: Who does BSkyB have an operating license from?'
context: BSkyB has no veto over the presence of channels on their EPG, with open access being an enforced
  part of their operating licence from Ofcom. Any channel which can get carriage on a suitable beam of
  a satellite at 28° East is entitled to access to BSkyB's EPG for a fee, ranging from £15–100,000. Third-party
  channels which opt for encryption receive discounts ranging from reduced price to free EPG entries,
  free carriage on a BSkyB leased transponder, or actual payment for being carried. However, even in this
  case, BSkyB does not carry any control over the channel's content or carriage issues such as picture
  quality.
