  Question: Ctenophores and cnidarians are classified as what?'
context: Like sponges and cnidarians, ctenophores have two main layers of cells that sandwich a middle
  layer of jelly-like material, which is called the mesoglea in cnidarians and ctenophores; more complex
  animals have three main cell layers and no intermediate jelly-like layer. Hence ctenophores and cnidarians
  have traditionally been labelled diploblastic, along with sponges. Both ctenophores and cnidarians have
  a type of muscle that, in more complex animals, arises from the middle cell layer, and as a result some
  recent text books classify ctenophores as triploblastic, while others still regard them as diploblastic.
