context: An early important political response to the opening of hostilities was the convening of the
  Albany Congress in June and July, 1754. The goal of the congress was to formalize a unified front in
  trade and negotiations with various Indians, since allegiance of the various tribes and nations was
  seen to be pivotal in the success in the war that was unfolding. The plan that the delegates agreed
  to was never ratified by the colonial legislatures nor approved of by the crown. Nevertheless, the format
  of the congress and many specifics of the plan became the prototype for confederation during the War
  of Independence.
