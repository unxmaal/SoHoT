  Question: Reports document that how many Parisien Protestants were killed by September 17?'
context: In what became known as the St. Bartholomew's Day Massacre of 24 August – 3 October 1572, Catholics
  killed thousands of Huguenots in Paris. Similar massacres took place in other towns in the weeks following.
  The main provincial towns and cities experiencing the Massacre were Aix, Bordeaux, Bourges, Lyons, Meaux,
  Orleans, Rouen, Toulouse, and Troyes. Nearly 3,000 Protestants were slaughtered in Toulouse alone. The
  exact number of fatalities throughout the country is not known. On 23–24 August, between about 2,000
  and 3,000 Protestants were killed in Paris and between 3,000 and 7,000 more in the French provinces.
  By 17 September, almost 25,000 Protestants had been massacred in Paris alone. Beyond Paris, the killings
  continued until 3 October. An amnesty granted in 1573 pardoned the perpetrators.[citation needed]
