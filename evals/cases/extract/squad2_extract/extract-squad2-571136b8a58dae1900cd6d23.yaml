  Question: Along with Stephenson and Walschaerts, what is an example of a simple motion?'
context: In the 1840s and 50s, there were attempts to overcome this problem by means of various patent
  valve gears with a separate, variable cutoff expansion valve riding on the back of the main slide valve;
  the latter usually had fixed or limited cutoff. The combined setup gave a fair approximation of the
  ideal events, at the expense of increased friction and wear, and the mechanism tended to be complicated.
  The usual compromise solution has been to provide lap by lengthening rubbing surfaces of the valve in
  such a way as to overlap the port on the admission side, with the effect that the exhaust side remains
  open for a longer period after cut-off on the admission side has occurred. This expedient has since
  been generally considered satisfactory for most purposes and makes possible the use of the simpler Stephenson,
  Joy and Walschaerts motions. Corliss, and later, poppet valve gears had separate admission and exhaust
  valves driven by trip mechanisms or cams profiled so as to give ideal events; most of these gears never
  succeeded outside of the stationary marketplace due to various other issues including leakage and more
  delicate mechanisms.
