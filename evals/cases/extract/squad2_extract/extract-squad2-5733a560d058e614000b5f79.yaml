context: The origin of the legendary figure is not fully known. The best-known legend, by Artur Oppman,
  is that long ago two of Triton's daughters set out on a journey through the depths of the oceans and
  seas. One of them decided to stay on the coast of Denmark and can be seen sitting at the entrance to
  the port of Copenhagen. The second mermaid reached the mouth of the Vistula River and plunged into its
  waters. She stopped to rest on a sandy beach by the village of Warszowa, where fishermen came to admire
