context: From the mid-2000s, the university began a number of multimillion-dollar expansion projects.
  In 2008, the University of Chicago announced plans to establish the Milton Friedman Institute which
  attracted both support and controversy from faculty members and students. The institute will cost around
  $200 million and occupy the buildings of the Chicago Theological Seminary. During the same year, investor
  David G. Booth donated $300 million to the university's Booth School of Business, which is the largest
  gift in the university's history and the largest gift ever to any business school. In 2009, planning
  or construction on several new buildings, half of which cost $100 million or more, was underway. Since
  2011, major construction projects have included the Jules and Gwen Knapp Center for Biomedical Discovery,
  a ten-story medical research center, and further additions to the medical campus of the University of
  Chicago Medical Center. In 2014 the University launched the public phase of a $4.5 billion fundraising
  campaign. In September 2015, the University received $100 million from The Pearson Family Foundation
  to establish The Pearson Institute for the Study and Resolution of Global Conflicts and The Pearson
  Global Forum at the Harris School of Public Policy Studies.
