  administrative structure of past Chinese dynasties unchanged. However, Kublai rejected plans to revive
  the Confucian imperial examinations and divided Yuan society into three, later four, classes with the
  Han Chinese occupying the lowest rank. Kublai's Chinese advisers still wielded significant power in
  the government, but their official rank was nebulous.
