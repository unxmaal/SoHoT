context: Kublai's government after 1262 was a compromise between preserving Mongol interests in China
  and satisfying the demands of his Chinese subjects. He instituted the reforms proposed by his Chinese
  advisers by centralizing the bureaucracy, expanding the circulation of paper money, and maintaining
