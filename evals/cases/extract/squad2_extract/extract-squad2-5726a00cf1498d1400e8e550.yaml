  Question: Which entity developed the principles of European Union Law?'
context: 'The principles of European Union law are rules of law which have been developed by the European
  Court of Justice that constitute unwritten rules which are not expressly provided for in the treaties
  but which affect how European Union law is interpreted and applies. In formulating these principles,
  the courts have drawn on a variety of sources, including: public international law and legal doctrines
  and principles present in the legal systems of European Union member states and in the jurisprudence
  of the European Court of Human Rights. Accepted general principles of European Union Law include fundamental
  rights (see human rights), proportionality, legal certainty, equality before the law and subsidiarity.'
