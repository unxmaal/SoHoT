  Question: What type of hypersensitivity is associated with allergies?'
context: Hypersensitivity is an immune response that damages the body's own tissues. They are divided
  into four classes (Type I – IV) based on the mechanisms involved and the time course of the hypersensitive
  reaction. Type I hypersensitivity is an immediate or anaphylactic reaction, often associated with allergy.
  Symptoms can range from mild discomfort to death. Type I hypersensitivity is mediated by IgE, which
  triggers degranulation of mast cells and basophils when cross-linked by antigen. Type II hypersensitivity
  occurs when antibodies bind to antigens on the patient's own cells, marking them for destruction. This
  is also called antibody-dependent (or cytotoxic) hypersensitivity, and is mediated by IgG and IgM antibodies.
  Immune complexes (aggregations of antigens, complement proteins, and IgG and IgM antibodies) deposited
  in various tissues trigger Type III hypersensitivity reactions. Type IV hypersensitivity (also known
  as cell-mediated or delayed type hypersensitivity) usually takes between two and three days to develop.
  Type IV reactions are involved in many autoimmune and infectious diseases, but may also involve contact
  dermatitis (poison ivy). These reactions are mediated by T cells, monocytes, and macrophages.
assert:
  equals:
  - Type I
  - Type I hypersensitivity
