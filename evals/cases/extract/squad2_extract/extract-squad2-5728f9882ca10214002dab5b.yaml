context: Microorganisms or toxins that successfully enter an organism encounter the cells and mechanisms
  of the innate immune system. The innate response is usually triggered when microbes are identified by
  pattern recognition receptors, which recognize components that are conserved among broad groups of microorganisms,
  or when damaged, injured or stressed cells send out alarm signals, many of which (but not all) are recognized
  by the same receptors as those that recognize pathogens. Innate immune defenses are non-specific, meaning
  these systems respond to pathogens in a generic way. This system does not confer long-lasting immunity
  against a pathogen. The innate immune system is the dominant system of host defense in most organisms.
