  Question: Who was the speaker of the tribal council?'
context: The Iroquois sent runners to the manor of William Johnson in upstate New York. The British Superintendent
  for Indian Affairs in the New York region and beyond, Johnson was known to the Iroquois as Warraghiggey,
  meaning "He who does great things." He spoke their languages and had become a respected honorary member
  of the Iroquois Confederacy in the area. In 1746, Johnson was made a colonel of the Iroquois. Later
  he was commissioned as a colonel of the Western New York Militia. They met at Albany, New York with
  Governor Clinton and officials from some of the other American colonies. Mohawk Chief Hendrick, Speaker
  of their tribal council, insisted that the British abide by their obligations and block French expansion.
  When Clinton did not respond to his satisfaction, Chief Hendrick said that the "Covenant Chain", a long-standing
  friendly relationship between the Iroquois Confederacy and the British Crown, was broken.
