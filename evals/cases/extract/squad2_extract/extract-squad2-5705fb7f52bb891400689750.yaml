context: Traveling south on Interstate 5, the main gap to continued urbanization is Camp Pendleton. The
  cities and communities along Interstate 15 and Interstate 215 are so inter-related that Temecula and
  Murrieta have as much connection with the San Diego metropolitan area as they do with the Inland Empire.
  To the east, the United States Census Bureau considers the San Bernardino and Riverside County areas,
  Riverside-San Bernardino area as a separate metropolitan area from Los Angeles County. While many commute
  to L.A. and Orange Counties, there are some differences in development, as most of San Bernardino and
  Riverside Counties (the non-desert portions) were developed in the 1980s and 1990s. Newly developed
  exurbs formed in the Antelope Valley north of Los Angeles, the Victor Valley and the Coachella Valley
  with the Imperial Valley. Also, population growth was high in the Bakersfield-Kern County, Santa Maria
  and San Luis Obispo areas.
