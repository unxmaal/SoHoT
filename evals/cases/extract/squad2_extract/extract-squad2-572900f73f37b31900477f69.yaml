  Question: What is one of the first responses the immune system has to infection?'
context: Inflammation is one of the first responses of the immune system to infection. The symptoms of
  inflammation are redness, swelling, heat, and pain, which are caused by increased blood flow into tissue.
  Inflammation is produced by eicosanoids and cytokines, which are released by injured or infected cells.
  Eicosanoids include prostaglandins that produce fever and the dilation of blood vessels associated with
  inflammation, and leukotrienes that attract certain white blood cells (leukocytes). Common cytokines
  include interleukins that are responsible for communication between white blood cells; chemokines that
  promote chemotaxis; and interferons that have anti-viral effects, such as shutting down protein synthesis
  in the host cell. Growth factors and cytotoxic factors may also be released. These cytokines and other
  chemicals recruit immune cells to the site of infection and promote healing of any damaged tissue following
  the removal of pathogens.
