  Question: What are the tentacles of cydipped ctenophores are usually fringed with?'
context: 'The tentacles of cydippid ctenophores are typically fringed with tentilla ("little tentacles"),
  although a few genera have simple tentacles without these sidebranches. The tentacles and tentilla are
  densely covered with microscopic colloblasts that capture prey by sticking to it. Colloblasts are specialized
  mushroom-shaped cells in the outer layer of the epidermis, and have three main components: a domed head
  with vesicles (chambers) that contain adhesive; a stalk that anchors the cell in the lower layer of
  the epidermis or in the mesoglea; and a spiral thread that coils round the stalk and is attached to
  the head and to the root of the stalk. The function of the spiral thread is uncertain, but it may absorb
  stress when prey tries to escape, and thus prevent the collobast from being torn apart. In addition
  to colloblasts, members of the genus Haeckelia, which feed mainly on jellyfish, incorporate their victims''
  stinging nematocytes into their own tentacles – some cnidaria-eating nudibranchs similarly incorporate
  nematocytes into their bodies for defense. The tentilla of Euplokamis differ significantly from those
  of other cydippids: they contain striated muscle, a cell type otherwise unknown in the phylum Ctenophora;
  and they are coiled when relaxed, while the tentilla of all other known ctenophores elongate when relaxed.
  Euplokamis'' tentilla have three types of movement that are used in capturing prey: they may flick out
  very quickly (in 40 to 60 milliseconds); they can wriggle, which may lure prey by behaving like small
  planktonic worms; and they coil round prey. The unique flicking is an uncoiling movement powered by
  contraction of the striated muscle. The wriggling motion is produced by smooth muscles, but of a highly
  specialized type. Coiling around prey is accomplished largely by the return of the tentilla to their
  inactive state, but the coils may be tightened by smooth muscle.'
