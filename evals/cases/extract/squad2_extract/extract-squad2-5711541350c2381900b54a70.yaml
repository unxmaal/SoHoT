  Question: What nationality was Arthur Woolf?'
context: A method to lessen the magnitude of this heating and cooling was invented in 1804 by British
  engineer Arthur Woolf, who patented his Woolf high-pressure compound engine in 1805. In the compound
  engine, high-pressure steam from the boiler expands in a high-pressure (HP) cylinder and then enters
  one or more subsequent lower-pressure (LP) cylinders. The complete expansion of the steam now occurs
  across multiple cylinders and as less expansion now occurs in each cylinder less heat is lost by the
  steam in each. This reduces the magnitude of cylinder heating and cooling, increasing the efficiency
  of the engine. By staging the expansion in multiple cylinders, torque variability can be reduced. To
  derive equal work from lower-pressure steam requires a larger cylinder volume as this steam occupies
  a greater volume. Therefore, the bore, and often the stroke, are increased in low-pressure cylinders
  resulting in larger cylinders.
