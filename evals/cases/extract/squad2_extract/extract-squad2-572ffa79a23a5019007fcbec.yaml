  Question: Microplates squeezing and rotating created the features of what?'
context: 'In southern Europe, the stage was set in the Triassic Period of the Mesozoic Era, with the opening
  of the Tethys Ocean, between the Eurasian and African tectonic plates, between about 240 MBP and 220
  MBP (million years before present). The present Mediterranean Sea descends from this somewhat larger
  Tethys sea. At about 180 MBP, in the Jurassic Period, the two plates reversed direction and began to
  compress the Tethys floor, causing it to be subducted under Eurasia and pushing up the edge of the latter
  plate in the Alpine Orogeny of the Oligocene and Miocene Periods. Several microplates were caught in
  the squeeze and rotated or were pushed laterally, generating the individual features of Mediterranean
  geography: Iberia pushed up the Pyrenees; Italy, the Alps, and Anatolia, moving west, the mountains
  of Greece and the islands. The compression and orogeny continue today, as shown by the ongoing raising
  of the mountains a small amount each year and the active volcanoes.'
