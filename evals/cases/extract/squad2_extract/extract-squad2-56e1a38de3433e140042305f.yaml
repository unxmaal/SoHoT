  Question: In what unit is the size of the input measured?'
context: To measure the difficulty of solving a computational problem, one may wish to see how much time
  the best algorithm requires to solve the problem. However, the running time may, in general, depend
  on the instance. In particular, larger instances will require more time to solve. Thus the time required
  to solve a problem (or the space required, or any measure of complexity) is calculated as a function
  of the size of the instance. This is usually taken to be the size of the input in bits. Complexity theory
  is interested in how algorithms scale with an increase in the input size. For instance, in the problem
  of finding whether a graph is connected, how much more time does it take to solve a problem for a graph
  with 2n vertices compared to the time taken for a graph with n vertices?
