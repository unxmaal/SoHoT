context: Prince Louis de Condé, along with his sons Daniel and Osias,[citation needed] arranged with Count
  Ludwig von Nassau-Saarbrücken to establish a Huguenot community in present-day Saarland in 1604. The
  Count supported mercantilism and welcomed technically skilled immigrants into his lands, regardless
  of their religion. The Condés established a thriving glass-making works, which provided wealth to the
  principality for many years. Other founding families created enterprises based on textiles and such
  traditional Huguenot occupations in France. The community and its congregation remain active to this
  day, with descendants of many of the founding families still living in the region. Some members of this
  community emigrated to the United States in the 1890s.
