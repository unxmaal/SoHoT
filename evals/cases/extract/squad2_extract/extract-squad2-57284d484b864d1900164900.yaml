  Question: During what decade did the campus start to look more modern?'
context: After the 1940s, the Gothic style on campus began to give way to modern styles. In 1955, Eero
  Saarinen was contracted to develop a second master plan, which led to the construction of buildings
  both north and south of the Midway, including the Laird Bell Law Quadrangle (a complex designed by Saarinen);
  a series of arts buildings; a building designed by Ludwig Mies van der Rohe for the university's School
  of Social Service Administration;, a building which is to become the home of the Harris School of Public
  Policy Studies by Edward Durrell Stone, and the Regenstein Library, the largest building on campus,
  a brutalist structure designed by Walter Netsch of the Chicago firm Skidmore, Owings & Merrill. Another
  master plan, designed in 1999 and updated in 2004, produced the Gerald Ratner Athletics Center (2003),
  the Max Palevsky Residential Commons (2001), South Campus Residence Hall and dining commons (2009),
  a new children's hospital, and other construction, expansions, and restorations. In 2011, the university
  completed the glass dome-shaped Joe and Rika Mansueto Library, which provides a grand reading room for
  the university library and prevents the need for an off-campus book depository.
