  Question: What type of treatment do civil disobedients usually receive?'
context: Some civil disobedience defendants choose to make a defiant speech, or a speech explaining their
  actions, in allocution. In U.S. v. Burgos-Andujar, a defendant who was involved in a movement to stop
  military exercises by trespassing on U.S. Navy property argued to the court in allocution that "the
  ones who are violating the greater law are the members of the Navy". As a result, the judge increased
  her sentence from 40 to 60 days. This action was upheld because, according to the U.S. Court of Appeals
  for the First Circuit, her statement suggested a lack of remorse, an attempt to avoid responsibility
  for her actions, and even a likelihood of repeating her illegal actions. Some of the other allocution
  speeches given by the protesters complained about mistreatment from government officials.
