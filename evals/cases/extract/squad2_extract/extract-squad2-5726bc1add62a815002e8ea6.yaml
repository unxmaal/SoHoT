  Question: Which articles of the Free Movement of Workers Regulation set out the primary provisions on
  equal treatment of workers?'
context: The Free Movement of Workers Regulation articles 1 to 7 set out the main provisions on equal
  treatment of workers. First, articles 1 to 4 generally require that workers can take up employment,
  conclude contracts, and not suffer discrimination compared to nationals of the member state. In a famous
  case, the Belgian Football Association v Bosman, a Belgian footballer named Jean-Marc Bosman claimed
  that he should be able to transfer from R.F.C. de Liège to USL Dunkerque when his contract finished,
  regardless of whether Dunkerque could afford to pay Liège the habitual transfer fees. The Court of Justice
  held "the transfer rules constitute[d] an obstacle to free movement" and were unlawful unless they could
  be justified in the public interest, but this was unlikely. In Groener v Minister for Education the
  Court of Justice accepted that a requirement to speak Gaelic to teach in a Dublin design college could
  be justified as part of the public policy of promoting the Irish language, but only if the measure was
  not disproportionate. By contrast in Angonese v Cassa di Risparmio di Bolzano SpA a bank in Bolzano,
  Italy, was not allowed to require Mr Angonese to have a bilingual certificate that could only be obtained
  in Bolzano. The Court of Justice, giving "horizontal" direct effect to TFEU article 45, reasoned that
  people from other countries would have little chance of acquiring the certificate, and because it was
  "impossible to submit proof of the required linguistic knowledge by any other means", the measure was
  disproportionate. Second, article 7(2) requires equal treatment in respect of tax. In Finanzamt Köln
  Altstadt v Schumacker the Court of Justice held that it contravened TFEU art 45 to deny tax benefits
  (e.g. for married couples, and social insurance expense deductions) to a man who worked in Germany,
  but was resident in Belgium when other German residents got the benefits. By contrast in Weigel v Finanzlandesdirektion
  für Vorarlberg the Court of Justice rejected Mr Weigel's claim that a re-registration charge upon bringing
  his car to Austria violated his right to free movement. Although the tax was "likely to have a negative
  bearing on the decision of migrant workers to exercise their right to freedom of movement", because
  the charge applied equally to Austrians, in absence of EU legislation on the matter it had to be regarded
  as justified. Third, people must receive equal treatment regarding "social advantages", although the
  Court has approved residential qualifying periods. In Hendrix v Employee Insurance Institute the Court
  of Justice held that a Dutch national was not entitled to continue receiving incapacity benefits when
  he moved to Belgium, because the benefit was "closely linked to the socio-economic situation" of the
  Netherlands. Conversely, in Geven v Land Nordrhein-Westfalen the Court of Justice held that a Dutch
  woman living in the Netherlands, but working between 3 and 14 hours a week in Germany, did not have
  a right to receive German child benefits, even though the wife of a man who worked full-time in Germany
  but was resident in Austria could. The general justifications for limiting free movement in TFEU article
  45(3) are "public policy, public security or public health", and there is also a general exception in
  article 45(4) for "employment in the public service".
assert:
  equals:
  - articles 1 to 7
