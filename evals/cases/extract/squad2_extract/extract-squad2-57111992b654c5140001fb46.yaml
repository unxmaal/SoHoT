  Question: What London neighborhood attracted Huguenot refugees?'
context: The French Protestant Church of London was established by Royal Charter in 1550. It is now located
  at Soho Square. Huguenot refugees flocked to Shoreditch, London. They established a major weaving industry
  in and around Spitalfields (see Petticoat Lane and the Tenterground) in East London. In Wandsworth,
  their gardening skills benefited the Battersea market gardens. The Old Truman Brewery, then known as
  the Black Eagle Brewery, was founded in 1724. The flight of Huguenot refugees from Tours, France drew
  off most of the workers of its great silk mills which they had built.[citation needed] Some of these
  immigrants moved to Norwich, which had accommodated an earlier settlement of Walloon weavers. The French
  added to the existing immigrant population, then comprising about a third of the population of the city.
