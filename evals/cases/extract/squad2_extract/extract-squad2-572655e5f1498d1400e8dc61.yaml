  Question: What is the main component of the aboral organ?'
context: The largest single sensory feature is the aboral organ (at the opposite end from the mouth).
  Its main component is a statocyst, a balance sensor consisting of a statolith, a solid particle supported
  on four bundles of cilia, called "balancers", that sense its orientation. The statocyst is protected
  by a transparent dome made of long, immobile cilia. A ctenophore does not automatically try to keep
  the statolith resting equally on all the balancers. Instead its response is determined by the animal's
  "mood", in other words the overall state of the nervous system. For example, if a ctenophore with trailing
  tentacles captures prey, it will often put some comb rows into reverse, spinning the mouth towards the
  prey.
