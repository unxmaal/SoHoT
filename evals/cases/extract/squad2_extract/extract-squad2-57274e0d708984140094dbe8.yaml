  Question: What kind of contract is given when the contractor is given a performance specification and
  must undertake the project from design to construction, while adhering to the performance specifications?'
context: The modern trend in design is toward integration of previously separated specialties, especially
  among large firms. In the past, architects, interior designers, engineers, developers, construction
  managers, and general contractors were more likely to be entirely separate companies, even in the larger
  firms. Presently, a firm that is nominally an "architecture" or "construction management" firm may have
  experts from all related fields as employees, or to have an associated company that provides each necessary
  skill. Thus, each such firm may offer itself as "one-stop shopping" for a construction project, from
  beginning to end. This is designated as a "design build" contract where the contractor is given a performance
  specification and must undertake the project from design to construction, while adhering to the performance
  specifications.
