context: Other evidence of the Walloons and Huguenots in Canterbury includes a block of houses in Turnagain
  Lane, where weavers' windows survive on the top floor, as many Huguenots worked as weavers. The Weavers,
  a half-timbered house by the river, was the site of a weaving school from the late 16th century to about
  1830. (It has been adapted as a restaurant—see illustration above. The house derives its name from a
  weaving school which was moved there in the last years of the 19th century, reviving an earlier use.)
  Others refugees practised the variety of occupations necessary to sustain the community as distinct
  from the indigenous population. Such economic separation was the condition of the refugees' initial
  acceptance in the City. They also settled elsewhere in Kent, particularly Sandwich, Faversham and Maidstone—towns
  in which there used to be refugee churches.
