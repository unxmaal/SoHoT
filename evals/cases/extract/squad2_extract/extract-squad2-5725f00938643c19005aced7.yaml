context: The neighborhood includes Kearney Boulevard, named after early 20th century entrepreneur and
  millionaire M. Theo Kearney, which extends from Fresno Street in Southwest Fresno about 20 mi (32 km)
  west to Kerman, California. A small, two-lane rural road for most of its length, Kearney Boulevard is
  lined with tall palm trees. The roughly half-mile stretch of Kearney Boulevard between Fresno Street
  and Thorne Ave was at one time the preferred neighborhood for Fresno's elite African-American families.
  Another section, Brookhaven, on the southern edge of the West Side south of Jensen and west of Elm,
  was given the name by the Fresno City Council in an effort to revitalize the neighborhood's image. The
  isolated subdivision was for years known as the "Dogg Pound" in reference to a local gang, and as of
  late 2008 was still known for high levels of violent crime.
