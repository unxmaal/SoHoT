  Question: How long has the concept of legal certainty been recognized as one of the general principles
  by the EU law?'
context: The concept of legal certainty is recognised one of the general principles of European Union
  law by the European Court of Justice since the 1960s. It is an important general principle of international
  law and public law, which predates European Union law. As a general principle in European Union law
  it means that the law must be certain, in that it is clear and precise, and its legal implications foreseeable,
  specially when applied to financial obligations. The adoption of laws which will have legal effect in
  the European Union must have a proper legal basis. Legislation in member states which implements European
  Union law must be worded so that it is clearly understandable by those who are subject to the law. In
  European Union law the general principle of legal certainty prohibits Ex post facto laws, i.e. laws
  should not take effect before they are published. The doctrine of legitimate expectation, which has
  its roots in the principles of legal certainty and good faith, is also a central element of the general
  principle of legal certainty in European Union law. The legitimate expectation doctrine holds that and
  that "those who act in good faith on the basis of law as it is or seems to be should not be frustrated
  in their expectations".
