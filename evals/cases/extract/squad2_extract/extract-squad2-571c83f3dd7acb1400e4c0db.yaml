  Question: In dioxygen how are the two oxygen atoms bonded together?'
context: In this dioxygen, the two oxygen atoms are chemically bonded to each other. The bond can be variously
  described based on level of theory, but is reasonably and simply described as a covalent double bond
  that results from the filling of molecular orbitals formed from the atomic orbitals of the individual
  oxygen atoms, the filling of which results in a bond order of two. More specifically, the double bond
  is the result of sequential, low-to-high energy, or Aufbau, filling of orbitals, and the resulting cancellation
  of contributions from the 2s electrons, after sequential filling of the low σ and σ* orbitals; σ overlap
  of the two atomic 2p orbitals that lie along the O-O molecular axis and π overlap of two pairs of atomic
  2p orbitals perpendicular to the O-O molecular axis, and then cancellation of contributions from the
  remaining two of the six 2p electrons after their partial filling of the lowest π and π* orbitals.
assert:
  equals:
  - chemically
  - a covalent double bond
