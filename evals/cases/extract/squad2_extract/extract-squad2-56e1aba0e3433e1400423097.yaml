  Question: What is the most commonplace model utilized in complexity theory?'
context: A Turing machine is a mathematical model of a general computing machine. It is a theoretical
  device that manipulates symbols contained on a strip of tape. Turing machines are not intended as a
  practical computing technology, but rather as a thought experiment representing a computing machine—anything
  from an advanced supercomputer to a mathematician with a pencil and paper. It is believed that if a
  problem can be solved by an algorithm, there exists a Turing machine that solves the problem. Indeed,
  this is the statement of the Church–Turing thesis. Furthermore, it is known that everything that can
  be computed on other models of computation known to us today, such as a RAM machine, Conway's Game of
  Life, cellular automata or any programming language can be computed on a Turing machine. Since Turing
  machines are easy to analyze mathematically, and are believed to be as powerful as any other model of
  computation, the Turing machine is the most commonly used model in complexity theory.
