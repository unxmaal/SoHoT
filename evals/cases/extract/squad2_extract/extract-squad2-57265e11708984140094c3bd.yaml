  other countries. Additionally, its own member nations were divided. Saudi Arabia, trying to recover
  market share, increased production, pushing prices down, shrinking or eliminating profits for high-cost
  producers. The world price, which had peaked during the 1979 energy crisis at nearly $40 per barrel,
  decreased during the 1980s to less than $10 per barrel. Adjusted for inflation, oil briefly fell back
  to pre-1973 levels. This "sale" price was a windfall for oil-importing nations, both developing and
