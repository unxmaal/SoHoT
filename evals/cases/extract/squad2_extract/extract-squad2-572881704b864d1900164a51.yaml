  Question: How did the Yuan come to have the 4 schools of medicine?'
context: The Chinese medical tradition of the Yuan had "Four Great Schools" that the Yuan inherited from
  the Jin dynasty. All four schools were based on the same intellectual foundation, but advocated different
  theoretical approaches toward medicine. Under the Mongols, the practice of Chinese medicine spread to
  other parts of the empire. Chinese physicians were brought along military campaigns by the Mongols as
  they expanded towards the west. Chinese medical techniques such as acupuncture, moxibustion, pulse diagnosis,
  and various herbal drugs and elixirs were transmitted westward to the Middle East and the rest of the
  empire. Several medical advances were made in the Yuan period. The physician Wei Yilin (1277–1347) invented
  a suspension method for reducing dislocated joints, which he performed using anesthetics. The Mongol
  physician Hu Sihui described the importance of a healthy diet in a 1330 medical treatise.
