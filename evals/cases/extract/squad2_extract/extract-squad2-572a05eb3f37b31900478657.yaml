  Question: Policies which reduce the inequality associated effects of unemployment support what type
  of growth?'
context: 2013 Economics Nobel prize winner Robert J. Shiller said that rising inequality in the United
  States and elsewhere is the most important problem. Increasing inequality harms economic growth. High
  and persistent unemployment, in which inequality increases, has a negative effect on subsequent long-run
  economic growth. Unemployment can harm growth not only because it is a waste of resources, but also
  because it generates redistributive pressures and subsequent distortions, drives people to poverty,
  constrains liquidity limiting labor mobility, and erodes self-esteem promoting social dislocation, unrest
  and conflict. Policies aiming at controlling unemployment and in particular at reducing its inequality-associated
  effects support economic growth.
