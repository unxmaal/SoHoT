  Question: What is the Proto-Germanic adoption of the Gaulish name of the Rhine?'
context: The variant forms of the name of the Rhine in modern languages are all derived from the Gaulish
  name Rēnos, which was adapted in Roman-era geography (1st century BC) as Greek Ῥῆνος (Rhēnos), Latin
  Rhenus.[note 3] The spelling with Rh- in English Rhine as well as in German Rhein and French Rhin is
  due to the influence of Greek orthography, while the vocalisation -i- is due to the Proto-Germanic adoption
  of the Gaulish name as *Rīnaz, via Old Frankish giving Old English Rín, Old High German Rīn, Dutch Rijn
  (formerly also spelled Rhijn)). The diphthong in modern German Rhein (also adopted in Romansh Rein,
  Rain) is a Central German development of the early modern period, the Alemannic name Rī(n) retaining
  the older vocalism,[note 4] as does Ripuarian Rhing, while Palatine has diphthongized Rhei, Rhoi. Spanish
  is with French in adopting the Germanic vocalism Rin-, while Italian, Occitan and Portuguese retain
  the Latin Ren-.
