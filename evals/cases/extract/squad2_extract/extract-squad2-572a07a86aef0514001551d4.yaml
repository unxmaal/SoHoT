  is income inequality. Creating an index of "Health and Social Problems" from nine factors, authors Richard
  Wilkinson and Kate Pickett found health and social problems "more common in countries with bigger income
  inequalities", and more common among states in the US with larger income inequalities. Other studies
  have confirmed this relationship. The UNICEF index of "child well-being in rich countries", studying
  40 indicators in 22 countries, correlates with greater equality but not per capita income.
