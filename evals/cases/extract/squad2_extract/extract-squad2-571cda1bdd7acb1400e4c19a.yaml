  Question: What type of organization would need large quantities of pure oxygen?'
context: Oxygen storage methods include high pressure oxygen tanks, cryogenics and chemical compounds.
  For reasons of economy, oxygen is often transported in bulk as a liquid in specially insulated tankers,
  since one liter of liquefied oxygen is equivalent to 840 liters of gaseous oxygen at atmospheric pressure
  and 20 °C (68 °F). Such tankers are used to refill bulk liquid oxygen storage containers, which stand
  outside hospitals and other institutions with a need for large volumes of pure oxygen gas. Liquid oxygen
  is passed through heat exchangers, which convert the cryogenic liquid into gas before it enters the
  building. Oxygen is also stored and shipped in smaller cylinders containing the compressed gas; a form
  that is useful in certain portable medical applications and oxy-fuel welding and cutting.
