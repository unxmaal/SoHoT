  Question: What are the small tentacles on Cydippids called?'
context: Almost all ctenophores are predators, taking prey ranging from microscopic larvae and rotifers
  to the adults of small crustaceans; the exceptions are juveniles of two species, which live as parasites
  on the salps on which adults of their species feed. In favorable circumstances, ctenophores can eat
  ten times their own weight in a day. Only 100–150 species have been validated, and possibly another
  25 have not been fully described and named. The textbook examples are cydippids with egg-shaped bodies
  and a pair of retractable tentacles fringed with tentilla ("little tentacles") that are covered with
  colloblasts, sticky cells that capture prey. The phylum has a wide range of body forms, including the
  flattened, deep-sea platyctenids, in which the adults of most species lack combs, and the coastal beroids,
  which lack tentacles and prey on other ctenophores by using huge mouths armed with groups of large,
  stiffened cilia that act as teeth. These variations enable different species to build huge populations
  in the same area, because they specialize in different types of prey, which they capture by as wide
  a range of methods as spiders use.
assert:
  equals:
  - tentilla
