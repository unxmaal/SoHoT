context: By July 1944, the Red Army was deep into Polish territory and pursuing the Germans toward Warsaw.
  Knowing that Stalin was hostile to the idea of an independent Poland, the Polish government-in-exile
  in London gave orders to the underground Home Army (AK) to try to seize control of Warsaw from the Germans
  before the Red Army arrived. Thus, on 1 August 1944, as the Red Army was nearing the city, the Warsaw
  Uprising began. The armed struggle, planned to last 48 hours, was partially successful, however it went
  on for 63 days. Eventually the Home Army fighters and civilians assisting them were forced to capitulate.
