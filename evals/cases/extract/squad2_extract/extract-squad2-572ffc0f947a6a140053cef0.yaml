context: Through stream capture, the Rhine extended its watershed southward. By the Pliocene period, the
  Rhine had captured streams down to the Vosges Mountains, including the Mosel, the Main and the Neckar.
  The northern Alps were then drained by the Rhone. By the early Pleistocene period, the Rhine had captured
  most of its current Alpine watershed from the Rhône, including the Aar. Since that time, the Rhine has
  added the watershed above Lake Constance (Vorderrhein, Hinterrhein, Alpenrhein; captured from the Rhône),
  the upper reaches of the Main, beyond Schweinfurt and the Vosges Mountains, captured from the Meuse,
  to its watershed.
