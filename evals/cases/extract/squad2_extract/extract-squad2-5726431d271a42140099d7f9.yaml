  Question: What was done to counteract the overpopulation of mnemiopsis in The Black Sea?'
context: Ctenophores may be abundant during the summer months in some coastal locations, but in other
  places they are uncommon and difficult to find. In bays where they occur in very high numbers, predation
  by ctenophores may control the populations of small zooplanktonic organisms such as copepods, which
  might otherwise wipe out the phytoplankton (planktonic plants), which are a vital part of marine food
  chains. One ctenophore, Mnemiopsis, has accidentally been introduced into the Black Sea, where it is
  blamed for causing fish stocks to collapse by eating both fish larvae and organisms that would otherwise
  have fed the fish. The situation was aggravated by other factors, such as over-fishing and long-term
  environmental changes that promoted the growth of the Mnemiopsis population. The later accidental introduction
  of Beroe helped to mitigate the problem, as Beroe preys on other ctenophores.
