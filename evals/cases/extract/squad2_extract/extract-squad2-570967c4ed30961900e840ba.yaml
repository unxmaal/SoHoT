context: When Sky Digital was launched in 1998 the new service used the Astra 2A satellite which was located
  at the 28.5°E orbital position, unlike the analogue service which was broadcast from 19.2°E. This was
  subsequently followed by more Astra satellites as well as Eutelsat's Eurobird 1 (now Eutelsat 33C) at
  28.5°E), enabled the company to launch a new all-digital service, Sky, with the potential to carry hundreds
  of television and radio channels. The old position was shared with broadcasters from several European
  countries, while the new position at 28.5°E came to be used almost exclusively for channels that broadcast
  to the United Kingdom.
