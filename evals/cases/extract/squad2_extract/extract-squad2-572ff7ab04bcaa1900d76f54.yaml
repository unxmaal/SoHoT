  Question: What is the English translation of Het Scheur?'
context: 'The shape of the Rhine delta is determined by two bifurcations: first, at Millingen aan de Rijn,
  the Rhine splits into Waal and Pannerdens Kanaal, which changes its name to Nederrijn at Angeren, and
  second near Arnhem, the IJssel branches off from the Nederrijn. This creates three main flows, two of
  which change names rather often. The largest and southern main branch begins as Waal and continues as
  Boven Merwede ("Upper Merwede"), Beneden Merwede ("Lower Merwede"), Noord River ("North River"), Nieuwe
  Maas ("New Meuse"), Het Scheur ("the Rip") and Nieuwe Waterweg ("New Waterway"). The middle flow begins
  as Nederrijn, then changes into Lek, then joins the Noord, thereby forming Nieuwe Maas. The northern
  flow keeps the name IJssel until it flows into Lake IJsselmeer. Three more flows carry significant amounts
  of water: the Nieuwe Merwede ("New Merwede"), which branches off from the southern branch where it changes
  from Boven to Beneden Merwede; the Oude Maas ("Old Meuse"), which branches off from the southern branch
  where it changes from Beneden Merwede into Noord, and Dordtse Kil, which branches off from Oude Maas.'
