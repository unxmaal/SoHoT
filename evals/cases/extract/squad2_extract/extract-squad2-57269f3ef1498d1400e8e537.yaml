  Question: How much money was Francovich allowed to claim from the Italian goverment in damages?'
context: Fourth, national courts have a duty to interpret domestic law "as far as possible in the light
  of the wording and purpose of the directive". Textbooks (though not the Court itself) often called this
  "indirect effect". In Marleasing SA v La Comercial SA the Court of Justice held that a Spanish Court
  had to interpret its general Civil Code provisions, on contracts lacking cause or defrauding creditors,
  to conform with the First Company Law Directive article 11, that required incorporations would only
  be nullified for a fixed list of reasons. The Court of Justice quickly acknowledged that the duty of
  interpretation cannot contradict plain words in a national statute. But, fifth, if a member state has
  failed to implement a Directive, a citizen may not be able to bring claims against other non-state parties,
  but can sue the member state itself for failure to implement the law. So, in Francovich v Italy, the
  Italian government had failed to set up an insurance fund for employees to claim unpaid wages if their
  employers had gone insolvent, as the Insolvency Protection Directive required. Francovich, the former
  employee of a bankrupt Venetian firm, was therefore allowed to claim 6 million Lira from the Italian
  government in damages for his loss. The Court of Justice held that if a Directive would confer identifiable
  rights on individuals, and there is a causal link between a member state's violation of EU and a claimant's
  loss, damages must be paid. The fact that the incompatible law is an Act of Parliament is no defence.
assert:
  equals:
  - 6 million Lira
