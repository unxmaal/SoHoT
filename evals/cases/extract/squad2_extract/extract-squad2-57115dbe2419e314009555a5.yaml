  Question: What did Watt add to the steam engine in 1788?'
context: The centrifugal governor was adopted by James Watt for use on a steam engine in 1788 after Watt’s
  partner Boulton saw one at a flour mill Boulton & Watt were building. The governor could not actually
  hold a set speed, because it would assume a new constant speed in response to load changes. The governor
  was able to handle smaller variations such as those caused by fluctuating heat load to the boiler. Also,
  there was a tendency for oscillation whenever there was a speed change. As a consequence, engines equipped
  only with this governor were not suitable for operations requiring constant speed, such as cotton spinning.
  The governor was improved over time and coupled with variable steam cut off, good speed control in response
  to changes in load was attainable near the end of the 19th century.
