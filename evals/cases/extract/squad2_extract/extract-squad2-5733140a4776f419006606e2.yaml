  Question: When did Warsaw become the capital of the Kingdom of Poland?'
context: The first historical reference to Warsaw dates back to the year 1313, at a time when Kraków served
  as the Polish capital city. Due to its central location between the Polish–Lithuanian Commonwealth's
  capitals of Kraków and Vilnius, Warsaw became the capital of the Commonwealth and of the Crown of the
  Kingdom of Poland when King Sigismund III Vasa moved his court from Kraków to Warsaw in 1596. After
  the Third Partition of Poland in 1795, Warsaw was incorporated into the Kingdom of Prussia. In 1806
  during the Napoleonic Wars, the city became the official capital of the Grand Duchy of Warsaw, a puppet
  state of the First French Empire established by Napoleon Bonaparte. In accordance with the decisions
  of the Congress of Vienna, the Russian Empire annexed Warsaw in 1815 and it became part of the "Congress
  Kingdom". Only in 1918 did it regain independence from the foreign rule and emerge as a new capital
  of the independent Republic of Poland. The German invasion in 1939, the massacre of the Jewish population
  and deportations to concentration camps led to the uprising in the Warsaw ghetto in 1943 and to the
  major and devastating Warsaw Uprising between August and October 1944. Warsaw gained the title of the
  "Phoenix City" because it has survived many wars, conflicts and invasions throughout its long history.
  Most notably, the city required painstaking rebuilding after the extensive damage it suffered in World
  War II, which destroyed 85% of its buildings. On 9 November 1940, the city was awarded Poland's highest
  military decoration for heroism, the Virtuti Militari, during the Siege of Warsaw (1939).
