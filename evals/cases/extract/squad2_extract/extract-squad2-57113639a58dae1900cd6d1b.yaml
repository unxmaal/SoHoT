  Question: What sort of engines utilized the Yarrow-Schlick-Tweedy balancing system?'
context: It is a logical extension of the compound engine (described above) to split the expansion into
  yet more stages to increase efficiency. The result is the multiple expansion engine. Such engines use
  either three or four expansion stages and are known as triple and quadruple expansion engines respectively.
  These engines use a series of cylinders of progressively increasing diameter. These cylinders are designed
  to divide the work into equal shares for each expansion stage. As with the double expansion engine,
  if space is at a premium, then two smaller cylinders may be used for the low-pressure stage. Multiple
  expansion engines typically had the cylinders arranged inline, but various other formations were used.
  In the late 19th century, the Yarrow-Schlick-Tweedy balancing 'system' was used on some marine triple
  expansion engines. Y-S-T engines divided the low-pressure expansion stages between two cylinders, one
  at each end of the engine. This allowed the crankshaft to be better balanced, resulting in a smoother,
  faster-responding engine which ran with less vibration. This made the 4-cylinder triple-expansion engine
  popular with large passenger liners (such as the Olympic class), but this was ultimately replaced by
  the virtually vibration-free turbine engine.[citation needed]
