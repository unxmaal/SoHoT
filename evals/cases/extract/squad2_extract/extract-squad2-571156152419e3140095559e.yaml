  Question: What was the ideal duty of a Newcomen engine?'
context: The historical measure of a steam engine's energy efficiency was its "duty". The concept of duty
  was first introduced by Watt in order to illustrate how much more efficient his engines were over the
  earlier Newcomen designs. Duty is the number of foot-pounds of work delivered by burning one bushel
  (94 pounds) of coal. The best examples of Newcomen designs had a duty of about 7 million, but most were
  closer to 5 million. Watt's original low-pressure designs were able to deliver duty as high as 25 million,
  but averaged about 17. This was a three-fold improvement over the average Newcomen design. Early Watt
  engines equipped with high-pressure steam improved this to 65 million.
