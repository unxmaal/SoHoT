  requirements come from malum prohibitum considerations, or things that are a matter of custom or expectation,
  such as isolating businesses to a business district and residences to a residential district. An attorney
  may seek changes or exemptions in the law that governs the land where the building will be built, either
  by arguing that a rule is inapplicable (the bridge design will not cause a collapse), or that the custom
  is no longer needed (acceptance of live-work spaces has grown in the community).
