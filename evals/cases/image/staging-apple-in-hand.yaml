id: staging-apple-in-hand
modality: image
prompt: A hand holding a single green apple, close-up, plain background.
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      apple: an apple
      hand: a hand
    require:
    - type: held
      object: apple
      by: hand
    - type: count
      object: apple
      n: 1
