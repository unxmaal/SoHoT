# The one image ability the pixel checks are blind to. A sign reading OPEM
# decodes, is the right size, and has plenty of variance: every other check in
# the suite calls it a good image. `text` OCRs the result with Apple's Vision
# framework and reports a character error rate, so a model that almost renders
# text is distinguishable from one that renders noise.
id: text-render
modality: image
prompt: A wooden shop sign hanging on a brick wall with the word "OPEN" carved into it in clean serif letters.
params:
  width: 512
  height: 512
  seed: 42
assert:
  text: OPEN
  # Vision read 10 planted clean renders of OPEN with 0 errors (#730); any value under 0.25 allows none.
  max_cer: 0.1
