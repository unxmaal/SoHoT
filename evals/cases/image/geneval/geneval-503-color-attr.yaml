id: geneval-503-color-attr
modality: image
prompt: a photo of a blue cow and a black computer keyboard
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      cow: a cow
      computer_keyboard: a computer keyboard
    require:
    - type: count
      object: cow
      min: 1
    - type: count
      object: computer_keyboard
      min: 1
    - type: attribute
      object: cow
      is: a blue cow
      not:
      - a red cow
      - a orange cow
      - a yellow cow
      - a green cow
      - a purple cow
      - a pink cow
      - a brown cow
      - a black cow
      - a white cow
    - type: attribute
      object: computer_keyboard
      is: a black computer keyboard
      not:
      - a red computer keyboard
      - a orange computer keyboard
      - a yellow computer keyboard
      - a green computer keyboard
      - a blue computer keyboard
      - a purple computer keyboard
      - a pink computer keyboard
      - a brown computer keyboard
      - a white computer keyboard
