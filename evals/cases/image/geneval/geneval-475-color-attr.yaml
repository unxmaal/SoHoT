id: geneval-475-color-attr
modality: image
prompt: a photo of a brown hot dog and a purple pizza
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      hot_dog: a hot dog
      pizza: a pizza
    require:
    - type: count
      object: hot_dog
      min: 1
    - type: count
      object: pizza
      min: 1
    - type: attribute
      object: hot_dog
      is: a brown hot dog
      not:
      - a red hot dog
      - a orange hot dog
      - a yellow hot dog
      - a green hot dog
      - a blue hot dog
      - a purple hot dog
      - a pink hot dog
      - a black hot dog
      - a white hot dog
    - type: attribute
      object: pizza
      is: a purple pizza
      not:
      - a red pizza
      - a orange pizza
      - a yellow pizza
      - a green pizza
      - a blue pizza
      - a pink pizza
      - a brown pizza
      - a black pizza
      - a white pizza
