id: geneval-541-color-attr
modality: image
prompt: a photo of a yellow bird and a black motorcycle
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      bird: a bird
      motorcycle: a motorcycle
    require:
    - type: count
      object: bird
      min: 1
    - type: count
      object: motorcycle
      min: 1
    - type: attribute
      object: bird
      is: a yellow bird
      not:
      - a red bird
      - a orange bird
      - a green bird
      - a blue bird
      - a purple bird
      - a pink bird
      - a brown bird
      - a black bird
      - a white bird
    - type: attribute
      object: motorcycle
      is: a black motorcycle
      not:
      - a red motorcycle
      - a orange motorcycle
      - a yellow motorcycle
      - a green motorcycle
      - a blue motorcycle
      - a purple motorcycle
      - a pink motorcycle
      - a brown motorcycle
      - a white motorcycle
