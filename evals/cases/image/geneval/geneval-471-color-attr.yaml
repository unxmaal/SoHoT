id: geneval-471-color-attr
modality: image
prompt: a photo of a green teddy bear and a brown kite
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      teddy_bear: a teddy bear
      kite: a kite
    require:
    - type: count
      object: teddy_bear
      min: 1
    - type: count
      object: kite
      min: 1
    - type: attribute
      object: teddy_bear
      is: a green teddy bear
      not:
      - a red teddy bear
      - a orange teddy bear
      - a yellow teddy bear
      - a blue teddy bear
      - a purple teddy bear
      - a pink teddy bear
      - a brown teddy bear
      - a black teddy bear
      - a white teddy bear
    - type: attribute
      object: kite
      is: a brown kite
      not:
      - a red kite
      - a orange kite
      - a yellow kite
      - a green kite
      - a blue kite
      - a purple kite
      - a pink kite
      - a black kite
      - a white kite
