id: geneval-472-color-attr
modality: image
prompt: a photo of a yellow stop sign and a blue potted plant
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      stop_sign: a stop sign
      potted_plant: a potted plant
    require:
    - type: count
      object: stop_sign
      min: 1
    - type: count
      object: potted_plant
      min: 1
    - type: attribute
      object: stop_sign
      is: a yellow stop sign
      not:
      - a red stop sign
      - a orange stop sign
      - a green stop sign
      - a blue stop sign
      - a purple stop sign
      - a pink stop sign
      - a brown stop sign
      - a black stop sign
      - a white stop sign
    - type: attribute
      object: potted_plant
      is: a blue potted plant
      not:
      - a red potted plant
      - a orange potted plant
      - a yellow potted plant
      - a green potted plant
      - a purple potted plant
      - a pink potted plant
      - a brown potted plant
      - a black potted plant
      - a white potted plant
