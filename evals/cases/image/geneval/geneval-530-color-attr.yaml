id: geneval-530-color-attr
modality: image
prompt: a photo of a purple suitcase and an orange pizza
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      suitcase: a suitcase
      pizza: a pizza
    require:
    - type: count
      object: suitcase
      min: 1
    - type: count
      object: pizza
      min: 1
    - type: attribute
      object: suitcase
      is: a purple suitcase
      not:
      - a red suitcase
      - a orange suitcase
      - a yellow suitcase
      - a green suitcase
      - a blue suitcase
      - a pink suitcase
      - a brown suitcase
      - a black suitcase
      - a white suitcase
    - type: attribute
      object: pizza
      is: a orange pizza
      not:
      - a red pizza
      - a yellow pizza
      - a green pizza
      - a blue pizza
      - a purple pizza
      - a pink pizza
      - a brown pizza
      - a black pizza
      - a white pizza
