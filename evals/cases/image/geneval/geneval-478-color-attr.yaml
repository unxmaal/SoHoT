id: geneval-478-color-attr
modality: image
prompt: a photo of a black broccoli and a yellow cake
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      broccoli: a broccoli
      cake: a cake
    require:
    - type: count
      object: broccoli
      min: 1
    - type: count
      object: cake
      min: 1
    - type: attribute
      object: broccoli
      is: a black broccoli
      not:
      - a red broccoli
      - a orange broccoli
      - a yellow broccoli
      - a green broccoli
      - a blue broccoli
      - a purple broccoli
      - a pink broccoli
      - a brown broccoli
      - a white broccoli
    - type: attribute
      object: cake
      is: a yellow cake
      not:
      - a red cake
      - a orange cake
      - a green cake
      - a blue cake
      - a purple cake
      - a pink cake
      - a brown cake
      - a black cake
      - a white cake
