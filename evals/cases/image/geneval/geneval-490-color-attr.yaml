id: geneval-490-color-attr
modality: image
prompt: a photo of a blue handbag and a white cell phone
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      handbag: a handbag
      cell_phone: a cell phone
    require:
    - type: count
      object: handbag
      min: 1
    - type: count
      object: cell_phone
      min: 1
    - type: attribute
      object: handbag
      is: a blue handbag
      not:
      - a red handbag
      - a orange handbag
      - a yellow handbag
      - a green handbag
      - a purple handbag
      - a pink handbag
      - a brown handbag
      - a black handbag
      - a white handbag
    - type: attribute
      object: cell_phone
      is: a white cell phone
      not:
      - a red cell phone
      - a orange cell phone
      - a yellow cell phone
      - a green cell phone
      - a blue cell phone
      - a purple cell phone
      - a pink cell phone
      - a brown cell phone
      - a black cell phone
