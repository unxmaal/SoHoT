id: geneval-458-color-attr
modality: image
prompt: a photo of a purple parking meter and a red laptop
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      parking_meter: a parking meter
      laptop: a laptop
    require:
    - type: count
      object: parking_meter
      min: 1
    - type: count
      object: laptop
      min: 1
    - type: attribute
      object: parking_meter
      is: a purple parking meter
      not:
      - a red parking meter
      - a orange parking meter
      - a yellow parking meter
      - a green parking meter
      - a blue parking meter
      - a pink parking meter
      - a brown parking meter
      - a black parking meter
      - a white parking meter
    - type: attribute
      object: laptop
      is: a red laptop
      not:
      - a orange laptop
      - a yellow laptop
      - a green laptop
      - a blue laptop
      - a purple laptop
      - a pink laptop
      - a brown laptop
      - a black laptop
      - a white laptop
