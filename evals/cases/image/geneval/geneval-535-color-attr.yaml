id: geneval-535-color-attr
modality: image
prompt: a photo of a yellow handbag and a blue refrigerator
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      handbag: a handbag
      refrigerator: a refrigerator
    require:
    - type: count
      object: handbag
      min: 1
    - type: count
      object: refrigerator
      min: 1
    - type: attribute
      object: handbag
      is: a yellow handbag
      not:
      - a red handbag
      - a orange handbag
      - a green handbag
      - a blue handbag
      - a purple handbag
      - a pink handbag
      - a brown handbag
      - a black handbag
      - a white handbag
    - type: attribute
      object: refrigerator
      is: a blue refrigerator
      not:
      - a red refrigerator
      - a orange refrigerator
      - a yellow refrigerator
      - a green refrigerator
      - a purple refrigerator
      - a pink refrigerator
      - a brown refrigerator
      - a black refrigerator
      - a white refrigerator
