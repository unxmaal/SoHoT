      object: handbag
      min: 1
    - type: count
      object: carrot
      min: 1
    - type: attribute
      object: handbag
      is: a orange handbag
      not:
      - a red handbag
      - a yellow handbag
      - a green handbag
      - a blue handbag
      - a purple handbag
      - a pink handbag
      - a brown handbag
      - a black handbag
      - a white handbag
    - type: attribute
      object: carrot
      is: a green carrot
      not:
      - a red carrot
      - a orange carrot
      - a yellow carrot
      - a blue carrot
      - a purple carrot
      - a pink carrot
      - a brown carrot
      - a black carrot
      - a white carrot
