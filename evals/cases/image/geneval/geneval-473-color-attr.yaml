id: geneval-473-color-attr
modality: image
prompt: a photo of an orange snowboard and a green cat
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      snowboard: a snowboard
      cat: a cat
    require:
    - type: count
      object: snowboard
      min: 1
    - type: count
      object: cat
      min: 1
    - type: attribute
      object: snowboard
      is: a orange snowboard
      not:
      - a red snowboard
      - a yellow snowboard
      - a green snowboard
      - a blue snowboard
      - a purple snowboard
      - a pink snowboard
      - a brown snowboard
      - a black snowboard
      - a white snowboard
    - type: attribute
      object: cat
      is: a green cat
      not:
      - a red cat
      - a orange cat
      - a yellow cat
      - a blue cat
      - a purple cat
      - a pink cat
      - a brown cat
      - a black cat
      - a white cat
