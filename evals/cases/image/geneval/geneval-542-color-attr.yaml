id: geneval-542-color-attr
modality: image
prompt: a photo of a brown giraffe and a white stop sign
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      giraffe: a giraffe
      stop_sign: a stop sign
    require:
    - type: count
      object: giraffe
      min: 1
    - type: count
      object: stop_sign
      min: 1
    - type: attribute
      object: giraffe
      is: a brown giraffe
      not:
      - a red giraffe
      - a orange giraffe
      - a yellow giraffe
      - a green giraffe
      - a blue giraffe
      - a purple giraffe
      - a pink giraffe
      - a black giraffe
      - a white giraffe
    - type: attribute
      object: stop_sign
      is: a white stop sign
      not:
      - a red stop sign
      - a orange stop sign
      - a yellow stop sign
      - a green stop sign
      - a blue stop sign
      - a purple stop sign
      - a pink stop sign
      - a brown stop sign
      - a black stop sign
