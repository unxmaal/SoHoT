id: geneval-506-color-attr
modality: image
prompt: a photo of a purple computer keyboard and a blue scissors
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      computer_keyboard: a computer keyboard
      scissors: a scissors
    require:
    - type: count
      object: computer_keyboard
      min: 1
    - type: count
      object: scissors
      min: 1
    - type: attribute
      object: computer_keyboard
      is: a purple computer keyboard
      not:
      - a red computer keyboard
      - a orange computer keyboard
      - a yellow computer keyboard
      - a green computer keyboard
      - a blue computer keyboard
      - a pink computer keyboard
      - a brown computer keyboard
      - a black computer keyboard
      - a white computer keyboard
    - type: attribute
      object: scissors
      is: a blue scissors
      not:
      - a red scissors
      - a orange scissors
      - a yellow scissors
      - a green scissors
      - a purple scissors
      - a pink scissors
      - a brown scissors
      - a black scissors
      - a white scissors
