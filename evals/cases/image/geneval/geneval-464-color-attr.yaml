id: geneval-464-color-attr
modality: image
prompt: a photo of a purple dog and a black dining table
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      dog: a dog
      dining_table: a dining table
    require:
    - type: count
      object: dog
      min: 1
    - type: count
      object: dining_table
      min: 1
    - type: attribute
      object: dog
      is: a purple dog
      not:
      - a red dog
      - a orange dog
      - a yellow dog
      - a green dog
      - a blue dog
      - a pink dog
      - a brown dog
      - a black dog
      - a white dog
    - type: attribute
      object: dining_table
      is: a black dining table
      not:
      - a red dining table
      - a orange dining table
      - a yellow dining table
      - a green dining table
      - a blue dining table
      - a purple dining table
      - a pink dining table
      - a brown dining table
      - a white dining table
