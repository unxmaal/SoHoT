id: geneval-525-color-attr
modality: image
prompt: a photo of a brown dining table and a white suitcase
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      dining_table: a dining table
      suitcase: a suitcase
    require:
    - type: count
      object: dining_table
      min: 1
    - type: count
      object: suitcase
      min: 1
    - type: attribute
      object: dining_table
      is: a brown dining table
      not:
      - a red dining table
      - a orange dining table
      - a yellow dining table
      - a green dining table
      - a blue dining table
      - a purple dining table
      - a pink dining table
      - a black dining table
      - a white dining table
    - type: attribute
      object: suitcase
      is: a white suitcase
      not:
      - a red suitcase
      - a orange suitcase
      - a yellow suitcase
      - a green suitcase
      - a blue suitcase
      - a purple suitcase
      - a pink suitcase
      - a brown suitcase
      - a black suitcase
