id: geneval-481-color-attr
modality: image
prompt: a photo of a blue vase and a black banana
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      vase: a vase
      banana: a banana
    require:
    - type: count
      object: vase
      min: 1
    - type: count
      object: banana
      min: 1
    - type: attribute
      object: vase
      is: a blue vase
      not:
      - a red vase
      - a orange vase
      - a yellow vase
      - a green vase
      - a purple vase
      - a pink vase
      - a brown vase
      - a black vase
      - a white vase
    - type: attribute
      object: banana
      is: a black banana
      not:
      - a red banana
      - a orange banana
      - a yellow banana
      - a green banana
      - a blue banana
      - a purple banana
      - a pink banana
      - a brown banana
      - a white banana
