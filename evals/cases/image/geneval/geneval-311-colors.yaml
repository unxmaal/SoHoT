id: geneval-311-colors
modality: image
prompt: a photo of a green traffic light
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      traffic_light: a traffic light
    require:
    - type: count
      object: traffic_light
      min: 1
    - type: attribute
      object: traffic_light
      is: a green traffic light
      not:
      - a red traffic light
      - a orange traffic light
      - a yellow traffic light
      - a blue traffic light
      - a purple traffic light
      - a pink traffic light
      - a brown traffic light
      - a black traffic light
      - a white traffic light
