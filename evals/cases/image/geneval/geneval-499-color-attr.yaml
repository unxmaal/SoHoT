id: geneval-499-color-attr
modality: image
prompt: a photo of a white boat and an orange hot dog
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      boat: a boat
      hot_dog: a hot dog
    require:
    - type: count
      object: boat
      min: 1
    - type: count
      object: hot_dog
      min: 1
    - type: attribute
      object: boat
      is: a white boat
      not:
      - a red boat
      - a orange boat
      - a yellow boat
      - a green boat
      - a blue boat
      - a purple boat
      - a pink boat
      - a brown boat
      - a black boat
    - type: attribute
      object: hot_dog
      is: a orange hot dog
      not:
      - a red hot dog
      - a yellow hot dog
      - a green hot dog
      - a blue hot dog
      - a purple hot dog
      - a pink hot dog
      - a brown hot dog
      - a black hot dog
      - a white hot dog
