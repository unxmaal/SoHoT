id: geneval-514-color-attr
modality: image
prompt: a photo of a green cup and a yellow bowl
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      cup: a cup
      bowl: a bowl
    require:
    - type: count
      object: cup
      min: 1
    - type: count
      object: bowl
      min: 1
    - type: attribute
      object: cup
      is: a green cup
      not:
      - a red cup
      - a orange cup
      - a yellow cup
      - a blue cup
      - a purple cup
      - a pink cup
      - a brown cup
      - a black cup
      - a white cup
    - type: attribute
      object: bowl
      is: a yellow bowl
      not:
      - a red bowl
      - a orange bowl
      - a green bowl
      - a blue bowl
      - a purple bowl
      - a pink bowl
      - a brown bowl
      - a black bowl
      - a white bowl
