id: geneval-539-color-attr
modality: image
prompt: a photo of a pink dining table and a black sandwich
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      dining_table: a dining table
      sandwich: a sandwich
    require:
    - type: count
      object: dining_table
      min: 1
    - type: count
      object: sandwich
      min: 1
    - type: attribute
      object: dining_table
      is: a pink dining table
      not:
      - a red dining table
      - a orange dining table
      - a yellow dining table
      - a green dining table
      - a blue dining table
      - a purple dining table
      - a brown dining table
      - a black dining table
      - a white dining table
    - type: attribute
      object: sandwich
      is: a black sandwich
      not:
      - a red sandwich
      - a orange sandwich
      - a yellow sandwich
      - a green sandwich
      - a blue sandwich
      - a purple sandwich
      - a pink sandwich
      - a brown sandwich
      - a white sandwich
