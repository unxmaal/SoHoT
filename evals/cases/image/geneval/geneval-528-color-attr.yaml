id: geneval-528-color-attr
modality: image
prompt: a photo of an orange tennis racket and a yellow sports ball
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      tennis_racket: a tennis racket
      sports_ball: a sports ball
    require:
    - type: count
      object: tennis_racket
      min: 1
    - type: count
      object: sports_ball
      min: 1
    - type: attribute
      object: tennis_racket
      is: a orange tennis racket
      not:
      - a red tennis racket
      - a yellow tennis racket
      - a green tennis racket
      - a blue tennis racket
      - a purple tennis racket
      - a pink tennis racket
      - a brown tennis racket
      - a black tennis racket
      - a white tennis racket
    - type: attribute
      object: sports_ball
      is: a yellow sports ball
      not:
      - a red sports ball
      - a orange sports ball
      - a green sports ball
      - a blue sports ball
      - a purple sports ball
      - a pink sports ball
      - a brown sports ball
      - a black sports ball
      - a white sports ball
