id: geneval-453-color-attr
modality: image
prompt: a photo of a purple wine glass and a black apple
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      wine_glass: a wine glass
      apple: a apple
    require:
    - type: count
      object: wine_glass
      min: 1
    - type: count
      object: apple
      min: 1
    - type: attribute
      object: wine_glass
      is: a purple wine glass
      not:
      - a red wine glass
      - a orange wine glass
      - a yellow wine glass
      - a green wine glass
      - a blue wine glass
      - a pink wine glass
      - a brown wine glass
      - a black wine glass
      - a white wine glass
    - type: attribute
      object: apple
      is: a black apple
      not:
      - a red apple
      - a orange apple
      - a yellow apple
      - a green apple
      - a blue apple
      - a purple apple
      - a pink apple
      - a brown apple
      - a white apple
