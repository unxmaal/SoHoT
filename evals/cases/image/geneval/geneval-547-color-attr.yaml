id: geneval-547-color-attr
modality: image
prompt: a photo of a red cup and a pink handbag
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      cup: a cup
      handbag: a handbag
    require:
    - type: count
      object: cup
      min: 1
    - type: count
      object: handbag
      min: 1
    - type: attribute
      object: cup
      is: a red cup
      not:
      - a orange cup
      - a yellow cup
      - a green cup
      - a blue cup
      - a purple cup
      - a pink cup
      - a brown cup
      - a black cup
      - a white cup
    - type: attribute
      object: handbag
      is: a pink handbag
      not:
      - a red handbag
      - a orange handbag
      - a yellow handbag
      - a green handbag
      - a blue handbag
      - a purple handbag
      - a brown handbag
      - a black handbag
      - a white handbag
