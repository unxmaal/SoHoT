id: geneval-521-color-attr
modality: image
prompt: a photo of an orange handbag and a red car
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      handbag: a handbag
      car: a car
    require:
    - type: count
      object: handbag
      min: 1
    - type: count
      object: car
      min: 1
    - type: attribute
      object: handbag
      is: a orange handbag
      not:
      - a red handbag
      - a yellow handbag
      - a green handbag
      - a blue handbag
      - a purple handbag
      - a pink handbag
      - a brown handbag
      - a black handbag
      - a white handbag
    - type: attribute
      object: car
      is: a red car
      not:
      - a orange car
      - a yellow car
      - a green car
      - a blue car
      - a purple car
      - a pink car
      - a brown car
      - a black car
      - a white car
