id: geneval-517-color-attr
modality: image
prompt: a photo of an orange giraffe and a white baseball glove
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      giraffe: a giraffe
      baseball_glove: a baseball glove
    require:
    - type: count
      object: giraffe
      min: 1
    - type: count
      object: baseball_glove
      min: 1
    - type: attribute
      object: giraffe
      is: a orange giraffe
      not:
      - a red giraffe
      - a yellow giraffe
      - a green giraffe
      - a blue giraffe
      - a purple giraffe
      - a pink giraffe
      - a brown giraffe
      - a black giraffe
      - a white giraffe
    - type: attribute
      object: baseball_glove
      is: a white baseball glove
      not:
      - a red baseball glove
      - a orange baseball glove
      - a yellow baseball glove
      - a green baseball glove
      - a blue baseball glove
      - a purple baseball glove
      - a pink baseball glove
      - a brown baseball glove
      - a black baseball glove
