id: geneval-520-color-attr
modality: image
prompt: a photo of a white dog and a blue potted plant
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      dog: a dog
      potted_plant: a potted plant
    require:
    - type: count
      object: dog
      min: 1
    - type: count
      object: potted_plant
      min: 1
    - type: attribute
      object: dog
      is: a white dog
      not:
      - a red dog
      - a orange dog
      - a yellow dog
      - a green dog
      - a blue dog
      - a purple dog
      - a pink dog
      - a brown dog
      - a black dog
    - type: attribute
      object: potted_plant
      is: a blue potted plant
      not:
      - a red potted plant
      - a orange potted plant
      - a yellow potted plant
      - a green potted plant
      - a purple potted plant
      - a pink potted plant
      - a brown potted plant
      - a black potted plant
      - a white potted plant
