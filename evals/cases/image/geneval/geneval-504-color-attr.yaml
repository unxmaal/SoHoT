id: geneval-504-color-attr
modality: image
prompt: a photo of a yellow pizza and a green oven
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      pizza: a pizza
      oven: a oven
    require:
    - type: count
      object: pizza
      min: 1
    - type: count
      object: oven
      min: 1
    - type: attribute
      object: pizza
      is: a yellow pizza
      not:
      - a red pizza
      - a orange pizza
      - a green pizza
      - a blue pizza
      - a purple pizza
      - a pink pizza
      - a brown pizza
      - a black pizza
      - a white pizza
    - type: attribute
      object: oven
      is: a green oven
      not:
      - a red oven
      - a orange oven
      - a yellow oven
      - a blue oven
      - a purple oven
      - a pink oven
      - a brown oven
      - a black oven
      - a white oven
