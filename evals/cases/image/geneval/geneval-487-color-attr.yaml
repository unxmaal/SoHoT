id: geneval-487-color-attr
modality: image
prompt: a photo of a brown car and a pink hair drier
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      car: a car
      hair_drier: a hair drier
    require:
    - type: count
      object: car
      min: 1
    - type: count
      object: hair_drier
      min: 1
    - type: attribute
      object: car
      is: a brown car
      not:
      - a red car
      - a orange car
      - a yellow car
      - a green car
      - a blue car
      - a purple car
      - a pink car
      - a black car
      - a white car
    - type: attribute
      object: hair_drier
      is: a pink hair drier
      not:
      - a red hair drier
      - a orange hair drier
      - a yellow hair drier
      - a green hair drier
      - a blue hair drier
      - a purple hair drier
      - a brown hair drier
      - a black hair drier
      - a white hair drier
