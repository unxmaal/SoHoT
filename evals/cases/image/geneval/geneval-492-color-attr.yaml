id: geneval-492-color-attr
modality: image
prompt: a photo of a white tie and a purple skateboard
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      tie: a tie
      skateboard: a skateboard
    require:
    - type: count
      object: tie
      min: 1
    - type: count
      object: skateboard
      min: 1
    - type: attribute
      object: tie
      is: a white tie
      not:
      - a red tie
      - a orange tie
      - a yellow tie
      - a green tie
      - a blue tie
      - a purple tie
      - a pink tie
      - a brown tie
      - a black tie
    - type: attribute
      object: skateboard
      is: a purple skateboard
      not:
      - a red skateboard
      - a orange skateboard
      - a yellow skateboard
      - a green skateboard
      - a blue skateboard
      - a pink skateboard
      - a brown skateboard
      - a black skateboard
      - a white skateboard
