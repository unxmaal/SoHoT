id: geneval-480-color-attr
modality: image
prompt: a photo of a purple tennis racket and a black sink
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      tennis_racket: a tennis racket
      sink: a sink
    require:
    - type: count
      object: tennis_racket
      min: 1
    - type: count
      object: sink
      min: 1
    - type: attribute
      object: tennis_racket
      is: a purple tennis racket
      not:
      - a red tennis racket
      - a orange tennis racket
      - a yellow tennis racket
      - a green tennis racket
      - a blue tennis racket
      - a pink tennis racket
      - a brown tennis racket
      - a black tennis racket
      - a white tennis racket
    - type: attribute
      object: sink
      is: a black sink
      not:
      - a red sink
      - a orange sink
      - a yellow sink
      - a green sink
      - a blue sink
      - a purple sink
      - a pink sink
      - a brown sink
      - a white sink
