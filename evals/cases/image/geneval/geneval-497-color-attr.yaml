id: geneval-497-color-attr
modality: image
prompt: a photo of an orange skateboard and a pink bowl
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      skateboard: a skateboard
      bowl: a bowl
    require:
    - type: count
      object: skateboard
      min: 1
    - type: count
      object: bowl
      min: 1
    - type: attribute
      object: skateboard
      is: a orange skateboard
      not:
      - a red skateboard
      - a yellow skateboard
      - a green skateboard
      - a blue skateboard
      - a purple skateboard
      - a pink skateboard
      - a brown skateboard
      - a black skateboard
      - a white skateboard
    - type: attribute
      object: bowl
      is: a pink bowl
      not:
      - a red bowl
      - a orange bowl
      - a yellow bowl
      - a green bowl
      - a blue bowl
      - a purple bowl
      - a brown bowl
      - a black bowl
      - a white bowl
