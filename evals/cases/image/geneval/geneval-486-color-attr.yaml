id: geneval-486-color-attr
modality: image
prompt: a photo of a pink handbag and a black scissors
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      handbag: a handbag
      scissors: a scissors
    require:
    - type: count
      object: handbag
      min: 1
    - type: count
      object: scissors
      min: 1
    - type: attribute
      object: handbag
      is: a pink handbag
      not:
      - a red handbag
      - a orange handbag
      - a yellow handbag
      - a green handbag
      - a blue handbag
      - a purple handbag
      - a brown handbag
      - a black handbag
      - a white handbag
    - type: attribute
      object: scissors
      is: a black scissors
      not:
      - a red scissors
      - a orange scissors
      - a yellow scissors
      - a green scissors
      - a blue scissors
      - a purple scissors
      - a pink scissors
      - a brown scissors
      - a white scissors
