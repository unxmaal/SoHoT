id: geneval-522-color-attr
modality: image
prompt: a photo of a red stop sign and a blue book
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      stop_sign: a stop sign
      book: a book
    require:
    - type: count
      object: stop_sign
      min: 1
    - type: count
      object: book
      min: 1
    - type: attribute
      object: stop_sign
      is: a red stop sign
      not:
      - a orange stop sign
      - a yellow stop sign
      - a green stop sign
      - a blue stop sign
      - a purple stop sign
      - a pink stop sign
      - a brown stop sign
      - a black stop sign
      - a white stop sign
    - type: attribute
      object: book
      is: a blue book
      not:
      - a red book
      - a orange book
      - a yellow book
      - a green book
      - a purple book
      - a pink book
      - a brown book
      - a black book
      - a white book
