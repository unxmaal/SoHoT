id: geneval-505-color-attr
modality: image
prompt: a photo of a red laptop and a brown car
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      laptop: a laptop
      car: a car
    require:
    - type: count
      object: laptop
      min: 1
    - type: count
      object: car
      min: 1
    - type: attribute
      object: laptop
      is: a red laptop
      not:
      - a orange laptop
      - a yellow laptop
      - a green laptop
      - a blue laptop
      - a purple laptop
      - a pink laptop
      - a brown laptop
      - a black laptop
      - a white laptop
    - type: attribute
      object: car
      is: a brown car
      not:
      - a red car
      - a orange car
      - a yellow car
      - a green car
      - a blue car
      - a purple car
      - a pink car
      - a black car
      - a white car
