id: geneval-534-color-attr
modality: image
prompt: a photo of a green tennis racket and a black dog
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      tennis_racket: a tennis racket
      dog: a dog
    require:
    - type: count
      object: tennis_racket
      min: 1
    - type: count
      object: dog
      min: 1
    - type: attribute
      object: tennis_racket
      is: a green tennis racket
      not:
      - a red tennis racket
      - a orange tennis racket
      - a yellow tennis racket
      - a blue tennis racket
      - a purple tennis racket
      - a pink tennis racket
      - a brown tennis racket
      - a black tennis racket
      - a white tennis racket
    - type: attribute
      object: dog
      is: a black dog
      not:
      - a red dog
      - a orange dog
      - a yellow dog
      - a green dog
      - a blue dog
      - a purple dog
      - a pink dog
      - a brown dog
      - a white dog
