id: geneval-552-color-attr
modality: image
prompt: a photo of a blue pizza and a yellow baseball glove
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      pizza: a pizza
      baseball_glove: a baseball glove
    require:
    - type: count
      object: pizza
      min: 1
    - type: count
      object: baseball_glove
      min: 1
    - type: attribute
      object: pizza
      is: a blue pizza
      not:
      - a red pizza
      - a orange pizza
      - a yellow pizza
      - a green pizza
      - a purple pizza
      - a pink pizza
      - a brown pizza
      - a black pizza
      - a white pizza
    - type: attribute
      object: baseball_glove
      is: a yellow baseball glove
      not:
      - a red baseball glove
      - a orange baseball glove
      - a green baseball glove
      - a blue baseball glove
      - a purple baseball glove
      - a pink baseball glove
      - a brown baseball glove
      - a black baseball glove
      - a white baseball glove
