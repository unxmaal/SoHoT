id: geneval-510-color-attr
modality: image
prompt: a photo of a red umbrella and a green cow
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      umbrella: a umbrella
      cow: a cow
    require:
    - type: count
      object: umbrella
      min: 1
    - type: count
      object: cow
      min: 1
    - type: attribute
      object: umbrella
      is: a red umbrella
      not:
      - a orange umbrella
      - a yellow umbrella
      - a green umbrella
      - a blue umbrella
      - a purple umbrella
      - a pink umbrella
      - a brown umbrella
      - a black umbrella
      - a white umbrella
    - type: attribute
      object: cow
      is: a green cow
      not:
      - a red cow
      - a orange cow
      - a yellow cow
      - a blue cow
      - a purple cow
      - a pink cow
      - a brown cow
      - a black cow
      - a white cow
