id: geneval-493-color-attr
modality: image
prompt: a photo of a yellow sports ball and a green boat
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      sports_ball: a sports ball
      boat: a boat
    require:
    - type: count
      object: sports_ball
      min: 1
    - type: count
      object: boat
      min: 1
    - type: attribute
      object: sports_ball
      is: a yellow sports ball
      not:
      - a red sports ball
      - a orange sports ball
      - a green sports ball
      - a blue sports ball
      - a purple sports ball
      - a pink sports ball
      - a brown sports ball
      - a black sports ball
      - a white sports ball
    - type: attribute
      object: boat
      is: a green boat
      not:
      - a red boat
      - a orange boat
      - a yellow boat
      - a blue boat
      - a purple boat
      - a pink boat
      - a brown boat
      - a black boat
      - a white boat
