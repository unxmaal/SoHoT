id: geneval-468-color-attr
modality: image
prompt: a photo of a brown carrot and a white potted plant
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      carrot: a carrot
      potted_plant: a potted plant
    require:
    - type: count
      object: carrot
      min: 1
    - type: count
      object: potted_plant
      min: 1
    - type: attribute
      object: carrot
      is: a brown carrot
      not:
      - a red carrot
      - a orange carrot
      - a yellow carrot
      - a green carrot
      - a blue carrot
      - a purple carrot
      - a pink carrot
      - a black carrot
      - a white carrot
    - type: attribute
      object: potted_plant
      is: a white potted plant
      not:
      - a red potted plant
      - a orange potted plant
      - a yellow potted plant
      - a green potted plant
      - a blue potted plant
      - a purple potted plant
      - a pink potted plant
      - a brown potted plant
      - a black potted plant
