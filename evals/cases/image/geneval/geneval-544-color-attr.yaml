    objects:
      cow: a cow
      sandwich: a sandwich
    require:
    - type: count
      object: cow
      min: 1
    - type: count
      object: sandwich
      min: 1
    - type: attribute
      object: cow
      is: a orange cow
      not:
      - a red cow
      - a yellow cow
      - a green cow
      - a blue cow
      - a purple cow
      - a pink cow
      - a brown cow
      - a black cow
      - a white cow
    - type: attribute
      object: sandwich
      is: a purple sandwich
      not:
      - a red sandwich
      - a orange sandwich
      - a yellow sandwich
      - a green sandwich
      - a blue sandwich
      - a pink sandwich
      - a brown sandwich
      - a black sandwich
      - a white sandwich
