id: geneval-508-color-attr
modality: image
prompt: a photo of a yellow parking meter and a pink refrigerator
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      parking_meter: a parking meter
      refrigerator: a refrigerator
    require:
    - type: count
      object: parking_meter
      min: 1
    - type: count
      object: refrigerator
      min: 1
    - type: attribute
      object: parking_meter
      is: a yellow parking meter
      not:
      - a red parking meter
      - a orange parking meter
      - a green parking meter
      - a blue parking meter
      - a purple parking meter
      - a pink parking meter
      - a brown parking meter
      - a black parking meter
      - a white parking meter
    - type: attribute
      object: refrigerator
      is: a pink refrigerator
      not:
      - a red refrigerator
      - a orange refrigerator
      - a yellow refrigerator
      - a green refrigerator
      - a blue refrigerator
      - a purple refrigerator
      - a brown refrigerator
      - a black refrigerator
      - a white refrigerator
