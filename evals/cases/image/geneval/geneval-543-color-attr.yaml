id: geneval-543-color-attr
modality: image
prompt: a photo of a white banana and a black elephant
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      banana: a banana
      elephant: a elephant
    require:
    - type: count
      object: banana
      min: 1
    - type: count
      object: elephant
      min: 1
    - type: attribute
      object: banana
      is: a white banana
      not:
      - a red banana
      - a orange banana
      - a yellow banana
      - a green banana
      - a blue banana
      - a purple banana
      - a pink banana
      - a brown banana
      - a black banana
    - type: attribute
      object: elephant
      is: a black elephant
      not:
      - a red elephant
      - a orange elephant
      - a yellow elephant
      - a green elephant
      - a blue elephant
      - a purple elephant
      - a pink elephant
      - a brown elephant
      - a white elephant
