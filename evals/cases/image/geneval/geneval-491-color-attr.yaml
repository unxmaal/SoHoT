id: geneval-491-color-attr
modality: image
prompt: a photo of a white pizza and a green umbrella
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      pizza: a pizza
      umbrella: a umbrella
    require:
    - type: count
      object: pizza
      min: 1
    - type: count
      object: umbrella
      min: 1
    - type: attribute
      object: pizza
      is: a white pizza
      not:
      - a red pizza
      - a orange pizza
      - a yellow pizza
      - a green pizza
      - a blue pizza
      - a purple pizza
      - a pink pizza
      - a brown pizza
      - a black pizza
    - type: attribute
      object: umbrella
      is: a green umbrella
      not:
      - a red umbrella
      - a orange umbrella
      - a yellow umbrella
      - a blue umbrella
      - a purple umbrella
      - a pink umbrella
      - a brown umbrella
      - a black umbrella
      - a white umbrella
