id: geneval-502-color-attr
modality: image
prompt: a photo of a blue tie and a pink dining table
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      tie: a tie
      dining_table: a dining table
    require:
    - type: count
      object: tie
      min: 1
    - type: count
      object: dining_table
      min: 1
    - type: attribute
      object: tie
      is: a blue tie
      not:
      - a red tie
      - a orange tie
      - a yellow tie
      - a green tie
      - a purple tie
      - a pink tie
      - a brown tie
      - a black tie
      - a white tie
    - type: attribute
      object: dining_table
      is: a pink dining table
      not:
      - a red dining table
      - a orange dining table
      - a yellow dining table
      - a green dining table
      - a blue dining table
      - a purple dining table
      - a brown dining table
      - a black dining table
      - a white dining table
