id: geneval-523-color-attr
modality: image
prompt: a photo of a yellow car and an orange toothbrush
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      car: a car
      toothbrush: a toothbrush
    require:
    - type: count
      object: car
      min: 1
    - type: count
      object: toothbrush
      min: 1
    - type: attribute
      object: car
      is: a yellow car
      not:
      - a red car
      - a orange car
      - a green car
      - a blue car
      - a purple car
      - a pink car
      - a brown car
      - a black car
      - a white car
    - type: attribute
      object: toothbrush
      is: a orange toothbrush
      not:
      - a red toothbrush
      - a yellow toothbrush
      - a green toothbrush
      - a blue toothbrush
      - a purple toothbrush
      - a pink toothbrush
      - a brown toothbrush
      - a black toothbrush
      - a white toothbrush
