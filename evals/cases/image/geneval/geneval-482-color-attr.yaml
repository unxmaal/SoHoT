id: geneval-482-color-attr
modality: image
prompt: a photo of a blue clock and a white cup
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      clock: a clock
      cup: a cup
    require:
    - type: count
      object: clock
      min: 1
    - type: count
      object: cup
      min: 1
    - type: attribute
      object: clock
      is: a blue clock
      not:
      - a red clock
      - a orange clock
      - a yellow clock
      - a green clock
      - a purple clock
      - a pink clock
      - a brown clock
      - a black clock
      - a white clock
    - type: attribute
      object: cup
      is: a white cup
      not:
      - a red cup
      - a orange cup
      - a yellow cup
      - a green cup
      - a blue cup
      - a purple cup
      - a pink cup
      - a brown cup
      - a black cup
