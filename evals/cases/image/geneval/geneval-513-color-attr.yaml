id: geneval-513-color-attr
modality: image
prompt: a photo of a blue baseball bat and a pink book
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      baseball_bat: a baseball bat
      book: a book
    require:
    - type: count
      object: baseball_bat
      min: 1
    - type: count
      object: book
      min: 1
    - type: attribute
      object: baseball_bat
      is: a blue baseball bat
      not:
      - a red baseball bat
      - a orange baseball bat
      - a yellow baseball bat
      - a green baseball bat
      - a purple baseball bat
      - a pink baseball bat
      - a brown baseball bat
      - a black baseball bat
      - a white baseball bat
    - type: attribute
      object: book
      is: a pink book
      not:
      - a red book
      - a orange book
      - a yellow book
      - a green book
      - a blue book
      - a purple book
      - a brown book
      - a black book
      - a white book
