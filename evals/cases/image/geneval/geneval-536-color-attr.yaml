id: geneval-536-color-attr
modality: image
prompt: a photo of a pink broccoli and a red sink
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      broccoli: a broccoli
      sink: a sink
    require:
    - type: count
      object: broccoli
      min: 1
    - type: count
      object: sink
      min: 1
    - type: attribute
      object: broccoli
      is: a pink broccoli
      not:
      - a red broccoli
      - a orange broccoli
      - a yellow broccoli
      - a green broccoli
      - a blue broccoli
      - a purple broccoli
      - a brown broccoli
      - a black broccoli
      - a white broccoli
    - type: attribute
      object: sink
      is: a red sink
      not:
      - a orange sink
      - a yellow sink
      - a green sink
      - a blue sink
      - a purple sink
      - a pink sink
      - a brown sink
      - a black sink
      - a white sink
