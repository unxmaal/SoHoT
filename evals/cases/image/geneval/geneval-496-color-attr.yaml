id: geneval-496-color-attr
modality: image
prompt: a photo of an orange microwave and a black spoon
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      microwave: a microwave
      spoon: a spoon
    require:
    - type: count
      object: microwave
      min: 1
    - type: count
      object: spoon
      min: 1
    - type: attribute
      object: microwave
      is: a orange microwave
      not:
      - a red microwave
      - a yellow microwave
      - a green microwave
      - a blue microwave
      - a purple microwave
      - a pink microwave
      - a brown microwave
      - a black microwave
      - a white microwave
    - type: attribute
      object: spoon
      is: a black spoon
      not:
      - a red spoon
      - a orange spoon
      - a yellow spoon
      - a green spoon
      - a blue spoon
      - a purple spoon
      - a pink spoon
      - a brown spoon
      - a white spoon
