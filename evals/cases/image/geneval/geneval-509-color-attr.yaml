id: geneval-509-color-attr
modality: image
prompt: a photo of a brown computer mouse and a purple bottle
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      computer_mouse: a computer mouse
      bottle: a bottle
    require:
    - type: count
      object: computer_mouse
      min: 1
    - type: count
      object: bottle
      min: 1
    - type: attribute
      object: computer_mouse
      is: a brown computer mouse
      not:
      - a red computer mouse
      - a orange computer mouse
      - a yellow computer mouse
      - a green computer mouse
      - a blue computer mouse
      - a purple computer mouse
      - a pink computer mouse
      - a black computer mouse
      - a white computer mouse
    - type: attribute
      object: bottle
      is: a purple bottle
      not:
      - a red bottle
      - a orange bottle
      - a yellow bottle
      - a green bottle
      - a blue bottle
      - a pink bottle
      - a brown bottle
      - a black bottle
      - a white bottle
