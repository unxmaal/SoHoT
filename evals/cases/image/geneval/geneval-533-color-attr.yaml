id: geneval-533-color-attr
modality: image
prompt: a photo of an orange potted plant and a black spoon
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      potted_plant: a potted plant
      spoon: a spoon
    require:
    - type: count
      object: potted_plant
      min: 1
    - type: count
      object: spoon
      min: 1
    - type: attribute
      object: potted_plant
      is: a orange potted plant
      not:
      - a red potted plant
      - a yellow potted plant
      - a green potted plant
      - a blue potted plant
      - a purple potted plant
      - a pink potted plant
      - a brown potted plant
      - a black potted plant
      - a white potted plant
    - type: attribute
      object: spoon
      is: a black spoon
      not:
      - a red spoon
      - a orange spoon
      - a yellow spoon
      - a green spoon
      - a blue spoon
      - a purple spoon
      - a pink spoon
      - a brown spoon
      - a white spoon
