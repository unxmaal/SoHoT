id: geneval-495-color-attr
modality: image
prompt: a photo of a yellow bowl and a white baseball glove
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      bowl: a bowl
      baseball_glove: a baseball glove
    require:
    - type: count
      object: bowl
      min: 1
    - type: count
      object: baseball_glove
      min: 1
    - type: attribute
      object: bowl
      is: a yellow bowl
      not:
      - a red bowl
      - a orange bowl
      - a green bowl
      - a blue bowl
      - a purple bowl
      - a pink bowl
      - a brown bowl
      - a black bowl
      - a white bowl
    - type: attribute
      object: baseball_glove
      is: a white baseball glove
      not:
      - a red baseball glove
      - a orange baseball glove
      - a yellow baseball glove
      - a green baseball glove
      - a blue baseball glove
      - a purple baseball glove
      - a pink baseball glove
      - a brown baseball glove
      - a black baseball glove
