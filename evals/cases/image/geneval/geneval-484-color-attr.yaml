id: geneval-484-color-attr
modality: image
prompt: a photo of a white handbag and a red giraffe
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      handbag: a handbag
      giraffe: a giraffe
    require:
    - type: count
      object: handbag
      min: 1
    - type: count
      object: giraffe
      min: 1
    - type: attribute
      object: handbag
      is: a white handbag
      not:
      - a red handbag
      - a orange handbag
      - a yellow handbag
      - a green handbag
      - a blue handbag
      - a purple handbag
      - a pink handbag
      - a brown handbag
      - a black handbag
    - type: attribute
      object: giraffe
      is: a red giraffe
      not:
      - a orange giraffe
      - a yellow giraffe
      - a green giraffe
      - a blue giraffe
      - a purple giraffe
      - a pink giraffe
      - a brown giraffe
      - a black giraffe
      - a white giraffe
