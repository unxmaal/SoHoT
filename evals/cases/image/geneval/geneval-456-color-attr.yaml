id: geneval-456-color-attr
modality: image
prompt: a photo of a yellow computer keyboard and a black sink
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      computer_keyboard: a computer keyboard
      sink: a sink
    require:
    - type: count
      object: computer_keyboard
      min: 1
    - type: count
      object: sink
      min: 1
    - type: attribute
      object: computer_keyboard
      is: a yellow computer keyboard
      not:
      - a red computer keyboard
      - a orange computer keyboard
      - a green computer keyboard
      - a blue computer keyboard
      - a purple computer keyboard
      - a pink computer keyboard
      - a brown computer keyboard
      - a black computer keyboard
      - a white computer keyboard
    - type: attribute
      object: sink
      is: a black sink
      not:
      - a red sink
      - a orange sink
      - a yellow sink
      - a green sink
      - a blue sink
      - a purple sink
      - a pink sink
      - a brown sink
      - a white sink
