id: geneval-551-color-attr
modality: image
prompt: a photo of a green cup and a red pizza
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      cup: a cup
      pizza: a pizza
    require:
    - type: count
      object: cup
      min: 1
    - type: count
      object: pizza
      min: 1
    - type: attribute
      object: cup
      is: a green cup
      not:
      - a red cup
      - a orange cup
      - a yellow cup
      - a blue cup
      - a purple cup
      - a pink cup
      - a brown cup
      - a black cup
      - a white cup
    - type: attribute
      object: pizza
      is: a red pizza
      not:
      - a orange pizza
      - a yellow pizza
      - a green pizza
      - a blue pizza
      - a purple pizza
      - a pink pizza
      - a brown pizza
      - a black pizza
      - a white pizza
