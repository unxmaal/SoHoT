id: geneval-463-color-attr
modality: image
prompt: a photo of a purple elephant and a brown sports ball
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      elephant: a elephant
      sports_ball: a sports ball
    require:
    - type: count
      object: elephant
      min: 1
    - type: count
      object: sports_ball
      min: 1
    - type: attribute
      object: elephant
      is: a purple elephant
      not:
      - a red elephant
      - a orange elephant
      - a yellow elephant
      - a green elephant
      - a blue elephant
      - a pink elephant
      - a brown elephant
      - a black elephant
      - a white elephant
    - type: attribute
      object: sports_ball
      is: a brown sports ball
      not:
      - a red sports ball
      - a orange sports ball
      - a yellow sports ball
      - a green sports ball
      - a blue sports ball
      - a purple sports ball
      - a pink sports ball
      - a black sports ball
      - a white sports ball
