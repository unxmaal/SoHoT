id: geneval-531-color-attr
modality: image
prompt: a photo of a white bottle and a blue sheep
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      bottle: a bottle
      sheep: a sheep
    require:
    - type: count
      object: bottle
      min: 1
    - type: count
      object: sheep
      min: 1
    - type: attribute
      object: bottle
      is: a white bottle
      not:
      - a red bottle
      - a orange bottle
      - a yellow bottle
      - a green bottle
      - a blue bottle
      - a purple bottle
      - a pink bottle
      - a brown bottle
      - a black bottle
    - type: attribute
      object: sheep
      is: a blue sheep
      not:
      - a red sheep
      - a orange sheep
      - a yellow sheep
      - a green sheep
      - a purple sheep
      - a pink sheep
      - a brown sheep
      - a black sheep
      - a white sheep
