id: geneval-519-color-attr
modality: image
prompt: a photo of a black bottle and a white refrigerator
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      bottle: a bottle
      refrigerator: a refrigerator
    require:
    - type: count
      object: bottle
      min: 1
    - type: count
      object: refrigerator
      min: 1
    - type: attribute
      object: bottle
      is: a black bottle
      not:
      - a red bottle
      - a orange bottle
      - a yellow bottle
      - a green bottle
      - a blue bottle
      - a purple bottle
      - a pink bottle
      - a brown bottle
      - a white bottle
    - type: attribute
      object: refrigerator
      is: a white refrigerator
      not:
      - a red refrigerator
      - a orange refrigerator
      - a yellow refrigerator
      - a green refrigerator
      - a blue refrigerator
      - a purple refrigerator
      - a pink refrigerator
      - a brown refrigerator
      - a black refrigerator
