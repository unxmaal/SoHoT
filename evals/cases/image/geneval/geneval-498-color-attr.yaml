id: geneval-498-color-attr
modality: image
prompt: a photo of a blue toilet and a white suitcase
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      toilet: a toilet
      suitcase: a suitcase
    require:
    - type: count
      object: toilet
      min: 1
    - type: count
      object: suitcase
      min: 1
    - type: attribute
      object: toilet
      is: a blue toilet
      not:
      - a red toilet
      - a orange toilet
      - a yellow toilet
      - a green toilet
      - a purple toilet
      - a pink toilet
      - a brown toilet
      - a black toilet
      - a white toilet
    - type: attribute
      object: suitcase
      is: a white suitcase
      not:
      - a red suitcase
      - a orange suitcase
      - a yellow suitcase
      - a green suitcase
      - a blue suitcase
      - a purple suitcase
      - a pink suitcase
      - a brown suitcase
      - a black suitcase
