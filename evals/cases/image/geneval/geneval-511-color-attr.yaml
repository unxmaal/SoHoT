id: geneval-511-color-attr
modality: image
prompt: a photo of a red giraffe and a black cell phone
params:
  width: 512
  height: 512
  seed: 42
assert:
  staging:
    objects:
      giraffe: a giraffe
      cell_phone: a cell phone
    require:
    - type: count
      object: giraffe
      min: 1
    - type: count
      object: cell_phone
      min: 1
    - type: attribute
      object: giraffe
      is: a red giraffe
      not:
      - a orange giraffe
      - a yellow giraffe
      - a green giraffe
      - a blue giraffe
      - a purple giraffe
      - a pink giraffe
      - a brown giraffe
      - a black giraffe
      - a white giraffe
    - type: attribute
      object: cell_phone
      is: a black cell phone
      not:
      - a red cell phone
      - a orange cell phone
      - a yellow cell phone
      - a green cell phone
      - a blue cell phone
      - a purple cell phone
      - a pink cell phone
      - a brown cell phone
      - a white cell phone
