context: 'PROMPT:

  1.

  Pertanyaan #1

  What practice involves identifying, defining, and solving a problem by using data in an organized, step-by-step
  manner?


  1 poin


  Context



  Analytical thinking



  Visualization



  Data design


  2.

  Pertanyaan #2

  Which of the following are examples of data visualizations? Select all that apply.


  1 poin


  Reports



  Charts



  Graphs



  Maps


  3.

  Pertanyaan #3

  Gap analysis is used to examine and evaluate how a process currently works with the goal of getting
  to where you want to be in the future.


  1 poin


  True



  False


  4.

  Pertanyaan #4

  Which aspect of analytical thinking involves being able to identify a relationship between two or more
  pieces of data?


  1 poin


  Correlation



  Data design



  Context



  Visualization


  RESPONSE:

  1. Analytical thinking


  Analytical thinking involves identifying, defining, and solving a problem by using data in an organized,
  step-by-step manner. This practice involves examining the data, identifying patterns and relationships,
  and using that information to develop solutions.


  2. Data visualizations


  Data visualizations are graphical representations of data, such as charts, graphs, maps, and reports.
  They are used to communicate information clearly and effectively to a variety of audiences. Data visualizations
  can be used to show trends, patterns, and relationships in data, and can help users understand complex
  information quickly and easily.


  3. Gap analysis


  Gap analysis is a technique used to examine and evaluate how a process currently works and to identify
  areas where improvement is needed. It involves comparing the current state of a process with the desired
  state, and then identifying the gaps that need to be filled in order to achieve the desired results.


  4. Context


  Context is an important aspect of analytical thinking. It involves being able to understand the bigger
  picture and to identify the relationships between different pieces of data. Context helps to provide
  a deeper understanding of the problem and can help to identify potential solutions.


  5. Visualization


  Visualization is an important aspect of analytical thinking. It involves being able to see patterns
  and relationships in data, and to use that information to develop solutions. Visualization can be done
  through charts, graphs, maps, and other data visualizations.'
