context: 'PROMPT:

  what is yoga


  RESPONSE:

  Yoga is a physical, mental, and spiritual practice that originated in ancient India. It involves a combination
  of physical postures (asanas), breathing techniques (pranayama), meditation, and ethical principles
  (yamas and niyamas). The goal of yoga is to promote physical and mental well-being, cultivate mindfulness
  and self-awareness, and achieve a state of spiritual enlightenment.


  There are many different styles of yoga, each with its own unique focus and techniques. Some popular
  styles include Hatha yoga, which focuses on physical postures and breathing exercises; Vinyasa yoga,
  which involves flowing sequences of postures coordinated with the breath; and Ashtanga yoga, which is
  a more rigorous style that involves a set series of postures.


  In addition to its physical and mental health benefits, yoga is also considered a spiritual practice
  in many traditions. It is often used as a tool for self-discovery, personal growth, and connection with
  the divine.'
