context: The university experienced its share of student unrest during the 1960s, beginning in 1962, when
  students occupied President George Beadle's office in a protest over the university's off-campus rental
  policies. After continued turmoil, a university committee in 1967 issued what became known as the Kalven
  Report. The report, a two-page statement of the university's policy in "social and political action,"
  declared that "To perform its mission in the society, a university must sustain an extraordinary environment
  of freedom of inquiry and maintain an independence from political fashions, passions, and pressures."
  The report has since been used to justify decisions such as the university's refusal to divest from
  South Africa in the 1980s and Darfur in the late 2000s.
