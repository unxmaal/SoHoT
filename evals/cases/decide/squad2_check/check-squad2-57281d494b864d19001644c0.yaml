context: In the mid-1960s, corruption scandals began to arise among many of the city's officials, who
  were mainly elected through the traditional old boy network. After a grand jury was convened to investigate,
  11 officials were indicted and more were forced to resign. Jacksonville Consolidation, led by J. J.
  Daniel and Claude Yates, began to win more support during this period, from both inner city blacks,
  who wanted more involvement in government, and whites in the suburbs, who wanted more services and more
  control over the central city. In 1964 all 15 of Duval County's public high schools lost their accreditation.
  This added momentum to proposals for government reform. Lower taxes, increased economic development,
  unification of the community, better public spending and effective administration by a more central
  authority were all cited as reasons for a new consolidated government.
