context: In modern particle physics, forces and the acceleration of particles are explained as a mathematical
  by-product of exchange of momentum-carrying gauge bosons. With the development of quantum field theory
  and general relativity, it was realized that force is a redundant concept arising from conservation
  of momentum (4-momentum in relativity and momentum of virtual particles in quantum electrodynamics).
  The conservation of momentum can be directly derived from the homogeneity or symmetry of space and so
  is usually considered more fundamental than the concept of a force. Thus the currently known fundamental
  forces are considered more accurately to be "fundamental interactions".:199–128 When particle A emits
  (creates) or absorbs (annihilates) virtual particle B, a momentum conservation results in recoil of
  particle A making impression of repulsion or attraction between particles A A' exchanging by B. This
  description applies to all forces arising from fundamental interactions. While sophisticated mathematical
  descriptions are needed to predict, in full detail, the accurate result of such interactions, there
  is a conceptually simple way to describe such interactions through the use of Feynman diagrams. In a
  Feynman diagram, each matter particle is represented as a straight line (see world line) traveling through
  time, which normally increases up or to the right in the diagram. Matter and anti-matter particles are
  identical except for their direction of propagation through the Feynman diagram. World lines of particles
  intersect at interaction vertices, and the Feynman diagram represents any force arising from an interaction
  as occurring at the vertex with an associated instantaneous change in the direction of the particle
  world lines. Gauge bosons are emitted away from the vertex as wavy lines and, in the case of virtual
  particle exchange, are absorbed at an adjacent vertex.
