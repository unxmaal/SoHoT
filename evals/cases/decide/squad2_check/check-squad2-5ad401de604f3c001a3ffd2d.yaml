context: Shi Tianze was a Han Chinese who lived in the Jin dynasty. Interethnic marriage between Han and
  Jurchen became common at this time. His father was Shi Bingzhi (史秉直, Shih Ping-chih). Shi Bingzhi was
  married to a Jurchen woman (surname Na-ho) and a Han Chinese woman (surname Chang); it is unknown which
  of them was Shi Tianze's mother. Shi Tianze was married to two Jurchen women, a Han Chinese woman, and
  a Korean woman, and his son Shi Gang was born to one of his Jurchen wives. The surnames of his Jurchen
  wives were Mo-nien and Na-ho; the surname of his Korean wife was Li; and the surname of his Han Chinese
  wife was Shi. Shi Tianze defected to Mongol forces upon their invasion of the Jin dynasty. His son Shi
  Gang married a Kerait woman; the Kerait were Mongolified Turkic people and were considered part of the
  "Mongol nation". Shi Tianze (Shih T'ien-tse), Zhang Rou (Chang Jou, 張柔), and Yan Shi (Yen Shih, 嚴實)
  and other high ranking Chinese who served in the Jin dynasty and defected to the Mongols helped build
  the structure for the administration of the new state. Chagaan (Tsagaan) and Zhang Rou jointly launched
  an attack on the Song dynasty ordered by Töregene Khatun.
