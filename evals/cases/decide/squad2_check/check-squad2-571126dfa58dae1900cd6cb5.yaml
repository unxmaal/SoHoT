context: The first commercially successful true engine, in that it could generate power and transmit it
  to a machine, was the atmospheric engine, invented by Thomas Newcomen around 1712. It was an improvement
  over Savery's steam pump, using a piston as proposed by Papin. Newcomen's engine was relatively inefficient,
  and in most cases was used for pumping water. It worked by creating a partial vacuum by condensing steam
  under a piston within a cylinder. It was employed for draining mine workings at depths hitherto impossible,
  and also for providing a reusable water supply for driving waterwheels at factories sited away from
  a suitable "head". Water that had passed over the wheel was pumped back up into a storage reservoir
  above the wheel.
