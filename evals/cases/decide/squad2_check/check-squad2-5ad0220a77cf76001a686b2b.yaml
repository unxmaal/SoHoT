context: Southern California is also home to a large home grown surf and skateboard culture. Companies
  such as Volcom, Quiksilver, No Fear, RVCA, and Body Glove are all headquartered here. Professional skateboarder
  Tony Hawk, professional surfers Rob Machado, Tim Curran, Bobby Martinez, Pat O'Connell, Dane Reynolds,
  and Chris Ward, and professional snowboarder Shaun White live in southern California. Some of the world's
  legendary surf spots are in southern California as well, including Trestles, Rincon, The Wedge, Huntington
  Beach, and Malibu, and it is second only to the island of Oahu in terms of famous surf breaks. Some
  of the world's biggest extreme sports events, including the X Games, Boost Mobile Pro, and the U.S.
  Open of Surfing are all in southern California. Southern California is also important to the world of
  yachting. The annual Transpacific Yacht Race, or Transpac, from Los Angeles to Hawaii, is one of yachting's
  premier events. The San Diego Yacht Club held the America's Cup, the most prestigious prize in yachting,
  from 1988 to 1995 and hosted three America's Cup races during that time.
