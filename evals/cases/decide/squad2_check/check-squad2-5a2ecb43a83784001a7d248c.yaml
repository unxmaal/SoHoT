prompt: Check which of these questions the paragraph answers.
context: The study also found that there were two previously unknown but related clades (genetic branches)
  of the Y. pestis genome associated with medieval mass graves. These clades (which are thought to be
  extinct) were found to be ancestral to modern isolates of the modern Y. pestis strains Y. p. orientalis
  and Y. p. medievalis, suggesting the plague may have entered Europe in two waves. Surveys of plague
  pit remains in France and England indicate the first variant entered Europe through the port of Marseille
  around November 1347 and spread through France over the next two years, eventually reaching England
  in the spring of 1349, where it spread through the country in three epidemics. Surveys of plague pit
  remains from the Dutch town of Bergen op Zoom showed the Y. pestis genotype responsible for the pandemic
  that spread through the Low Countries from 1350 differed from that found in Britain and France, implying
  Bergen op Zoom (and possibly other parts of the southern Netherlands) was not directly infected from
  England or France in 1349 and suggesting a second wave of plague, different from those in Britain and
  France, may have been carried to the Low Countries from Norway, the Hanseatic cities or another site.
