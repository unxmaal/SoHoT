context: 'Courts have distinguished between two types of civil disobedience: "Indirect civil disobedience
  involves violating a law which is not, itself, the object of protest, whereas direct civil disobedience
  involves protesting the existence of a particular law by breaking that law." During the Vietnam War,
  courts typically refused to excuse the perpetrators of illegal protests from punishment on the basis
  of their challenging the legality of the Vietnam War; the courts ruled it was a political question.
  The necessity defense has sometimes been used as a shadow defense by civil disobedients to deny guilt
  without denouncing their politically motivated acts, and to present their political beliefs in the courtroom.
  However, court cases such as U.S. v. Schoon have greatly curtailed the availability of the political
  necessity defense. Likewise, when Carter Wentworth was charged for his role in the Clamshell Alliance''s
  1977 illegal occupation of the Seabrook Station Nuclear Power Plant, the judge instructed the jury to
  disregard his competing harms defense, and he was found guilty. Fully Informed Jury Association activists
  have sometimes handed out educational leaflets inside courthouses despite admonitions not to; according
  to FIJA, many of them have escaped prosecution because "prosecutors have reasoned (correctly) that if
  they arrest fully informed jury leafleters, the leaflets will have to be given to the leafleter''s own
  jury as evidence."'
