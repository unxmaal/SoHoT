context: Steam engines frequently possess two independent mechanisms for ensuring that the pressure in
  the boiler does not go too high; one may be adjusted by the user, the second is typically designed as
  an ultimate fail-safe. Such safety valves traditionally used a simple lever to restrain a plug valve
  in the top of a boiler. One end of the lever carried a weight or spring that restrained the valve against
  steam pressure. Early valves could be adjusted by engine drivers, leading to many accidents when a driver
  fastened the valve down to allow greater steam pressure and more power from the engine. The more recent
  type of safety valve uses an adjustable spring-loaded valve, which is locked such that operators may
  not tamper with its adjustment unless a seal illegally is broken. This arrangement is considerably safer.[citation
  needed]
