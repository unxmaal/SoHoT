context: The First British Empire was based on mercantilism, and involved colonies and holdings primarily
  in North America, the Caribbean, and India. Its growth was reversed by the loss of the American colonies
  in 1776. Britain made compensating gains in India, Australia, and in constructing an informal economic
  empire through control of trade and finance in Latin America after the independence of Spanish and Portuguese
  colonies about 1820. By the 1840s, Britain had adopted a highly successful policy of free trade that
