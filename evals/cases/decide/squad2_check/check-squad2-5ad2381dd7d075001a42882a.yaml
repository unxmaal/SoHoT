context: In one experiment, Lavoisier observed that there was no overall increase in weight when tin and
  air were heated in a closed container. He noted that air rushed in when he opened the container, which
  indicated that part of the trapped air had been consumed. He also noted that the tin had increased in
  weight and that increase was the same as the weight of the air that rushed back in. This and other experiments
  on combustion were documented in his book Sur la combustion en général, which was published in 1777.
  In that work, he proved that air is a mixture of two gases; 'vital air', which is essential to combustion
  and respiration, and azote (Gk. ἄζωτον "lifeless"), which did not support either. Azote later became
  nitrogen in English, although it has kept the name in French and several other European languages.
