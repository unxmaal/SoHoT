context: Some Huguenots fought in the Low Countries alongside the Dutch against Spain during the first
  years of the Dutch Revolt (1568–1609). The Dutch Republic rapidly became a destination for Huguenot
  exiles. Early ties were already visible in the "Apologie" of William the Silent, condemning the Spanish
  Inquisition, which was written by his court minister, the Huguenot Pierre L'Oyseleur, lord of Villiers.
  Louise de Coligny, daughter of the murdered Huguenot leader Gaspard de Coligny, married William the
  Silent, leader of the Dutch (Calvinist) revolt against Spanish (Catholic) rule. As both spoke French
  in daily life, their court church in the Prinsenhof in Delft held services in French. The practice has
  continued to the present day. The Prinsenhof is one of the 14 active Walloon churches of the Dutch Reformed
  Church. The ties between Huguenots and the Dutch Republic's military and political leadership, the House
  of Orange-Nassau, which existed since the early days of the Dutch Revolt, helped support the many early
  settlements of Huguenots in the Dutch Republic's colonies. They settled at the Cape of Good Hope in
  South Africa and New Netherland in North America.
