context: Funding for private schools is generally provided through student tuition, endowments, scholarship/voucher
  funds, and donations and grants from religious organizations or private individuals. Government funding
  for religious schools is either subject to restrictions or possibly forbidden, according to the courts'
  interpretation of the Establishment Clause of the First Amendment or individual state Blaine Amendments.
  Non-religious private schools theoretically could qualify for such funding without hassle, preferring
  the advantages of independent control of their student admissions and course content instead of the
  public funding they could get with charter status.
