context: Sir Charles Lyell first published his famous book, Principles of Geology, in 1830. This book,
  which influenced the thought of Charles Darwin, successfully promoted the doctrine of uniformitarianism.
  This theory states that slow geological processes have occurred throughout the Earth's history and are
  still occurring today. In contrast, catastrophism is the theory that Earth's features formed in single,
  catastrophic events and remained unchanged thereafter. Though Hutton believed in uniformitarianism,
  the idea was not widely accepted at the time.
