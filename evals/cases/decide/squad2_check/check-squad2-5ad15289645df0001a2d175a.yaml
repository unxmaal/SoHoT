context: Free movement of goods within the European Union is achieved by a customs union, and the principle
  of non-discrimination. The EU manages imports from non-member states, duties between member states are
  prohibited, and imports circulate freely. In addition under the Treaty on the Functioning of the European
  Union article 34, ‘Quantitative restrictions on imports and all measures having equivalent effect shall
  be prohibited between Member States’. In Procureur du Roi v Dassonville the Court of Justice held that
  this rule meant all "trading rules" that are "enacted by Member States" which could hinder trade "directly
  or indirectly, actually or potentially" would be caught by article 34. This meant that a Belgian law
  requiring Scotch whisky imports to have a certificate of origin was unlikely to be lawful. It discriminated
  against parallel importers like Mr Dassonville, who could not get certificates from authorities in France,
  where they bought the Scotch. This "wide test", to determine what could potentially be an unlawful restriction
  on trade, applies equally to actions by quasi-government bodies, such as the former "Buy Irish" company
  that had government appointees. It also means states can be responsible for private actors. For instance,
  in Commission v France French farmer vigilantes were continually sabotaging shipments of Spanish strawberries,
  and even Belgian tomato imports. France was liable for these hindrances to trade because the authorities
  ‘manifestly and persistently abstained' from preventing the sabotage. Generally speaking, if a member
  state has laws or practices that directly discriminate against imports (or exports under TFEU article
  35) then it must be justified under article 36. The justifications include public morality, policy or
  security, "protection of health and life of humans, animals or plants", "national treasures" of "artistic,
  historic or archaeological value" and "industrial and commercial property." In addition, although not
  clearly listed, environmental protection can justify restrictions on trade as an overriding requirement
  derived from TFEU article 11. More generally, it has been increasingly acknowledged that fundamental
  human rights should take priority over all trade rules. So, in Schmidberger v Austria the Court of Justice
  held that Austria did not infringe article 34 by failing to ban a protest that blocked heavy traffic
  passing over the A13, Brenner Autobahn, en route to Italy. Although many companies, including Mr Schmidberger's
  German undertaking, were prevented from trading, the Court of Justice reasoned that freedom of association
  is one of the ‘fundamental pillars of a democratic society’, against which the free movement of goods
  had to be balanced, and was probably subordinate. If a member state does appeal to the article 36 justification,
  the measures it takes have to be applied proportionately. This means the rule must be pursue a legitimate
  aim and (1) be suitable to achieve the aim, (2) be necessary, so that a less restrictive measure could
  not achieve the same result, and (3) be reasonable in balancing the interests of free trade with interests
  in article 36.
