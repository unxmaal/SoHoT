context: 'The two symbols most commonly associated with pharmacy in English-speaking countries are the
  mortar and pestle and the ℞ (recipere) character, which is often written as "Rx" in typed text. The
  show globe was also used until the early 20th century. Pharmacy organizations often use other symbols,
  such as the Bowl of Hygieia which is often used in the Netherlands, conical measures, and caduceuses
  in their logos. Other symbols are common in different countries: the green Greek cross in France, Argentina,
  the United Kingdom, Belgium, Ireland, Italy, Spain, and India, the increasingly rare Gaper in the Netherlands,
  and a red stylized letter A in Germany and Austria (from Apotheke, the German word for pharmacy, from
  the same Greek root as the English word ''apothecary'').'
