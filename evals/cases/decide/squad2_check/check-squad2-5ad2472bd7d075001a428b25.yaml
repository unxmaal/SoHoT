context: On the other hand, higher economic inequality tends to increase entrepreneurship rates at the
  individual level (self-employment). However, most of it is often based on necessity rather than opportunity.
  Necessity-based entrepreneurship is motivated by survival needs such as income for food and shelter
  ("push" motivations), whereas opportunity-based entrepreneurship is driven by achievement-oriented motivations
  ("pull") such as vocation and more likely to involve the pursue of new products, services, or underserved
  market needs. The economic impact of the former type of entrepreneurialism tends to be redistributive
  while the latter is expected to foster technological progress and thus have a more positive impact on
  economic growth.
