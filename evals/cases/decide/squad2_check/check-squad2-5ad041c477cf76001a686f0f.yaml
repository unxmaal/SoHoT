context: Several procedures enable the Scottish Parliament to scrutinise the Government. The First Minister
  or members of the cabinet can deliver statements to Parliament upon which MSPs are invited to question.
  For example, at the beginning of each parliamentary year, the First Minister delivers a statement to
  the chamber setting out the Government's legislative programme for the forthcoming year. After the statement
  has been delivered, the leaders of the opposition parties and other MSPs question the First Minister
  on issues related to the substance of the statement.
