context: In ring theory, the notion of number is generally replaced with that of ideal. Prime ideals,
  which generalize prime elements in the sense that the principal ideal generated by a prime element is
  a prime ideal, are an important tool and object of study in commutative algebra, algebraic number theory
  and algebraic geometry. The prime ideals of the ring of integers are the ideals (0), (2), (3), (5),
  (7), (11), … The fundamental theorem of arithmetic generalizes to the Lasker–Noether theorem, which
  expresses every ideal in a Noetherian commutative ring as an intersection of primary ideals, which are
  the appropriate generalizations of prime powers.
