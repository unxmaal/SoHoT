context: At the beginning of the 20th century, important advancement in geological science was facilitated
  by the ability to obtain accurate absolute dates to geologic events using radioactive isotopes and other
  methods. This changed the understanding of geologic time. Previously, geologists could only use fossils
  and stratigraphic correlation to date sections of rock relative to one another. With isotopic dates
  it became possible to assign absolute ages to rock units, and these absolute dates could be applied
  to fossil sequences in which there was datable material, converting the old relative ages into new absolute
  ages.
