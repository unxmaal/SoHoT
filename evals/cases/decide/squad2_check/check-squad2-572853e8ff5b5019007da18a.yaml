context: Undergraduate students are required to take a distribution of courses to satisfy the university's
  core curriculum known as the Common Core. In 2012-2013, the Core classes at Chicago were limited to
  17 students, and are generally led by a full-time professor (as opposed to a teaching assistant). As
  of the 2013–2014 school year, 15 courses and demonstrated proficiency in a foreign language are required
