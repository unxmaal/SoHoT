context: Fundamental rights, as in human rights, were first recognised by the European Court of Justice
  in the late 60s and fundamental rights are now regarded as integral part of the general principles of
  European Union law. As such the European Court of Justice is bound to draw inspiration from the constitutional
  traditions common to the member states. Therefore, the European Court of Justice cannot uphold measures
  which are incompatible with fundamental rights recognised and protected in the constitutions of member
  states. The European Court of Justice also found that "international treaties for the protection of
  human rights on which the member states have collaborated or of which they are signatories, can supply
  guidelines which should be followed within the framework of Community law."
