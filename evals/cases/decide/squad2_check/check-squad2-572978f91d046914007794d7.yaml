context: 'There are hints in the surviving records of the ancient Egyptians that they had some knowledge
  of prime numbers: the Egyptian fraction expansions in the Rhind papyrus, for instance, have quite different
  forms for primes and for composites. However, the earliest surviving records of the explicit study of
  prime numbers come from the Ancient Greeks. Euclid''s Elements (circa 300 BC) contain important theorems
  about primes, including the infinitude of primes and the fundamental theorem of arithmetic. Euclid also
  showed how to construct a perfect number from a Mersenne prime. The Sieve of Eratosthenes, attributed
  to Eratosthenes, is a simple method to compute primes, although the large primes found today with computers
  are not generated this way.'
