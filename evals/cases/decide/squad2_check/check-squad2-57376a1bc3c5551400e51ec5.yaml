context: 'Historically, forces were first quantitatively investigated in conditions of static equilibrium
  where several forces canceled each other out. Such experiments demonstrate the crucial properties that
  forces are additive vector quantities: they have magnitude and direction. When two forces act on a point
  particle, the resulting force, the resultant (also called the net force), can be determined by following
  the parallelogram rule of vector addition: the addition of two vectors represented by sides of a parallelogram,
  gives an equivalent resultant vector that is equal in magnitude and direction to the transversal of
  the parallelogram. The magnitude of the resultant varies from the difference of the magnitudes of the
  two forces to their sum, depending on the angle between their lines of action. However, if the forces
  are acting on an extended body, their respective lines of application must also be specified in order
  to account for their effects on the motion of the body.'
