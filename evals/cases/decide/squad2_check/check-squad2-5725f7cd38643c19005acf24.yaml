context: The 2010 United States Census reported that Fresno had a population of 494,665. The population
  density was 4,404.5 people per square mile (1,700.6/km²). The racial makeup of Fresno was 245,306 (49.6%)
  White, 40,960 (8.3%) African American, 8,525 (1.7%) Native American, 62,528 (12.6%) Asian (3.6% Hmong,
  1.7% Indian, 1.2% Filipino, 1.2% Laotian, 1.0% Thai, 0.8% Cambodian, 0.7% Chinese, 0.5% Japanese, 0.4%
  Vietnamese, 0.2% Korean), 849 (0.2%) Pacific Islander, 111,984 (22.6%) from other races, and 24,513
  (5.0%) from two or more races. Hispanic or Latino of any race were 232,055 persons (46.9%). Among the
  Hispanic population, 42.7% of the total population are Mexican, 0.4% Salvadoran, and 0.4% Puerto Rican.
  Non-Hispanic Whites were 30.0% of the population in 2010, down from 72.6% in 1970.
