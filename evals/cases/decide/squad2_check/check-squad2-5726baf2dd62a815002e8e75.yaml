prompt: Check which of these questions the paragraph answers.
context: 'Since its foundation, the Treaties sought to enable people to pursue their life goals in any
  country through free movement. Reflecting the economic nature of the project, the European Community
  originally focused upon free movement of workers: as a "factor of production". However, from the 1970s,
  this focus shifted towards developing a more "social" Europe. Free movement was increasingly based on
  "citizenship", so that people had rights to empower them to become economically and socially active,
  rather than economic activity being a precondition for rights. This means the basic "worker" rights
  in TFEU article 45 function as a specific expression of the general rights of citizens in TFEU articles
  18 to 21. According to the Court of Justice, a "worker" is anybody who is economically active, which
  includes everyone in an employment relationship, "under the direction of another person" for "remuneration".
  A job, however, need not be paid in money for someone to be protected as a worker. For example, in Steymann
  v Staatssecretaris van Justitie, a German man claimed the right to residence in the Netherlands, while
  he volunteered plumbing and household duties in the Bhagwan community, which provided for everyone''s
  material needs irrespective of their contributions. The Court of Justice held that Mr Steymann was entitled
  to stay, so long as there was at least an "indirect quid pro quo" for the work he did. Having "worker"
  status means protection against all forms of discrimination by governments, and employers, in access
  to employment, tax, and social security rights. By contrast a citizen, who is "any person having the
  nationality of a Member State" (TFEU article 20(1)), has rights to seek work, vote in local and European
  elections, but more restricted rights to claim social security. In practice, free movement has become
  politically contentious as nationalist political parties have manipulated fears about immigrants taking
  away people''s jobs and benefits (paradoxically at the same time). Nevertheless, practically "all available
  research finds little impact" of "labour mobility on wages and employment of local workers".'
