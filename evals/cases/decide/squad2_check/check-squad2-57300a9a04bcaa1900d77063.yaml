context: At the end of World War I, the Rhineland was subject to the Treaty of Versailles. This decreed
  that it would be occupied by the allies, until 1935 and after that, it would be a demilitarised zone,
  with the German army forbidden to enter. The Treaty of Versailles and this particular provision, in
  general, caused much resentment in Germany and is often cited as helping Adolf Hitler's rise to power.
  The allies left the Rhineland, in 1930 and the German army re-occupied it in 1936, which was enormously
  popular in Germany. Although the allies could probably have prevented the re-occupation, Britain and
  France were not inclined to do so, a feature of their policy of appeasement to Hitler.
