context: Aristotle provided a philosophical discussion of the concept of a force as an integral part of
  Aristotelian cosmology. In Aristotle's view, the terrestrial sphere contained four elements that come
  to rest at different "natural places" therein. Aristotle believed that motionless objects on Earth,
  those composed mostly of the elements earth and water, to be in their natural place on the ground and
  that they will stay that way if left alone. He distinguished between the innate tendency of objects
  to find their "natural place" (e.g., for heavy bodies to fall), which led to "natural motion", and unnatural
  or forced motion, which required continued application of a force. This theory, based on the everyday
  experience of how objects move, such as the constant application of a force needed to keep a cart moving,
  had conceptual trouble accounting for the behavior of projectiles, such as the flight of arrows. The
  place where the archer moves the projectile was at the start of the flight, and while the projectile
  sailed through the air, no discernible efficient cause acts on it. Aristotle was aware of this problem
  and proposed that the air displaced through the projectile's path carries the projectile to its target.
  This explanation demands a continuum like air for change of place in general.
