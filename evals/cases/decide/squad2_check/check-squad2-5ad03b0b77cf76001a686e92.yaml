context: Some have described the internal strife between various people groups as a form of imperialism
  or colonialism. This internal form is distinct from informal U.S. imperialism in the form of political
  and financial hegemony. This internal form of imperialism is also distinct from the United States' formation
  of "colonies" abroad. Through the treatment of its indigenous peoples during westward expansion, the
  United States took on the form of an imperial power prior to any attempts at external imperialism. This
  internal form of empire has been referred to as "internal colonialism". Participation in the African
  slave trade and the subsequent treatment of its 12 to 15 million Africans is viewed by some to be a
  more modern extension of America's "internal colonialism". However, this internal colonialism faced
  resistance, as external colonialism did, but the anti-colonial presence was far less prominent due to
  the nearly complete dominance that the United States was able to assert over both indigenous peoples
  and African-Americans. In his lecture on April 16, 2003, Edward Said made a bold statement on modern
  imperialism in the United States, whom he described as using aggressive means of attack towards the
  contemporary Orient, "due to their backward living, lack of democracy and the violation of women’s rights.
  The western world forgets during this process of converting the other that enlightenment and democracy
  are concepts that not all will agree upon".
