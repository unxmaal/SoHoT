context: The most useful instrument for analyzing the performance of steam engines is the steam engine
  indicator. Early versions were in use by 1851, but the most successful indicator was developed for the
  high speed engine inventor and manufacturer Charles Porter by Charles Richard and exhibited at London
  Exhibition in 1862. The steam engine indicator traces on paper the pressure in the cylinder throughout
  the cycle, which can be used to spot various problems and calculate developed horsepower. It was routinely
  used by engineers, mechanics and insurance inspectors. The engine indicator can also be used on internal
  combustion engines. See image of indicator diagram below (in Types of motor units section).
