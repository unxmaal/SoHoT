prompt: Check which of these questions the paragraph answers.
context: In England, in the absence of census figures, historians propose a range of preincident population
  figures from as high as 7 million to as low as 4 million in 1300, and a postincident population figure
  as low as 2 million. By the end of 1350, the Black Death subsided, but it never really died out in England.
  Over the next few hundred years, further outbreaks occurred in 1361–62, 1369, 1379–83, 1389–93, and
  throughout the first half of the 15th century. An outbreak in 1471 took as much as 10–15% of the population,
  while the death rate of the plague of 1479–80 could have been as high as 20%. The most general outbreaks
  in Tudor and Stuart England seem to have begun in 1498, 1535, 1543, 1563, 1589, 1603, 1625, and 1636,
  and ended with the Great Plague of London in 1665.
params:
  schema:
    q1:
      type: boolean
      description: 'True only if the paragraph itself states the answer to: What percentage of people
        died during the Great Plague of London in 1665?'
    q2:
      type: boolean
      description: 'True only if the paragraph itself states the answer to: How many people died in the
        outbreak of 1471?'
    q3:
