context: On May 3, 1901, downtown Jacksonville was ravaged by a fire that started as a kitchen fire. Spanish
  moss at a nearby mattress factory was quickly engulfed in flames and enabling the fire to spread rapidly.
  In just eight hours, it swept through 146 city blocks, destroyed over 2,000 buildings, left about 10,000
  homeless and killed 7 residents. The Confederate Monument in Hemming Park was one of the only landmarks
  to survive the fire. Governor Jennings declare martial law and sent the state militia to maintain order.
  On May 17 municipal authority resumed in Jacksonville. It is said the glow from the flames could be
  seen in Savannah, Georgia, and the smoke plumes seen in Raleigh, North Carolina. Known as the "Great
  Fire of 1901", it was one of the worst disasters in Florida history and the largest urban fire in the
  southeastern United States. Architect Henry John Klutho was a primary figure in the reconstruction of
  the city. The first multi-story structure built by Klutho was the Dyal-Upchurch Building in 1902. The
  St. James Building, built on the previous site of the St. James Hotel that burned down, was built in
  1912 as Klutho's crowning achievement.
