context: In the visual arts, the Normans did not have the rich and distinctive traditions of the cultures
  they conquered. However, in the early 11th century the dukes began a programme of church reform, encouraging
  the Cluniac reform of monasteries and patronising intellectual pursuits, especially the proliferation
  of scriptoria and the reconstitution of a compilation of lost illuminated manuscripts. The church was
  utilised by the dukes as a unifying force for their disparate duchy. The chief monasteries taking part
  in this "renaissance" of Norman art and scholarship were Mont-Saint-Michel, Fécamp, Jumièges, Bec, Saint-Ouen,
  Saint-Evroul, and Saint-Wandrille. These centres were in contact with the so-called "Winchester school",
  which channeled a pure Carolingian artistic tradition to Normandy. In the final decade of the 11th and
  first of the 12th century, Normandy experienced a golden age of illustrated manuscripts, but it was
  brief and the major scriptoria of Normandy ceased to function after the midpoint of the century.
