context: Neutrophils and macrophages are phagocytes that travel throughout the body in pursuit of invading
  pathogens. Neutrophils are normally found in the bloodstream and are the most abundant type of phagocyte,
  normally representing 50% to 60% of the total circulating leukocytes. During the acute phase of inflammation,
  particularly as a result of bacterial infection, neutrophils migrate toward the site of inflammation
  in a process called chemotaxis, and are usually the first cells to arrive at the scene of infection.
  Macrophages are versatile cells that reside within tissues and produce a wide array of chemicals including
  enzymes, complement proteins, and regulatory factors such as interleukin 1. Macrophages also act as
  scavengers, ridding the body of worn-out cells and other debris, and as antigen-presenting cells that
  activate the adaptive immune system.
