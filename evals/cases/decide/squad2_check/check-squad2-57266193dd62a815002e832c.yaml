prompt: Check which of these questions the paragraph answers.
context: Seismologists can use the arrival times of seismic waves in reverse to image the interior of
  the Earth. Early advances in this field showed the existence of a liquid outer core (where shear waves
  were not able to propagate) and a dense solid inner core. These advances led to the development of a
  layered model of the Earth, with a crust and lithosphere on top, the mantle below (separated within
  itself by seismic discontinuities at 410 and 660 kilometers), and the outer core and inner core below
  that. More recently, seismologists have been able to create detailed images of wave speeds inside the
  earth in the same way a doctor images a body in a CT scan. These images have led to a much more detailed
  view of the interior of the Earth, and have replaced the simplified layered model with a much more dynamic
  model.
