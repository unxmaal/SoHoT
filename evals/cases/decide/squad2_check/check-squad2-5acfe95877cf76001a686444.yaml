context: Sayyid Abul Ala Maududi was an important early twentieth-century figure in the Islamic revival
  in India, and then after independence from Britain, in Pakistan. Trained as a lawyer he chose the profession
  of journalism, and wrote about contemporary issues and most importantly about Islam and Islamic law.
  Maududi founded the Jamaat-e-Islami party in 1941 and remained its leader until 1972. However, Maududi
  had much more impact through his writing than through his political organising. His extremely influential
  books (translated into many languages) placed Islam in a modern context, and influenced not only conservative
  ulema but liberal modernizer Islamists such as al-Faruqi, whose "Islamization of Knowledge" carried
  forward some of Maududi's key principles.
