prompt: Check which of these questions the paragraph answers.
context: Generally speaking, while all member states recognise that EU law takes primacy over national
  law where this agreed in the Treaties, they do not accept that the Court of Justice has the final say
  on foundational constitutional questions affecting democracy and human rights. In the United Kingdom,
  the basic principle is that Parliament, as the sovereign expression of democratic legitimacy, can decide
  whether it wishes to expressly legislate against EU law. This, however, would only happen in the case
  of an express wish of the people to withdraw from the EU. It was held in R (Factortame Ltd) v Secretary
  of State for Transport that "whatever limitation of its sovereignty Parliament accepted when it enacted
  the European Communities Act 1972 was entirely voluntary" and so "it has always been clear" that UK
  courts have a duty "to override any rule of national law found to be in conflict with any directly enforceable
  rule of Community law." More recently the UK Supreme Court noted that in R (HS2 Action Alliance Ltd)
  v Secretary of State for Transport, although the UK constitution is uncodified, there could be "fundamental
  principles" of common law, and Parliament "did not either contemplate or authorise the abrogation" of
  those principles when it enacted the European Communities Act 1972. The view of the German Constitutional
  Court from the Solange I and Solange II decisions is that if the EU does not comply with its basic constitutional
  rights and principles (particularly democracy, the rule of law and the social state principles) then
  it cannot override German law. However, as the nicknames of the judgments go, "so long as" the EU works
  towards the democratisation of its institutions, and has a framework that protects fundamental human
  rights, it would not review EU legislation for compatibility with German constitutional principles.
  Most other member states have expressed similar reservations. This suggests the EU's legitimacy rests
  on the ultimate authority of member states, its factual commitment to human rights, and the democratic
  will of the people.
