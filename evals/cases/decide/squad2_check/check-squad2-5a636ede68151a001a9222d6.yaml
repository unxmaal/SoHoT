context: Prior to European settlement, the area now constituting Victoria was inhabited by a large number
  of Aboriginal peoples, collectively known as the Koori. With Great Britain having claimed the entire
  Australian continent east of the 135th meridian east in 1788, Victoria was included in the wider colony
  of New South Wales. The first settlement in the area occurred in 1803 at Sullivan Bay, and much of what
  is now Victoria was included in the Port Phillip District in 1836, an administrative division of New
  South Wales. Victoria was officially created a separate colony in 1851, and achieved self-government
  in 1855. The Victorian gold rush in the 1850s and 1860s significantly increased both the population
  and wealth of the colony, and by the Federation of Australia in 1901, Melbourne had become the largest
  city and leading financial centre in Australasia. Melbourne also served as capital of Australia until
  the construction of Canberra in 1927, with the Federal Parliament meeting in Melbourne's Parliament
  House and all principal offices of the federal government being based in Melbourne.
