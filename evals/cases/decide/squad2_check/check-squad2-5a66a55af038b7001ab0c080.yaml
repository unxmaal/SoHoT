context: Along with giving the offender his "just deserts", achieving crime control via incapacitation
  and deterrence is a major goal of criminal punishment. Brownlee argues, "Bringing in deterrence at the
  level of justification detracts from the law’s engagement in a moral dialogue with the offender as a
  rational person because it focuses attention on the threat of punishment and not the moral reasons to
  follow this law." Leonard Hubert Hoffmann writes, "In deciding whether or not to impose punishment,
  the most important consideration would be whether it would do more harm than good. This means that the
  objector has no right not to be punished. It is a matter for the state (including the judges) to decide
  on utilitarian grounds whether to do so or not."
