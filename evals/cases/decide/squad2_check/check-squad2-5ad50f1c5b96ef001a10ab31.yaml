context: Gothic architecture is represented in the majestic churches but also at the burgher houses and
  fortifications. The most significant buildings are St. John's Cathedral (14th century), the temple is
  a typical example of the so-called Masovian gothic style, St. Mary's Church (1411), a town house of
  Burbach family (14th century), Gunpowder Tower (after 1379) and the Royal Castle Curia Maior (1407–1410).
  The most notable examples of Renaissance architecture in the city are the house of Baryczko merchant
  family (1562), building called "The Negro" (early 17th century) and Salwator tenement (1632). The most
  interesting examples of mannerist architecture are the Royal Castle (1596–1619) and the Jesuit Church
  (1609–1626) at Old Town. Among the first structures of the early baroque the most important are St.
  Hyacinth's Church (1603–1639) and Sigismund's Column (1644).
