context: An important factor in the creation of inequality is variation in individuals' access to education.
  Education, especially in an area where there is a high demand for workers, creates high wages for those
  with this education, however, increases in education first increase and then decrease growth as well
  as income inequality. As a result, those who are unable to afford an education, or choose not to pursue
  optional education, generally receive much lower wages. The justification for this is that a lack of
  education leads directly to lower incomes, and thus lower aggregate savings and investment. Conversely,
  education raises incomes and promotes growth because it helps to unleash the productive potential of
  the poor.
