context: The service started on 1 September 1993 based on the idea from the then chief executive officer,
  Sam Chisholm and Rupert Murdoch, of converting the company business strategy to an entirely fee-based
  concept. The new package included four channels formerly available free-to-air, broadcasting on Astra's
  satellites, as well as introducing new channels. The service continued until the closure of BSkyB's
  analogue service on 27 September 2001, due to the launch and expansion of the Sky Digital platform.
  Some of the channels did broadcast either in the clear or soft encrypted (whereby a Videocrypt decoder
  was required to decode, without a subscription card) prior to their addition to the Sky Multichannels
  package. Within two months of the launch, BSkyB gained 400,000 new subscribers, with the majority taking
  at least one premium channel as well, which helped BSkyB reach 3.5 million households by mid-1994. Michael
  Grade criticized the operations in front of the Select Committee on National Heritage, mainly for the
  lack of original programming on many of the new channels.
