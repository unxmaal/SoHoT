context: Michael Oppenheimer, a long-time participant in the IPCC and coordinating lead author of the
  Fifth Assessment Report conceded in Science Magazine's State of the Planet 2008-2009 some limitations
  of the IPCC consensus approach and asks for concurring, smaller assessments of special problems instead
  of the large scale approach as in the previous IPCC assessment reports. It has become more important
  to provide a broader exploration of uncertainties. Others see as well mixed blessings of the drive for
  consensus within the IPCC process and ask to include dissenting or minority positions or to improve
  statements about uncertainties.
