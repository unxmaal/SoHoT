context: Until 1932 the generally accepted length of the Rhine was 1,230 kilometres (764 miles). In 1932
  the German encyclopedia Knaurs Lexikon stated the length as 1,320 kilometres (820 miles), presumably
  a typographical error. After this number was placed into the authoritative Brockhaus Enzyklopädie, it
  became generally accepted and found its way into numerous textbooks and official publications. The error
  was discovered in 2010, and the Dutch Rijkswaterstaat confirms the length at 1,232 kilometres (766 miles).[note
  1]
