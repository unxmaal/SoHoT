prompt: Check which of these questions the paragraph answers.
context: Where CHP is not used, steam turbines in power stations use surface condensers as a cold sink.
  The condensers are cooled by water flow from oceans, rivers, lakes, and often by cooling towers which
  evaporate water to provide cooling energy removal. The resulting condensed hot water output from the
  condenser is then put back into the boiler via a pump. A dry type cooling tower is similar to an automobile
  radiator and is used in locations where water is costly. Evaporative (wet) cooling towers use the rejected
  heat to evaporate water; this water is kept separate from the condensate, which circulates in a closed
  system and returns to the boiler. Such towers often have visible plumes due to the evaporated water
  condensing into droplets carried up by the warm air. Evaporative cooling towers need less water flow
  than "once-through" cooling by river or lake water; a 700 megawatt coal-fired power plant may use about
  3600 cubic metres of make-up water every hour for evaporative cooling, but would need about twenty times
  as much if cooled by river water.[citation needed]
