context: The following table gives the largest known primes of the mentioned types. Some of these primes
  have been found using distributed computing. In 2009, the Great Internet Mersenne Prime Search project
  was awarded a US$100,000 prize for first discovering a prime with at least 10 million digits. The Electronic
  Frontier Foundation also offers $150,000 and $250,000 for primes with at least 100 million digits and
  1 billion digits, respectively. Some of the largest primes not known to have any particular form (that
  is, no simple formula such as that of Mersenne primes) have been found by taking a piece of semi-random
  binary data, converting it to a number n, multiplying it by 256k for some positive integer k, and searching
  for possible primes within the interval [256kn + 1, 256k(n + 1) − 1].[citation needed]
