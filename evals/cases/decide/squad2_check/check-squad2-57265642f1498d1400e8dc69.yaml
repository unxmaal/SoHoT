context: In 1466, perhaps 40,000 people died of the plague in Paris. During the 16th and 17th centuries,
  the plague was present in Paris around 30 per cent of the time. The Black Death ravaged Europe for three
  years before it continued on into Russia, where the disease was present somewhere in the country 25
  times between 1350 to 1490. Plague epidemics ravaged London in 1563, 1593, 1603, 1625, 1636, and 1665,
  reducing its population by 10 to 30% during those years. Over 10% of Amsterdam's population died in
  1623–25, and again in 1635–36, 1655, and 1664. Plague occurred in Venice 22 times between 1361 and 1528.
  The plague of 1576–77 killed 50,000 in Venice, almost a third of the population. Late outbreaks in central
  Europe included the Italian Plague of 1629–1631, which is associated with troop movements during the
  Thirty Years' War, and the Great Plague of Vienna in 1679. Over 60% of Norway's population died in 1348–50.
  The last plague outbreak ravaged Oslo in 1654.
