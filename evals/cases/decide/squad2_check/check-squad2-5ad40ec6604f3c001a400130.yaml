context: Lead fusible plugs may be present in the crown of the boiler's firebox. If the water level drops,
  such that the temperature of the firebox crown increases significantly, the lead melts and the steam
  escapes, warning the operators, who may then manually suppress the fire. Except in the smallest of boilers
  the steam escape has little effect on dampening the fire. The plugs are also too small in area to lower
  steam pressure significantly, depressurizing the boiler. If they were any larger, the volume of escaping
  steam would itself endanger the crew.[citation needed]
