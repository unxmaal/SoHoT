context: In particular, this norm gets smaller when a number is multiplied by p, in sharp contrast to
  the usual absolute value (also referred to as the infinite prime). While completing Q (roughly, filling
  the gaps) with respect to the absolute value yields the field of real numbers, completing with respect
  to the p-adic norm |−|p yields the field of p-adic numbers. These are essentially all possible ways
  to complete Q, by Ostrowski's theorem. Certain arithmetic questions related to Q or more general global
  fields may be transferred back and forth to the completed (or local) fields. This local-global principle
  again underlines the importance of primes to number theory.
