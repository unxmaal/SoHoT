context: The Social Chapter is a chapter of the 1997 Treaty of Amsterdam covering social policy issues
  in European Union law. The basis for the Social Chapter was developed in 1989 by the "social partners"
  representatives, namely UNICE, the employers' confederation, the European Trade Union Confederation
  (ETUC) and CEEP, the European Centre of Public Enterprises. A toned down version was adopted as the
  Social Charter at the 1989 Strasbourg European Council. The Social Charter declares 30 general principles,
  including on fair remuneration of employment, health and safety at work, rights of disabled and elderly,
  the rights of workers, on vocational training and improvements of living conditions. The Social Charter
  became the basis for European Community legislation on these issues in 40 pieces of legislation.
