context: In the modern industrialized world, construction usually involves the translation of designs
  into reality. A formal design team may be assembled to plan the physical proceedings, and to integrate
  those proceedings with the other parts. The design usually consists of drawings and specifications,
  usually prepared by a design team including Architect, civil engineers, mechanical engineers, electrical
  engineers, structural engineers, fire protection engineers, planning consultants, architectural consultants,
  and archaeological consultants. The design team is most commonly employed by (i.e. in contract with)
  the property owner. Under this system, once the design is completed by the design team, a number of
  construction companies or construction management companies may then be asked to make a bid for the
  work, either based directly on the design, or on the basis of drawings and a bill of quantities provided
  by a quantity surveyor. Following evaluation of bids, the owner typically awards a contract to the most
  cost efficient bidder.
