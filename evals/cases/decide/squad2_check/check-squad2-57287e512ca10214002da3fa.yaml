context: Since its invention in 1269, the 'Phags-pa script, a unified script for spelling Mongolian, Tibetan,
  and Chinese languages, was preserved in the court until the end of the dynasty. Most of the Emperors
  could not master written Chinese, but they could generally converse well in the language. The Mongol
  custom of long standing quda/marriage alliance with Mongol clans, the Onggirat, and the Ikeres, kept
  the imperial blood purely Mongol until the reign of Tugh Temur, whose mother was a Tangut concubine.
  The Mongol Emperors had built large palaces and pavilions, but some still continued to live as nomads
  at times. Nevertheless, a few other Yuan emperors actively sponsored cultural activities; an example
