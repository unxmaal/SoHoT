modality: decide
prompt: Check which of these questions the paragraph answers.
context: One theory is that, while disobedience may be helpful, any great amount of it would undermine
  the law by encouraging general disobedience which is neither conscientious nor of social benefit. Therefore,
  conscientious lawbreakers must be punished. Michael Bayles argues that if a person violates a law in
  order to create a test case as to the constitutionality of a law, and then wins his case, then that
  act did not constitute civil disobedience. It has also been argued that breaking the law for self-gratification,
  as in the case of a homosexual or cannabis user who does not direct his act at securing the repeal of
  amendment of the law, is not civil disobedience. Likewise, a protestor who attempts to escape punishment
  by committing the crime covertly and avoiding attribution, or by denying having committed the crime,
  or by fleeing the jurisdiction, is generally viewed as not being a civil disobedient.
params:
  schema:
    q1:
      type: boolean
      description: 'True only if the paragraph itself states the answer to: For what reason would someone
        avoid crimes while protesting?'
    q2:
      type: boolean
      description: 'True only if the paragraph itself states the answer to: Why should someone not commit
        a crime when they are protesting?'
    q3:
