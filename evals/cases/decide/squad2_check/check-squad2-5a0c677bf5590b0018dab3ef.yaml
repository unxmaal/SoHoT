context: Following the Cretaceous–Paleogene extinction event, the extinction of the dinosaurs and the
  wetter climate may have allowed the tropical rainforest to spread out across the continent. From 66–34
  Mya, the rainforest extended as far south as 45°. Climate fluctuations during the last 34 million years
  have allowed savanna regions to expand into the tropics. During the Oligocene, for example, the rainforest
  spanned a relatively narrow band. It expanded again during the Middle Miocene, then retracted to a mostly
  inland formation at the last glacial maximum. However, the rainforest still managed to thrive during
  these glacial periods, allowing for the survival and evolution of a broad diversity of species.
