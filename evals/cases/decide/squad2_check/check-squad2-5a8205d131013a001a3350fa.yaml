context: Charles W. Eliot, president 1869–1909, eliminated the favored position of Christianity from the
  curriculum while opening it to student self-direction. While Eliot was the most crucial figure in the
  secularization of American higher education, he was motivated not by a desire to secularize education,
  but by Transcendentalist Unitarian convictions. Derived from William Ellery Channing and Ralph Waldo
  Emerson, these convictions were focused on the dignity and worth of human nature, the right and ability
  of each person to perceive truth, and the indwelling God in each person.
