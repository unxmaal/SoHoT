context: When the Committee for Non-Violent Action sponsored a protest in August 1957, at the Camp Mercury
  nuclear test site near Las Vegas, Nevada, 13 of the protesters attempted to enter the test site knowing
  that they faced arrest. At a pre-arranged announced time, one at a time they stepped across the "line"
  and were immediately arrested. They were put on a bus and taken to the Nye County seat of Tonopah, Nevada,
  and arraigned for trial before the local Justice of the Peace, that afternoon. A well known civil rights
  attorney, Francis Heisler, had volunteered to defend the arrested persons, advising them to plead "nolo
  contendere", as an alternative to pleading either guilty or not-guilty. The arrested persons were found
  "guilty," nevertheless, and given suspended sentences, conditional on their not reentering the test
  site grounds.[citation needed]
