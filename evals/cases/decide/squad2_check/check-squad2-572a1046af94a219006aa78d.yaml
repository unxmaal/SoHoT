context: Economist Joseph Stiglitz presented evidence in 2009 that both global inequality and inequality
  within countries prevent growth by limiting aggregate demand. Economist Branko Milanovic, wrote in 2001
  that, "The view that income inequality harms growth – or that improved equality can help sustain growth
  – has become more widely held in recent years. ... The main reason for this shift is the increasing
  importance of human capital in development. When physical capital mattered most, savings and investments
  were key. Then it was important to have a large contingent of rich people who could save a greater proportion
  of their income than the poor and invest it in physical capital. But now that human capital is scarcer
  than machines, widespread education has become the secret to growth."
