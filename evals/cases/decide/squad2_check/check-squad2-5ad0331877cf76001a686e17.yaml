  Riverside Counties (the non-desert portions) were developed in the 1980s and 1990s. Newly developed
  exurbs formed in the Antelope Valley north of Los Angeles, the Victor Valley and the Coachella Valley
  with the Imperial Valley. Also, population growth was high in the Bakersfield-Kern County, Santa Maria
  and San Luis Obispo areas.
