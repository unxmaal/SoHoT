context: In 1854 at Ballarat there was an armed rebellion against the government of Victoria by miners
  protesting against mining taxes (the "Eureka Stockade"). This was crushed by British troops, but the
  discontents prompted colonial authorities to reform the administration (particularly reducing the hated
  mining licence fees) and extend the franchise. Within a short time, the Imperial Parliament granted
  Victoria responsible government with the passage of the Colony of Victoria Act 1855. Some of the leaders
  of the Eureka rebellion went on to become members of the Victorian Parliament.
