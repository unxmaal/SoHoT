context: The official record high temperature for Fresno is 115 °F (46.1 °C), set on July 8, 1905, while
  the official record low is 17 °F (−8 °C), set on January 6, 1913. The average windows for 100 °F (37.8
  °C)+, 90 °F (32.2 °C)+, and freezing temperatures are June 1 thru September 13, April 26 thru October
  9, and December 10 thru January 28, respectively, and no freeze occurred between in the 1983/1984 season.
  Annual rainfall has ranged from 23.57 inches (598.7 mm) in the “rain year” from July 1982 to June 1983
  down to 4.43 inches (112.5 mm) from July 1933 to June 1934. The most rainfall in one month was 9.54
  inches (242.3 mm) in November 1885 and the most rainfall in 24 hours 3.55 inches (90.2 mm) on November
  18, 1885. Measurable precipitation falls on an average of 48 days annually. Snow is a rarity; the heaviest
  snowfall at the airport was 2.2 inches (0.06 m) on January 21, 1962.
