context: The steam engine contributed much to the development of thermodynamic theory; however, the only
  applications of scientific theory that influenced the steam engine were the original concepts of harnessing
  the power of steam and atmospheric pressure and knowledge of properties of heat and steam. The experimental
  measurements made by Watt on a model steam engine led to the development of the separate condenser.
  Watt independently discovered latent heat, which was confirmed by the original discoverer Joseph Black,
  who also advised Watt on experimental procedures. Watt was also aware of the change in the boiling point
  of water with pressure. Otherwise, the improvements to the engine itself were more mechanical in nature.
  The thermodynamic concepts of the Rankine cycle did give engineers the understanding needed to calculate
  efficiency which aided the development of modern high-pressure and -temperature boilers and the steam
  turbine.
