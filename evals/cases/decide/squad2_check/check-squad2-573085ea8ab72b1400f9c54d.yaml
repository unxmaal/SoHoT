modality: decide
prompt: Check which of these questions the paragraph answers.
context: Imperialism and colonialism both dictate the political and economic advantage over a land and
  the indigenous populations they control, yet scholars sometimes find it difficult to illustrate the
  difference between the two. Although imperialism and colonialism focus on the suppression of an other,
  if colonialism refers to the process of a country taking physical control of another, imperialism refers
  to the political and monetary dominance, either formally or informally. Colonialism is seen to be the
  architect deciding how to start dominating areas and then imperialism can be seen as creating the idea
  behind conquest cooperating with colonialism. Colonialism is when the imperial nation begins a conquest
  over an area and then eventually is able to rule over the areas the previous nation had controlled.
  Colonialism's core meaning is the exploitation of the valuable assets and supplies of the nation that
  was conquered and the conquering nation then gaining the benefits from the spoils of the war. The meaning
  of imperialism is to create an empire, by conquering the other state's lands and therefore increasing
  its own dominance. Colonialism is the builder and preserver of the colonial possessions in an area by
  a population coming from a foreign region. Colonialism can completely change the existing social structure,
  physical structure and economics of an area; it is not unusual that the characteristics of the conquering
  peoples are inherited by the conquered indigenous populations.
