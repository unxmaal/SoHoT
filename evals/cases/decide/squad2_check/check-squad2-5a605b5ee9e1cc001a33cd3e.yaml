context: Starting in 1965, Donald Davies at the National Physical Laboratory, UK, independently developed
  the same message routing methodology as developed by Baran. He called it packet switching, a more accessible
  name than Baran's, and proposed to build a nationwide network in the UK. He gave a talk on the proposal
  in 1966, after which a person from the Ministry of Defence (MoD) told him about Baran's work. A member
  of Davies' team (Roger Scantlebury) met Lawrence Roberts at the 1967 ACM Symposium on Operating System
  Principles and suggested it for use in the ARPANET.
