prompt: Check which of these questions the paragraph answers.
context: A B cell identifies pathogens when antibodies on its surface bind to a specific foreign antigen.
  This antigen/antibody complex is taken up by the B cell and processed by proteolysis into peptides.
  The B cell then displays these antigenic peptides on its surface MHC class II molecules. This combination
  of MHC and antigen attracts a matching helper T cell, which releases lymphokines and activates the B
  cell. As the activated B cell then begins to divide, its offspring (plasma cells) secrete millions of
  copies of the antibody that recognizes this antigen. These antibodies circulate in blood plasma and
  lymph, bind to pathogens expressing the antigen and mark them for destruction by complement activation
  or for uptake and destruction by phagocytes. Antibodies can also neutralize challenges directly, by
  binding to bacterial toxins or by interfering with the receptors that viruses and bacteria use to infect
  cells.
