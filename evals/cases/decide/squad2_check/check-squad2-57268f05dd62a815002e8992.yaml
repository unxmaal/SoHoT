context: The early Cambrian sessile frond-like fossil Stromatoveris, from China's Chengjiang lagerstätte
  and dated to about 515 million years ago, is very similar to Vendobionta of the preceding Ediacaran
  period. De-Gan Shu, Simon Conway Morris et al. found on its branches what they considered rows of cilia,
  used for filter feeding. They suggested that Stromatoveris was an evolutionary "aunt" of ctenophores,
  and that ctenophores originated from sessile animals whose descendants became swimmers and changed the
  cilia from a feeding mechanism to a propulsion system.
