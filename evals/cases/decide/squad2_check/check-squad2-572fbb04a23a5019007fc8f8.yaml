context: As a member of the Scottish Parliamentary Corporate Body, the Presiding Officer is responsible
  for ensuring that the Parliament functions effectively and has the staff, property and resources it
  requires to operate. Convening the Parliamentary Bureau, which allocates time and sets the work agenda
  in the chamber, is another of the roles of the Presiding Officer. Under the Standing Orders of the Parliament
  the Bureau consists of the Presiding Officer and one representative from each political parties with
  five or more seats in the Parliament. Amongst the duties of the Bureau are to agree the timetable of
  business in the chamber, establish the number, remit and membership of parliamentary committees and
  regulate the passage of legislation (bills) through the Parliament. The Presiding Officer also represents
  the Scottish Parliament at home and abroad in an official capacity.
