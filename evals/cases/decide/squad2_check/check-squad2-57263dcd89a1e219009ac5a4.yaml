context: The CYCLADES packet switching network was a French research network designed and directed by
  Louis Pouzin. First demonstrated in 1973, it was developed to explore alternatives to the early ARPANET
  design and to support network research generally. It was the first network to make the hosts responsible
  for reliable delivery of data, rather than the network itself, using unreliable datagrams and associated
  end-to-end protocol mechanisms. Concepts of this network influenced later ARPANET architecture.
