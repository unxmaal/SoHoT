context: While many homes in the neighborhood date back to the 1930s or before, the neighborhood is also
  home to several public housing developments built between the 1960s and 1990s by the Fresno Housing
  Authority. The US Department of Housing and Urban Development has also built small subdivisions of single-family
  homes in the area for purchase by low-income working families. There have been numerous attempts to
  revitalize the neighborhood, including the construction of a modern shopping center on the corner of
  Fresno and B streets, an aborted attempt to build luxury homes and a golf course on the western edge
  of the neighborhood, and some new section 8 apartments have been built along Church Ave west of Elm
  St. Cargill Meat Solutions and Foster Farms both have large processing facilities in the neighborhood,
  and the stench from these (and other small industrial facilities) has long plagued area residents. The
  Fresno Chandler Executive Airport is also on the West Side. Due to its position on the edge of the city
  and years of neglect by developers, is not a true "inner-city" neighborhood, and there are many vacant
  lots, strawberry fields and vineyards throughout the neighborhood. The neighborhood has very little
  retail activity, aside from the area near Fresno Street and State Route 99 Freeway (Kearney Palm Shopping
  Center, built in the late 1990s) and small corner markets scattered throughout.
