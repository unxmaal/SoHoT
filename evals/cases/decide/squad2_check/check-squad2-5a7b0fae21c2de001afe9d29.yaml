context: The popular neighborhood known as the Tower District is centered around the historic Tower Theatre,
  which is included on the National List of Historic Places. The theater was built in 1939 and is at Olive
  and Wishon Avenues in the heart of the Tower District. (The name of the theater refers to a well-known
  landmark water tower, which is actually in another nearby area). The Tower District neighborhood is
  just north of downtown Fresno proper, and one-half mile south of Fresno City College. Although the neighborhood
  was known as a residential area prior, the early commercial establishments of the Tower District began
  with small shops and services that flocked to the area shortly after World War II. The character of
  small local businesses largely remains today. To some extent, the businesses of the Tower District were
  developed due to the proximity of the original Fresno Normal School, (later renamed California State
  University at Fresno). In 1916 the college moved to what is now the site of Fresno City College one-half
  mile north of the Tower District.
