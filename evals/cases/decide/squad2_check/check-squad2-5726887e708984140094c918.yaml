context: 'Almost all ctenophores are predators – there are no vegetarians and only one genus that is partly
  parasitic. If food is plentiful, they can eat 10 times their own weight per day. While Beroe preys mainly
  on other ctenophores, other surface-water species prey on zooplankton (planktonic animals) ranging in
  size from the microscopic, including mollusc and fish larvae, to small adult crustaceans such as copepods,
  amphipods, and even krill. Members of the genus Haeckelia prey on jellyfish and incorporate their prey''s
  nematocysts (stinging cells) into their own tentacles instead of colloblasts. Ctenophores have been
  compared to spiders in their wide range of techniques from capturing prey – some hang motionless in
  the water using their tentacles as "webs", some are ambush predators like Salticid jumping spiders,
  and some dangle a sticky droplet at the end of a fine thread, as bolas spiders do. This variety explains
  the wide range of body forms in a phylum with rather few species. The two-tentacled "cydippid" Lampea
  feeds exclusively on salps, close relatives of sea-squirts that form large chain-like floating colonies,
  and juveniles of Lampea attach themselves like parasites to salps that are too large for them to swallow.
  Members of the cydippid genus Pleurobrachia and the lobate Bolinopsis often reach high population densities
  at the same place and time because they specialize in different types of prey: Pleurobrachia''s long
  tentacles mainly capture relatively strong swimmers such as adult copepods, while Bolinopsis generally
  feeds on smaller, weaker swimmers such as rotifers and mollusc and crustacean larvae.'
