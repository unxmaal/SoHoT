context: Civil disobedience is usually defined as pertaining to a citizen's relation to the state and
  its laws, as distinguished from a constitutional impasse in which two public agencies, especially two
  equally sovereign branches of government, conflict. For instance, if the head of government of a country
  were to refuse to enforce a decision of that country's highest court, it would not be civil disobedience,
  since the head of government would be acting in her or his capacity as public official rather than private
  citizen.
