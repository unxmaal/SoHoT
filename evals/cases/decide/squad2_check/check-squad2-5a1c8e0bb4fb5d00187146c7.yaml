context: Jacksonville has suffered less damage from hurricanes than most other east coast cities, although
  the threat does exist for a direct hit by a major hurricane. The city has only received one direct hit
  from a hurricane since 1871; however, Jacksonville has experienced hurricane or near-hurricane conditions
  more than a dozen times due to storms crossing the state from the Gulf of Mexico to the Atlantic Ocean,
  or passing to the north or south in the Atlantic and brushing past the area. The strongest effect on
  Jacksonville was from Hurricane Dora in 1964, the only recorded storm to hit the First Coast with sustained
  hurricane-force winds. The eye crossed St. Augustine with winds that had just barely diminished to 110
  mph (180 km/h), making it a strong Category 2 on the Saffir-Simpson Scale. Jacksonville also suffered
  damage from 2008's Tropical Storm Fay which crisscrossed the state, bringing parts of Jacksonville under
  darkness for four days. Similarly, four years prior to this, Jacksonville was inundated by Hurricane
  Frances and Hurricane Jeanne, which made landfall south of the area. These tropical cyclones were the
  costliest indirect hits to Jacksonville. Hurricane Floyd in 1999 caused damage mainly to Jacksonville
  Beach. During Floyd, the Jacksonville Beach pier was severely damaged, and later demolished. The rebuilt
  pier was later damaged by Fay, but not destroyed. Tropical Storm Bonnie would cause minor damage in
  2004, spawning a minor tornado in the process. On May 28, 2012, Jacksonville was hit by Tropical Storm
  Beryl, packing winds up to 70 miles per hour (113 km/h) which made landfall near Jacksonville Beach.
