context: Howard Zinn writes, "There may be many times when protesters choose to go to jail, as a way of
  continuing their protest, as a way of reminding their countrymen of injustice. But that is different
  than the notion that they must go to jail as part of a rule connected with civil disobedience. The key
  point is that the spirit of protest should be maintained all the way, whether it is done by remaining
  in jail, or by evading it. To accept jail penitently as an accession to 'the rules' is to switch suddenly
  to a spirit of subservience, to demean the seriousness of the protest...In particular, the neo-conservative
  insistence on a guilty plea should be eliminated."
