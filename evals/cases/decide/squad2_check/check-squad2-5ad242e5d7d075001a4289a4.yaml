id: check-squad2-5ad242e5d7d075001a4289a4
modality: decide
prompt: Check which of these questions the paragraph answers.
context: 'A study by the World Institute for Development Economics Research at United Nations University
  reports that the richest 1% of adults alone owned 40% of global assets in the year 2000. The three richest
  people in the world possess more financial assets than the lowest 48 nations combined. The combined
  wealth of the "10 million dollar millionaires" grew to nearly $41 trillion in 2008. A January 2014 report
  by Oxfam claims that the 85 wealthiest individuals in the world have a combined wealth equal to that
  of the bottom 50% of the world''s population, or about 3.5 billion people. According to a Los Angeles
  Times analysis of the report, the wealthiest 1% owns 46% of the world''s wealth; the 85 richest people,
  a small part of the wealthiest 1%, own about 0.7% of the human population''s wealth, which is the same
  as the bottom half of the population. More recently, in January 2015, Oxfam reported that the wealthiest
  1 percent will own more than half of the global wealth by 2016. An October 2014 study by Credit Suisse
  also claims that the top 1% now own nearly half of the world''s wealth and that the accelerating disparity
  could trigger a recession. In October 2015, Credit Suisse published a study which shows global inequality
  continues to increase, and that half of the world''s wealth is now in the hands of those in the top
  percentile, whose assets each exceed $759,900. A 2016 report by Oxfam claims that the 62 wealthiest
  individuals own as much wealth as the poorer half of the global population combined. Oxfam''s claims
  have however been questioned on the basis of the methodology used: by using net wealth (adding up assets
  and subtracting debts), the Oxfam report, for instance, finds that there are more poor people in the
  United States and Western Europe than in China (due to a greater tendency to take on debts).[unreliable
  source?][unreliable source?] Anthony Shorrocks, the lead author of the Credit Suisse report which is
  one of the sources of Oxfam''s data, considers the criticism about debt to be a "silly argument" and
  "a non-issue . . . a diversion."'
