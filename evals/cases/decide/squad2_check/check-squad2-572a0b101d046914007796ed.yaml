context: In 2005, parts of the Amazon basin experienced the worst drought in one hundred years, and there
  were indications that 2006 could have been a second successive year of drought. A July 23, 2006 article
  in the UK newspaper The Independent reported Woods Hole Research Center results showing that the forest
  in its present form could survive only three years of drought. Scientists at the Brazilian National
  Institute of Amazonian Research argue in the article that this drought response, coupled with the effects
  of deforestation on regional climate, are pushing the rainforest towards a "tipping point" where it
  would irreversibly start to die. It concludes that the forest is on the brink of being turned into savanna
  or desert, with catastrophic consequences for the world's climate.
