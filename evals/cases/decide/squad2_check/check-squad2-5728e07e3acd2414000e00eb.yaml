context: 'Non-revolutionary civil disobedience is a simple disobedience of laws on the grounds that they
  are judged "wrong" by an individual conscience, or as part of an effort to render certain laws ineffective,
  to cause their repeal, or to exert pressure to get one''s political wishes on some other issue. Revolutionary
  civil disobedience is more of an active attempt to overthrow a government (or to change cultural traditions,
  social customs, religious beliefs, etc...revolution doesn''t have to be political, i.e. "cultural revolution",
  it simply implies sweeping and widespread change to a section of the social fabric). Gandhi''s acts
  have been described as revolutionary civil disobedience. It has been claimed that the Hungarians under
  Ferenc Deák directed revolutionary civil disobedience against the Austrian government. Thoreau also
  wrote of civil disobedience accomplishing "peaceable revolution." Howard Zinn, Harvey Wheeler, and others
  have identified the right espoused in The Declaration of Independence to "alter or abolish" an unjust
  government to be a principle of civil disobedience. '
