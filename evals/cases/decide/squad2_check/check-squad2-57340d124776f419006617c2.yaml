context: For many native populations, the elimination of French power in North America meant the disappearance
  of a strong ally and counterweight to British expansion, leading to their ultimate dispossession. The
  Ohio Country was particularly vulnerable to legal and illegal settlement due to the construction of
  military roads to the area by Braddock and Forbes. Although the Spanish takeover of the Louisiana territory
  (which was not completed until 1769) had modest repercussions, the British takeover of Spanish Florida
  resulted in the westward migration of tribes that did not want to do business with the British, and
  a rise in tensions between the Choctaw and the Creek, historic enemies whose divisions the British at
  times exploited. The change of control in Florida also prompted most of its Spanish Catholic population
  to leave. Most went to Cuba, including the entire governmental records from St. Augustine, although
  some Christianized Yamasee were resettled to the coast of Mexico.
