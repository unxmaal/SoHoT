prompt: Check which of these questions the paragraph answers.
context: 'The Yuan dynasty was the first time that non-native Chinese people ruled all of China. In the
  historiography of Mongolia, it is generally considered to be the continuation of the Mongol Empire.
  Mongols are widely known to worship the Eternal Heaven, and according to the traditional Mongolian ideology
  Yuan is considered to be "the beginning of an infinite number of beings, the foundation of peace and
  happiness, state power, the dream of many peoples, besides it there is nothing great or precious." In
  traditional historiography of China, on the other hand, the Yuan dynasty is usually considered to be
  the legitimate dynasty between the Song dynasty and the Ming dynasty. Note, however, Yuan dynasty is
  traditionally often extended to cover the Mongol Empire before Kublai Khan''s formal establishment of
  the Yuan in 1271, partly because Kublai had his grandfather Genghis Khan placed on the official record
  as the founder of the dynasty or Taizu (Chinese: 太祖). Despite the traditional historiography as well
  as the official views (including the government of the Ming dynasty which overthrew the Yuan dynasty),
  there also exist Chinese people[who?] who did not consider the Yuan dynasty as a legitimate dynasty
  of China, but rather as a period of foreign domination. The latter believe that Han Chinese were treated
  as second-class citizens,[citation needed] and that China stagnated economically and scientifically.'
params:
  schema:
    q1:
      type: boolean
      description: 'True only if the paragraph itself states the answer to: What illegitimate dynasty
        came before the Yuan?'
    q2:
      type: boolean
      description: 'True only if the paragraph itself states the answer to: Some Chinese considered the
