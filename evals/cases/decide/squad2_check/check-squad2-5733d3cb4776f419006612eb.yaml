context: The conflict is known by multiple names. In British America, wars were often named after the
  sitting British monarch, such as King William's War or Queen Anne's War. As there had already been a
  King George's War in the 1740s, British colonists named the second war in King George's reign after
  their opponents, and it became known as the French and Indian War. This traditional name continues as
  the standard in the United States, but it obscures the fact that Indians fought on both sides of the
  conflict, and that this was part of the Seven Years' War, a much larger conflict between France and
  Great Britain. American historians generally use the traditional name or sometimes the Seven Years'
  War. Other, less frequently used names for the war include the Fourth Intercolonial War and the Great
  War for the Empire.
