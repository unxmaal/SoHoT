prompt: Check which of these questions the paragraph answers.
context: 'For instance, while traveling in a moving vehicle at a constant velocity, the laws of physics
  do not change from being at rest. A person can throw a ball straight up in the air and catch it as it
  falls down without worrying about applying a force in the direction the vehicle is moving. This is true
  even though another person who is observing the moving vehicle pass by also observes the ball follow
  a curving parabolic path in the same direction as the motion of the vehicle. It is the inertia of the
  ball associated with its constant velocity in the direction of the vehicle''s motion that ensures the
  ball continues to move forward even as it is thrown up and falls back down. From the perspective of
  the person in the car, the vehicle and everything inside of it is at rest: It is the outside world that
  is moving with a constant speed in the opposite direction. Since there is no experiment that can distinguish
  whether it is the vehicle that is at rest or the outside world that is at rest, the two situations are
  considered to be physically indistinguishable. Inertia therefore applies equally well to constant velocity
  motion as it does to rest.'
