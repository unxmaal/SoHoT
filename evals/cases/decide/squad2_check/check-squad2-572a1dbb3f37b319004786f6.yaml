context: Firstly, certain costs are difficult to avoid and are shared by everyone, such as the costs of
  housing, pensions, education and health care. If the state does not provide these services, then for
  those on lower incomes, the costs must be borrowed and often those on lower incomes are those who are
  worse equipped to manage their finances. Secondly, aspirational consumption describes the process of
  middle income earners aspiring to achieve the standards of living enjoyed by their wealthier counterparts
  and one method of achieving this aspiration is by taking on debt. The result leads to even greater inequality
  and potential economic instability.
