context: The IPCC receives funding through the IPCC Trust Fund, established in 1989 by the United Nations
  Environment Programme (UNEP) and the World Meteorological Organization (WMO), Costs of the Secretary
  and of housing the secretariat are provided by the WMO, while UNEP meets the cost of the Depute Secretary.
  Annual cash contributions to the Trust Fund are made by the WMO, by UNEP, and by IPCC Members; the scale
  of payments is determined by the IPCC Panel, which is also responsible for considering and adopting
  by consensus the annual budget. The organisation is required to comply with the Financial Regulations
  and Rules of the WMO.
