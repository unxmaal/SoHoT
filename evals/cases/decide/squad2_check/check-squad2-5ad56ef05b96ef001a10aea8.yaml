context: What intractability means in practice is open to debate. Saying that a problem is not in P does
  not imply that all large cases of the problem are hard or even that most of them are. For example, the
  decision problem in Presburger arithmetic has been shown not to be in P, yet algorithms have been written
  that solve the problem in reasonable times in most cases. Similarly, algorithms can solve the NP-complete
  knapsack problem over a wide range of sizes in less than quadratic time and SAT solvers routinely handle
  large instances of the NP-complete Boolean satisfiability problem.
