context: The reason for the majority rule is the high risk of a conflict of interest and/or the avoidance
  of absolute powers. Otherwise, the physician has a financial self-interest in "diagnosing" as many conditions
  as possible, and in exaggerating their seriousness, because he or she can then sell more medications
  to the patient. Such self-interest directly conflicts with the patient's interest in obtaining cost-effective
  medication and avoiding the unnecessary use of medication that may have side-effects. This system reflects
  much similarity to the checks and balances system of the U.S. and many other governments.[citation needed]
