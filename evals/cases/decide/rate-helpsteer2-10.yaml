modality: decide
prompt: Rate the assistant response to the prompt on each attribute.
context: 'PROMPT:

  write a letter of recommendation in defense of  a man in a criminal trial from the perspective of a
  restaurant owner of a neighborhood deli who had employed him for 5 years as a delivery driver, and has
  known him and his family for close to 20 years. Make the tone semi formal from a hs education level


  RESPONSE:

  Dear [Name of Judge],


  I am writing to you today to provide a letter of recommendation for [Name of Defendant], who is currently
  facing criminal charges. I have known [Name of Defendant] for close to 20 years, as he has been a delivery
  driver for my restaurant, [Name of Restaurant], for the past 5 years.


  I can confidently say that [Name of Defendant] is a hardworking and honest man who has always conducted
  himself in a professional manner. He has been a reliable and trustworthy employee, and I have never
  had any issues with him during his time at my restaurant.


  Not only is [Name of Defendant] a dedicated worker, but he is also a devoted family man. He has been
  married for over 15 years and has two children who are both in high school. He is very active in the
  community and is known for his volunteer work with local charities.


  I strongly believe that [Name of Defendant] is innocent of the charges brought against him, and I am
  confident that he will continue to be a positive member of our community. I hope that you will take
  my recommendation into consideration as you make your decision in this case.


  Thank you for your time and consideration.


  Sincerely,


  [Your Name]'
