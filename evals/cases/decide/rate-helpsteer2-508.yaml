prompt: Rate the assistant response to the prompt on each attribute.
context: 'PROMPT:

  if the crypto nft collection project is based on Japansese ninja warriors then can you suggest some
  rarity level terminalogies


  RESPONSE:

  Sure, here are some rarity level terminologies that you could use for a crypto NFT collection project
  based on Japanese ninja warriors:


  1. Novice: The most common and basic level of ninja warriors, these are the newcomers to the ninja world.

  2. Apprentice: A level up from Novice, these ninja warriors have started their training and are developing
  their skills.

  3. Skilled: These ninja warriors have honed their skills and are considered proficient in their techniques.

  4. Elite: A rare and exclusive group of ninja warriors who have mastered their craft and are known for
  their exceptional abilities.

  5. Legendary: The rarest and most sought-after level of ninja warriors, these are the stuff of legends
  and have achieved mythical status in the ninja world.

  6. Master: The highest level of achievement, these ninja warriors have not only mastered their own skills
  but have also trained and mentored others to become skilled in the ways of the ninja.

  7. Shadow: A mysterious and elusive level of ninja warriors, these are the spies and assassins who operate
  in the shadows and are known for their ability to strike unseen and vanish without a trace.

  8. Samurai: A special class of warrior, these are the noble and honorable warriors who serve as protectors
  of the realm and are bound by a strict code of honor and conduct.

  9. Shogun: The military dictator of Japan, these are the ultimate leaders of the ninja world, with unmatched
  power and authority.

  10. Kami: A divine or supernatural being, these are the rarest and most powerful of all ninja warriors,
  with abilities that border on the mystical and otherworldly.'
