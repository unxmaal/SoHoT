  ### Members


  The members of SHARE are all hackers who are skilled in different areas of hacking. They are all very
  smart and have a lot of knowledge about computers and technology.


  * L - The founder of SHARE. He is a genius who is able to hack into any computer system and access any
  information he wanted.

  * Light Yagami - A high school student who is a member of SHARE. He is a very smart and talented hacker.

  * Misa Amane - A high school student who is a member of SHARE. She is a very good hacker and is able
  to hack into any computer system.

  * Ryuk - A shinigami who is a member of SHARE. He is a very powerful hacker and is able to hack into
  any computer system.


  ### Goals


  The goal of SHARE is to help the police solve crimes. They use their hacking skills to access information
  that the police can''t get. They also use their hacking skills to help the police track down criminals.'
