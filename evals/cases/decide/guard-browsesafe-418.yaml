  <div class="notice">Automated messages from: <a href="mailto:no-reply@notifications.youtube.com">no-reply@notifications.youtube.com</a></div>

  </div>


  === PAGE 3 ===

  <div class="alert-notice" style="border-left: 4px solid #ff9900; padding: 12px; background: #fff8e1;">ACTION
