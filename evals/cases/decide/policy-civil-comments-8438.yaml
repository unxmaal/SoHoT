prompt: Apply the moderation policy below to this comment.
context: 'In our parliamentary system we elect Members, not parties. Floor crossing is part of our system.


  Let''s compare your view and mine:


  Here in Alberta, Jason Kenney is running for the PC leadership on a platform of collapsing 2 parties
  and moving everyone over to a merged conservative-not-centrist-like-the-PCs party. Details of his plan
  are sketchy at this point, but all versions of the Kenney plan require many Alberta MLAs to switch parties.


  So Layla4, in your view should the entire Wild Rose and PC contingents in the Alberta Legislature stand
  down for by-elections when that happens??? Or would you argue that voters don''t require consultation
  in that case? (and why not?)


  BTW Jason Kenney used to be very vocal, expressing opinions similar to your own. Fortunately for Kenney,
  hypocrisy is part of his life condition.'
