context: 'PROMPT:

  I want to detect Lactose intolerance with metal oxide semiconductors. What is the concentration of each
  breath biomarker for this disease?


  RESPONSE:

  Lactose intolerance is a condition where the body is unable to digest lactose, a sugar found in milk
  and other dairy products. This can lead to symptoms such as bloating, gas, and diarrhea. One way to
  detect lactose intolerance is by measuring the concentration of breath biomarkers, such as hydrogen
  and methane, using metal oxide semiconductors.


  When lactose is not digested properly in the small intestine, it passes into the large intestine where
  it is fermented by bacteria. This fermentation process produces hydrogen and methane gas, which can
  be detected in the breath. In individuals with lactose intolerance, the concentration of hydrogen and
  methane in the breath will be higher than normal after consuming lactose-containing foods.


  The normal concentration of hydrogen in the breath is less than 10 parts per million (ppm). A rise in
  hydrogen concentration of 20 ppm or more above the baseline level is considered a positive result for
  lactose intolerance. The normal concentration of methane in the breath is less than 3 ppm. A rise in
  methane concentration of 10 ppm or more above the baseline level is also considered a positive result
  for lactose intolerance.


  It is important to note that breath testing for lactose intolerance is not a perfect diagnostic tool
  and may produce false positive or false negative results. Therefore, it is important to consult with
  a healthcare professional to determine the best course of action for diagnosing and managing lactose
  intolerance.'
