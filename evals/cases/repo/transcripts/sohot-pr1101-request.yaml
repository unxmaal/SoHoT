  - harness/identity.py
  interface:
  - 'harness.identity.grader_digest(lane: str, *, root=None, packages=GRADER_PACKAGES, registry=CHECKER_REGISTRY,
    also=SCORE_ENTRY) -> dict'
  stated: '`grader_digest` parses source with `ast` under `root` (default: the repo root) and imports
    nothing. The walk starts at the lane''s value in the dict literal that `registry` names as (module,
    attribute), default `("evals.core", "CHECKERS")`, plus each `(module, name)` in `also`, default `(("evals.core",
    "score"),)`; `packages` defaults to `("harness", "evals")`. The walk follows the names and attribute
    chains reached code uses, through imports at module level or inside function bodies, into modules
    of `packages`, and hashes each reached top-level statement only, so an unreached function, or a module
    imported but never used, changes nothing. The result is `{"modules": [...], "names": {"<module>:<name>":
    sha256}}`, `modules` being the sorted modules with a hashed statement. The exam part holds `grader`
    (the `names` map) and `grader_modules`. The registry statement is hashed only as the lane''s own entry,
    under the key `<module>:<attr>[<lane>]` (such as `evals.core:CHECKERS[code]`), and is then treated
    as visited, so code that names the whole registry, as `score` does, never reaches the other lanes''
    checkers.'
