    list[str]'
  stated: '`screenable_backlog` leaves out a ready candidate whose newest verdict is a screen-tier memory
    deferral (`reasons.MEMORY`); a later verdict of any other kind makes it backlog again. `deferred`,
    when given, is a name predicate used instead of reading the store. `memory_deferrals` walks a name''s
    verdicts newest first and counts consecutive screen memory deferrals whose detail names the same `needs
    <N> GB` figure, stopping at any other verdict or figure; it returns the count and the figure as a
    string, e.g. `(3, "26.5")`, else `(0, "")`. The screen `limit` counts only screens actually started,
    so a deferral takes no slot. When the current refusal names the same figure and the count is already
    3 (`MEMORY_DEFERRALS`), the screen writes no new verdict.'
