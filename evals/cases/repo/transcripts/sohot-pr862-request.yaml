  stated: '`pair_block` asks `home(candidate, gateway)` for (server, model, how many models that server
    holds at once, `None` for no limit), skips candidates with an empty server or model, and returns 1
    when every server''s distinct models fit its limit, else `PAIR_BLOCK`; any `ds4:` candidate gives
    `None`. `paired_segments` cuts `order` (case ids in run order) into windows of `block` positions,
    gives each candidate in turn its cases from `rest` (matched through `key`) inside the window, merges
    consecutive turns of one candidate, and returns (candidate index, cases) pairs; a falsy `block` returns
    each non-empty `rest` whole. `_execute` calls `pair_block(candidates, args.gateway)` positionally
    and runs those turns; a runner warms on its first turn, and on later turns only when `block` is not
    1.'
