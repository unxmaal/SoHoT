prompt: '# Piece C: one-way DB→git review mirror (gap 5, reviewability)


  Part of the **mcm v3 Foundation Quad** (`mcm_v3_plan.md`, Piece C). A one-way DB→git review mirror:
  replay the DB into a git repo of markdown for audit/review (`git blame`, diff, PR review) — never authoritative,
  never writes `rules_paths`.


  ## Depends on Piece A2 (not independent)

  `iter_entries` enumerates superseded rows once A2 lands. The mirror MUST filter to active (`valid_until
  IS NULL` / `status=active`) by default, OR mirror history under a `superseded/` subtree. Never present
  dead rules as authoritative markdown. **Land A before C.**


  ## git guards

  - Explicit identity: `git -c user.email=… -c user.name=…` (a fresh container has none).

  - Empty case: check for changes or `commit --allow-empty`, so a no-change run doesn''t error.


  ## Seams

  New `cmd_export_mirror` in `cli.py`, registered like `cmd_migrate`; storage via `open_storage(dsn)`;
  `--out <git-dir>`; shell to `git` via `subprocess` (no git dep exists).


  ## One-way safety

  Read methods only + writes into the external git dir → structurally cannot trigger the `sync_rules`
  orphan-archive sweep (`tools/rules.py:743`).


  ## Tests (TDD, test-first)

  `test_cli_ingest.py` style: mirror test (temp DB → temp git dir → files + commit + `rules_paths` untouched
  + DB unchanged); superseded-rule-excluded test; no-change / no-identity guard test.


  Phase-2 evolution: Letta-style git-native write path (commit-per-write + per-agent lock) would also
  solve concurrent-write clobber.


  See `mcm_v3_plan.md` for full context.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `mcm_engine.mirror.export_mirror(storage: Any, out_dir: str | Path) -> dict`

  - CLI option: `--from`

  - CLI option: `--out`


  The hidden tests also hold a fix to these details (stated for this exam):

  - `export_mirror` enumerates rules with `storage.iter_entries(EntityType.RULE)` (from `mcm_engine.backends`;
  the entity type argument is required). Rows have `title`, `keywords`, `category`, `content`, `archived`
  and `status` ("superseded" for a superseded rule).

  - Each active rule is written to `<out_dir>/rules/<category>/<slug>.md`, slug from `mcm_engine.tools.rules._slugify(title)`,
  body from `mcm_engine.tools.rules._generate_rule_content(title, keywords, category, content)` (it starts
  "# <title>" and has "**Keywords:** <keywords>"). A rule no longer active must have no file after the
  next run.

  - It returns `{"written": <number of active rules written>, "committed": <bool>}`; `committed` is False
  when the run changed nothing.

  - Commits use `-c user.email=mcm-engine-mirror@localhost`.

  - The CLI subcommand is `export-mirror`, with `--from <dsn>` opened through `open_storage` and `--out
  <dir>`.'
