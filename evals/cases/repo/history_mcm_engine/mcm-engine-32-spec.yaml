id: mcm-engine-32-spec
modality: repo
prompt: '# Phase 2: automatic contradiction detection -> supersession (gap 3)


  Feed A2 (#21 supersede_rule) automatically: on add_rule, detect which existing rule a new one contradicts
  (keyword-overlap heuristic, or a cheap LLM that returns only contradicted ids, code applies the temporal-interval
  logic per Graphiti). This is where the interval-overlap guard finally earns its place (validity intervals
  actually vary). Explicit supersession already ships in #24.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `mcm_engine.dedup.find_conflicts(items: Iterable[tuple], *, topic_threshold: float=TOPIC_THRESHOLD,
  body_threshold: float=BODY_THRESHOLD, min_entropy: float=MIN_ENTROPY) -> list[tuple]`

  - MCP tool: `find_conflicting_rules(topic_threshold: float=0.5, body_threshold: float=0.4) -> str`


  The hidden tests also hold a fix to these details (stated for this exam):

  - find_conflicts takes (id, topic_text, body_text) tuples and returns a sorted list of bare (id_a, id_b)
  pairs with id_a < id_b, no scores.

  - A pair is a candidate when topic similarity >= topic_threshold and body similarity <= body_threshold,
  using the module''s MinHash signature similarity. TOPIC_THRESHOLD = 0.5 and BODY_THRESHOLD = 0.4 are
  new constants in mcm_engine.dedup. Rows with an empty body, or a topic below min_entropy, are skipped.

  - For a rule, topic_text is its title plus keywords and body_text is its content; only active rules
  (not archived, not superseded) are compared.

  - add_rule never supersedes. When the new rule conflicts with an existing active rule, its reply gains
  a note containing the word "conflict" and the text "supersede_rule"; otherwise the reply must not contain
  the word "conflict".

  - find_conflicting_rules is read-only and writes both ids of each pair as "#<id>".'
