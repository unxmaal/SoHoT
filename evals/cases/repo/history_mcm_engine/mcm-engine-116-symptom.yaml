id: mcm-engine-116-symptom
modality: repo
prompt: '# get_last_session returns the global latest handoff — no per-caller/workspace scoping, so shared
  deployments resume the wrong session


  ## Summary


  On any deployment where more than one working context shares a single mcm-engine store (multiple users
  behind one server, or one user across several projects), `session_start` and `get_resume_context` routinely
  surface a handoff belonging to a *different* context. The user asks to resume project A and is handed
  project B''s handoff.


  ## Root cause


  `get_last_session` is unscoped in both adapters:


  ```python

  # adapters/sqlite/storage.py

  "SELECT * FROM sessions ORDER BY id DESC LIMIT 1"

  # adapters/postgres/storage.py — identical

  ```


  It returns the single newest row across the entire `sessions` table. There is only ever one candidate,
  so "resume" can''t pick correctly — it picks globally-latest.


  Contributing facts:

  - The `sessions` table (`schema.py`) has **no scoping column** — no project, no owner/principal — unlike
  `knowledge`/`negative_knowledge`/`errors`, which all carry `project` (and project indexes).

  - `session_handoff` accepts only `status/current_task/next_steps/blockers` — the client cannot tag a
  handoff with any scope key at write time.

  - `get_last_session(*, caller=None)` already has a **vestigial `caller` param that is never populated
  or used** for filtering.

  - Both `session_start` (the "Last handoff" block) and `get_resume_context` call `get_last_session()`
  with no argument.


  ## Why `project_name` alone doesn''t fix it


  `MCM_PROJECT_NAME` is a **server-global** config value — every request through one server carries the
  same project. Adding a `project` column keyed to `MCM_PROJECT_NAME` would sort every caller into the
  same bucket and change nothing for the common "one shared server" topology. It also wouldn''t separate
  a single user''s multiple projects.


  The scoping key has to be **per-request**, not per-server.


  ## What''s already available


  `principal.py` exposes `get_transport_principal()` — the bearer-token identity for the in-flight request,
  carried in a ContextVar and already used as the fallback in `resolve_actor()`. So an authenticated per-caller
  identity is reachable from any tool call today; the session tools simply don''t consult it.


  ## Open question for maintainer


  What should `workspace` derive from when the client doesn''t pass one? Options: (a) principal-only scoping
  (simplest, but conflates one user''s multiple projects); (b) an explicit client-supplied label on `session_handoff`/`session_start`;
  (c) something the client already sends (e.g. a cwd/repo hint). Leaning (b) with (a) as the fallback,
  but the right default depends on how you want stdio/unauthenticated contexts (principal = None) to behave
  — today they''d all collapse to the NULL bucket.


  ## Impact


  Silent and confusing: the agent confidently narrates the wrong project''s state as if it were the current
  one, and a user who trusts it can act on stale/irrelevant context. Severity scales with the number of
  concurrent contexts sharing the store.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `class mcm_engine.backends.SessionRow(id: int, status: str, current_task: Optional[str] = None, findings_summary:
  Optional[str] = None, next_steps: Optional[str] = None, blockers: Optional[str] = None, context_snapshot:
  Optional[str] = None, created_at: Optional[datetime] = None, principal: Optional[str] = None, workspace:
  Optional[str] = None)`

  - `mcm_engine.adapters.sqlite.storage.SqliteStorage.get_last_session(self, *, caller: Optional[str]=None,
  principal: Optional[str]=None, workspace: Optional[str]=None) -> Optional[SessionRow]`'
