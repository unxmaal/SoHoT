prompt: '# search blocks ~20s on SQLite lock from post-search counter bumps


  # `search` blocks ~20 seconds on SQLite lock from post-search counter bumps


  **Version:** 2.0.0


  I''ve started working this into my homelab setup piece (project) by piece. I think I''ve hit a performance
  issue and wanted to share what I found in case it''s useful.


  ## Symptom


  Every `search` call takes ~15–30 seconds; longer queries exceed a 30 sec. client timeout and return
  nothing. Reproduces on a single idle `mcm-engine run` (stdio) against its own copy of a small (27-rule)
  tree with no external concurrency. Timing is deterministic (~20.9 s for the same 3-term query), so it
  doesn''t look like network or model-load.


  ## What I found


  The search itself is fine; the stall is a SQLite lock wait, not work:


  - `sample <pid>` mid-call is 100% in `sqlite3_step → unixSleep → nanosleep` (the `busy_timeout` back-off).

  - Calling the read-only adapter directly: `SqliteSearch.search(...)` returns in **0.4 ms**.

  - The time is in the post-search `hit_count` / `last_hit_at` bumps in `_scope_block` (tools/search.py:243-254)
  — up to ~2 writes × limit × 2 scopes per call.

  - Those writes appear to self-contend across the embedded adapters'' separate connections to the same
  file (db.py:117-132, `busy_timeout=5000`). Reproduced in isolation: two connections / one file, second
  writer blocks **5262 ms** then `database is locked`. A few of those per search ≈ the ~20 s observed.


  The `try/except` around `counters.increment` (search.py:248-253) swallows the resulting exception so
  results still return, but the 5 s sleep happens before the exception is raised.


  ## Possible directions (whatever fits best)


  1. Lower `busy_timeout` (e.g. ~250 ms) for the bump path. This bounds the worst case to ~1 s.

  2. Run the best-effort bumps on the same connection that served the read, or off the request path.

  3. A single shared writer connection for the embedded adapters.


  Happy to open a PR or provide more detail (sample output, repro script) if that would help.'
