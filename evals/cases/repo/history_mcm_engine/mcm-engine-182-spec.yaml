prompt: '# 4.0 C6: characterization replay (legacy vs unified) + Postgres rehearsal


  The outside check for #176.


  - `mcm-engine replay-queries <transcripts…> --snapshot <sqlite>`: extract every `search`/`report_error`/`get_entry`/`read_rule`
  tool_use (arguments) from Claude Code JSONL transcripts (reuse `eval/trace_transcript.py` parsing),
  replay each against the snapshot under `MCM_ENTRY_MODEL=legacy` and `unified` in one process, and report
  per-query id-set agreement: exact for get_entry/read_rule, ranked overlap (Jaccard on the returned ids,
  and top-k order agreement) for search/report_error. JSON report with the disagreeing queries listed.

  - Test: a checked-in mini transcript + seeded store with a pinned agreement result, so the harness itself
  is verified.

  - Rehearsal: load the C1 snapshot into the local docker Postgres (127.0.0.1:55432) via `migrate.py`,
  boot 4.0 against it, confirm the C3 verify passes, run the replay there, record the agreement numbers
  in the KB.


  Acceptance: on the real corpus of 1,474 searches / 241 report_errors / 45 get_entry / 53 read_rule,
  get_entry/read_rule agreement 100%; search ranked-overlap at or above the threshold stated in the umbrella
  (proposed 0.9 Jaccard on returned ids, disagreements explained by the uniform FTS weighting and listed);
  rehearsal round-trip identical on Postgres.


