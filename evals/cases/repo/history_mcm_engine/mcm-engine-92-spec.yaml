id: mcm-engine-92-spec
modality: repo
prompt: "# --allowed-host / MCM_ALLOWED_HOSTS ignored by streamable-http transport (421 on permitted Host)\n\
  \n# `--allowed-host` / `MCM_ALLOWED_HOSTS` is ignored by the streamable-http transport (server 421s\
  \ a permitted Host)\n\n## Summary\nWhen `mcm-engine serve --transport streamable-http` runs behind a\
  \ reverse proxy / ingress, requests whose `Host` header is a configured allowed host are still rejected\
  \ with **HTTP 421 \"Invalid Host header\"**. The allow-list (`--allowed-host` / `MCM_ALLOWED_HOSTS`)\
  \ has no effect for streamable-http; only the localhost defaults (`127.0.0.1:*`, `localhost:*`, `[::1]:*`)\
  \ are enforced.\n\n## Environment\n- mcm-engine 3.5.0 (also present on current `main`: `transport.py`).\n\
  - Transport: `streamable-http`, bound `--host 0.0.0.0 --port 8080`.\n- Reached via an internal AWS ALB\
  \ at `https://mcm.internal.example` (Host = that FQDN).\n\n## Repro\n1. `MCM_ALLOWED_HOSTS=example.internal\
  \ mcm-engine serve --host 0.0.0.0 --port 8080 --transport streamable-http`\n2. `curl -H 'Host: example.internal'\
  \ -H 'Authorization: Bearer <valid>' \\\n   -H 'Accept: application/json, text/event-stream' -H 'Content-Type:\
  \ application/json' \\\n   -X POST http://<addr>:8080/mcp -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\"\
  :\"initialize\",\"params\":{}}'`\n3. → `421 Invalid Host header` (bearer auth passes first — an unauthenticated\
  \ call 401s — so this is specifically Host validation, after auth).\n\nConfirmed the env is read and\
  \ passed: `cmd_serve` reads `MCM_ALLOWED_HOSTS` and calls `serve(..., allowed_hosts=...)`, and `_configure_transport_security`\
  \ builds the expected pattern (`example.internal:*` via `_host_pattern`). Yet a live server still shows\
  \ only the localhost allow-list enforcing.\n\n## Root cause (ordering)\nIn `transport.py serve()`:\n\
  ```python\n_configure_transport_security(server, host=host, allowed_hosts=allowed_hosts, enable=...)\
  \  # mutates server.mcp.settings.transport_security\napp = build_asgi_app(server, transport=transport)\
  \  # -> server.mcp.streamable_http_app()\n```\n`_configure_transport_security` mutates `server.mcp.settings.transport_security`\
  \ **after** FastMCP is constructed, but `streamable_http_app()` builds its DNS-rebinding middleware\
  \ from FastMCP's own (localhost-only) transport-security at app-build time and does not honor the post-construction\
  \ mutation. So the alignment is discarded and the localhost-only list is what actually enforces. (A\
  \ freshly built `MCMServer` shows `allowed_hosts=['127.0.0.1:*','localhost:*','[::1]:*']`.)\n\n## Suggested\
  \ fix\nConfigure FastMCP's `TransportSecuritySettings` **before** the transport app is built — e.g.\
  \ construct `FastMCP` with the settings up front, or set them via whatever `streamable_http_app()` reads\
  \ at build time — so `--allowed-host` takes effect for streamable-http (it may already work for `sse`;\
  \ worth confirming both). Add a regression test: build the streamable-http app with an allow-list and\
  \ assert a request with that Host is accepted.\n\n## Workaround in use\nSetting `MCM_DNS_REBINDING_PROTECTION=0`\
  \ disables Host validation entirely and unblocks ingress access. Acceptable only on a trusted, non-browser\
  \ endpoint (internal LB, private DNS) and does **not** weaken bearer auth. Not a fix — the allow-list\
  \ should work."
