id: mcm-engine-171-spec
modality: repo
prompt: '# Cap retrieval output in summary search: inline Why/Fix length, hit budget, common-token downrank


  `search` summary mode is small for KNOWLEDGE/RULE but still bloats on NEGATIVE/ERROR and on low-value
  matches. A sohot session''s `search("sweep-check")` and `search("deploy guard")` each returned ~20 hits,
  including the same 6-7 irrelevant NEGATIVEs (#1,#3,#8,#10,#11,#14,#16) matched only on a common token
  ("check"/"sweep"/"deploy"/"testing"), each inlining its full (and currently polluted) Why/Fix. Even
  post-sanitize (#170) the Why/Fix is multi-paragraph; a one-line hit is cheap, seven 2 KB inlined bodies
  are not.


  ## Fix (search.py)

  1. Cap the inline NEGATIVE Why/Fix and ERROR root_cause/fix in summary mode at a few hundred chars each,
  with a "… (get_entry for full)" pointer. `detail="full"` stays uncapped.

  2. Cap total hits returned per query. The public `search` default `limit` is 10 per entity type → up
  to 40 + related. Add an overall response ceiling (~8-10 hits) independent of per-scope limit.

  3. Downrank or drop a hit whose only match is a single common token: when a NEGATIVE/ERROR matches on
  a token that is also a stopword-ish high-frequency term and nothing more distinctive, it should not
  outrank or crowd out a real RULE hit. Simplest: a relevance floor for NEGATIVE/ERROR in the multi-scope
  "all" path so generic single-token matches drop below the fold.


  ## Acceptance

  - `search("deploy guard")` and `search("sweep-check")` each return under ~3 KB, with RULE #756 and #868
  still present for "deploy guard".

  - `detail="full"` is unchanged (still returns whole bodies).


  The hidden tests also hold a fix to these details (stated for this exam):

  - In summary mode each inline NEGATIVE Why/Fix and ERROR Root cause/Fix field longer than 320 characters
  is cut to 320 and followed by "… (get_entry(''negative'', <id>) for full)" or "… (get_entry(''error'',
  <id>) for full)". detail="full" output carries no such pointer.

  - In the multi-scope "all" summary path at most 3 NEGATIVE and at most 3 ERROR hits are returned (the
  top by rank), whatever `limit` is. A scoped query (scope="negative" or "errors") and detail="full" keep
  the caller''s `limit`, and KNOWLEDGE/RULE hits are not cut by this cap.'
