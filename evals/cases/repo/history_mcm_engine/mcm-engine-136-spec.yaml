id: mcm-engine-136-spec
modality: repo
prompt: "# search summary mode must keep Why/Fix inline for NEGATIVE (and ERROR) hits\n\n## Problem\n\n\
  #119 strips the body from a hit in `detail=\"summary\"` (the default). For ordinary knowledge that only\
  \ makes a hit *incomplete* — worst case you `get_entry` it. For **negative knowledge** it is a correctness\
  \ bug, because the body **is** the payload and the failure mode is asymmetric.\n\n`tools/search.py:272`\
  \ renders a NEGATIVE summary hit as just:\n\n    [NEGATIVE #id] <category>: <what_failed>\n\n`Why` (`why_failed`)\
  \ and `Fix` (`correct_approach`) are gated behind `detail == \"full\"` (lines 273-277). So a plain `search`\
  \ tells the agent *that* an approach failed but hides *why it must stay rejected* and *what to do instead*.\
  \ The agent can then re-attempt the dead end, or be unable to tell whether its current plan is the rejected\
  \ one — the exact outcome the anti-pattern store exists to prevent. ERROR hits have the same shape:\
  \ `root_cause` / `fix` are gated at `tools/search.py:296`.\n\nNote #122 only restored full bodies for\
  \ the `report_error` auto-search path. A direct `search(scope=\"negative\")` (or an all-scope search\
  \ that surfaces a negative) still strips Why/Fix.\n\n## Why this is the right asymmetry\n\nThe #119\
  \ token win comes from not carrying large *knowledge* bodies. Negative/error bodies are short (a Why\
  \ line + a Fix line), so keeping them inline barely dents the win, and their whole value is being seen\
  \ at the moment of the hit, not one `get_entry` later.\n\n## Proposal\n\nIn summary mode, keep `Why`/`Fix`\
  \ inline for NEGATIVE hits and `root_cause`/`fix` for ERROR hits. Knowledge stays summary-only (its\
  \ bodies are the token problem). Optionally cap each field's length (reuse whatever `MCM_SNIPPET_MAX`-style\
  \ bound #135 lands) so a pathologically long negative can't reintroduce bloat.\n\n## Acceptance\n- `search`\
  \ (summary, default) renders Why + Fix for a NEGATIVE hit and root cause + fix for an ERROR hit.\n-\
  \ Knowledge summary rendering unchanged.\n- Conformance: a negative/error hit in summary mode contains\
  \ its Why/Fix (root cause/fix); a knowledge hit in summary mode still omits its body.\n\nFollow-up to\
  \ #119 / #122. Distinct from #135 (which adds a match *snippet*); this is about which structured fields\
  \ summary mode keeps per kind."
