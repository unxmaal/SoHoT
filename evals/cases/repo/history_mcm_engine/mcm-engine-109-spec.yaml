id: mcm-engine-109-spec
modality: repo
prompt: "# stdio startup sync failure is invisible to the client: server reports ready and serves a stale\
  \ index\n\nIn stdio mode, a failed startup sync is invisible to the client. The server comes up, reports\
  \ ready, and serves a stale index — searches then return confident \"no results\" for rules that exist\
  \ on disk and are committed.\n\n`server.py` `run()` catches it and moves on:\n\n```python\ntry:\n  \
  \  counts = self.watcher.sync_once()\n    log(f\"sync_rules at stdio startup: {counts}\")\nexcept Exception\
  \ as e:\n    log(f\"sync_rules at stdio startup failed (non-fatal): {e}\")\nself.mcp.run()\n```\n\n\
  The log line is real and lands in `log_path`, but `log()` writes to file only and deliberately never\
  \ touches stderr (\"MCP clients treat stderr as failure\"). Nothing reaches the client, and no tool\
  \ response carries a staleness signal, so neither the agent nor the user has any way to learn the index\
  \ is behind the files.\n\nObserved twice on a single-user laptop, 2026-07-28 and again 2026-08-08 (v3.8.0,\
  \ SQLite, `source_of_truth=files`). Six stdio servers alive against one `--project-root`, oldest 12\
  \ days; one held a write transaction, so every new server's startup sync failed:\n\n```\n[2026-08-08\
  \ 20:55:10] sync_rules at stdio startup failed (non-fatal): database is locked\n```\n\nTwo committed\
  \ rules never reached the cache — 35 rows against 37 `rules/*.md`. Searches for them returned nothing,\
  \ with no error anywhere in the session. The corroborating symptom is a WAL that has not checkpointed:\
  \ `knowledge.db-wal` at 2.3 MB against a 278 KB `knowledge.db`.\n\nWidening `busy_timeout` from the\
  \ hardcoded 5s (`db.py:145`) to four minutes still blocked indefinitely, so the retry path cannot recover\
  \ from a genuinely held transaction — the cross-process case is not the intra-process contention fixed\
  \ in #79/#83. That contention is arguably working as designed for a laptop running many sessions; the\
  \ defect is that its outcome is unobservable.\n\nSome options, roughly increasing in cost:\n\n- Record\
  \ the failure in server state and prefix affected `search` / `session_start` responses with a staleness\
  \ warning, so the agent sees it at the point of use.\n- Expose last-sync status (timestamp, counts,\
  \ last error) as a tool or resource for explicit checks.\n- Retry the startup sync in the background\
  \ rather than once at boot, so a transient holder resolves itself.\n- Return a non-fatal notice through\
  \ the MCP client's logging channel, which is not stderr and is safe to use.\n\nHappy to send a PR for\
  \ the first if that's the direction you'd want."
