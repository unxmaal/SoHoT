modality: repo
prompt: '# #137e: replay evaluation harness + evidence-based retune (absorbs #149)


  Child of #137. **Absorbs the remaining work of #149** (evidence-based retune of guessed constants).


  Build a replay harness over the historical tool-call workload to evaluate candidate retrieval-trigger
  policies, reporting the two error rates **weighted asymmetrically**:

  - **False negative** (a lookup should have happened, policy skipped it) — weighted *much* heavier, especially
  when the missed memory is a prior observed failure or an explicit user constraint.

  - **False positive** (a lookup enforced when nothing relevant existed).


  Honest limitation to state up front: replay evaluates *trigger* decisions but cannot predict how Claude
  behaves *after* receiving different memory — that needs **live paired task evaluations**. Include a
  plan for those.


  Then feed the #149 knobs (scoring weights `W_*`, dedup thresholds, search `RANK_THRESHOLD`/`STALE_DAYS`,
  rulesift thresholds — all already env-overridable via `tunables.py` from PR #151) into this harness
  and retune with evidence instead of guessing. Each retune is its own PR with its evidence.


  ### Acceptance

  - Replay harness reporting FN/FP rates (FN weighted) for candidate policies.

  - A written plan for live paired eval.

  - At least the ranking weights + search thresholds swept and retuned (or explicitly confirmed) with
  harness evidence.'
