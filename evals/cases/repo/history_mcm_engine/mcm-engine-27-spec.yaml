modality: repo
prompt: '# Follow-up (#25/#26): scale-free relevance via batch min-max (fix adapter-scale mismatch)


  #26''s relevance sigmoid uses a fixed midpoint (~8.0) calibrated for SQLite FTS5 **bm25** (magnitudes
  ~1–20). The production pod is **Postgres**, whose `ts_rank_cd` scores are ~0.1–1 — so the sigmoid collapses
  relevance to ~0 there and counters dominate (a live ranking regression). Fix: replace the fixed-scale
  sigmoid with **batch min-max relative normalization** (Generative-Agents style) — normalize each result''s
  relevance across the candidate batch''s own min/max, in the search layer (two-pass). Scale-free: works
  for bm25, ts_rank_cd, and any future adapter with zero per-scale tuning. `compose_rank` then takes a
  pre-normalized `relevance ∈ [0,1]`; drop `query_terms`. TDD in test_scoring.py.'
