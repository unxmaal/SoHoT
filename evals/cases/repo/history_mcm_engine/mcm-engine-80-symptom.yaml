modality: repo
prompt: "# Rule-like gate rejects descriptive architectural facts (normative-word requirement too strict\
  \ for ingest)\n\n## Summary\n\n`is_rule_like` (`src/mcm_engine/ingest/rulesift.py`) requires a **normative/warning\
  \ marker** (`must|never|always|avoid|ensure|require|note|warning|gotcha|…`) for a span to survive the\
  \ funnel. This drops **descriptive architectural facts** that are genuinely rule-worthy knowledge but\
  \ phrased declaratively rather than as an imperative.\n\n## Repro\n\nIngesting `DoddE/stork` (a real\
  \ Terraform artifact-repository project) via `ingest --remote`:\n\n```\n# funnel:   19 raw candidates\
  \ -> 0 rule-like span(s)\n```\n\nAll 19 candidates were dropped. The README describes a real \"dirty/clean\"\
  \ artifact-promotion architecture (AWS CodeArtifact intake→scan→clean, Harbor+Trivy, EventBridge-triggered\
  \ promotion, internal ALB) — high-value KB content — but contains no `must`/`never`/`note`/`gotcha`,\
  \ so `is_rule_like` returns `False` for every span.\n\n## Root cause\n\n`is_rule_like` (rulesift.py:140):\n\
  \n```python\ndef is_rule_like(text: str) -> bool:\n    if len(dedup.normalize(text).split()) < MIN_TOKENS:\n\
  \        return False\n    return _NORMATIVE_RE.search(text) is not None   # <-- requires a normative\
  \ marker\n```\n\n`_NORMATIVE_RE` is deliberately tight (comment: \"over-admitting here just means more\
  \ spans reach the future model stage, but for Slice 1 the agent eyeballs survivors, so we keep the gate\
  \ tight\").\n\nNote this gate runs in **two** places and both must agree:\n- client-side in `extract`/funnel\
  \ (`sift`)\n- **server-side** in `sift_spans` (rulesift.py) behind the `sift_candidates` MCP tool\n\n\
  So a client can't bypass it alone — `sift_candidates` re-applies `is_rule_like`.\n\n## Impact\n\nNow\
  \ that there's a curation/adjudication stage downstream (e.g. an LLM adjudicator deciding keep/skip\
  \ on survivors — see the platform's `gitlab_ingest.py` flow), the tight normative gate is the wrong\
  \ place to enforce precision. It silently discards descriptive architecture, contracts, and conventions\
  \ before anything smarter can judge them. The \"Slice 1 agent eyeballs survivors\" assumption no longer\
  \ holds for automated ingest.\n\n## Acceptance\n\n- `ingest --remote` on a descriptive repo like stork\
  \ yields non-zero rule-like spans (via the new mode/broadened gate).\n- Existing strict behavior remains\
  \ the default (no regression for curated rule ingest).\n- Both client `sift` and server `sift_spans`/`sift_candidates`\
  \ honor the same setting.\n\nThe hidden tests call these names from the repository (signatures as a\
  \ correct fix defines them):\n- `mcm_engine.cli._collect_remote_spans(groups, *, strict: bool=True)\
  \ -> list[dict]`\n- `mcm_engine.cli._ingest_remote(groups, project_root, raw_total: int, *, source_key:\
  \ str, batch_size: int=5, batch_timeout: float=30.0, strict: bool=True) -> None`\n- `mcm_engine.cli._sift_remote_call(url,\
  \ spans, *, headers=None, timeout=None, strict=True)`\n- `mcm_engine.ingest.rulesift.is_substantive(text:\
  \ str) -> bool`\n- `mcm_engine.ingest.rulesift.passes_gate(text: str, *, strict: bool) -> bool`\n- `mcm_engine.ingest.rulesift.sift_spans(spans:\
  \ Iterable[tuple[str, str]], existing_rules: Iterable[tuple[int, str]], *, strict: bool=True) -> list[RuleCandidate]`"
