modality: repo
prompt: '# Sanitize NEGATIVE/ERROR serialized-blob pollution + store-time guard (#142 follow-on)


  Follow-on to #142 (closed), which cleaned only the KNOWLEDGE table (94/516 summaries re-split). The
  same serialized-entry leak exists in the NEGATIVE and ERROR tables and was never covered: `sanitize_knowledge`
  iterates `EntityType.KNOWLEDGE` only, and `clean_summary_detail` is summary/detail-specific, so it cannot
  repair the NEGATIVE three-field (`what_failed`/`why_failed`/`correct_approach`) or ERROR (`pattern`/`context`/`root_cause`/`fix`)
  shape.


  ## Evidence (live basement, 3.16.0)

  `get_entry(''negative'', 10|11|16)` show the entire XML-serialized entry crammed into `what_failed`:
  the real text, then `</what_failed>`, then `<parameter name="why_failed">…</parameter>`, `<parameter
  name="correct_approach">…`, `<parameter name="project">…`, `<parameter name="tags">…`, `</invoke>`.
  The real `why_failed`/`correct_approach` columns are empty. ~2 KB each. #3 and #6 are variants. Because
  #136 keeps NEGATIVE Why/Fix inline in summary search, every hit on one of these ships the whole blob.


  ## Acceptance

  - A dry-run reports the polluted NEGATIVE/ERROR ids (incl. #3,#6,#10,#11,#16); apply re-splits them
  into clean columns with no data loss (salvaged text lands in the right field).

  - A fresh `add_negative` whose field contains a `</invoke>`/`<parameter>` fragment stores clean columns.

  - Re-scan reports 0 polluted across knowledge+negative+error.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `mcm_engine.sanitize.clean_error(pattern: str | None, context: str | None, root_cause: str | None,
  fix: str | None) -> tuple[str | None, str | None, str | None, str | None, bool]`

  - `mcm_engine.sanitize.clean_negative(what_failed: str | None, why_failed: str | None, correct_approach:
  str | None) -> tuple[str | None, str | None, str | None, bool]`'
