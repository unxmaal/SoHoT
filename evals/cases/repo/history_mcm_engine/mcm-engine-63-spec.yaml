prompt: '# In-session style nudge: positive voice exemplar, not a longer denylist


  ## Problem


  Stylistic tics (emojis, em-dashes, "it''s not X, it''s Y", rule-of-three cadence, "great question",
  empty intensifiers) leak back into responses over the course of a session, and get worse as context
  fills. Two mechanisms, and they need different fixes:


  1. **Instruction decay.** The style rule lives in CLAUDE.md / MEMORY.md at the top of the window. As
  the session grows, generation happens further from that instruction and soft stylistic constraints slip
  first. Well-established behavior.

  2. **Precedent accumulation.** The model conditions on the whole window. As tool output, git logs, PR
  bodies, and the mandated `Generated with Claude Code` trailer pile up, the local prior for "an emoji/tic
  is normal here" drifts up. Long sessions correlate with high context, but the causal driver is probably
  *what* accumulated, not raw token count.


  A periodic MCP nudge addresses (1). It does little for (2).


  ## Why the current rule reads clinical


  The existing guidance is a denylist: no em-dashes, no emojis, no LinkedIn-speak, no "it''s not X, it''s
  Y". Every clause is a prohibition. The safest way to satisfy an all-prohibition rule is to strip out
  all personality, because personality is where the risk lives. Flat, dry prose violates nothing. So the
  denylist doesn''t just permit clinical, it pulls toward it.


  Second problem: naming a tic primes the tic. A reminder that says "don''t use emojis" puts emojis in
  the context. Negative instructions are weak in general and self-defeating here in particular.


  ## Proposed direction


  **Give a positive voice target, phrased as an exemplar, not a longer denylist.** The warmth we want
  is not surface affect (enthusiasm, "happy to help", emoji). It''s substance: read the actual situation,
  take a position, be brief, say the dry true thing when there is one. Directness and judgment read as
  warmth once the decorative warmth is gone.


  **Store examples, not adjectives.** "Be warm, be direct" decays into clinical because adjectives are
  cheap to satisfy. Two or three before/after pairs give the model something to pattern-match, which is
  what it''s actually good at. One paragraph in the target voice sitting in context beats a page of rules
  about the voice.


  **Two layers, mirroring the project''s own MCP-nudge + PreToolUse-hook split:**

  - *Soft:* the voice is un-filterable, so it lives in the nudge as a positive exemplar, re-surfaced periodically
  to fight decay. Keep it terse; over-nudging produces self-conscious, trying-too-hard prose.

  - *Hard:* the absolute bans (zero emojis, em-dash count) are mechanical. Put them in a post-filter or
  counter, not a polite reminder. You can''t regex your way to "warm," but you can regex "no emoji", and
  the same counting yields a real metric instead of eyeballing leakage.


  ## Example before/after pairs


  **A. Opener + rule-of-three + outro**


  > Before: Great question! Let''s dive into how the dispatcher works. At its core, the ingester registry
  is powerful, flexible, and easy to extend. By walking each ingester in order, we can seamlessly match
  the right one. I hope this helps clarify things!


  > After: The registry walks each ingester in registration order and takes the first that matches. That
  order is the precedence: specific ingesters first, text-dir last. To add one, implement `matches` and
  `stream` and call `register`.


  **B. "It''s not X, it''s Y" + em-dash + empty intensifiers**


  > Before: This isn''t just a bug fix, it''s a fundamental rethink of how we handle net-new detection.
  The new approach is remarkably robust and leverages content hashing to deliver a truly seamless deduplication
  experience.


  > After: The old title-only dedup missed the same rule pasted under a different title. Now we hash the
  content, so a duplicate body is caught no matter what it''s called. Same idea, one more check at the
  write path.


  **C. Hedging + restating the question + bullets-on-everything**


  > Before: You asked whether the ingest is idempotent. That''s a great thing to verify. It''s worth noting
  that, generally speaking, the system is designed to be idempotent on topic and kind, safe to re-run,
  and resilient to duplicates. So in most cases, you should be fine re-running it.


  > After: Yes. It dedups on (topic, kind) at the write path, so re-running updates in place instead of
  inserting again. Run it twice and the second pass is a no-op.


  ## Open questions to ruminate on


  - Where does the exemplar live so it re-surfaces without burning tokens every turn? Pinned item, folded
  into the existing store-reminder nudge, or a dedicated low-frequency channel?

  - Nudge cadence. Frequent enough to fight decay, sparse enough to avoid self-conscious prose. What interval?

  - Does the soft exemplar survive compaction, or does it need to be re-anchored the way MEMORY.md is?

  - Is the hard filter worth it, or does a counter/metric (count tells per response, surface a number)
  get most of the value without the risk of a filter mangling legitimate output?

  - Whose calibration anchors "warm but not clinical"? The exemplar set is the calibration, so it needs
  curating, not just writing once.


  Not for immediate build. Filed for rumination.'
