  - `mcm_engine.dedup.jaccard_estimate(a_text: str, b_text: str, num_perm: int=NUM_PERM) -> float`

  - `mcm_engine.dedup.normalize(text: str) -> str`

  - `mcm_engine.dedup.shannon_entropy(text: str) -> float`'
