prompt: '# Phase 2: deterministic dedup via MinHash/LSH (gap 4)


  Embedding-free near-duplicate detection for rules, Graphiti-style: normalize -> n-gram shingle -> MinHash
  (32 perms) -> Jaccard>=0.9, with a name-entropy gate for short/low-info titles. Runs BEFORE any LLM/review
  step; surfaces merge candidates, never auto-deletes. Attacks KB bloat (title-equality dedup is the only
  dedup today). See mcm_v3_plan.md Deferred; ref getzep/graphiti dedup_helpers.py.


