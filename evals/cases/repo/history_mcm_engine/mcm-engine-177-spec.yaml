prompt: '# 4.0 C1: corpus-snapshot (via scroll_entries) + corpus-census subcommands


  First durable artifact of the 4.0 program (umbrella #176). Read-only; commits nothing about the design.


  Two subcommands:

  - `mcm-engine corpus-snapshot --out <sqlite>`: walk all four entity types through the MCP `scroll_entries`
  tool over HTTP (the hooks'' `mcp_http_call_tool` path; `MCM_MCP_URL`/`.mcp.json` for the endpoint) and
  write every entry into a local SQLite in the existing core schema (`migrate_core` + the typed `insert_*`),
  so the corpus can be loaded into the local docker Postgres with the existing `migrate.py` copy path
  for rehearsal. Interface-respecting: no DB bypass (DECISION #1).

  - `mcm-engine corpus-census <sqlite>`: per table, per column null rate, text-length percentiles (p50/p90/max),
  serialized-blob pollution rate (`sanitize._blob_polluted` / `is_polluted`), and a per-row lossless-fit
  check against the 4.0 projection (every non-null legacy field maps to a unified column or facet). JSON
  report.


  Also: add `tmp/` to `.gitignore` (CLAUDE.md working-file rule; it is not ignored today).


  Acceptance: snapshot of the basement yields row counts equal to `session_start`''s totals; census reports
  0 rows failing the fit check (or lists them by id); both subcommands have tests on a seeded SQLite.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `mcm_engine.corpus_snapshot.census(storage, etypes: Iterable[EntityType]=tuple(EntityType)) -> dict`

  - `mcm_engine.corpus_snapshot.parse_scroll_page(text: str) -> list[ParsedEntry]`

  - `mcm_engine.corpus_snapshot.snapshot(call_tool: Callable[[str, dict], str], out_path: str | Path,
  *, page: int=100) -> SnapshotReport`'
