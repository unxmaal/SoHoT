id: mcm-engine-142-spec
modality: repo
prompt: '# KB data pollution: some knowledge summaries contain the whole serialized body (incl. a leaked
  </invoke> fragment)


  ## Observed

  Under 3.12.0 summary-mode `search`, a subset of KNOWLEDGE hits render with stray structural markup —
  `</summary>`, `<detail>…</detail>`, `<rationale>`, `<references>`, `<tags>`, `<kind>`, `<project>`,
  and a trailing `</invoke>`.


  ## Root cause (verified via get_entry)

  Not a formatter bug. `get_entry("knowledge", 157)` shows the stored **`summary` column** itself contains
  the entire XML-serialized entry, e.g.:


  ```

  summary: Measured 2026-09-20 … permanently inert.</summary>

  <detail>…</detail>

  <rationale>…</rationale>

  <tags>…</tags>

  <kind>finding</kind>

  <project>localharness</project>

  </invoke>

  ```


  The renderer prints stored fields faithfully; clean entries (all rules, recent knowledge) render clean.
  So a batch of entries was created with a pre-serialized blob passed as the `summary`/content, and a
  tool-call fragment (`</invoke>`) was captured at store time.


  ## Scope

  Appears concentrated in imported `localharness`/`sohot` findings. Exact count TBD as part of the fix
  (FTS can''t easily match raw tags; needs a direct scan of `knowledge.summary` for `</invoke>` / `</detail>`
  / `</summary>`).


  ## Impact

  Cosmetic + token waste: polluted summaries defeat the #119 progressive-disclosure saving (the whole
  body ships in the "summary"). No correctness impact on search/ranking.


  ## Fix (two parts, both non-blocking for the next release)

  1. **Data cleanup**: scan `knowledge.summary` for embedded field tags; for each, re-split into clean
  `summary` + `detail` and update in place (DB is authoritative — update via the MCP, no file writes).

  2. **Prevention (optional, code)**: `add_knowledge`/`add_rule` could reject or strip content containing
  tool-call fragments or mismatched field tags, so a malformed store can''t recur.


  Found 2026-10-14 while characterizing 3.12.0 MCP behavior post-deploy.'
