id: mcm-engine-157-spec
modality: repo
prompt: '# #137b: UserPromptSubmit task-aware retrieval + inject


  Child of #137. **Highest implement-today leverage.**


  Add a `UserPromptSubmit` hook: classify each new request; when it references historical decisions, prior
  failures, established preferences, or ongoing work, search automatically and inject the result via `hookSpecificOutput.additionalContext`
  *before* the model reasons. Establishes coverage (updates the #137 ledger) without the agent initiating
  a tool call.


  Note: this hook blocks prompt processing until it returns — keep it fast. Classification deterministic-first
  (keyword/pattern), LLM only at the ambiguous+consequential margin (mcm runs model-agnostic behind a
  LiteLLM gateway per DECISION #39 — an LLM-evaluated hook is a gateway round-trip on the critical path).
  Fail-open on infra failure (RULE #61).


  ### Acceptance

  - `mcm-engine` exposes a UserPromptSubmit handler wired in settings.

  - History-referencing prompts auto-retrieve + inject via additionalContext; non-historical prompts do
  nothing (fast path).

  - Retrieval updates the coverage ledger.

  - Tests for the classifier (deterministic cases) + injection shape.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `mcm_engine.hooks.coverage.COVERAGE_TTL_SECONDS`

  - `mcm_engine.hooks.coverage.is_covered(entry: dict, topic: str, *, now: float | None=None, ttl: float=COVERAGE_TTL_SECONDS,
  require_resident: bool=True) -> bool`

  - `mcm_engine.hooks.coverage.note_compaction(entry: dict, *, now: float | None=None) -> None`

  - `mcm_engine.hooks.coverage.prune_topics(entry: dict, *, now: float | None=None, ttl: float=COVERAGE_TTL_SECONDS)
  -> None`

  - `mcm_engine.hooks.coverage.record_topic(entry: dict, topic: str, *, now: float | None=None) -> None`

  - `mcm_engine.hooks.user_prompt_submit._pick_keyword(prompt: str) -> str`

  - `mcm_engine.hooks.user_prompt_submit.classify(prompt: str) -> tuple[bool, str]`

  - `mcm_engine.hooks.user_prompt_submit.main(argv: Optional[list[str]]=None, *, search: Optional[Callable[[str,
  Path], str]]=None) -> int`


  The hidden tests also hold a fix to these details (stated for this exam):

  - `coverage.record_topic` stores `entry["covered_topics"][topic] = now` (a float), the topic lowercased
  and stripped; an empty or blank topic is a no-op. `is_covered` matches the topic case-insensitively,
  is False when `now - recorded > ttl`, and with `require_resident=True` is False when `note_compaction`
  has stamped a boundary on the entry and the topic was recorded at or before it (no boundary means resident).
  `prune_topics` deletes topics older than `ttl` and does nothing when `covered_topics` is absent.

  - `classify` returns `(False, "")` for a non-historical prompt and `(True, keyword)` for a historical
  one, where keyword is `_pick_keyword(prompt)`. History signals match on word boundaries ("distill" does
  not match "still").

  - `_pick_keyword` returns one lowercased token: the longest identifier-shaped word (contains "_", a
  digit, or an interior capital) if any, else the longest word of 4+ letters that is not a stopword; history
  signal words such as "again" are stopwords. It returns "" when nothing qualifies.

  - `main` calls `search(keyword, cwd)` only for a historical prompt with a non-empty keyword. A non-empty
  result prints `{"hookSpecificOutput": {"hookEventName": "UserPromptSubmit", "additionalContext": ...}}`
  where the context contains the keyword and the result; an empty result or a raising search prints nothing.
  Exit code is always 0.

  - Coverage is recorded even when the search returns empty: in the existing hook state file of `mcm_engine.hooks.mcp_enforcement`
  (path from `_state_path(cwd)`, read with `_read_state(path)`, written with `_write_state(path, state)`),
  under the key `_agent_key(event)` (the event''s session_id), by calling `coverage.record_topic` on that
  entry dict.'
