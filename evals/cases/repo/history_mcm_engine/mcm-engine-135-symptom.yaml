id: mcm-engine-135-symptom
modality: repo
prompt: '# search summary mode should carry a match snippet (keep ''why it matched'' under semantic/non-FTS5
  backends)


  ## Problem


  #119 made `search` default to compact summary hits (id, kind, title/topic, one-line summary, tags) and
  defer bodies to `get_entry`. That progressive-disclosure win rests on an implicit assumption: the agent
  can judge a hit''s relevance *from the summary line* and only fetch the bodies worth paying for.


  That assumption holds under **lexical** search (SQLite FTS5, Postgres FTS), where the query token is
  literally in the matched text, so the agent knows why a hit came back. It weakens under a **semantic/vector**
  backend (the direction the live server + lodestone are moving — FTS5 is being retired): a hit can match
  on meaning the summary line never surfaces, so the agent can''t tell from the one-liner whether the
  body is relevant. Result: either wasted `get_entry` round-trips on bad hits, or wrongly skipping a good
  hit. No wrong results, but the ergonomics of summary-first degrade exactly where we''re headed.


  ## Root cause


  `detail`/summary rendering (`tools/search.py`) is fully decoupled from the search backend (good — see
  `_scope_block`), but `SearchHit` (`backends/__init__.py:323`) carries `entity_type / entity_id / score
  / is_pinned / is_stale / counters_snapshot / row` and **no matched-text field**. The "why it matched"
  signal every backend computes internally is thrown away before rendering.


  ## Acceptance

  - `SearchHit.snippet` optional, defaults `None`; omitting it is valid for any adapter.

  - At least the lexical adapters (SQLite, Postgres) populate it; summary hits render it when present.

  - Snippet length is bounded (config, e.g. `MCM_SNIPPET_MAX`) so this doesn''t reintroduce the token
  bloat #119 removed.

  - Conformance covers: snippet present renders; snippet `None` renders exactly as today.


  ## Non-goals

  - Not changing matching, ranking, or `include_archived`.

  - Not changing the summary-vs-full default.

  - Not building the semantic backend here — only making sure summary mode can carry its match signal
  when it lands.


  Follow-up to #119.'
