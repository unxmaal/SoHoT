prompt: '# #137a: server-owned per-session topic-coverage ledger + compaction reconciliation


  Child of #137 (retrieval scheduling umbrella). **The foundation — the other layers depend on this.**


  Give mcm-engine a lightweight **server-owned, per-FastMCP-session** retrieval ledger: coverage by *topic*
  (not TTL), each entry carrying `{topic, searched_at, query, result_ids, resident}`. Only the server
  sees the query + result ids, so the server owns it; the PreToolUse hook (a separate process) reads shared
  state or asks the server.


  Critical requirement — **coverage is not context residency** (KB CONTEXT #3, the founding anti-amnesia
  concern): a ledger that says "topic covered" after the retrieved bodies were summarized out of context
  recreates the exact failure mcm-engine exists to defeat. So carry a `resident` flag distinct from `searched_at`,
  and **reconcile it at the compaction boundary** — on `PreCompact`/`PostCompact` and `SessionStart`,
  mark prior coverage non-resident (or re-surface it). A non-resident topic does not satisfy enforcement.


  Keyed per FastMCP session (RULE #116 / ScopedTracker), same as the existing tracker state.


  ### Acceptance

  - Server-owned, per-session, per-topic coverage ledger with a `resident` flag.

  - `search` (and report_error auto-search) record coverage: topic, query, result_ids, searched_at, resident=true.

  - Reconciled at PreCompact/PostCompact/SessionStart (resident flips false on compaction).

  - Unit tests for record + reconcile; no behavior change to enforcement yet (that''s the PreToolUse child).


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `mcm_engine.tracker.ScopedTracker.is_covered(self, *args, **kwargs)`

  - `mcm_engine.tracker.ScopedTracker.reconcile_coverage(self, *args, **kwargs)`

  - `mcm_engine.tracker.ScopedTracker.record_coverage(self, *args, **kwargs)`

  - `mcm_engine.tracker.SessionTracker.is_covered(self, topic: str, *, require_resident: bool=True) ->
  bool`

  - `mcm_engine.tracker.SessionTracker.reconcile_coverage(self, *, resident: bool=False) -> None`

  - `mcm_engine.tracker.SessionTracker.record_coverage(self, topic: str, query: str, result_ids=None,
  *, resident: bool=True) -> None`'
