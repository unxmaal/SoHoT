prompt: '# link_knowledge requires entry ids that no tool surfaces, and its escalated nudge hard-blocks
  discovery (deadlock)


  ## Summary


  `link_knowledge` requires integer entry ids (`source_id`, `target_id`), but **no tool surfaces those
  ids** — `search` and `kb_recall` render titles + bodies, never the row id. So a caller cannot know what
  to pass.


  This compounds into a **deadlock**: the periodic-nudge system escalates an ignored `link_knowledge`
  nudge into a **hard block that forbids *all* other tools — including `search`** — until `link_knowledge`
  is called. In that state you must call `link_knowledge` but cannot look up the ids to pass it, forcing
  a blind guess (which creates wrong edges — the exact opposite of what the relations graph is for) or
  repeated errors.


  ## Repro (hit live)


  1. Store several knowledge entries over a session without calling `link_knowledge`.

  2. The nudge escalates: every tool call is rejected with `ESCALATED BLOCK: ''periodic:link_knowledge''
  ... You MUST call link_knowledge before any other tool.`

  3. Try to discover ids to link → `search` is also blocked.

  4. Only option left: guess ids by insertion order (I guessed knowledge `12 -> 10`). Guess is unverifiable
  and likely wrong.


  ## Why it''s bad


  - The feature is unusable as designed: you can''t build correct edges without ids you can''t obtain.

  - The escalation actively drives *garbage* edges (blind guesses), polluting the very graph `get_related`
  traverses.

  - Blocking the read tool needed to satisfy the nudge is a self-defeating gate.


  ## Relevant code


  - `src/mcm_engine/tools/relations.py` — `link_knowledge`

  - `src/mcm_engine/tools/search.py` — `search` result rendering (add ids)

  - `src/mcm_engine/tracker.py` + `mcm-engine.yaml` (`nudges.periodic_tools`, `nudge_escalation_threshold`)
  — escalation/blocking


  Found while dogfooding the mcm KB during the ingest-funnel work.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `class mcm_engine.config.NudgeConfig(store_reminder_turns: int = 10, checkpoint_turns: int = 25, mandatory_stop_turns:
  int = 50, hyper_focus_threshold: int = 3, rules_check_interval: int = 15, mandatory_stop_blocking: bool
  = False, mandatory_stop_grace: int = 5, nudge_escalation_threshold: int = 3, periodic_tools: dict[str,
  int] = field(default_factory=lambda: {''link_knowledge'': 25, ''add_negative'': 40}), advisory_periodic_tools:
  list[str] = field(default_factory=lambda: [''add_negative'', ''link_knowledge'']))`

  - `class mcm_engine.tracker.NudgeConfig(store_reminder_turns: int = 10, checkpoint_turns: int = 25,
  mandatory_stop_turns: int = 50, hyper_focus_threshold: int = 3, rules_check_interval: int = 15, mandatory_stop_blocking:
  bool = False, mandatory_stop_grace: int = 5, nudge_escalation_threshold: int = 3, periodic_tools: dict[str,
  int] = field(default_factory=lambda: {''link_knowledge'': 25, ''add_negative'': 40}), advisory_periodic_tools:
  list[str] = field(default_factory=lambda: [''add_negative'', ''link_knowledge'']))`'
