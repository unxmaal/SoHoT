id: mcm-engine-199-spec
modality: repo
prompt: '# Measure retrieval bloat before/after 4.0: recorded transcript bytes vs replayed bytes in replay-queries,
  and a live per-call size metric


  ## Why

  4.0.0 shipped the retrieval bloat fixes (#170 sanitize, #171 search caps, #172 hook injection cap) and
  the unified entries model (#176). Before releasing 4.0.1 or flipping the default (#192) Eric wants evidence
  that the token burn actually dropped, not a parity score. The replay harness (#182) measures agreement
  between read paths; it does not measure size, and nothing on the server records how many bytes each
  tool call returns.


  ## Raw material

  The Claude Code session transcripts under ~/.claude/projects/-Users-eric-projects/*.jsonl hold every
  mcm tool_use together with the tool_result the client actually received from the basement (3.16.x until
  2026-10-21). First pass over all transcripts, bytes of `search` results by day, pre-fix:


  ```

  day         n   total     median   p90     max

  2026-09-07  41  336 KB    6479     16333   46062

  2026-09-14  46  461 KB    10176    16136   23547

  2026-10-02  79  708 KB    6114     20023   48166  (3 persisted as "Output too large")

  2026-10-11  88  686 KB    4634     21263   30092

  2026-10-14  28  427 KB    15864    31230   45529

  ```

  Typical day: 300 to 700 KB of search output, median 5 to 10 KB per call, p90 15 to 25 KB, max around
  45 KB.


  ## Build

  1. `extract_queries` also captures the recorded result bytes by pairing each tool_use id with its tool_result.

  2. `replay` records `recorded_bytes`, `legacy_bytes`, `unified_bytes` per query and aggregates per tool:
  total, median, p90, and the ratio replayed/recorded. Printed by `format_report`, written to the JSON.

  3. Run on the mcm_rehearsal Postgres in natural mode (what the basement runs) and on the SQLite snapshot;
  store the numbers in the KB.

  4. Live metric going forward: record response bytes per tool call on the server so the same statistic
  can be read from the basement after the fact, not only from client transcripts. Scope to be decided
  in this issue after the replay numbers are in; `session_metrics` may be the right home.


  ## Acceptance

  - `mcm-engine replay-queries <transcripts> --store <dsn> --query-mode natural` prints, per tool, recorded
  vs replayed byte totals, medians and p90s.

  - Harness test: a fixture whose tool_results have known lengths yields the expected recorded bytes,
  and a replayed result of a known length yields the expected ratio.

  - The before/after numbers for `search` and `report_error` are stored in the KB with the corpus drift
  stated (snapshot 2026-10-20 vs transcript dates).'
