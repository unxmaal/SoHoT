id: mcm-engine-25-spec
modality: repo
prompt: '# Follow-up (#21): full additive-hybrid rerank in compose_rank


  Piece A (#24) shipped a minimal net `(correct − incorrect)` correctness term in `compose_rank` to keep
  regression risk low. This tracks the full **additive-hybrid** reformulation from mcm_v3_plan.md / the
  SOTA survey: sigmoid-normalize FTS5 `bm25()` (query-length-adaptive, Mem0-style), then additive-combine
  normalized hit / reinforcement / correctness / recency terms (Generative-Agents normalized weighted
  sum). Embedding-free. Keep `compose_rank_pinned_only` and the sort direction intact; pinned must still
  dominate. TDD in `tests/test_scoring.py`.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `mcm_engine.scoring.W_RELEVANCE`

  - `mcm_engine.scoring.compose_rank(*, raw_rank: float, hit_count: Optional[int], reinforcement_count:
  Optional[int], pinned: bool, age_days: Optional[float], correct_count: Optional[int]=None, incorrect_count:
  Optional[int]=None, query_terms: Optional[int]=None) -> float`

  - `mcm_engine.scoring.compose_rank_pinned_only(*, raw_rank: float, pinned: bool, query_terms: Optional[int]=None)
  -> float`

  - `mcm_engine.scoring.normalize_relevance(raw_rank: float, query_terms: Optional[int]=None) -> float`


  The hidden tests also hold a fix to these details (stated for this exam):

  - The weights are module constants in `mcm_engine.scoring`: `W_RELEVANCE` (multiplying `normalize_relevance(raw_rank,
  query_terms)`), `W_HIT`, `W_REINFORCEMENT`, `W_CORRECTNESS` and `W_RECENCY`, with `PINNED_WEIGHT` kept
  as the flat pinned boost. `W_RELEVANCE` must exceed the sum of the other four (values 2.0, 0.1, 0.3,
  0.5, 0.3), so a strong match with no hits, reinforcement or outcomes outranks a weak match with maximal
  hits, reinforcement, correctness and recency.

  - The saturated reinforcement term adds less than `W_REINFORCEMENT` (0.3) at any count.

  - `compose_rank_pinned_only` returns `W_RELEVANCE * normalize_relevance(raw_rank, query_terms)`, plus
  `PINNED_WEIGHT` when pinned. In `compose_rank`, pinned adds exactly `PINNED_WEIGHT`.

  - A net-zero outcome record (correct equal to incorrect) scores the same as no outcome data.'
