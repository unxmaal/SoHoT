id: mcm-engine-145-spec
modality: repo
prompt: '# Save and restore session state automatically at compaction (PreCompact/PostCompact hooks calling
  MCP tools)


  ## Problem

  Long sessions compact often: sohot 52 times in 39 days, mcm_engine 16, infovore 16 (counted from transcripts
  on 2026-10-15). Each compaction''s summary drops detail. Twice this week, sohot reported numbers from
  a summary that turned out to be wrong (KB #459 to #469, #461 to #467). Saving state before a compaction
  depends on the agent remembering to call `session_handoff`, which is exactly the "good intentions fail"
  case KB CONTEXT #3 describes.


  ## Fix

  Claude Code has `PreCompact` and `PostCompact` hook events, and hooks can call MCP tools directly with
  the `mcp_tool` handler type (`server`, `tool`, `input` with `${...}` substitution).

  - `PreCompact`: call `save_snapshot`/`session_handoff` with the session id and the compaction trigger,
  so the KB has the state before the summary replaces it.

  - `PostCompact` (and `SessionStart` with source=compact): call `get_resume_context` and return it as
  additionalContext, so the resumed agent starts from the KB record rather than only the summary.

  - Ship it from `mcm-engine hook install` (or a plugin) so every project gets it.


  Test: a forced `/compact` writes a snapshot row and the next turn''s context has the resume block. With
  the server unreachable, it fails open.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `mcm_engine.hooks.pre_compact._build_arguments(trigger: str, custom_instructions: str) -> dict[str,
  Any]`

  - `mcm_engine.hooks.pre_compact._mcp_http_endpoint(cwd: Path) -> tuple[Optional[str], dict]`

  - `mcm_engine.hooks.pre_compact._write_local(cwd: Path, args: dict[str, Any]) -> None`

  - `mcm_engine.hooks.pre_compact.main(argv: Optional[list[str]]=None) -> int`

  - `mcm_engine.hooks.pre_compact.mcp_http_call_tool(url: str, name: str, arguments: dict, *, headers:
  Optional[dict]=None, timeout: Optional[float]=None) -> str`


  The hidden tests also hold a fix to these details (stated for this exam):

  - `_build_arguments` returns the `save_snapshot` keyword arguments: key "progress" is a text that contains
  the trigger (an empty trigger becomes "auto"); key "open_questions" holds the custom instructions and
  is present only when they are non-empty.

  - `main` reads `trigger` and `custom_instructions` from the stdin event. When `_mcp_http_endpoint(cwd)`
  returns a URL it calls `mcp_http_call_tool(url, "save_snapshot", args, headers=..., timeout=...)` and
  never calls `_write_local`; when the URL is None it calls `_write_local(cwd, args)`. It returns 0 always,
  including on invalid stdin JSON and when the write raises.

  - `mcp_http_call_tool` and `_mcp_http_endpoint` exist in `mcm_engine.hooks.mcp_enforcement` and must
  be importable as attributes of `pre_compact` (the tests patch them there).

  - In `hooks/session_start.py`, an event with "source": "compact" gets a different directive whose text
  contains "compacted" (any case), "get_resume_context" and "MCP"; other sources keep the existing directive.'
