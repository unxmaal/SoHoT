modality: repo
prompt: '# lh jobs add accepts a whole command line as one argument, and the job fails only when it runs


  Five overnight jobs failed at once with rc=127, \"No such file or directory: ''uv run python -m evals.run
  --repeat 3''\". They were queued from zsh with an unquoted variable holding the command. zsh does not
  word-split parameters, so argv[0] was the entire command line. The mistake surfaced only when the worker
  ran the jobs, hours after queueing in the intended use.


  A second batch was queued with \`--priority\` through a deployed CLI that predated #362. That CLI did
  not know the option, so it stored \`--priority 5 --title ...\` as the command.'
