id: sohot-371-spec
modality: repo
prompt: '# The work-queue worker holds the machine lock for a whole job, so a discovery download blocks
  every GPU run


  2026-10-05: the queued discovery loop spent its time downloading (80 GiB budget). Meanwhile a corrected
  extract eval waited with \"waiting for external ... to finish\". The lock holder was the worker (\`kind:
  external\`), which wraps every job in \`exclusive.held(\"external\")\` for its whole duration (#353),
  network time included.


  Every command the queue runs that loads a model already takes the lock itself, and only while it loads:
  \`evals.run\` (#314), \`lh image\`/\`lh video\`, and discovery''s screens (through \`evals.run\`). The
  worker''s lock adds no protection; it only serialises network and disk work behind itself.


  Fix: the worker does not take the machine lock. Jobs still run one at a time (one runner), and each
  command takes the lock for the part that needs it. The test that a job holds the lock becomes a test
  that it does not, so a GPU run can start while a queued job is downloading.'
