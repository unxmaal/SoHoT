modality: repo
prompt: '# A reference model (claude-code:) can be adopted as a lane default by hand-judging


  \`lh judge <run>\` records every challenger the person prefers through \`adopt.record\`. If the owner
  preferred \`claude-code:claude-opus-5-5\` on the svg lane (which is in \`HUMAN_JUDGED\`), it would become
  the svg default. That would route a local lane to a cloud model through a subscription login. The \`claude-code:\`
  candidates exist as a ceiling to measure local models against (#359), never as a default.


  Fix: \`adopt.record\` never writes an adoption for a reference candidate. The person''s answers are
  still stored by \`human\` (who won each pairing), and the record says \"reference model; never a lane
  default\".'
