prompt: '# inspect: a stray small top-level .gguf sizes a huge split GGUF repo at megabytes


  Found during #413''s dry-run on a copy of the live store.


  unsloth/GLM-5.2-GGUF: inspect recorded `fits: weights from 0.0 to 0.0 GiB` with size_bytes 9423744 (9
  MB). The card total is about 9919 GiB. gguf.choose()/gguf.smallest() exclude split shards (`-0000N-of-0000M.gguf`),
  mmproj and imatrix, so the only servable top-level file left is a small one, and it decides both the
  verdict and the size.


  Before #413 the fetch tier already read this 9 MB figure; rank read the card''s `N GiB of weights` instead,
  so the two disagreed. After #413 both read proposals.size_bytes, so rank now calls it cheap to screen.'
