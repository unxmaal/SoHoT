prompt: '# Code from a feature branch silently migrates the live store ahead of the deployed services


  Found 2026-10-06 while building #423: a scratch `evals.run` from the agent''s worktree defaulted to
  the live LOCALHARNESS_HOME, and opening the store with that branch''s code would have migrated discovery.db
  to the branch''s schema. The deployed services then refuse a newer store (or, worse, a later main renumbers
  the same version differently). The agent caught it before anything was stored; the live store was confirmed
  at schema 36, integrity ok.


  The same class as RULE #329 (services must run the deploy checkout, never the working checkout): any
  process can open the live store, and connect() migrates on open.'
