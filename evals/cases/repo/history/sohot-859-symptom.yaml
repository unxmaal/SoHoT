prompt: '# hf-daily-papers asks for today''s UTC date at 01:00Z, gets 400, and fails every nightly sweep


  `hf-daily-papers` has failed every night since 2026-10-11 with `400 Bad Request` for `https://huggingface.co/api/daily_papers?date=<today
  UTC>`. The sweep runs at 21:00 EDT = 01:00Z, so it asks for a UTC date that has only just begun; by
  morning the same URL returns 200. The source''s last successful read was 2026-10-07 (failures=6).


  Each 400 is recorded `failed`, which makes `soh discover --loop` exit 1 ("loop exit 1: sweep reported
  a failure"), so every night''s sweep is reported as a failure and the papers feed is never read.'
