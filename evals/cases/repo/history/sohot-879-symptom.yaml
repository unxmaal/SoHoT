id: sohot-879-symptom
modality: repo
prompt: '# attempts metric has no METRIC_DIRECTION; the warning leaks into soh morning and verdict detail


  ## Problem

  The `attempts` metric has no entry in METRIC_DIRECTION, so `evals/core.py:438` warns "metric ''attempts''
  declares no direction in METRIC_DIRECTION; assuming lower is better" every time it ranks.


  Seen 2026-10-16:

  - `soh morning` output starts with the UserWarning and its source line.

  - The stderr text reached the store: verdict detail for Qwen/Qwen3.5-0.8B screened 2026-10-15 21:32
  ends with `||  [n for n in metric_names if direction_of(n) == "neutral"] ~/localharness/deploy/...`.
  Whatever builds screen detail from the subprocess output takes warnings along with the result.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `harness.commands.screen.screen_detail(why: str, stderr: str, summary) -> str`


  The hidden tests also hold a fix to these details (stated for this exam):

  - METRIC_DIRECTION[''attempts''] is ''lower''.

  - The evals also emit retries (evals/runners/claude_code.py), stages (evals/runners/chain.py) and thinking_disabled
  (evals/runners/text.py) with no METRIC_DIRECTION entry; each must be declared ''neutral'' in evals/core.py.

  - screen_detail(why, stderr, summary): when summary is not None (the run left a receipt) it returns
  why alone. When summary is None it returns f"{why} || {evidence}", where evidence is the stderr with
  each Python warning line (''<path>:<line>: UserWarning: ...'') and the indented source line after it
  removed, then whitespace collapsed to single spaces; with nothing left it returns why alone. Example:
  ''the screen exited 1 || Traceback ValueError: bad config''.'
