id: sohot-647-spec
modality: repo
prompt: '# Linux CI is cancelled when a slow apt mirror eats the 20-minute job limit


  PR #641 run 37776408316: check-linux was cancelled at its 20-minute limit after the apt step ''Tools
  make check needs'' took 13m11s (normally about 20 s). On the re-run apt took 19 s and make check 13m35s,
  so make check alone uses about two thirds of the budget, and one slow mirror cancels the job. #643 hit
  the same cancellation in the same step.


  Fix: cache the apt packages (or the .deb files) keyed on the package list, and give the apt step its
  own timeout-minutes so a stuck mirror fails fast and names itself instead of cancelling make check.
  Raise the job limit to leave margin. Related: RULE #532.


  The hidden tests also hold a fix to these details (stated for this exam):

  - The apt step keeps its name ''Tools make check needs''. Its timeout-minutes is an integer from 1 to
  8, and the check-linux job''s timeout-minutes is more than 20 above it.

  - The cache is an actions/cache/restore step before that step and an actions/cache/save step after it
  and before the ''make check'' step. Both use the same key, which reads a steps.<id>.outputs value (an
  earlier step that hashes the package list). The save step''s if tests the restore step''s cache-hit
  output.

  - The apt step''s run points apt at the cached directory with Dir::Cache::archives.'
