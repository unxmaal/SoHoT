id: sohot-376-symptom
modality: repo
prompt: '# Discovery screen slices the ranked queue before filtering for fetched weights, so fresh downloads
  are never screened


  Job 0013 (discovery loop, 80 GiB budget) fetched six models and the screen tier screened one older candidate
  instead.


  `cmd_discover --screen` takes `screen.plan(ranked)[:top]` and only then keeps rows whose state is READY.
  The head of the ranked queue is candidates the fetch skipped for budget (`waiting-on-fetch`), so they
  fill the top N and the freshly fetched rows fall below the cut. A dry run on the Studio shows 40 planned,
  8 ready, none screened.


  Same class as the fetch/screen ordering split fixed earlier: two tiers of one pipeline choosing from
  the same queue by different rules.'
