prompt: '# A Pages deploy stuck waiting on the environment blocked every later publish for 16 hours


  Run 37521808207 (2026-10-06 19:49Z) built fine and its deploy job sat ''waiting'' on the github-pages
  environment for 16 hours. pages.yml uses `concurrency: {group: pages, cancel-in-progress: false}`, so
  every later dispatch pended behind it and was then replaced by the next one: four publishes cancelled,
  and the live site stayed on the old page while main had the new one (#565). Cancelling the stuck run
  let today''s deploy go through at once.


