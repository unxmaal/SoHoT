modality: repo
prompt: '# OmniSVG is re-queued every loop with harness_error: base weights Qwen2.5-VL-3B-Instruct not
  cached


  Every discovery loop reports OmniSVG/OmniSVG1.1_4B as ''QUEUED: not screened: harness_error ... icon-gear:
  weights not cached: Qwen/Qwen2.5-VL-3B-Instruct. Run scripts/setup-omnisvg.sh''. The classification
  is right (it says nothing about the candidate), but nothing acts on it, so the candidate stays queued
  forever and spends a screen slot each run.


  Fix: the fetch step should fetch declared base weights the runner needs (they are a lineage parent,
  like adapters'' base models), within the disk budget; failing that, record the candidate as waiting
  on a named setup step and skip it until that step''s artifact exists. Test: a candidate whose runner
  needs an uncached base is fetched with it, or is waiting and not re-screened.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `harness.fetching.run(conn, sizes: dict[str, int] | None=None, *, limit: int=1, snapshot=None, free:
  int | None=None, lane: str='''', budget: int | None=None, listing=None, hf_download=None, floor: int=DISK_FLOOR,
  sizer=None) -> list[dict]`

  - `harness.fetching.runner_bases(model_id: str) -> list[str]`'
