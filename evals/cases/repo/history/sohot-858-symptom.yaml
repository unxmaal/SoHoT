id: sohot-858-symptom
modality: repo
prompt: '# Candidates the #803 length cap declined stay declined after #813 made limits pause instead


  Three candidates that passed the screen on 2026-10-12 (openbmb/MiniCPM5-2B, LiquidAI/LFM2.5-2.6B, WeiboAI/VibeThinker-3B)
  were refused by the old #803 per-measurement length cap. They were recorded `declined` with reason `limit`
  and no `until`/`reopens` (verdicts 11612-11614).


  #813 (PR #815) replaced that refusal with pause and resume, but nothing reopened the verdicts it had
  already written. The 2026-10-13 sweep did not consider them, so they will never be measured.


  The hidden tests also hold a fix to these details (stated for this exam):

  - The step is a new harness/memory_store/migrations/v71.py with a module-level VERSION = 71 and a data(conn)
  function, which is the phase the step loader calls (it calls no migrate/up/apply). SCHEMA_VERSION in
  harness/memory_store/schema.py becomes 71.

  - data(conn) calls a new _requeue_length_refusals(conn) in harness/memory_store/migrations/retractions.py.

  - The length refusals are tier ''adopt'', reason ''limit'', with a detail like ''code: not run: 135
  case(s) x repeat 1 x 2 call(s) projected at 3h 26m, over the 2h 00m budget; ...''. Only a proposal whose
  state verdict is such a refusal with an empty until, and whose verdict just before it (by id) is ''screened'',
  is requeued; it goes back to state ''screened'' so ms.survivors() lists it. Other adopt/limit declines
  (for example an ''underpowered'' one), screen-tier limit declines, a refusal that carries an until,
  and a refusal superseded by a later verdict stay as they are.'
