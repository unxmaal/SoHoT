prompt: "# claude-code runner passes the prompt as an argument, so a prompt starting with '-' is parsed\
  \ as an option\n\nExtract lane, 2026-10-05: \\`claude-code:claude-opus-5-5\\` failed 2/10, both in the\
  \ runner rather than the model:\n\n    claude -p exited 1 without JSON: error: unknown option '--- a/scripts/...'\n\
  \    claude -p exited 1 without JSON: Error: --resume requires a valid session\n\nThe user message goes\
  \ in argv after \\`-p\\` as a positional. Extract cases embed material that can start with \\`-\\` (a\
  \ unified diff), and the CLI parses it as options. One case's text even turned into \\`--resume\\`.\n\
  \nFix: pass the user message on stdin (\\`claude -p\\` reads its prompt from stdin when none is given),\
  \ so no case content can reach the argument parser. Then re-run extract.\n\nThe hidden tests also hold\
  \ a fix to these details (stated for this exam):\nThe execute call passes the user message as its input=\
  \ keyword and adds encoding=\"utf-8\" alongside text=True, so the pipe is UTF-8 whatever the locale."
