prompt: '# A discrete card reserves the unified-memory default, so half of it is unusable


  `context.budget_bytes()` is the planner''s VRAM budget:


  ```python

  return int((memory.ceiling_gb() - memory.measured_reserve_gb(conn)) * 1024 ** 3)

  ```


  `measured_reserve_gb()` returns the largest margin `lh memory ramp` stored for this machine, and **falls
  back to `DEFAULT_RESERVE_GB` regardless of what it is budgeting for**. There are two reserves and it
  picks the wrong one:


  ```

  DEFAULT_RESERVE_GB  = 6.0   unified memory: the GPU draws from system RAM, so 6 GiB for the OS is right

  DISCRETE_RESERVE_GB = 2.0   a card is the wall; what the desktop holds comes off via available_gb

  MIN_RESERVE_GB      = 1.0

  ```


  `memory.reserve_for(acc)` already chooses between them correctly. `measured_reserve_gb` does not ask.


  On the 4070 node there is no ramp history, so the fallback applies: a 12 GiB card reserves 6 GiB, half
  of itself, and the planner budgets 5.99 GiB.


  Measured consequences, by passing `plan()` the budget the discrete reserve gives:


  | | reserve 6.0 (today) | reserve 2.0 (correct) |

  |---|---|---|

  | Qwen2.5-7B-Instruct-Q4_K_M | ctx 28672, **7 slots**, "8 asked, 7 fit" | ctx 32768, **8 slots**, 1.8
  GiB of KV |

  | Qwen2.5-14B-Instruct-Q4_K_M | **refused**: "0.0 GiB of KV room holds 0 tokens" | ctx 8192, 1 slot,
  1.6 GiB of KV |

  | Qwen2.5-32B-Instruct-Q4_K_M | refused | refused, correctly: 18.48 GiB of weights |


  Two things follow.


  The 14B is refused by a constant, not by this machine. Nothing about the card prevents 8.37 GiB of weights
  plus 1.6 GiB of KV from fitting in 11.99 GiB.


  And **"8 asked, 7 fit" was never this card running out of room.** It was the planner holding half the
  card for a desktop that does not need it. KB #367''s measured knee for the 7B is 8 x 4096 unified, and
  with the right reserve this box delivers exactly that. Any baseline served at 7 slots measured a shape
  that is not the knee; by that KB entry''s own figures the 7-to-8 slot step is most of the distance between
  4700 and 9570 req/h.


  Fix: the fallback should be `reserve_for(detect())`, so a machine with no ramp history gets the default
  for the accelerator it actually has.


  Note for whoever reviews the tests: `test_the_reserve_is_the_largest_measured_margin` and `test_a_memory_limits_file_is_not_read`
  both assert `DEFAULT_RESERVE_GB` on an empty store without pinning an accelerator. They pass on a unified
  runner and would fail on a discrete one, so they are platform-dependent today and the fix makes that
  visible. They should pin the machine they mean, which is RULE #249''s point one layer down.'
