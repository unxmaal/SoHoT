modality: repo
prompt: '# A neighbor sighting reopens a decided candidate, and a README-only snapshot counts as downloaded


  Sweep at 22:43 on the Studio:


  1. Qwen/Qwen3.5-0.8B had a terminal ''declined at adopt'' verdict (22:18). The inspect tier''s neighbor
  path (''named by vllm-project/vllm-metal'') wrote inspect ''queued'' over it, so the candidate was screened
  and will be measured again. That path never reads the latest verdict.

  2. NemoStation/Marlin-2B''s hub dir holds a snapshot with only LICENSE and README (Sep 20), no config
  or weights. fetching.have() checks only that the dir exists, so fetch skipped it, the screen ran, and
  the candidate got a terminal ''broken'' for ''No such file or directory ... config.json'': a download
  that never happened, blamed on the model.


  Fix: the neighbor path does not re-queue a name whose latest verdict is terminal or past inspect; have()
  requires a snapshot with a config or weight file; schema 20 requeues broken verdicts whose snapshot
  has no weights.'
