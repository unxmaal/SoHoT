id: infovore-256-spec
modality: repo
prompt: '# labels export: JSONL of human relevance labels with cascade stage


  Add `infovore labels export --jsonl PATH [--include-excluded-channels]`: one object per labelled current
  exchange (latest human_exchange label, bad_grouping dropped) with id, text (llm-score render, unwindowed),
  label, held_out, slice, channel, cascade_stage, label_source. Excluded channels omitted by default;
  ordered by id; prints counts per label, held_out, cascade_stage.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - CLI option: `--include-excluded-channels`

  - CLI option: `--jsonl`


  The hidden tests also hold a fix to these details (stated for this exam):

  - The `labels` command is a new Command registered in builtin_commands, with `configure(parser)` and
  `async run(context, args)`; `export` is its subcommand. It writes one JSON object per line to the --jsonl
  path, creating parent directories as needed.

  - Field values: `label` is `relevant` or `irrelevant`. `text` is the llm-score render''s lines joined
  with `\n`. `channel` is the parent channel''s name for a thread, otherwise the channel''s own name.
  `slice` is the alphabetically first current slice the exchange belongs to, or null. `cascade_stage`
  is the stage name (e.g. `lexicon`, `embed`, `short_no_tech`) of the latest relevance_* annotation with
  a non-null label, or null. `label_source` comes from the latest human_exchange annotation''s source_ref:
  the second `:` part for `judge:<x>:<n>`, otherwise the part before the first `:`, and null when there
  is no ref.

  - Printed counts: `labels: N`, then one line per value as `<field> <value>: <count>` for label, held_out
  and cascade_stage, with values lowercased and null printed as `none` (e.g. `held_out true: 2`, `cascade_stage
  none: 2`).'
