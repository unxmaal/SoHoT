prompt: '# judge report --by-channel: per-channel label breakdown


  Per channel: labelled, relevant, irrelevant, % irrelevant, total exchanges, excluded flag. Latest human_exchange
  label (bad_grouping excluded), reusing triage/human.training_labels. Sort by % irrelevant desc then
  labelled desc; --min-labels N (default 1); excluded channels marked, not hidden.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - CLI option: `--by-channel`

  - CLI option: `--min-labels`


  The hidden tests also hold a fix to these details (stated for this exam):

  - Output is a header line whose whitespace-separated tokens are `channel labelled relevant irrelevant
  %irrelevant exchanges excluded`, then one whitespace-separated row per channel in that order.

  - The channel name prints bare, with no leading `#`. labelled is relevant + irrelevant (bad_grouping
  not counted); exchanges is every exchange in that channel, labelled or not; % irrelevant prints with
  one decimal and a `%` sign, e.g. `33.3%`, `100.0%`; the excluded column is `yes` or `no`.

  - A thread gets its own row and is not rolled into its parent channel. A row is excluded (per INFOVORE_EXCLUDE_CHANNELS)
  when its own name or its parent channel''s name is denylisted.

  - When no channel reaches --min-labels, print exactly `no channels with at least N labels` (N the --min-labels
  value) and exit OK.'
