prompt: '# Negative controls for the claim check and the wiki gates


  From the 2026-10-10 review. Every metric so far was computed on a target produced by the system under
  test and with no control.


  Build `infovore claims controls` (read-only, CPU):

  1. Shuffle citations within each exchange and recompute the deterministic check overlap; report the
  supported rate on shuffled pairs. If it stays near the real rate, the checker is lax and its verdicts
  mean little.

  2. Pair each claim with a random claim from the same channel and month; its overlap with the wrong messages
  is the floor for `support.FLOOR`.

  3. From article run 0078 (tonight): sentence drop rate in `keep_supported` by the verdict of the claims
  the sentence cites (supported / uncheckable / unsupported_fact / low_overlap). This is the free randomized
  read on #337.

  4. Lexicon recall against a length- and position-matched sample of uncited messages, replacing the raw
  recall in #334.


  Output: one table per control, JSON with `--json`. Author-cluster bootstrap for every interval (rows
  cluster by author and by exchange).


  🤖 Generated with [Claude Code](https://claude.com/claude-code)


  https://claude.ai/code/session_018FFkm1LHqCXapmvM9uBMXc'
