id: infovore-353-spec
modality: repo
prompt: '# Net-new check: rank and label claims by novelty against a reference corpus before they reach
  the wiki


  The owner, 2026-10-11: "Are we testing if the claims are net-new before writing them to the wiki? If
  not we should. Obviously IRIX runs on an Octane. That''s old and well established info."


  We are not. Today a claim reaches a page if it passes the verdict gate and its topic has 3 claims; corroboration
  only orders groups within a section. "The Octane runs IRIX (+3 similar; 4 speakers)" is the first line
  of Octane / With IRIX because it is the most corroborated statement there, and it is also the least
  informative.


  Design, programmatic throughout (RULE #313: no LLM judgement over the corpus):


  1. Reference corpus. Fetch the Wikipedia article (English, REST summary plus the plain-text extract)
  for every page topic that resolves to an exact title, cache it in a `reference_texts` table keyed by
  topic and fetched_at. Split into sentences. Expect a few hundred topics to resolve; that covers the
  hardware, OS and vendor pages where "well established" lives. Later: SGI techpubs and the IRIX Network
  wiki if their terms allow.

  2. Novelty score. Embed claim statements and reference sentences with bge-small (already in `--extra
  embed`). For each claim, novelty = 1 minus the max cosine to any reference sentence for its topics.
  Also an intra-corpus generic score: the fraction of a claim''s content tokens that are topic names or
  the top 50 corpus-wide tokens; "The Octane runs IRIX" scores 1.0, a war story about a specific PSU fault
  scores near 0.

  3. Storage. `claim_novelty(claim_id, reference_max_cosine, reference_topic, generic_share, computed_at)`,
  filled by `infovore claims novelty --run R --tag-run T [--write]`, idempotent, read-only on everything
  else.

  4. Use. `wiki build|stats --novelty-floor F` drops claims whose reference cosine is above 1 minus F
  (established elsewhere) from list sections and demotes them to the end of the page as "Background" with
  the Wikipedia link; group order within a section becomes (corroboration, novelty) so a corroborated
  novel claim leads. Writer units get only the novel leads.

  5. Controls before anyone trusts it: the novelty distribution for claims on topics with a reference
  versus topics without; a hand-free sanity check by printing the 20 least novel and 20 most novel claims
  per sampled topic; and the share of claims on the Octane page above the floor.


  Out of scope: judging truth (that is the claim check and #268), and anything that calls a model per
  claim.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `class infovore.wiki.build.WikiClaim(claim_id: int, exchange_id: int, date: str, speaker: str, statement:
  str, topics: frozenset[str], check: str | None = None, novelty: float | None = None, reference: str
  | None = None)`

  - `infovore.wiki.build.build_site(claims: Iterable[WikiClaim], min_claims: int, out: Path, articles:
  Mapping[str, Article] | None=None, min_section: int=1, grouper: ''Grouper | None''=None, background:
  float | None=None) -> list[str]`

  - `infovore.wiki.build.compute_stats(claims: Iterable[WikiClaim], min_claims: int, background: float
  | None=None) -> Stats`

  - `infovore.wiki.build.established(claim: WikiClaim, background: float | None) -> bool`

  - `infovore.wiki.build.load_claims(conn: sqlite3.Connection, tech_only: bool=False, salt: str | None=None,
  runs: Sequence[int] | None=None, tag_runs: Sequence[int] | None=None, verdicts: frozenset[str] | None=None,
  background: float | None=None) -> tuple[list[WikiClaim], Excluded]`

  - `infovore.wiki.build.render_page(name: str, claims: Collection[WikiClaim], files: Mapping[str, str],
  article: Article | None=None, min_section: int=1, grouper: ''Grouper | None''=None, background: float
  | None=None) -> str`

  - CLI option: `--background`


  The hidden tests also hold a fix to these details (stated for this exam):

  - `claims novelty` and `claim_novelty` already exist. This task is the wiki use step, and the floor
  flag is `--background C` on `wiki build`, `wiki stats` and `wiki write`, in place of `--novelty-floor`.

  - `WikiClaim.novelty` holds the claim''s stored reference max cosine as-is (not 1 minus it), and `reference`
  holds its reference title. Both are filled only when load_claims gets a background value; claims without
  a row keep None.

  - `established(claim, background)` is true when background is not None, novelty is not None, and novelty
  >= background.

  - Within a corroboration level, groups sort by the lead''s novelty ascending, with None counted as 0.0,
  ahead of the existing keys.

  - render_page with background moves established claims out of the sections into a `## Background` heading
  after them. Each entry reads `- <statement> ([<title>](https://en.wikipedia.org/wiki/<title with spaces
  as _, URL-quoted>), cosine 0.93; <speaker>, <date>)`, with the bare word `reference` in place of the
  link when there is no title.

  - `wiki stats` always prints `background: N` (established claims), followed by ` (cosine >= C)` when
  --background is given. `wiki write` drops established claims from its input.'
