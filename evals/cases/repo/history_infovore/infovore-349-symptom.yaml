prompt: '# wiki build: page slugs collide and the later topic overwrites the page; non-ASCII topics slug
  to an empty filename


  On the full build from tag run 1 (5,695 pages) \`slug()\` in \`infovore/wiki/topics.py\` lowercases
  and replaces every non \`[a-z0-9]\` run with \`-\`, and \`build_site\` keys files by it. 12 slugs are
  shared by 25 topics, and the last topic written wins:


  - \`o2\`: O2 (one of the largest topics) and O2机器 (4 claims). o2.md is the 4-claim page.

  - \`c\`: C, C#, C++. \`g\`: g, g++. \`hfs\`: HFS, HFS+. \`prboom\`: PrBoom, PrBoom+. \`gtk\`: GTK, gtk+.

  - \`origin\`: $ORIGIN, Origin. \`path\`: $PATH, PATH. \`bootp\`: bootp, bootp(). \`indigo\`: Indigo,
  Indigo². \`intel-sc450nx\` with and without ®. \`radeon-driver\` with and without asterisks.


  The topic 电源供应 slugs to the empty string, so its page is \`.md\` and See-also links point at \`(.md)\`.


  The tagger emitting Chinese, ® and bracketed variants of one thing is a separate topic-merge problem
  (#142).'
