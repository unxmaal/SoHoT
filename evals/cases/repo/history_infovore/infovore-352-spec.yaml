modality: repo
prompt: '# Topic merge: fold symbol, script, plural and generic-suffix variants of one tag onto one page
  (refs #142)


  Measured on tag run 1 (74,131 raw tags, 65,978 canonical keys after `canon.canonical`, 9,551 keys with
  3+ claims). Four variant classes survive the current canonicalisation, which only casefolds, strips
  vendor prefixes, spaces, hyphens and dots:


  | class | keys folded | claim-tags moved | examples |

  |---|---|---|---|

  | symbols and NFKC (®, ™, *, quotes, `()`, `$`, superscripts) | 131 | 185 | `bootp()` to bootp, Indigo²
  to Indigo2, $ORIGIN to Origin, *BSD to BSD |

  | non-ASCII script around an existing key | 20 | 35 | O2机器 to O2, Fuel工作站 to Fuel, Numalink™ to NUMAlink
  |

  | plural with the singular present | up to 3,326 | up to 13,621 | SGIs, Indys, O2s, Octanes, PSUs, power
  supplies, capacitors |

  | generic noun suffix or "the" prefix | up to 1,220 | up to 2,401 | IRIX systems, O2 systems, Unix workstations,
  Alpha machines |


  The last two need guards or they merge wrongly: Windows to window, XFS to xf, VMS to VM, Challenge S
  to Challenge, emacs to eMac, DOSBox to DOS, Xbox to X, Visual Workstation to visual. Guards that hold
  on the measured list: plural detection on the most common raw spelling (final lowercase `s`, not after
  a space, not `ss`), the suffix must be a separate word, and the target key must carry at least a quarter
  of the variant''s claim count (so a 287-claim Windows never folds into a 6-claim window).


  Plan:

  - `canonical()` applies NFKC and strips ®™©*, quotes, `()` and a leading `$` (count-independent, so
  it stays a pure function).

  - `merge_map(spellings)` in canon.py returns variant key to target key for script stripping, plurals
  and generic suffixes, with the guards above, computed once per build from the tag counts.

  - `load_claims` maps each tag through canonical then merge_map; display names come from the merged spelling
  counts.

  - `wiki stats` reports how many keys and claim-tags the merge folded.


  Out of scope: translation of fully non-Latin tags (14 keys, 18 claim-tags), semantic merges (RS/6k vs
  RS/6000), and an authority file of canonical hardware names (#142).


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `class infovore.wiki.canon.Merged(keys: int, tags: int)`

  - `infovore.wiki.canon.display_names(tags: Iterable[str], merge: Mapping[str, str] | None=None) -> dict[str,
  str]`

  - `infovore.wiki.canon.merge_map(spellings: Spellings) -> dict[str, str]`

  - `infovore.wiki.canon.spelling_counts(tags: Iterable[str]) -> dict[str, Counter[str]]`

  - `infovore.wiki.canon.summarise_merge(spellings: Spellings, merge: Mapping[str, str]) -> Merged`


  The hidden tests also hold a fix to these details (stated for this exam):

  - canonical() also strips the en dash and em dash (`N–brick` gives `nbrick`) and backticks along with
  the other quotes.

  - The plural rule applies only to a spelling of at least 3 characters, so `as` never folds onto `a`.
  It tries dropping the final `s`, and also `ies` to `y` and dropping `es`.

  - The generic nouns are machine, system, computer and workstation, singular or plural.

  - merge_map resolves chains to their final target (`Indys systems` to `indy`) and stops when it meets
  a cycle.

  - `Merged(keys, tags)` counts the folded keys and the claim-tags on them. Its str is `N keys, M claim-tags`,
  and `wiki stats` with a tag run prints the line `merged: N keys, M claim-tags`.'
