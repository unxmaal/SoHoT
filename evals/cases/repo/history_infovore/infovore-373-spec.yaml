id: infovore-373-spec
modality: repo
prompt: '# Fix a mistake: reader-facing corrections page, claim corrections file, nav link on every page


  The site is generated, not edited. Readers who spot a wrong claim, a topic on the wrong page or a bad
  kind have no obvious way to fix it, and the only mechanism that exists today is `topics.toml`. A wrong
  claim cannot be fixed at all.


  ## Deliverables


  1. **`infovore/wiki/corrections.toml`**, a claim-level correction file. An entry matches a claim by
  `exchange` id plus the exact `statement` as printed under Sources, and either `drop = true` or `replace
  = "new wording"`. `load_claims` applies it after scrubbing; dropped claims count under `excluded` as
  `corrected`, replaced claims keep their id. Because `_prose` already keeps only sentences whose cited
  claims are on the page, a drop removes the dependent prose at the next build with no rewrite. A replace
  shows at once under Sources and the prose catches up on the next article run. `stats` and `build` print
  `corrections unmatched: N` when an entry matches nothing, so typos are visible.

  2. **A `fix.md` / `fix.html` page** written by every build: what the site is, why hand edits do not
  work, the two files a PR can change, with an example entry of each, and the issue tracker for anything
  else.

  3. **Nav link `Fix a mistake` on every page** plus a footer line `Spotted a mistake? Fix it.`

  4. **README section** pointing at the same two files.


  Naming of the site (wiki vs digest) is a separate decision and not changed here.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `class infovore.wiki.corrections.Correction(exchange: int, statement: str, replace: str | None)`

  - `infovore.wiki.build.load_claims(conn: sqlite3.Connection, tech_only: bool=False, salt: str | None=None,
  runs: Sequence[int] | None=None, tag_runs: Sequence[int] | None=None, verdicts: frozenset[str] | None=None,
  background: float | None=None, corrections: Mapping[tuple[int, str], Correction] | None=None) -> tuple[list[WikiClaim],
  Excluded]`

  - `infovore.wiki.corrections.Correction.key(self) -> tuple[int, str]`

  - `infovore.wiki.corrections.load_corrections(text: str | None=None) -> dict[tuple[int, str], Correction]`


  The hidden tests also hold a fix to these details (stated for this exam):

  - corrections.toml entries are `[[claim]]` tables with `exchange`, `statement`, and `drop = true` or
  `replace`. The shipped file has no active entry. `load_corrections(None)` reads the corrections.toml
  beside the module.

  - A statement''s whitespace is collapsed (`" ".join(s.split())`), and `key` is a property `(exchange,
  statement)`.

  - load_corrections raises ValueError with `correction` in the message when an entry has neither drop
  = true nor replace, has both, or repeats a key.

  - `Excluded` gains `unmatched`: a tuple of the Correction objects that matched no claim, sorted by key,
  defaulting to `()`.

  - A claim matched by a drop counts as `corrected` only when it has no other exclusion reason. An entry
  that matches a claim excluded for another reason still counts as matched.

  - `wiki stats` and `wiki build` always print `corrections unmatched: N`, including when N is 0.

  - Every build writes `fix.md` beginning `# Fix a mistake\n`, and `fix` is a reserved file name, so a
  topic named Fix gets `fix-2.md`.

  - The HTML nav reads `... All topics</a> | <a href="fix.html">Fix a mistake</a> | <a ...>Guestbook</a>
  ]`, and the footer contains `Spotted a mistake? <a href="fix.html">Fix it</a>.`

  - html `body()` renders consecutive lines indented four spaces (outside a list) as one `<pre>` block:
  the indent is removed, the lines are joined with `\n`, and the text is HTML-escaped without quote escaping.
  A preceding paragraph is closed first. E.g. `Add this:\n    [[claim]]\n    x = "<b>"\n\nText\n    more\n##
  H\n` gives `<p>Add this:</p>\n<pre>[[claim]]\nx = "&lt;b&gt;"</pre>\n<p>Text</p>\n<pre>more</pre>\n<h2
  id="h">H</h2>\n`.'
