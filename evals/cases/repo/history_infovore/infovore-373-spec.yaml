modality: repo
prompt: '# Fix a mistake: reader-facing corrections page, claim corrections file, nav link on every page


  The site is generated, not edited. Readers who spot a wrong claim, a topic on the wrong page or a bad
  kind have no obvious way to fix it, and the only mechanism that exists today is `topics.toml`. A wrong
  claim cannot be fixed at all.


  ## Deliverables


  1. **`infovore/wiki/corrections.toml`**, a claim-level correction file. An entry matches a claim by
  `exchange` id plus the exact `statement` as printed under Sources, and either `drop = true` or `replace
  = "new wording"`. `load_claims` applies it after scrubbing; dropped claims count under `excluded` as
  `corrected`, replaced claims keep their id. Because `_prose` already keeps only sentences whose cited
  claims are on the page, a drop removes the dependent prose at the next build with no rewrite. A replace
  shows at once under Sources and the prose catches up on the next article run. `stats` and `build` print
  `corrections unmatched: N` when an entry matches nothing, so typos are visible.

  2. **A `fix.md` / `fix.html` page** written by every build: what the site is, why hand edits do not
  work, the two files a PR can change, with an example entry of each, and the issue tracker for anything
  else.

  3. **Nav link `Fix a mistake` on every page** plus a footer line `Spotted a mistake? Fix it.`

  4. **README section** pointing at the same two files.


  Naming of the site (wiki vs digest) is a separate decision and not changed here.'
