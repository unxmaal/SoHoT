prompt: '# claims schema: constrain the speaker slot to user-xxxx


  Run 6 (the compact tuple format from #278, eval-7b, gold 50) rejected 16 claims as "unknown speaker":

  - 14 dropped the `user-` prefix (`22f9` instead of `user-22f9`).

  - 1 put a ref (`[12]`) in the speaker slot.

  - 1 put the claim text in the speaker slot.


  Fix: give the speaker item of the tuple a `pattern` matching the pseudonym format. The llama-server
  grammar then forbids all three at generation time. This is a schema change only, with no lenient parsing.'
