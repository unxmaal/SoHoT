id: infovore-338-spec
modality: repo
prompt: '# Corroboration score per claim cluster: distinct speakers and exchanges, embedding clustering


  From the 2026-10-10 review. The only programmatic value signal every reviewer converged on: how many
  independent people, in how many separate conversations, said the same thing. Tag run 1 has 74,131 topics,
  80% single-speaker; the signal exists and nothing uses it.


  Build:

  - Cluster claims within a topic by bge-small embedding similarity (reuse `triage/embed_stage`), not
  token Jaccard 0.5 (`wiki/groups.py`), which undercounts paraphrases. Keep Jaccard as a fallback when
  the embed extra is absent.

  - Per cluster: distinct speakers, distinct exchanges, date span, and the verdict mix (#337).

  - Expose it in `load_claims`/`group_claims`: clusters ordered by corroboration; singletons flagged as
  single-source rather than cut (#339).

  - `wiki build` prints the corroboration distribution; pages show "N people, M conversations, first/last
  seen" per sentence group.


  Metric (no labels): share of published sentences resting on clusters with 2+ speakers, before and after.
  Contradiction audit: sample 200 clusters and count merges of contradictory predicates (negation markers),
  as a check that embedding clustering does not merge "crashed" with "crashed after the patch".


  This is the first step of #142 and the reframe recorded in the KB (corroboration-ranked, dated, source-linked
  index; prose only for corroborated clusters).


  🤖 Generated with [Claude Code](https://claude.com/claude-code)


  https://claude.ai/code/session_018FFkm1LHqCXapmvM9uBMXc


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `infovore.wiki.build.render_page(name: str, claims: Collection[WikiClaim], page_names: Collection[str],
  article: Article | None=None, min_section: int=1, grouper: ''Grouper | None''=None) -> str`

  - `infovore.wiki.groups.ClaimGroup.corroboration(self) -> int`

  - `infovore.wiki.groups.ClaimGroup.exchanges(self) -> frozenset[int]`

  - `infovore.wiki.groups.ClaimGroup.span(self) -> tuple[str, str]`

  - `infovore.wiki.groups.ClaimGroup.speakers(self) -> frozenset[str]`

  - `infovore.wiki.groups.cosine(a: Vector, b: Vector) -> float`

  - `infovore.wiki.groups.group_claims(claims: Sequence[WikiClaim], threshold: float=JACCARD_THRESHOLD,
  vectors: Sequence[Vector] | None=None, vector_threshold: float=VECTOR_THRESHOLD) -> list[ClaimGroup]`

  - `infovore.wiki.groups.load_embedder(model_id: str, revision: str) -> SentenceTransformerEmbedder`

  - `infovore.wiki.groups.make_grouper(embedder: Embedder, claims: Sequence[WikiClaim], vector_threshold:
  float=VECTOR_THRESHOLD) -> Grouper`

  - `infovore.wiki.groups.make_grouper_for(grouping: str, claims: Sequence[WikiClaim]) -> Grouper`

  - `infovore.wiki.groups.summarise(groups_by_page: Sequence[Sequence[ClaimGroup]]) -> Corroboration`

  - CLI option: `--grouping`


  The hidden tests also hold a fix to these details (stated for this exam):

  - Existing repo pieces not in context: `infovore.triage.embed` has `Embedder` (method `embed(texts:
  list[str]) -> list of vectors`), `EMBED_BATCH`, `DEFAULT_MODEL` and `DEFAULT_REVISION`; `infovore.triage.embed_backend.load_embedder(model_id,
  revision)` loads the real one. groups.py imports `load_embedder` into its own namespace, and the embed
  path calls it through that name.

  - `ClaimGroup.speakers`, `exchanges`, `span` and `corroboration` are properties. span is (earliest date,
  latest date) and corroboration is the number of distinct speakers.

  - group_claims orders groups by corroboration desc, then distinct exchanges desc, then member count
  desc, then lead date, then lead claim_id.

  - With `vectors`, a claim joins the first group whose lead''s vector has cosine >= vector_threshold
  (`VECTOR_THRESHOLD` 0.85) instead of using tokens. If the vector count differs from the claim count
  it raises ValueError containing `one vector per claim`. `cosine` returns 0.0 when either vector is all
  zeros.

  - `make_grouper` embeds every claim once up front, in chunks of EMBED_BATCH statements, and returns
  a callable that groups any subset of those claims by their stored vectors. `make_grouper_for("jaccard",
  ...)` returns `group_claims` itself; `"embed"` uses `load_embedder(DEFAULT_MODEL, DEFAULT_REVISION)`.

  - `summarise` returns an object with `groups`, `by_speakers` (keys `"1"`, `"2"`, `"3+"`), `corroborated_claims`
  (members of groups with 2+ speakers), `claims` (all members) and a `share` property (0.0 when there
  are no claims). Its str is e.g. `groups 3 (1 speaker(s) 1, 2 speaker(s) 1, 3+ speaker(s) 1); claims
  in 2+ speaker groups 5/6 (83.3%)`.

  - `--grouping` takes `jaccard` (default) or `embed` on `wiki build`, `wiki stats` and `wiki write`.
  Both build and stats print `corroboration: <that summary>` over the groups of every page that is built.

  - Each fallback page entry keeps its current text but ends `; N speaker(s), M conversation(s))` in place
  of the closing `)`, e.g. `- Indigo2 has an R4400 cpu (+1 similar) (user-1, exchange 11, 2026-02-01;
  2 speaker(s), 2 conversation(s))`, on every entry including singletons.'
