modality: repo
prompt: '# Corroboration score per claim cluster: distinct speakers and exchanges, embedding clustering


  From the 2026-10-10 review. The only programmatic value signal every reviewer converged on: how many
  independent people, in how many separate conversations, said the same thing. Tag run 1 has 74,131 topics,
  80% single-speaker; the signal exists and nothing uses it.


  Build:

  - Cluster claims within a topic by bge-small embedding similarity (reuse `triage/embed_stage`), not
  token Jaccard 0.5 (`wiki/groups.py`), which undercounts paraphrases. Keep Jaccard as a fallback when
  the embed extra is absent.

  - Per cluster: distinct speakers, distinct exchanges, date span, and the verdict mix (#337).

  - Expose it in `load_claims`/`group_claims`: clusters ordered by corroboration; singletons flagged as
  single-source rather than cut (#339).

  - `wiki build` prints the corroboration distribution; pages show "N people, M conversations, first/last
  seen" per sentence group.


  Metric (no labels): share of published sentences resting on clusters with 2+ speakers, before and after.
  Contradiction audit: sample 200 clusters and count merges of contradictory predicates (negation markers),
  as a check that embedding clustering does not merge "crashed" with "crashed after the patch".


  This is the first step of #142 and the reframe recorded in the KB (corroboration-ranked, dated, source-linked
  index; prose only for corroborated clusters).


  🤖 Generated with [Claude Code](https://claude.com/claude-code)


  https://claude.ai/code/session_018FFkm1LHqCXapmvM9uBMXc'
