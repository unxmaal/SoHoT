id: infovore-348-symptom
modality: repo
prompt: '# wiki write --resume skips sections from earlier runs, so the resumed run lacks them and build
  --article-run shows claim lists


  Seen on the first full write (SoHoT job 0078, article run 8, 2026-10-11): 6,569 sections written, none
  failed, yet \`wiki build --article-run 8\` renders every part-1 section of IRIX, Indigo2, Indy, O2 and
  Octane as a claim list. Those 146 sections were written in the 5-topic trial (run 7). \`written_sections\`
  in \`infovore/db/wiki_articles.py\` joins every run with the same model id, prompt hash and tag run,
  so \`--resume\` skipped them, while \`create_article_run\` still opened a new run. A logical write is
  therefore spread over several run ids, and the build reads one.


  Run 8 has Octane sections \`General#2\`..\`General#37\` and \`With O2#2\`..\`#7\` but no \`General\`,
  \`With O2\`, \`With IRIX\`, ... (run 7 keys: 146, in run 8: 0).


  Then a resume job (~146 sections, about 7 minutes on Ornith-35B) fills run 8, queued on SoHoT behind
  the running code adopt job.


  The hidden tests call these names from the repository (signatures as a correct fix defines them):

  - `infovore.db.wiki_articles.latest_article_run(conn: sqlite3.Connection, model_id: str, prompt_hash:
  str, tag_run_id: int) -> int | None`

  - `infovore.db.wiki_articles.run_sections(conn: sqlite3.Connection, article_run_id: int) -> set[tuple[str,
  str]]`'
